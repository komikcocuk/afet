ölgede beklenen ivme 0,30 g'den küçüktür"}, {"t": "Türkiye'yi beş bölgeye ayırır; 2. derece bölgede beklenen ivme 0,40 g'den büyüktür"}, {"t": "Her koordinat için ayrı bir en büyük yer ivmesi değeri verir"}, {"t": "Türkiye'yi beş bölgeye ayırır; 1. derece bölgede beklenen ivme 0,40 g'den büyüktür"}, {"t": "TBDY-2018'in dayandığı güncel haritadır ve hâlâ yürürlüktedir"}], "a": 3, "exp": "Eski harita (1996) Türkiye'yi **1'den 5'e beş deprem bölgesine** ayırır: **1. derece >0,40 g**, **2. derece 0,40–0,30 g**. Sınırlar il/ilçe sınırlarına yakın çizilmiş ve aynı bölgedeki her yer için **tek değer** verir. **2018'de yürürlükten kalkmıştır.**"}, {"q": "2018 Türkiye Deprem Tehlike Haritası ile ilgili aşağıdakilerden hangileri doğrudur?\nI. Bölge kavramını tamamen kaldırmış, her nokta (adres/koordinat) için ayrı değer verir.\nII. En büyük yer ivmesi (PGA) değerleriyle çalışır ve TBDY-2018 bu haritaya dayanır.\nIII. Yalnızca il ve ilçe sınırları için ortalama ivme değeri verir.", "opts": [{"t": "Yalnız I"}, {"t": "Yalnız II"}, {"t": "I ve II"}, {"t": "I ve III"}, {"t": "II ve III"}], "a": 2, "exp": "**Türkiye Deprem Tehlike Haritası (2018, tdth.afad.gov.tr)** bölge kavramını kaldırmış, **noktasal** ivme değeri verir; **PGA** ile çalışır; **TBDY-2018** bu haritaya dayanır; herkes kendi adresini çevrim içi sorgulayabilir. İl/ilçe sınırlarına göre değer vermek **eski** haritanın özelliğidir (III yanlış). Eski harita, bir yolun iki yakasının farklı bölgede kalması gibi yapay keskin sınırlar yaratıyordu.\n💡 Artık \"kaçıncı derece bölgedeyim?\" değil, \"adresimin ivme değeri kaç?\" diye sorulur."}, {"q": "Tehlike haritasında bir adres için PGA değeri 0,40 g olarak verilmiştir. Bu değer neyi ifade eder?", "opts": [{"t": "Binanın depremde %40 olasılıkla yıkılacağını"}, {"t": "Bölgede önümüzdeki 40 yıl içinde deprem beklendiğini"}, {"t": "Bina altındaki zeminin %40'ının sıvılaşabileceğini"}, {"t": "Binaya ağırlığının ~%40'ı kadar yatay kuvvet etkiyebileceğini"}, {"t": "Beklenen depremin büyüklüğünün 4,0 olacağını"}], "a": 3, "exp": "**PGA (Peak Ground Acceleration, En Büyük Yer İvmesi)**, bir yerde depremde beklenen en yüksek zemin ivmesidir ve **yerçekimi ivmesinin katı (g)** olarak verilir. **0,40 g**, binaya ağırlığının yaklaşık **%40'ı kadar yatay kuvvet** demektir. Binalar dikey yük için tasarlanır; yatay kuvvet onlara yabancıdır."}, {"q": "Sınıf içi etkinlikte tdth.afad.gov.tr'den kendi adresini sorgulayan bir öğrencinin değeri yüksek çıkmıştır. Kaynağa göre en doğru tutum hangisidir?", "opts": [{"t": "Yüksek değer riski kesinleştirdiği için derhal taşınmak"}, {"t": "Değerin tehlikeyi gösterdiğini bilip binanın yapım yılını ve yapı denetim durumunu öğrenmek"}, {"t": "Evinin altından fay geçmiyorsa değeri önemsememek"}, {"t": "Değer eski beş bölgeli haritayla çelişiyorsa yeni haritayı dikkate almamak"}, {"t": "Binayı değil, en yakın diri fayın uzaklığını ölçtürmek"}], "a": 1, "exp": "Doğru cevap \"taşınmalı\" değildir: **yüksek ivme değeri tehlikeyi gösterir, riski değil**. Riski belirleyen, binanın **o ivmeye göre tasarlanıp tasarlanmadığıdır**. Atılacak adım binanın **yapım yılını ve yapı denetim durumunu** öğrenmektir. Etkinlikte ayrıca aynı ilde farklı değerler çıkabileceği ve eski beş bölgeli haritanın bu farkı gösteremeyeceği tartışılır."}, {"q": "İkincil afet ve depremin geçici–kalıcı etkileri ile ilgili hangisi yanlıştır?", "opts": [{"t": "Sıvılaşma ve yamaç kayması, sarsıntı bitince ortadan kalkan geçici etkilerdir"}, {"t": "İkincil afet, bir afetin etkisi veya tetiklemesiyle meydana gelen yeni afettir"}, {"t": "Yer sarsıntısı onlarca saniyeden birkaç dakikaya süren geçici bir etkidir"}, {"t": "Salgın hastalık ve endüstriyel kaza da ikincil afet sayılır"}, {"t": "Bazı afetlerde asıl can kaybı ikincil afetten gelir"}], "a": 0, "exp": "**Sarsıntı geçicidir** (onlarca saniye–birkaç dakika); **sıvılaşma, yamaç kayması ve kaya düşmesi** ise **kalıcı zemin deformasyonlarıdır** — sarsıntı bittikten sonra da orada durur. Bu, iyileştirme evresinin neden yıllar sürdüğünü açıklar. **İkincil afet**: yangın, heyelan, baraj yıkılması, patlama, salgın hastalık, endüstriyel kaza gibi bir afetin tetiklediği yeni afetler.\n💡 Örnek: 2011 Japonya'da can kaybının ezici çoğunluğu tsunamiden; 1995 Kobe'de önemli kısmı yangınlardan."}, {"q": "Deprem sonrası bir enkaz alanına ulaşan AYAY ekibinin olay yeri değerlendirmesiyle ilgili kaynakta vurgulanan yaklaşım hangisidir?", "opts": [{"t": "Yalnızca birincil olay (yıkılan bina) değerlendirilir; diğer riskler itfaiyenin işidir"}, {"t": "İkincil riskler ancak hasta enkazdan çıkarıldıktan sonra değerlendirilir"}, {"t": "Gaz sızıntısı, elektrik hattı, yakın yamaç ve akaryakıt deposu gibi ikincil riskler de ekip güvenliği için değerlendirilir"}, {"t": "Sarsıntı bittiği için alanda kalıcı bir tehlike kalmadığı kabul edilir"}, {"t": "İkincil afet riski yalnızca kıyı yerleşimlerinde (tsunami) değerlendirilir"}], "a": 2, "exp": "Olay yerine giden ekip yalnızca birincil olayı değil, **ikincil riskleri** de değerlendirmek zorundadır: enkaz alanındaki **gaz sızıntısı, elektrik hattı, yakındaki yamaç, akaryakıt deposu** — bunların hepsi **ekip güvenliğini** ilgilendirir. Sarsıntı geçicidir ama zemin deformasyonu (sıvılaşma, yamaç kayması) kalıcıdır; bu değerlendirme Hafta 11'de sistemli biçimde öğrenilecektir."}, {"q": "1999 Marmara depreminde gözlenen ikincil afetlerle yerleri eşleştirildiğinde hangisi doğrudur?", "opts": [{"t": "Düzce Kaynaşlı – nükleer sızıntı; Adapazarı – liman yangını"}, {"t": "Düzce Kaynaşlı – yaygın sıvılaşma; Adapazarı – heyelan ve kaya düşmesi"}, {"t": "Adapazarı – yanal yayılma; Sapanca – kimyasal yangın"}, {"t": "Adapazarı – tsunami; Gölcük – baraj yıkılması"}, {"t": "Düzce Kaynaşlı – heyelan ve kaya düşmesi; Adapazarı – yaygın sıvılaşma"}], "a": 4, "exp": "1999 Marmara depreminde **Düzce Kaynaşlı'da heyelan ve kaya düşmeleri**, **Adapazarı'nda yaygın sıvılaşma** gözlendi. Adapazarı'nın alüvyal zemini hem sarsıntıyı büyüttü hem sıvılaşmaya yol açtı; binalar **yıkılmadan yan yattı**."}, {"q": "Kütle hareketleri (heyelan, kaya düşmesi, yanal yayılma) için AYAY açısından vurgulanan en pratik sonuç hangisidir?", "opts": [{"t": "Kronik hastaların tedavi merkezlerine ulaşamaması"}, {"t": "Kimyasal madde içeren konteynerlerin tutuşması"}, {"t": "Yolları kapatıp ulaşımı ve müdahaleyi engellemesi"}, {"t": "Kıyıda uzun dalga boylu dalgalar oluşturması"}, {"t": "Taşıma gücünü kaybeden zeminde binaların yıkılmadan yan yatması"}], "a": 2, "exp": "Kütle hareketlerinde yamaçlar kayar, kayalar düşer, az eğimli alanlarda **yanal yayılma** olur. **Yollar kapanır**, ulaşım kesilir — müdahalenin en büyük engellerinden biridir. Yol kapalıysa ambulans, iş makinesi ve yardım malzemesi gidemez; bu yüzden **hava köprüsü ve alternatif güzergâh** planlaması kritiktir (2023'te bazı ilçelere ilk saatlerde kara yoluyla ulaşılamadı). Bina yan yatması **sıvılaşmanın** sonucudur."}, {"q": "Kaynakta salgın hastalığın depremin ikincil afeti sayılmasının mekanizması olarak aşağıdakilerden hangisi sayılmamıştır?", "opts": [{"t": "Hijyen imkânlarının yetersizliği"}, {"t": "Su ve kanalizasyon altyapısının kırılması"}, {"t": "Kalabalık ve geçici barınma alanlarının oluşması"}, {"t": "Bağışıklama zincirinin kesintiye uğraması"}, {"t": "Deprem dalgalarının mikroorganizmaları yüzeye taşıması"}], "a": 4, "exp": "Salgın hastalık ikincil afet sayılır; mekanizma: **su ve kanalizasyon altyapısının kırılması, kalabalık geçici barınma alanları, hijyen yetersizliği ve bağışıklama zincirinin kesilmesi**. Deprem dalgalarının mikroorganizma taşıması kaynakta yoktur ve bilimsel değildir."}, {"q": "Zemin sıvılaşmasının oluşum basamakları doğru sırayla hangisidir?", "opts": [{"t": "Taşıma gücü kaybı → sarsıntı → tanelerin birbirine değmesi → yapının çökmesi"}, {"t": "Taneler yükü taşır → boşluk suyu basıncı artar → taşıma gücü kaybolur → yapı yan yatar"}, {"t": "Sarsıntı → kum tanelerinin erimesi → zeminin buharlaşması → binanın yan yatması"}, {"t": "Boşluk suyu basıncının azalması → tanelerin sıkışması → zeminin sertleşmesi → yapının yıkılması"}, {"t": "Kuru killi zeminin çatlaması → su girişi → yamaç kayması → kaya düşmesi"}], "a": 1, "exp": "Sıvılaşma **sığ ve suya doygun kumlu zeminlerde** olur: (1) kum taneleri birbirine değerek yükü taşır, boşluklar suyla doludur; (2) sarsıntı tane temasını zayıflatır, **boşluk suyu basıncı yükselir**; (3) zemin **taşıma gücünü kaybeder**; (4) yapılar **yıkılmadan yan yatar** veya devrilir (Adapazarı 1999).\n💡 Islak kumsalda ayağınızı hızlıca oynatınca kumun sulanıp ayağın gömülmesi küçük ölçekli sıvılaşmadır."}, {"q": "Sıvılaşmaya karşı alınacak önlemler arasında kaynakta sayılan hangisidir?", "opts": [{"t": "Sıvılaşma ve mikrobölgeleme haritaları, gerekirse zemin iyileştirme"}, {"t": "Kıyıda dikey tahliye noktaları oluşturmak"}, {"t": "Riskli alanlarda deprem çantasını 3 güne indirmek"}, {"t": "Binaları yalnızca daha fazla kat ekleyerek ağırlaştırmak"}, {"t": "Yapıları graben ovalarındaki alüvyal zeminlere taşımak"}], "a": 0, "exp": "Önlem: **potansiyel sıvılaşma haritaları** ve **mikrobölgeleme haritaları** hazırlanır, gerekirse **zemin iyileştirme**ye başvurulur, riskli alanlarda yapı tasarımı buna göre yapılır. **Mikrobölgeleme**, zemin özelliklerini mahalle ölçeğinde haritalar; imar planlarının bilimsel dayanağıdır. Ders: binayı sağlamlaştırmak tek başına yetmez, zemin de değerlendirilmelidir. Dikey tahliye tsunami önlemidir."}, {"q": "Yer hareketi ve tsunaminin ölümcüllüğü karşılaştırıldığında kaynakta verilen oran hangisidir?", "opts": [{"t": "Yer hareketinde 1000 kişiden 79'u, tsunamide 1000 kişiden 4'ü ölür (~20 kat)"}, {"t": "Yer hareketinde 1000 kişiden 9'u, tsunamide 1000 kişiden 17'si ölür (~2 kat)"}, {"t": "İkisinde de 1000 kişiden yaklaşık 20'si ölür"}, {"t": "Yer hareketinde 1000 kişiden 4'ü, tsunamide 1000 kişiden 79'u ölür (~20 kat)"}, {"t": "Yer hareketinde 100 kişiden 4'ü, tsunamide 100 kişiden 40'ı ölür (~10 kat)"}], "a": 3, "exp": "Yer hareketinden etkilenen her **1000 kişiden 4'ü**, tsunamiden etkilenen her **1000 kişiden ortalama 79'u** hayatını kaybeder — yaklaşık **20 kat**. Neden: tsunami **boğulma** üreten bir afettir ve kurtarılabilir hasta oranı çok düşüktür. Depremde yaralı sayısı ölüden fazladır; **tsunamide oran tersine döner**.\n💡 4'e karşı 79: tsunami yaklaşık 20 kat daha öldürücüdür."}, {"q": "Marmara Denizi'ndeki tsunami riskiyle ilgili kaynaktaki değerlendirme hangisidir?", "opts": [{"t": "Marmara'daki fay bir yitim zonu olduğundan M 9 depremle büyük tsunami beklenir"}, {"t": "Marmara'da yalnızca volkanik kaynaklı tsunami oluşabilir"}, {"t": "Marmara kapalı bir deniz olduğu için tsunami riski yoktur"}, {"t": "Yanal atımlı fay doğrudan tsunami üretmeyebilir; deniz altı heyelanları önemli kaynaktır"}, {"t": "Fay normal fay olduğundan her depremde mutlaka tsunami oluşur"}], "a": 3, "exp": "Akdeniz, Karadeniz ve Marmara'da çok sayıda tsunami kaydedilmiştir. Marmara'da fay **yanal (doğrultu) atımlı** olduğu için **doğrudan tsunami üretmeyebilir**; ancak tetiklenen **deniz altı heyelanları** önemli bir tsunami kaynağıdır. Tarihte 1509 İstanbul (\"Küçük Kıyamet\") ve 1999'da İzmit Körfezi'nde küçük tsunami dalgaları gözlenmiştir; Türkiye'de tsunami erken uyarı sistemi **Kandilli Rasathanesi** bünyesindedir."}, {"q": "Kıyıda deprem hissedilmiş ve tsunami uyarısı yapılmıştır. Kaynağa göre doğru davranış hangisidir?", "opts": [{"t": "Karadakiler binaların bodrum katlarına sığınmalıdır"}, {"t": "Herkes kıyıya inerek denizin çekilip çekilmediğini gözlemelidir"}, {"t": "Karadakiler yükseğe çıkmalı, teknedekiler açık denize gitmelidir"}, {"t": "Dalga 1 metreden alçaksa kıyıda beklemekte sakınca yoktur"}, {"t": "Teknedekiler hızla limana dönüp karaya çıkmalıdır"}], "a": 2, "exp": "Karadakiler **denizden hızla uzaklaşıp yüksek yerlere** çıkmalı; denizde teknede olanlar **kıyıdan uzaklaşıp açık denize** gitmelidir. **1 metre** derinlikteki su bir insanı öldürebilir: tsunami dalgası arkasında kilometrelerce su kütlesi taşır ve sürekli iter; dalganın yüksek olması gerekmez.\n💡 Tsunami **uzun dönemli, uzun dalga boylu** okyanus dalgasıdır; çoğunlukla deniz altı depremleri, ayrıca deniz altı heyelanları, volkanlar ve uzay cisimlerinin çarpmasıyla oluşur."}, {"q": "Kaynakta tsunami ile ilgili verilen sayısal bilgilerden hangisi doğrudur?", "opts": [{"t": "Tsunamiden etkilenen her 1000 kişiden ortalama 4'ü ölür"}, {"t": "1896 Japonya Meiji tsunamisinde yaklaşık 750.000 kişi ölmüştür"}, {"t": "2004 Sumatra tsunamisi yalnızca Endonezya'da can kaybına yol açmıştır"}, {"t": "Bir tsunaminin öldürücü olması için dalganın en az 10 metre olması gerekir"}, {"t": "20 yıllık bir dönemde deprem ve tsunami nedeniyle yaklaşık 750.000 kişi ölmüştür"}], "a": 4, "exp": "Dünyada **20 yıllık** bir dönemde deprem ve tsunami nedeniyle yaklaşık **750.000** kişi hayatını kaybetmiştir. Büyük örnekler: **1896 Japonya Meiji (21.000 ölü)**, 2004 Sumatra (on bir ülkede kayıp), 2011 Sendai. Tsunamide 1000 kişiden ortalama **79**'u ölür; 1 metre su öldürebilir."}, {"q": "6 Şubat 2023 depremlerinde İskenderun Limanı'nda devrilen konteynerlerde çıkan ve günlerce süren yangın hangi kavramın Türkiye'deki en güncel örneğidir?", "opts": [{"t": "Yanal yayılma"}, {"t": "NaTech"}, {"t": "Zemin büyütmesi"}, {"t": "Sıvılaşma"}, {"t": "Tetiklenmiş deprem"}], "a": 1, "exp": "**NaTech (Natural Hazard Triggered Technological Accident)**: doğa olayının tetiklediği teknolojik kaza. Deprem kritik tesisleri vurduğunda doğa kaynaklı olay **teknolojik afete** dönüşür. İskenderun'da kimyasal içerik belirsizliği ve genel yıkım söndürmeyi güçleştirdi; aynı anda arama-kurtarma ve kimyasal yangın yönetimi gerekti. Kavram ders kitabında geçmez; Hafta 11'de (teknolojik afetler ve KBRN) işlenecektir."}, {"q": "Depremlerle ilişkili teknolojik/ikincil afet örnekleri eşleştirildiğinde hangisi yanlıştır?", "opts": [{"t": "Kobe 1995 – baraj yıkılmaları ve büyük heyelanlar"}, {"t": "İskenderun 2023 – limanda devrilen konteynerlerde günlerce süren yangın"}, {"t": "Çin 2008 (M 8,0) – baraj yıkılmaları ve büyük heyelanlar"}, {"t": "Kobe 1995 – su hatları kırıldığı için söndürülemeyen ahşap konut yangınları"}, {"t": "Sendai 2011 – Fukushima nükleer santralinde sızıntı ve bölgenin kalıcı boşaltılması"}], "a": 0, "exp": "Baraj yıkılmaları ve büyük heyelanlar **Çin 2008 (M 8,0)** depremine aittir. **Kobe 1995**'te çoğunluğu ahşap konutlarda çıkan **yangınlar**, su hatları da kırıldığı için söndürülemedi. **Sendai 2011**: tsunami → **Fukushima** nükleer sızıntı → bölge kalıcı boşaltıldı."}, {"q": "Deprem sonrası bir sanayi tesisinde çıkan kimyasal yangına yakın bölgede çalışan sağlık ekibinin, enkaz travmasına ek olarak karşılaşmaya hazır olması gereken tablo hangisidir?", "opts": [{"t": "Duman inhalasyonu, karbonmonoksit ve siyanür zehirlenmesi"}, {"t": "Crush sendromuna bağlı hiperkalemi ve ritim bozukluğu"}, {"t": "Tsunami dalgası sonrası boğulma ve hipotermi"}, {"t": "Diyaliz kesintisine bağlı üremi ve sıvı yüklenmesi"}, {"t": "Sıvılaşma bölgesinde kanalizasyon kaynaklı ishal"}], "a": 0, "exp": "NaTech yangınlarında **duman inhalasyonu, karbonmonoksit ve siyanür zehirlenmesi** riski vardır; sağlık ekibi enkaz travmasına hazırlanırken aynı anda **inhalasyon yaralanmasıyla** da karşılaşır. Planlama sorusu: bir şehirde hastane ile sanayi bölgesi arasındaki mesafe bu yüzden önemlidir."}, {"q": "Depremin sağlık sonuçlarının sınıflandırılmasında, kronik hastalık tedavisinin (diyaliz, insülin, tansiyon, onkoloji) kesintiye uğraması hangi başlıkta yer alır?", "opts": [{"t": "İkincil afet – NaTech"}, {"t": "Dolaylı – süreklilik kaybı"}, {"t": "Doğrudan – travma"}, {"t": "Dolaylı – çevre ve ruh sağlığı"}, {"t": "Doğrudan – crush sendromu"}], "a": 1, "exp": "Dört başlık: **Doğrudan–travma** (ilk saatler/günler; künt travma, kırıklar, kafa-omurga-göğüs travması, ezilme, yanık, kanama, enkazda hipotermi ve susuzluk), **Doğrudan–crush sendromu** (depremin imza tablosu), **Dolaylı–süreklilik kaybı** (haftalardan aylara; kronik tedavi kesintisi, gebe-bebek hizmetlerinin durması, aşılama zincirinin kopması), **Dolaylı–çevre ve ruh sağlığı** (su-sanitasyona bağlı bulaşıcı hastalık, beslenme sorunları, akut stres, TSSB)."}, {"q": "Depremin sağlık yükünün zaman içindeki seyri kaynakta nasıl özetlenmiştir?", "opts": [{"t": "Sağlık yükü yalnızca ilk 72 saattir; sonrasında afet sağlık hizmeti gerekmez"}, {"t": "İlk haftalarda crush; ilk 72 saatte kronik tedavi kesintisi; aylarda travma"}, {"t": "İlk 72 saatte bulaşıcı hastalık; sonraki haftalarda crush; aylarda diyaliz ihtiyacı"}, {"t": "İlk 72 saat travma; sonraki haftalar süreklilik kaybı ve çevre sağlığı; aylar ruh sağlığı"}, {"t": "İlk 72 saatte ruh sağlığı; sonraki haftalarda travma; aylarda bulaşıcı hastalık"}], "a": 3, "exp": "Seyir: **ilk 72 saat travma (ve crush)** → **sonraki haftalar süreklilik kaybı ve çevre sağlığı** → **aylar ruh sağlığı**. Bu sıra afet sağlık hizmetlerinin **planlama takvimidir**. Haftanın ana fikri: **\"Enkazdan çıkma, kurtulmak demek değildir\"**; sağlık planlaması sürecin tamamına göre yapılır.\n💡 'Afet = ilk 72 saat' yanılgısına düşmeyin."}, {"q": "Kaynakta afetin en kritik dar boğazlarından biri olarak gösterilen ve hem kronik böbrek hastalarının hem de crush nedeniyle akut böbrek hasarı gelişen yeni hastaların aynı anda talep ettiği kapasite hangisidir?", "opts": [{"t": "Yoğun bakım ventilatör kapasitesi"}, {"t": "Kan bankası stokları"}, {"t": "Diyaliz kapasitesi"}, {"t": "Aşı soğuk zinciri"}, {"t": "Ruh sağlığı danışmanlığı"}], "a": 2, "exp": "Bir diyaliz hastası haftada üç kez tedavi almak zorundadır; afette merkez yıkılır, su ve elektrik kesilir, ulaşım imkânsızlaşır. Aynı anda **crush** nedeniyle akut böbrek hasarı gelişen yeni hastalar da diyaliz ister: **diyaliz kapasitesi** afetin en kritik dar boğazlarından biridir. 2023'te bölgedeki diyaliz hastalarının başka illere nakli büyük bir lojistik operasyon oldu."}, {"q": "Crush (ezilme) sendromunun bileşenleri hangi seçenekte doğru verilmiştir?", "opts": [{"t": "Hemoliz + hiperkalsemi + akut böbrek hasarı"}, {"t": "Hipotermi + hipokalemi + karaciğer yetmezliği"}, {"t": "Rabdomiyoliz + hipokalemi + solunum yetmezliği"}, {"t": "Hiperglisemi + hiponatremi + kalp yetmezliği"}, {"t": "Rabdomiyoliz + hiperkalemi + akut böbrek hasarı"}], "a": 4, "exp": "**Crush sendromu**: uzun süre ağır yük altında kalan kasın bozulması (**rabdomiyoliz**) ve hücre içeriğinin kana karışmasıyla gelişen, **akut böbrek hasarı** ve **ölümcül ritim bozukluğuna (hiperkalemi)** ilerleyebilen tablo. Depremin **imza tablosu**dur; enkaz altında kalma süresi uzadıkça risk artar.\n💡 Kodlama: **R-H-A** = Rabdomiyoliz, Hiperkalemi, Akut böbrek hasarı."}, {"q": "Crush sendromunda ezilen kas hücrelerinden kana karışan maddeler ve bunların etkileri için hangisi doğrudur?", "opts": [{"t": "Fosfat kalp ritmini bozar; kalsiyum böbrek tübüllerini tıkar"}, {"t": "Miyoglobin kanda potasyumu düşürür; hipokalemi ritim bozukluğu yapar"}, {"t": "Potasyum böbrek tübüllerini tıkar; miyoglobin kalp ritmini bozar"}, {"t": "Glukoz böbrek tübüllerini tıkar; sodyum kalp ritmini bozar"}, {"t": "Miyoglobin böbrek tübüllerini tıkar; potasyum yüksekliği kalp ritmini bozar"}], "a": 4, "exp": "Ezilen kastan **miyoglobin, potasyum ve fosfat** kana karışır. **Miyoglobin** (kasta oksijen taşıyan protein) böbrek tübüllerini tıkar → **akut böbrek hasarı**, bazı hastalarda diyaliz gerekir. **Hiperkalemi** kalp ritmini bozar ve hızla ölümcül olabilir — tablonun **en acil bileşeni**dir."}, {"q": "Crush sendromunun hangi bileşeni kaynakta 'tablonun en acil bileşeni' olarak nitelendirilmiştir?", "opts": [{"t": "Hiperkaleminin yol açtığı kalp ritim bozukluğu"}, {"t": "Fosfat yüksekliği"}, {"t": "Enkaz altındaki susuzluk"}, {"t": "Miyoglobinin yol açtığı akut böbrek hasarı"}, {"t": "Ekstremite kırıkları"}], "a": 0, "exp": "Yüksek potasyum (**hiperkalemi**) kalp ritmini bozar ve **hızla ölümcül** olabilir; bu yüzden tablonun **en acil** bileşenidir. Akut böbrek hasarı da ciddidir ama saatler–günler içinde gelişir ve diyalizle yönetilebilir."}, {"q": "Crush sendromu yönetiminde Türkiye'nin dünya literatürüne katkısı olarak kaynakta hangisi anılmıştır?", "opts": [{"t": "2023 depremlerinde UMKE'nin geliştirdiği enkaz altı diyaliz cihazı"}, {"t": "1999 Marmara depremi sonrası Türk Nefroloji Derneği'nin yürüttüğü kapsamlı çalışma"}, {"t": "AFAD'ın 140 sayfalık raporundaki sıvı tedavisi protokolü"}, {"t": "1939 Erzincan depreminde ilk kez tanımlanan rabdomiyoliz"}, {"t": "MTA'nın diri fay haritasıyla crush riskinin hesaplanması"}], "a": 1, "exp": "**1999 Marmara** depremi sonrası **Türk Nefroloji Derneği**'nin yürüttüğü kapsamlı çalışma, crush sendromu yönetiminde dünya literatürünün temel referanslarından biri hâline gelmiştir; bu alanda Türkiye bilgi üreten taraftır."}, {"q": "30 saat sonra enkazdan bilinci açık ve konuşarak çıkarılan bir depremzede birkaç dakika içinde ani kardiyak arrest geçiriyor. Bu tablonun adı ve mekanizması hangisidir?", "opts": [{"t": "Tetiklenmiş ölüm; artçı depremin yarattığı panik"}, {"t": "Kurtarma ölümü; enkazdan çıkarken soğuğa maruz kalınca gelişen ani hipotermi"}, {"t": "Kurtarma ölümü; baskı kalkınca potasyum ve miyoglobinin aniden dolaşıma geçmesi"}, {"t": "Sıvılaşma; enkaz altında biriken zemin suyunun akciğerlere dolması"}, {"t": "Kompartman sendromu; baskı devam ettiği için kasın kanlanmaması"}], "a": 2, "exp": "Enkaz altındayken baskı kas içeriğinin dolaşıma geçişini **büyük ölçüde engeller**. **Baskı kalktığı anda** bölge yeniden kanlanır ve biriken **potasyum ve miyoglobin aniden dolaşıma** karışır → hiperkalemiye bağlı ritim bozukluğu ve dolaşım çöküşü: **kurtarma ölümü**. Enkazdan konuşarak çıkan hasta \"iyi\" demek değildir; asıl risk baskı kalktıktan sonra başlar.\n💡 Konuşarak çıkmak, kurtulmuş olmak demek değildir."}, {"q": "Uzun süredir enkaz altında olduğu belirlenen bir yaralı için arama-kurtarma ekibiyle birlikte çalışan bir AYAY ekibinin kaynağa göre doğru yaklaşımı hangisidir?", "opts": [{"t": "Hasta konuşuyor ve iyi görünüyorsa izlemeden aileye teslim etmek"}, {"t": "Önce baskıyı hızla kaldırıp, sıvı tedavisini hastaneye ulaşınca başlatmak"}, {"t": "Hasta çıkarılana kadar enkazın dışında bekleyip ardından teslim almak"}, {"t": "Mümkünse çıkarmadan önce damar yolu açıp sıvı başlamak, sonra yakından izlemek"}, {"t": "Hiperkalemi riskini azaltmak için hastaya potasyumlu sıvı başlamak"}], "a": 3, "exp": "Kaynağa göre **mümkünse hasta enkazdan çıkarılmadan ÖNCE damar yolu açılıp sıvı tedavisine** başlanır; çıkarma ve sonrası **yakın izlem** gerektirir; hasta \"iyi görünüyor\" diye bırakılmaz. Sağlık ekibi enkaz dışında bekleyip hastayı teslim almaz; hasta hâlâ enkazdayken tedaviye başlar — arama-kurtarma ile sağlık ekibinin koordinasyonu bu yüzden hayatidir. Protokol ayrıntıları üst sınıf derslerindedir."}, {"q": "Crush sendromu ve kurtarma ölümü mekanizmasının doğru sıralaması hangisidir?", "opts": [{"t": "Baskı → böbrek hasarı → kas ölümü → baskı kalkar → potasyum düşer"}, {"t": "Baskı → kas ölümü → baskı kalkar → potasyum ve miyoglobin dolaşıma karışır → ritim bozukluğu ve böbrek hasarı"}, {"t": "Baskı kalkar → baskı → kas ölümü → böbrek hasarı → miyoglobin dolaşıma karışır"}, {"t": "Baskı → potasyum ve miyoglobin dolaşıma karışır → kas ölümü → baskı kalkar → böbrek hasarı"}, {"t": "Kas ölümü → baskı → ritim bozukluğu → baskı kalkar → potasyum dolaşıma karışır"}], "a": 1, "exp": "Sıra: **baskı → kasın kanlanamaması ve ölümü (rabdomiyoliz) → baskı kalkar → potasyum ve miyoglobin dolaşıma karışır → hiperkalemiye bağlı ritim bozukluğu ve miyoglobine bağlı akut böbrek hasarı**. Sınavda \"baskı kalktığı anda\" ifadesi aranır; yalnızca \"kas ezilmesi\" demek yeterli değildir."}, {"q": "Deprem ÖNCESİ yapılacaklar arasında kaynakta sayılan aile planı unsurları hangisidir?", "opts": [{"t": "Deprem anında kullanılacak merdiven ve asansör sırasını belirlemek"}, {"t": "Ağır eşyaları üst raflara yerleştirip sabitlemek"}, {"t": "Yalnızca aynı mahalleden bir irtibat kişisi belirlemek"}, {"t": "Aile buluşma yeri, bölge dışından irtibat kişisi, her odada güvenli yer"}, {"t": "Her odada üçgen yaşam alanı oluşturacak eşyaları belirlemek"}], "a": 3, "exp": "**ÖNCE**: PLANLA (aile buluşma yeri, **bölge dışından irtibat kişisi**, her odada güvenli yer), YAP (eşyaları sabitle, **ağır eşyaları alt raflara** koy), TOPLA (en az **10 günlük** deprem çantası), KONTROL ET (elektrik, gaz, su vanaları). Bölge dışı irtibat kişisi önemlidir: yerel hatlar tıkanırken uzak bir ile ulaşmak daha kolaydır; deprem sonrası iletişim çalışmayabileceği için buluşma noktası da gerekir."}, {"q": "Deprem SIRASINDA uygulanan davranışlarla ilgili aşağıdakilerden hangileri kaynağa göre yanlıştır?\nI. Sarsıntı başlar başlamaz merdivene veya asansöre koşmak\nII. Sosyal medyada önerilen 'üçgen alan'a sığınmak\nIII. Yataktaysa yatağın yanına uzanıp başını yastıkla korumak", "opts": [{"t": "Yalnız I"}, {"t": "Yalnız III"}, {"t": "I ve II"}, {"t": "I ve III"}, {"t": "II ve III"}], "a": 2, "exp": "Yaygın üç hata: (1) **merdiven ve asansöre koşmak** — merdiven boşluğu binanın en zayıf noktalarındandır, asansör elektrik kesilince durur; (2) **sarsıntı sırasında dışarı çıkmaya çalışmak** — yaralanmalar çoğunlukla kaçarken düşen cisimlerden olur; (3) **'üçgen alan' inancı** — uluslararası kabul görmez, resmî öneri **ÇÖK-KAPAN-TUTUN**'dur. **Yataktaysan yatağın yanına uzan, başını yastıkla koru** doğru davranıştır (III doğru)."}, {"q": "ÇÖK-KAPAN-TUTUN ve deprem sırasındaki davranışlarla ilgili hangisi yanlıştır?", "opts": [{"t": "Sarsıntı sırasında zemin açılabileceği için hemen dışarı koşulmalıdır"}, {"t": "Pencere, avize ve mutfak dolabından uzak durulur"}, {"t": "Bulunulan zemine çökülür, kendini koruyacak şekilde kapanılır, sağlam bir masaya tutunulur"}, {"t": "Sarsıntı birkaç saniyeden birkaç dakikaya sürer; panik yapılmaz"}, {"t": "Sarsıntı süresince duruma göre yer değiştirilebilir"}], "a": 0, "exp": "Kaynağa göre **zemin açılmaz**; sarsıntı birkaç saniye–birkaç dakika sürer, **panik olunmaz**. İçerideysen **ÇÖK–KAPAN–TUTUN**, pencere/avize/mutfak dolabından uzak dur, güvenli olmadıkça dışarı çıkma. Deprem sırasında yaralanmalara en çok **düşen parçalar ve döküntüler** yol açar."}, {"q": "Deprem sırasında araç kullanmakta olan bir kişi için kaynağa göre doğru davranış hangisidir?", "opts": [{"t": "Sarsıntı bitene kadar yoluna devam edip hastaneye gitmek"}, {"t": "Hızlanarak en yakın köprünün altına sığınmak"}, {"t": "Aracı durdurup hemen dışarı çıkarak elektrik direğinin yanında beklemek"}, {"t": "Aracı yolun ortasında bırakıp en yakın binaya koşmak"}, {"t": "Güvenle durup köprü ve üst geçitten uzaklaşmak, sarsıntı bitene dek araçta kalmak"}], "a": 4, "exp": "Araçtaysan: **en kısa sürede güvenli şekilde dur, köprü ve üst geçitten uzaklaş, sarsıntı geçene kadar araçta kal**. Dışarıdaysan: elektrik direği, bina ve duvar kenarlarından uzaklaş, açık alana git. Ayrıca yollarda hasta ve yaralı nakli yapılacağı için **trafiği engellememek** gerekir — afetin ilk saatlerinde yol açıklığı, ambulans için yakıt kadar kritiktir."}, {"q": "Deprem SONRASINDA yapılacaklar arasında kaynakta sayılmayan hangisidir?", "opts": [{"t": "Hasarlı binaya girmemek"}, {"t": "Yetkili açıklamalarını izlemek"}, {"t": "Artçılarda yeniden ÇÖK-KAPAN-TUTUN yapmak"}, {"t": "Yakınlara ulaşmak için telefonla sürekli arama yapmak"}, {"t": "Dökülen ilaç ve zararlı sıvıları temizlemek"}], "a": 3, "exp": "**SONRASINDA**: HAZIRLIKLI OL (artçılarda yeniden ÇÖK-KAPAN-TUTUN, hasarlı binaya girme), BİLGİLEN (yetkili açıklamalarını izle, **zorunlu olmadıkça telefonu kullanma**), TEMİZLE (dökülen ilaç ve zararlı sıvıları kaldır). Gereksiz aramalar hatları tıkar."}, {"q": "Deprem çantasında düdük bulundurulmasının kaynakta vurgulanan gerekçesi hangisidir?", "opts": [{"t": "Yalnızca çocukların deprem sonrası paniğini azaltmak için önerilir"}, {"t": "Tsunami uyarısını komşulara iletmenin resmî yoludur"}, {"t": "Arama köpeklerini uzaklaştırarak enkaz altındaki kazazedeyi korur"}, {"t": "Artçı depremleri önceden çevredekilere haber vermek için kullanılır"}, {"t": "Bağırmaktan daha az enerjiyle daha uzağa ses ulaştırır ve uzun süre dayanır"}], "a": 4, "exp": "Düdük en hafife alınan ama **enkaz altında sesten çok daha uzun süre dayanan** araçtır: bağırmak birkaç saatte sesi tüketir ve enerji harcar; düdük **çok az enerjiyle çok daha uzağa** ulaşır. Arama ekipleri **sessizlik anlarında** tam olarak bu sesi dinler."}, {"q": "Kaynağa göre deprem çantası ile ilgili hangisi yanlıştır?", "opts": [{"t": "En az 10 gün yetecek şekilde hazırlanmalıdır"}, {"t": "Kimlik fotokopisi ve önemli belgelerin kopyaları bulunmalıdır"}, {"t": "Kart sistemleri çalışacağı için nakit paraya gerek yoktur"}, {"t": "Kolay ulaşılabilir ve çıkışa yakın bir yerde durmalıdır"}, {"t": "Düzenli kullanılan ilaçların en az 10 günlük stoğu bulunmalıdır"}], "a": 2, "exp": "Çanta **en az 10 gün** yetmeli, **kolay ulaşılabilir ve çıkışa yakın** durmalı. İçerik: **temel yaşam** (su, dayanıklı gıda, el feneri ve yedek pil, düdük), **sağlık** (ilk yardım malzemesi, 10 günlük ilaç, tanı-ilaç-alerji notu), **belge ve para** (kimlik fotokopisi, belge kopyaları, **nakit** — kart sistemleri ve iletişim çalışmayabilir), **diğer** (mevsime uygun giysi, battaniye, ıslak mendil, hijyen malzemesi, yedek şarj)."}, {"q": "Kaynakta deprem çantasının neden 3 değil en az 10 gün yetecek şekilde hazırlanması gerektiği nasıl açıklanır?", "opts": [{"t": "Tehlike haritası sorgusu 10 gün sonra açılır"}, {"t": "Büyük afette dış yardımın bölgeye tam kapasiteyle ulaşması günler alabilir"}, {"t": "Crush sendromu belirtileri ancak 10. günde ortaya çıkar"}, {"t": "Artçı depremler kesin olarak 10 gün sürer"}, {"t": "Deprem bölgesinde marketler yasal olarak 10 gün kapalı kalır"}], "a": 1, "exp": "Büyük bir afette **dış yardımın bölgeye tam kapasiteyle ulaşması günler alabilir**; 2023 depremlerinde bazı ilçelerde bu süre uzamıştır.\n💡 Kronik hastalar için **ilaç listesi ve tanı notu** hayati önemdedir: afette hasta kendi tıbbi geçmişini anlatamayabilir, kayıtlara ulaşılamayabilir."}, {"q": "Kaynakta 2018 baskılı ders kitabının güncelliğini yitirdiği noktalarla ilgili hangisi doğrudur?", "opts": [{"t": "Kitabın dayandığı 2007 yapı yönetmeliğinin yerini TBDY-2018 almıştır"}, {"t": "Kitaptaki 1996 beş bölgeli harita hâlâ yürürlüktedir"}, {"t": "Kitapta crush sendromu ayrıntılı işlenmiştir"}, {"t": "NaTech kavramı kitapta İskenderun örneğiyle anlatılmıştır"}, {"t": "Kitapta 6 Şubat 2023 depremleri yer almaktadır"}], "a": 0, "exp": "Kitap 2018 baskısıdır: **6 Şubat 2023** depremleri yoktur; **1996 beş bölgeli harita** yürürlükten kalkmış, yerini **Türkiye Deprem Tehlike Haritası (2018)** almıştır; **2007 yönetmeliğinin** yerini **TBDY-2018** almıştır; **crush sendromu ve afet sağlık hizmetleri** kitapta yoktur (Atatürk Üniversitesi kitabı Ünite 11 ve Sağlık Bakanlığı kaynaklarıyla tamamlanmıştır — **sınav kapsamındadır**); **NaTech** kavramı kitapta geçmez."}, {"q": "Türkiye'nin diri fay haritasını hazırlayan kurum ve bu haritaya erişilen adres hangisidir?", "opts": [{"t": "AFAD – deprem.afad.gov.tr"}, {"t": "Kandilli Rasathanesi – yerbilimleri.mta.gov.tr"}, {"t": "AFAD – tdth.afad.gov.tr"}, {"t": "USGS – earthquake.usgs.gov"}, {"t": "MTA – yerbilimleri.mta.gov.tr"}], "a": 4, "exp": "**MTA (Maden Tetkik ve Arama Genel Müdürlüğü)** Türkiye'nin **diri fay haritasını** hazırlamıştır (**yerbilimleri.mta.gov.tr**). **tdth.afad.gov.tr** AFAD'ın Türkiye Deprem Tehlike Haritası (adres bazlı PGA sorgulama), **deprem.afad.gov.tr** ise AFAD 2023 raporunun kaynağıdır.\n💡 Fay → MTA (maden/jeoloji); İvme → AFAD (TDTH)."}]}, {"title": "Deprem ve Binalar: Yapısal Hasar Nedenleri ve Dirençli Sağlık Tesisi", "desc": "Düşey/yatay yük, temel ve üst yapı elemanları, güçlü kolon–zayıf kiriş, planda ve düşey düzensizlikler, yapısal kusurlar, kullanıcı kaynaklı hasarlar, yapısal olmayan risk, HAP ve TBDY-2018", "short": "Deprem-Bina", "questions": [{"q": "Bir bina düşey yükü mükemmel taşıdığı hâlde depremde neden yıkılabilir?", "opts": [{"t": "Binalar öncelikle yatay yük için tasarlanır; deprem ise düşey kuvvet uygular"}, {"t": "Deprem yalnızca temeli etkiler, üst yapıya kuvvet aktarmaz"}, {"t": "Deprem sırasında binanın kendi ağırlığı birkaç kat artar"}, {"t": "Deprem yalnızca dolgu duvarları zorlar, taşıyıcılar etkilenmez"}, {"t": "Binalar öncelikle düşey yük için tasarlanır; deprem ise yatay kuvvet uygular"}], "a": 4, "exp": "Binalar kendi ağırlığı, insan, eşya ve kar gibi **düşey yükler** için hesaplanır. Deprem (ve rüzgâr) ise binaya **yatay yük** uygular; bu kuvvet kolonları **eğmeye, kesmeye ve burkulmaya** zorlar.\nYatay yüke göre tasarlanmamış bina, düşey yükü kusursuz taşısa bile depremde yıkılabilir. Deprem güvenliği = yatay yüke direnme kapasitesi."}, {"q": "Aşağıdakilerden hangisi yatay yük kaynaklarıdır?", "opts": [{"t": "Binanın kendi ağırlığı ve kar"}, {"t": "İnsanlar ve eşyalar"}, {"t": "Kar ve deprem"}, {"t": "Eşyalar ve rüzgâr"}, {"t": "Deprem ve rüzgâr"}], "a": 4, "exp": "Kaynakta **yatay yük**: deprem ve rüzgâr. **Düşey yük** ise binanın kendi ağırlığı, insanlar, eşyalar ve kardır; sürekli ve öngörülebilirdir, her bina bunun için hesaplanır.\nDeprem sırasında zemin yatay hareket eder, bina üstteki kütlesiyle birlikte sallanmaya zorlanır."}, {"q": "Depreme dayanıklı bir binanın sahip olması gereken üç özellikten \"şekil değiştirmeye direnç\" olarak tanımlanan hangisidir?", "opts": [{"t": "Dayanım"}, {"t": "Süneklik"}, {"t": "Rijitlik"}, {"t": "Aderans"}, {"t": "Eksantrisite"}], "a": 2, "exp": "Kaynaktaki üçlü: **Dayanım** = kuvvete direnç, **rijitlik** = şekil değiştirmeye direnç, **süneklik** = kırılmadan şekil değiştirebilme. Depreme dayanıklı bina üçüne birden sahiptir.\nAderans beton–donatı yapışması, eksantrisite ise kütle ve rijitlik merkezleri arasındaki kaçıklıktır.\n💡 D-R-S: Dayan, Rijit dur, Sünek eğil."}, {"q": "Süneklik için verilen \"bisküvi ve tel\" benzetmesinde tel neyi temsil eder?", "opts": [{"t": "Kopmadan önce eğilip bükülerek uyarı veren sünek davranışı"}, {"t": "Eğilmeden, uyarı vermeden aniden kırılan gevrek davranışı"}, {"t": "Beton ile donatı arasındaki yapışmayı"}, {"t": "Binanın kütle merkezini"}, {"t": "Deprem yükünü üzerine çeken perdeyi"}], "a": 0, "exp": "**Bisküvi** güçlüdür ama eğilmeden kırılır (**gevrek**). **Tel** daha zayıf olabilir ama eğilir, bükülür ve kopmadan önce uyarı verir (**sünek**).\nSünek bir kolon eğilir, çatlar ama birden kopmaz; bu da insanların binadan çıkması için zaman kazandırır. Depreme dayanıklı yapı gevrek değil sünek davranmalıdır."}, {"q": "'Pancake' tipi göçme (katların üst üste yığılması) için hangisi doğrudur?", "opts": [{"t": "Sünek davranışın sonucudur; bina çatlayarak yavaşça çöker"}, {"t": "Gevrek davranışın sonucudur ve enkaz altında yaşam boşluğu neredeyse bırakmaz"}, {"t": "Enkaz altında geniş yaşam boşlukları bıraktığı için kurtarma şansı yüksektir"}, {"t": "Yalnızca radye temelli binalarda görülür"}, {"t": "Güçlü kolon – zayıf kiriş ilkesine uyulan binalarda görülür"}], "a": 1, "exp": "Gevrek bina uyarı vermeden bir anda göçer; **pancake** tipi göçmeler bunun sonucudur ve enkaz altında **yaşam boşluğu bırakmaz**, yani arama-kurtarma şansını da düşürür.\nZayıf kolonlu (güçlü kiriş – zayıf kolon) binalar bu göçme biçimini üretir.\n💡 AYAY köprüsü: göçme tipi → yaşam boşluğu → kurtarma olasılığı."}, {"q": "Hangi temel türü, binanın oturduğu alanı boydan boya kaplayan betonarme bir plaktır ve zayıf zeminler için en uygun temel olarak verilir?", "opts": [{"t": "Tekil temel"}, {"t": "Sürekli temel"}, {"t": "Kazıklı temel"}, {"t": "Radye temel"}, {"t": "Bağ kirişli pabuç temel"}], "a": 3, "exp": "**Radye temel**: binanın oturduğu alanı boydan boya kaplayan betonarme plak; kirişli ve kirişsiz olarak ikiye ayrılır, güvenlik açısından **kirişli radye** daha uygundur. Zayıf zeminler için en uygundur.\nTekil temel sağlam zeminli az katlı binada, kazıklı temel ise çok zayıf zeminde (derin temel) kullanılır."}, {"q": "Zemin zayıfladıkça tercih edilen temel türlerinin doğru sıralaması hangisidir?", "opts": [{"t": "Kazıklı → radye → sürekli → tekil"}, {"t": "Tekil → radye → sürekli → kazıklı"}, {"t": "Tekil → sürekli → radye → kazıklı"}, {"t": "Sürekli → tekil → kazıklı → radye"}, {"t": "Radye → tekil → sürekli → kazıklı"}], "a": 2, "exp": "Mantık: zemin ne kadar zayıfsa yükü o kadar geniş bir alana yaymak gerekir. **Tekil** temel yükü noktalara, **sürekli** temel birden fazla taşıyıcıya, **radye** bütün yüzeye yayar; **kazıklı** temel ise sağlam zemine kadar iner.\n💡 \"Zemin zayıfladıkça temel büyür.\""}, {"q": "Temel türleriyle ilgili aşağıdakilerden hangisi yanlıştır?", "opts": [{"t": "Tekil temelde pabuçlar bağ kirişleriyle birbirine bağlanır"}, {"t": "Sürekli temelde farklı oturma riski tekil temele göre çok daha düşüktür"}, {"t": "Kazıklı temel derin bir temeldir ve maliyeti çok yüksektir"}, {"t": "Kirişsiz radye temel, güvenlik açısından kirişli radyeden daha uygundur"}, {"t": "Üst yapı ne olursa olsun temeller betonarme yapılır"}], "a": 3, "exp": "Kaynağa göre güvenlik açısından **kirişli radye** daha uygundur; seçenekteki ifade bunu tersine çevirmiştir.\nDiğerleri doğrudur: tekil pabuçlar **bağ kirişleriyle** bağlanır; **sürekli temel** ikiden fazla düşey taşıyıcının yükünü bütün olarak aktarır ve farklı oturma riski düşüktür; **kazıklı temel** derin temeldir, pahalıdır ve daha çok köprü-liman inşaatında kullanılır."}, {"q": "Pisa Kulesi'nin eğikliği hangi olayın en bilinen örneği olarak verilir?", "opts": [{"t": "Farklı oturma"}, {"t": "Sıvılaşma"}, {"t": "Burulma düzensizliği"}, {"t": "Yumuşak kat"}, {"t": "Kısa kolon"}], "a": 0, "exp": "**Farklı oturma**: binanın bir bölümünün diğerinden daha fazla zemine gömülmesidir; yapıda çatlaklara ve eğilmeye yol açar. Pisa Kulesi en bilinen örneğidir.\n💡 Pisa = farklı oturma: bina yıkılmadan da eğilerek hasar görebilir."}, {"q": "Tekil temeldeki pabuçları birbirine bağlayan bağ kirişlerinin temel işlevi nedir?", "opts": [{"t": "Döşemeleri taşıyıp yüklerini kolonlara aktarmak"}, {"t": "Binanın kütle merkezini aşağı çekmek"}, {"t": "Pabuçları bağlayıp temeli tek bir bütün hâline getirmek"}, {"t": "Komşu bina ile arada deprem derzi oluşturmak"}, {"t": "Donatıyı korozyondan koruyan pas payını sağlamak"}], "a": 2, "exp": "Tekil temelde her düşey taşıyıcının altına kesitinden büyük bir **pabuç** yapılır; pabuçlar deprem kuvvetini aktarmak için **bağ kirişleriyle** bağlanır.\nBağlanmazsa deprem sırasında her pabuç ayrı hareket eder; bağ kirişi temeli **tek bir bütün** hâline getirir. Tekil temel sağlam, oturma tehlikesi olmayan zeminlerde tercih edilir."}, {"q": "Sıvılaşma riski olan bir zeminde tekil temelle bina yapılması, kaynakta hangi görüntülerin \"reçetesi\" olarak anılır?", "opts": [{"t": "1999 Adapazarı'nda binaların yan yatması"}, {"t": "2004 Konya'da Zümrüt Apartmanı'nın çökmesi"}, {"t": "2011 Van'da perdeli binaların ayakta kalması"}, {"t": "2003 Bingöl'de kolonlarda X biçimli çatlaklar"}, {"t": "1998 Adana'da düşük kaliteli beton hasarı"}], "a": 0, "exp": "Ders notunda: sıvılaşma riski olan zeminde tekil temel, **Adapazarı 1999**'daki **yan yatma** görüntülerinin reçetesidir. Bu yüzden **zemin etüdü yasal zorunluluktur**.\nZümrüt Apartmanı köşe kolon, Van perde, Bingöl kısa kolon, Adana düşük beton kalitesi örneğidir."}, {"q": "\"Bir kenarı diğerinin en az yedi katı olan, minimum boyutu 25 cm × 175 cm\" olan düşey taşıyıcı hangisidir?", "opts": [{"t": "Perde"}, {"t": "Kolon"}, {"t": "Kiriş"}, {"t": "Döşeme"}, {"t": "Guse"}], "a": 0, "exp": "**Perde** özel bir kolon türüdür: bir kenarı diğerinin en az **7 katı**, minimum **25 × 175 cm**. Rijit olduğu için deprem yükünü üzerine çeker ve kolonları korur.\nKolon düşey taşıyıcıdır ama böyle bir en-boy oranı yoktur; kiriş ve döşeme yatay elemanlardır."}, {"q": "Ders kitabı minimum kolon boyutu konusunda ne önerir?", "opts": [{"t": "Yönetmelikteki 30/50 cm yerine 25/30 cm yeterlidir"}, {"t": "Kolonlar en az 25 cm × 175 cm olmalıdır"}, {"t": "Yönetmelikteki 20/30 cm yerine 25/50 cm olmalıdır"}, {"t": "Yönetmelikteki 25/30 cm yerine 30/50 cm olmasında yarar vardır"}, {"t": "Kolon boyutu her durumda kiriş yüksekliğinin iki katı olmalıdır"}], "a": 3, "exp": "Kitap, minimum kolon boyutunun yönetmelikteki **25/30 cm** yerine **30/50 cm** olmasında yarar görür ve \"**kolon boyutlarında elden geldiğince cömert davranılmalıdır**\" der.\n25 × 175 cm perdenin minimum boyutudur."}, {"q": "Kitaptaki \"Perde süngerdir\" uyarısı neyi anlatır?", "opts": [{"t": "Esnekliği sayesinde deprem enerjisini emer ve yükü kolonlara iletir"}, {"t": "Rijitliği sayesinde deprem yükünü üzerine çekip kolonları korur"}, {"t": "Perde taşıyıcı olmadığı için depremde kolayca hasar alır"}, {"t": "Perde nemi emerek donatı korozyonunu önler"}, {"t": "Perde, kirişlerden önce hasar alarak yıkımı geciktirir"}], "a": 1, "exp": "Perde çok **rijit** olduğu için bina az ötelenir; öteleme azaldıkça kolon ve kirişler daha az zorlanır. Perde kendi yükünün yanında komşularının yükünün bir kısmını da üstlenir.\n**2011 Van** depreminde perdeleri sayesinde ayakta kalan binalar kitapta fotoğraflanmıştır; perdeli bina perdesize göre belirgin avantajlıdır."}, {"q": "Deprem yükleri nedeniyle en az hasar alan taşıyıcı eleman hangisidir?", "opts": [{"t": "Döşeme"}, {"t": "Kolon"}, {"t": "Perde"}, {"t": "Kiriş"}, {"t": "Köşe kolon"}], "a": 0, "exp": "**Döşeme** üzerindeki yükü kirişlere aktarır ve deprem nedeniyle en az hasar alan taşıyıcı elemandır; ancak **süreksizlikleri** (büyük boşluklar) yük dağılımını bozar (A2 düzensizliği)."}, {"q": "Betonarme karkas sistemde yükün taşınma sırası hangisinde doğru verilmiştir?", "opts": [{"t": "Duvar → kolon → kiriş → döşeme → temel"}, {"t": "Döşeme → duvar → kolon → kiriş → temel"}, {"t": "Kiriş → döşeme → duvar → kolon → temel"}, {"t": "Duvar → döşeme → kiriş → kolon/perde → temel"}, {"t": "Duvar → kiriş → temel → döşeme → kolon"}], "a": 3, "exp": "Kaynak: duvarları kiriş ve döşemeler, **döşemeleri kirişler**, **kirişleri kolon ve perdeler** taşır; kolonlar yükü **temele** aktarır.\n**Betonarme karkas**: taşıyıcılığı kolon-kiriş çerçevesinin üstlendiği, duvarların yük taşımadığı sistem; Türkiye'nin en yaygın bina tipidir. Kirişler kolonları bağlayarak çerçeve oluşturur ve aks boyunca sürekli olmalıdır."}, {"q": "Duvar türleriyle ilgili ifadelerden hangileri doğrudur?\nI. Tuğla veya gazbeton dolgu duvar taşıyıcı değildir.\nII. Perde, betonarme bir taşıyıcı elemandır.\nIII. Betonarme karkas sistemde dolgu duvarlar binanın asıl yük taşıyan elemanlarıdır.", "opts": [{"t": "Yalnız I"}, {"t": "Yalnız III"}, {"t": "I ve II"}, {"t": "II ve III"}, {"t": "I, II ve III"}], "a": 2, "exp": "Halk arasında \"duvar\" ile \"**perde duvar**\" karıştırılır. **Dolgu duvar** (tuğla, gazbeton) taşıyıcı değildir, yalnızca bölme işlevi görür; **perde** ise betonarme bir taşıyıcıdır. III yanlıştır: karkas sistemde duvarlar yük taşımaz.\nBu ayrım kullanıcı kaynaklı hasarlarda kritiktir: perde kaldırılırsa binanın rijitliği yok olur."}, {"q": "Yönetmeliğe göre betonarme bir binada depremde hasarın önce hangi elemanda oluşması istenir?", "opts": [{"t": "Kolonda; kiriş ayakta kalmalıdır"}, {"t": "Kolon ve kirişte eşit oranda"}, {"t": "Temelde; üst yapı korunmalıdır"}, {"t": "Perdede; kolonlar korunmalıdır"}, {"t": "Kirişte; kolon ayakta kalmalıdır"}], "a": 4, "exp": "**Güçlü kolon – zayıf kiriş** ilkesi: kiriş hasar alırsa o kattaki bir açıklık zarar görür, bina ayakta kalır; **kolon** hasar alırsa üzerindeki **bütün katlar çöker**. Kirişteki hasar enerji yutar, yıkımı geciktirir ve bina uyarı verir.\n💡 Masa benzetmesi: tabla çatlarsa masa ayakta kalır, bacak kırılırsa masa çöker."}, {"q": "Güçlü kiriş – zayıf kolon kusurunun yaygın olarak gözlendiği depremler arasında aşağıdakilerden hangisi kaynakta sayılmaz?", "opts": [{"t": "1992 Erzincan"}, {"t": "1995 Dinar"}, {"t": "1998 Adana"}, {"t": "1999 Gölcük"}, {"t": "2011 Van"}], "a": 2, "exp": "Kaynak bu kusurun gözlendiği depremleri **1992 Erzincan, 1995 Dinar, 1999 Gölcük, 2003 Bingöl ve 2011 Van** olarak sayar.\n**1998 Adana** (ve 1999 Kocaeli) ise **düşük kaliteli beton** kullanımının saptandığı depremler olarak geçer."}, {"q": "\"Güçlü kolon – zayıf kiriş\" ilkesindeki \"zayıf kiriş\" ifadesinin doğru yorumu hangisidir?", "opts": [{"t": "Kiriş mümkün olan en düşük kaliteli malzemeyle yapılmalıdır"}, {"t": "Kirişlerde etriye kullanılmasına gerek yoktur"}, {"t": "Kiriş kesiti her zaman kolon kesitinden büyük tutulmalıdır"}, {"t": "Kiriş yeterince güçlü olmalı, ama kolondan güçlü olmamalı"}, {"t": "Kirişler yalnızca düşey yüke göre hesaplanmalıdır"}], "a": 3, "exp": "\"Zayıf kiriş\" \"kötü kiriş\" demek değildir; **göreli** bir ilkedir. Doğrusu: sağlam kirişler ve onlardan **daha sağlam kolonlar**.\nTürkiye'deki eski binalarda tersi vardır: kirişler kolonlardan büyük kesitli ve kuvvetli donatılıdır (**güçlü kiriş – zayıf kolon**); kolonlar büyük kesme kuvvetiyle hasar görür ve bina göçer. Nedeni mimari kaygılar (geniş açıklık, ince kolon, sarkan kiriş istememe) ve maliyettir."}, {"q": "Aşağıdakilerden hangisi bir planda (kuşbakışı görülen) düzensizliktir?", "opts": [{"t": "Yumuşak kat"}, {"t": "Zayıf kat"}, {"t": "Taşıyıcı sistem süreksizliği"}, {"t": "Kısa kolon problemi"}, {"t": "Döşeme süreksizliği"}], "a": 4, "exp": "**Planda düzensizlikler** binaya yukarıdan bakınca görülür: burulma (A1), **döşeme süreksizliği (A2)**, planda çıkıntı (A3).\n**Düşey düzensizlikler** yandan bakınca görülür: zayıf kat (B1), yumuşak kat (B2), taşıyıcı sistem süreksizliği (B3). Kısa kolon yönetmelik düzensizliği değil, uygulamada sık görülen bir yapısal kusurdur.\n💡 A = Aşağı bak (kuşbakışı plan), B = Boy (yükseklik)."}, {"q": "Kaynağa göre deprem açısından en iyi bina hangisidir?", "opts": [{"t": "L, T veya U planlı, girintili-çıkıntılı bina"}, {"t": "Üst katları alt katlardan geniş (çıkmalı) bina"}, {"t": "Planda ve yükseklikte basit ve simetrik olan bina"}, {"t": "Zemin katı diğer katlardan yüksek bina"}, {"t": "Perdeleri yalnızca bir cephede toplanmış bina"}], "a": 2, "exp": "Genel ilke: en iyi bina **planda ve yükseklikte basit ve simetrik** olandır. Karmaşıklık hesabın gerçekçiliğini azaltır ve riski artırır.\nÇeldiricilerin her biri bir düzensizliği/kusuru tarif eder: planda çıkıntı (A3), ağır çıkma, yumuşak kat, burulma."}, {"q": "Binanın kütle merkezi ile rijitlik merkezi arasındaki kaçıklığa ne ad verilir?", "opts": [{"t": "Göreli kat ötelemesi"}, {"t": "Eksantrisite"}, {"t": "Farklı oturma"}, {"t": "Aderans"}, {"t": "Burkulma"}], "a": 1, "exp": "**Burulma (A1)** düzensizliği, kütle merkezi ile rijitlik merkezinin çakışmaması sonucu binanın deprem sırasında dönmeye zorlanmasıdır; iki merkez arasındaki kaçıklık **eksantrisite**dir.\n**Göreli kat ötelemesi** bir katın hemen altındaki kata göre yatay kaymasıdır."}, {"q": "Rijitlik merkezi nasıl tanımlanır?", "opts": [{"t": "Binanın ağırlığının etki ettiği yaklaşık geometrik merkez"}, {"t": "Binanın temelinin en derin noktası"}, {"t": "Kolon-kiriş birleşim bölgelerinin ortalama konumu"}, {"t": "Kolon ve perde kesme kuvvetlerinin bileşkesinin geçtiği nokta"}, {"t": "Deprem kuvvetinin binaya etki ettiği kütle noktası"}], "a": 3, "exp": "**Rijitlik merkezi**: kolon ve perde kesme kuvvetlerinin bileşkesinin geçtiği nokta (direncin toplandığı yer). **Kütle merkezi** ise yaklaşık olarak binanın geometrik merkezidir ve deprem kuvveti buraya etki eder.\nİkisi çakışmazsa bina yalnızca ötelenmez, kendi ekseni etrafında da döner.\n💡 Kitabı köşesinden iterseniz döner, ortasından iterseniz düz gider."}, {"q": "Yönetmeliğe göre burulma (A1) düzensizliğinin ölçütü hangisidir?", "opts": [{"t": "Bir kattaki en büyük göreli kat ötelemesinin ortalama ötelemeye oranının 1,2'yi aşması"}, {"t": "Bir kattaki en büyük göreli kat ötelemesinin ortalama ötelemeye oranının 2'yi aşması"}, {"t": "Bir katın ortalama göreli ötelenmesinin üst kattakine oranının 1,2'yi aşması"}, {"t": "Boşluk alanları toplamının kat brüt alanının 1/3'ünü aşması"}, {"t": "Çıkıntıların iki doğrultuda da plan boyutunun %20'sini aşması"}], "a": 0, "exp": "**A1 burulma**: en büyük / ortalama göreli kat ötelemesi > **1,2**.\nKarıştırılanlar: **B2 yumuşak kat** = bir katın ortalama göreli ötelenmesinin üst/alt kata oranı > **2**; **A2** = boşluk > **1/3**; **A3** = çıkıntı iki doğrultuda > **%20**.\n💡 Sayı kodu: burulma **1,2** — yumuşak kat **2** — döşeme **1/3** — çıkıntı **%20**."}, {"q": "Köşe parseldeki bir binanın iki cephesi boydan boya camekân, diğer iki cephesi perde duvarlıdır. Bu binada öncelikle hangi düzensizlik beklenir?", "opts": [{"t": "Döşeme süreksizliği"}, {"t": "Burulma düzensizliği"}, {"t": "Planda çıkıntı"}, {"t": "Taşıyıcı sistem süreksizliği"}, {"t": "Yetersiz deprem derzi"}], "a": 1, "exp": "Rijit (perdeli) taraf az, esnek (camekânlı, ince kolonlu) taraf çok hareket eder; bina bir **kapı gibi** rijit tarafın etrafında döner ve esnek taraftaki kolonlar aşırı zorlanır. Köşe parsellerdeki binalar bu yüzden sık sık **burulma** düzensizliği taşır.\nÇözüm: kolon ve perdeler rijitliği dengeleyecek şekilde dağıtılmalı, perdeler bir tarafa yığılmamalıdır."}, {"q": "Merdiven ve asansör boşlukları dâhil, bir kattaki boşluk alanları toplamı kat brüt alanının ne kadarını aşarsa döşeme süreksizliği (A2) vardır?", "opts": [{"t": "1/3"}, {"t": "1/4"}, {"t": "1/2"}, {"t": "%20"}, {"t": "2/3"}], "a": 0, "exp": "**A2 döşeme süreksizliği**: boşluklar toplamı **kat brüt alanının 1/3'ünü** aşarsa. Ayrıca yerel döşeme boşlukları ve döşemenin rijitlik/dayanımında ani azalmalar da bu düzensizliği oluşturur. **Brüt kat alanı**: duvar ve boşluklar dâhil toplam alan.\n%20 ölçütü planda çıkıntıya (A3) aittir.\n💡 Döşeme 1/3, çıkıntı %20."}, {"q": "Aşağıdakilerden hangisi kaynakta döşeme süreksizliği (A2) üreten durumlar arasında sayılmaz?", "opts": [{"t": "Asma kat yapılması"}, {"t": "Kolonlar arasındaki dolgu duvarda bant pencere bırakılması"}, {"t": "Geniş aydınlık boşluğu bırakılması"}, {"t": "Döşeme kalınlığında ani değişim"}, {"t": "Merdiven ve asansör boşluklarının büyük yer kaplaması"}], "a": 1, "exp": "A2'yi üreten durumlar: asma kat, geniş aydınlık boşluğu, döşeme kalınlığındaki ani değişimler, merdiven-asansör dâhil büyük boşluklar.\nDolgu duvarda **bant pencere** bırakılması ise kolonun serbest boyunu kısaltarak **kısa kolon** problemine yol açar."}, {"q": "Döşemenin deprem sırasında \"diyafram\" olarak çalışması ne anlama gelir?", "opts": [{"t": "Bina yükünü geniş bir alana yayarak zemine aktarır"}, {"t": "Düzlemi içinde rijit çalışıp deprem kuvvetini kolon-perdelere dağıtması"}, {"t": "Boyuna donatıları sararak burkulmayı engeller"}, {"t": "İki bina arasında çarpışmayı önleyen boşluğu oluşturur"}, {"t": "Kolondan önce hasar alarak deprem enerjisinin büyük kısmını yutar"}], "a": 1, "exp": "Döşeme kendi düzlemi içinde **rijit bir diyafram** gibi çalışır: deprem kuvvetini toplar ve kolon-perdelere dağıtır. Büyük boşluk varsa bu işlev bozulur — delik deşik bir tepsinin yükü düzgün taşıyamaması gibi. Bu yüzden A2'nin sakıncası, yüklerin taşıyıcılar arasında düzenli dağılamamasıdır."}, {"q": "Planda çıkıntı (A3) düzensizliği için hangisi doğrudur?", "opts": [{"t": "Çıkıntının yalnızca bir doğrultuda plan boyutunun %20'sini aşması yeterlidir"}, {"t": "Çıkıntıların iki doğrultuda da plan boyutunun 1/3'ünü aşması gerekir"}, {"t": "Çıkıntı alanının kat brüt alanının %20'sini aşması yeterlidir"}, {"t": "Yalnızca dairesel planlı binalarda tanımlanır"}, {"t": "Çıkıntılar iki dik doğrultuda da plan boyutunun %20'sini aşmalıdır"}], "a": 4, "exp": "**A3**: L, T, U, H biçimli planlarda çıkıntıların **İKİ doğrultudaki** boyutlarının **her ikisinin de** toplam plan boyutunun **%20**'sini aşması. Yalnızca bir yönde uzun çıkıntı tek başına bu düzensizliği oluşturmaz.\nSakıncası: yatay kuvvetler düşey taşıyıcılara güvenle aktarılamaz, düzensiz yük dağılımı **burulma** hasarına yol açar."}, {"q": "Blok blok büyütülmüş, L biçimli planlı bir okul binasında planda çıkıntı düzensizliği saptanmıştır. Kaynağa göre önerilen çözüm hangisidir?", "opts": [{"t": "İç köşedeki döşemede büyük bir aydınlık boşluğu açarak yükü azaltmak"}, {"t": "Perdeleri yalnızca kollardan birinde toplamak"}, {"t": "Zemin kat cephelerini camekâna çevirmek"}, {"t": "İç köşedeki kolonları konsollara oturtmak"}, {"t": "Kolları deprem derziyle ayırıp iki ayrı dikdörtgen bina yapmak"}], "a": 4, "exp": "L planda iki kol farklı salınır ve zorlanma **iç köşede** toplanır. Çözüm: girinti-çıkıntılı bölümleri **deprem derziyle** ayırmak — tek L yerine iki ayrı dikdörtgen. En güvenli plan basit ve simetriktir.\nA3 Türkiye'de **okul ve hastane** binalarında sık görülür, çünkü bu yapılar blok blok büyütülür."}, {"q": "Zayıf kat (B1) ile yumuşak kat (B2) arasındaki fark hangisinde doğru verilmiştir?", "opts": [{"t": "Zayıf kat rijitlik eksikliğini, yumuşak kat dayanım eksikliğini anlatır"}, {"t": "Zayıf kat dayanım eksikliğini, yumuşak kat rijitlik eksikliğini anlatır"}, {"t": "Zayıf kat süneklik eksikliğini, yumuşak kat aderans eksikliğini anlatır"}, {"t": "Zayıf kat planda, yumuşak kat ise düşey bir düzensizliktir"}, {"t": "İkisi uygulamada hiçbir zaman aynı binada birlikte bulunmaz"}], "a": 1, "exp": "**B1 zayıf kat** = **dayanım** eksikliği; **B2 yumuşak kat** = **rijitlik** eksikliği. İkisi de düşey düzensizliktir, aynı görüntüye yol açar ve uygulamada çoğunlukla aynı binada birlikte bulunur.\nTürkiye'de bu kat neredeyse her zaman **zemin kat**tır.\n💡 Yumuşak = esnek (rijitlik), zayıf = güçsüz (dayanım)."}, {"q": "Bir katın ortalama göreli ötelenmesinin üst veya alt katınkine oranı kaçtan büyükse o kat yumuşak kat (B2) sayılır?", "opts": [{"t": "1,2"}, {"t": "2"}, {"t": "1/3"}, {"t": "%20"}, {"t": "3"}], "a": 1, "exp": "**Yumuşak kat (B2)** ölçütü: oran **> 2**. Yanal yüklerin etkisiyle aşırı ötelenerek hasar görür.\n**1,2** burulma (A1), **1/3** döşeme süreksizliği (A2), **%20** planda çıkıntı (A3) ölçütüdür."}, {"q": "Dolgu duvarların taşıyıcı sayılmasa da deprem yüküne az da olsa katkı sağladığı hangi yönetmelikten itibaren kabul edilir?", "opts": [{"t": "1998 yönetmeliği"}, {"t": "2007 yönetmeliği"}, {"t": "2018 yönetmeliği (TBDY)"}, {"t": "2015 HAP yönetmeliği"}, {"t": "2012 tarihli 6306 sayılı kanun"}], "a": 0, "exp": "Kaynak: dolgu duvarların deprem yüküne katkısı **1998 yönetmeliğinden** itibaren kabul edilir. Duvar kaldırılınca (ör. zemin katta camekân yapılınca) bu katkı da kaybolur — yumuşak katın temel mekanizmalarından biri."}, {"q": "Zemin katı boydan boya camekânlı dükkân olan, giriş katı diğer katlardan yüksek ve üst katları tuğla duvarlı bir apartman için en doğru değerlendirme hangisidir?", "opts": [{"t": "Yumuşak kat riski vardır; deprem enerjisi zemin kata boşalır ve o kat ezilebilir"}, {"t": "Burulma riski vardır; bina rijit cephe etrafında döner"}, {"t": "Döşeme süreksizliği vardır; yük döşemede dağılamaz"}, {"t": "Kısa kolon riski vardır; X biçimli çatlaklar üst katlarda oluşur"}, {"t": "Risk yoktur; dolgu duvarlar taşıyıcı olmadığından katlar arası fark önemsizdir"}], "a": 0, "exp": "**Pratik refleks**: zemin katı camekân + üst katlar tuğla duvarlı = **yumuşak kat** riski. Üst katlar duvarları sayesinde rijit blok gibi hareket eder, tüm göreli öteleme esnek zemin katta toplanır; üst katlar neredeyse hasarsız kalırken zemin kat tamamen ezilir (\"üstü sağlam, altı yok olmuş\" görüntüsü).\n2023 depremlerinde bu tipoloji yaygın gözlenmiştir. Yumuşak kat bir inşaat hatası kadar **kentsel kullanım** (dükkân talebi) sorunudur; çözüm imar politikasındadır."}, {"q": "Türkiye'de yumuşak katın neredeyse hep zemin katta görülmesinin nedenleri arasında aşağıdakilerden hangisi yer almaz?", "opts": [{"t": "Zemin kat cephelerinde dolgu duvar yerine camekân yapılması"}, {"t": "Zemin katın işyeri olarak kullanılması"}, {"t": "Üst katların duvarları sayesinde rijit bir blok gibi hareket etmesi"}, {"t": "Göreli ötelemenin zemin katta toplanması"}, {"t": "Zemin katın diğer katlardan daha alçak yapılması"}], "a": 4, "exp": "Zemin kat **daha alçak değil, daha yüksek** yapılır: kolon uzadıkça daha esnek davranır ve daha çok ötelenir.\nÜç neden: (1) **camekân etkisi** (işyeri kullanımı, duvarın rijitlik katkısı yok), (2) **yüksek giriş katı**, (3) **rijitlik farkı** (üst katlar rijit blok, öteleme zeminde toplanır). Sınavda üçü de aranır; yalnızca \"camekân\" demek yarım cevaptır.\n💡 \"Bodrum değil, dükkân çöker\": Camekân – Yükseklik – Rijitlik farkı."}, {"q": "Yumuşak kat göçmesi olmuş bir binada enkaz değerlendirmesi açısından kaynakta vurgulanan bilgi hangisidir?", "opts": [{"t": "Zemin katta yaşam boşlukları geniştir, bu yüzden aramaya oradan başlanmalıdır"}, {"t": "Üst katlar tamamen ezildiği için sağ kalan beklenmez"}, {"t": "Bu göçme tipinde tüm katlar eşit hasar alır"}, {"t": "Zemin katta yaşam boşluğu azdır; üst katlarda sağ kalan olasılığı daha yüksektir"}, {"t": "Göçme tipinin kurtarma önceliklendirmesine etkisi yoktur"}], "a": 3, "exp": "Yumuşak kat göçmesinde zemin kat ezilir, **yaşam boşluğu çok azdır**; üst katlar görece bütün iner ve oralarda **sağ kalan sayısı yüksek** olabilir. Göçme tipini tanımak enkaz önceliklendirmesini etkiler.\nSınır: enkaz değerlendirmesi eğitimli arama-kurtarma ekiplerinin işidir; burada amaç yapı bilgisinin sahadaki değerini göstermektir."}, {"q": "Taşıyıcı sistem süreksizliği (B3) ile ilgili olarak aşağıdakilerden hangisi yönetmelikte kesin olarak yasaklanmış DEĞİLDİR?", "opts": [{"t": "Perdenin kolona oturtulması"}, {"t": "Perdenin kiriş açıklığına oturtulması"}, {"t": "Kolonun konsola oturtulması"}, {"t": "Kolonun guseye oturtulması"}, {"t": "Kolonun iki ucundan kirişe oturtulması"}], "a": 4, "exp": "Kesin yasaklar: **perdenin kolona veya kiriş açıklığına**, **kolonun konsollara veya guselere** oturtulması.\nKolonun iki ucundan kirişe oturtulması yasak değildir ama **zorunlu önlem** gerektirir: birleşim noktasındaki tüm kiriş ve kolon kesitlerinde iç kuvvetler **%50 artırılarak** hesaplanır.\nB3 = kolon ve perdelerin temelden en üst kata kadar kesintisiz devam etmemesi."}, {"q": "Bir kolon iki ucundan kirişe oturtuluyorsa, birleşim noktasındaki kiriş ve kolon kesitlerinde iç kuvvetler ne kadar artırılarak hesaplanmalıdır?", "opts": [{"t": "%20"}, {"t": "%33"}, {"t": "%50"}, {"t": "%100"}, {"t": "%10"}], "a": 2, "exp": "Yönetmelik zorunlu önlemi: iç kuvvetler **%50** artırılarak hesaplanır.\nTaşıyıcı süreksizlikte yük aşağıya düz bir yol bulamaz, kirişten kirişe **dolaşır**; her dolanma noktası tasarımda hesaba katılmamış ek zorlanmadır.\n💡 Yük, su gibi en kısa ve düz yoldan temele inmek ister."}, {"q": "Kolon-kiriş birleşiminde köşeyi güçlendirmek için yapılan pahlı (üçgen) genişletmeye ne ad verilir?", "opts": [{"t": "Konsol"}, {"t": "Etriye"}, {"t": "Pabuç"}, {"t": "Guse"}, {"t": "Aks"}], "a": 3, "exp": "**Guse**: kolon-kiriş birleşiminde pahlı (üçgen) genişletme. **Konsol**: bir ucu serbest, tek taraftan mesnetlenmiş eleman (balkon gibi). **Etriye**: enine donatı; **pabuç**: tekil temelin kolon altındaki genişletilmiş betonarme parçası; **aks**: kolonların hizalandığı düşünsel çizgi.\nÜst katlardaki çıkmaların altında kolon olmaması en sık B3 örneklerindendir."}, {"q": "Kısa kolon neden tehlikelidir?", "opts": [{"t": "Kısaldıkça esnekleşir, bu nedenle depremde aşırı ötelenerek hasar alır"}, {"t": "Kısa kolon düşey yükü taşıyamayacak kadar incelir"}, {"t": "Kısa kolonda boyuna donatı hızla korozyona uğrar"}, {"t": "Kısa kolon binanın kütle merkezini yukarı kaydırır"}, {"t": "Kısaldıkça rijitleşip kesme kuvvetinin büyük kısmını üzerine çeker"}], "a": 4, "exp": "**Kısa kolon**: kolonun serbest boyunun dolgu duvar veya yapı elemanları nedeniyle kısalması. Kısalan kolon komşularından **daha rijit** olur, **kesme kuvvetinin** büyük kısmını çeker ve ağır hasar alır.\n💡 İki cetvel: uzun olan kolayca bükülür, kısa olan direnir — ve direndiği için kuvveti üzerine alıp kırılır."}, {"q": "Hasar tespiti yapılan bir okulun bodrum katında, dolgu duvarın üst kısmında uzun yatay havalandırma penceresi bulunan bir kolonda X biçimli çatlaklar görülüyor. En olası kusur hangisidir?", "opts": [{"t": "Kısa kolon problemi"}, {"t": "Köşe kolon problemi"}, {"t": "Saplama kiriş problemi"}, {"t": "Yetersiz deprem derzi"}, {"t": "Farklı oturma"}], "a": 0, "exp": "Duvarın üstünde bırakılan **bant pencere**, kolonun yalnızca üst kısmını serbest bırakır → **kısa kolon**. **X biçimli kesme çatlakları** sahada kısa kolonun imzasıdır. En yaygın örnekleri okullar ve bodrum katlarıdır.\n1 Mayıs **2003 Bingöl** ve **2011 Van** depremlerinde bu problemle hasar gören çok sayıda bina saptanmıştır. Çözüm: kısa kolonlar kat yüksekliğince **sık etriye** ile sarılmalıdır. Kısa kolon çoğunlukla projede yoktur; uygulama ve denetim eksikliğidir."}, {"q": "Aşağıdakilerden hangisi kısa kolon oluşum nedenleri arasında sayılmaz?", "opts": [{"t": "Tesisat katı veya asma kat bulunması"}, {"t": "Merdiven ara sahanlığının kolonu bölmesi"}, {"t": "Kademeli temel uygulanması"}, {"t": "Yüksek kiriş veya guseli kiriş kullanılması"}, {"t": "Bitişik binaların döşeme hizalarının farklı olması"}], "a": 4, "exp": "Kısa kolon nedenleri: dolgu duvarda **bant pencere**, **tesisat katı, asma kat, merdiven ara sahanlığı, yüksek kiriş, guseli kiriş, kademeli temeller**.\nBitişik binaların döşeme hizalarının farklı olması **yetersiz derz** konusudur: bir binanın döşemesi diğerinin kolonunun ortasına çarpar."}, {"q": "2004'te Konya'da hiçbir deprem olmadan kendi ağırlığı altında çöken Zümrüt Apartmanı'nda hangi problemin bulunduğu bilinmektedir?", "opts": [{"t": "Kısa kolon problemi"}, {"t": "Yetersiz deprem derzi"}, {"t": "Köşe kolon problemi"}, {"t": "Yıkanmamış deniz kumu kullanımı"}, {"t": "Burulma düzensizliği"}], "a": 2, "exp": "**Köşe kolon problemi**, salonun köşede olduğu binalarda tavanda sarkan kiriş istenmemesinden doğar; deprem yüklerinin diğer kolonlara aktarımı zorlaşır, o bölge esnek davranır ve köşe kolon uçları zarar görür. **Yalnızca düşey yükler altında bile** yıkıma neden olabilir — Zümrüt Apartmanı (Konya, 2004) bunun örneğidir."}, {"q": "Köşe kolon problemi için kaynakta önerilen çözüm hangisidir?", "opts": [{"t": "Salon tavanındaki sarkan kirişi tamamen kaldırarak yükü azaltmak"}, {"t": "Kolon yerine perde; köşe kolon ve bağlı kirişlerde sık etriye"}, {"t": "Köşe kolonun kesitini küçültüp sayısını artırmak"}, {"t": "Köşe kolonu konsol bir kirişe oturtmak"}, {"t": "Köşeye ağır bir çıkma ekleyerek yükü dengelemek"}], "a": 1, "exp": "Çözüm: köşede **kolon yerine perde**; köşe kolon ve bağlı kirişler **sık etriye** ile sarılmalı.\nSarkan kirişin kaldırılması zaten sorunun kaynağıdır; kolonun konsola oturtulması ise yönetmelikte kesin yasaktır."}, {"q": "Kirişin kolona değil başka bir kirişe oturtulmasıyla ortaya çıkan kusura ne ad verilir?", "opts": [{"t": "Yapışık kiriş problemi"}, {"t": "Güçlü kiriş – zayıf kolon problemi"}, {"t": "Kısa kolon problemi"}, {"t": "Saplama kiriş problemi"}, {"t": "Konsol kiriş problemi"}], "a": 3, "exp": "**Saplama kiriş**: kirişin kolona değil başka bir kirişe oturması. **Yapışık kiriş**: cephe duvarını kolonların dışına çizme alışkanlığından doğar. İkisi de **çerçeve süreksizliğidir**: yükler kolonlara gitmek yerine bina içinde dolanır, saplandığı kirişte hesaba katılmamış **burulma momenti ve kesme kuvveti** oluşur.\nÇözüm: tüm kirişler kolonlara oturtulmalı; kaçınılmazsa saplama bölgesi sık etriyeyle sarılmalı. Kitapta 1999 Kocaeli'de yıkılan, neredeyse tümüyle saplama kirişli bir binanın kalıp planı gösterilir."}, {"q": "Köşe kolon problemi ile çerçeve süreksizliğinin (saplama/yapışık kiriş) ortak kökü kaynakta nasıl özetlenir?", "opts": [{"t": "Düşük kaliteli beton ve deniz kumu kullanılması"}, {"t": "Zemin etüdü yapılmadan temel seçilmesi"}, {"t": "Etriye uçlarının 90 derece bükülmesi"}, {"t": "Bitişik nizamda yetersiz derz bırakılması"}, {"t": "Mimari isteğin taşıyıcı sistemin önüne geçmesi"}], "a": 4, "exp": "Her iki kusur da teknik bilgisizlikten değil, **mimari/kullanıcı isteğinin taşıyıcı sistemin önüne geçmesinden** doğar (\"salonumun tavanında kiriş görünmesin\").\nBu kusurlar kalıp planından okunabilir; hasar tespiti, bina envanteri ve risk önceliklendirmesi bu okumaya dayanır."}, {"q": "Etriye uçlarının kaç derecelik açıyla içe bükülmesi gerekir?", "opts": [{"t": "90 derece"}, {"t": "45 derece"}, {"t": "135 derece"}, {"t": "120 derece"}, {"t": "180 derece"}], "a": 2, "exp": "Etriye uçları **135°** içe bükülür, böylece betonu içeriden kavrar. **90°** bükülen etriyenin ucu betonun dış yüzeyine yakın kalır; depremde pas payı dökülünce açılır ve kolonu sarma işlevini kaybeder.\n💡 \"Etriye hayat kurtarır\" — 135 derece bükülmeyen etriye hiçbir işe yaramaz."}, {"q": "Etriyenin işlevleriyle ilgili ifadelerden hangileri doğrudur?\nI. Kesme çatlaklarını önler.\nII. Boyuna donatıların burkulmasını engeller.\nIII. Betonu sararak bir arada tutar ve sünek davranışı sağlar.", "opts": [{"t": "Yalnız I"}, {"t": "I, II ve III"}, {"t": "I ve II"}, {"t": "II ve III"}, {"t": "Yalnız III"}], "a": 1, "exp": "**Etriye** (deprem etriyesi), kolon ve kirişlerde **boyuna donatıyı** saran **enine donatıdır**: kesme çatlaklarını önler, boyuna donatının burkulmasını engeller, betonu sarar ve **sünek davranışı sağlayan asıl elemandır**.\nYapılmazsa kolon hasar alır, donatılar burkulur, beton dağılır; etriye yetersizliği Türkiye'deki deprem hasarlarının en yaygın nedenlerindendir."}, {"q": "Etriyelerin sıklaştırılması gereken bölgeler için kaynakta verilen bilgi hangisidir?", "opts": [{"t": "Kolonlarda en az kolon kısa kenarı kadar, kirişlerde en az kiriş yüksekliği kadar"}, {"t": "Yalnızca kolon ortasında, kat yüksekliğinin üçte biri boyunca"}, {"t": "Kirişlerde en az kiriş yüksekliğinin dört katı, kolonlarda hiç gerekmez"}, {"t": "Kolonda ≥ kolon uzun kenarı, kirişte ≥ 2 × kiriş yüksekliği kadar uç bölgede"}, {"t": "Yalnızca temel pabuçlarında ve bağ kirişlerinin orta bölgesinde"}], "a": 3, "exp": "Etriyeler kolon ve kirişlerin **uçlarında**, özellikle **kolon-kiriş birleşim bölgelerinde** sıklaştırılır (deprem açısından en kritik noktalar): kolonlarda en az **kolon uzun kenarı** kadar, kirişlerde en az **kiriş yüksekliğinin 2 katı**."}, {"q": "Etriye kusurları açısından yapı denetiminin neden inşaat sırasında yapılması zorunludur?", "opts": [{"t": "Etriyeler bina kullanılmaya başladıktan sonra kendiliğinden gevşer"}, {"t": "Etriye hataları yalnızca deprem anında ölçülebilir"}, {"t": "Yönetmelik etriyeyi yalnızca projede zorunlu tutar"}, {"t": "Beton dökülünce etriye görülemez ve sonradan telafisi yoktur"}, {"t": "Etriye kusurları beton kalitesiyle otomatik olarak telafi edilir"}], "a": 3, "exp": "Proje ve beton doğru olsa bile etriyeler 90° bükülmüşse bina beklenen performansı gösteremez; **işçilik kalitesi hayatidir**. Beton dökülünce etriye görülemez, bu yüzden denetim **inşaat sırasında** yapılmalıdır — sonradan telafisi yoktur."}, {"q": "Ağır çıkmalı binalarla ilgili aşağıdakilerden hangisi yanlıştır?", "opts": [{"t": "Alt katlar yumuşak kat gibi davranır ve düşey yükler altında bile zorlanır"}, {"t": "Bu binalarda kısa kolon, köşe kolon ve çerçeve süreksizliği de birlikte görülür"}, {"t": "Çıkmalar kütle merkezini aşağı kaydırarak binayı daha kararlı kılar"}, {"t": "Balkonların kirişli yapılması, gerekirse gömme balkon tercih edilmesi önerilir"}, {"t": "Konsol kirişler daha büyük kesitli ve aks boyunca sürekli olmalıdır"}], "a": 2, "exp": "Üst katlar alt katlardan geniş olduğunda üst kat yükleri artar ve **kütle merkezi yukarı kayar** — kararlılık azalır.\nDiğer ifadeler kaynakta yer alır. Kitap estetik kaygılar nedeniyle \"kutu gibi\" binaların pratikte yapılamadığını kabul eder; amaç çıkmayı yasaklamak değil, büyük çıkmalardan kaçınmak ve bilerek tasarlamaktır."}, {"q": "Yönetmelik ölçütüne göre 15 m yüksekliğindeki bir bina için bırakılması gereken en az deprem derzi kaç mm'dir?", "opts": [{"t": "60 mm"}, {"t": "30 mm"}, {"t": "45 mm"}, {"t": "75 mm"}, {"t": "150 mm"}], "a": 0, "exp": "Ölçüt: **6 m'ye kadar en az 30 mm**, 6 m'den sonraki **her 3 m için +10 mm**.\n15 m: 30 mm + (9 m ÷ 3 = 3 dilim × 10 mm = 30 mm) = **60 mm**.\n**Deprem derzi**: bitişik binaların depremde farklı salınıp çarpışmasını önlemek için aralarında bırakılan boşluk."}, {"q": "Bitişik nizam iki bina arasında derz yetersizse, kaynağa göre en tehlikeli durum hangisidir?", "opts": [{"t": "İki binanın kat döşemelerinin tam olarak aynı hizada bulunması"}, {"t": "İki binanın da aynı yıl, aynı kat yüksekliğiyle yapılmış olması"}, {"t": "Döşeme hizalarının farklı olup döşemenin komşu kolonun ortasına çarpması"}, {"t": "Binalardan birinin radye temelli olması"}, {"t": "Binalar arasında yönetmeliğin istediğinden fazla boşluk bırakılması"}], "a": 2, "exp": "**Bitişik nizam** (aralarında boşluk bırakılmadan yan yana inşa) Türkiye'de şehir merkezlerinin en yaygın yapılaşmasıdır. Binalar depremde farklı salınır ve çarpışır. En tehlikelisi **döşeme hizalarının farklı** olmasıdır: bir binanın sert döşeme kenarı diğerinin kolonunun ortasına balyoz gibi vurur; **her iki bina** ağır hasar görür.\n💡 Sokak gözlemi: yan yana binaların pencere hizaları farklıysa döşeme hizaları da farklıdır."}, {"q": "Beton bileşiminde yıkanmamış deniz kumu kullanılmasının temel sakıncası nedir?", "opts": [{"t": "Betonu aşırı rijit yaparak kolonlarda kısa kolon etkisi oluşturması"}, {"t": "Binanın kütle merkezini yukarı kaydırması"}, {"t": "İçindeki tuz nedeniyle donatının paslanmasını hızlandırması"}, {"t": "Döşemede süreksizlik oluşturması"}, {"t": "Etriye uçlarının 90 derece bükülmesine yol açması"}], "a": 2, "exp": "**Yıkanmamış deniz kumu**, içindeki **tuz** nedeniyle donatı **korozyonunun** başlıca nedenlerindendir; Türkiye'deki eski yapı stokunun yaygın sorunudur ve 1999 sonrası tartışmalarının merkezinde yer almıştır."}, {"q": "Donatıyı koruyan beton örtüsünün (pas payı) kalınlığı kaynağa göre ne kadar olmalıdır?", "opts": [{"t": "0,5–1 cm"}, {"t": "3–5 cm"}, {"t": "1–2 cm"}, {"t": "6–8 cm"}, {"t": "10–15 cm"}], "a": 1, "exp": "**Pas payı** **3–5 cm** olmalı ve bina kullanım süresince aynı kalınlıkta korunmalıdır. Yetersizse demirler su, hava ve kimyasallarla paslanır; donatı çapı azalır ve **aderans** kaybolur."}, {"q": "Betonarmenin çalışma ilkesi ve korozyonun etkisiyle ilgili hangisi doğrudur?", "opts": [{"t": "Beton çekmeye, çelik basınca dayanıklıdır; korozyon betonun basınç dayanımını artırır"}, {"t": "Beton ve çelik birbirinden bağımsız çalışır, bu nedenle aderansın taşıyıcılıkta önemi yoktur"}, {"t": "Korozyon yalnızca donatının rengini değiştirir; taşıma gücünü ve yapışmayı etkilemez"}, {"t": "Aderans, kütle merkezi ile rijitlik merkezi arasındaki kaçıklıktır"}, {"t": "Beton basınca, çelik çekmeye dayanır; aderansla birlikte çalışırlar, korozyon bunu bozar"}], "a": 4, "exp": "Beton **basınca** dayanıklı, **çekmede** zayıftır; çelik çekmede çok güçlüdür. Birleşince her iki yüke dayanır — ama ancak **aderansla** (beton–donatı yapışması) tek malzeme gibi davranırsa. Korozyon yapışmayı bozar, sistem çözülür.\nKaçıklık = eksantrisite.\n💡 Beton basınca, çelik çekmeye dayanır; aderans ikisini tek malzeme gibi evlendirir."}, {"q": "Hasar alan binaların birçoğunda düşük kaliteli beton kullanıldığının saptandığı depremler kaynakta hangileri olarak verilir?", "opts": [{"t": "1992 Erzincan ve 1995 Dinar"}, {"t": "2003 Bingöl ve 2011 Van"}, {"t": "2011 Van ve 2023 Kahramanmaraş"}, {"t": "1995 Dinar ve 2003 Bingöl"}, {"t": "1998 Adana ve 1999 Kocaeli"}], "a": 4, "exp": "Düşük kaliteli beton: **1998 Adana** ve **1999 Kocaeli**. Beton kalitesi dayanım, rijitlik ve sünekliğin hepsini belirler.\nProje ne kadar doğru olursa olsun malzeme ve işçilik kötüyse bina beklenen performansı gösteremez."}, {"q": "Bir binanın dış cephesinde beton dökülmeleri ve içeriden görünen paslı demirler fark ediliyor. Kaynağa göre bu bulgu ne anlama gelir?", "opts": [{"t": "Kısa kolon probleminin tipik X biçimli imzasıdır"}, {"t": "İleri korozyonun, uzmanlık gerektirmeden fark edilebilen işaretidir"}, {"t": "Yalnızca estetik bir sorundur; taşıyıcı sistemin güvenliğini etkilemez"}, {"t": "Binanın sünek davrandığını ve uyarı verdiğini gösteren olumlu bir işarettir"}, {"t": "Deprem derzinin yeterli olduğunu gösterir"}], "a": 1, "exp": "Dış cephede beton dökülmesi ve paslı demir görünmesi **ileri korozyonun** işaretidir. Malzeme kusurları **zamanla kötüleşir**: 1990'da yapılmış bina bugün 1990'daki performansını göstermez — **bina yaşı riskin bağımsız bir bileşenidir**."}, {"q": "Kaynağa göre en yaygın kullanıcı müdahalesi hangisidir?", "opts": [{"t": "Zemin katın dükkâna çevrilmesi için kolon kesilmesi"}, {"t": "Statik inceleme yapılmadan kat eklenmesi"}, {"t": "Perde duvarın kaldırılması"}, {"t": "Tesisat borularının kiriş donatıları arasından geçirilmesi"}, {"t": "Balkonun odaya katılması"}], "a": 3, "exp": "En yaygın (ve en sinsi) müdahale **tesisat borularının kiriş donatıları arasından geçirilmesidir**: kimse \"kiriş kestim\" demez, \"kombi borusu geçirdim\" der. Hiç deprem olmadan hasar almış kiriş deprem yükünü karşılayamaz.\nBu bilgiler kitapta **Anadolu Üniversitesi**'nin bina envanter (saha) çalışmasına dayanır."}, {"q": "\"Salonu büyütmek için ortadaki kolonu kestirdim\" diyen bir komşuya verilecek en doğru açıklama hangisidir?", "opts": [{"t": "Yük ortadan kalkmaz, bu yük için hesaplanmamış komşu elemanlara biner"}, {"t": "Kolon kaldırılınca bina hafifler, bu nedenle deprem güvenliği artar"}, {"t": "Kolonun yükü doğrudan dolgu duvarlara geçer, bunun bir sakıncası yoktur"}, {"t": "Tek bir kolonun kaldırılması yalnızca o dairenin döşemesini etkiler"}, {"t": "Kesilen kolonun yerine tuğla duvar örmek taşıyıcılığı tamamen geri kazandırır"}], "a": 0, "exp": "Bina **o kolon varmış gibi** hesaplanmıştır. Taşıyıcı kaldırılınca yük **komşu elemanlara** biner; onlar bu yük için tasarlanmamıştır. Mağaza, galeri ve garaja çevrilen katlarda kolon yıkılması, kiriş kesilmesi deprem güvenliğini doğrudan yok eder.\nDoğru yaklaşım: taşıyıcıyı ilgilendiren her değişiklik için **proje müellifi veya inşaat mühendisi** görüşü.\n💡 \"Taşıyıcıya dokunan her iş, mühendis onayı ister.\""}, {"q": "Kullanıcı kaynaklı hasarlarla ilgili ifadelerden hangileri doğrudur?\nI. Statik inceleme yapılmadan kat eklemek yalnızca düşey yükleri artırır, yatay yükleri etkilemez.\nII. Perdenin dolgu duvar sanılarak kaldırılması binanın rijitliğini yok eder.\nIII. Kullanıcı müdahaleleri sağlam bir binayı, bina yaşlanmadan riskli hâle getirebilir.", "opts": [{"t": "Yalnız I"}, {"t": "I ve II"}, {"t": "II ve III"}, {"t": "I ve III"}, {"t": "I, II ve III"}], "a": 2, "exp": "I yanlıştır: izinsiz **kat ekleme** hem **düşey hem yatay** yükleri projede öngörülenin üzerine çıkarır.\nII doğru: perde betonarme taşıyıcıdır, dolgu duvarla karıştırılıp kaldırılması rijitliği yok eder. III doğru: kullanıcı kaynaklı hasarlar binayı **yaşlanmadan zayıflatır**."}, {"q": "Bir hastanede yeni bir cihaz odası açmak için bir duvarın kaldırılması planlanıyor. Kaynağa göre doğru yaklaşım hangisidir?", "opts": [{"t": "Duvarlar karkas sistemde taşıyıcı olmadığından doğrudan kaldırılabilir"}, {"t": "Kaldırılan duvarın yerine tesisat boruları kirişlerden geçirilerek alan genişletilebilir"}, {"t": "Proje müellifi veya bir inşaat mühendisinin görüşü alınmalıdır"}, {"t": "Yalnızca hastane yönetiminin onayı yeterlidir"}, {"t": "Duvar kaldırma işlemi deprem sonrasına ertelenmelidir"}], "a": 2, "exp": "\"Duvar\" bir **perde** olabilir; taşıyıcıyı ilgilendiren her değişiklikte **proje müellifi veya inşaat mühendisi** görüşü alınmalı, tesisat ağı önceden planlanmalı ve taşıyıcılara zarar verilmemelidir.\nHastane, okul ve kamu binalarında tadilat sırasında bu hatalar sık yapılır; bir cihaz odası için duvar kaldırmak hastanenin **afet performansını düşürebilir**."}, {"q": "Aşağıdakilerden hangisi yapısal olmayan öge DEĞİLDİR?", "opts": [{"t": "Asma tavan paneli"}, {"t": "Aydınlatma armatürü"}, {"t": "Sabitlenmemiş ilaç rafı"}, {"t": "Tıbbi gaz tesisatı"}, {"t": "Perde duvar"}], "a": 4, "exp": "**Yapısal olmayan risk**: taşıyıcı sisteme ait olmayan ögelerin — mobilya, cihaz, tesisat, asma tavan, aydınlatma — depremde devrilerek, düşerek veya kopararak yarattığı risk (kaynak: AFAD).\n**Perde** betonarme bir **taşıyıcı** elemandır, yani yapısal sistemin parçasıdır."}, {"q": "Yapısal olmayan risk ve azaltılmasıyla ilgili hangisi doğrudur?", "opts": [{"t": "Taşıyıcı sistem sağlam kaldığı sürece yapısal olmayan ögeler yaralanmaya yol açmaz"}, {"t": "Hastanelerde bu risk yalnızca personel güvenliğini ilgilendirir"}, {"t": "Yapısal olmayan risk azaltma yalnızca hastaneler için geçerlidir"}, {"t": "Yapısal olmayan riskler ancak yapısal güçlendirmeden sonra ele alınabilir"}, {"t": "Sabitleme ve askılama çoğu zaman yapısal güçlendirmeden çok daha ucuzdur"}], "a": 4, "exp": "Yapısal olmayan risk azaltma **görece ucuzdur** ve afet yönetiminin en yüksek getirili yatırımlarındandır: dolapları duvara sabitlemek, **oksijen tüplerini zincirlemek**, raflara bariyer koymak hemen yapılabilir.\nTaşıyıcı sağlam olsa bile bu ögeler yaralanma, ölüm ve **hizmet kesintisine** yol açabilir. Hastanede risk **iki katmanlıdır**: hasta-personel güvenliği + hizmet sürekliliği. Evler ve okullar için de geçerlidir (\"ağır eşyaları alt raflara koyun\")."}, {"q": "\"Bir hastane yıkılmadan da işlevini kaybedebilir.\" Kaynağa göre bunun en yaygın nedeni nedir?", "opts": [{"t": "Güçlü kolon – zayıf kiriş kusuru"}, {"t": "Yapısal olmayan riskler"}, {"t": "Yetersiz deprem derzi"}, {"t": "Yumuşak kat düzensizliği"}, {"t": "Farklı oturma"}], "a": 1, "exp": "Sınavda hatırla: hastane yıkılmadan işlevini kaybedebilir; bunun **en yaygın nedeni yapısal olmayan risklerdir**. Hastanenin afetteki performansını çoğu zaman taşıyıcı sistem değil, **sabitlenmemiş ayrıntılar** belirler.\nDiğer şıklar taşıyıcı sistemi doğrudan etkileyen yapısal kusurlardır."}, {"q": "Kaynakta hastanedeki yapısal olmayan riskler arasında \"en sık gözden kaçan\" olarak nitelenen hangisidir?", "opts": [{"t": "Çalışmayan jeneratör"}, {"t": "Devrilen ilaç rafları"}, {"t": "Düşen asma tavan"}, {"t": "Kopan su hattı"}, {"t": "Devrilen oksijen tüpü"}], "a": 0, "exp": "**Çalışmayan jeneratör** en sık gözden kaçan risktir: sabitlenmemişse, yakıtı yoksa veya düzenli test edilmiyorsa elektrik kesintisinde devreye girmez; ventilatör ve monitörler durur.\nSorulacaklar: yakıt dolu mu, kaç saat yeter, düzenli test ediliyor mu, sabitlenmiş mi, bodrumdaysa su baskını riski var mı? Bunlar HAP'ın kontrol ettiği sorulardır."}, {"q": "Depremde bina hasarsız, elektrik var ve personel görevde; ancak yoğun bakımdaki duvar oksijen çıkışlarına gelen hat kopmuştur. Bu durum en iyi hangi ifadeyle açıklanır?", "opts": [{"t": "Bina ayakta olsa da hizmet veremez; oksijen hattı kopan yoğun bakım hasta tutamaz"}, {"t": "Taşıyıcı sistem sağlam olduğu için yoğun bakımdaki hizmet kesintisiz sürdürülebilir"}, {"t": "Bu bir yapısal hasardır ve güçlü kolon – zayıf kiriş ilkesiyle önlenebilirdi"}, {"t": "Oksijen hattının kopması yalnızca yangın riski yaratır, hasta bakımını etkilemez"}, {"t": "Bu durum yalnızca jeneratör çalışmadığında sorun olur"}], "a": 0, "exp": "**Kopan tesisat** \"hizmetin kalbi\"dir: tıbbi gaz, su-kanalizasyon, elektrik. Oksijen hattı kopan yoğun bakım, binası sapasağlam olsa bile hasta tutamaz.\n**Tıbbi gaz hattı**: oksijen ve solunum gazlarının merkezî dağıtım boru sistemi; **esnek bağlantı** ve **otomatik kesme vanası** yoksa kopma/sızıntı riski yüksektir. 2023 depremlerinde bazı hastaneler taşıyıcı sistemi sağlam olduğu hâlde altyapı hasarı nedeniyle tahliye edilmiştir."}, {"q": "Hastanedeki yapısal olmayan risklerle ilgili hangisi yanlıştır?", "opts": [{"t": "Devrilen bir oksijen tüpü hem yaralanma hem de yangın riski yaratabilir"}, {"t": "Raflardan düşüp dağılan ilaç stoğu kullanılamaz hâle gelebilir"}, {"t": "Havalandırma menfezleri de düşebilecek ögeler arasındadır"}, {"t": "Ameliyathanede düşen asma tavan, taşıyıcı sağlamsa alanın kullanımını etkilemez"}, {"t": "Sabitlenmemiş dolaplar doğrudan yaralanmaya yol açabilir"}], "a": 3, "exp": "Ameliyathane veya yoğun bakımda tavan, aydınlatma ya da menfez düşerse oda **steril ve güvenli olmadığı** için o alan **kapanır**.\nDiğerleri kaynakta yer alır: devrilen
