eşya/raf (doğrudan yaralanma; tüp → yangın; dağılan ilaç stoğu kullanılamaz)."}, {"q": "Hastane Afet ve Acil Durum Planları (HAP) Uygulama Yönetmeliği hangi tarihli Resmî Gazete'de yayımlanmıştır?", "opts": [{"t": "20.03.2015 (sayı 29301)"}, {"t": "18.03.2018 (sayı 30364)"}, {"t": "01.01.2019"}, {"t": "20.03.2012 (sayı 6306)"}, {"t": "17.08.1999"}], "a": 0, "exp": "**HAP Yönetmeliği**: RG **20.03.2015**, sayı **29301**. Türkiye'de her sağlık tesisi HAP hazırlamak ve güncel tutmakla yükümlüdür.\n18.03.2018 / 30364 TBDY-2018'in yayım bilgisidir (yürürlük 1 Ocak 2019); 6306 kentsel dönüşüm kanununun numarasıdır (2012)."}, {"q": "Aşağıdakilerden hangisi HAP'ın kapsadığı başlıklar arasında sayılmaz?", "opts": [{"t": "Kapasite artırımı (yatak ve personel)"}, {"t": "Hasta akışı yönetimi ve iletişim"}, {"t": "Taşıyıcı sistem projesinin hazırlanması"}, {"t": "Alan tahliyesi"}, {"t": "Stok ve tedarik yönetimi"}], "a": 2, "exp": "HAP kapsamı: **kapasite artırımı** (yatak ve personel sayısını hızla artırma), **hasta akışı**, **alan tahliyesi**, **iletişim**, **stok ve tedarik**, **personel görevlendirme**.\nNeden zorunlu? Afette hasta sayısı normal kapasitenin çok üzerine çıkar; bu artış planlanmadan yönetilemez. Ayrıntılar ve TAMP ile ilişkisi Hafta 13'te."}, {"q": "HAP'ın uygulanmasıyla ilgili kaynakta vurgulanan ilke hangisidir?", "opts": [{"t": "Plan, kriz anında koşullara göre yeniden yazılmalıdır"}, {"t": "Yazılı plan tek başına yetmez; tatbikatla denenmemiş plan, plan sayılmaz"}, {"t": "Planı yalnızca hastane yöneticilerinin bilmesi yeterlidir"}, {"t": "Plan bir kez hazırlandıktan sonra güncellenmesine gerek yoktur"}, {"t": "Tatbikat yalnızca yapısal güçlendirme yapılmış hastanelerde zorunludur"}], "a": 1, "exp": "\"**Kriz anında plan yazılmaz, plan uygulanır.**\" Personelin planı bilmesi ve düzenli **tatbikatla** denenmiş olması gerekir; hemşire, güvenlik ve temizlik personeli görevini bilmiyorsa plan yoktur — afet anında insanlar okumaya değil **alışkanlığa** göre davranır.\nHAP güncel tutulmak zorundadır."}, {"q": "TBDY-2018'in performans hedefi yaklaşımına göre sıradan bir konut ile hastane için hedefler hangisinde doğru eşleştirilmiştir?", "opts": [{"t": "Konut: kesintisiz kullanım — Hastane: can güvenliği"}, {"t": "Konut: can güvenliği — Hastane: can güvenliği"}, {"t": "Konut: göçmenin önlenmesi — Hastane: hızlı tahliye"}, {"t": "Konut: can güvenliği — Hastane: kesintisiz kullanım"}, {"t": "Konut: kesintisiz kullanım — Hastane: kesintisiz kullanım"}], "a": 3, "exp": "Haftanın ana fikri: **ayakta kalmak ile çalışmaya devam etmek aynı şey değildir**. Sıradan binada hedef insanların güvenle tahliyesidir (**can güvenliği**); hastane, itfaiye, afet yönetim merkezi için hedef **kesintisiz kullanım**dır — afetin hemen ertesinde hasta kabul edebilmek.\nBu hedef daha pahalı tasarım demektir; toplum bu maliyeti, afet anında o binaya herkesin ihtiyaç duyması nedeniyle kabul eder.\n💡 Konut: içindekiler sağ çıksın, yeter. Hastane: deprem biter bitmez hasta kabul etsin."}, {"q": "Ders kitabının dayandığı yönetmelik ve güncel durumla ilgili hangisi doğrudur?", "opts": [{"t": "Kitap TBDY-2018'e göre yazılmıştır; yönetmelik o tarihten beri değişmemiştir"}, {"t": "Kitap DBYBHY-2007'ye dayanır; yerini 2019'da yürürlüğe giren TBDY-2018 almıştır"}, {"t": "TBDY-2018 bütün binaları tek bir kurallar kümesine tabi tutar"}, {"t": "DBYBHY-2007 hastaneler için kesintisiz kullanım hedefini getirmiştir"}, {"t": "TBDY-2018, 20 Mart 2015'te yürürlüğe girmiştir"}], "a": 1, "exp": "Kitap **DBYBHY-2007**'ye göre yazılmıştır; yerini **TBDY-2018** almış, **1 Ocak 2019**'da yürürlüğe girmiştir.\nTBDY-2018'in en önemli yeniliği \"tüm binalar aynı kurala tabi\" anlayışından **performansa dayalı tasarıma** — kullanım amacına göre farklı hedeflere — geçiştir; hastaneler için \"kesintisiz kullanım\" hedefi getirilmiştir."}, {"q": "TBDY-2018 ile birlikte deprem tasarımında kullanılan tehlike esası nasıl değişmiştir?", "opts": [{"t": "Adrese özgü ivme yerine yeniden beş <h3>4. Afetin tanımı ve üç koşul</h3>
<p><b>AFAD (Açıklamalı Afet Yönetimi Terimleri Sözlüğü):</b> Toplumun tamamı veya belli kesimleri için fiziksel, ekonomik ve sosyal kayıplar doğuran, normal hayatı ve insan faaliyetlerini durduran/kesintiye uğratan, <span class="k">etkilenen toplumun baş etme kapasitesinin yeterli olmadığı</span> <b>doğa, teknoloji veya insan kaynaklı</b> olay.</p>

<p><span class="warn">Kapasite yeterliyse → ACİL DURUM; kayıp yoksa → yalnızca DOĞA OLAYI.</span> Sınır <b>kaynak sınırıdır</b>: tek araçlı trafik kazası acil durumdur (112 baş eder); kaynak yetmeyen çok yaralılı olay afete dönüşür ve bakım mantığı değişir (triyaj). Issız bir yerde (ör. okyanus ortası) olan deprem, heyelan, sel, volkanik patlama <b>asla afet sayılmaz</b>; afeti üreten orada bir toplumun bulunmasıdır.</p>

<p><b>Doğa olayı</b> (enerji boşalır) → <b>Maruziyet</b> (insan/yapı orada) → <b>Kırılganlık</b> (dayanıksız yapı, hazırlıksız toplum) → <b>AFET</b> (kayıp, kesinti, baş edememe).</p>
<ul><li>1. halka değiştirilemez; <b>2. ve 3. halka bizim elimizde</b> — afet yönetimi burada çalışır.</li>
<li><span class="warn">Yer seçimi ve imar kararları → 2. halka (maruziyet); zarar azaltma (mitigasyon) → 3. halka (kırılganlık).</span></li></ul>

<h3>7. Dört temel kavram</h3>

<tr><td>Maruziyet (exposure)</td><td>Tehlikenin etki alanındaki insan, yapı, değerler</td><td>Kim ve ne orada?</td></tr>
<tr><td>Zarar görebilirlik (vulnerability)</td><td>Maruz kalanların zarar görmeye açıklık derecesi</td><td>Ne kadar kırılgan?</td></tr>

<h3>8. Risk formülü</h3>
<p><span class="k">RİSK = Tehlike × Zarar Görebilirlik ÷ Kapasite</span></p>
<ul><li>Tehlikeyi <b>azaltamayız</b> (fayı durduramayız).</li>
<li>Zarar görebilirliği <b>azaltabiliriz</b>: sağlam yapı, doğru yer seçimi, güçlendirme.</li>
<li>Kapasiteyi <b>artırabiliriz</b>: eğitim, plan, tatbikat, kaynak, kurumsal yapı.</li>
<li>Kapasite paydada → arttıkça risk düşer. Riski düşürmenin iki yolu var, ikisi de insan elinde.</li>
<li><span class="warn">Formül nicel değil kavramsaldır; ders kitabında bu netlikte yoktur — Kadıoğlu'nun "Afet Yönetimi" kitabından alınmıştır.</span></li></ul>

<div class="tbl"><table><tr><th>Doğrudan</th><th>Dolaylı</th><th>İkincil</th></tr>

<tr><td>Yapı ve altyapı hasarı</td><td>Hizmetlerde aksamalar</td><td>Güvenlik ve asayiş sorunları</td></tr>

<p>Doğrudan = afetle <b>anında</b> (yıkılan fabrika); dolaylı = onun <b>sonucu, zaman alır</b> (üretim durur, işsizlik, gelir kaybı).</p>
<p><span class="warn">İkincil ETKİ ≠ İkincil AFET.</span> İkincil etki ekonomik-sosyal sonuçtur; <b>ikincil afet</b> (AFAD 2014) bir afetin tetiklediği <b>yeni afettir</b>: yangın, heyelan, baraj yıkılması, patlama, salgın, endüstriyel kaza.</p>

<li>Güncel adı: <b>NaTech</b> (Natural Hazard Triggered Technological Accident) — kitapta yok. 2023 örneği: İskenderun Limanı konteyner yangını.</li></ul>
<p><b>Başlıca sonuçlar (8):</b> can ve mal kaybı (ölüm, sakatlık, yaralanma, yetim kalma); altyapının bozulması; <b>uzun süreli psikolojik travma</b> (yıllarca); güvenlik ve düzenin zayıflaması; <b>bulaşıcı/salgın hastalıklar</b> (barınma-hijyen bozulması); ekonomik yapının bozulması; yaşam kalitesinin düşmesi; yatırımların gecikmesi/iptali (kalkınma planları askıya alınır).</p>

<h3>15. Etkinlik ve toparlama</h3>
<p>Haiti–Şili'ye sekiz faktörle bakınca: fakirlik, yapılaşma kültürü/alan kullanımı, çarpık kentleşme, önlem düzeyi <b>farklı</b> (Şili lehine); <b>fiziksel büyüklük Şili'de daha büyük</b> — tek doğal faktör Şili aleyhineydi, sonuç yine Şili lehine. "Farkı yaratan, depremin büyüklüğü değil; toplumun zarar görebilirliği ve baş etme kapasitesi oldu."</p>
<ol><li>Afet bir olay değil, sonuçtur.</li><li>Üç koşul birlikte aranır.</li><li>Risk dört bileşenden kurulur (tehlike, maruziyet, zarar görebilirlik, kapasite).</li><li>Sekiz faktörden yedisi insan kaynaklıdır.</li><li>Etkiler üç katmanda okunur (doğrudan, dolaylı, ikincil).</li><li>Afet aynı zamanda bir sağlık olayıdır.</li></ol>
<p>Dönem ödevi: kendi ilinin <b>AFAD İl Afet Risk Azaltma Planı (İRAP)</b>'ndan bir risk seçip analiz etmek. Ana kaynak: Tün (Ed.) 2018, Temel Afet Bilgisi, Bölüm 1 (B. Özmen); ek: Akbulut (Ed.) Doğal Afetler ve Afet Yönetimi; Kadıoğlu, Afet Yönetimi; AFAD Terimler Sözlüğü.</p>

<h3>1. Neden sınıflandırırız?</h3>
<p>Sınıflandırma bir etiketleme işi değil, <span class="k">saymanın ve planlamanın ön koşuludur</span>. Dört işi mümkün kılar:</p>
<ul>
<li><b>Saymak:</b> Kategori yoksa istatistik yoktur (ör. "sel" ile "taşkın" aynı mı sayılacak?).</li>
<li><b>Karşılaştırmak:</b> Ülkeler/yıllar arası karşılaştırma ancak ortak tanımla anlamlıdır.</li>
<li><b>Planlamak:</b> Depreme arama-kurtarma, sele tahliye, salgına izolasyon.</li>
<li><b>Kaynak ayırmak:</b> Hangi afetin ne kadar zarar verdiği bilinmeden bütçe/personel dağıtılamaz (TARAP gibi planlar bu istatistiklere dayanır).</li>
</ul>
<p>Mesleki karşılık: 112 komuta merkezi çağrıyı hangi kategoriye koyarsa ona göre ekip gönderir — <b>kategori, kaynağı belirler</b>.</p>

<h3>2. EM-DAT (Emergency Events Database)</h3>
<ul>
<li>Dünyada en yaygın kullanılan uluslararası afet veri tabanı (Türkçesi "Acil Olaylar / Afet Veri Tabanı").</li>
<li><span class="k">1988</span>'de <span class="k">CRED</span> (Centre for Research on the Epidemiology of Disasters – Afetler Epidemiyolojisi Araştırma Merkezi) tarafından kuruldu.</li>
<li><b>WHO ve Belçika Hükümeti</b> desteğiyle; <b>Brüksel'deki Louvain Katolik Üniversitesi</b> (CRED) tarafından işletilir. <span class="warn">WHO destekçidir, kurucu CRED'dir.</span></li>
<li>1900'den bugüne <b>18.000+</b> afet kaydı. Veri kaynakları: BM kuruluşları, STK'lar, sigorta şirketleri, araştırma enstitüleri, basın ajansları (çoğu ülkede merkezî güvenilir kayıt olmadığı için çeşitlilik zorunlu).</li>
<li>Amaç: insani yardıma hizmet + afete hazırlıkta karar vericilere sağlam veri.</li>
<li>CRED bir <b>epidemiyoloji</b> (halk sağlığı) merkezidir, mühendislik enstitüsü değil: afetin ölçüsü yıkılan bina değil, etkilenen insandır. Erişim: <b>emdat.be</b> (ücretsiz, akademik kullanım için kayıt).</li>
</ul>
<p><b>Kayıt ölçütleri</b> — <span class="warn">dördünden YALNIZCA BİRİ yeterli</span>:</p>
<ol>
<li><b>≥10 ölüm</b></li>
<li><b>≥100 etkilenen</b> (yaralanan, evsiz kalan, acil yardıma muhtaç)</li>
<li><b>Yerel imkânların yetmemesi</b> = merkezî hükümetten yardım istenmesi (afet–acil durum kapasite eşiğinin veri tabanındaki hâli)</li>
<li><b>Uluslararası yardım çağrısı</b></li>
</ol>
<p>Örnek: 9 ölü + 90 etkilenen + yardım istenmemiş → EM-DAT'a <b>girmez</b>; ama orada yaşayanlar için yine afet olabilir. <span class="warn">EM-DAT eşik altını göstermez; tüm rakamlar gerçeğin yalnızca eşiği aşan kısmıdır.</span></p>

<h3>3. EM-DAT sınıflandırması</h3>
<p>Önce ikiye: <b>doğa kaynaklı</b> (5 grup) ve <b>teknolojik</b> (3 grup).</p>
<div class="tbl"><table>
<tr><th>Doğa kaynaklı grup</th><th>Örnekler</th></tr>
<tr><td>Jeolojik (Geophysical)</td><td>Deprem, volkan patlaması, kütle hareketi (heyelan, kaya düşmesi)</td></tr>
<tr><td>Hidrolojik (Hydrological)</td><td>Sel, heyelan (su kaynaklı), dalga hareketi ve etkisi</td></tr>
<tr><td>Meteorolojik (Meteorological)</td><td>Fırtına, sis, aşırı sıcaklık</td></tr>
<tr><td>Klimatolojik (Climatological)</td><td>Kuraklık, buzul gölü patlaması, söndürülemeyen (orman) yangın</td></tr>
<tr><td>Biyolojik (Biological)</td><td>Salgın hastalık, böcek istilası, hayvan salgınları</td></tr>
</table></div>
<ul>
<li>Kodlama — tetikleyici: <b>yer</b> → jeolojik, <b>su</b> → hidrolojik, <b>hava</b> → meteorolojik, <b>iklim</b> → klimatolojik, <b>canlı</b> → biyolojik.</li>
<li><span class="warn">Meteorolojik = gün-hafta ölçeği (fırtına, sıcak hava dalgası); klimatolojik = ay-yıl ölçeği (kuraklık).</span></li>
<li><span class="warn">Heyelan tetikleyicisine göre sınıflanır:</span> depremin tetiklediği → jeolojik; aşırı yağışın tetiklediği → hidrolojik. Sınıflandırmalar kesin sınır değildir.</li>
</ul>
<div class="tbl"><table>
<tr><th>Teknolojik grup</th><th>Örnekler</th></tr>
<tr><td>Endüstriyel kazalar</td><td>Kimyasal dökülme, çökme, patlama, yangın, gaz sızıntısı, zehirlenme, radyasyon</td></tr>
<tr><td>Karışık / çeşitli kazalar</td><td>Sanayi dışı ortamlarda çökme, patlama, yangın, diğer</td></tr>
<tr><td>Ulaşım kazaları</td><td>Hava, kara, demir, deniz yolu</td></tr>
</table></div>
<ul>
<li>1900–2016: <b>8.361</b> teknolojik afet → <b>her üç afetten biri</b> teknolojik.</li>
<li>Tek araçlı kaza = acil durum; çok araçlı, yerel kaynakların yetmediği kaza = ulaşım kazası kategorisinde afet.</li>
<li>Deprem sonrası fabrika yangınının kategorisi tartışmalıdır → <b>NaTech</b> (11. hafta).</li>
</ul>

<h3>4. Türkiye'de kullanılan diğer sınıflandırmalar</h3>
<p><span class="warn">Türkiye'de ortak kabul gören bir afet sınıflandırması YOKTUR.</span> AFAD, Meteoroloji Genel Müdürlüğü, DSİ kendi sorumluluk alanlarına göre farklı sınıflandırma kullanır → aynı olay farklı kategoride kaydedilir, istatistikler karşılaştırılamaz. Sonuçlar: kurumlar arası veri karşılaştırılamaz, aynı olay iki kez/hiç sayılmayabilir, kaynak dağıtımı hatalı olur, uluslararası raporlamada tutarsızlık, akademik çalışmalar birbirini doğrulayamaz. "Yanlış sayılan afet, yanlış ayrılan bütçedir."</p>

<p><b>a) Kalkınma Bakanlığı (2014)</b> — Afet Yönetiminde Etkinlik Özel İhtisas Komisyonu raporu; <span class="k">en yalın</span>: ikiye ayırır.</p>

<tr><th>Doğa kaynaklı</th><th>İnsan kaynaklı</th></tr>

<li>Göç neden afet? <b>Kapasite eşiği</b>: kısa sürede barınma, sağlık, beslenme ihtiyacı yerel kapasiteyi aşar.</li>

<h3>5. Dünya afet istatistikleri</h3>
<p><b>En ölümcül on afet (geçen yüzyıl; Özceylan 2011, Tablo 1.3):</b> <span class="warn">hiçbiri deprem değil</span> — <b>6 kuraklık + 4 sel</b>; hepsi Çin, Hindistan, Sovyet Rusya'da.</p>
<div class="tbl"><table>
<tr><th>Ülke · Tür</th><th>Yaklaşık can kaybı</th></tr>
<tr><td>Çin · Sel</td><td>3.700.000 (en ölümcül tek afet)</td></tr>
<tr><td>Çin · Kuraklık</td><td>3.000.000</td></tr>
<tr><td>Çin · Sel</td><td>2.000.000</td></tr>
<tr><td>Hindistan · Kuraklık</td><td>1.500.000 ve 1.250.000 (iki ayrı olay)</td></tr>
<tr><td>Sovyet Rusya · Kuraklık</td><td>1.200.000 — Volga havzası ve Güney Urallar, 1921</td></tr>
</table></div>
<ul>
<li>Neden kuraklık/sel? (1) yavaş gelişir, müdahale gecikir, "acil" sayılmaz; (2) çok geniş alan; (3) ölüm <b>dolaylı</b> (kıtlık → açlık, hastalık). Müdahale arama-kurtarma değil, <b>halk sağlığı</b> işi.</li>
<li>Coğrafya: kalabalık, tarıma bağımlı, kırılgan nüfuslar → "tehlike değil, <b>zarar görebilirlik</b>".</li>
<li>Sovyet Rusya kaydı: kitap/EM-DAT "Sovyetler Birliği" der, ama SSCB Aralık 1922'de kuruldu. 1920–21 kuraklığı + iç savaş + zorla tahıl toplama + çöken ulaşım → kıtlık. 1,2 milyon EM-DAT rakamı; tarihçi tahminleri ~5 milyona kadar.</li>
</ul>
<p><b>EM-DAT bilançosu (1900–2016):</b></p>
<div class="tbl"><table>
<tr><th>Gösterge</th><th>Değer</th></tr>
<tr><td>Doğa kaynaklı afet</td><td>14.145</td></tr>
<tr><td>Teknolojik afet</td><td>8.361 (≈ toplamın üçte biri)</td></tr>
<tr><td>Can kaybı (doğal afetler, 1900'den beri)</td><td>≈ 33 milyon (Türkiye nüfusunun ~1/3'ü)</td></tr>
<tr><td>Evsiz kalan</td><td>174 milyon</td></tr>
<tr><td>Toplam maddi kayıp</td><td>≈ 3 trilyon $ (yalnızca doğrudan kayıp)</td></tr>
</table></div>
<p><b>Afetler artıyor mu?</b> EM-DAT grafikleri 1980'lerden itibaren ciddi artış gösterir. Nedenler:</p>
<ul>
<li><b>Gerçek artış:</b> iklim değişikliğiyle aşırı hava olaylarının sıklık/şiddeti artıyor.</li>
<li><b>Maruziyet artışı:</b> hızlı nüfus artışı, çarpık kentleşme.</li>
<li><b>Zarar görebilirlik artışı:</b> yanlış arazi kullanımı, yer seçimi, çevre kirliliği, doğal dengenin bozulması.</li>
<li><b>Kayıt kapasitesi artışı:</b> haberleşme/kayıt sistemleri geliştikçe daha çok olay kayda geçiyor (1920'de Afrika içindeki sel kaydedilmezdi).</li>
<li>Dünya Bankası: plansız şehirleşme sürerse <b>2050</b>'de deprem, fırtına ve sele maruz kalan insan sayısı <b>iki katına çıkarak 1,5 milyar</b> olacak.</li>
</ul>
<p><b>En maliyetli beş afet (1980–2011)</b> — hepsi gelişmiş ülkelerde:</p>
<div class="tbl"><table>
<tr><th>Sıra · Ülke, yıl</th><th>Olay</th><th>Kayıp</th></tr>
<tr><td>1. Japonya, 2011</td><td>Deprem ve tsunami</td><td>210 milyar $</td></tr>
<tr><td>2. ABD, 2005</td><td>Katrina Kasırgası</td><td>125 milyar $</td></tr>
<tr><td>3. Japonya, 1995</td><td>Kobe depremi</td><td>100 milyar $</td></tr>
<tr><td>4. Çin, 2008</td><td>Wenchuan depremi</td><td>85 milyar $</td></tr>
<tr><td>5. ABD, 1994</td><td>Northridge depremi</td><td>44 milyar $</td></tr>
</table></div>
<ul>
<li><span class="warn">En maliyetli → gelişmiş ülkeler; en ölümcül → yoksul ülkeler.</span> Gelişmişte kaybedilecek değer fazla, can kaybı düşük (sağlam yapı, çalışan sistem).</li>
<li>Mutlak kayıp ≠ göreli etki: yoksul ülkedeki küçük kayıp millî gelire oranla çok daha yıkıcı olabilir.</li>
<li>En maliyetli listede en çok tekrar eden tür: <b>deprem</b>.</li>
</ul>
<p><b>Dünya Bankası:</b> doğa kaynaklı afetlerin <span class="k">%9</span>'u az gelişmiş ülkelerde, ama can kaybının <span class="k">%48</span>'i orada. Mesaj: "<b>direnç kültürü</b>" geliştirilmeli; <b>önleme bütçeleri en az yardım bütçeleri kadar</b> büyütülmeli — önleme, müdahaleden ucuzdur.</p>

<h3>6. Türkiye afet istatistikleri</h3>
<p>Kitabın uyarısı: Türkiye'de afet sayıları hakkında doğru ve güvenilir bilgiye ulaşmak son derece zordur.</p>
<p><b>Türkiye'nin afet profili — Barış (2012):</b> başlıca dört tip: deprem, heyelan, sel, yangınlar.</p>
<div class="tbl"><table>
<tr><th>Afet</th><th>Rakamlar</th></tr>
<tr><td>Deprem</td><td>Nüfusun <b>%70</b>'i çok yüksek tehlikeli bölgede; ülkenin <b>%66</b>'sı aktif fay bölgesinde; geçen yüzyılda hasar gören binaların <b>%75</b>'i ve toplam afet kayıplarının <b>%64</b>'ü depremden</td></tr>
<tr><td>Heyelan</td><td>Toprakların <b>%25</b>'i maruz; nüfusun <b>%11</b>'i heyelanlı bölgede; zararların <b>%16</b>'sı</td></tr>
<tr><td>Sel</td><td>Orman kayıpları, erozyon, bilgisiz gelişme → çok savunmasız; zararların <b>%15</b>'i; yıllık ~<b>100 milyon $</b></td></tr>
<tr><td>Yangınlar</td><td>Her yıl çok sayıda orman, işyeri, konut yangını</td></tr>
</table></div>
<ul>

<p><b>Afetzede</b> (AFAD 2014; <b>7269 sayılı Umumi Hayata Müessir Afetler Kanunu, 1959</b> — Türkiye'nin temel afet kanunu): olmuş ya da olması muhtemel afet ve acil durumlardan dolayı <b>fiziksel, sosyal ve ekonomik</b> yönden zarara uğrayan <b>veya uğraması muhtemel</b> kişi.</p>
<ul>
<li><span class="warn">Yalnızca yaralanan değil!</span> Risk nedeniyle tahliye edilen, zarar görmemiş aile de afetzededir.</li>

<h3>7. Sağlık boyutu (afet epidemiyolojisi)</h3>
<p><span class="k">Afet epidemiyolojisi</span>: afetlerin toplum sağlığına etkilerini sayısal olarak inceleyen bilim dalı (CRED de bir epidemiyoloji merkezi).</p>
<ul>
<li><b>Ölü/yaralı oranı</b> (AYAY için en önemli gösterge): depremde yaralı > ölü (1 ölüme 2-3 yaralı; kurtarılabilir hasta çok); <span class="warn">sel ve tsunamide oran tersine döner — boğulma hâkim, yaralı az</span>. Kaç ambulans/yatak gerektiğini belirler.</li>
<li><b>Etkilenen nüfus</b> can kaybından kat kat büyük: barınma, beslenme, kronik ilaç, temiz su, psikososyal destek.</li>
<li><b>Biyolojik afetler</b> EM-DAT'ta ayrı (doğa kaynaklı) kategori; COVID-19 sağlık sistemini tek başına kilitleyebileceğini gösterdi (sağlık çalışanlarının da etkilendiği ender tür).</li>
</ul>

<h3>Deprem nedir?</h3>
<p><span class="k">Deprem</span>: Yerkabuğu içindeki <b>kırılmalar</b> nedeniyle ani olarak ortaya çıkan titreşimlerin <b>dalgalar hâlinde yayılarak</b> geçtikleri ortamları ve yeryüzeyini sarsma olayı (kitap s. 27). Merkezde kırılma vardır; sarsıntı onun sonucudur. Enerji kaynaktan uzaklaştıkça azalır.</p>
<p><span class="k">Sismoloji</span>: Depremlerin oluş nedenlerini, dalgaların yayılımını, ölçülmesini ve deprem tehlikesini inceleyen jeofizik mühendisliği uzmanlık alanı. Yerin iç yapısını sismik dalgaların davranışından çıkarırız.</p>

<h3>Elastik geri sekme kuramı</h3>
<p>H. F. <b>Reid</b>, <b>1906 San Francisco</b> depreminden sonra. Deprem = <b>sürtünmenin yenildiği an</b>.</p>
<ol>
<li><b>Sıkışma</b>: Levhalar iter, sürtünme engeller; kayaç bükülür, elastik enerji biriktirir.</li>
<li><b>Eşik aşılır</b>: Kuvvet sürtünme direncini aşar; kayaç çok kısa sürede, şok niteliğinde kırılır.</li>
<li><b>Geri sekme</b>: Kayaç yay gibi eski şekline döner; <b>potansiyel → kinetik</b> enerji.</li>
<li><b>Yayılma</b>: Enerji sismik dalgalar hâlinde yayılır, uzaklaştıkça azalır.</li>
</ol>
<ul>
<li><span class="warn">Enerji deprem anında ÜRETİLMEZ; yıllarca birikmiş enerji SALINIR.</span> Bu yüzden uzun süre kırılmamış segmentler daha tehlikeli → <span class="k">sismik boşluk</span>.</li>
<li>Cetvel benzetmesi: bükerken enerji birikir, kırılınca parçalar yerine döner, titreşim duyulur.</li>
<li>"Küçük depremler büyüğü önler mi?" → <b>Hayır</b>: 1 Mw 7,0 ≈ <b>32.000</b> Mw 4,0 deprem enerjisi.</li>
</ul>

<h3>Sayılarla deprem</h3>
<ul>
<li>Dünyada yılda <b>~500.000</b>, Türkiye'de <b>~23.000</b> deprem saptanır (≈ yirmide biri; günde 60'tan fazla). Türkiye dünya kara yüzeyinin <b>binde ikisi</b>.</li>
<li>Çoğu <b>mikro/ultra mikro</b> (M &lt; 3) → yalnızca cihazla saptanır, hissedilmez.</li>
<li>Türkiye topraklarının <b>%96</b>'sı deprem kuşağında. Başlıca kuşaklar: <b>Kuzey Anadolu Fayı, Doğu Anadolu Fayı, Ege Çöküntü Fay Sistemi</b>.</li>
<li>Son 70 yılda afet kaynaklı can ve mal kaybı: <b>deprem %62</b>, heyelan %15, su baskını %14, kaya düşmesi %5, yangın %4, çığ ve diğer %1.</li>
<li><span class="warn">%62 kayıp oranıdır, olay sayısı değil</span>: en SIK afet heyelan, en çok CAN alan deprem.</li>
<li>Afet olan deprem değil, hazırlıksız yakalanan yerleşimdir ("afet olay değil sonuçtur").</li>
</ul>

<tr><td>Ortam</td><td>Katı, sıvı, gaz</td><td>Yalnız katı; <b>sıvı ve gazdan geçemez</b></td></tr>

<ul>
<li><span class="k">Yüzey dalgaları</span>: en yavaş ama <b>genliği en büyük</b>; <b>Love</b> (hızı daha yüksek) ve <b>Rayleigh</b> (genliği daha büyük). <span class="k">Genlik</span>: dalganın yol açtığı yer değiştirmenin büyüklüğü.</li>
<li>Yapılardaki yıkımı <b>S ve yüzey dalgaları</b> üretir; P yalnızca haber verir.</li>
<li>S sıvıdan geçemez çünkü sıvı <b>kesme (makaslama)</b> kuvvetine direnç göstermez; sıkıştırmaya ise direnç gösterir → P geçer. Denizaltı depreminde gemideki ani çarpma hissini <b>P</b> yapar.</li>
<li>100 km uzaklıkta P ≈ 15 sn, S ≈ 30 sn'de ulaşır; aradaki süre uyarı için kullanılır. Uzaklık arttıkça fark büyür; dış merkeze çok yakında ≈ 0.</li>

<h3>S dalgası gölge bölgesi</h3>

<li><span class="k">Gölge bölgesi</span>: dalganın ulaşamadığı, kaydedilemediği yeryüzü alanı.</li>
<li>P dalgasının da gölge bölgesi var (<b>~104°–140°</b>): durmaz, dış çekirdekte yavaşlayıp kırılarak yön değiştirir.</li>
</ul>

<h3>Odak, dış merkez, derinlik</h3>
<ul>
<li><span class="k">Odak (hiposantr)</span>: yerin içinde enerjinin açığa çıktığı nokta. <span class="k">Dış merkez (episantr)</span>: odağa en yakın yeryüzü noktası (iz düşümü). Hypo = alt, epi = üst.</li>
<li>Dış merkez <b>genellikle</b> en çok hasar ve en kuvvetli sarsıntı yeridir; ikisi de gerçekte <b>alan</b>dır, pratikte nokta kabul edilir; dış merkez alanının büyüklüğü şiddete bağlıdır.</li>
<li>Haberlerdeki il–ilçe = dış merkez. <span class="warn">Deprem odakta olur; dış merkez onun haritadaki karşılığıdır.</span></li>
<li><span class="k">Odak derinliği</span>: enerjinin açığa çıktığı noktanın yeryüzünden en kısa uzaklığı.</li>
</ul>
<div class="tbl"><table>
<tr><th>Tür</th><th>Derinlik</th><th>Özellik</th></tr>
<tr><td>Sığ</td><td>0–70 km</td><td>Dar alanda hissedilir, <b>çok büyük hasar</b>. Türkiye: 0–60 km, şehirlerin altında çoğunlukla 5–10 km</td></tr>
<tr><td>Orta</td><td>70–300 km</td><td>Daha çok yitim zonlarında</td></tr>
<tr><td>Derin</td><td>300–700 km</td><td>Çok geniş alanda hissedilir, <b>hasar az</b> (enerji sönümlenir); neredeyse yalnız yitim zonları</td></tr>
</table></div>
<ul>
<li><span class="warn">Sezgiye ters: aynı büyüklükte sığ deprem daha çok hasar yapar</span> (10 km &gt; 400 km). "Derin depremler daha az hasar yapar" → doğru.</li>
<li>Türkiye için: aynı magnitüd daha ağır hasar; sığ + yakın = erken uyarı için az saniye.</li>
<li>Sağlık: sığ deprem = <b>yoğunlaşmış talep</b>; yerel hastane/112/ambulans ilk saatte doyar → bölge dışı destek (UMKE, çevre il ambulansları, sahra hastanesi) ilk saatlerde başlatılmalı.</li>
</ul>

<h3>Örnek olay: 1985 Meksika</h3>
<ul>
<li>19 Eylül 1985, 07.17; Michoacán kıyısı açıkları, okyanus levhasının Meksika altına daldığı yer; <b>Mw 8,0</b>; ≈ <b>10.000</b> can kaybı (resmî ~5.000).</li>
<li>Dış merkez kıyısı <b>sert kaya</b>, alçak yapılar → görece sınırlı hasar. En ağır yıkım <b>350 km'den uzak Mexico City</b>: eski <b>Texcoco Gölü</b> yatağı, yumuşak suya doygun kil.</li>
<li>Kilin doğal titreşim süresi ~<b>2 sn</b> = <b>6–15 katlı</b> binaların süresi → <b>rezonans</b>. 412 bina çöktü, 3.000+ ağır hasar; Juárez Hastanesi de yıkıldı.</li>
<li><span class="k">Zemin büyütmesi</span>: yumuşak zeminin dalga genliğini artırması ve sarsıntıyı uzatması. Türkiye örneği: 1999 Gölcük dış merkezli depremde ~100 km uzaktaki <b>Avcılar</b>.</li>
<li><span class="warn">Sevk planı dış merkeze göre başlar ama sahadan gelen hasar/şiddet bilgisine göre güncellenmeli.</span></li>
</ul>

<h3>Büyüklük (magnitüd)</h3>
<ul>
<li>Açığa çıkan <b>enerjinin</b> ölçüsü; zemin hareketinden hesaplanan <b>aletsel</b> değer; ondalıklı (7,7); <b>tek değer</b>, yere göre değişmez.</li>
<li><b>Richter (1935)</b>: dış merkezden <b>100 km</b>, <b>sert zemin</b>deki sismografla kaydedilen zemin hareketinin mikron cinsinden maksimum genliğinin <b>10 tabanına göre logaritması</b>.</li>
<li>Logaritmik: +1 birim → genlik <b>10 kat</b>, enerji <b>~31,6 kat</b>. 7,7 = 6,7'nin ~32, 5,7'nin ~1000 katı enerji.</li>
<li><span class="k">Sismograf/sismometre</span>: yer hareketini kaydeder; bugün sayısal, eş zamanlı.</li>
</ul>
<div class="tbl"><table>
<tr><th>Ölçek</th><th>Dayanak</th><th>Not</th></tr>
<tr><td>Ml (yerel)</td><td>Richter'in özgün ölçeği</td><td>Küçük, yakın depremler; büyükte (~6,5–7 üstü) <b>doyuma ulaşır</b> → düşük gösterir</td></tr>
<tr><td>Mw (moment)</td><td>Fay alanı, kayma miktarı, kayaç direnci</td><td>Doyuma ulaşmaz; büyük depremlerde <b>uluslararası standart</b>; AFAD ve Kandilli kullanır (Pazarcık Mw 7,7; Şili 1960 Mw 9,5)</td></tr>
<tr><td>Ms / Mb / Md</td><td>Yüzey dalgası / cisim dalgası / süre</td><td>Belirli deprem ve mesafe aralıkları</td></tr>
</table></div>

<h3>Şiddet</h3>
<ul>
<li>Depremin yapılar, canlılar ve yeryüzünde yarattığı <b>etki</b>; göreceli; <b>gözlemle</b> belirlenir, <span class="warn">istasyonlarca hiçbir zaman kaydedilmez</span>.</li>
<li>I–XII, <b>Romen rakamı</b>, tam sayı; <b>her yerleşim için ayrı</b> (ör. aynı depremde Kahramanmaraş IX, Adana VI, Ankara III).</li>
<li>Belirleyenler: büyüklük, dış merkeze uzaklık, odak derinliği, <b>zemin</b>, <b>yapı stoku</b> (son ikisi insan eliyle değiştirilebilir).</li>
<li>Cetveller: <b>MSK</b> (Medvedev–Sponheuer–Karnik, UNESCO 1965) – Türkiye; <b>EMS</b> – Avrupa Birliği; <b>JMA</b> – Japonya.</li>
</ul>
<div class="tbl"><table>
<tr><th></th><th>Büyüklük</th><th>Şiddet</th></tr>
<tr><td>Neyin özelliği</td><td>Depremin</td><td>Yerin</td></tr>
<tr><td>Ölçtüğü</td><td>Açığa çıkan enerji</td><td>Yapı, canlı, arazideki etki</td></tr>
<tr><td>Nasıl</td><td>Aletle (sismometre)</td><td>Gözlemle</td></tr>
<tr><td>Yazım</td><td>Ondalıklı Arap: 7,7</td><td>Tam sayı Romen: IX</td></tr>
<tr><td>Değer sayısı</td><td>Tek</td><td>Her yerleşim için ayrı</td></tr>
<tr><td>Örnek</td><td>Mw 7,7</td><td>MSK IX (Çok Yıkıcı)</td></tr>
</table></div>
<ul>
<li>Yaklaşık karşılıklar (AFAD, birebir değil, deneysel): <b>VIII ≈ 6,2; IX ≈ 6,6; X ≈ 7,3; XI ≈ 7,8</b>.</li>
<li>Hoparlör benzetmesi: watt = magnitüd; kulağa gelen ses = şiddet.</li>
<li><span class="warn">"Şiddeti 5,8 olan deprem" cümlesinde 3 hata</span>: (1) kavram – 5,8 magnitüddür; (2) yazım – şiddet ondalıklı olmaz; (3) tek değer varsayımı. Doğrusu: "Elazığ'da <b>büyüklüğü 5,8</b> olan bir deprem; Sivrice'de şiddet <b>VII (Hasar Yapıcı)</b>."</li>
<li>Mesleki: 6 Şubat'ta "Mw 7,7, Pazarcık" 11 ilde 53.537 can kaybını söylemedi; kaynak dağıtımı hasar/şiddet bilgisiyle şekillendi. AFAD şiddet/hasar tahmin haritaları bu işi görür.</li>
</ul>

<h3>MSK cetveli örnek dereceler</h3>
<p>Her derece 3 başlıkta tarif edilir: <b>kişi ve çevre</b>, <b>yapı</b>, <b>arazi</b> üzerindeki etki. "Az / çok / pek çok" ≈ <b>%5 / %50 / %75</b>.</p>

<tr><th>Derece</th><th>Tarif</th></tr>

<tr><td>III – Hafif</td><td>Ev içinde az kişi hisseder; hafif kamyonet geçişi gibi</td></tr>
<tr><td>VIII – Yıkıcı</td><td>Korku, panik; ağır mobilyalar yer değiştirir; C'de orta, B ve A'da ağır hasar/yıkıntı; boruların <b>ek yerleri</b> kırılır</td></tr>
<tr><td>IX – Çok Yıkıcı</td><td>Genel panik; C'de ağır hasar, B ve A'da yıkıntı; yeraltı boruları kırılır, raylar eğrilir; zemin çatlakları, kaya düşmesi, heyelan</td></tr>
<tr><td>XII – Yok Edici</td><td>Toprak altı ve üstündeki tüm yapılar yıkılır; yer yüzeyi büsbütün değişir</td></tr>
</table></div>
<div class="tbl"><table>
<tr><th>Yapı tipi</th><th>Örnek</th></tr>
<tr><td>A</td><td>Kerpiç, moloz taş, kırsal konut</td></tr>
<tr><td>B</td><td>Tuğla, yarım kâgir, beton briket</td></tr>
<tr><td>C</td><td>Betonarme, iyi yapılmış ahşap</td></tr>
</table></div>
<ul>
<li>Cetvel bile hasarın yapı kalitesine bağlı olduğunu kabul eder ("afet sonuçtur").</li>
<li>VIII ve üzeri: yeraltı borularının kırılması → <b>su ve sanitasyon</b> = travmadan sonraki ikinci sağlık sorunu.</li>
</ul>

<h3>Deprem tahmini</h3>
<div class="tbl"><table>
<tr><th></th><th>Deterministik kestirim</th><th>Olasılığa dayalı tahmin</th></tr>
<tr><td>Kalıp</td><td>"Şu tarihte, şurada, şu büyüklükte"</td><td>"Şu bölgede, şu sürede, şu olasılıkla"</td></tr>
<tr><td>İçerik</td><td>Yer, zaman, büyüklük kesin; olasılık ~%100 iddiası</td><td>Güvenilir veri; belirsizlik açıkça tanımlı; sonuç olasılık</td></tr>

<ul>
<li>Türkiye Deprem Tehlike Haritası (2018): bir bölgede <b>50 yılda %10 aşılma olasılığıyla</b> beklenen yer ivmesi. Tahmin tarih vermek için değil, bina yapmak için.</li>
<li><b>Ergünay ve Özmen (2013)</b> – bilim insanı–kamuoyu iletişiminin 4 ilkesi: (1) <b>vicdani görev ve etik açıklama</b> (basit, doğru, açık; ün/dalkavukluk/kazanç amacı yok), (2) <b>kişisel sorumluluk</b>, (3) <b>ayaküstü ve muğlak açıklamalardan kaçınma</b> (uygulanamaz önerilerden de), (4) <b>önce kurumlara, sonra halka</b>.</li>
</ul>

<h3>Örnek olay: L'Aquila (İtalya)</h3>
<ul>
<li>6 Nisan 2009, <b>6,3</b>; <b>309 ölü</b>, 1.500 yaralı, ~20.000 kullanılamaz yapı. Tarihe davayla geçti.</li>
<li>Öncesi: Aralık 2008'den itibaren 2–4 büyüklüğünde <b>300+</b> deprem. Bir laboratuvar teknisyeni <b>radon</b> ölçümüne dayanarak <b>29 Mart</b> için büyük deprem duyurdu → panik.</li>
<li>31 Mart: 7 kişilik heyet; basına "<b>enerji boşaldı, tehlike yok</b>" mesajı yansıdı.</li>
<li>Dava: savcı depremin kestirilemeyeceğini <b>kabul etti</b>; suçlama "eksik, çelişkili ve muğlak ifadelerle halkı yanlış bilgilendirme". 2012: istenen 4 yıl → 6 yıl, 12 milyon $ tazminat; sonra üst mahkeme çoğunu beraat ettirdi (kitapta yok).</li>
<li>Tartışma: bilim insanı bulmak zorlaşır; bir görüş: asıl sorumlu yıkılan yapıları yapanlar ve izin verenler.</li>
<li>Doğru tutum: <b>belirsizliği belirsizlik olarak iletmek</b>. <span class="k">Radon</span>: kayaçlardaki doğal radyoaktif gaz; güvenilir öncü işaret değil.</li>
</ul>

<h3>Deprem erken uyarı sistemi</h3>
<p><span class="warn">Erken uyarı tahmin değildir</span>: deprem OLDUKTAN sonra, kaynağında saptanarak halkın uyarılması ve/veya kritik tesislerin devre dışı bırakılmasıdır (kitap s. 39).</p>
<ol>
<li>Deprem olur → en yakın istasyonlar algılar</li>
<li>P dalgası saptanır → yer ve büyüklük hesaplanır</li>
<li>Sinyal otomatik iletilir (elektrik sinyali S'den çok hızlı)</li>
<li>S dalgası gelmeden kritik sistemler devre dışı</li>
</ol>
<ul>
<li>Süre: uzaklığa bağlı, <b>birkaç saniye – 1 dakika</b>; dış merkeze çok yakında ≈ 0.</li>
<li>Kullanım: yüksek gerilim hatlarını kesme, kimyasal tesis/rafineri durdurma, metro ve hızlı tren yavaşlatma, asansörleri kat hizasında durdurma, jeneratör çalıştırma. <b>Sağlık</b>: ameliyatı durdurma, tıbbi gaz hatlarını kapatma, hastane asansörlerini boşaltma, yoğun bakım jeneratörünü hazırlama.</li>
<li>İlk örnek: <b>Japon Demiryolları</b>, 1960'lar, mekanik alarmlı sismograf (hızlı trenler). En bilinen: <b>UrEDAS</b> (Japonya).</li>
<li>Sistem kuranlar: Japonya, Meksika, Romanya, Tayvan, İsviçre, İtalya, Türkiye, ABD. Uzaklık saniyeyi belirler: Mexico City ~300 km, Bükreş ~150 km, Taipei ~120 km.</li>
<li>Türkiye dezavantajı: %96 deprem kuşağı, şehirler fay üzerinde, sığ depremler → sistem şehre değil <b>bölgeye</b> göre düşünülmeli. Öncelik: algoritması test edilmiş hızlı uyarı. KRDAE projesi: <b>İstanbul Deprem Erken Uyarı ve Acil Müdahale Sistemi</b>.</li>
<li>Bazı araştırmacıların "tahmin" yerine "erken uyarı" demesi önemli bir yanlıştır; yanlış algı yaratır.</li>
<li><span class="warn">Erken uyarı binayı sağlamlaştırmaz</span>; zarar azaltmanın yerine geçmez, yanına eklenir.</li>
</ul>

<h3>1. Fay nedir?</h3>
<p><span class="k">Fay</span>: yerkabuğundaki kırılma düzlemi boyunca iki bloğun birbirine göre yer değiştirdiği yapı. <b>Deprem</b> bu düzlemdeki ani hareketle oluşur.</p>
<ul>
<li><span class="k">Tavan blok</span> (hanging wall) = fay düzleminin <b>üstündeki</b> blok; <span class="k">taban blok</span> (footwall) = <b>altındaki</b> blok. Adlandırma madencilikten: başın üstü tavan, ayağın bastığı taban. Şekillerde (ilk üç şekil) tavan blok <b>sağdaki</b> bloktur.</li>
<li>Faylar yatay, düşey ya da eğimli olabilir; eğim açısı kırık boyunca genellikle benzerdir.</li>
<li><span class="k">Gömülü fay</span>: yüzeyde iz bırakmaz ama derinde deprem üretir. <span class="warn">Haritada fay çizgisi görünmemesi fay olmadığı anlamına gelmez.</span></li>
</ul>

<h3>2. Fay türleri (atım yönüne göre)</h3>
<p>Hareket yönünü bölgedeki <b>gerilme rejimi</b> (çekme mi, sıkışma mı) belirler.</p>
<div class="tbl"><table>
<tr><th>Tür</th><th>Rejim / hareket</th><th>Örnek</th></tr>
<tr><td>Normal fay</td><td>Çekme; tavan blok <b>AŞAĞI</b>; kabuk incelir; yüzeyde fay dikliği (basamak)</td><td>Ege Çöküntü Fay Sistemi</td></tr>
<tr><td>Ters fay</td><td>Sıkışma; tavan blok <b>YUKARI</b>; kabuk kalınlaşır</td><td>—</td></tr>
<tr><td>Bindirme</td><td>Ters fayın özel hâli; <b>düşük açılı</b> (yataya yakın) düzlem; tavan blok uzun mesafe ilerler, tabakalar kıvrılır, dağ kuşakları oluşur</td><td>Bitlis Bindirmesi</td></tr>
<tr><td>Doğrultu atımlı</td><td>Yanal (yatay) kayma; fayı kesen yol ötelenir (şekil üstten okunur)</td><td>KAF (sağ), DAF (sol)</td></tr>
</table></div>
<ul>
<li><span class="k">Yanal atımlı oblik fay</span>: iki atım türüne birden sahip fay; doğada saf hareket nadirdir.</li>
<li>Normal faylarda depremler <b>sık ve küçük</b> (Ege'de kısa parçalar), doğrultu atımlı faylarda <b>seyrek ve büyük</b> (yüzlerce km kesintisiz kırılma). Bu yüzden Ege ile Kuzey/Doğu Anadolu'nun hazırlık stratejisi farklıdır.</li>
<li>Tavan blok yukarı çıkmışsa → <b>sıkışma</b>.</li>
</ul>
<p><span class="warn">Normal = çekme (iner); ters ve bindirme = sıkışma (çıkar); doğrultu atımlı = yanal kayma.</span></p>

<h3>3. Sağ yönlü / sol yönlü, horst ve graben</h3>
<ul>
<li>Yön, fayın kestiği dere/yol/duvarın ötelenmesine bakılarak belirlenir: fayın bir yanında durup karşıya bak; karşı bloktaki nesne <b>sağa</b> kaymışsa <span class="k">sağ yönlü</span>, <b>sola</b> kaymışsa <span class="k">sol yönlü</span>. Hangi taraftan bakılırsa bakılsın sonuç aynıdır.</li>
<li><b>Sağ yönlü</b>: Kuzey Anadolu Fayı, San Andreas Fayı. <b>Sol yönlü</b>: Doğu Anadolu Fayı (6 Şubat 2023 Pazarcık).</li>
<li><span class="k">Graben</span>: iki yanı normal faylarla sınırlı, <b>aşağı düşmüş</b> çöküntü (Büyük ve Küçük Menderes ovaları). <span class="k">Horst</span>: iki yanı normal faylarla sınırlı, <b>yükselmiş</b> alan (ovaları ayıran dağ sıraları).</li>
<li>Ege coğrafyası: doğu–batı uzanan graben ovaları (İzmir, Manisa, Aydın, Denizli), aradaki horst dağları, kıyıda koy–körfez–yarımada dizilimi.</li>
<li><span class="warn">Paradoks:</span> graben ovaları verimli ve düz olduğu için yoğun nüfusludur, ama alüvyal zemin sarsıntıyı büyütür.</li>
</ul>

<h3>4. Aktif (diri) fay</h3>
<p><span class="k">Aktif fay</span>: son on bin yıl içinde deprem üretmiş ve/veya yüzey faylanmasına yol açmış, gelecekte de deprem üretme potansiyeli olan fay.</p>
<ul>
<li>Çoğu ülkede ölçüt: <b>son 11.000 yıl (Holosen)</b>. Holosen = son buzul çağının bitişinden (~11.700 yıl önce) bugüne.</li>
<li>Nükleer santral gibi kritik yapılarda süre <b>500.000 yıla</b> kadar uzatılabilir (risk = tehlike × sonucun ağırlığı; sonuç ağırlaştıkça kabul edilebilir belirsizlik azalır).</li>
<li>Türkiye'de yüzey faylanması oluşturan depremler genellikle <b>M &gt; 6,0</b> ve <b>derinlik &lt; 20 km</b>.</li>
<li>Ölçüt jeolojik kayda dayanır: tekrarlanma aralığı yüzlerce–binlerce yıl olabilir; 500 yıldır sessiz fay "ölü" değildir.</li>
</ul>
<p><b>Aktif fay belirteçleri</b> (MTA diri fay haritası bunlara göre hazırlandı):</p>
<div class="tbl"><table>
<tr><th>Grup</th><th>İçerik</th></tr>
<tr><td>Morfolojik izler</td><td>Çizgisel vadi, asılı vadi, ani diklik, basınç sırtı, uzamış sırt, çöküntü gölcüğü</td></tr>
<tr><td>Ötelenmiş genç çökeller</td><td>Kaymış akarsu yatakları, taraçalar, alüvyal yelpazeler; çökel kalınlığında ani fark</td></tr>
<tr><td>Sismolojik veriler</td><td>İç merkez dizilimi, odak parametrelerinden yer değiştirme yönü/miktarı, yüzey yırtılmaları</td></tr>
<tr><td>Jeodezik ve arkeolojik</td><td>Uydu/yer ölçümüyle güncel hareket; tarihsel yapılarda faylanma izi, ötelenmiş yapay nesneler</td></tr>
</table></div>
<p><b>MTA sınıflaması:</b> (1) deprem yüzey kırığı – 1900'den bugüne; (2) Holosen fayı – son 11.000 yıl; (3) Kuvaterner fayı – son <b>1.600.000</b> yıl; (4) Kuvaterner öncesi fay/çizgisellik.</p>
<p>Örnek: 1999'da Gölcük ve Sapanca çevresinde yollar, duvarlar, çitler ötelendi; atım yer yer <b>4–5 m</b> — faylanmanın doğrudan kanıtı.</p>

<h3>5. Paleosismoloji</h3>
<ul>
<li>Aletsel kayıt ~1900'den beri var; daha eskisi için fay üzerinde <b>hendek</b> açılır, kesilmiş toprak katmanları tarihlendirilir (ör. Karbon-14).</li>
<li>Yakın jeolojik dönemi (<b>~40.000 yıl</b>) kapsar; <b>jeoloji mühendislerince</b> yapılır; diri fay araştırmalarında <b>zorunludur</b>.</li>
<li>Verdikleri: en büyük deprem büyüklüğü, <b>tekrarlanma periyodu</b>, maksimum kırılma uzunluğu, yer değiştirme miktarı.</li>
<li>Kitap örneği: <b>1939 Erzincan</b> yüzey kırığında hendek (Emre vd., 2012).</li>
<li><span class="warn">Tekrarlanma periyodu istatistiksel ortalamadır, takvim değildir.</span> Paleosismoloji tarih vermez; yönetmelik verir.</li>
</ul>

<h3>6. "Evimin altından fay geçmiyor, güvendeyim" — Hayır</h3>
<ul>
<li><b>Sarsıntı yayılır</b>: 1999 Marmara depremi İstanbul, Bolu, Ankara'da hissedildi.</li>
<li><b>Gömülü faylar</b> haritada görünmez.</li>
<li><b>Zemin</b> sarsıntıyı büyütür (alüvyal, gevşek, suya doygun). 1985 Meksika: dış merkez 350 km uzakta, eski göl yatağında sarsıntı 5 katına çıktı. 1999 Adapazarı: büyütme + sıvılaşma.</li>
<li><b>Asıl belirleyici bina</b>: aynı sokakta biri ayakta kalır, biri yıkılır.</li>
<li>Şiddeti belirleyen dört etkenden ikisi (<b>zemin ve bina</b>) insan elindedir. Doğru soru: "Binam hangi yönetmeliğe göre, hangi zemine yapıldı?"</li>
</ul>

<h3>7. Türkiye'nin tektoniği ve fay kuşakları</h3>
<ul>
<li>Türkiye <b>Alp-Himalaya</b> kıvrım ve fay kuşağında; topraklarının <b>~%96'sı</b> deprem kuşağında.</li>
<li><b>Arap levhası kuzeye</b> ilerleyip Avrasya'ya çarpar (Kafkasya'da bindirme kuşağı). Sıkışan <b>Anadolu bloğu batıya kaçar</b> ("kiraz çekirdeği", ~2 cm/yıl); kaçışın kuzey ve doğu sınırları KAF ve DAF. Batıya kaçış Ege'yi çekip inceltir → normal faylar, horst–graben.</li>
<li>KAF: batı–kuzeybatı doğrultusunda sağ yönlü; DAF: kuzeydoğu doğrultusunda sol yönlü. KAFZ/DAFZ = geniş deformasyon kuşakları.</li>
<li>~21 milyon konutun <b>%69'u (16 milyon)</b> 1.–2. derece bölgede; burada <b>55,5 milyon kişi (%72)</b> yaşar.</li>
</ul>

<li><b>KAF domino dizisi</b>: 1939 Erzincan → 1942 Niksar-Erbaa → 1943 Tosya-Ladik → 1944 Gerede → 1957 Abant → 1967 Mudurnu → 1999 Gölcük → 1999 Düzce (~60 yılda batıya). Kırılmamış bölüm: <b>Marmara Denizi</b> (İstanbul beklentisi).</li>
</ul>

<h3>12. İkincil afetler</h3>
<p><span class="k">İkincil afet</span>: bir afetin etkisi/tetiklemesiyle oluşan yeni afet — yangın, heyelan, baraj yıkılması, patlama, salgın hastalık, endüstriyel kaza.</p>
<ul>
<li>Sarsıntı <b>geçici</b> (onlarca saniye–birkaç dakika); sıvılaşma, yamaç kayması, kaya düşmesi <b>kalıcı zemin deformasyonu</b>.</li>
<li>Bazen asıl kayıp ikincil afetten: 2011 Japonya (tsunami), 1995 Kobe (yangın).</li>
<li>1999: <b>Düzce Kaynaşlı</b> heyelan/kaya düşmesi; <b>Adapazarı</b> yaygın sıvılaşma.</li>
<li>AYAY: olay yerinde ikincil riskler de değerlendirilir (gaz sızıntısı, elektrik hattı, yakın yamaç, akaryakıt deposu) — ekip güvenliği.</li>
</ul>
<div class="tbl"><table>
<tr><th>Tür</th><th>Özellik</th></tr>
<tr><td>Zemin sıvılaşması</td><td>Kumlu, suya doygun zemin; taşıma gücü kaybı; bina yan yatar/devrilir</td></tr>
<tr><td>Kütle hareketleri</td><td>Heyelan, kaya düşmesi, yanal yayılma; <b>yollar kapanır</b> → müdahalenin en büyük engeli (hava köprüsü, alternatif güzergâh)</td></tr>
<tr><td>Tsunami</td><td>Deniz altı depremleri sonrası; en ölümcül alt tip</td></tr>
<tr><td>Yangın, patlama, kritik tesis</td><td>Gaz hattı, rafineri, fabrika, baraj, nükleer santral; ayrıca <b>salgın hastalık</b></td></tr>
</table></div>
<p>Salgın mekanizması: su-kanalizasyon kırılması, kalabalık barınma, hijyen yetersizliği, aşılama zincirinin kopması. Kitap örneği: <b>2008 Çin (M 8,0)</b> baraj yıkılmaları ve büyük heyelanlar.</p>

<h3>13. Sıvılaşma</h3>
<ol>
<li>Kum taneleri birbirine değerek yükü taşır; boşluklar su dolu → zemin katı.</li>
<li>Sarsıntı tane temasını zayıflatır; <b>boşluk suyu basıncı yükselir</b>, taneler ayrılır.</li>
<li>Zemin <b>taşıma gücünü kaybeder</b> (bina, köprü, boru hattı temeli).</li>
<li>Yapılar <b>yıkılmadan yan yatar</b> veya devrilir (Adapazarı 1999).</li>
</ol>
<ul>
<li>Önlem: potansiyel sıvılaşma ve <span class="k">mikrobölgeleme</span> haritaları (mahalle ölçeğinde zemin haritası; imar planlarının dayanağı), zemin iyileştirme, uygun yapı tasarımı.</li>
<li>Sağlık boyutu: su ve kanalizasyon hatları kırılır → içme suyu ve sanitasyon krizi.</li>
</ul>

<h3>14. Tsunami</h3>
<ul>
<li>Su kütlesinin itici kuvvetle yer değiştirmesiyle oluşan <b>uzun dönemli, uzun dalga boylu</b> dalgalar. Nedenler: çoğunlukla deniz altı depremleri; ayrıca deniz altı heyelanları, volkanlar, uzay cismi çarpması.</li>
<li>Ölümcüllük: yer hareketinde <b>4/1000</b>, tsunamide <b>79/1000</b> (~<b>20 kat</b>). Boğulma → kurtarılabilir hasta azdır; depremde yaralı &gt; ölü, tsunamide tersi.</li>
<li><span class="warn">1 metre su bir insanı öldürebilir</span>; dalganın yüksek olması gerekmez.</li>
<li>Türkiye: Akdeniz, Karadeniz, Marmara'da kayıtlar var. Marmara fayı yanal atımlı → doğrudan tsunami üretmeyebilir; <b>deniz altı heyelanları</b> önemli kaynak. 1509 İstanbul "Küçük Kıyamet", 1999 İzmit Körfezi küçük dalgalar. Erken uyarı: <b>Kandilli Rasathanesi</b>.</li>
<li>Davranış: karadakiler <b>yükseğe</b>; teknedekiler <b>açık denize</b>.</li>
<li>20 yılda deprem ve tsunamide ~<b>750.000</b> ölü; 1896 Meiji (21.000), 2004 Sumatra, 2011 Sendai.</li>
<li>Planlama: tahliye planı, dikey tahliye noktaları, sağlık tesislerinin kıyıdan uzaklığı.</li>
</ul>

<h3>15. NaTech</h3>
<p><span class="k">NaTech</span> (Natural Hazard Triggered Technological Accident): doğa olayının kritik tesisi vurmasıyla oluşan teknolojik afet (kitapta yok; Hafta 11).</p>
<div class="tbl"><table>
<tr><th>Olay</th><th>Ne oldu?</th></tr>
<tr><td>Sendai 2011</td><td>Deprem + tsunami → Fukushima nükleer sızıntı; bölge kalıcı boşaltıldı</td></tr>
<tr><td>Kobe 1995</td><td>Ahşap konut yangınları; su hatları kırık, söndürülemedi</td></tr>
<tr><td>Çin 2008 (M 8,0)</td><td>Baraj yıkılmaları, büyük heyelanlar</td></tr>
<tr><td>İskenderun 2023</td><td>Limanda devrilen konteynerlerde günlerce süren yangın</td></tr>
</table></div>
<p>Sağlık: duman inhalasyonu, <b>karbonmonoksit ve siyanür</b> zehirlenmesi; hastane–sanayi bölgesi mesafesi planlamada önemli.</p>

<h3>16. Depremin sağlık sonuçları</h3>
<div class="tbl"><table>
<tr><th>Başlık</th><th>Zaman</th><th>İçerik</th></tr>
<tr><td>Doğrudan – travma</td><td>İlk saatler/günler</td><td>Künt travma, ekstremite kırığı, kafa-omurga-göğüs travması, ezilme, yanık, kanama; enkazda hipotermi, susuzluk</td></tr>
<tr><td>Doğrudan – crush</td><td>İlk saatler/günler</td><td>Depremin imza tablosu</td></tr>
<tr><td>Dolaylı – süreklilik kaybı</td><td>Haftalar–aylar</td><td>Diyaliz, insülin, tansiyon, onkoloji kesintisi; gebe-bebek hizmetleri; aşılama zinciri</td></tr>
<tr><td>Dolaylı – çevre/ruh sağlığı</td><td>Haftalar–aylar</td><td>Su-sanitasyon kaynaklı bulaşıcı hastalık, beslenme sorunları, akut stres, TSSB</td></tr>
</table></div>
<ul>
<li>Seyir: <b>ilk 72 saat travma</b> → haftalar süreklilik kaybı + çevre sağlığı → aylar ruh sağlığı. Bu sıra planlama takvimidir; <span class="warn">"afet = ilk 72 saat" yanılgısı</span>.</li>
<li><b>Diyaliz kapasitesi</b> en kritik dar boğazlardan: kronik hastalar + crush'a bağlı akut böbrek hasarı aynı anda. 2023'te diyaliz hastaları başka illere nakledildi.</li>
<li>Depremde yaralı &gt; ölü → kurtarılabilir hasta havuzu geniş.</li>
<li>Ana fikir: <b>"Enkazdan çıkma, kurtulmak demek değildir."</b></li>
</ul>

<h3>17. Crush sendromu ve kurtarma ölümü</h3>
<p><span class="k">Crush sendromu</span>: uzun süre ağır yük altında kalan kasın bozulması (<b>rabdomiyoliz</b>) ve hücre içeriğinin kana karışmasıyla gelişen, <b>akut böbrek hasarı</b> ve ölümcül <b>ritim bozukluğuna</b> ilerleyebilen tablo. Enkaz altında kalma süresi uzadıkça risk artar.</p>
<ol>
<li>Ezilen kastan <b>miyoglobin, potasyum, fosfat</b> çıkar (rabdomiyoliz).</li>
<li><b>Miyoglobin</b> böbrek tübüllerini tıkar → akut böbrek hasarı (bazen diyaliz).</li>
<li><b>Hiperkalemi</b> → ritim bozukluğu; <span class="warn">en acil bileşen</span>.</li>
</ol>

<h3>4. Güçlü kolon – zayıf kiriş</h3>
<ul><li>Yönetmelik: kolonlar kirişlerden güçlü olmalı; hasar <b>önce kirişte</b> oluşmalı. Kiriş hasarı = bir açıklık; kolon hasarı = üstündeki tüm katlar çöker. Kiriş hasarı enerji yutar, bina uyarı verir. (Masa: tabla çatlar, bacak kırılmamalı.)</li>
<li>"Zayıf kiriş" kötü kiriş değildir; <span class="warn">göreli ilke</span>: kiriş işini yapacak kadar güçlü ama kolondan güçlü değil.</li>
<li>Türkiye eski stoğu: tersi (<span class="k">güçlü kiriş – zayıf kolon</span>); nedeni mimari kaygı (geniş açıklık, ince kolon, sarkan kiriş istememe) ve maliyet. Gözlendiği depremler: <b>1992 Erzincan, 1995 Dinar, 1999 Gölcük, 2003 Bingöl, 2011 Van</b>. Zayıf kolon → pancake göçme.</li></ul>

<p><b>Etriye</b> (deprem etriyesi): boyuna donatıyı saran enine donatı. Kesme çatlağını önler, boyuna donatının burkulmasını engeller, betonu sarar, <b>sünekliği sağlayan asıl eleman</b>. Sıklaştırma: uçlarda ve kolon-kiriş birleşimlerinde — kolonda ≥ <b>uzun kenar</b>, kirişte ≥ <b>2 × kiriş yüksekliği</b>. Uçlar <span class="k">135°</span> bükülür; <span class="warn">90° bükülen etriye pas payı dökülünce açılır</span>. "Etriye hayat kurtarır." Beton dökülünce görülemez → denetim inşaat sırasında.</p>

<ul><li>Düşük kaliteli beton: <b>1998 Adana, 1999 Kocaeli</b>.</li>

<li><b>Pas payı 3–5 cm</b>, ömür boyu korunmalı. Cephede beton dökülmesi + paslı demir = ileri korozyon. Bina yaşı bağımsız risk bileşenidir.</li></ul>

<h3>8. Kullanıcı kaynaklı hasarlar</h3>
<p>Bina, o kolon varmış gibi hesaplanmıştır: taşıyıcı kaldırılınca yük kaybolmaz, <b>komşu elemanlara biner</b> (Anadolu Üniv. bina envanter çalışması).</p>
<ul><li><b>Kolon kesme</b>: mağaza, galeri, garaja çevrilen katlarda kolon/kiriş kesilmesi.</li>
<li><b>Tesisat hasarı</b>: <span class="k">en yaygın</span> müdahale — boruların kiriş donatıları arasından geçirilmesi.</li>
<li><b>Taşıyıcı duvar kaldırma</b>: perde ile dolgu duvar karıştırılır; perde kaldırılınca rijitlik yok olur.</li>
<li><b>Kat ekleme</b>: statik inceleme olmadan → hem düşey hem yatay yük artar.</li>
<li>Doğrusu: <b>proje müellifi / inşaat mühendisi</b> görüşü; tesisat önceden planlanmalı. Sağlam bina yaşlanmadan zayıflayabilir. Hastanede cihaz odası için duvar kaldırmak afet performansını düşürebilir.</li></ul>

<h3>9. Sağlık tesisleri ve yapısal olmayan risk</h3>
<p><span class="k">Yapısal olmayan risk</span> (AFAD): taşıyıcı sisteme ait olmayan ögelerin (mobilya, cihaz, tesisat, asma tavan, aydınlatma) devrilme, düşme, kopma riski. Taşıyıcı sağlam olsa bile yaralanma, ölüm ve hizmet kesintisi yaratır. Hastanede <b>iki katman</b>: hasta-personel güvenliği + hizmet sürekliliği. Azaltması <b>görece ucuz</b> (sabitleme, askılama, esnek bağlantı). AFAD ücretsiz rehber kitaplar yayımlar.</p>
<div class="tbl"><table><tr><th>Risk</th><th>Sonuç</th></tr>
<tr><td>Devrilen eşya/raf</td><td>Doğrudan yaralanma; oksijen tüpü → yaralanma + yangın; ilaç stoğu kullanılamaz</td></tr>
<tr><td>Düşen tavan/aydınlatma</td><td>Asma tavan, armatür, menfez; ameliyathane/YB steril ve güvenli değil → alan kapanır</td></tr>
<tr><td>Kopan tesisat ("hizmetin kalbi")</td><td>Tıbbi gaz, su-kanalizasyon, elektrik; oksijen hattı kopan YB hasta tutamaz. Gerekli: esnek bağlantı, otomatik kesme vanası</td></tr>
<tr><td>Çalışmayan jeneratör ("<b>en sık gözden kaçan</b>")</td><td>Sabitlenmemiş, yakıtsız, test edilmemiş → ventilatör, monitör durur</td></tr></table></div>
<p><span class="warn">Hastane yıkılmadan da işlevini kaybedebilir; en yaygın nedeni yapısal olmayan risklerdir.</span> 2023'te bazı hastaneler taşıyıcı sağlamken altyapı hasarı nedeniyle tahliye edildi.</p>
<p><b>HAP</b> (Hastane Afet ve Acil Durum Planı): her sağlık tesisi hazırlamak ve güncel tutmakla yükümlü; yönetmelik <b>RG 20.03.2015, S. 29301</b>. Kapsam: kapasite artırımı, hasta akışı, alan tahliyesi, iletişim, stok-tedarik, personel görevlendirme. "Kriz anında plan yazılmaz, plan uygulanır." <b>Tatbikatla denenmemiş plan, plan sayılmaz.</b> (Ayrıntı ve TAMP: Hafta 13.)</p>

<h3>10. Haftanın ana fikri ve güncellemeler</h3>
<p><b>Ayakta kalmak ile çalışmaya devam etmek aynı şey değildir.</b> Konut hedefi: <span class="k">can güvenliği</span> (tahliye edilebilmek); hastane, itfaiye, afet merkezi: <span class="k">kesintisiz kullanım</span> (afet ertesi hasta kabulü) — daha pahalı ama toplumca kabul edilen maliyet.</p>
<ul><li>Kitap <b>DBYBHY-2007</b>'ye göre yazıldı → yerini <b>TBDY-2018</b> aldı (RG 18.03.2018, S. 30364; yürürlük <b>1 Ocak 2019</b>): performansa dayalı tasarım, kullanım amacına göre hedef.</li>
<li>Beş bölgeli harita yerine <b>Türkiye Deprem Tehlike Haritası (2018)</b>: adrese özgü ivme.</li>
<li><b>6 Şubat 2023</b> hasarları kitabı doğruladı: yumuşak kat, zemin kat ticari kullanım, dolgu duvar kaynaklı kısa kolon, ağır çıkma.</li>
<li><b>6306 sayılı kanun (2012)</b>: kentsel dönüşümün yasal çerçevesi (Hafta 12).</li>
<li>Sınıf etkinliği (risk avı): sokak fotoğrafında teşhis → sınıftaki sabitlenmemiş ögeleri say → 10 dk / 1 gün / bütçe gerektiren diye ayır (çoğu ucuz) → hastaneye taşı (YB, ameliyathane, eczane deposu).</li></ul>`
];

/* --- localStorage: yalnızca "en iyi skor" kolaylığı; her erişim korumalı --- */
function loadBest(){ try{ return JSON.parse(localStorage.getItem("afet-best-v1")||"{}"); }catch(e){ return {}; } }
function saveBest(id,pct){ try{ const b=loadBest(); if(b[id]==null||pct>b[id]){ b[id]=pct; localStorage.setItem("afet-best-v1",JSON.stringify(b)); } }catch(e){} }

let S = null;      // test oturumu
let F = null;      // kart oturumu

function esc(t){ const d=document.createElement("div"); d.textContent=t; return d.innerHTML; }
/* Açıklama metni: **kalın**, *italik* ve satır sonu desteği */
function fmt(t){
  t = esc(t).replace(/\n/g,"<br>");
  t = t.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  t = t.replace(/\*([^*]+)\*/g,"<i>$1</i>");
  return t;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- ana ekran ---------- */
function home(){
  S=null; F=null;
  const best=loadBest();
  let cards="";
  SETS.forEach((s,i)=>{
    const b = best["set"+i]!=null ? `<span class="best">En iyi: %${best["set"+i]}</span>` : "";
    cards += `
    <button class="set-card" onclick="setMenu(${i})">
      <span class="set-num">${i+1}</span>
      <span class="set-body">
        <span class="set-title">${esc(s.title)}</span>
        <span class="set-desc">${esc(s.desc)}</span>
        <span class="set-meta"><span>${s.questions.length} soru</span>${b}</span>
      </span>
      <span class="go">›</span>
    </button>`;
  });
  const bEx = best["exam"]!=null ? `<span class="best">En iyi: %${best["exam"]}</span>` : "";
  const bAll = best["all"]!=null ? `<span class="best">En iyi: %${best["all"]}</span>` : "";
  app.innerHTML = `
  <header class="masthead">
    <div class="eyebrow">Çoktan seçmeli · Bilgi kartları · Konu özetleri</div>
    <h1>Temel Afet Bilgisi Soru Bankası</h1>
    <p>Afet Kavramı, Afet Türleri, Deprem I–II ve Deprem ve Binalar sunumlarının tamamından (konuşmacı notları dahil) hazırlanmış ${TOTAL} soru. Sorular konu başlıklarına göre dizildi; her konunun üç çalışma modu var: test, bilgi kartları ve sınav öncesi konu özeti.</p>
    <div class="stats">
      <span class="stat"><b>${TOTAL}</b> soru</span>
      <span class="stat"><b>${SETS.length}</b> konu başlığı</span>
      <span class="stat">Vaka + karşılaştırma + tablo soruları</span>
    </div>
  </header>
  <div class="plan">
    <div class="label">Önerilen çalışma sırası</div>
    <ol>
      <li><b>Özeti oku</b> — konunun haritasını çıkar.</li>
      <li><b>Testi çöz</b> — açıklamaları mutlaka oku; sonunda yanlışları tekrar çöz.</li>
      <li><b>Kartlarla pekiştir</b> — her kart bir bilgiyi açıklamasıyla öğretir.</li>
      <li>Sınavdan önce <b>Deneme Sınavı</b> ile kendini ölç.</li>
    </ol>
  </div>
  <div class="sets">
    ${cards}
    <button class="set-card special" onclick="startExam()">
      <span class="set-num">?</span>
      <span class="set-body">
        <span class="set-title">Deneme Sınavı</span>
        <span class="set-desc">Tüm konulardan rastgele 40 soru — gerçek sınav provası</span>
        <span class="set-meta"><span>40 soru · her seferinde farklı</span>${bEx}</span>
      </span>
      <span class="go">›</span>
    </button>
    <button class="set-card special" onclick="startAll()">
      <span class="set-num">∞</span>
      <span class="set-body">
        <span class="set-title">Maraton</span>
        <span class="set-desc">${TOTAL} sorunun tamamı, baştan sona</span>
        <span class="set-meta"><span>${TOTAL} soru</span>${bAll}</span>
      </span>
      <span class="go">›</span>
    </button>
  </div>
  <p class="note">Skorların yalnızca bu tarayıcıda saklanır. Klavye: testte A–E ile cevapla, Enter ile ilerle; kartlarda ← / → ile gezin.</p>`;
  window.scrollTo(0,0);
}

/* ---------- set menüsü ---------- */
function setMenu(i){
  S=null; F=null;
  const s=SETS[i]; const best=loadBest();
  const b = best["set"+i]!=null ? ` · En iyi skorun: %${best["set"+i]}` : "";
  const sumBtn = SUMMARIES[i] ? `
    <button class="mode" onclick="showSummary(${i})">
      <span class="ic">📋</span>
      <span class="set-body"><span class="t">Konu özeti</span>
      <span class="d">Sınav öncesi hızlı tekrar: tablolar ve kopya kağıdı kıvamında notlar</span></span>
      <span class="go">›</span>
    </button>`:"";
  app.innerHTML = `
  <div class="topbar"><div class="topline">
    <button class="btn-ghost" onclick="home()">‹ Ana sayfa</button><span></span>
  </div></div>
  <div class="menu-head">
    <div class="eyebrow">${esc(s.short)}</div>
    <h2>${esc(s.title)}</h2>
    <p>${esc(s.desc)} — ${s.questions.length} soru${b}</p>
  </div>
  <div class="modes">
    <button class="mode" onclick="startSet(${i})">
      <span class="ic">✏️</span>
      <span class="set-body"><span class="t">Teste başla</span>
      <span class="d">Şık seç, anında açıklamalı geri bildirim al; sonunda yanlışlarını tekrar çöz</span></span>
      <span class="go">›</span>
    </button>
    <button class="mode" onclick="startFlash(${i})">
      <span class="ic">🃏</span>
      <span class="set-body"><span class="t">Bilgi kartları</span>
      <span class="d">Konunun bilgileri sırayla, açıklamalı öğretici kartlar — soru yok, okuyarak öğren</span></span>
      <span class="go">›</span>
    </button>
    ${sumBtn}
  </div>`;
  window.scrollTo(0,0);
}

/* ---------- özet ---------- */
function showSummary(i){
  const s=SETS[i];
  app.innerHTML = `
  <div class="topbar"><div class="topline">
    <button class="btn-ghost" onclick="setMenu(${i})">‹ ${esc(s.short)}</button>
    <button class="btn-ghost" onclick="home()">Ana sayfa</button>
  </div></div>
  <div class="menu-head"><div class="eyebrow">Konu özeti</div><h2>${esc(s.title)}</h2></div>
  <div class="sum">${SUMMARIES[i]}</div>
  <div class="result-actions" style="margin-top:28px">
    <button class="btn" onclick="startSet(${i})">Şimdi testi çöz →</button>
    <button class="btn secondary" onclick="startFlash(${i})">Kartlara geç</button>
  </div>`;
  window.scrollTo(0,0);
}

/* ---------- test oturumu ---------- */
function startSet(i){ begin(SETS[i].title, SETS[i].questions.map(q=>({...q,from:SETS[i].short})), "set"+i, i); }
function startExam(){
  const pool=[]; SETS.forEach(s=>s.questions.forEach(q=>pool.push({...q,from:s.short})));
  begin("Deneme Sınavı", shuffle(pool).slice(0,40), "exam", null);
}
function startAll(){
  const pool=[]; SETS.forEach(s=>s.questions.forEach(q=>pool.push({...q,from:s.short})));
  begin("Maraton", pool, "all", null);
}
function retryWrong(){
  if(!S) return;
  const wrongQs = S.answers.filter(a=>!a.ok).map(a=>a.q);
  begin(S.title.replace(" · Yanlışlar","")+" · Yanlışlar", wrongQs, null, S.setIdx);
}
function begin(title, qs, storeId, setIdx){
  F=null;
  S = { title, qs, idx:0, right:0, wrongN:0, answers:[], storeId, setIdx };
  renderQ();
}

function renderQ(){
  const q = S.qs[S.idx];
  const n = S.idx+1, N = S.qs.length;
  let opts="";
  q.opts.forEach((o,i)=>{
    opts += `<button class="opt" id="opt${i}" onclick="answer(${i})">
      <span class="key">${LETTERS[i]}</span><span class="txt">${esc(o.t)}</span></button>`;
  });
  app.innerHTML = `
  <div class="topbar"><div class="topline">
      <button class="btn-ghost" onclick="${S.setIdx!=null?`setMenu(${S.setIdx})`:"home()"}">‹ Çık</button>
      <span class="counts">Soru ${n}/${N} &nbsp; <span class="ok">✓ ${S.right}</span> <span class="no">✗ ${S.wrongN}</span></span>
    </div>
    <div class="bar"><i style="width:${Math.round((S.idx)/N*100)}%"></i></div>
  </div>
  <div class="quiz-set-name">${esc(S.title)}${q.from && S.storeId!==("set"+S.setIdx) ? " · "+esc(q.from):""}</div>
  <div class="qtext">${esc(q.q)}</div>
  <div class="opts">${opts}</div>
  <div id="after"></div>
  <p class="hint-keys">A–E: cevapla · Enter: sonraki</p>`;
  window.scrollTo(0,0);
}

function answer(i){
  const q = S.qs[S.idx];
  if(document.getElementById("after").dataset.done) return;
  const ok = (i===q.a);
  if(ok) S.right++; else S.wrongN++;
  S.answers.push({q, ok, picked:i});
  q.opts.forEach((o,j)=>{
    const el=document.getElementById("opt"+j);
    el.disabled=true;
    if(j===q.a) el.classList.add("correct");
    else if(j===i) el.classList.add("wrong");
    else el.classList.add("dim");
  });
  const last = S.idx===S.qs.length-1;
  const after=document.getElementById("after");
  after.dataset.done="1";
  after.innerHTML = `
    <div class="verdict ${ok?"ok":"no"}">${ok?"Doğru!":"Yanlış — doğru cevap: "+LETTERS[q.a]}</div>
    <div class="explain"><div class="label">Açıklama</div><p>${fmt(q.exp)}</p></div>
    <div class="nextrow"><button class="btn" id="nextBtn" onclick="next()">${last?"Sonuçları gör":"Sonraki soru"} →</button></div>`;
  document.getElementById("nextBtn").focus({preventScroll:true});
}

function next(){
  if(S.idx < S.qs.length-1){ S.idx++; renderQ(); }
  else results();
}

/* ---------- sonuç ---------- */
function results(){
  const N=S.qs.length, pct=Math.round(S.right/N*100);
  if(S.storeId) saveBest(S.storeId,pct);
  const wrongs=S.answers.filter(a=>!a.ok);
  let msg;
  if(pct===100) msg="Kusursuz. Bu konu sende.";
  else if(pct>=85) msg="Çok iyi — yanlışlara bir göz at, tamamdır.";
  else if(pct>=70) msg="İyi gidiyor. Yanlışları tekrar çözmek farkı kapatır.";
  else if(pct>=50) msg="Temel var; açıklamaları okuyarak bir tur daha dön.";
  else msg="Bu setin özetini okuyup kartlarla çalışmak, sonra testi tekrarlamak en verimlisi.";
  let review="";
  if(wrongs.length){
    review = `<div class="review"><h3>Yanlış cevapladıkların (${wrongs.length})</h3>` + wrongs.map(a=>`
      <div class="review-item">
        <div class="rq">${esc(a.q.q)}</div>
        <div class="ra"><span class="you">Senin cevabın: ${LETTERS[a.picked]})</span> ${esc(a.q.opts[a.picked].t)}<br>
        <span class="cor">Doğrusu: ${LETTERS[a.q.a]})</span> ${esc(a.q.opts[a.q.a].t)}</div>
        <div class="re">${fmt(a.q.exp)}</div>
      </div>`).join("") + `</div>`;
  } else {
    review = `<p style="text-align:center" class="perfect">Hiç yanlışın yok 🎉</p>`;
  }
  const sumLink = (S.setIdx!=null && SUMMARIES[S.setIdx]) ? `<button class="btn secondary" onclick="showSummary(${S.setIdx})">Konu özetine dön</button>`:"";
  app.innerHTML = `
  <div class="result-head">
    <div class="score-ring" style="--p:${pct}"><div><b>%${pct}</b><small>${S.right}/${N}</small></div></div>
    <h2>${esc(S.title)} tamamlandı</h2>
    <p>${msg}</p>
  </div>
  <div class="result-actions">
    ${wrongs.length?`<button class="btn" onclick="retryWrong()">Yanlışları tekrar çöz (${wrongs.length})</button>`:""}
    ${sumLink}
    <button class="btn secondary" onclick="home()">Ana sayfa</button>
  </div>
  ${review}`;
  window.scrollTo(0,0);
}

/* ---------- bilgi kartları (öğretici: cevap ve açıklama hep açık) ---------- */
function startFlash(i, at){
  S=null;
  F = { setIdx:i, title:SETS[i].title, cards:SETS[i].questions, idx:at||0 };
  renderFlash();
}
function renderFlash(){
  const N=F.cards.length, c=F.cards[F.idx], n=F.idx+1;
  const last = F.idx===N-1;
  app.innerHTML = `
  <div class="topbar"><div class="topline">
      <button class="btn-ghost" onclick="setMenu(${F.setIdx})">‹ Çık</button>
      <span class="counts">Kart ${n}/${N}</span>
    </div>
    <div class="bar"><i style="width:${Math.round(n/N*100)}%"></i></div>
  </div>
  <div class="quiz-set-name">${esc(F.title)} · Bilgi kartları</div>
  <div class="flash-card">
    ${/^(I|II|III|IV|V)\b[ ,veIV]*$/.test(c.opts[c.a].t.trim()) ? "" : `<div class="flash-tag">Anahtar bilgi</div><div class="flash-ans">${esc(c.opts[c.a].t)}</div>`}
    <div class="flash-exp">${fmt(c.exp)}</div>
  </div>
  <div class="flash-actions">
    <button class="btn secondary" onclick="flashGo(-1)" ${F.idx===0?"disabled":""}>‹ Önceki</button>
    <button class="btn" onclick="flashGo(1)">${last?"Bitir":"Sonraki ›"}</button>
  </div>
  <p class="hint-keys">← / → : önceki / sonraki kart</p>`;
  window.scrollTo(0,0);
}
function flashGo(d){
  const j=F.idx+d;
  if(j<0) return;
  if(j>=F.cards.length){ flashDone(); return; }
  F.idx=j; renderFlash();
}
function flashDone(){
  const i=F.setIdx; F=null;
  app.innerHTML = `
  <div class="result-head">
    <h2>Kartlar bitti</h2>
    <p>${SETS[i].questions.length} kartın hepsini okudun. Şimdi testle kendini dene.</p>
  </div>
  <div class="result-actions">
    <button class="btn" onclick="startSet(${i})">Testi çöz</button>
    <button class="btn secondary" onclick="startFlash(${i})">Kartlara baştan dön</button>
    <button class="btn secondary" onclick="home()">Ana sayfa</button>
  </div>`;
  window.scrollTo(0,0);
}

/* ---------- klavye ---------- */
document.addEventListener("keydown",e=>{
  if(F){
    if(e.key==="ArrowRight"||e.key===" "||e.key==="Enter"){ e.preventDefault(); flashGo(1); return; }
    if(e.key==="ArrowLeft"){ e.preventDefault(); flashGo(-1); return; }
    return;
  }
  if(!S) return;
  const after=document.getElementById("after");
  if(e.key==="Enter" && after && after.dataset.done){ next(); return; }
  const k="abcde".indexOf(e.key.toLowerCase());
  if(k>-1 && after && !after.dataset.done && S.qs[S.idx].opts[k]) answer(k);
});

home();
</script>
