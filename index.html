kilerin hangisinde doğru verilmiştir?", "opts": [{"t": "Jeolojik, hidrolojik, meteorolojik, biyolojik"}, {"t": "Jeolojik, meteorolojik, klimatolojik, biyolojik"}, {"t": "Klimatik, hidrografik, sosyal, teknolojik"}, {"t": "Jeolojik, hidrolojik, klimatik, beşeri"}, {"t": "Jeolojik, klimatik, hidrografik, biyolojik"}], "a": 4, "exp": "Özey doğal afetleri **kökenlerine** göre dörde ayırır: **jeolojik** (kaynağı yer kabuğu), **klimatik** (atmosfer), **hidrografik** (su kütleleri), **biyolojik** (toprak ve canlılar). \"Hidrolojik / meteorolojik / klimatolojik\" terimleri EM-DAT'a aittir; sosyal ve teknolojik ise Özey'in **beşeri** afet alt gruplarıdır.\n💡 Özey'in kendine özgü iki terimi: **klimaTİK** ve **hidroGRAFİK** — EM-DAT'taki karşılıkları klimatolojik ve hidrolojik."}, {"q": "Orman yangını, EM-DAT ve Özey (2006) sınıflandırmalarında sırasıyla hangi gruplarda yer alır?", "opts": [{"t": "Biyolojik – Klimatik"}, {"t": "Klimatolojik – Biyolojik"}, {"t": "Meteorolojik – Biyolojik"}, {"t": "Klimatolojik – Klimatik"}, {"t": "Biyolojik – Hidrografik"}], "a": 1, "exp": "EM-DAT orman yangınını **klimatolojik** gruba koyar, çünkü **tetikleyiciye** bakar (yangını kuraklık ve sıcaklık başlatır). Özey ise **biyolojik** gruba koyar, çünkü **kaynağa** bakar (yangın bitki örtüsünü etkiler). Bu bir hata değil, farklı bir bakış açısıdır: aynı olay, hangi soruyu sorduğunuza göre farklı kutuya girer."}, {"q": "Özey (2006) sınıflandırmasına göre aşağıdaki eşleştirmelerden hangisi **yanlıştır**?", "opts": [{"t": "Asit yağışı – Klimatik"}, {"t": "Baraj yıkılması – Hidrografik"}, {"t": "Erozyon – Biyolojik"}, {"t": "Tsunami – Hidrografik"}, {"t": "Kaya düşmesi – Jeolojik"}], "a": 3, "exp": "Özey'de **tsunami**, deprem, yanardağ, heyelan ve kaya düşmesiyle birlikte **jeolojik** kökenlidir (kaynağı yer kabuğu). Hidrografik grupta akarsu taşkınları, **baraj taşkınları ve yıkılmaları** ve göl sularının aşırı kirlenmesi yer alır. Asit yağışı klimatik, erozyon biyolojik gruptadır."}, {"q": "Özey (2006) sınıflandırmasında grupların kaynakları eşleştirildiğinde, **kaynağı toprak ve canlılar** olan grup ve bu gruba ait örnek hangisidir?", "opts": [{"t": "Biyolojik – erozyon, orman yangınları"}, {"t": "Klimatik – kuraklık, tipi, don ve buzlanma"}, {"t": "Hidrografik – göl sularının aşırı kirlenmesi"}, {"t": "Jeolojik – heyelan ve kaya düşmesi"}, {"t": "Biyolojik – salgın hastalıklar ve böcek istilası"}], "a": 0, "exp": "Özey'de **biyolojik** grubun kaynağı **toprak ve canlılardır**; örnekleri **erozyon, orman yangınları ve doğal hayvan neslinin tükenmesidir**. Kaynaklar: jeolojik → yer kabuğu, klimatik → atmosfer, hidrografik → su kütleleri. Dikkat: Özey'de **bulaşıcı hastalıklar** doğal-biyolojik değil, beşeri **sosyal** afetler arasındadır."}, {"q": "Özey (2006) klimatik afetler grubunda aşağıdakilerden hangisini saymaz?", "opts": [{"t": "İklim değişikliği"}, {"t": "Akarsu taşkınları"}, {"t": "Tayfun"}, {"t": "Yıldırım"}, {"t": "Çığ"}], "a": 1, "exp": "Özey'in **klimatik** (kaynağı atmosfer) grubu oldukça geniştir: aşırı sıcak ve soğuklar, kuraklık, kasırga, **tayfun**, tornado, hortum, **yıldırım**, dolu, aşırı yağış, tipi, **çığ**, don ve buzlanma, asit yağışı, **iklim değişikliği**. **Akarsu taşkınları** ise **hidrografik** gruptadır."}, {"q": "Kitabın doğal afetlerde insan etkisine ilişkin vurgusu hangisidir?", "opts": [{"t": "Doğal afetlerde insan etkisi hiçbir zaman bulunmaz"}, {"t": "İnsanın tetiklediği her afet beşeri afet sayılır"}, {"t": "İnsan tetikleyebilir; ama hazırlayan faktörler doğal özelliklere dayanır"}, {"t": "Doğal afetleri hazırlayan faktörler, doğal özellikler değil esas olarak insan faaliyetleridir"}, {"t": "İnsan etkisi olan olaylar sınıflandırma dışında tutulur"}], "a": 2, "exp": "Kitaba göre doğal afetlerin bazılarında **insan etkisi bulunabilir**, hatta **tetik rolü** oynayan etken insan olabilir; ama **olayı hazırlayan faktörler oradaki doğal özelliklere dayanır**. Bu yüzden böyle olaylar yine doğal afet olarak sınıflanır."}, {"q": "Özey (2006), insan kaynaklı afetleri hangi başlık altında toplar ve kaça ayırır?", "opts": [{"t": "Teknolojik afetler – endüstriyel, karışık ve ulaşım olmak üzere üçe"}, {"t": "Beşeri afetler – sosyal, ekonomik ve teknolojik olmak üzere üçe"}, {"t": "Beşeri afetler – sosyal ve teknolojik olmak üzere ikiye"}, {"t": "İnsan kaynaklı afetler – savaş ve kaza olmak üzere ikiye"}, {"t": "Sosyal afetler – hızlı ve yavaş gelişen olmak üzere ikiye"}], "a": 2, "exp": "Özey insan kaynaklı afetleri **\"beşeri afetler\"** başlığı altında toplar ve **sosyal afetler** (günlük yaşamdan kaynaklanan) ile **teknolojik afetler** (teknolojinin yanlış uygulanmasından kaynaklanan) olarak **ikiye** ayırır. Endüstriyel/karışık/ulaşım üçlüsü EM-DAT'ın teknolojik alt gruplarıdır."}, {"q": "Özey (2006)'ya göre aşağıdakilerden hangisi **teknolojik** değil **sosyal** afetler arasında yer alır?", "opts": [{"t": "Maden kazaları"}, {"t": "Sanayi kazaları"}, {"t": "Ulaşım sektöründeki kazalar"}, {"t": "Bina, işyeri ve eğlence merkezi yangınları"}, {"t": "Nükleer, biyolojik ve kimyasal silah kullanımı"}], "a": 3, "exp": "Özey'in **sosyal afetleri**: açlık ve kıtlık, savaşlar ve terör saldırıları, bulaşıcı hastalıklar, zoraki göçler ve mülteci krizleri, **bina, işyeri ve eğlence merkezi yangınları**, büyük ekonomik krizler. **Teknolojik afetleri**: maden kazaları, sanayi kazaları, NBK silah kullanımı, ulaşım sektöründeki kazalar. Yangınların sosyal grupta olması sık karıştırılır."}, {"q": "\"Büyük ekonomik krizler (enflasyon, borçlanma)\" ile ilgili olarak derste yapılan değerlendirme hangisidir?", "opts": [{"t": "Hem EM-DAT hem Özey bunları teknolojik afet sayar"}, {"t": "Özey sosyal afet sayar; EM-DAT gibi uluslararası sınıflandırmalar saymaz"}, {"t": "Özey bunları afet saymaz; EM-DAT ise karışık kazalar grubunda afet olarak kaydeder"}, {"t": "Kalkınma Bakanlığı bunları doğa kaynaklı afet sayar"}, {"t": "Hiçbir sınıflandırma ekonomik krizi afet olarak ele almaz"}], "a": 1, "exp": "Özey **büyük ekonomik krizleri** beşeri afetlerin **sosyal** alt grubunda sayar; **EM-DAT dahil uluslararası sınıflandırmalar saymaz**. İki yaklaşım da savunulabilir: ekonomik kriz kayıp doğurur, hayatı kesintiye uğratır ve çoğu zaman yerel kapasiteyi aşar. Bu tartışma afet kavramının sınırlarının göründüğü kadar net olmadığını gösterir."}, {"q": "Bulaşıcı hastalıklar (salgınlar) EM-DAT ve Özey sınıflandırmalarında nasıl yer alır?", "opts": [{"t": "EM-DAT'ta doğa kaynaklı biyolojik afet; Özey'de beşeri-sosyal afet"}, {"t": "Her ikisinde de doğa kaynaklı biyolojik afet"}, {"t": "EM-DAT'ta teknolojik-karışık kaza; Özey'de doğal kökenli biyolojik afet"}, {"t": "EM-DAT'ta karışık kaza; Özey'de beşeri-teknolojik afet"}, {"t": "Her ikisinde de beşeri-sosyal afet"}], "a": 0, "exp": "EM-DAT salgın hastalıkları **doğa kaynaklı** grupta **biyolojik** afet olarak sınıflar. Özey ise **bulaşıcı hastalıkları** beşeri afetlerin **sosyal** alt grubuna koyar; Özey'in doğal **biyolojik** grubunda erozyon, orman yangınları ve nesil tükenmesi vardır. Aynı olay farklı sınıflandırmalarda farklı kutuya girer."}, {"q": "Oluş hızına göre sınıflandırmada aşağıdakilerden hangisi **yavaş gelişen** afetlerdendir?", "opts": [{"t": "Çamur akması"}, {"t": "Yıldırım"}, {"t": "Salgın hastalıklar"}, {"t": "Ani sel"}, {"t": "Patlama ve endüstriyel kaza"}], "a": 2, "exp": "**Yavaş gelişen** afetler belirli bir süreçte gelişir: **kuraklık, erozyon ve çölleşme, iklim değişikliği, kıtlık ve açlık, salgın hastalıklar**. **Hızlı gelişen** afetler ani ortaya çıkar: deprem, su baskını ve ani sel, çamur akması, çığ, kaya düşmesi, fırtına, tayfun, hortum, yıldırım, patlama ve endüstriyel kaza."}, {"q": "Oluş hızına göre sınıflandırmanın müdahale planlamasına yansımasıyla ilgili hangisi doğrudur?", "opts": [{"t": "Yavaş gelişen afette kapasite olay sırasında artırılamaz"}, {"t": "Hızlı gelişen afetlerde erken uyarı ve izleme, hazırlıktan daha önemli olan asıl müdahale aracıdır"}, {"t": "Yavaş gelişen afetler daha az ölümcül olduğu için planlamada önceliksizdir"}, {"t": "Hızlı gelişende kapasite olay anında ne ise odur; hazırlık önceden yapılmalıdır"}, {"t": "Oluş hızına göre ayrım müdahale planlaması açısından işlevsizdir"}], "a": 3, "exp": "**Hızlı gelişen** afette zaman yoktur: müdahale kapasitesi **olay anında ne ise odur**; bu yüzden hazırlık (tatbikat, stok, plan) **olaydan önce** tamamlanmalıdır. **Yavaş gelişen** afette zaman vardır: kapasite **artırılabilir**, **erken uyarı ve izleme** devreye girer (kuraklık aylar önce izlenebilir, salgın erken tespitle sınırlanabilir). Bu ayrım müdahale planlaması açısından **en işlevsel** olanıdır.\n💡 Yavaş gelişen afetlerin trajik yanı **görünmezlikleridir**: kuraklık ve kıtlık geçen yüzyılın en ölümcül afetleridir ama deprem kadar haber olmaz."}, {"q": "Bryant (1993)'ın afet sınıflandırmasına yaklaşımı hangisidir?", "opts": [{"t": "Afetler kökenine göre jeolojik, klimatik, hidrografik ve biyolojik olarak dörde ayrılmalıdır"}, {"t": "Afetler yalnızca can kaybına göre sıralanmalıdır"}, {"t": "Afetler 13 türe ayrılarak sınıflandırılmalıdır"}, {"t": "Afetler doğa ve insan kaynaklı olarak ikiye ayrılmalıdır"}, {"t": "Afetler iç içe geçtiği için sınıflandırılamaz; 31 tür tek tek ele alınmalı"}], "a": 4, "exp": "Bryant (1993), afetlerin **iç içe geçmiş olmaları** ve aralarındaki **sebep-sonuç ilişkileri** nedeniyle sınıflandırılamayacağını savunur (deprem heyelanı, heyelan baraj yıkılmasını, yıkılma seli doğurur). Önerisi, dünyada etkili **31 afet türünü** tek tek ve önem sırasına göre ele almaktır."}, {"q": "Bryant'ın önem sıralamasında **deprem** kaçıncı sıradadır ve ilk sırada hangi afet bulunur?", "opts": [{"t": "1. sıra – deprem"}, {"t": "2. sıra – tropikal siklon"}, {"t": "3. sıra – kuraklık"}, {"t": "4. sıra – kuraklık"}, {"t": "4. sıra – tropikal siklon"}], "a": 3, "exp": "Bryant'ın ilk dört sırası: **1. kuraklık, 2. tropikal siklon, 3. bölgesel sel ve taşkınlar, 4. deprem**. Öğrenciler depremin birinci olmasını bekler; oysa Bryant yalnızca can kaybına değil, **süreye, alana ve kalıcılığa** da bakar. Kuraklık aylarca sürer, kıtaları etkiler, etkisi yıllarca kalır; deprem ise ~45 saniye sürer ve sınırlı alanı etkiler.\n💡 Sıra kodlaması: \"**K-T-S-D**\" (Kuraklık, Tropikal siklon, Sel, Deprem)."}, {"q": "Aşağıdakilerden hangisi Bryant'ın afetleri sıralarken kullandığı ölçütlerden biri **değildir**?", "opts": [{"t": "Afetin etkili olduğu süre"}, {"t": "Afetin etkilediği alanın genişliği"}, {"t": "Ülkenin gelişmişlik düzeyi"}, {"t": "Afetin toplumdaki sosyal etkisi"}, {"t": "Etkinin kalıcılığı"}], "a": 2, "exp": "Bryant'ın sıralama ölçütleri: **afetin şiddeti, etkili olduğu süre, etkilediği alan, toplam can kaybı, toplam ekonomik kayıp, sosyal etki ve etkinin kalıcılığı**. Ülkenin gelişmişlik düzeyi bu ölçütler arasında yoktur."}, {"q": "Bryant'ın puanlama tablosu ve afetlerin önem sırası ile ilgili hangisi doğrudur?", "opts": [{"t": "Ölçek 1 (en küçük/önemsiz) ile 5 (en büyük/önemli) arasında gider"}, {"t": "Afetlerin önem sırası tüm ülkelerde aynıdır"}, {"t": "Ölçek 1 (en büyük/önemli) ile 5 (en küçük/önemsiz) arasında gider"}, {"t": "Türkiye'de kuraklık önem sıralamasında başı çeker"}, {"t": "Akdeniz'de deprem tek başına öne çıkan afettir"}], "a": 2, "exp": "Bryant'ın puanlamasında ölçek **1'den (en büyük/önemli) 5'e (en küçük/önemsiz)** doğru gider; tabloyu ters okumamak gerekir. Kitabın notu: önem sırası **ülkeden ülkeye değişir** — **Akdeniz'de** kuraklık, sel, orman yangını ve heyelan öne çıkarken **Türkiye'de deprem** başı çeker."}, {"q": "Geçen yüzyılda dünyada en çok can kaybına yol açan on afetle ilgili hangisi doğrudur?", "opts": [{"t": "Yarısı deprem, yarısı seldir"}, {"t": "Altısı sel, dördü kuraklıktır"}, {"t": "Çoğu deprem olup tamamı Asya'daki kalabalık ülkelerde meydana gelmiştir"}, {"t": "Altısı kuraklık, üçü sel, biri depremdir"}, {"t": "Hiçbiri deprem değildir; altısı kuraklık, dördü seldir"}], "a": 4, "exp": "En ölümcül on afetin **tamamı sel ve kuraklıktır**: **altısı kuraklık, dördü sel**; **hiçbiri deprem değildir**. Hepsi **Çin, Hindistan ve Sovyet Rusya**'da meydana gelmiştir (Kaynak: Özceylan 2011, ders kitabı Tablo 1.3). Sınıfın büyük çoğunluğu \"deprem\" der, çünkü Türkiye'de deprem en görünür afettir."}, {"q": "Geçen yüzyılın en ölümcül tek afeti olarak verilen olay ve yaklaşık can kaybı hangisidir?", "opts": [{"t": "Çin'de kuraklık – yaklaşık 3.000.000"}, {"t": "Çin'de sel – yaklaşık 3.700.000"}, {"t": "Hindistan'da kuraklık – yaklaşık 1.500.000"}, {"t": "Sovyet Rusya'da kuraklık – yaklaşık 1.200.000"}, {"t": "Çin'de sel – yaklaşık 2.000.000"}], "a": 1, "exp": "Listenin başında **Çin'deki sel (~3.700.000 can kaybı)** vardır. Ardından Çin kuraklığı (~3.000.000), Çin seli (~2.000.000), Hindistan kuraklıkları (~1.500.000 ve ~1.250.000, iki ayrı olay) ve Sovyet Rusya kuraklığı (~1.200.000) gelir. Yani tek bir afette **3 milyondan fazla** insanın öldüğü olmuştur."}, {"q": "Geçen yüzyılın en ölümcül afetleri listesinde yer alan Sovyet Rusya kaydı ile ilgili hangisi **yanlıştır**?", "opts": [{"t": "Volga havzası ve Güney Uralları etkileyen 1921 kuraklığıdır"}, {"t": "Olay bir sel felaketidir ve Sibirya'da yaşanmıştır"}, {"t": "EM-DAT'taki can kaybı rakamı yaklaşık 1.200.000'dir"}, {"t": "Kitapta ve EM-DAT'ta \"Sovyetler Birliği\" olarak geçer"}, {"t": "SSCB olaydan sonra, Aralık 1922'de kurulmuştur"}], "a": 1, "exp": "Sovyet Rusya kaydı bir **kuraklıktır**: **1921**, **Volga havzası ve Güney Urallar**, yaklaşık **1.200.000** can kaybı (EM-DAT rakamı; tarihçilerin tahminleri ~5 milyona kadar çıkar). Kitap ve EM-DAT \"Sovyetler Birliği\" der; ancak **SSCB Aralık 1922'de kurulduğu** için olay sırasında devletin adı Sovyet Rusya'ydı. Üst üste kuraklık, iç savaş, zorla tahıl toplama ve çöken ulaşımla birleşerek kıtlığa dönüştü — **tehlike ile zarar görebilirliğin birleşmesine** iyi bir örnek."}, {"q": "Kuraklık ve selin geçen yüzyılın en ölümcül afetleri olmasının nedenleriyle ilgili aşağıdakilerden hangileri doğrudur?\nI. Yavaş geliştikleri için müdahale gecikir ve \"acil\" sayılmazlar.\nII. Çok geniş alanları, hatta kıtaları etkileyebilirler.\nIII. Ölümler doğrudan değil; kıtlık, açlık ve bulaşıcı hastalık üzerinden dolaylı gerçekleşir.", "opts": [{"t": "Yalnız II"}, {"t": "I ve II"}, {"t": "II ve III"}, {"t": "I ve III"}, {"t": "I, II ve III"}], "a": 4, "exp": "Derste üç sebep birlikte verilir: **(1) yavaş gelişirler**, müdahale gecikir; **(2) etkiledikleri alan çok geniştir**; **(3) ölüm dolaylıdır** — kuraklık kıtlığa, kıtlık açlık ve hastalığa yol açar. Öğrenciler genellikle yalnızca \"geniş alan\" der; üçünün de aranması gerekir.\n💡 AYAY bağlantısı: bu afetlerde ölümlerin çoğu travma değil açlık, susuzluk ve bulaşıcı hastalık kaynaklıdır — müdahale arama-kurtarma değil, **halk sağlığı** işidir."}, {"q": "En ölümcül on afetin tamamının Çin, Hindistan ve Sovyet Rusya'da meydana gelmesi derste nasıl açıklanmıştır?", "opts": [{"t": "Bu ülkelerde tehlikenin (kuraklık ve sel) şiddeti diğer ülkelerden çok daha yüksek olmuştur"}, {"t": "Bu ülkelerde aktif fay hatları yoğundur"}, {"t": "EM-DAT yalnızca bu üç ülkenin verilerini kaydetmiştir"}, {"t": "Olaylar tesadüfen bu ülkelerde yoğunlaşmıştır"}, {"t": "Kalabalık, tarıma bağımlı, kırılgan nüfuslar: belirleyici olan zarar görebilirlik"}], "a": 4, "exp": "Listenin tamamının bu üç ülkede olması **tesadüf değildir**: **çok kalabalık, tarıma bağımlı ve o dönemde kırılgan** nüfuslar söz konusudur. Ders bunu \"**tehlike değil, zarar görebilirlik**\" diye özetler. Kitap bu tablo için yıl vermez; olayların büyük kısmı 20. yüzyılın ilk yarısındadır."}, {"q": "EM-DAT verilerine (1900–2016) göre dünya afet bilançosuyla ilgili eşleştirmelerden hangisi **yanlıştır**?", "opts": [{"t": "Doğal afetlerde ölen – yaklaşık 174 milyon"}, {"t": "Doğa kaynaklı afet sayısı – 14.145"}, {"t": "Teknolojik afet sayısı – 8.361"}, {"t": "Afetler nedeniyle evsiz kalan – 174 milyon"}, {"t": "Toplam maddi kayıp – yaklaşık 3 trilyon dolar"}], "a": 0, "exp": "Doğru değerler: **14.145 doğa kaynaklı**, **8.361 teknolojik** afet; **33 milyon can kaybı**; **174 milyon evsiz**; yaklaşık **3 trilyon dolar** maddi kayıp. 174 milyon evsiz sayısıdır, can kaybı değil. Bu rakamlar yalnızca **EM-DAT eşiğini aşan** olaylara aittir; gerçek toplam daha büyüktür.\n💡 33 milyon, bugünkü Türkiye nüfusunun yaklaşık **üçte birine** denk gelir."}, {"q": "Dünya afet istatistiklerinde verilen \"yaklaşık 3 trilyon dolar\" maddi kayıp rakamı için hangisi doğrudur?", "opts": [{"t": "Dolaylı ve ikincil etkiler de dâhil edilerek hesaplanmış toplam kayıptır"}, {"t": "Yalnızca doğrudan kayıptır; dolaylı etkiler dâhil değildir"}, {"t": "Yalnızca teknolojik afetlerin maliyetidir"}, {"t": "1980–2011 dönemine ait sigortalı kayıplardır"}, {"t": "Eşik altı olaylar dâhil tüm afetleri kapsar"}], "a": 1, "exp": "3 trilyon dolar pek çok ülkenin yıllık millî gelirinin kat kat üzerindedir ve **yalnızca doğrudan kayıptır**; dolaylı ve ikincil etkiler dâhil değildir. Ayrıca yalnızca **EM-DAT eşiğini aşan** olayları kapsar. Bu veriler kitabın (2017 EM-DAT) dönemine aittir; güncel rakamlar için **emdat.be** yıllık raporlarına bakılmalıdır."}, {"q": "Bir öğrenci, \"1920'de Afrika'nın iç kesimlerinde meydana gelen bir sel bugün EM-DAT'ta neden muhtemelen yoktur?\" diye soruyor. Derste afet sayılarındaki artışı açıklayan nedenlerden hangisi bu durumla ilgilidir?", "opts": [{"t": "Gerçek artış (iklim değişikliği)"}, {"t": "Maruziyet artışı"}, {"t": "Zarar görebilirlik artışı"}, {"t": "Nüfus artışı"}, {"t": "Kayıt kapasitesi artışı"}], "a": 4, "exp": "Haberleşme ve kayıt sistemleri geliştikçe daha çok olay kayda geçer; 1920'de böyle bir seli muhtemelen kimse kaydetmezdi, bugün aynı olay uydudan görülüyor ve sayılıyor. Bu **kayıt kapasitesi artışıdır** ve grafikteki artışın bir kısmını açıklar. Veriyi okuma disiplini: artış olayın mı arttığını, yoksa **ölçümün mü iyileştiğini** gösteriyor?"}, {"q": "Afet sayılarındaki artışın nedenleri ile açıklamaları eşleştirildiğinde hangisi **yanlıştır**?", "opts": [{"t": "Gerçek artış – İklim değişikliğine bağlı aşırı hava olaylarının sıklık ve şiddetinin artması"}, {"t": "Maruziyet artışı – Yanlış arazi kullanımı ve çevre kirliliği"}, {"t": "Maruziyet artışı – Hızlı nüfus artışı ve çarpık kentleşme"}, {"t": "Zarar görebilirlik artışı – Yanlış yer seçimi ve doğal dengenin bozulması"}, {"t": "Kayıt kapasitesi artışı – Haberleşme ve kayıt sistemlerinin gelişmesi"}], "a": 1, "exp": "**Maruziyet artışı**: hızlı nüfus artışı ve çarpık kentleşme daha çok insanı tehlikeli alanlara yerleştirir. **Yanlış arazi kullanımı, yer seçimi, çevre kirliliği ve doğal dengenin bozulması** ise **zarar görebilirlik artışıdır**. EM-DAT grafikleri **1980'li yıllardan** itibaren hem doğa kaynaklı hem teknolojik afetlerde ciddi artış gösterir."}, {"q": "Dünya Bankası tahminine göre plansız şehirleşme sürerse 2050'de deprem, fırtına ve sele maruz kalacak insan sayısı için ne öngörülmektedir?", "opts": [{"t": "İki katına çıkarak 3 milyara ulaşması"}, {"t": "İki katına çıkarak 1,5 milyara ulaşması"}, {"t": "Üç katına çıkarak 1,5 milyara ulaşması"}, {"t": "Yarıya inerek 750 milyona düşmesi"}, {"t": "Sabit kalarak 1,5 milyar civarında seyretmesi"}], "a": 1, "exp": "Dünya Bankası'na göre plansız şehirleşme sürerse 2050'de deprem, fırtına ve sele maruz kalacak insan sayısı **iki katına çıkarak 1,5 milyara** ulaşacaktır. Bu tahmin **maruziyet artışının** somut bir örneğidir: tehlike aynı kalsa bile tehlikeli alanlarda yaşayan insan sayısı artmaktadır.\n💡 2050 formülü: **2 kat → 1,5 milyar**."}, {"q": "1980–2011 arasında dünyada en büyük ekonomik kayba yol açan afet hangisidir?", "opts": [{"t": "ABD 2005 Katrina Kasırgası – 125 milyar $"}, {"t": "Japonya 1995 Kobe depremi – 100 milyar $"}, {"t": "Çin 2008 Wenchuan depremi – 85 milyar $"}, {"t": "ABD 1994 Northridge depremi – 44 milyar $"}, {"t": "Japonya 2011 deprem/tsunami – 210 milyar $"}], "a": 4, "exp": "Sıralama: **1. Japonya 2011 deprem ve tsunami (210 milyar $)**, 2. ABD 2005 Katrina (125), 3. Japonya 1995 Kobe (100), 4. Çin 2008 Wenchuan (85), 5. ABD 1994 Northridge (44). İlk beşin dördü depremdir — en maliyetli listede **en çok tekrar eden afet türü depremdir**."}, {"q": "En maliyetli afetler listesindeki olay–yıl–ülke eşleştirmelerinden hangisi **yanlıştır**?", "opts": [{"t": "Katrina Kasırgası – 2005 – ABD"}, {"t": "Northridge depremi – 1994 – ABD"}, {"t": "Wenchuan depremi – 2008 – Çin"}, {"t": "Kobe depremi – 2008 – Çin"}, {"t": "Deprem ve tsunami – 2011 – Japonya"}], "a": 3, "exp": "**Kobe depremi 1995'te Japonya'da** olmuştur (100 milyar $). 2008'de Çin'deki olay **Wenchuan depremidir** (85 milyar $). Katrina 2005 ABD (125), Northridge 1994 ABD (44), deprem-tsunami 2011 Japonya (210 milyar $)."}, {"q": "En maliyetli ve en ölümcül afet listelerinin karşılaştırılmasından çıkan sonuçla ilgili hangisi doğrudur?", "opts": [{"t": "En maliyetli ve en ölümcül afetler aynı ülkelerde yoğunlaşır"}, {"t": "Yoksul ülkelerde mutlak maddi kayıp gelişmiş ülkelerden büyüktür"}, {"t": "Mutlak maddi kayıp, bir afetin ülkeye göreli etkisini tam olarak yansıtır"}, {"t": "Gelişmiş ülkelerde can kaybı, kaybedilen değer arttıkça yükselir"}, {"t": "En maliyetliler gelişmiş, en ölümcüller yoksul ülkelerde görülür"}], "a": 4, "exp": "En maliyetli beş afetin tamamı **gelişmiş ülkelerdedir** (kaybedilecek değer fazla, ama yapılar sağlam ve sistemler çalıştığı için can kaybı düşük). En ölümcüller **yoksul ülkelerdedir**. Ancak **mutlak kayıp ile göreli etki farklıdır**: yoksul ülkedeki küçük rakamlı kayıp, millî gelirine oranla çok daha yıkıcı olabilir."}, {"q": "Dünya Bankası raporuna göre doğa kaynaklı afetlerin az gelişmiş ülkelerde meydana gelme oranı ve bu ülkelerdeki can kaybı payı hangisidir?", "opts": [{"t": "Afetlerin %9'u – can kaybının %48'i"}, {"t": "Afetlerin %48'i – can kaybının %9'u"}, {"t": "Afetlerin %19'u – can kaybının %84'ü"}, {"t": "Afetlerin %9'u – can kaybının %84'ü"}, {"t": "Afetlerin %33'ü – can kaybının %48'i"}], "a": 0, "exp": "Doğa kaynaklı afetlerin **yalnızca %9'u** az gelişmiş ülkelerde meydana gelir, ama toplam insan kaybının **%48'i** bu ülkelerdedir. Bu, Hafta 1'deki Haiti–Şili karşılaştırmasının küresel ölçekteki hâlidir; nedeni yapı stoku, kurumsal kapasite, yoksulluk, eğitim gibi faktörlerdir.\n💡 \"**9'a 48**\": afetin onda biri, ölümün neredeyse yarısı."}, {"q": "Dünya Bankası raporunun afet önlemeyle ilgili temel mesajı hangisidir?", "opts": [{"t": "\"Direnç kültürü\" geliştirilmeli; önleme bütçeleri en az yardım bütçeleri kadar olmalı"}, {"t": "Afet yardım bütçeleri, önleme bütçelerinin en az iki katına çıkarılmalı ve öncelik müdahaleye verilmelidir"}, {"t": "Az gelişmiş ülkelere yalnızca afet sonrası yardım yapılmalıdır"}, {"t": "Önleme harcamaları can kaybını azaltmakta etkisizdir"}, {"t": "Afet yönetimi yalnızca uluslararası kuruluşlara bırakılmalıdır"}], "a": 0, "exp": "Rapor, dünyanın acilen bir **\"direnç kültürü\"** geliştirmesi ve **afet önleme bütçelerinin en az afet yardımı bütçeleri kadar büyütülmesi** gerektiğini vurgular. Afet öncesi tedbirlere bütçe ayıran ülkelerde insan ve mal kaybı çok daha düşüktür — **önleme, müdahaleden ucuzdur**. \"Direnç kültürü\", 12. haftadaki dirençli toplum/kent kavramının erken hâlidir."}, {"q": "Barış (2012) çalışmasına göre Türkiye'nin eğilimli olduğu başlıca dört doğa kaynaklı afet tipi hangisinde doğru verilmiştir?", "opts": [{"t": "Deprem, kuraklık, sel, çığ"}, {"t": "Deprem, heyelan, çığ, kaya düşmesi"}, {"t": "Deprem, tsunami, sel, fırtına"}, {"t": "Heyelan, sel, kuraklık, salgın"}, {"t": "Deprem, heyelan, sel, yangınlar"}], "a": 4, "exp": "Barış (2012)'ye göre Türkiye başlıca dört tip afete eğilimlidir: **deprem, heyelan, sel ve yangınlar** (her yıl çok sayıda orman, işyeri ve konut yangını görülür). Çeldiricilerdeki kuraklık, tsunami, çığ ve salgın gibi olaylar bu dörtlüde yer almaz.\n💡 Dörtlüyü \"**D-H-S-Y**\" (Deprem, Heyelan, Sel, Yangın) diye kodlayabilirsin."}, {"q": "Barış (2012)'ye göre Türkiye'de depremle ilgili oranlardan hangisi **yanlış** eşleştirilmiştir?", "opts": [{"t": "Deprem tehlikesi çok yüksek bölgelerde yaşayan nüfus – %70"}, {"t": "Aktif fay bölgesindeki ülke toprağı – %66"}, {"t": "Toplam afet kayıplarının depremden kaynaklanan payı – %75"}, {"t": "Geçen yüzyılda depremle hasar gören binaların payı – %75"}, {"t": "Toplam afet kayıplarının depremden kaynaklanan payı – %64"}], "a": 2, "exp": "Doğru değerler: nüfusun **%70**'i deprem tehlikesi çok yüksek bölgelerde; ülkenin **%66**'sı aktif fay bölgesinde; geçen yüzyılda hasar gören binaların **%75**'i ve toplam afet kayıplarının **%64**'ü depremlerden. %75 bina hasarına, %64 toplam kayba aittir.\n💡 \"**70-66-75-64**\": Nüfus–Toprak–Bina–Kayıp. %70 ve %66 birlikte: nüfusun da ülkenin de üçte ikisinden fazlası — deprem bir bölge sorunu değil, **ülke sorunudur**."}, {"q": "Barış (2012)'ye göre Türkiye'de **heyelan** ile ilgili oranlar hangisinde doğru verilmiştir?", "opts": [{"t": "Toprakların %25'i maruz, nüfusun %11'i heyelanlı bölgede, zararların %16'sı heyelandan"}, {"t": "Toprakların %66'sı maruz, nüfusun %25'i heyelanlı bölgede, zararların %15'i heyelandan"}, {"t": "Toprakların %11'i maruz, nüfusun %25'i heyelanlı bölgede, zararların %16'sı heyelandan"}, {"t": "Toprakların %25'i maruz, nüfusun %16'sı heyelanlı bölgede, zararların %11'i heyelandan"}, {"t": "Toprakların %16'sı maruz, nüfusun %11'i heyelanlı bölgede, zararların %25'i heyelandan"}], "a": 0, "exp": "Heyelan: ülke topraklarının **%25**'i (dörtte biri) maruz, nüfusun **%11**'i heyelanlı bölgelerde, toplam afet zararlarının **%16**'sı (altıda biri) heyelandan. Öğrenciler heyelanı küçümser; oysa bu rakamlar önemini gösterir. Selden kaynaklanan zarar payı ise **%15**'tir."}, {"q": "Barış (2012)'ye göre Türkiye'nin sellere karşı savunmasızlığı ve sel kayıpları ile ilgili hangisi doğrudur?", "opts": [{"t": "Yalnızca aşırı yağış nedeniyle savunmasız; zararların %64'ü, yıllık ~1 milyar dolar"}, {"t": "Aktif faylar nedeniyle savunmasız; zararların %16'sı, yıllık ~100 milyon dolar"}, {"t": "Orman kaybı, erozyon, bilgisiz gelişme; zararların %15'i, yılda ~100 milyon $"}, {"t": "Orman kayıpları nedeniyle savunmasız; zararların %25'i, yıllık ~10 milyon dolar"}, {"t": "İklim değişikliği nedeniyle savunmasız; zararların %11'i, yıllık ~500 milyon dolar"}], "a": 2, "exp": "Kitaba göre Türkiye **orman kayıpları, erozyon ve bilgisiz gelişmenin** yarattığı etkilerle sellere çok savunmasızdır; toplam afet zararlarının **%15**'i sel kaynaklıdır, **yıllık ortalama kayıp ~100 milyon dolar**dır. Üç sebebin üçü de **insan kaynaklıdır**."}, {"q": "Derste verilen **aktif fay** tanımı hangisidir?", "opts": [{"t": "Son 10.000 yılda hareket etmiş, yeniden kırılabilecek fay"}, {"t": "Son 100 yıl içinde büyük deprem üretmiş fay"}, {"t": "Son 1.000 yıl içinde hareket etmiş, yerleşim altındaki fay"}, {"t": "Son 1 milyon yıl içinde hiç hareket etmemiş fay"}, {"t": "Yüzeyde izlenebilen, uzunluğu 100 km'yi aşan fay"}], "a": 0, "exp": "**Aktif fay**: **son 10.000 yıl içinde hareket etmiş**, yeniden kırılma potansiyeli taşıyan faydır. Ülke topraklarının **%66**'sı aktif fay bölgesindedir. Ayrıntısı 4. haftada işlenecektir."}, {"q": "7269 sayılı kanuna göre **afetzede** tanımı hangisidir?", "opts": [{"t": "Afette yaralanan ve bu nedenle acil sağlık hizmeti almak zorunda kalan kişi"}, {"t": "Afette evi yıkılan ve devlet tarafından barındırılan kişi"}, {"t": "Afetten fiziksel, sosyal ve ekonomik yönden zarar gören veya görmesi muhtemel kişi"}, {"t": "Afette hayatını kaybeden kişilerin birinci derece yakınları"}, {"t": "Yalnızca gerçekleşmiş bir afette fiziksel ya da ekonomik yönden doğrudan zarar gören kişi"}], "a": 2, "exp": "7269 sayılı kanuna göre afetzede: **olmuş ya da olması muhtemel** afet ve acil durumlardan dolayı **fiziksel, sosyal ve ekonomik** yönden **zarara uğrayan veya uğraması muhtemel** kişidir. Öğrencilerin çoğu yalnızca \"yaralanan kişi\" der; tanım bundan çok daha geniştir."}, {"q": "Heyelan riski nedeniyle evinden tahliye edilen ancak hiçbir fiziksel zarar görmemiş bir aile için hangisi doğrudur?", "opts": [{"t": "Afetzede değildir; fiziksel zarar görmemiştir"}, {"t": "Afetzede değildir; ancak heyelan gerçekleşir ve evi zarar görürse afetzede sayılır"}, {"t": "Yalnızca devletten barınma yardımı alırsa afetzede sayılır"}, {"t": "Afetzede değil, \"etkilenme riski taşıyan vatandaş\"tır"}, {"t": "Afetzededir; tanım \"uğraması muhtemel\" kişileri de kapsar"}], "a": 4, "exp": "Tanımdaki **\"uğraması muhtemel kişi\"** ifadesi hukuken önemlidir: henüz zarar görmemiş ama **risk altındaki** kişiler de afetzede sayılabilir. Heyelan riski nedeniyle tahliye edilen aile **afetzededir** ve devletin sorumluluğu altındadır."}, {"q": "Türkiye'nin temel afet kanunu olan 7269 sayılı kanunun adı ve yılı hangisidir?", "opts": [{"t": "Afet ve Acil Durum Yönetimi Kanunu – 2009"}, {"t": "Umumi Hayata Müessir Afetler Kanunu – 1959"}, {"t": "Umumi Hayata Müessir Afetler Kanunu – 1999"}, {"t": "Afetler Epidemiyolojisi Kanunu – 1988"}, {"t": "Sivil Savunma Kanunu – 1959"}], "a": 1, "exp": "**7269 sayılı Umumi Hayata Müessir Afetler Kanunu** **1959** tarihlidir ve Türkiye'nin temel afet kanunudur. Afetzede tanımı bu kanuna ve AFAD (2014) kaynağına dayanır. **AFAD** (Afet ve Acil Durum Yönetimi Başkanlığı) Türkiye'de afet yönetiminden sorumlu merkezî kurumdur."}, {"q": "Afetzede tanımının geniş olmasının afet sağlık hizmetleri açısından anlamı hangisidir?", "opts": [{"t": "Sağlık planlaması yalnızca ölü sayısına göre yapılmalıdır"}, {"t": "Yaralanmamış kişiler sağlık hizmeti planlamasının tamamen dışında tutulmalıdır"}, {"t": "Etkilenen kişi sayısı genellikle can kaybından küçüktür"}, {"t": "Psikososyal destek yalnızca yaralılara verilmelidir"}, {"t": "Planlama yaralı sayısına değil etkilenen sayısına göre yapılmalıdır"}], "a": 4, "exp": "Tanımın genişliği, istatistiklerde **etkilenen kişi sayısının can kaybından çok daha büyük** olmasını açıklar. Sağlık planlaması **etkilenen sayısına** göre yapılır: yaralanmamış ama evsiz kalmış 10.000 kişi **barınma, beslenme, kronik ilaç ve psikososyal destek** ihtiyacı doğurur (temiz su da etkilenen nüfusun ihtiyaçları arasındadır)."}, {"q": "Gökçe ve arkadaşlarının (2008) çalışmasının kapsadığı dönem ve toplam bulguları hangisidir?", "opts": [{"t": "1900–2016 – 14.145 afet olayı, 33 milyon afetzede"}, {"t": "1950–2008 – 284.996 afet olayı, 29.807 afetzede"}, {"t": "1950–2008 – 29.807 afet olayı, 284.996 afetzede"}, {"t": "1980–2011 – 29.807 afet olayı, 158.241 afetzede"}, {"t": "1959–2014 – 13.494 afet olayı, 284.996 afetzede"}], "a": 2, "exp": "Gökçe vd. (2008), **1950–2008** dönemini kapsar ve Türkiye'de toplam **29.807 afet olayı** ile **284.996 afetzede** kaydeder. Bu, 58 yılda her gün ortalama **bir buçuk** afet olayı demektir. 1900–2016 / 14.145 EM-DAT'ın dünya verisidir."}, {"q": "Gökçe vd. (2008) verilerine göre Türkiye'de **en sık görülen** afet ile **en çok insanı etkileyen** afet sırasıyla hangisidir?", "opts": [{"t": "Deprem – Deprem"}, {"t": "Heyelan – Deprem"}, {"t": "Deprem – Heyelan"}, {"t": "Su baskını – Deprem"}, {"t": "Heyelan – Su baskını"}], "a": 1, "exp": "**Heyelan** 13.494 olayla en sık görülen afettir, ama 59.345 afetzede üretir. **Deprem** 5.318 olayla heyelanın yarısından azdır, ama **158.241 afetzede** ile toplam afetzedenin yarısından fazlasını oluşturur. **Sıklık ile etki aynı şey değildir.**"}, {"q": "Gökçe vd. (2008) verilerine göre olay başına ortalama afetzede sayısı heyelanda ve depremde yaklaşık kaçtır?", "opts": [{"t": "Heyelanda yaklaşık 30 kişi, depremde 4-5 kişi"}, {"t": "Heyelanda 1-2 kişi, depremde yaklaşık 10 kişi"}, {"t": "Her ikisinde de yaklaşık 10 kişi"}, {"t": "Heyelanda 4-5 kişi, depremde yaklaşık 30 kişi"}, {"t": "Heyelanda 4-5 kişi, depremde yaklaşık 300 kişi"}], "a": 3, "exp": "Heyelan: 59.345 / 13.494 ≈ **4-5 kişi**; deprem: 158.241 / 5.318 ≈ **30 kişi**. Neden? Heyelan genellikle **kırsalda**, birkaç evi etkiler; deprem **şehri vurur** ve binlerce kişiyi aynı anda etkiler. Mesleki karşılık: 112 ve UMKE planlaması **sıklığa göre değil, etkiye göre** yapılır — kitlesel müdahale kapasitesi deprem için hazırlanır."}, {"q": "Gökçe vd. (2008) verilerinde afet türlerinin **olay sayısına** göre çoktan aza doğru sıralaması hangisidir?", "opts": [{"t": "Heyelan > Deprem > Su baskını > Kaya düşmesi > Çığ"}, {"t": "Deprem > Heyelan > Su baskını > Kaya düşmesi > Çığ"}, {"t": "Heyelan > Su baskını > Deprem > Çığ > Kaya düşmesi"}, {"t": "Heyelan > Deprem > Kaya düşmesi > Su baskını > Çığ"}, {"t": "Su baskını > Heyelan > Deprem > Kaya düşmesi > Çığ"}], "a": 0, "exp": "Olay sayıları: **heyelan 13.494**, **deprem 5.318**, **su baskını 4.067** (22.157 afetzede), **kaya düşmesi 2.956** (19.422 afetzede), **çığ 731** (4.384 afetzede). Çığ en az görülen afettir ama **olay başına etkisi yüksektir**."}, {"q": "Gökçe vd. (2008) verilerini kullanırken dikkat edilmesi gereken sınırlılık hangisidir?", "opts": [{"t": "Veriler yalnızca 1999 sonrasını kapsar"}, {"t": "Veriler yalnızca EM-DAT eşiğini aşan olayları içerir"}, {"t": "Veriler 2008'de biter; 2011 Van ve 2023 depremleri dâhil değildir"}, {"t": "Veriler 2023 Kahramanmaraş depremlerini içerdiği için depremin payını olduğundan büyük gösterir"}, {"t": "Veriler yalnızca kentsel alanlardaki olayları kapsar"}], "a": 2, "exp": "Gökçe vd. (2008) **1950–2008** dönemini kapsar; **2011 Van** ve **2023 Kahramanmaraş** depremleri dâhil değildir. 2023 sonrası deprem lehine fark daha da açılmıştır. Daha güncel Türkiye kayıtları için **Türkiye Afet Bilgi Bankası (TABB – tabb.afad.gov.tr)** kullanılabilir."}, {"q": "Gökçe vd. (2008)'ye göre **afet olay sayısında** ve **afetzede sayısında** ilk sırada yer alan iller sırasıyla hangileridir?", "opts": [{"t": "Kocaeli – Erzurum"}, {"t": "Erzurum – Kocaeli"}, {"t": "Trabzon – Kocaeli"}, {"t": "Erzurum – Sakarya"}, {"t": "Bingöl – Düzce"}], "a": 1, "exp": "Olay sayısında **Erzurum (1.517 olay)** ilk sıradadır; ardından Trabzon (1.288), Bingöl (1.184), Rize (1.136), Tunceli (924). Afetzede sayısında **Kocaeli (39.524)** ilk sıradadır; ardından Erzurum (17.178), Bingöl (13.073), Sakarya (12.163), Düzce (11.875). **Sık afet ile büyük afet farklı şeylerdir.**"}, {"q": "Gökçe vd. (2008)'nin il sıralamalarında hem \"olay sayısı\" hem \"afetzede sayısı\" ilk beş listesinde yer alan iller hangileridir?", "opts": [{"t": "Erzurum ve Trabzon"}, {"t": "Kocaeli ve Bingöl"}, {"t": "Rize ve Sakarya"}, {"t": "Erzurum ve Bingöl"}, {"t": "Erzurum ve Tunceli"}], "a": 3, "exp": "Olay listesi: Erzurum, Trabzon, **Bingöl**, Rize, Tunceli. Afetzede listesi: Kocaeli, **Erzurum**, **Bingöl**, Sakarya, Düzce. İki listede ortak olan iller **Erzurum ve Bingöl**'dür. Kocaeli yalnızca afetzede listesinde ve zirvededir."}, {"q": "Kocaeli, Sakarya ve Düzce'nin afetzede sayısına göre en çok etkilenen iller listesinde yer almasının temel nedeni hangisidir?", "opts": [{"t": "Sık görülen heyelan ve kaya düşmeleri"}, {"t": "Doğu Karadeniz'e özgü yoğun yağışlar"}, {"t": "2011 Van depremi"}, {"t": "Her yıl tekrarlayan su baskınları"}, {"t": "17 Ağustos 1999 Marmara depremi"}], "a": 4, "exp": "Kocaeli, Sakarya ve Düzce'yi listeye taşıyan **tek bir olaydır: 17 Ağustos 1999 Marmara depremi**. Buna karşılık olay sayısı listesindeki iller (Erzurum, Trabzon, Bingöl, Rize, Tunceli) **dağlık ve yağışlı** bölgelerdir: heyelan, kaya düşmesi ve çığ sürekli olur ama her olay az kişiyi etkiler.\n💡 Planlama karşılığı: Erzurum **sürekli çalışan** yerel müdahale kapasitesine, Kocaeli ise **nadiren ama devasa ölçekte** devreye girecek bir kapasiteye ihtiyaç duyar."}, {"q": "Afet istatistiklerini sağlık gözüyle okurken AYAY öğrencisi için en önemli gösterge olarak vurgulanan ölü/yaralı oranı ile ilgili hangisi doğrudur?", "opts": [{"t": "Depremde ölü sayısı, yaralı sayısından her zaman ve belirgin biçimde fazladır"}, {"t": "Tsunamide yaralı sayısı ölüden çok fazladır"}, {"t": "Ölü/yaralı oranı afet türünden bağımsız olarak sabittir"}, {"t": "Selde baskın ölüm nedeni ezilme ve travmadır"}, {"t": "Depremde yaralı > ölü; sel ve tsunamide oran tersine döner"}], "a": 4, "exp": "Depremde **yaralı sayısı ölüden fazladır** (1 ölüme karşılık 2-3 yaralı) — yani kurtarılabilir hasta çoktur. **Selde ve tsunamide** oran tersine döner: **boğulma hâkimdir**, yaralı azdır; insanlar ya kurtulur ya boğulur. Bu oran **kaç ambulans ve kaç yatak** gerektiğini doğrudan belirler."}, {"q": "Afet türü ile beklenen hasta profili eşleştirmelerinden hangisi **yanlıştır**?", "opts": [{"t": "Sıcak hava dalgası – inhalasyon ve yanık"}, {"t": "Deprem – ezilme ve travma"}, {"t": "Sel – boğulma ve sonrasında salgın"}, {"t": "Yangın – inhalasyon ve yanık"}, {"t": "Sıcak hava dalgası – dolaşım ve solunum sorunları"}], "a": 0, "exp": "Derste verilen eşleştirme: **deprem → ezilme ve travma**; **sel → boğulma ve sonrasında salgın**; **sıcak dalga → dolaşım ve solunum**; **yangın → inhalasyon ve yanık**. Afet türü, karşılaşacağınız hasta profilini ve dolayısıyla **malzeme listenizi** belirler.\n💡 \"Hangi afete gittiğinizi bilmek, ne göreceğinizi bilmenin yarısıdır.\""}, {"q": "\"Afet epidemiyolojisi\" ve biyolojik afetlerle ilgili aşağıdaki ifadelerden hangisi **yanlıştır**?", "opts": [{"t": "Afet epidemiyolojisi afetlerin toplum sağlığına etkilerini sayısal olarak inceler"}, {"t": "Biyolojik afetler EM-DAT'ta teknolojik afetlerin bir alt grubudur"}, {"t": "EM-DAT'ı işleten CRED bir epidemiyoloji merkezidir"}, {"t": "COVID-19, biyolojik afetlerin sağlık sistemini tek başına kilitleyebileceğini göstermiştir"}, {"t": "Etkilenen nüfus can kaybından kat kat büyüktür ve barınma, temiz su gibi ihtiyaçları belirler"}], "a": 1, "exp": "Biyolojik afetler EM-DAT'ta **doğa kaynaklı** beş gruptan biridir, teknolojik değil. **Afet epidemiyolojisi** afetlerin toplum sağlığı üzerindeki etkilerini sayısal olarak inceleyen bilim dalıdır; CRED de bir epidemiyoloji merkezidir. COVID-19, sağlık çalışanlarının kendilerinin de etkilendiği ender afet türlerinden birinin sağlık sistemini küresel ölçekte kilitleyebileceğini gösterdi."}, {"q": "Ders kitabının (2018) güncelliğiyle ilgili derste yapılan uyarılardan hangileri doğrudur?\nI. Kitaptaki EM-DAT verileri 1900–2016 dönemine aittir.\nII. Kitabın \"yıllık kayıp GSMH'nin %3'ü\" tahmini 2023 depremleri sonrası geçerliliğini yitirmiştir.\nIII. COVID-19 pandemisi kitapta biyolojik afet örneği olarak ayrıntılı işlenmiştir.", "opts": [{"t": "Yalnız I"}, {"t": "Yalnız II"}, {"t": "II ve III"}, {"t": "I ve II"}, {"t": "I, II ve III"}], "a": 3, "exp": "Kitaptaki EM-DAT verileri **1900–2016** dönemine aittir (I doğru); **GSMH'nin %3'ü** tahmini **2023 depremleri sonrası** geçerliliğini yitirmiştir (II doğru). **COVID-19 kitapta yoktur** (III yanlış). Ayrıca Türkiye istatistiklerinin tamamı 2023 öncesine aittir. Güncel kaynaklar: **emdat.be** (dünya) ve **tabb.afad.gov.tr** (Türkiye). Sınavda kitaptaki bilgiler esastır."}, {"q": "\"Afet mi, acil durum mu, sadece doğa olayı mı?\" etkinliğinde afet ile acil durumu ayıran çizgi olarak ne gösterilmiştir?", "opts": [{"t": "Olayın fiziksel büyüklüğü"}, {"t": "Toplumun baş etme kapasitesi"}, {"t": "Olayın doğa ya da insan kaynaklı olması"}, {"t": "Olayın medyada yer alma düzeyi"}, {"t": "Olaydaki ölü sayısının 10'u aşması"}], "a": 1, "exp": "Etkinliğin cevap slaydı: afet ile acil durumu ayıran çizgi **olayın büyüklüğü değil, o toplumun baş etme kapasitesidir**. Doğa olayında kayıp ve etkilenen toplum yoktur; acil durumda **yerel kaynak yeter**; afette **kapasite aşılır**. Etkinlikte gerekçe yazılmayan cevap sayılmaz."}, {"q": "Etkinlikteki kartların beklenen yerleşimine göre aşağıdakilerden hangisi **acil durum** sütununa yerleştirilir?", "opts": [{"t": "Kimsenin bulunmadığı bir yamaçta düşen çığ"}, {"t": "2021 Bozkurt seli"}, {"t": "Okyanusun ortasında meydana gelen deprem"}, {"t": "İşletmenin müdahale ettiği küçük sızıntı"}, {"t": "2021 Manavgat yangınları"}], "a": 3, "exp": "**Acil durum** (yerel kaynak yetiyor): tek araçlı trafik kazası, **işletmenin müdahale ettiği küçük sızıntı**, iki saatlik elektrik kesintisi, mutfak yangını. **Doğa olayı**: okyanus ortasındaki deprem, mevsim normallerinde sıcaklık, kimsenin olmadığı yamaçta çığ. **Afet**: 6 Şubat 2023 depremleri, COVID-19, 2021 Bozkurt seli, 2021 Manavgat yangınları."}, {"q": "Etkinlikte **tartışmalı** kabul edilen kartlar ve gerekçeleri ile ilgili hangisi **yanlıştır**?", "opts": [{"t": "40 araçlık zincirleme kaza – ilin kapasitesine bağlıdır"}, {"t": "Tek evi etkileyen heyelan – aile için felaket, sistem için acil durumdur"}, {"t": "Kimsenin olmadığı yamaçtaki çığ – kesin olarak afettir"}, {"t": "Üç haftalık sıcak hava dalgası – yavaş gelişen afettir"}, {"t": "En çok atlanan kart sıcak hava dalgasıdır; görünmez olması öldürücü olmadığı anlamına gelmez"}], "a": 2, "exp": "Kimsenin olmadığı yamaçta çığ **doğa olayıdır** (kayıp yok, etkilenen toplum yok); aynı çığın altında araç bulunursa acil durum/afet olur — olay aynı, değişen tek şey orada birinin bulunması. Tartışmalı kartlar: **40 araçlık zincirleme kaza** (kaynak eşiği), **tek evi etkileyen heyelan** (ölçek), **üç haftalık sıcak hava dalgası** (yavaş gelişen afetin görünmezliği). Tartışmalı kartlarda gerekçe doğruysa cevap doğrudur."}]}, {"title": "Deprem I: Oluşum ve Ölçütler", "desc": "Deprem tanımı, yerin iç yapısı, levha sınırları, elastik geri sekme, öncü-ana şok-artçı, deprem dalgaları ve gölge bölgesi, odak-dış merkez-derinlik, büyüklük ve şiddet (MSK), kökene göre türler, deprem tahmini, L'Aquila ve erken uyarı", "short": "Deprem I", "questions": [{"q": "Ders notlarına göre Türkiye'de son 70 yılda afet kaynaklı can ve mal kaybının yüzde kaçı depremden kaynaklanmıştır?", "opts": [{"t": "%80"}, {"t": "%45"}, {"t": "%62"}, {"t": "%15"}, {"t": "%96"}], "a": 2, "exp": "Son 70 yılda afet kaynaklı can ve mal kaybının **%62**'si depremden gelmiştir. **%96** ise Türkiye topraklarının deprem kuşağı içindeki oranıdır; ikisi sık karıştırılır. %15 heyelanın payıdır.\n💡 \"96 toprak, 62 kayıp\": iki sayıyı birlikte ezberleyin, dönem boyunca tekrar gelecek."}, {"q": "Haftanın AYAY açısından mesleki ana fikrine göre bir depremde hasta sayısını ve sağlık kaynaklarının nereye gönderileceğini belirleyen temel ölçüt hangisidir?", "opts": [{"t": "Depremin moment magnitüdü (Mw) değeri"}, {"t": "Dış merkezin bulunduğu il–ilçe bilgisi"}, {"t": "Ana şoktan önceki öncü depremlerin sayısı"}, {"t": "Yerleşimlerde hissedilen şiddet dağılımı"}, {"t": "Depremin oluş saati"}], "a": 3, "exp": "Haftanın ikinci ana fikri: **hasta sayısını magnitüd değil, şiddet belirler.** Magnitüd dakikalar içinde gelir ve **alarmı başlatır**; ancak her yerleşim için ayrı olan **şiddet** zemin ve yapı kalitesine göre değişir ve **planı yazar**. Dış merkez bilgisi ilk sevk planı için kullanılsa da hasar başka yerde yoğunlaşabilir (1985 Meksika)."}, {"q": "Ders notlarına göre bu haftanın sınavda en çok sorulan ve öğrencilerin en sık hata yaptığı konusu hangisidir?", "opts": [{"t": "Levha sınırlarının dört türünün sayılması"}, {"t": "Büyüklük ile şiddetin ayırt edilmesi"}, {"t": "S dalgası gölge bölgesi"}, {"t": "Yerkürenin katmanlarının sırası"}, {"t": "Kökene göre deprem türlerinin sınıflanması"}], "a": 1, "exp": "Öğrenme çıktılarının 4. maddesi olan **büyüklük–şiddet ayrımı** haftanın en kritik çıktısıdır; öğrenciler haftanın sonunda bile \"deprem şiddeti 7,2\" demeye devam eder. Bu yanlış kullanım ders kitabında da açıkça eleştirilir."}, {"q": "Ders kitabındaki tanıma göre deprem nedir?", "opts": [{"t": "Yerkabuğundaki kırılmalarla ani oluşan titreşimlerin dalgalar hâlinde yayılıp yeryüzünü sarsması"}, {"t": "Levhaların birbirinden uzaklaşarak okyanus ortası sırtları oluşturması"}, {"t": "Yer altı sularının çekilmesiyle zeminin yavaş yavaş oturması ve çatlaması"}, {"t": "Astenosferdeki konveksiyon akımlarının yeryüzünü yıllar içinde yavaşça yükseltmesi"}, {"t": "Magmanın yeryüzüne çıkarken çevredeki kayaçları ısıtıp genleştirmesi olayı"}], "a": 0, "exp": "Kitap tanımı: Deprem, **yerkabuğu içindeki kırılmalar** nedeniyle ani olarak ortaya çıkan **titreşimlerin dalgalar hâlinde yayılarak** geçtikleri ortamları ve yeryüzeyini sarsma olayıdır. Tanımın merkezinde **kırılma** vardır; sarsıntı kırılmanın sonucudur. Konveksiyon akımları levhaları hareket ettiren kuvvettir, depremin kendisi değildir."}, {"q": "Depremlerin oluş nedenlerini, dalgaların yayılımını, ölçülmesini ve deprem tehlikesinin belirlenmesini inceleyen uzmanlık alanı hangisidir?", "opts": [{"t": "Volkanoloji"}, {"t": "Jeomorfoloji"}, {"t": "Sismoloji"}, {"t": "Hidroloji"}, {"t": "Meteoroloji"}], "a": 2, "exp": "**Sismoloji (deprem bilimi)**, depremlerin oluş nedenlerini, dalgaların yayılımını, ölçülmesini ve deprem tehlikesinin belirlenmesini inceleyen **jeofizik mühendisliği** uzmanlık alanıdır. Diğerleri: volkanoloji volkanları, jeomorfoloji yer şekillerini, hidroloji suları, meteoroloji atmosferi inceler."}, {"q": "\"Deprem teknik olarak saniyeler sürer; sosyal olarak bir süreçtir.\" ifadesinin sağlık hizmeti planlaması açısından anlamı hangisidir?", "opts": [{"t": "Sağlık hizmeti ihtiyacı en çok sarsıntı anında zirve yapar"}, {"t": "Artçı depremler sağlık hizmetini etkilemez"}, {"t": "Planlama sarsıntının değil, sürecin süresine göre yapılmalıdır"}, {"t": "Sağlık ekipleri yalnızca ilk 80 saniyede sahada olmalıdır"}, {"t": "Planlama yalnızca magnitüd değerine göre yapılmalıdır"}], "a": 2, "exp": "Haftanın birinci ana fikri: **Deprem bir an değil, bir süreçtir.** 6 Şubat 2023'te sarsıntı yaklaşık **80 saniye** sürdü; sağlık yükü ise ilk 72 saatte travma ve crush sendromu, sonraki haftalarda bulaşıcı hastalık ve kronik hasta tedavisinin kesintisi, aylarca ruh sağlığı ve rehabilitasyon olarak sürdü. Yani sağlık ihtiyacının zirvesi sarsıntı anında değil, **sonrasındadır**."}, {"q": "6 Şubat 2023 örneğine göre sağlık hizmeti yükünün zaman içindeki seyri ile ilgili aşağıdaki eşleştirmelerden hangisi ders notlarıyla uyumludur?", "opts": [{"t": "İlk 72 saat: bulaşıcı hastalıklar; sonraki aylar: crush sendromu"}, {"t": "İlk 72 saat: travma ve crush sendromu; sonraki aylar: ruh sağlığı ve rehabilitasyon"}, {"t": "İlk 72 saat: kronik hasta tedavisinin kesintisi; sonraki aylar: crush sendromu"}, {"t": "İlk 72 saat: rehabilitasyon; sonraki aylar: travma"}, {"t": "İlk 72 saat: ruh sağlığı; sonraki haftalar: travma"}], "a": 1, "exp": "Ders notuna göre sıra: **ilk 72 saat** travma ve **crush sendromu**; **sonraki haftalar** bulaşıcı hastalık ve kronik hasta tedavisinin kesintiye uğraması; **sonraki aylar** ruh sağlığı ve rehabilitasyon.\n💡 Sıra: Ezilme → Enfeksiyon → Psikoloji (önce beden, sonra çevre, en son zihin)."}, {"q": "Depremler yerkürenin hangi katmanında oluşur?", "opts": [{"t": "Manto"}, {"t": "Astenosfer"}, {"t": "Litosfer"}, {"t": "Dış çekirdek"}, {"t": "İç çekirdek"}], "a": 2, "exp": "Depremler yalnızca en dıştaki **katı ve kırılgan** katman olan **litosferde (taşküre)** oluşur; kırılabilmesi için kayacın katı ve gevrek olması gerekir. **Astenosfer** yumuşaktır ve yavaş akar; levhaları hareket ettiren konveksiyon akımları burada oluşur ama deprem burada doğmaz."}, {"q": "Levhaları hareket ettiren konveksiyon (ısı) akımları hangi katmanda oluşur?", "opts": [{"t": "Dış çekirdek"}, {"t": "Litosfer"}, {"t": "Yerkabuğunun yüzeyi"}, {"t": "Astenosfer"}, {"t": "İç çekirdek"}], "a": 3, "exp": "**Astenosfer**, taşkürenin hemen altındaki **yumuşak üst manto**dur. Konveksiyon akımları burada oluşur ve levhaları hareket ettirir — yani levhaları hareket ettiren kuvvet **aşağıdan** gelir.\n💡 Kaynayan tencere benzetmesi: yüzeydeki köpük parçaları levhalardır, onları hareket ettiren alttaki dolaşımdır."}, {"q": "Yerkürenin katmanlarının dıştan içe doğru sıralaması hangisidir?", "opts": [{"t": "Litosfer – astenosfer – dış çekirdek – manto – iç çekirdek"}, {"t": "Litosfer – manto – astenosfer – dış çekirdek – iç çekirdek"}, {"t": "Astenosfer – litosfer – manto – iç çekirdek – dış çekirdek"}, {"t": "Manto – litosfer – astenosfer – dış çekirdek – iç çekirdek"}, {"t": "Litosfer – astenosfer – manto – dış çekirdek – iç çekirdek"}], "a": 4, "exp": "Dıştan içe beş katman: **Litosfer → Astenosfer → Manto → Dış çekirdek (sıvı) → İç çekirdek (katı)**. Merkeze uzaklık yaklaşık **6371 km**'dir.\n💡 Baş harfler: **L-A-M-D-İ** (Litosfer, Astenosfer, Manto, Dış, İç)."}, {"q": "Aşağıdakilerden hangisi yerkürenin katmanları ile ilgili olarak YANLIŞTIR?", "opts": [{"t": "İç çekirdek dış çekirdekten daha soğuk olduğu için katıdır"}, {"t": "Litosfer yaklaşık 70–100 km kalınlığındadır ve kıtalar ile okyanuslar burada yer alır"}, {"t": "Manto, litosfer ile çekirdek arasında yaklaşık 2900 km kalınlığında bir kuşaktır"}, {"t": "Çekirdeğin nikel–demir karışımından oluştuğu kabul edilir"}, {"t": "Dış çekirdek sıvıdır; S dalgası buradan geçemez"}], "a": 0, "exp": "İç çekirdek dış çekirdekten **daha sıcaktır**; buna rağmen üzerindeki **muazzam basınç** demirin erimesini engellediği için **katıdır**. Diğer ifadeler doğrudur: dış çekirdek sıvıdır (S dalgası geçemez), çekirdek nikel–demirdir, manto ~2900 km, litosfer ~70–100 km'dir."}, {"q": "Slayttaki yerküre şemasına göre dış çekirdek yaklaşık hangi derinlik aralığında yer alır?", "opts": [{"t": "2900 – 5150 km"}, {"t": "100 – 350 km"}, {"t": "5150 – 6371 km"}, {"t": "350 – 700 km"}, {"t": "0 – 100 km"}], "a": 0, "exp": "Şemadaki değerler: **Litosfer 0–100 km**, **astenosfer 100–350 km**, **manto 2900 km'ye kadar**, **dış çekirdek 2900–5150 km**, **iç çekirdek 5150–6371 km**. Rakamlar ölçek fikri vermek içindir; asıl önemli olan sıralama ve hangisinin katı/sıvı olduğudur."}, {"q": "Dış çekirdeğin sıvı olduğu nasıl anlaşılmıştır?", "opts": [{"t": "P dalgasının dış çekirdekte hızlanmasından"}, {"t": "Volkanik lavların kimyasal analizinden"}, {"t": "Yüzey dalgalarının genliğinin artmasından"}, {"t": "S dalgasının dış çekirdekten geçememesinden"}, {"t": "Derin sondaj kuyularından alınan örneklerden"}], "a": 3, "exp": "Dünyanın merkezine kimse inmedi; dış çekirdeğin sıvı olduğunu **S dalgasının buradan geçememesinden** biliyoruz. Sıvılar şekil değişimine (**makaslamaya**) direnç göstermez, bu yüzden enine dalgayı taşıyamaz. P dalgası sıvıdan geçebilir ama dış çekirdeğe girerken yavaşlar ve kırılır.\n💡 Yerküre hakkında bildiğimiz hemen her şeyi depremlere borçluyuz."}, {"q": "\"Yerküre bir elma olsaydı\" benzetmesiyle anlatılmak istenen nedir?", "opts": [{"t": "Depremlerin doğduğu litosferin, elmanın kabuğu kadar ince olduğu"}, {"t": "Astenosferin yerkürenin yarısını kapladığı"}, {"t": "Depremlerin elmanın merkezine karşılık gelen derinlikte oluştuğu"}, {"t": "Dış çekirdeğin elmanın çekirdeği gibi katı olduğu"}, {"t": "Mantonun elmanın kabuğu kadar ince olduğu"}], "a": 0, "exp": "**Ölçek fikri**: Yerküre bir elma olsaydı, depremlerin doğduğu **litosfer** elmanın **kabuğu** kadar ince kalırdı. Bu, şekildeki ince dış katmanların neden büyütülerek çizildiğini de açıklar."}, {"q": "Ders notlarına göre dünyada yaklaşık kaç büyük levha vardır ve depremler genel olarak nerede toplanır?", "opts": [{"t": "10 kadar büyük levha; depremler levha sınırlarında toplanır"}, {"t": "5 büyük levha; depremler yalnızca kıtaların iç kısımlarında görülür"}, {"t": "3 büyük levha; depremler levhaların ortasında toplanır"}, {"t": "10 kadar büyük levha; depremler rastgele dağılır"}, {"t": "25 kadar büyük levha; depremler okyanusların ortasında toplanır"}], "a": 0, "exp": "Dünyada **10 kadar büyük** ve çok sayıda küçük levha vardır. Depremler rastgele dağılmaz; büyük ölçüde **levha sınırlarında** toplanır. Levha sınırları dört türe ayrılır."}, {"q": "Isı akımlarının yükseldiği yerlerde levhaların birbirinden ayrılması ve çıkan sıcak magmanın yeni yapı oluşturmasıyla karakterize levha sınırı hangisidir?", "opts": [{"t": "Yanal yer değiştirme zonu"}, {"t": "Okyanus ortası sırtlar"}, {"t": "Sıradağ kuşağı"}, {"t": "Çarpışma zonu"}, {"t": "Yitim zonu"}], "a": 1, "exp": "**Okyanus ortası sırtlar**da levhalar **birbirinden uzaklaşır**; ısı akımlarının yükseldiği yerlerde çıkan sıcak magma sırtları oluşturur. Yitimde bir levha diğerinin altına dalar, çarpışmada sıradağlar oluşur, yanal yer değiştirmede bloklar yatay kayar."}, {"q": "Sürtünen levhalardan birinin mantoya batıp eridiği ve derin depremlerin çoğunlukla görüldüğü levha sınırı türü hangisidir?", "opts": [{"t": "Yitim zonu"}, {"t": "Doğrultu atımlı fay zonu"}, {"t": "Çarpışma zonu"}, {"t": "Yanal yer değiştirme zonu"}, {"t": "Okyanus ortası sırt"}], "a": 0, "exp": "**Yitim zonunda** bir levha diğerinin altına dalar, mantoya batar ve erir. **Derin (ve orta derinlikte) depremler** çoğunlukla buralarda olur. Japonya bir yitim zonu üzerindedir; bu yüzden hem daha sık hem daha büyük deprem üretir ve derin odaklı depremler görülür. Türkiye'de bu tip bir zon yoktur."}, {"q": "Himalayalar hangi levha sınırı mekanizmasının ürünüdür?", "opts": [{"t": "Çöküntü havzası"}, {"t": "Okyanus ortası sırt"}, {"t": "Çarpışma zonu"}, {"t": "Yitim zonu"}, {"t": "Yanal yer değiştirme zonu"}], "a": 2, "exp": "**Çarpışma zonunda** levhalar yan yana gelip çarpışır; sıkışma sonucu çok yüksek **sıradağlar** oluşur. **Himalayalar** bu mekanizmanın ürünüdür."}, {"q": "Kuzey Anadolu Fayı ve Doğu Anadolu Fayı, levha sınırı türlerinden hangisine girer?", "opts": [{"t": "Yanal yer değiştirme zonu"}, {"t": "Yitim zonu"}, {"t": "Çarpışma zonu"}, {"t": "Okyanus ortası sırt"}, {"t": "Volkanik kuşak"}], "a": 0, "exp": "Türkiye'nin en bilinen fayları (**KAF ve DAF**) **yanal atımlı** faylardır: iki blok birbirine göre **yatay** yönde yer değiştirir. Bu nedenle Türkiye depremleri **sığdır (5–10 km)** ve dar bir alanda çok ağır hasar yapar."}, {"q": "Levha sınırı türleri ile tanımları eşleştirildiğinde aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Yanal yer değiştirme zonu – iki blok yatay kayar"}, {"t": "Yitim zonu – sıkışma sonucu Himalayalar oluşur"}, {"t": "Okyanus ortası sırt – bir levha diğerinin altına dalar"}, {"t": "Çarpışma zonu – iki blok yatay olarak kayar"}, {"t": "Yitim zonu – levhalar birbirinden uzaklaşır"}], "a": 0, "exp": "Doğru eşleştirmeler: **Okyanus ortası sırt** → levhalar uzaklaşır; **Yitim zonu** → bir levha diğerinin altına dalar; **Çarpışma zonu** → çarpışma, sıradağlar (Himalayalar); **Yanal yer değiştirme** → bloklar yatay kayar.\n💡 Sınıflamanın mantığı: levhalar birbirinden ayrılıyor mu, altına giriyor mu, çarpışıyor mu, yanından mı kayıyor?"}, {"q": "Depremin oluşumunu açıklayan elastik geri sekme kuramını 1906 San Francisco depreminden sonra ortaya koyan bilim insanı kimdir?", "opts": [{"t": "Beno Gutenberg"}, {"t": "H. F. Reid"}, {"t": "Richard Oldham"}, {"t": "C. F. Richter"}, {"t": "Inge Lehmann"}], "a": 1, "exp": "**Elastik geri sekme kuramı**, **1906 San Francisco** depreminden sonra **H. F. Reid** tarafından ortaya konmuştur. Richter magnitüd tanımıyla (1935), Gutenberg çekirdek sınırıyla, Lehmann iç çekirdekle, Oldham çekirdeğin varlığıyla bilinir."}, {"q": "Elastik geri sekme kuramına göre deprem oluşum aşamalarının doğru sıralaması hangisidir?", "opts": [{"t": "Kırılma → sıkışma → yayılma → geri sekme"}, {"t": "Sıkışma → geri sekme → yayılma → kırılma"}, {"t": "Geri sekme → sıkışma → kırılma → yayılma"}, {"t": "Sıkışma → kırılma → geri sekme → yayılma"}, {"t": "Yayılma → sıkışma → kırılma → geri sekme"}], "a": 3, "exp": "Sıra: **1. Sıkışma** (levhalar iter, kayaç bükülür ve elastik enerji biriktirir) → **2. Eşik aşılır** (kuvvet sürtünme direncini aşar, kayaç kırılır) → **3. Geri sekme** (kayaç yay gibi eski şekline döner; potansiyel enerji kinetik enerjiye dönüşür) → **4. Yayılma** (enerji sismik dalgalar hâlinde yayılır, uzaklaştıkça azalır).\n💡 Cetvel benzetmesi: plastik cetveli bük (enerji birikir), kırıldığı anda parçalar yerine döner ve titreşim duyulur."}, {"q": "Elastik geri sekme kuramıyla ilgili aşağıdaki ifadelerden hangisi doğrudur?", "opts": [{"t": "Enerji deprem anında kayacın kırılmasıyla sıfırdan üretilir"}, {"t": "Enerji deprem anında üretilmez, birikmiş enerji o anda salınır"}, {"t": "Deprem, sürtünme kuvvetinin arttığı andır"}, {"t": "Kırılma anında kinetik enerji potansiyel enerjiye dönüşür"}, {"t": "Açığa çıkan enerji kaynaktan uzaklaştıkça artar"}], "a": 1, "exp": "Asıl öğrenme: enerji deprem anında **üretilmez**, yıllarca birikmiş enerji o anda **salınır**. Geri sekmede **potansiyel enerji kinetik enerjiye** dönüşür (tersi değil). Deprem, **sürtünmenin yenildiği** andır; enerji kaynaktan uzaklaştıkça **azalır**. Bu mantık nedeniyle uzun süredir deprem üretmemiş fay segmentleri daha tehlikeli kabul edilir (**sismik boşluk**)."}, {"q": "\"Bölgemizde sık sık küçük depremler oluyor, böylece enerji boşalıyor ve büyük deprem olmaz.\" görüşü için ders notlarına göre hangisi doğrudur?", "opts": [{"t": "Doğrudur; ancak yalnızca yitim zonlarında geçerlidir"}, {"t": "Doğrudur; yaklaşık 10 tane Mw 4,0 deprem bir Mw 7,0 depremin enerjisini boşaltır"}, {"t": "Doğrudur; küçük depremler fayı tamamen kilitler"}, {"t": "Yanlıştır; bir Mw 7,0 için yaklaşık 32.000 Mw 4,0 deprem gerekir"}, {"t": "Yanlıştır; çünkü küçük depremler enerjiyi artırır"}], "a": 3, "exp": "Magnitüd **logaritmiktir**: 1 birim artışta enerji yaklaşık **31,6 (≈32) kat** artar. 3 birim fark → 32×32×32 ≈ **32.000**. Bu yüzden büyük bir depremin enerjisini küçük depremlerle boşaltmak pratikte imkânsızdır. L'Aquila'daki \"enerji boşaldı, tehlike yok\" mesajı da bu yanılgıya dayanır."}, {"q": "Uzun süredir deprem üretmemiş fay segmentlerinin daha tehlikeli kabul edilmesinin mantığını açıklayan kavram hangisidir?", "opts": [{"t": "Doyuma ulaşma"}, {"t": "Sismik boşluk"}, {"t": "Deprem fırtınası"}, {"t": "Zemin büyütmesi"}, {"t": "Gölge bölgesi"}], "a": 1, "exp": "Elastik geri sekmeye göre enerji yıllar içinde birikir ve deprem anında salınır. Uzun süredir kırılmamış segmentlerde enerji birikmeye devam ettiği için bu bölgeler daha tehlikelidir — **sismik boşluk** kavramının mantığı budur. Gölge bölgesi dalgaların ulaşmadığı alan, zemin büyütmesi yumuşak zeminin genliği artırması, doyuma ulaşma ise Ml'nin büyük depremleri ayırt edememesidir."}, {"q": "Öncü depremlerle ilgili aşağıdaki ifadelerden hangisi doğrudur?", "opts": [{"t": "Büyüklükleri ana şoktan genellikle 1 derece büyüktür"}, {"t": "Her büyük depremden önce mutlaka görülürler"}, {"t": "Serideki en büyük sarsıntıdır"}, {"t": "Ana şoktan sonra yıllarca sürebilirler"}, {"t": "Her zaman olmadıkları için tahmin aracı değildirler"}], "a": 4, "exp": "**Öncü deprem**, büyük depremden önce meydana gelen küçük sarsıntılardır; **her zaman olmayabilir**, bu yüzden bir uyarı sistemi/tahmin aracı olarak kullanılamaz (kitapta \"dikkat\" kutusu). Serinin en büyüğü **ana şok**, yıllarca sürebilen ve ana depremden ~1 derece küçük olanlar **artçı**lardır."}, {"q": "Sınırlı bir alanda ve belli bir sürede, büyüklükleri birbirine çok yakın çok sayıda depremin meydana geldiği ve ana şokun belirlenemediği durum hangisidir?", "opts": [{"t": "Artçı deprem dizisi"}, {"t": "Sismik boşluk"}, {"t": "Ana şok"}, {"t": "Öncü deprem"}, {"t": "Deprem fırtınası"}], "a": 4, "exp": "**Deprem fırtınası**, sınırlı bir alanda ve belli bir sürede, büyüklükleri birbirine çok yakın çok sayıda depremin görülmesidir; sarsıntılar birbirine denk olduğu için **ana şok belirlenemez**. Artçılar ise ana şoktan sonra gelen ve giderek azalan küçük depremlerdir.\n💡 Fırtınada \"en büyük\" yoktur: hepsi birbirine yakındır."}, {"q": "Ders notlarına göre en büyük artçı deprem genellikle ana depremden ne kadar küçüktür?", "opts": [{"t": "Yaklaşık 3 derece"}, {"t": "Yaklaşık 5 derece"}, {"t": "Yaklaşık 1 derece"}, {"t": "Artçı her zaman ana şoktan büyüktür"}, {"t": "Yaklaşık 0,1 derece"}], "a": 2, "exp": "Artçılar ana sarsıntıdan sonra bir süre devam eden küçük depremlerdir; **en büyük artçı genellikle ana depremden yaklaşık 1 derece küçüktür**. Ana şoktan büyük bir deprem gelirse, ilk deprem geriye dönük olarak öncü sayılır."}, {"q": "AFAD (2014) bilgisine göre artçı depremlerle ilgili hangisi doğrudur?", "opts": [{"t": "M ≥ 7,0 depremlerin artçıları senelerce sürebilir, giderek azalır"}, {"t": "Artçıların sıklığı zamanla artar"}, {"t": "Artçıların büyüklüğü zamanla artarak ana şoku geçer"}, {"t": "Artçılar en fazla 72 saat sürer, sonra tamamen biter"}, {"t": "Yalnızca magnitüdü 5,0'ın altındaki depremlerin artçısı olur"}], "a": 0, "exp": "AFAD'a (2014) göre **magnitüdü 7,0 ve üzerindeki** depremlerin artçıları **senelerce** sürebilir; ancak enerjileri sönümlendiği için hem **sıklıkları hem büyüklükleri zamanla azalır**."}, {"q": "Ders notlarına göre artçı depremlerin sağlık hizmeti açısından ürettiği sorunlar ile ilgili aşağıdakilerden hangileri doğrudur?\nI. Enkaz üzerinde çalışan kurtarma ekipleri için asıl tehlike artçılardır.\nII. Ana şokta hasar görüp ayakta kalan binaların yıkılmasıyla ikinci dalga yaralı akışı olur.\nIII. Artçılar toplumun tehlike algısını canlı tutarak uyku bozukluğu ve akut stres tepkilerini uzatır.", "opts": [{"t": "II ve III"}, {"t": "Yalnız II"}, {"t": "Yalnız I"}, {"t": "I, II ve III"}, {"t": "I ve II"}], "a": 3, "exp": "Artçılar üç ayrı sorun üretir: **1) Kurtarma ekibi güvenliği** (zayıflamış yapı artçıda tamamen çökebilir), **2) İkinci dalga yaralı** (hasarlı binalar artçıda yıkılır), **3) Psikolojik yük** (uyku bozukluğu, akut stres tepkisi). Üçü de doğrudur.\n💡 \"Ekip – Yaralı – Psikoloji\": artçı üç kez vurur."}, {"q": "6 Şubat 2023'te saat 13.24'te meydana gelen Elbistan depremi için ders notlarında vurgulanan nokta hangisidir?", "opts": [{"t": "Pazarcık depreminden önce gelen öncü depremdi"}, {"t": "Volkanik kökenli bir depremdi"}, {"t": "Artçı değil ayrı bir ana şoktu; artçı sanılması hazırlıksızlığa yol açtı"}, {"t": "Bir deprem fırtınasının parçasıydı"}, {"t": "Pazarcık depreminin en büyük artçısıydı ve ondan yaklaşık 1 derece küçüktü"}], "a": 2, "exp": "İlk deprem **04.17**'de (Pazarcık, Mw 7,7) oldu; ikincisi (**Elbistan**, Mw 7,6) aynı gün **13.24**'te geldi ve teknik olarak artçı değil, **ayrı bir ana şok**tu. İkincisi artçı sanıldığı için ilk saatlerde hazırlıksız yakalanılmıştır."}, {"q": "Dünyada ve Türkiye'de yılda saptanan irili ufaklı deprem sayısı yaklaşık olarak hangisidir?", "opts": [{"t": "Dünya ~23.000; Türkiye ~500"}, {"t": "Dünya ~500.000; Türkiye ~23.000"}, {"t": "Dünya ~50.000; Türkiye ~2.300"}, {"t": "Dünya ~500.000; Türkiye ~62.000"}, {"t": "Dünya ~5.000; Türkiye ~230"}], "a": 1, "exp": "Dünyada yılda yaklaşık **500.000**, Türkiye'de yaklaşık **23.000** deprem saptanır. Yani dünyadaki depremlerin yaklaşık **yirmide biri** Türkiye'dedir ve bu günde ortalama **60'tan fazla** deprem demektir — oysa Türkiye dünya kara yüzeyinin yalnızca **binde ikisi** kadardır."}, {"q": "Türkiye'de yılda yaklaşık 23.000 deprem saptanmasına rağmen bunların çok azının hissedilmesinin nedeni nedir?", "opts": [{"t": "Depremlerin çoğunun deniz altında olup S dalgası üretmemesi"}, {"t": "Depremlerin çoğunun volkanik kökenli olması"}, {"t": "Çoğunun magnitüdü 3'ün altında (mikro/ultra mikro) olması"}, {"t": "Depremlerin çoğunun derin odaklı (300–700 km) olması"}, {"t": "Türkiye'de yitim zonu bulunması"}], "a": 2, "exp": "Saptanan depremlerin ezici çoğunluğu **mikro ve ultra mikro** depremdir (**magnitüd 3'ün altı**) ve yalnızca hassas cihazlarla saptanır. Türkiye depremleri genellikle **sığdır**, derin değil; Türkiye'de yitim zonu da yoktur."}, {"q": "Türkiye'deki başlıca tektonik kuşaklar olarak ders notlarında sayılanlar hangi seçenekte doğru verilmiştir?", "opts": [{"t": "Kuzey Anadolu Fayı, San Andreas Fayı, Ege Çöküntü Fay Sistemi"}, {"t": "Doğu Anadolu Fayı, Himalaya Çarpışma Zonu, Ege Yitim Zonu"}, {"t": "Ege Çöküntü Fay Sistemi, Japon Yitim Zonu, Doğu Anadolu Fayı"}, {"t": "Kuzey Anadolu Fayı, Doğu Anadolu Fayı, Karadeniz Yitim Zonu"}, {"t": "Kuzey Anadolu Fayı, Doğu Anadolu Fayı, Ege Çöküntü Fay Sistemi"}], "a": 4, "exp": "Türkiye'nin başlıca tektonik kuşakları **Kuzey Anadolu Fayı**, **Doğu Anadolu Fayı** ve **Ege Çöküntü Fay Sistemi**dir; topraklarımızın yaklaşık **%96**'sı deprem kuşağı içindedir. Çeldiricilerdeki San Andreas Fayı, Himalaya Çarpışma Zonu ve yitim zonları Türkiye'de yer almaz."}, {"q": "Türkiye'de son 70 yılda afet kaynaklı can ve mal kayıplarının dağılımına göre depremden sonra en büyük payı alan afet türü hangisidir?", "opts": [{"t": "Çığ (%1)"}, {"t": "Heyelan (%15)"}, {"t": "Yangın (%4)"}, {"t": "Kaya düşmesi (%5)"}, {"t": "Su baskını (%14)"}], "a": 1, "exp": "Depremden sonra en büyük pay **%15 ile heyelanındır**. Tam dağılım: **deprem %62**, **heyelan %15**, su baskını %14, kaya düşmesi %5, yangın %4, çığ ve diğerleri %1.\n💡 Heyelan (%15) ile su baskını (%14) neredeyse başa baştır; ilk üçü toplam kaybın %91'ini oluşturur."}, {"q": "\"Türkiye'de en sık görülen afet ile en çok can alan afet aynıdır.\" ifadesi ders notlarına göre neden yanlıştır?", "opts": [{"t": "%62 oranı, deprem olay sayısının tüm afet olaylarına oranını gösterir"}, {"t": "En sık görülen afet deprem, en çok can alan ise su baskınıdır"}, {"t": "En sık görülen ve en çok can alan afet heyelandır"}, {"t": "En sık afet heyelan, en çok can alan depremdir; %62 kayıp oranıdır"}, {"t": "En sık görülen afet yangın, en çok can alan ise heyelandır"}], "a": 3, "exp": "**%62** oranı **can ve mal kaybını** gösterir, olay sayısını değil. Türkiye'de en **SIK** görülen afet **heyelan**dır; en çok **CAN alan** **deprem**dir. **Sıklık ile etki farklı şeylerdir.**"}, {"q": "Yılda ~23.000 deprem olmasına karşın yalnızca birkaç yıkıcı deprem yaşanması ders notlarında hangi ilkeyle ilişkilendirilir?", "opts": [{"t": "Erken uyarı sistemi tüm depremleri önceden bildirir"}, {"t": "Afet olan deprem değil, hazırlıksız yakalanan yerleşimdir"}, {"t": "Küçük depremler büyük depremlerin enerjisini boşaltır"}, {"t": "Deprem tahmini mümkün olduğu için afetler önlenmektedir"}, {"t": "Depremlerin çoğu derin odaklı olduğu için hasar vermez"}], "a": 1, "exp": "Öğretici nokta sayının büyüklüğü değil **dağılımıdır**: deprem sıradan bir doğa olayıdır; **afet olan deprem değil, hazırlıksız yakalanan yerleşimdir**. Hafta 1'deki \"**afet olay değil sonuçtur**\" cümlesi burada hatırlatılır."}, {"q": "P dalgası ile ilgili aşağıdaki ifadelerden hangisi YANLIŞTIR?", "opts": [{"t": "Boyuna dalgadır; titreşim yayılma doğrultusuyla aynı yöndedir"}, {"t": "Hasar verme etkisi düşüktür"}, {"t": "Kayıt aletlerine ilk ulaşan dalgadır"}, {"t": "Sıvı ve gaz ortamlardan geçemez"}, {"t": "Hızı yaklaşık 5–7 km/sn'dir ve en hızlı dalgadır"}], "a": 3, "exp": "**P dalgası** katı, sıvı ve gazın **hepsinde** yayılabilir. Sıvı ve gazdan geçemeyen **S dalgası**dır. P dalgası boyuna, 5–7 km/sn, ilk ulaşan ve hasar etkisi düşük dalgadır; depremin yer ve büyüklüğünü belirlemede kullanılır."}, {"q": "S dalgası ile ilgili aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Katı, sıvı ve gazların hepsinde yayılabilir"}, {"t": "Boyuna dalgadır ve hızı 5–7 km/sn'dir"}, {"t": "Kayıt aletlerine ilk ulaşan dalgadır"}, {"t": "Enine dalgadır ve yapılardaki yıkımı üretir"}, {"t": "Hasar verme etkisi en düşük olan dalgadır"}], "a": 3, "exp": "**S (Secondary) dalgası** **enine**dir, titreşimi yayılma doğrultusuna **dik**tir, hızı **3–4 km/sn**'dir ve kayıt aletlerinde **ikinci** görülür. Yalnızca şekil değişimine dirençli ortamlarda (katılarda) ilerler; **yapılardaki yıkımı üreten** dalgadır. Erken uyarı sistemi bu dalganın varış süresine göre tasarlanır."}, {"q": "P ve S dalgalarının yaklaşık yayılma hızları hangi seçenekte doğru verilmiştir?", "opts": [{"t": "P: 5–7 km/sn; S: 3–4 km/sn"}, {"t": "P ve S: aynı hızda, 3–4 km/sn"}, {"t": "P: 5–7 km/sn; S: 8–10 km/sn"}, {"t": "P: 3–4 km/sn; S: 5–7 km/sn"}, {"t": "P: 1–2 km/sn; S: 5–7 km/sn"}], "a": 0, "exp": "**P dalgası 5–7 km/sn** (en hızlı), **S dalgası 3–4 km/sn**. Yüzey dalgaları ise en yavaştır.\n💡 \"Hızlı olan zararsız, yavaş olan yıkıcıdır\" — aradaki zaman farkı erken uyarının tüm mantığıdır."}, {"q": "Yüzey dalgaları ile ilgili aşağıdaki ifadelerden hangisi doğrudur?", "opts": [{"t": "P ve S dalgası olarak ikiye ayrılırlar"}, {"t": "Genlikleri en küçük olduğu için hasar etkileri yoktur"}, {"t": "En hızlı yayılan dalgalardır ve kayıt aletlerinde her zaman ilk görülürler"}, {"t": "Yalnızca sıvı ortamlarda yayılırlar"}, {"t": "En yavaş ama genliği en büyük dalgalardır; Love ve Rayleigh türü vardır"}], "a": 4, "exp": "**Yüzey dalgaları** en yavaş yayılır ama **genlikleri en büyüktür**; daha fazla yer hareketi yarattıkları için etkileri fazladır. **Love** (hızı daha yüksek) ve **Rayleigh** (genliği daha büyük) olarak ikiye ayrılır. Yapılardaki yıkımı **S ve yüzey dalgaları** üretir."}, {"q": "Yüzey dalgalarının iki türünden hangisinin hızı, hangisinin genliği daha büyüktür?", "opts": [{"t": "Rayleigh dalgasının hızı, Love dalgasının genliği daha büyüktür"}, {"t": "Love dalgasının hem hızı hem genliği daha büyüktür"}, {"t": "Rayleigh dalgasının hem hızı hem genliği daha büyüktür"}, {"t": "Love dalgasının hızı, Rayleigh dalgasının genliği daha büyüktür"}, {"t": "İkisinin hızı ve genliği eşittir"}], "a": 3, "exp": "Yüzey dalgaları: **hızı daha yüksek olan Love** ve **genliği daha büyük olan Rayleigh** dalgaları.\n💡 \"Love hızlıdır (aşk hızlı başlar), Rayleigh büyük sallar.\""}, {"q": "\"Genlik\" kavramının ders notlarındaki tanımı hangisidir?", "opts": [{"t": "Depremin sürdüğü toplam süre"}, {"t": "Bir dalganın yol açtığı yer değiştirmenin büyüklüğü"}, {"t": "Dalganın saniyede kat ettiği mesafe"}, {"t": "Odak ile dış merkez arasındaki dik mesafe"}, {"t": "İki dalganın varış süreleri arasındaki fark"}], "a": 1, "exp": "**Genlik**, bir dalganın yol açtığı **yer değiştirmenin büyüklüğü**dür. Yüzey dalgaları yavaştır ama genliği büyüktür — yani zemini daha çok oynatır. Odak ile dış merkez arasındaki dik mesafe **odak derinliği**dir."}, {"q": "Ders notlarındaki benzetmelere göre ucundan itilip çekilen bir yay ve ucundan aşağı-yukarı sallanan bir ip sırasıyla hangi dalgaları temsil eder?", "opts": [{"t": "Her ikisi de S dalgasıdır"}, {"t": "Yay: P dalgası; ip: S dalgası"}, {"t": "Yay: Love dalgası; ip: Rayleigh dalgası"}, {"t": "Yay: Rayleigh dalgası; ip: P dalgası"}, {"t": "Yay: S dalgası; ip: P dalgası"}], "a": 1, "exp": "**P dalgası** = ucundan itilip çekilen **yay** (sıkışma–gevşeme; parçacıklar ileri-geri, ilerleme yönüyle aynı). **S dalgası** = aşağı-yukarı sallanan **ip** (parçacıklar ilerleme yönüne dik hareket eder)."}, {"q": "S dalgasının sıvılardan geçememesinin nedeni nedir?", "opts": [{"t": "Sıvıların katılardan daha yoğun olması"}, {"t": "Sıvıların sıkıştırmaya direnç göstermemesi"}, {"t": "Sıvıların kesme (makaslama) kuvvetine direnç göstermemesi"}, {"t": "S dalgasının hızının sıvıda ışık hızına ulaşması"}, {"t": "Sıvıların S dalgasını yüzey dalgasına dönüştürmesi"}], "a": 2, "exp": "Yana sallanan (enine) bir dalganın ilerlemesi için ortamın şeklini koruması, yani **kesme (makaslama) kuvvetine direnç** göstermesi gerekir. Katılar bu direnci gösterir; sıvılar ve gazlar göstermez. **Sıkıştırmaya** ise sıvılar da direnç gösterir — bu yüzden **P dalgası** sıvıdan geçebilir."}, {"q": "Bir denizaltı depreminde deniz yüzeyindeki bir gemide bulunanların hissettiği ani çarpma benzeri sarsıntıyı hangi dalga oluşturur?", "opts": [{"t": "S dalgası"}, {"t": "Love dalgası"}, {"t": "Rayleigh dalgası"}, {"t": "S ve Love dalgası birlikte"}, {"t": "P dalgası"}], "a": 4, "exp": "Deniz suyu sıvıdır; **S dalgası sıvıdan geçemez**, bu yüzden deniz suyunda **yalnızca P dalgası** ilerler. Gemideki insanlar sarsıntıyı ani bir çarpma gibi hissedebilir; bunu **P dalgası** yapar."}, {"q": "Ders notlarına göre dış merkeze 100 km uzaklıktaki bir noktaya P ve S dalgaları yaklaşık kaç saniyede ulaşır?", "opts": [{"t": "P ≈ 15 saniye, S ≈ 30 saniye"}, {"t": "P ≈ 1 saniye, S ≈ 2 saniye"}, {"t": "P ve S aynı anda, ≈ 20 saniye"}, {"t": "P ≈ 60 saniye, S ≈ 120 saniye"}, {"t": "P ≈ 30 saniye, S ≈ 15 saniye"}], "a": 0, "exp": "Slayta göre 100 km uzaktaki noktaya **P dalgası ~15 sn**, **S dalgası ~30 sn**'de ulaşır; bu iki varış arasındaki süre uyarı için kullanılabilir. (Hesap: mesafe ÷ hız; 100/6 ≈ 17 sn, 100/3,5 ≈ 29 sn, fark ≈ 12 sn.) Uzaklık arttıkça fark büyür; dış merkeze çok yakınsanız fark **neredeyse sıfır**dır."}, {"q": "P dalgası ile S dalgası arasındaki varış farkıyla ilgili aşağıdaki ifadelerden hangisi doğrudur?", "opts": [{"t": "Uzaklık arttıkça fark büyür; dış merkeze çok yakında sıfıra yaklaşır"}, {"t": "Dış merkezde fark en büyüktür"}, {"t": "Fark yalnızca odak derinliğine bağlıdır, uzaklıkla hiçbir ilişkisi yoktur"}, {"t": "Uzaklık arttıkça fark küçülür"}, {"t": "Fark uzaklıktan bağımsızdır; her yerleşimde yaklaşık 15 saniyedir"}], "a": 0, "exp": "İki dalga farklı hızlarla gittiği için **uzaklık arttıkça aradaki süre büyür**. **Dış merkeze çok yakın** yerleşimlerde bu süre **sıfıra yaklaşır** — erken uyarı onlara hiçbir şey kazandırmaz. Uyarı süresi birkaç saniye ile bir dakikaya kadar değişir."}, {"q": "Türkiye'de deprem erken uyarı sisteminin etkinliğini sınırlayan en önemli dezavantaj nedir?", "opts": [{"t": "Türkiye'deki depremlerin volkanik kökenli olması"}, {"t": "Türkiye'de P dalgası oluşmaması"}, {"t": "Türkiye'nin yitim zonu üzerinde bulunması"}, {"t": "Depremlerin sığ olması ve şehirlerin fay üzerinde olması"}, {"t": "Depremlerin derin odaklı (300–700 km) olması"}], "a": 3, "exp": "Türkiye'de depremler **sığdır (5–10 km)** ve **şehirler fayların üzerinde** kuruludur; sığ ve yakın deprem **P–S arasındaki süreyi kısaltır**. Bu nedenle kitap, Türkiye'de erken uyarı sisteminin bir şehre yönelik değil **bölgeye göre** düşünülerek kurulmasında fayda olduğunu söyler (s. 39)."}, {"q": "P dalgasının deprem kayıtlarındaki temel kullanım amacı nedir?", "opts": [{"t": "Şiddet derecesini doğrudan ölçmek"}, {"t": "Yapılardaki yıkımı hesaplamak"}, {"t": "Öncü depremleri tahmin etmek"}, {"t": "Depremin yerini ve büyüklüğünü belirlemek"}, {"t": "Dış çekirdeğin sıvı olduğunu kanıtlamak"}], "a": 3, "exp": "**P dalgası** istasyona ilk ulaşır; depremin özelliklerini (**yer, büyüklük**) belirlemede kullanılır. Erken uyarı sisteminde de depremin yeri ve büyüklüğü bu dalgadan hesaplanır. Dış çekirdeğin sıvı olduğunu ise S dalgasının geçememesi kanıtlar."}, {"q": "S dalgası gölge bölgesiyle ilgili olarak merkez üssünden yaklaşık kaç dereceden uzaktaki istasyonlara doğrudan S dalgası ulaşmaz?", "opts": [{"t": "104°"}, {"t": "45°"}, {"t": "180°"}, {"t": "140°"}, {"t": "90°"}], "a": 0, "exp": "Merkez üssünden **104°'ye kadar** her istasyon S dalgasını kaydeder; **104°'den uzaktaki** istasyonlara doğrudan S dalgası ulaşmaz. Bu **gölge bölgesi** dünyanın neredeyse yarısına karşılık gelir ve dış çekirdeğin sıvı olduğunu gösterir. (P dalgasının gölge bölgesi ise ~104°–140° arasıdır.)"}, {"q": "Çekirdekle ilgili keşifler ve bilim insanları eşleştirildiğinde hangisi doğrudur?", "opts": [{"t": "Harold Jeffreys (1926) – çekirdek sınırının ~2900 km'de belirlenmesi"}, {"t": "Beno Gutenberg (1914) – katı iç çekirdeğin keşfi"}, {"t": "H. F. Reid (1936) – S dalgası gölge bölgesinin keşfi"}, {"t": "Richard Oldham (1906) – dış çekirdeğin sıvı olduğunun gösterilmesi"}, {"t": "Inge Lehmann (1936) – P dalgası kayıtlarından katı iç çekirdeğin keşfi"}], "a": 4, "exp": "Tarihçe: **1906 Oldham** – yerin içinde bir çekirdek olduğunu ileri sürdü; **1914 Gutenberg** – çekirdek sınırını ~**2900 km**'de belirledi; **1926 Jeffreys** – S dalgasının çekirdekten geçmediğini göstererek **dış çekirdeğin sıvı** olduğunu ortaya koydu; **1936 Inge Lehmann** (Danimarkalı) – P dalgası kayıtlarından **katı iç çekirdeği** keşfetti.\n💡 Kronoloji = içe doğru keşif: çekirdek var → sınırı nerede → dışı sıvı → içi katı."}, {"q": "P dalgası sıvıdan geçebildiği hâlde neden yaklaşık 104°–140° arasında bir gölge bölgesine sahiptir?", "opts": [{"t": "Dış çekirdekte tamamen durduğu için"}, {"t": "Dış çekirdekte yüzey dalgasına dönüştüğü için"}, {"t": "İç çekirdek tarafından yansıtılıp geri döndüğü için"}, {"t": "Dış çekirdekte yavaşlayıp kırılarak yön değiştirdiği için"}, {"t": "Manto katmanından hiç geçemediği için"}], "a": 3, "exp": "P dalgası sıvıdan geçebildiği için **durmaz**; ancak dış çekirdeğe girerken **yavaşlar ve kırılarak yön değiştirir**, bu yüzden ~**104°–140°** aralığına doğrudan ulaşamaz. Dış çekirdekte **duran** S dalgasıdır."}, {"q": "Odak (hiposantr) ve dış merkez (episantr) ile ilgili aşağıdaki ifadelerden hangisi doğrudur?", "opts": [{"t": "Odak enerjinin yer içinde açığa çıktığı nokta, dış merkez onun iz düşümüdür"}, {"t": "Odak, depremin en kuvvetli hissedildiği yeryüzü noktasıdır"}, {"t": "Hiposantr dış merkezi, episantr odağı ifade eder"}, {"t": "Odak ile dış merkez arasındaki yatay mesafeye odak derinliği denir"}, {"t": "Dış merkez, yerin içinde enerjinin açığa çıktığı noktadır"}], "a": 0, "exp": "**Odak (hiposantr)**: yerin içinde enerjinin açığa çıktığı nokta. **Dış merkez (episantr)**: odağa en yakın yeryüzü noktası, yani odağın **iz düşümü**. İkisi arasındaki **dik** mesafe **odak derinliği**dir.\n💡 Yunanca 'hypo' = alt (hiposantr, aşağıda); 'epi' = üst (episantr, yüzeyde)."}, {"q": "Odak ve dış merkez ile ilgili aşağıdakilerden hangileri doğrudur?\nI. Dış merkez, depremin genellikle en çok hasar yaptığı ve en kuvvetli hissedildiği yerdir.\nII. İkisi de gerçekte bir alandır; pratikte nokta olarak kabul edilir.\nIII. Dış merkez ile odak arasındaki yatay uzaklığa odak derinliği denir.", "opts": [{"t": "Yalnız I"}, {"t": "Yalnız III"}, {"t": "I ve II"}, {"t": "II ve III"}, {"t": "I, II ve III"}], "a": 2, "exp": "I ve II slaytta yer alır: dış merkez **genellikle** en çok hasarın görüldüğü yerdir; ikisi de gerçekte bir **alan**dır ama pratikte **nokta** kabul edilir (ayrıca dış merkez alanının büyüklüğü depremin **şiddetine** bağlıdır). III yanlıştır: odak derinliği, enerjinin açığa çıktığı noktanın yeryüzünden **en kısa (dik)** uzaklığıdır; dış merkez odağın tam üstünde olduğundan aralarında yatay uzaklık yoktur. \"Genellikle\" kelimesi önemlidir — 1985 Meksika depremi istisnadır."}, {"q": "Haberlerde depremin il–ilçe bilgisi olarak verilen yer neyi gösterir?", "opts": [{"t": "Deprem kayıt istasyonunun yerini"}, {"t": "Odak derinliğini"}, {"t": "Dış merkezi (episantr)"}, {"t": "En yüksek şiddetin görüldüğü yeri"}, {"t": "Odağı (hiposantr)"}], "a": 2, "exp": "Haberlerdeki il–ilçe bilgisi **dış merkezi** gösterir. Yaygın hata, dış merkezi \"depremin olduğu yer\" sanmaktır; deprem aslında **odakta** olur, dış merkez onun haritadaki karşılığıdır. En yüksek şiddet de her zaman dış merkezde olmayabilir."}, {"q": "1985 Meksika depremiyle ilgili aşağıdakilerden hangisi YANLIŞTIR?", "opts": [{"t": "En ağır yıkım, sert kaya zemin üzerindeki dış merkeze yakın kıyı kasabalarında yaşanmıştır"}, {"t": "Mexico City eski Texcoco Gölü'nün kurutulmuş yatağı üzerine kuruludur"}, {"t": "En çok 6–15 katlı binalar yıkılmıştır"}, {"t": "En ağır yıkım dış merkezden 350 km'den uzaktaki Mexico City'de yaşanmıştır"}, {"t": "Büyüklüğü Mw 8,0'dır"}], "a": 0, "exp": "Dış merkez Michoacán kıyısındaydı; kıyı kasabaları **sert kaya zemin** üzerindeydi ve hasar **görece sınırlı** kaldı. En ağır yıkım **350 km'den uzaktaki Mexico City**'de, eski **Texcoco Gölü** yatağındaki yumuşak kil üzerinde yaşandı. Mw **8,0**, ~**10.000** can kaybı (tahmini), en çok **6–15 katlı** binalar yıkıldı."}, {"q": "1985 Meksika depreminde özellikle 6–15 katlı binaların yıkılmasının nedeni nedir?", "opts": [{"t": "Depremin 300 km'den derin, derin odaklı bir deprem olması"}, {"t": "Bu binaların dış merkezin tam üzerinde, kıyıda bulunması"}, {"t": "Bu binalara S dalgasının değil yalnızca P dalgasının ulaşması"}, {"t": "Kil ile binaların titreşim sürelerinin (~2 sn) denk gelip rezonans oluşması"}, {"t": "Bu binaların kerpiç (A tipi) olması"}], "a": 3, "exp": "Yumuşak kilin doğal titreşim süresi yaklaşık **2 saniye**dir; bu süre **6–15 katlı** binaların kendi titreşim süresine denk geldi ve binalar diyapazon gibi **rezonansa** girdi. Daha alçak ve daha yüksek binalar görece az etkilendi."}, {"q": "Yumuşak zeminin, içinden geçen deprem dalgalarının genliğini artırması ve sarsıntıyı uzatmasına ne ad verilir?", "opts": [{"t": "Elastik geri sekme"}, {"t": "Doyuma ulaşma"}, {"t": "Zemin büyütmesi"}, {"t": "Sönümlenme"}, {"t": "Gölge bölgesi"}], "a": 2, "exp": "**Zemin büyütmesi**: yumuşak zeminin dalga **genliğini artırması** ve sarsıntıyı **uzatması*
