<title>Temel Afet Bilgisi Soru Bankası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: tek sütun çalışma defteri; set menüsünde üç çalışma modu (test / kart / özet) */
:root{
  --bg:#f3f6f6;
  --surface:#ffffff;
  --fg:#17292c;
  --muted:#5a6f72;
  --accent:#0b7285;
  --accent-ink:#ffffff;
  --accent-soft:#e1f0f3;
  --line:#d7e2e3;
  --good:#2b7a3f;
  --good-soft:#e5f3e8;
  --bad:#b3362e;
  --bad-soft:#faeae8;
  --chip:#eef3f3;
  --display:'Lora',Georgia,'Times New Roman',serif;
  --body:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1719; --surface:#172124; --fg:#e6eef0; --muted:#9db0b3;
    --accent:#5cc0d4; --accent-ink:#06282e; --accent-soft:#113640;
    --line:#2a383b; --good:#7ccb8c; --good-soft:#163420; --bad:#e8847c; --bad-soft:#3a1d1a;
    --chip:#1f2b2e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#172124; --fg:#e6eef0; --muted:#9db0b3;
  --accent:#5cc0d4; --accent-ink:#06282e; --accent-soft:#113640;
  --line:#2a383b; --good:#7ccb8c; --good-soft:#163420; --bad:#e8847c; --bad-soft:#3a1d1a;
  --chip:#1f2b2e; color-scheme:dark;
}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--body); font-size:16px; line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 48px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.wrap{max-width:740px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button{font-family:var(--body);cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- ana ekran ---------- */
.masthead{padding:34px 0 10px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.masthead h1{font-size:clamp(28px,6vw,38px);font-weight:700;margin-top:6px}
.masthead p{color:var(--muted);margin:10px 0 0;max-width:58ch}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.stat{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.stat b{color:var(--fg);font-variant-numeric:tabular-nums}
.sets{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.set-card{display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--fg)}
.set-card:hover{border-color:var(--accent)}
.set-num{flex:none;width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;font-weight:700}
.set-card.special .set-num{background:var(--accent);color:var(--accent-ink)}
.set-body{min-width:0;flex:1}
.set-title{font-weight:800;font-size:16px}
.set-desc{color:var(--muted);font-size:13.5px;margin-top:2px}
.set-meta{display:flex;gap:10px;margin-top:7px;font-size:12.5px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.set-meta .best{color:var(--good)}
.go{flex:none;color:var(--accent);font-size:22px;font-weight:800}
.note{color:var(--muted);font-size:13px;margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:18px}
.plan .label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.plan ol{margin:8px 0 0;padding-left:20px;font-size:14px;color:var(--fg)}
.plan li{margin:3px 0}
.plan b{color:var(--accent)}

/* ---------- set menüsü ---------- */
.menu-head{padding:26px 0 4px}
.menu-head h2{font-size:clamp(22px,5vw,28px)}
.menu-head p{color:var(--muted);margin:8px 0 0}
.modes{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--fg)}
.mode:hover{border-color:var(--accent)}
.mode .ic{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--accent-soft)}
.mode .t{font-weight:800;font-size:15.5px}
.mode .d{color:var(--muted);font-size:13px;margin-top:2px}

/* ---------- soru ekranı ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn-ghost{background:none;border:none;color:var(--muted);font-size:14px;font-weight:700;padding:6px 8px;border-radius:8px}
.btn-ghost:hover{color:var(--accent)}
.counts{font-size:13.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.counts .ok{color:var(--good)} .counts .no{color:var(--bad)}
.bar{height:6px;background:var(--chip);border-radius:999px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s}
.quiz-set-name{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:18px 0 6px}
.qtext{font-family:var(--display);font-size:clamp(18px,4.2vw,22px);font-weight:600;line-height:1.45;margin:4px 0 18px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;
  color:var(--fg);font-size:15.5px;line-height:1.45}
.opt:not(:disabled):hover{border-color:var(--accent);background:var(--accent-soft)}
.opt .key{flex:none;width:26px;height:26px;border-radius:8px;background:var(--chip);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--muted)}
.opt span.txt{min-width:0}
.opt:disabled{cursor:default}
.opt.dim{opacity:.55}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .key{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.verdict{margin-top:16px;font-weight:800;font-size:15px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.explain{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:0 12px 12px 0;padding:13px 15px}
.explain .label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.explain p{margin:6px 0 0;font-size:14.5px;color:var(--fg)}
.explain p b,.review-item .re b,.flash-exp b{color:var(--accent)}
.nextrow{display:flex;justify-content:flex-end;margin-top:16px}
.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:11px;
  padding:12px 22px;font-size:15px;font-weight:800}
.btn:hover{filter:brightness(1.06)}
.btn.secondary{background:var(--chip);color:var(--fg);border:1px solid var(--line)}
.btn.badbtn{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.btn.goodbtn{background:var(--good);color:#fff}
.hint-keys{color:var(--muted);font-size:12.5px;margin-top:14px}

/* ---------- bilgi kartları ---------- */
.flash-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin-top:16px;min-height:200px;display:flex;flex-direction:column}
.flash-q{font-family:var(--display);font-size:clamp(17px,4vw,21px);font-weight:600;line-height:1.5}
.flash-back{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.flash-ctx{color:var(--muted);font-size:14px;line-height:1.5}
.flash-ans{font-family:var(--display);font-weight:700;color:var(--accent);font-size:clamp(18px,4.4vw,22px);line-height:1.4;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.flash-card .flash-exp{font-size:15.5px;line-height:1.6;margin-top:0}
.flash-actions .btn:disabled{opacity:.45;cursor:default}
.flash-exp{font-size:14.5px;color:var(--fg);margin-top:8px}
.flash-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.flash-tag{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.flash-tag .again{color:var(--bad)}

/* ---------- özet ---------- */
.sum h3{font-size:17px;margin:24px 0 8px;color:var(--accent)}
.sum p{font-size:14px;margin:6px 0}
.sum ul{margin:6px 0;padding-left:20px;font-size:14px}
.sum li{margin:3px 0}
.sum .tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.sum table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:430px}
.sum th{background:var(--accent-soft);color:var(--accent);text-align:left;padding:8px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.sum td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
.sum td:first-child{font-weight:800;white-space:nowrap}
.sum .k{color:var(--accent);font-weight:800}
.sum .warn{color:var(--bad);font-weight:700}
.sum .okk{color:var(--good);font-weight:700}

/* ---------- sonuç ekranı ---------- */
.result-head{text-align:center;padding:34px 0 8px}
.score-ring{width:128px;height:128px;margin:0 auto;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:
  conic-gradient(var(--good) calc(var(--p)*1%), var(--chip) 0)}
.score-ring > div{width:100px;height:100px;border-radius:50%;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring b{font-size:26px;font-variant-numeric:tabular-nums}
.score-ring small{color:var(--muted);font-weight:700;font-size:12px}
.result-head h2{font-size:24px;margin-top:14px}
.result-head p{color:var(--muted);margin:6px 0 0}
.result-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0 8px}
.review h3{font-size:18px;margin:26px 0 10px}
.review-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:10px}
.review-item .rq{font-weight:700;font-size:14.5px}
.review-item .ra{font-size:13.5px;margin-top:8px}
.review-item .ra .you{color:var(--bad);font-weight:700}
.review-item .ra .cor{color:var(--good);font-weight:700}
.review-item .re{font-size:13.5px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.perfect{color:var(--good);font-weight:800}
</style>

<script>
const SETS = [{"title": "Afet Kavramı: Tehlike, Zarar Görebilirlik, Risk", "desc": "Afetin tanımı ve üç koşulu, afet–acil durum farkı, doğal afet tartışması, tehlike-maruziyet-zarar görebilirlik-kapasite, risk formülü, afetin büyüklüğünü belirleyen sekiz faktör, karşılaştırma ölçütleri, doğrudan-dolaylı-ikincil etkiler, ikincil afet ve sağlık boyutu", "short": "Afet Kavramı", "questions": [{"q": "6 Şubat 2023'te Kahramanmaraş'ta yaşanan iki büyük depremle ilgili aşağıdaki eşleştirmelerden hangisi doğrudur?", "opts": [{"t": "04:17 Pazarcık merkezli Mw 7.7 – 13:24 Elbistan merkezli Mw 7.6"}, {"t": "04:17 Elbistan merkezli Mw 7.7 – 13:24 Pazarcık merkezli Mw 7.6"}, {"t": "04:17 Pazarcık merkezli Mw 7.6 – 13:24 Elbistan merkezli Mw 7.7"}, {"t": "04:17 Pazarcık merkezli Mw 7.0 – 13:24 Elbistan merkezli Mw 8.8"}, {"t": "13:24 Pazarcık merkezli Mw 7.7 – 04:17 Elbistan merkezli Mw 7.6"}], "a": 0, "exp": "İki deprem aynı gün, yaklaşık **dokuz saat arayla** oldu: saat **04:17'de Pazarcık** merkezli **Mw 7.7** (Doğu Anadolu Fay Zonu, **Narlı segmenti**) ve saat **13:24'te Elbistan** merkezli **Mw 7.6** (**Çardak fayı**). Mw 7.0 ve 8.8, sırasıyla 2010 Haiti ve Şili depremlerinin büyüklükleridir.\n💡 \"Önce Pazarcık, sonra Elbistan; önce büyük (7.7), sonra biraz küçük (7.6).\""}, {"q": "Haiti–Şili karşılaştırmasından çıkan ana ders aşağıdakilerden hangisidir?", "opts": [{"t": "Daha büyük deprem her zaman daha çok can kaybına yol açar"}, {"t": "Sığ depremler derin depremlerden daha az zarar verir"}, {"t": "Sonucu tehlike değil, toplumun kırılganlığı ve kapasitesi belirledi"}, {"t": "Tsunami oluşturan depremler en yıkıcı depremlerdir"}, {"t": "Can kaybını belirleyen tek etken nüfus yoğunluğudur"}], "a": 2, "exp": "Tehlike Şili'de kat kat büyüktü (≈500 kat enerji), yine de sonuç Şili'nin lehine çıktı. **Sonucu belirleyen tehlike değil, toplumun kırılganlığı (zarar görebilirliği) ve kapasitesi** oldu. Bu örnek, risk formülünün (R = T × ZG ÷ K) somut hâlidir: Şili'de zarar görebilirlik düşük, kapasite yüksekti.\n💡 \"Deprem öldürmez, bina öldürür\" — ama binayı yapan, denetlemeyen ve hazırlanmayan da insandır."}, {"q": "\"Afet\" kelimesiyle ilgili aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Türkçeye Farsçadan geçmiştir; \"yıldızların ters dizilişi\" anlamına gelir"}, {"t": "Türkçeye Arapçadan geçmiştir; TDK sözlüğünde \"kıran\" karşılığıyla da verilir"}, {"t": "Öz Türkçe bir kelimedir; \"toplumun baş edememesi\" anlamına gelir"}, {"t": "Türkçeye Latinceden geçmiştir; dis + astro köklerinden oluşur"}, {"t": "Türkçeye Arapçadan geçmiştir; TDK'da \"acil durum\" karşılığıyla verilir"}], "a": 1, "exp": "**Afet** Türkçeye **Arapçadan** geçmiştir; TDK sözlüğünde \"**çeşitli doğa olaylarının sebep olduğu yıkım**\" ve \"**kıran**\" karşılıklarıyla verilir. \"Dis + astro / yıldızların ters dizilişi\" İngilizce **disaster** kelimesinin kökenidir."}, {"q": "AFAD'ın Açıklamalı Afet Yönetimi Terimleri Sözlüğü'ndeki afet tanımında, afeti acil durumdan ayıran en kritik ifade hangisidir?", "opts": [{"t": "Doğa, teknoloji veya insan kaynaklı olması"}, {"t": "Fiziksel, ekonomik ve sosyal kayıplar doğurması"}, {"t": "Etkilenen toplumun baş etme kapasitesinin yeterli olmadığı"}, {"t": "Toplumun tamamını etkilemesi"}, {"t": "Belirli bir büyüklüğün üzerinde can kaybına yol açması"}], "a": 2, "exp": "AFAD tanımında en kritik ifade \"**etkilenen toplumun baş etme kapasitesinin yeterli olmadığı**\" kısmıdır. **Baş etme kapasitesi yeterliyse o olay afet değil, acil durumdur.** Tanım \"toplumun tamamı **veya belli kesimleri**\" der; yani tamamını etkilemesi gerekmez. Tanımda belirli bir ölü sayısı eşiği yoktur."}, {"q": "AFAD'ın afet tanımına göre afete neden olan olayın kaynağı için aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Yalnızca doğa kaynaklı olabilir"}, {"t": "Yalnızca doğa ve teknoloji kaynaklı olabilir"}, {"t": "Yalnızca insan kaynaklı olabilir"}, {"t": "Kaynağı tanımda belirtilmez; yalnızca can kaybına bakılır"}, {"t": "Doğa, teknoloji veya insan kaynaklı olabilir"}], "a": 4, "exp": "AFAD tanımı: \"…etkilenen toplumun baş etme kapasitesinin yeterli olmadığı **doğa, teknoloji veya insan kaynaklı** olaydır.\" Tanım ayrıca **fiziksel, ekonomik ve sosyal kayıplar** doğurmayı ve **normal hayatı ve insan faaliyetlerini durdurmayı/kesintiye uğratmayı** içerir."}, {"q": "Bir olayın afet sayılabilmesi için birlikte aranan koşullarla ilgili aşağıdakilerden hangileri doğrudur?\nI. Can, mal veya çevre kaybı doğurmalıdır.\nII. Yerel imkân ve kaynaklarla üstesinden gelinememelidir.\nIII. Bir yerleşme birimindeki insan faaliyetlerini bozmalı veya durdurmalıdır.\nIV. Doğa kaynaklı bir olay tarafından tetiklenmelidir.", "opts": [{"t": "I ve II"}, {"t": "I, II ve III"}, {"t": "II ve III"}, {"t": "I, III ve IV"}, {"t": "I, II, III ve IV"}], "a": 1, "exp": "Üç koşul **birlikte** aranır: **kayıp doğurmalı**, **kapasiteyi aşmalı** (yerel imkânlarla baş edilememeli) ve **hayatı kesintiye uğratmalı**. IV yanlıştır: AFAD tanımına göre afet **doğa, teknoloji veya insan kaynaklı** olabilir.\n💡 \"Kayıp – Kapasite – Kesinti\": üç K."}, {"q": "Tek araçlı bir trafik kazasına 112 ekibi gönderiliyor ve ekip olayla kendi imkânlarıyla baş ediyor. Bu olay afet tanımı açısından nasıl sınıflandırılır?", "opts": [{"t": "Afet; çünkü can kaybı riski vardır"}, {"t": "İkincil afet; çünkü ulaşım kazasıdır"}, {"t": "Teknolojik afet; çünkü araç kazası insan kaynaklıdır"}, {"t": "Acil durum; çünkü baş etme kapasitesi yeterlidir"}, {"t": "Afet; çünkü normal hayatı kesintiye uğratır"}], "a": 3, "exp": "Olay yerel kaynaklarla yönetilebiliyorsa **acil durumdur**. Afet ile acil durumu ayıran çizgi **kaynak sınırıdır**. Çok sayıda yaralılı bir olayda kaynak yetmediğinde aynı tür olay **afete dönüşür** ve bakım mantığı da değişir (triyaj)."}, {"q": "\"Etkilenen toplumun baş etme kapasitesi yeterliyse\" o olaya ne ad verilir?", "opts": [{"t": "İkincil afet"}, {"t": "Acil durum"}, {"t": "Doğal afet"}, {"t": "Tehlike"}, {"t": "Maruziyet"}], "a": 1, "exp": "Baş etme kapasitesi yeterliyse olay **afet değil, acil durumdur**. Fark kaynak sınırındadır: acil durumda toplum kendi imkânlarıyla baş edebilir, **afette baş edemez ve dışarıdan destek gerekir**. Bu, ders kitabının \"Araştır\" sorusunun da cevabıdır."}, {"q": "Okyanusun ortasında, hiçbir yerleşim ve yapının bulunmadığı bir bölgede büyük bir deprem oluyor; sismograflar kaydediyor ancak kimse etkilenmiyor. Bu olay için aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Bir doğa olayıdır, afet değildir"}, {"t": "Büyüklüğü yüksekse afet sayılır"}, {"t": "Sismograflarca kaydedildiği için afettir"}, {"t": "Acil durumdur"}, {"t": "Potansiyel afet olduğu için ikincil afettir"}], "a": 0, "exp": "İnsanların yaşamadığı, hiçbir varlık ve yapının bulunmadığı bir yerde meydana gelen deprem, heyelan, sel veya volkanik patlama **hiçbir zaman afet sayılmaz**: kayıp koşulu sağlanmaz. Olay aynı olaydır; **afeti üreten, orada bir toplumun bulunmasıdır**. Kayıp yoksa yalnızca bir **doğa olayıdır**; kapasite yetiyorsa **acil durumdur**."}, {"q": "Bir olayın afet sayılması için gereken koşullardan biri sağlanmadığında hangi sonuç doğru eşleştirilmiştir?", "opts": [{"t": "Kayıp yoksa acil durumdur; kapasite yetiyorsa doğa olayıdır"}, {"t": "Kayıp yoksa ikincil afettir; kapasite yetiyorsa yine afettir"}, {"t": "Kayıp yoksa yalnızca doğa olayıdır; kapasite yetiyorsa acil durumdur"}, {"t": "Kayıp yoksa tehlikedir; kapasite yetiyorsa maruziyettir"}, {"t": "Koşullardan biri sağlanmasa da olay afet sayılır"}], "a": 2, "exp": "Üç koşul birlikte aranır; biri eksikse olay afet olmaktan çıkar. **Kayıp yoksa** ortada yalnızca bir **doğa olayı** vardır; **kapasite yetiyorsa** olay **acil durumdur**. Diğer şıklar bu iki sonucu ya birbiriyle ya da yanlış kavramlarla (ikincil afet, tehlike, maruziyet) eşleştirir."}, {"q": "\"Afet, bir olayın kendisi değil, doğurduğu sonuçtur\" fikrini anlatan zincirde halkaların doğru sırası hangisidir?", "opts": [{"t": "Maruziyet → Doğa olayı → Kırılganlık → Afet"}, {"t": "Doğa olayı → Kırılganlık → Afet → Maruziyet"}, {"t": "Kırılganlık → Maruziyet → Doğa olayı → Afet"}, {"t": "Doğa olayı → Afet → Maruziyet → Kırılganlık"}, {"t": "Doğa olayı → Maruziyet → Kırılganlık → Afet"}], "a": 4, "exp": "Zincir: **Doğa olayı** (yer kabuğunda enerji boşalır) → **Maruziyet** (orada insanlar ve yapılar vardır) → **Kırılganlık** (yapılar dayanıksız, toplum hazırlıksız) → **AFET** (kayıp, kesinti, baş edememe). Afet zincirin başında değil, **sonundadır**."}, {"q": "Afet zincirinde (doğa olayı → maruziyet → kırılganlık → afet) müdahale edilebilecek halkalar ve afet yönetimindeki karşılıkları için hangisi doğrudur?", "opts": [{"t": "Yalnızca birinci halka; fay hattındaki enerji birikimi önlenebilir"}, {"t": "Birinci ve ikinci halka; mitigasyon birinci halkaya müdahaledir"}, {"t": "Yalnızca dördüncü halka; afet yönetimi sadece müdahale aşamasında çalışır"}, {"t": "İkinci ve üçüncü halka; yer seçimi-imar ikinci halkaya, zarar azaltma (mitigasyon) üçüncü halkaya müdahaledir"}, {"t": "İkinci ve üçüncü halka; yer seçimi-imar üçüncü halkaya, mitigasyon ikinci halkaya müdahaledir"}], "a": 3, "exp": "Zincirin **ilk halkasını değiştiremeyiz** (deprem olacaktır). **İkinci (maruziyet) ve üçüncü (kırılganlık) halkalar tamamen bizim elimizdedir**; afet yönetimi de burada çalışır. **Yer seçimi ve imar kararları ikinci halkaya**, **zarar azaltma (mitigasyon)** — yönetmelik, denetim, güçlendirme, halk eğitimi — **üçüncü halkaya** müdahaledir. Son şık bu ikisini ters eşleştirmiştir."}, {"q": "Ders kitabının \"Doğal afet sözcüğü doğru değildir\" ifadesinin gerekçesi aşağıdakilerden hangisidir?", "opts": [{"t": "Doğa kaynaklı tehlike vardır; afet ise bu tehlikenin toplumdaki sonucudur"}, {"t": "Depremler aslında doğa olayı değil, insan kaynaklı olaylardır"}, {"t": "Doğa olaylarının hiçbiri tek başına insanlara zarar vermez"}, {"t": "Afet terimi uluslararası literatürde yalnızca teknolojik olaylar için kullanılır"}, {"t": "Doğa olayları önceden tam tahmin edilebildiği için afet sayılmaz"}], "a": 0, "exp": "Kitap: \"**Doğal afet yoktur. Doğa veya çevre kaynaklı tehlike veya tehditler vardır.**\" Deprem doğaldır, **afet değildir**; afet o olayın toplumdaki sonucudur. \"Doğal afet\" demek **sorumluluğu doğaya devretmek**tir; oysa zararın büyük kısmı insan kararlarından doğar. Deprem elbette bir doğa olayıdır; birinci çeldirici bu yüzden yanlıştır."}, {"q": "Uluslararası literatürde (UNDRR) \"doğal afet\" tartışmasıyla uyumlu olarak hangi terim tercih edilir?", "opts": [{"t": "Natural disaster"}, {"t": "Act of God"}, {"t": "Natural emergency"}, {"t": "Technological disaster"}, {"t": "Natural hazard"}], "a": 4, "exp": "UNDRR **\"natural hazard\"** (doğa kaynaklı tehlike) der, **\"natural disaster\" demez**. Doğa kaynaklı olan tehlikedir; afet toplumsal bir sonuçtur."}, {"q": "Aşırı yağış sonrası, yapılaşmaya açılmış bir dere yatağında sel felaketi yaşanıyor. Ders materyaline göre bu afeti asıl \"üreten\" nedir?", "opts": [{"t": "Aşırı yağışın kendisi"}, {"t": "Yağışın önceden tahmin edilememesi"}, {"t": "Dere yatağını yapılaşmaya açan imar kararı"}, {"t": "İklimin doğal döngüsü"}, {"t": "Derenin taşkın kapasitesi"}], "a": 2, "exp": "Aşırı yağış bir **doğa olayıdır ve engellenemez**; ama **dere yatağının yapılaşmaya açılması bir karardır**. O karar verildiğinde aşırı yağış sel felaketine dönüşür. \"**Afeti üreten yağmur değil, imar kararıdır.**\""}, {"q": "Aşağıdaki kavram–tanım eşleştirmelerinden hangisi YANLIŞTIR?", "opts": [{"t": "Tehlike (hazard) – Zarar verme potansiyeli olan olay veya olgu"}, {"t": "Maruziyet (exposure) – Toplumun baş etme, direnme ve toparlanma gücü"}, {"t": "Zarar görebilirlik (vulnerability) – Maruz kalanların zarar görmeye açıklık derecesi"}, {"t": "Kapasite (capacity) – Toplumun baş etme, direnme ve toparlanma gücü"}, {"t": "Maruziyet (exposure) – Tehlikenin etki alanında bulunan insan, yapı ve değerler"}], "a": 1, "exp": "**Maruziyet**, tehlikenin etki alanında bulunan **insan, yapı ve değerlerdir**. \"Baş etme, direnme ve toparlanma gücü\" **kapasitenin** tanımıdır. Diğer eşleştirmeler doğrudur."}, {"q": "Afet yönetimindeki dört temel kavram ile sordukları sorular eşleştirildiğinde \"Ne kadar kırılgan?\" sorusu hangi kavrama aittir?", "opts": [{"t": "Tehlike"}, {"t": "Maruziyet"}, {"t": "Zarar görebilirlik"}, {"t": "Kapasite"}, {"t": "Risk"}], "a": 2, "exp": "Tehlike → \"**Ne olabilir?**\"; Maruziyet → \"**Kim ve ne orada?**\"; Zarar görebilirlik → \"**Ne kadar kırılgan?**\"; Kapasite → \"**Ne kadar dayanıklıyız?**\" Bu dört sorunun cevaplarının bileşimi **riski** verir.\n💡 Sırayla: Ne olabilir? Kim orada? Ne kadar kırılgan? Ne kadar dayanıklı?"}, {"q": "Bir eğitim binası için risk değerlendirmesi yapılıyor: \"Bu bölgede deprem bekleniyor\", \"Binada şu an 40 kişi var\", \"Bina hangi yönetmeliğe göre yapıldı, güçlendirildi mi?\", \"Tahliye planı var mı?\" İfadeler sırasıyla hangi kavramlara karşılık gelir?", "opts": [{"t": "Tehlike – Maruziyet – Zarar görebilirlik – Kapasite"}, {"t": "Tehlike – Zarar görebilirlik – Maruziyet – Kapasite"}, {"t": "Risk – Maruziyet – Kapasite – Zarar görebilirlik"}, {"t": "Maruziyet – Tehlike – Zarar görebilirlik – Kapasite"}, {"t": "Tehlike – Maruziyet – Kapasite – Zarar görebilirlik"}], "a": 0, "exp": "Beklenen deprem **tehlike**; binadaki 40 kişi **maruziyet**; binanın yönetmeliği/güçlendirilmesi **zarar görebilirlik**; tahliye planı ve kimin ne yapacağını bilmesi **kapasite**dir. Dördü ayrı ayrı sorulduğunda risk somutlaşır."}, {"q": "Aynı deprem bölgesinde yaşayan diyaliz hastası, yaşlı veya engelli bir bireyin aynı olayda çok daha fazla etkilenmesi en iyi hangi kavramla açıklanır?", "opts": [{"t": "Tehlike"}, {"t": "Maruziyet"}, {"t": "Kapasite fazlası"}, {"t": "İkincil afet"}, {"t": "Zarar görebilirlik"}], "a": 4, "exp": "Sağlıkta **zarar görebilirlik somuttur**: **yaşlı, kronik hastalığı olan, engelli veya diyaliz hastası** birey aynı olayda çok daha kırılgandır. Maruziyet herkes için aynı olabilir (aynı bölgedeler); farkı yaratan maruz kalanların zarar görmeye açıklık derecesidir."}, {"q": "Ders materyalinde kavramsal çerçeve olarak verilen risk formülü hangisidir?", "opts": [{"t": "Risk = Tehlike + Zarar görebilirlik + Kapasite"}, {"t": "Risk = Tehlike × Zarar görebilirlik ÷ Kapasite"}, {"t": "Risk = Tehlike × Kapasite ÷ Zarar görebilirlik"}, {"t": "Risk = Kapasite × Zarar görebilirlik ÷ Tehlike"}, {"t": "Risk = Tehlike ÷ (Zarar görebilirlik × Kapasite)"}], "a": 1, "exp": "**RİSK = Tehlike × Zarar Görebilirlik ÷ Kapasite.** Kapasite **paydadadır**: kapasite arttıkça risk düşer. Formül nicel bir hesap değil, **kavramsal** bir çerçevedir.\n💡 Payda = kapasite: \"Kapasite büyüdükçe risk küçülür.\""}, {"q": "Risk formülüne göre aşağıdaki eşleştirmelerden hangisi doğrudur?", "opts": [{"t": "Bina güçlendirme → tehlikeyi azaltır; tatbikat → zarar görebilirliği artırır"}, {"t": "Doğru yer seçimi → kapasiteyi artırır; eğitim → tehlikeyi azaltır"}, {"t": "Tatbikat → tehlikeyi azaltır; kurumsal yapı → maruziyeti artırır"}, {"t": "Bina güçlendirme → zarar görebilirliği azaltır; tatbikat → kapasiteyi artırır"}, {"t": "Sağlam yapı → kapasiteyi azaltır; plan → zarar görebilirliği artırır"}], "a": 3, "exp": "**Tehlikeyi azaltamayız** (fayı durduramayız). **Zarar görebilirliği azaltabiliriz**: sağlam yapı, doğru yer seçimi, güçlendirme. **Kapasiteyi artırabiliriz**: eğitim, plan, tatbikat, kaynak, kurumsal yapı. Riski düşürmenin iki yolu vardır ve **ikisi de insan elindedir**."}, {"q": "Ders özetine göre risk hangi dört bileşenden kurulur?", "opts": [{"t": "Tehlike, afet, acil durum ve kapasite"}, {"t": "Tehlike, maruziyet, zarar görebilirlik ve kapasite"}, {"t": "Sıklık, süre, etki alanı ve tahrip gücü"}, {"t": "Doğrudan, dolaylı, ikincil etki ve ikincil afet"}, {"t": "Kayıp, kesinti, kapasite ve kırılganlık"}], "a": 1, "exp": "\"Risk dört bileşenden kurulur: **tehlike, maruziyet, zarar görebilirlik ve kapasite**.\" Sıklık, süre, etki alanı, tahrip gücü afetleri **karşılaştırma ölçütleridir**; doğrudan/dolaylı/ikincil ise **etki** katmanlarıdır."}, {"q": "Afetin büyüklüğüne etki eden faktörlerden hangisi doğrudan doğa kaynaklı olan TEK faktördür?", "opts": [{"t": "Yerleşme alanlarına uzaklık ve nüfus yoğunluğu"}, {"t": "Çevrenin tahribi ve yanlış kullanımı"}, {"t": "Hızlı nüfus artışı ve çarpık kentleşme"}, {"t": "Tehlikeli bölgelerde denetimsiz şehirleşme ve sanayileşme"}, {"t": "Olayın fiziksel büyüklüğü (magnitüd, yağış miktarı, rüzgâr hızı)"}], "a": 4, "exp": "**Olayın fiziksel büyüklüğü** (depremin magnitüdü, yağışın miktarı, rüzgârın hızı) listedeki **tek doğal kalemdir**. Nüfus yoğunluğu, çevre tahribi, çarpık kentleşme ve denetimsiz sanayileşme insan kararlarının ürünüdür."}, {"q": "\"Aynı deprem kırsalda küçük, metropolde yıkıcı sonuç verir\" ifadesi afetin büyüklüğüne etki eden hangi faktörü açıklar?", "opts": [{"t": "Olayın fiziksel büyüklüğü"}, {"t": "Yerleşme alanlarına uzaklık ve nüfus yoğunluğu"}, {"t": "Çevrenin tahribi ve yanlış kullanımı"}, {"t": "Bilgisizlik ve güvenlik kültürü eksikliği"}, {"t": "Fakirlik ve az gelişmişlik"}], "a": 1, "exp": "Bu ifade **yerleşme alanlarına uzaklık ve nüfus yoğunluğu** faktörünü açıklar. 6 Şubat 2023'te de aynı fay farklı ilçelerde **nüfus yoğunluğu ve yapı stoku** farkı yüzünden çok farklı sonuçlar verdi."}, {"q": "\"Hortum dakikalar sürer; kuraklık yıllarca\" ifadesi afetleri karşılaştırma ölçütlerinden hangisine örnektir?", "opts": [{"t": "Başlangıç hızı"}, {"t": "Etki süresi"}, {"t": "Sıklık ve tehdit"}, {"t": "Etki alanı"}, {"t": "Kontrol edilebilirlik"}], "a": 1, "exp": "Bu ifade **etki süresi** ölçütünü örnekler. **Başlangıç hızı** \"ani gelişen mi, önceden uyaran mı?\"; **etki alanı** \"tek mahalle mi, tüm ülke mi, zincirleme yayılıyor mu?\" sorusudur."}, {"q": "Aşağıdakilerden hangisi ders materyalinde sayılan afetlerin ortak özelliklerinden biri DEĞİLDİR?", "opts": [{"t": "İlk oluştuğu anlarda insanlarda şok etkisi yaratır"}, {"t": "Yaşam kaynaklarına ve altyapıya zarar verir"}, {"t": "Bazıları aniden, bazıları yavaş gelişir"}, {"t": "Oluştuğu ilk anlarda her zaman organize bir müdahale gerçekleşir"}, {"t": "Bazılarının ne zaman olacağı tahmin edilemezken bazıları tahmin edilebilir"}], "a": 3, "exp": "Ortak özelliklerden biri tam tersidir: \"**Oluştuğu ilk anlarda organize bir müdahale gerçekleşmeyebilir.**\" İlk saatlerde yollar kapalı, haberleşme kesik, ekipler de afetzededir; **toplum kendi kendine kalır** — afet eğitiminin gerekçesi budur. Diğer şıklar altı ortak özellik arasındadır (kaynak: Ergünay 2002)."}, {"q": "Aşağıdakilerden hangisi ders materyalinde YAVAŞ gelişen afetlere örnek olarak verilmiştir?", "opts": [{"t": "Deprem"}, {"t": "Hortum"}, {"t": "Patlama"}, {"t": "Tsunami"}, {"t": "Kuraklık"}], "a": 4, "exp": "**Ani gelişen**: deprem, hortum, patlama. **Yavaş gelişen**: **kuraklık, kıtlık, salgın**. Ani gelişen afette hazırlık önceden yapılmış olmalıdır; yavaş gelişende **erken uyarı ve izleme** devreye girer. Bu ayrım müdahale planlamasının temelidir."}, {"q": "Ders materyalindeki \"Afetlerin yol açtığı olumsuz etkiler\" sınıflamasına göre aşağıdakilerden hangisi DOĞRUDAN etkidir?", "opts": [{"t": "Gelir ve üretim kaybı"}, {"t": "Hizmetlerde aksamalar"}, {"t": "Pazar ve bütçe kayıpları"}, {"t": "Geçici barınma ve acil yardım ihtiyacı"}, {"t": "Güvenlik ve asayiş sorunları"}], "a": 3, "exp": "**Doğrudan etkiler**: can kaybı ve yaralanmalar, yapı ve altyapı hasarı, **geçici barınma ve acil yardım ihtiyacı**. **Dolaylı**: gelir ve üretim kaybı, hizmetlerde aksamalar, enflasyon ve işsizlik artışı. **İkincil**: pazar ve bütçe kayıpları, güvenlik ve asayiş sorunları, ekonomik dengesizlikler."}, {"q": "Bir depremde fabrika binası yıkılıyor; sonraki aylarda fabrika üretim yapamıyor ve çalışanlar işsiz kalıyor. Bu durum için aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Fabrikanın yıkılması doğrudan, üretim ve gelir kaybı dolaylı etkidir"}, {"t": "Fabrikanın yıkılması dolaylı, işsizlik doğrudan etkidir"}, {"t": "Her ikisi de doğrudan etkidir"}, {"t": "Fabrikanın yıkılması ikincil afet, işsizlik doğrudan etkidir"}, {"t": "Her ikisi de ikincil afettir"}], "a": 0, "exp": "**Doğrudan etki** afetle birlikte **anında** ortaya çıkar (yıkılan fabrika, can kaybı). **Dolaylı etki** bunun sonucudur ve **zaman alır** (fabrika üretemez, çalışan işsiz kalır, gelir kaybı doğar). İkincil afet ise yangın, sızıntı gibi yeni bir afet olayıdır.\n💡 Doğrudan = anında; dolaylı = zamanla, sonuç olarak."}, {"q": "İkincil etki ile ikincil afet arasındaki ilişki için aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Aynı şeydir; ikisi de afetin ekonomik sonuçlarını anlatır"}, {"t": "Aynı şeydir; ikisi de yangın ve patlama gibi olayları anlatır"}, {"t": "Aynı şey değildir; ikincil etki yeni bir afet olayı, ikincil afet ise ekonomik bir sonuçtur"}, {"t": "İkincil afet yalnızca teknolojik afetlerden, ikincil etki yalnızca doğa kaynaklı afetlerden doğar"}, {"t": "Aynı şey değildir; ikincil etki ekonomik-sosyal bir sonuç, ikincil afet ise yeni bir afet olayıdır"}], "a": 4, "exp": "**İkincil etki** ekonomik-sosyal bir sonuçtur (bütçe açığı, asayiş sorunları gibi). **İkincil afet** ise bir afetin tetiklediği **yeni bir afet olayıdır** (yangın, sızıntı, baraj yıkılması…). Örnek: 1999 Kocaeli depreminin tetiklediği **TÜPRAŞ yangını** ve **AKSA akrilonitril sızıntısı**. Bu, bölümün en ayırt edici sorusudur."}, {"q": "AFAD (2014) tanımına göre ikincil afet nedir?", "opts": [{"t": "Bir afetin ardından görülen enflasyon, işsizlik artışı ve bütçe kayıpları"}, {"t": "Bir afetin tetiklemesiyle oluşan yangın, baraj yıkılması, salgın gibi yeni afetler"}, {"t": "Aynı bölgede kısa süre içinde ikinci kez meydana gelen aynı tür afet"}, {"t": "Baş etme kapasitesinin yeterli olduğu, yerel olarak yönetilen küçük olaylar"}, {"t": "Ana şoktan sonra gelen ve hasarı artıran artçı sarsıntılar"}], "a": 1, "exp": "AFAD (2014): \"Bir afetin etkisi veya tetiklemesiyle meydana gelen **yangın, heyelan, baraj yıkılması, patlama, salgın hastalık ve endüstriyel kaza** gibi yeni afetlere **ikincil afet** denir.\" Enflasyon/işsizlik ekonomik etkilerdir; kapasitenin yettiği olaylar acil durumdur."}, {"q": "Doğa olayının tetiklediği teknolojik kazaları ifade eden ve ikincil afetin güncel literatürdeki adı olan kavram hangisidir?", "opts": [{"t": "KBRN (Kimyasal, Biyolojik, Radyolojik, Nükleer)"}, {"t": "HAP (Hastane Afet Planı)"}, {"t": "NaTech (Natural Hazard Triggered Technological Accident)"}, {"t": "İRAP (İl Afet Risk Azaltma Planı)"}, {"t": "UMKE (Ulusal Medikal Kurtarma Ekibi)"}], "a": 2, "exp": "**NaTech = Natural Hazard Triggered Technological Accident**: doğa olayının tetiklediği teknolojik kaza. Ders kitabında geçmez ama literatürde standarttır. Örnekler: 1999 **TÜPRAŞ** yangını; 6 Şubat 2023'te **İskenderun Limanı**'nda devrilen konteynerlerde çıkan, günlerce süren yangın."}, {"q": "Aşağıdakilerden hangisi afetin DOLAYLI sağlık sonuçlarına örnektir?", "opts": [{"t": "Diyaliz ve ilaç erişiminin kesintiye uğraması"}, {"t": "Enkaz altında gelişen crush (ezilme) sendromu"}, {"t": "Yangında duman inhalasyonu"}, {"t": "Soğuk ortamda kalmaya bağlı hipotermi"}, {"t": "Bina çökmesine bağlı travma ve kırıklar"}], "a": 0, "exp": "**Doğrudan sağlık sonuçları**: travma ve kırıklar, **crush sendromu**, boğulma, yanık, **duman inhalasyonu**, zehirlenme, **hipotermi**. **Dolaylı sağlık sonuçları**: **kronik hastalık tedavisinin kesintisi, diyaliz ve ilaç erişimi**, salgın riski, gebe ve bebek sağlığı, beslenme, ruh sağlığı."}, {"q": "Ders materyalinde verilen afet sağlık hizmeti zincirinin doğru sırası hangisidir?", "opts": [{"t": "112 → Olay yeri → Hastane (HAP) → UMKE"}, {"t": "Olay yeri → UMKE → Hastane (HAP) → 112"}, {"t": "Hastane (HAP) → 112 → UMKE → Olay yeri"}, {"t": "Olay yeri → 112 → UMKE → Hastane (HAP)"}, {"t": "Olay yeri → Hastane (HAP) → 112 → UMKE"}], "a": 3, "exp": "Sağlık hizmeti zinciri: **Olay yeri → 112 → UMKE → hastane (HAP)**. **Kaynak ile ihtiyaç oranı tersine döndüğünde bakım mantığı da değişir: triyaj.** (UMKE: Ulusal Medikal Kurtarma Ekibi; HAP: Hastane Afet Planı.)"}, {"q": "Afet sağlık hizmetlerinde \"bakım mantığının değişmesi\" (triyaj) hangi durumda ortaya çıkar?", "opts": [{"t": "Olay yerine ilk 112 ekibi ulaştığında"}, {"t": "Hasta sayısı 10'u geçtiğinde"}, {"t": "Kaynak ile ihtiyaç oranı tersine döndüğünde"}, {"t": "Hastane afet planı yürürlükte olmadığında"}, {"t": "Olay doğa kaynaklı olduğunda"}], "a": 2, "exp": "\"**Kaynak ile ihtiyaç oranı tersine döndüğünde bakım mantığı da değişir: triyaj.**\" **Kaynak kıtlığı bakım mantığını değiştirir.** Belirli bir hasta sayısı eşiği verilmemiştir; belirleyici olan kaynak-ihtiyaç dengesidir — tıpkı acil durum ile afeti ayıran kapasite çizgisi gibi."}], "cards": [{"t": "Dersin ana fikri", "b": "Bu ders 'hangi afet nasıl olur' dersi değil, **'afet neden afete dönüşür'** dersidir. Afetin büyüklüğünü olayın kendisi kadar **toplumun hazırlığı** belirler."}, {"t": "6 Şubat 2023 rakamları", "b": "Kahramanmaraş depremlerinde resmî verilere göre **53.537 can kaybı**, **107.213 yaralı** oldu ve **11 il** etkilendi — ülke nüfusunun yaklaşık **altıda biri**. 💡 İki deprem aynı gün, dokuz saat arayla: Pazarcık Mw 7.7 ve Elbistan Mw 7.6."}, {"t": "Haiti–Şili paradoksu", "b": "2010'da Şili depremi (Mw 8.8) Haiti depreminden (Mw 7.0) yaklaşık **500 kat** daha güçlüydü; ama Haiti'de **100.000–316.000**, Şili'de yalnızca **yaklaşık 525** can kaybı oldu. 💡 500 kat güçlü deprem, yüzlerce kat az ölüm — sonucu tehlike değil, toplum belirledi."}, {"t": "Logaritmik ölçek", "b": "Deprem büyüklük ölçeği **logaritmiktir**: 1,8 birimlik fark, 10^(1,5 × 1,8) ≈ **500 kat enerji** farkı demektir."}, {"t": "Farkı yaratan dört şey", "b": "Haiti–Şili farkını yaratan dört etken: **yapı stoku**, **kurumsal kapasite**, **toplumsal hazırlık** ve **ekonomik durum**. Hiçbiri depremin kendisiyle ilgili değildir."}, {"t": "Kelimelerin kökeni", "b": "**Afet** Arapçadan gelir; TDK'da 'yıkım' ve 'kıran'. **Disaster** = dis (kötü) + astro (yıldızlar), yani 'yıldızların ters dizilişi'. İki kelime de afeti **kadere** bağlar — modern afet bilimi tam tersini söyler."}, {"t": "AFAD'ın afet tanımı", "b": "Afet: toplum için **fiziksel, ekonomik ve sosyal kayıplar doğuran**, **normal hayatı kesintiye uğratan** ve etkilenen toplumun **baş etme kapasitesinin yetmediği** doğa, teknoloji veya insan kaynaklı olaydır (AFAD Sözlüğü)."}, {"t": "Afetin üç koşulu", "b": "Bir olay ancak üç koşul birlikte sağlanırsa afettir: **kayıp doğurmalı**, **yerel kapasiteyi aşmalı**, **hayatı kesintiye uğratmalı**. 💡 Biri eksikse afet yok: kayıp yoksa doğa olayı, kapasite yetiyorsa acil durum."}, {"t": "Afet ile acil durum", "b": "Baş etme kapasitesi **yeterliyse** olay **acil durumdur**; **yetmiyorsa afettir**. Çizgi **kaynak sınırıdır**: tek araçlı kaza acil durumdur, yüzlerce yaralılı olayda kaynak yetmeyince aynı olay afete dönüşür."}, {"t": "Issız yerde afet olmaz", "b": "İnsanların yaşamadığı, hiçbir varlık ve yapının bulunmadığı yerdeki deprem, sel veya volkanik patlama **hiçbir zaman afet sayılmaz**. Olay aynıdır; afeti üreten, orada **bir toplumun bulunmasıdır**."}, {"t": "Afet zinciri", "b": "**Doğa olayı → Maruziyet → Kırılganlık → AFET**. Afet zincirin başında değil, **sonundadır**: olayın kendisi değil, doğurduğu **sonuçtur**. 💡 İlk halka değiştirilemez; ikinci ve üçüncü halkalar tamamen bizim elimizdedir — afet yönetimi orada çalışır."}, {"t": "'Doğal afet' yanlıştır", "b": "Kitaba göre **'doğal afet yoktur'**; doğa kaynaklı **tehlike** vardır. 'Doğal afet' demek **sorumluluğu doğaya devretmektir** — oysa zararın büyük kısmı insan kararlarından doğar. 💡 UNDRR da 'natural hazard' der, 'natural disaster' demez."}, {"t": "Yağmur mu, imar mı?", "b": "Aşırı yağış engellenemez bir **doğa olayıdır**; dere yatağını yapılaşmaya açmak ise bir **karardır**. Afeti üreten **yağmur değil, imar kararıdır**."}, {"t": "Kavram dörtlüsü", "b": "**Tehlike**: 'Ne olabilir?' · **Maruziyet**: 'Kim ve ne orada?' · **Zarar görebilirlik**: 'Ne kadar kırılgan?' · **Kapasite**: 'Ne kadar dayanıklıyız?' Bu dört cevabın bileşimi **riski** verir. 💡 Günlük dilde karışırlar; afet yönetiminde her birinin kesin ve ayrı anlamı vardır."}, {"t": "Risk formülü", "b": "**RİSK = Tehlike × Zarar Görebilirlik ÷ Kapasite**. Nicel bir hesap değil, **kavramsal bir çerçevedir**. 💡 Kapasite paydadadır: kapasite arttıkça risk düşer."}, {"t": "Riskin iki kaldıracı", "b": "**Tehlikeyi azaltamayız** (fay durdurulamaz); ama **zarar görebilirliği azaltabilir** (sağlam yapı, doğru yer seçimi, güçlendirme) ve **kapasiteyi artırabiliriz** (eğitim, plan, tatbikat). İkisi de **insan elindedir**."}, {"t": "Sekiz faktör (1-4)", "b": "Afetin büyüklüğüne etki eden ilk dört faktör: **olayın fiziksel büyüklüğü**, **yerleşmeye uzaklık ve nüfus yoğunluğu**, **fakirlik ve az gelişmişlik**, **hızlı nüfus artışı ve çarpık kentleşme** (Ergünay 2002)."}, {"t": "Sekiz faktör (5-8)", "b": "Diğer dört faktör: **tehlikeli bölgelerde denetimsiz şehirleşme ve sanayileşme**, **alan kullanımı ve yapılaşma kültürü eksikliği**, **çevrenin tahribi**, **bilgisizlik-eğitimsizlik** ve kitabın eklediği **önceden alınan koruyucu önlemlerin düzeyi**."}, {"t": "Kritik çıkarım: 7/8", "b": "Sekiz faktörden **yedisi insan faaliyeti kökenlidir**; tek doğal faktör **olayın fiziksel büyüklüğüdür**. Afetin ölçeği kader değil, büyük ölçüde **bizim ürettiğimiz bir sonuçtur**. 💡 Klasik sınav sorusu: 'Faktörlerin ortak özelliği nedir?' — insan kaynaklı olmaları."}, {"t": "Karşılaştırma ölçütleri", "b": "Afetler yedi ölçütle karşılaştırılır: **sıklık**, **etki süresi**, **başlangıç hızı**, **etki alanı**, **tahrip gücü**, **önceden tahmin edilebilirlik**, **kontrol edilebilirlik**. 💡 Hortum dakikalar sürer, kuraklık yıllarca — etki süresi farkının en net örneği."}, {"t": "Ani ve yavaş gelişen", "b": "Afetlerin bazıları **ani gelişir** (deprem, hortum, patlama), bazıları **yavaş gelişir** (kuraklık, kıtlık, salgın). Ani gelişende hazırlık **önceden** yapılmış olmalıdır; yavaş gelişende **erken uyarı ve izleme** devreye girer."}, {"t": "İlk saatlerde yalnızlık", "b": "Afetin ilk anlarında **organize müdahale gerçekleşmeyebilir**: yollar kapalı, haberleşme kesik, ekipler de afetzededir. Enkazdan kurtarılanların çoğunu profesyoneller değil, **komşular ve yoldan geçenler** çıkarır. 💡 Toplum ilk müdahale ekibidir — halk eğitimi bu yüzden mesleki bir görevdir."}, {"t": "Etkilerin üç katmanı", "b": "**Doğrudan etkiler**: can kaybı, yaralanma, yapı hasarı, barınma ihtiyacı. **Dolaylı etkiler**: gelir ve üretim kaybı, hizmet aksaması, enflasyon, işsizlik. **İkincil etkiler**: pazar ve bütçe kayıpları, asayiş sorunları, ekonomik dengesizlik."}, {"t": "Doğrudan ve dolaylı", "b": "**Doğrudan etki** afetle birlikte **anında** ortaya çıkar (yıkılan fabrika, can kaybı); **dolaylı etki** onun sonucudur ve **zaman alır** (fabrika üretemez → işçi işsiz kalır → gelir kaybı)."}, {"t": "İkincil afet nedir?", "b": "Bir afetin **tetiklemesiyle** oluşan **yeni afetlere** (yangın, heyelan, baraj yıkılması, patlama, salgın, endüstriyel kaza) **ikincil afet** denir (AFAD 2014). 💡 İkincil ETKİ ekonomik-sosyal sonuçtur; ikincil AFET yeni bir afet olayıdır — en çok karıştırılan ayrım."}, {"t": "TÜPRAŞ–AKSA örneği", "b": "17 Ağustos 1999 Kocaeli depremi, **TÜPRAŞ'ta yangına** ve **AKSA'da akrilonitril sızıntısına** yol açtı: **6 bin tondan fazla** yanıcı, patlayıcı ve **kanserojen** madde çevreye karıştı, yerleşimler boşaltıldı. 💡 Deprem 45 saniye sürdü; yangın günlerce yandı. Güncel karşılığı: 2023 İskenderun Limanı yangını."}, {"t": "Afet bir sağlık olayıdır", "b": "**Doğrudan sağlık sonuçları**: travma, **crush (ezilme) sendromu**, yanık, zehirlenme, hipotermi. **Dolaylı sağlık sonuçları**: kronik tedavinin kesilmesi, diyaliz ve ilaç erişimi, salgın riski, ruh sağlığı. 💡 Haiti'de depremden sonraki kolera salgını, dolaylı sağlık sonucunun en net örneğidir."}, {"t": "Kırılgan gruplar", "b": "**Yaşlılar, bebek ve çocuklar, gebeler, engelliler, kronik hastalar, yerinden edilmiş nüfus** aynı olayda çok daha kırılgandır. Zarar görebilirlik sağlıkta **somuttur**: aynı olay herkesi aynı ölçüde etkilemez."}, {"t": "Sağlık hizmeti zinciri", "b": "Afette sağlık zinciri: **olay yeri → 112 → UMKE → hastane (HAP)**. Kaynak ile ihtiyaç oranı **tersine döndüğünde** bakım mantığı da değişir: **triyaj**."}]}, {"title": "Afet Türleri, Sınıflandırmalar ve Afet İstatistikleri", "desc": "Sınıflandırmanın amacı, EM-DAT ve kayıt ölçütleri, doğa kaynaklı/teknolojik alt gruplar, Kalkınma Bakanlığı, Özey, oluş hızı ve Bryant sınıflandırmaları, dünya ve Türkiye afet istatistikleri, afetzede kavramı, sağlık göstergeleri", "short": "Afet Türleri", "questions": [{"q": "Derste afetleri sınıflandırmanın afet yönetiminde mümkün kıldığı dört temel iş sayılmıştır. Aşağıdakilerden hangisi bunlardan biri **değildir**?", "opts": [{"t": "Olayları saymak (istatistik üretmek)"}, {"t": "Ülkeler ve yıllar arasında karşılaştırma yapmak"}, {"t": "Afet türüne özgü hazırlık planlamak"}, {"t": "Afetin hukuki sorumlusunu belirlemek"}, {"t": "Bütçe ve personel gibi kaynakları ayırmak"}], "a": 3, "exp": "Sınıflandırma akademik bir düzen merakı değil; **saymak, karşılaştırmak, planlamak ve kaynak ayırmak** için gereken araçtır. Kategori yoksa istatistik de yoktur. Sorumluluk tespiti bu dört iş arasında yer almaz.\n💡 Dört işi \"**S-K-P-K**\" (Say, Karşılaştır, Planla, Kaynak ayır) diye kodlayabilirsin."}, {"q": "Derste \"her afet türü farklı bir hazırlık gerektirir\" ilkesi örneklerle açıklanmıştır. Bu örneklere göre **salgın** için öne çıkan hazırlık hangisidir?", "opts": [{"t": "Tahliye"}, {"t": "Arama-kurtarma"}, {"t": "İzolasyon"}, {"t": "Enkaz kaldırma"}, {"t": "Barınma çadırı kurma"}], "a": 2, "exp": "Slayttaki eşleştirme: **depreme arama-kurtarma, sele tahliye, salgına izolasyon**. Bu örnekler, planlama yapabilmek için önce olayın hangi kategoriye girdiğini bilmek gerektiğini gösterir. Konuşmacı notundaki mesleki karşılık: 112 komuta merkezi bir çağrıyı hangi kategoriye koyduğuna göre farklı ekip gönderir — **kategori, kaynağı belirler**."}, {"q": "EM-DAT (Emergency Events Database) ile ilgili olarak kuruluş yılı ve kurucu kurum eşleştirmesi hangisinde doğru verilmiştir?", "opts": [{"t": "1988 – CRED"}, {"t": "1988 – WHO"}, {"t": "1900 – CRED"}, {"t": "1999 – AFAD"}, {"t": "2005 – Birleşmiş Milletler"}], "a": 0, "exp": "EM-DAT **1988**'de **CRED** (Centre for Research on the Epidemiology of Disasters – Afetler Epidemiyolojisi Araştırma Merkezi) tarafından kurulmuştur. **WHO** ve **Belçika Hükümeti** kuruluşu *desteklemiştir*, kurucu değildir. 1900 ise veri tabanındaki kayıtların başladığı yıldır."}, {"q": "Aşağıdakilerden hangisi bir olayın EM-DAT'a kaydedilmesi için aranan ölçütlerden biri **değildir**?", "opts": [{"t": "10 veya daha fazla kişinin ölmesi"}, {"t": "100 veya daha fazla kişinin etkilenmesi"}, {"t": "İlgili devletin uluslararası yardım çağrısında bulunması"}, {"t": "Yerel imkânlar yetmediği için merkezî hükümetten yardım istenmesi"}, {"t": "Ekonomik kaybın belirli bir dolar eşiğini aşması"}], "a": 4, "exp": "EM-DAT'ın dört ölçütü: **≥10 ölüm**, **≥100 etkilenen** (yaralanan, evsiz kalan, acil yardıma muhtaç), **yerel imkânların yetmemesi** (merkezî hükümetten yardım istenmesi) ve **uluslararası yardım çağrısı**. Ekonomik kayıp eşiği bu ölçütler arasında yoktur.\n💡 \"**10 – 100 – iki yardım**\": 10 ölüm, 100 etkilenen, merkezî veya uluslararası yardım çağrısı."}, {"q": "Bir ilçede meydana gelen olayda 9 kişi ölmüş, 90 kişi etkilenmiştir; ne merkezî hükümetten ne de uluslararası alandan yardım istenmiştir. Bu olayın EM-DAT'a kaydı için hangisi doğrudur?", "opts": [{"t": "EM-DAT'a girmez; ama bu, orada yaşayanlar için afet olmadığı anlamına gelmez"}, {"t": "EM-DAT'a girer; çünkü ölü ve etkilenen sayıları toplamı 99'u bulmuştur"}, {"t": "EM-DAT'a girer; çünkü 9 ölüm on kişilik eşiğe yuvarlanır"}, {"t": "EM-DAT'a girmez; dolayısıyla bilimsel olarak afet sayılamaz"}, {"t": "EM-DAT'a ancak dört ölçütün tamamı sağlanırsa girebilir"}], "a": 0, "exp": "Dört ölçütten **hiçbiri sağlanmadığı** için olay EM-DAT'a girmez (10 ölüm ve 100 etkilenen eşikleri aşılmamış, yardım istenmemiş). Ancak slaytın uyarısı: bu eşikler bir **veri tabanı kuralıdır**; eşiğin altındaki olay orada yaşayanlar için yine afet olabilir. Ayrıca girmek için dört ölçütün hepsi değil, **yalnızca biri** yeterlidir."}, {"q": "Bir olayda 3 kişi ölmüş ve 40 kişi etkilenmiştir; ancak ilgili ülke hükümeti uluslararası yardım çağrısında bulunmuştur. EM-DAT açısından doğru değerlendirme hangisidir?", "opts": [{"t": "Kaydedilmez; ölü sayısı 10'un altındadır"}, {"t": "Kaydedilmez; etkilenen sayısı 100'ün altındadır"}, {"t": "Kaydedilir; ölçütlerden biri yeterlidir"}, {"t": "Kaydedilmez; ölçütlerin en az ikisi sağlanmalıdır"}, {"t": "Ancak merkezî hükümet de yardım isterse kaydedilir"}], "a": 2, "exp": "EM-DAT'a girmek için dört ölçütten **yalnızca biri** yeterlidir; hepsi birden aranmaz. Burada **uluslararası yardım çağrısı** ölçütü sağlandığından olay kaydedilir; düşük ölü/etkilenen sayıları bunu engellemez."}, {"q": "EM-DAT'ın doğa kaynaklı afetler için kullandığı beş alt gruptan biri **değildir**?", "opts": [{"t": "Jeolojik"}, {"t": "Hidrolojik"}, {"t": "Hidrografik"}, {"t": "Klimatolojik"}, {"t": "Biyolojik"}], "a": 2, "exp": "EM-DAT doğa kaynaklı afetleri **jeolojik, hidrolojik, meteorolojik, klimatolojik ve biyolojik** olarak beşe ayırır. **Hidrografik** grup Özey (2006) sınıflandırmasına aittir.\n💡 Tetikleyiciye bak: **yer** (jeolojik), **su** (hidrolojik), **hava** (meteorolojik), **iklim** (klimatolojik), **canlı** (biyolojik)."}, {"q": "EM-DAT sınıflandırmasına göre aşağıdaki eşleştirmelerden hangisi **yanlıştır**?", "opts": [{"t": "Sis – Klimatolojik"}, {"t": "Volkan patlaması – Jeolojik"}, {"t": "Dalga hareketi – Hidrolojik"}, {"t": "Böcek istilası – Biyolojik"}, {"t": "Kuraklık – Klimatolojik"}], "a": 0, "exp": "**Sis**, fırtına ve aşırı sıcaklıkla birlikte **meteorolojik** gruptadır. Jeolojik: deprem, volkan, kütle hareketi; hidrolojik: sel, su kaynaklı heyelan, dalga hareketi; klimatolojik: kuraklık, buzul gölü patlaması, söndürülemeyen yangın; biyolojik: salgın hastalık, böcek istilası, hayvan salgınları."}, {"q": "EM-DAT'ta **meteorolojik** ve **klimatolojik** afetleri birbirinden ayıran temel ölçüt hangisidir?", "opts": [{"t": "Olayın gelişme zaman ölçeği (gün-hafta / ay-yıl)"}, {"t": "Olayın can kaybı sayısı"}, {"t": "Olayın etkilediği coğrafi alanın genişliği"}, {"t": "Olayın insan kaynaklı olup olmaması"}, {"t": "Olayın uluslararası yardım gerektirip gerektirmemesi"}], "a": 0, "exp": "**Meteorolojik** olaylar **gün-hafta** ölçeğinde (fırtına, sıcak hava dalgası), **klimatolojik** olaylar **ay-yıl** ölçeğinde (kuraklık) gelişir. Bu, \"ani gelişen / yavaş gelişen\" ayrımının aynısıdır."}, {"q": "Bir AYAY ekibi aynı ay içinde iki heyelana müdahale ediyor: birincisi şiddetli bir depremin, ikincisi günlerce süren aşırı yağışın tetiklediği heyelan. EM-DAT mantığına göre bu iki heyelan sırasıyla hangi gruplarda sınıflanır?", "opts": [{"t": "Hidrolojik – Jeolojik"}, {"t": "Jeolojik – Hidrolojik"}, {"t": "Jeolojik – Meteorolojik"}, {"t": "Her ikisi de jeolojik"}, {"t": "Her ikisi de hidrolojik"}], "a": 1, "exp": "Heyelan **hem jeolojik hem hidrolojik** grupta geçebilir; **tetikleyicisine göre** sınıflanır. Depremin tetiklediği heyelan **jeolojik**, aşırı yağışın tetiklediği heyelan **hidrolojik** sayılır. Bu, sınıflandırmaların kesin sınırlar olmadığını gösterir."}, {"q": "EM-DAT'a göre teknolojik afetlerin üç alt grubu hangi seçenekte doğru verilmiştir?", "opts": [{"t": "Endüstriyel kazalar, nükleer ve radyolojik kazalar, ulaşım kazaları"}, {"t": "Sosyal afetler, teknolojik afetler, ulaşım kazaları"}, {"t": "Maden kazaları, sanayi kazaları, savaşlar"}, {"t": "Endüstriyel kazalar, karışık/çeşitli kazalar, ulaşım kazaları"}, {"t": "Endüstriyel kazalar, biyolojik kazalar, karışık kazalar"}], "a": 3, "exp": "EM-DAT teknolojik afetleri üçe ayırır: **endüstriyel kazalar** (kimyasal dökülme, çökme, patlama, yangın, gaz sızıntısı, zehirlenme, radyasyon), **karışık/çeşitli kazalar** (sanayi dışı ortamlarda çökme, patlama, yangın, diğer) ve **ulaşım kazaları** (hava, kara, demir, deniz yolu). \"Sosyal–teknolojik\" ayrımı Özey'in beşeri afet sınıflandırmasıdır."}, {"q": "Türkiye'de afet sınıflandırmasıyla ilgili derste vurgulanan \"kritik nokta\" hangisidir?", "opts": [{"t": "Tüm kurumlar EM-DAT sınıflandırmasını zorunlu olarak kullanır"}, {"t": "AFAD'ın sınıflandırması tek resmî sınıflandırmadır"}, {"t": "Kalkınma Bakanlığı sınıflandırması yasal olarak bağlayıcıdır"}, {"t": "Ortak kabul gören bir afet sınıflandırması yoktur"}, {"t": "Özey (2006) sınıflandırması kanunla kabul edilmiştir"}], "a": 3, "exp": "Türkiye'de **ortak kabul gören bir afet sınıflandırması yoktur**. **AFAD, Meteoroloji Genel Müdürlüğü ve Devlet Su İşleri** gibi kurumlar kendi sorumluluk alanlarına göre farklı sınıflandırmalar kullanır. Bu yüzden aynı olay farklı kurumlarda farklı kategoride kaydedilebilir ve istatistikler tam karşılaştırılamaz."}, {"q": "Afetleri kaynağına göre en yalın biçimde **doğa kaynaklı** ve **insan kaynaklı** olarak ikiye ayıran sınıflandırma hangisidir?", "opts": [{"t": "Özey (2006) sınıflandırması"}, {"t": "Bryant (1993) sınıflandırması"}, {"t": "Kalkınma Bakanlığı (2014)"}, {"t": "EM-DAT (CRED) sınıflandırması"}, {"t": "Barış (2012) çalışması"}], "a": 2, "exp": "**Kalkınma Bakanlığı (2014)** — *Afet Yönetiminde Etkinlik Özel İhtisas Komisyonu raporu* — afetleri en yalın biçimde **doğa kaynaklı** ve **insan kaynaklı** olarak ikiye ayırır. Özey doğal afetleri dörde ayırır, Bryant sınıflandırmaya karşı çıkar, Barış (2012) ise Türkiye'nin afet profilini veren çalışmadır."}, {"q": "Kalkınma Bakanlığı (2014) sınıflandırmasına göre aşağıdakilerden hangisi **insan kaynaklı** afetler arasında yer alır?", "opts": [{"t": "Orman yangını ve erozyon"}, {"t": "Göç ve mülteci krizleri"}, {"t": "Fırtına, hortum, dolu ve don"}, {"t": "Salgın hastalıklar ve böcek istilası"}, {"t": "Çığ"}], "a": 1, "exp": "Kalkınma Bakanlığı listesinde **insan kaynaklı** afetler: endüstriyel ve maden kazaları, ulaşım kazaları, nükleer/biyolojik/kimyasal olaylar, büyük yangınlar ve çevre kirlenmeleri, **savaş, terör, göç ve mülteci krizleri**. **Orman yangını, erozyon, böcek istilası ve çığ** ise doğa kaynaklı sütundadır. Göçün afet sayılmasının nedeni **kapasite eşiğidir**: kısa sürede çok sayıda insanın barınma, sağlık ve beslenme ihtiyacı yerel kapasiteyi aşar."}, {"q": "Özey (2006)'nın doğal afetler için kullandığı dört grup aşağıdakilerin hangisinde doğru verilmiştir?", "opts": [{"t": "Jeolojik, hidrolojik, meteorolojik, biyolojik"}, {"t": "Jeolojik, meteorolojik, klimatolojik, biyolojik"}, {"t": "Klimatik, hidrografik, sosyal, teknolojik"}, {"t": "Jeolojik, hidrolojik, klimatik, beşeri"}, {"t": "Jeolojik, klimatik, hidrografik, biyolojik"}], "a": 4, "exp": "Özey doğal afetleri **kökenlerine** göre dörde ayırır: **jeolojik** (kaynağı yer kabuğu), **klimatik** (atmosfer), **hidrografik** (su kütleleri), **biyolojik** (toprak ve canlılar). \"Hidrolojik / meteorolojik / klimatolojik\" terimleri EM-DAT'a aittir; sosyal ve teknolojik ise Özey'in **beşeri** afet alt gruplarıdır.\n💡 Özey'in kendine özgü iki terimi: **klimaTİK** ve **hidroGRAFİK** — EM-DAT'taki karşılıkları klimatolojik ve hidrolojik."}, {"q": "Özey (2006)'ya göre aşağıdakilerden hangisi **teknolojik** değil **sosyal** afetler arasında yer alır?", "opts": [{"t": "Maden kazaları"}, {"t": "Sanayi kazaları"}, {"t": "Ulaşım sektöründeki kazalar"}, {"t": "Bina, işyeri ve eğlence merkezi yangınları"}, {"t": "Nükleer, biyolojik ve kimyasal silah kullanımı"}], "a": 3, "exp": "Özey'in **sosyal afetleri**: açlık ve kıtlık, savaşlar ve terör saldırıları, bulaşıcı hastalıklar, zoraki göçler ve mülteci krizleri, **bina, işyeri ve eğlence merkezi yangınları**, büyük ekonomik krizler. **Teknolojik afetleri**: maden kazaları, sanayi kazaları, NBK silah kullanımı, ulaşım sektöründeki kazalar. Yangınların sosyal grupta olması sık karıştırılır."}, {"q": "Bulaşıcı hastalıklar (salgınlar) EM-DAT ve Özey sınıflandırmalarında nasıl yer alır?", "opts": [{"t": "EM-DAT'ta doğa kaynaklı biyolojik afet; Özey'de beşeri-sosyal afet"}, {"t": "Her ikisinde de doğa kaynaklı biyolojik afet"}, {"t": "EM-DAT'ta teknolojik-karışık kaza; Özey'de doğal kökenli biyolojik afet"}, {"t": "EM-DAT'ta karışık kaza; Özey'de beşeri-teknolojik afet"}, {"t": "Her ikisinde de beşeri-sosyal afet"}], "a": 0, "exp": "EM-DAT salgın hastalıkları **doğa kaynaklı** grupta **biyolojik** afet olarak sınıflar. Özey ise **bulaşıcı hastalıkları** beşeri afetlerin **sosyal** alt grubuna koyar; Özey'in doğal **biyolojik** grubunda erozyon, orman yangınları ve nesil tükenmesi vardır. Aynı olay farklı sınıflandırmalarda farklı kutuya girer."}, {"q": "Oluş hızına göre sınıflandırmada aşağıdakilerden hangisi **yavaş gelişen** afetlerdendir?", "opts": [{"t": "Çamur akması"}, {"t": "Yıldırım"}, {"t": "Salgın hastalıklar"}, {"t": "Ani sel"}, {"t": "Patlama ve endüstriyel kaza"}], "a": 2, "exp": "**Yavaş gelişen** afetler belirli bir süreçte gelişir: **kuraklık, erozyon ve çölleşme, iklim değişikliği, kıtlık ve açlık, salgın hastalıklar**. **Hızlı gelişen** afetler ani ortaya çıkar: deprem, su baskını ve ani sel, çamur akması, çığ, kaya düşmesi, fırtına, tayfun, hortum, yıldırım, patlama ve endüstriyel kaza."}, {"q": "Oluş hızına göre sınıflandırmanın müdahale planlamasına yansımasıyla ilgili hangisi doğrudur?", "opts": [{"t": "Yavaş gelişen afette kapasite olay sırasında artırılamaz"}, {"t": "Hızlı gelişen afetlerde erken uyarı ve izleme, hazırlıktan daha önemli olan asıl müdahale aracıdır"}, {"t": "Yavaş gelişen afetler daha az ölümcül olduğu için planlamada önceliksizdir"}, {"t": "Hızlı gelişende kapasite olay anında ne ise odur; hazırlık önceden yapılmalıdır"}, {"t": "Oluş hızına göre ayrım müdahale planlaması açısından işlevsizdir"}], "a": 3, "exp": "**Hızlı gelişen** afette zaman yoktur: müdahale kapasitesi **olay anında ne ise odur**; bu yüzden hazırlık (tatbikat, stok, plan) **olaydan önce** tamamlanmalıdır. **Yavaş gelişen** afette zaman vardır: kapasite **artırılabilir**, **erken uyarı ve izleme** devreye girer (kuraklık aylar önce izlenebilir, salgın erken tespitle sınırlanabilir). Bu ayrım müdahale planlaması açısından **en işlevsel** olanıdır.\n💡 Yavaş gelişen afetlerin trajik yanı **görünmezlikleridir**: kuraklık ve kıtlık geçen yüzyılın en ölümcül afetleridir ama deprem kadar haber olmaz."}, {"q": "Bryant (1993)'ın afet sınıflandırmasına yaklaşımı hangisidir?", "opts": [{"t": "Afetler kökenine göre jeolojik, klimatik, hidrografik ve biyolojik olarak dörde ayrılmalıdır"}, {"t": "Afetler yalnızca can kaybına göre sıralanmalıdır"}, {"t": "Afetler 13 türe ayrılarak sınıflandırılmalıdır"}, {"t": "Afetler doğa ve insan kaynaklı olarak ikiye ayrılmalıdır"}, {"t": "Afetler iç içe geçtiği için sınıflandırılamaz; 31 tür tek tek ele alınmalı"}], "a": 4, "exp": "Bryant (1993), afetlerin **iç içe geçmiş olmaları** ve aralarındaki **sebep-sonuç ilişkileri** nedeniyle sınıflandırılamayacağını savunur (deprem heyelanı, heyelan baraj yıkılmasını, yıkılma seli doğurur). Önerisi, dünyada etkili **31 afet türünü** tek tek ve önem sırasına göre ele almaktır."}, {"q": "Bryant'ın önem sıralamasında **deprem** kaçıncı sıradadır ve ilk sırada hangi afet bulunur?", "opts": [{"t": "1. sıra – deprem"}, {"t": "2. sıra – tropikal siklon"}, {"t": "3. sıra – kuraklık"}, {"t": "4. sıra – kuraklık"}, {"t": "4. sıra – tropikal siklon"}], "a": 3, "exp": "Bryant'ın ilk dört sırası: **1. kuraklık, 2. tropikal siklon, 3. bölgesel sel ve taşkınlar, 4. deprem**. Öğrenciler depremin birinci olmasını bekler; oysa Bryant yalnızca can kaybına değil, **süreye, alana ve kalıcılığa** da bakar. Kuraklık aylarca sürer, kıtaları etkiler, etkisi yıllarca kalır; deprem ise ~45 saniye sürer ve sınırlı alanı etkiler.\n💡 Sıra kodlaması: \"**K-T-S-D**\" (Kuraklık, Tropikal siklon, Sel, Deprem)."}, {"q": "Geçen yüzyılda dünyada en çok can kaybına yol açan on afetle ilgili hangisi doğrudur?", "opts": [{"t": "Yarısı deprem, yarısı seldir"}, {"t": "Altısı sel, dördü kuraklıktır"}, {"t": "Çoğu deprem olup tamamı Asya'daki kalabalık ülkelerde meydana gelmiştir"}, {"t": "Altısı kuraklık, üçü sel, biri depremdir"}, {"t": "Hiçbiri deprem değildir; altısı kuraklık, dördü seldir"}], "a": 4, "exp": "En ölümcül on afetin **tamamı sel ve kuraklıktır**: **altısı kuraklık, dördü sel**; **hiçbiri deprem değildir**. Hepsi **Çin, Hindistan ve Sovyet Rusya**'da meydana gelmiştir (Kaynak: Özceylan 2011, ders kitabı Tablo 1.3). Sınıfın büyük çoğunluğu \"deprem\" der, çünkü Türkiye'de deprem en görünür afettir."}, {"q": "Geçen yüzyılın en ölümcül tek afeti olarak verilen olay ve yaklaşık can kaybı hangisidir?", "opts": [{"t": "Çin'de kuraklık – yaklaşık 3.000.000"}, {"t": "Çin'de sel – yaklaşık 3.700.000"}, {"t": "Hindistan'da kuraklık – yaklaşık 1.500.000"}, {"t": "Sovyet Rusya'da kuraklık – yaklaşık 1.200.000"}, {"t": "Çin'de sel – yaklaşık 2.000.000"}], "a": 1, "exp": "Listenin başında **Çin'deki sel (~3.700.000 can kaybı)** vardır. Ardından Çin kuraklığı (~3.000.000), Çin seli (~2.000.000), Hindistan kuraklıkları (~1.500.000 ve ~1.250.000, iki ayrı olay) ve Sovyet Rusya kuraklığı (~1.200.000) gelir. Yani tek bir afette **3 milyondan fazla** insanın öldüğü olmuştur."}, {"q": "Kuraklık ve selin geçen yüzyılın en ölümcül afetleri olmasının nedenleriyle ilgili aşağıdakilerden hangileri doğrudur?\nI. Yavaş geliştikleri için müdahale gecikir ve \"acil\" sayılmazlar.\nII. Çok geniş alanları, hatta kıtaları etkileyebilirler.\nIII. Ölümler doğrudan değil; kıtlık, açlık ve bulaşıcı hastalık üzerinden dolaylı gerçekleşir.", "opts": [{"t": "Yalnız II"}, {"t": "I ve II"}, {"t": "II ve III"}, {"t": "I ve III"}, {"t": "I, II ve III"}], "a": 4, "exp": "Derste üç sebep birlikte verilir: **(1) yavaş gelişirler**, müdahale gecikir; **(2) etkiledikleri alan çok geniştir**; **(3) ölüm dolaylıdır** — kuraklık kıtlığa, kıtlık açlık ve hastalığa yol açar. Öğrenciler genellikle yalnızca \"geniş alan\" der; üçünün de aranması gerekir.\n💡 AYAY bağlantısı: bu afetlerde ölümlerin çoğu travma değil açlık, susuzluk ve bulaşıcı hastalık kaynaklıdır — müdahale arama-kurtarma değil, **halk sağlığı** işidir."}, {"q": "EM-DAT verilerine (1900–2016) göre dünya afet bilançosuyla ilgili eşleştirmelerden hangisi **yanlıştır**?", "opts": [{"t": "Doğal afetlerde ölen – yaklaşık 174 milyon"}, {"t": "Doğa kaynaklı afet sayısı – 14.145"}, {"t": "Teknolojik afet sayısı – 8.361"}, {"t": "Afetler nedeniyle evsiz kalan – 174 milyon"}, {"t": "Toplam maddi kayıp – yaklaşık 3 trilyon dolar"}], "a": 0, "exp": "Doğru değerler: **14.145 doğa kaynaklı**, **8.361 teknolojik** afet; **33 milyon can kaybı**; **174 milyon evsiz**; yaklaşık **3 trilyon dolar** maddi kayıp. 174 milyon evsiz sayısıdır, can kaybı değil. Bu rakamlar yalnızca **EM-DAT eşiğini aşan** olaylara aittir; gerçek toplam daha büyüktür.\n💡 33 milyon, bugünkü Türkiye nüfusunun yaklaşık **üçte birine** denk gelir."}, {"q": "Afet sayılarındaki artışın nedenleri ile açıklamaları eşleştirildiğinde hangisi **yanlıştır**?", "opts": [{"t": "Gerçek artış – İklim değişikliğine bağlı aşırı hava olaylarının sıklık ve şiddetinin artması"}, {"t": "Maruziyet artışı – Yanlış arazi kullanımı ve çevre kirliliği"}, {"t": "Maruziyet artışı – Hızlı nüfus artışı ve çarpık kentleşme"}, {"t": "Zarar görebilirlik artışı – Yanlış yer seçimi ve doğal dengenin bozulması"}, {"t": "Kayıt kapasitesi artışı – Haberleşme ve kayıt sistemlerinin gelişmesi"}], "a": 1, "exp": "**Maruziyet artışı**: hızlı nüfus artışı ve çarpık kentleşme daha çok insanı tehlikeli alanlara yerleştirir. **Yanlış arazi kullanımı, yer seçimi, çevre kirliliği ve doğal dengenin bozulması** ise **zarar görebilirlik artışıdır**. EM-DAT grafikleri **1980'li yıllardan** itibaren hem doğa kaynaklı hem teknolojik afetlerde ciddi artış gösterir."}, {"q": "1980–2011 arasında dünyada en büyük ekonomik kayba yol açan afet hangisidir?", "opts": [{"t": "ABD 2005 Katrina Kasırgası – 125 milyar $"}, {"t": "Japonya 1995 Kobe depremi – 100 milyar $"}, {"t": "Çin 2008 Wenchuan depremi – 85 milyar $"}, {"t": "ABD 1994 Northridge depremi – 44 milyar $"}, {"t": "Japonya 2011 deprem/tsunami – 210 milyar $"}], "a": 4, "exp": "Sıralama: **1. Japonya 2011 deprem ve tsunami (210 milyar $)**, 2. ABD 2005 Katrina (125), 3. Japonya 1995 Kobe (100), 4. Çin 2008 Wenchuan (85), 5. ABD 1994 Northridge (44). İlk beşin dördü depremdir — en maliyetli listede **en çok tekrar eden afet türü depremdir**."}, {"q": "En maliyetli ve en ölümcül afet listelerinin karşılaştırılmasından çıkan sonuçla ilgili hangisi doğrudur?", "opts": [{"t": "En maliyetli ve en ölümcül afetler aynı ülkelerde yoğunlaşır"}, {"t": "Yoksul ülkelerde mutlak maddi kayıp gelişmiş ülkelerden büyüktür"}, {"t": "Mutlak maddi kayıp, bir afetin ülkeye göreli etkisini tam olarak yansıtır"}, {"t": "Gelişmiş ülkelerde can kaybı, kaybedilen değer arttıkça yükselir"}, {"t": "En maliyetliler gelişmiş, en ölümcüller yoksul ülkelerde görülür"}], "a": 4, "exp": "En maliyetli beş afetin tamamı **gelişmiş ülkelerdedir** (kaybedilecek değer fazla, ama yapılar sağlam ve sistemler çalıştığı için can kaybı düşük). En ölümcüller **yoksul ülkelerdedir**. Ancak **mutlak kayıp ile göreli etki farklıdır**: yoksul ülkedeki küçük rakamlı kayıp, millî gelirine oranla çok daha yıkıcı olabilir."}, {"q": "Dünya Bankası raporuna göre doğa kaynaklı afetlerin az gelişmiş ülkelerde meydana gelme oranı ve bu ülkelerdeki can kaybı payı hangisidir?", "opts": [{"t": "Afetlerin %9'u – can kaybının %48'i"}, {"t": "Afetlerin %48'i – can kaybının %9'u"}, {"t": "Afetlerin %19'u – can kaybının %84'ü"}, {"t": "Afetlerin %9'u – can kaybının %84'ü"}, {"t": "Afetlerin %33'ü – can kaybının %48'i"}], "a": 0, "exp": "Doğa kaynaklı afetlerin **yalnızca %9'u** az gelişmiş ülkelerde meydana gelir, ama toplam insan kaybının **%48'i** bu ülkelerdedir. Bu, Hafta 1'deki Haiti–Şili karşılaştırmasının küresel ölçekteki hâlidir; nedeni yapı stoku, kurumsal kapasite, yoksulluk, eğitim gibi faktörlerdir.\n💡 \"**9'a 48**\": afetin onda biri, ölümün neredeyse yarısı."}, {"q": "Dünya Bankası raporunun afet önlemeyle ilgili temel mesajı hangisidir?", "opts": [{"t": "\"Direnç kültürü\" geliştirilmeli; önleme bütçeleri en az yardım bütçeleri kadar olmalı"}, {"t": "Afet yardım bütçeleri, önleme bütçelerinin en az iki katına çıkarılmalı ve öncelik müdahaleye verilmelidir"}, {"t": "Az gelişmiş ülkelere yalnızca afet sonrası yardım yapılmalıdır"}, {"t": "Önleme harcamaları can kaybını azaltmakta etkisizdir"}, {"t": "Afet yönetimi yalnızca uluslararası kuruluşlara bırakılmalıdır"}], "a": 0, "exp": "Rapor, dünyanın acilen bir **\"direnç kültürü\"** geliştirmesi ve **afet önleme bütçelerinin en az afet yardımı bütçeleri kadar büyütülmesi** gerektiğini vurgular. Afet öncesi tedbirlere bütçe ayıran ülkelerde insan ve mal kaybı çok daha düşüktür — **önleme, müdahaleden ucuzdur**. \"Direnç kültürü\", 12. haftadaki dirençli toplum/kent kavramının erken hâlidir."}, {"q": "Barış (2012) çalışmasına göre Türkiye'nin eğilimli olduğu başlıca dört doğa kaynaklı afet tipi hangisinde doğru verilmiştir?", "opts": [{"t": "Deprem, kuraklık, sel, çığ"}, {"t": "Deprem, heyelan, çığ, kaya düşmesi"}, {"t": "Deprem, tsunami, sel, fırtına"}, {"t": "Heyelan, sel, kuraklık, salgın"}, {"t": "Deprem, heyelan, sel, yangınlar"}], "a": 4, "exp": "Barış (2012)'ye göre Türkiye başlıca dört tip afete eğilimlidir: **deprem, heyelan, sel ve yangınlar** (her yıl çok sayıda orman, işyeri ve konut yangını görülür). Çeldiricilerdeki kuraklık, tsunami, çığ ve salgın gibi olaylar bu dörtlüde yer almaz.\n💡 Dörtlüyü \"**D-H-S-Y**\" (Deprem, Heyelan, Sel, Yangın) diye kodlayabilirsin."}, {"q": "Derste verilen **aktif fay** tanımı hangisidir?", "opts": [{"t": "Son 10.000 yılda hareket etmiş, yeniden kırılabilecek fay"}, {"t": "Son 100 yıl içinde büyük deprem üretmiş fay"}, {"t": "Son 1.000 yıl içinde hareket etmiş, yerleşim altındaki fay"}, {"t": "Son 1 milyon yıl içinde hiç hareket etmemiş fay"}, {"t": "Yüzeyde izlenebilen, uzunluğu 100 km'yi aşan fay"}], "a": 0, "exp": "**Aktif fay**: **son 10.000 yıl içinde hareket etmiş**, yeniden kırılma potansiyeli taşıyan faydır. Ülke topraklarının **%66**'sı aktif fay bölgesindedir. Ayrıntısı 4. haftada işlenecektir."}, {"q": "7269 sayılı kanuna göre **afetzede** tanımı hangisidir?", "opts": [{"t": "Afette yaralanan ve bu nedenle acil sağlık hizmeti almak zorunda kalan kişi"}, {"t": "Afette evi yıkılan ve devlet tarafından barındırılan kişi"}, {"t": "Afetten fiziksel, sosyal ve ekonomik yönden zarar gören veya görmesi muhtemel kişi"}, {"t": "Afette hayatını kaybeden kişilerin birinci derece yakınları"}, {"t": "Yalnızca gerçekleşmiş bir afette fiziksel ya da ekonomik yönden doğrudan zarar gören kişi"}], "a": 2, "exp": "7269 sayılı kanuna göre afetzede: **olmuş ya da olması muhtemel** afet ve acil durumlardan dolayı **fiziksel, sosyal ve ekonomik** yönden **zarara uğrayan veya uğraması muhtemel** kişidir. Öğrencilerin çoğu yalnızca \"yaralanan kişi\" der; tanım bundan çok daha geniştir."}, {"q": "Türkiye'nin temel afet kanunu olan 7269 sayılı kanunun adı ve yılı hangisidir?", "opts": [{"t": "Afet ve Acil Durum Yönetimi Kanunu – 2009"}, {"t": "Umumi Hayata Müessir Afetler Kanunu – 1959"}, {"t": "Umumi Hayata Müessir Afetler Kanunu – 1999"}, {"t": "Afetler Epidemiyolojisi Kanunu – 1988"}, {"t": "Sivil Savunma Kanunu – 1959"}], "a": 1, "exp": "**7269 sayılı Umumi Hayata Müessir Afetler Kanunu** **1959** tarihlidir ve Türkiye'nin temel afet kanunudur. Afetzede tanımı bu kanuna ve AFAD (2014) kaynağına dayanır. **AFAD** (Afet ve Acil Durum Yönetimi Başkanlığı) Türkiye'de afet yönetiminden sorumlu merkezî kurumdur."}, {"q": "Gökçe vd. (2008) verilerine göre Türkiye'de **en sık görülen** afet ile **en çok insanı etkileyen** afet sırasıyla hangisidir?", "opts": [{"t": "Deprem – Deprem"}, {"t": "Heyelan – Deprem"}, {"t": "Deprem – Heyelan"}, {"t": "Su baskını – Deprem"}, {"t": "Heyelan – Su baskını"}], "a": 1, "exp": "**Heyelan** 13.494 olayla en sık görülen afettir, ama 59.345 afetzede üretir. **Deprem** 5.318 olayla heyelanın yarısından azdır, ama **158.241 afetzede** ile toplam afetzedenin yarısından fazlasını oluşturur. **Sıklık ile etki aynı şey değildir.**"}, {"q": "Afet istatistiklerini sağlık gözüyle okurken AYAY öğrencisi için en önemli gösterge olarak vurgulanan ölü/yaralı oranı ile ilgili hangisi doğrudur?", "opts": [{"t": "Depremde ölü sayısı, yaralı sayısından her zaman ve belirgin biçimde fazladır"}, {"t": "Tsunamide yaralı sayısı ölüden çok fazladır"}, {"t": "Ölü/yaralı oranı afet türünden bağımsız olarak sabittir"}, {"t": "Selde baskın ölüm nedeni ezilme ve travmadır"}, {"t": "Depremde yaralı > ölü; sel ve tsunamide oran tersine döner"}], "a": 4, "exp": "Depremde **yaralı sayısı ölüden fazladır** (1 ölüme karşılık 2-3 yaralı) — yani kurtarılabilir hasta çoktur. **Selde ve tsunamide** oran tersine döner: **boğulma hâkimdir**, yaralı azdır; insanlar ya kurtulur ya boğulur. Bu oran **kaç ambulans ve kaç yatak** gerektiğini doğrudan belirler."}, {"q": "Afet türü ile beklenen hasta profili eşleştirmelerinden hangisi **yanlıştır**?", "opts": [{"t": "Sıcak hava dalgası – inhalasyon ve yanık"}, {"t": "Deprem – ezilme ve travma"}, {"t": "Sel – boğulma ve sonrasında salgın"}, {"t": "Yangın – inhalasyon ve yanık"}, {"t": "Sıcak hava dalgası – dolaşım ve solunum sorunları"}], "a": 0, "exp": "Derste verilen eşleştirme: **deprem → ezilme ve travma**; **sel → boğulma ve sonrasında salgın**; **sıcak dalga → dolaşım ve solunum**; **yangın → inhalasyon ve yanık**. Afet türü, karşılaşacağınız hasta profilini ve dolayısıyla **malzeme listenizi** belirler.\n💡 \"Hangi afete gittiğinizi bilmek, ne göreceğinizi bilmenin yarısıdır.\""}, {"q": "\"Afet mi, acil durum mu, sadece doğa olayı mı?\" etkinliğinde afet ile acil durumu ayıran çizgi olarak ne gösterilmiştir?", "opts": [{"t": "Olayın fiziksel büyüklüğü"}, {"t": "Toplumun baş etme kapasitesi"}, {"t": "Olayın doğa ya da insan kaynaklı olması"}, {"t": "Olayın medyada yer alma düzeyi"}, {"t": "Olaydaki ölü sayısının 10'u aşması"}], "a": 1, "exp": "Etkinliğin cevap slaydı: afet ile acil durumu ayıran çizgi **olayın büyüklüğü değil, o toplumun baş etme kapasitesidir**. Doğa olayında kayıp ve etkilenen toplum yoktur; acil durumda **yerel kaynak yeter**; afette **kapasite aşılır**. Etkinlikte gerekçe yazılmayan cevap sayılmaz."}], "cards": [{"t": "Sınıflandırma neden yapılır?", "b": "Sınıflandırma bir etiketleme merakı değil, afet yönetiminin dört temel işinin ön koşuludur: **saymak**, **karşılaştırmak**, **planlamak** ve **kaynak ayırmak**. Kategori yoksa istatistik de yoktur. 💡 Yanlış sayılan bir afet, yanlış ayrılan bir bütçedir."}, {"t": "EM-DAT nedir?", "b": "EM-DAT (Emergency Events Database), **1988**'de **CRED** tarafından **WHO ve Belçika Hükümeti** desteğiyle kurulan uluslararası afet veri tabanıdır; 1900'den bugüne **18.000'in üzerinde** kayıt içerir. 💡 CRED bir **epidemiyoloji** (halk sağlığı) merkezidir — çünkü afetin ölçüsü yıkılan bina değil, etkilenen insandır."}, {"t": "EM-DAT giriş ölçütleri", "b": "Bir olayın EM-DAT'a girmesi için dört ölçütten **yalnızca biri** yeterlidir: **10+ ölüm**, **100+ etkilenen**, **yerel imkânların yetmemesi** (merkezî hükümetten yardım istenmesi), **uluslararası yardım çağrısı**. 💡 Hepsi birden aranmaz — biri yeter."}, {"t": "Eşik altı olaylar", "b": "EM-DAT eşiğinin altında kalan olaylar veri tabanına girmez; ama bu, o olayın orada yaşayanlar için **afet olmadığı** anlamına gelmez. Bu yüzden EM-DAT rakamları gerçeğin tamamı değil, **eşiği aşan kısmıdır**."}, {"t": "EM-DAT: doğa kaynaklı 5 grup", "b": "EM-DAT doğa kaynaklı afetleri beşe ayırır: **jeolojik** (deprem, volkan), **hidrolojik** (sel), **meteorolojik** (fırtına), **klimatolojik** (kuraklık), **biyolojik** (salgın). 💡 Tetikleyiciye bak: yer mi, su mu, hava mı, iklim mi, canlı mı?"}, {"t": "Meteorolojik ≠ klimatolojik", "b": "Sık karıştırılır: **meteorolojik** olaylar **gün-hafta** ölçeğinde gelişir (fırtına, sıcak hava dalgası); **klimatolojik** olaylar **ay-yıl** ölçeğinde gelişir (kuraklık). 💡 Ani gelişen / yavaş gelişen ayrımının aynısı."}, {"t": "Heyelan iki kutuya girebilir", "b": "Heyelan **tetikleyicisine göre** sınıflanır: aşırı yağışın tetiklediği heyelan **hidrolojik**, depremin tetiklediği heyelan **jeolojik** sayılır. Sınıflandırmalar kesin sınırlar değildir."}, {"t": "EM-DAT: teknolojik 3 grup", "b": "Teknolojik afetler üçe ayrılır: **endüstriyel kazalar**, **karışık/çeşitli kazalar** (sanayi dışı), **ulaşım kazaları** (hava, kara, demir, deniz). 1900–2016'da **8.361** teknolojik afet kaydedildi — yani **her üç afetten biri teknolojiktir**; istisna değil, tablonun büyük parçasıdır."}, {"t": "Kalkınma Bakanlığı (2014)", "b": "En yalın sınıflandırmadır: afetler kaynağına göre **doğa kaynaklı** ve **insan kaynaklı** olarak ikiye ayrılır. İnsan kaynaklılar arasında **savaş, terör, göç ve mülteci krizleri** de vardır. 💡 İki sütun, sorumluluğun değil **tetikleyicinin** ayrımıdır."}, {"t": "Özey (2006): doğal afetler", "b": "Özey doğal afetleri kökenlerine göre **dörde** ayırır: **jeolojik kökenli** (deprem, tsunami), **klimatik** (kuraklık, kasırga, çığ), **hidrografik** (akarsu ve baraj taşkınları), **biyolojik** (erozyon, orman yangını)."}, {"t": "Orman yangını hangi kutuda?", "b": "**Özey** orman yangınını **biyolojik** gruba koyar (kaynağa bakar: bitki örtüsü etkilenir); **EM-DAT** ise **klimatolojik** gruba koyar (tetikleyiciye bakar: kuraklık ve sıcaklık başlatır). 💡 Aynı olay, sorduğunuz soruya göre farklı kutuya girer."}, {"t": "Özey: beşeri afetler", "b": "Özey insan kaynaklı afetleri **beşeri afetler** başlığında ikiye ayırır: **sosyal** (açlık, savaş, bulaşıcı hastalık, zoraki göç, **büyük ekonomik krizler**) ve **teknolojik** (maden, sanayi ve ulaşım kazaları). 💡 Ekonomik krizi Özey afet sayar, EM-DAT saymaz — ikisi de savunulabilir."}, {"t": "Oluş hızına göre ayrım", "b": "**Hızlı gelişen** afette (deprem, ani sel, çığ, patlama) kapasite **olay anında ne ise odur** — hazırlık önceden bitmiş olmalıdır. **Yavaş gelişen** afette (kuraklık, kıtlık, salgın, iklim değişikliği) zaman bir fırsattır: **erken uyarı ve izleme** devreye girer. 💡 Müdahale planlamasının en işlevsel ayrımı budur."}, {"t": "Bryant'ın itirazı (1993)", "b": "Bryant'a göre afetler birbirini tetikledikleri için **sınıflandırılamaz**; **31 afet türü** tek tek, önem sırasına göre ele alınmalıdır (ölçütler: şiddet, süre, alan, can kaybı, ekonomik kayıp, sosyal etki, kalıcılık). Sıralamada ilk dört: **1. Kuraklık, 2. Tropikal siklon, 3. Sel, 4. Deprem**. 💡 Puan ölçeği **1 = en büyük**, 5 = en küçük — tabloyu ters okuma!"}, {"t": "Türkiye'de ortak sınıflandırma yok", "b": "Türkiye'de **ortak kabul gören bir afet sınıflandırması yoktur**. AFAD, Meteoroloji ve DSİ kendi alanlarına göre farklı sistemler kullanır; aynı olay farklı kategorilerde kaydedilir ve istatistikler **karşılaştırılamaz**. 💡 Yanlış sayılan afet, yanlış ayrılan bütçedir."}, {"t": "En ölümcül on afet", "b": "Geçen yüzyılın en ölümcül on afetinin **hiçbiri deprem değildir**: **altısı kuraklık, dördü seldir** ve hepsi **Çin, Hindistan ve Sovyet Rusya**'da yaşanmıştır. En ölümcül tek afet: Çin'deki sel, yaklaşık **3.700.000** can kaybı."}, {"t": "Kuraklık ve sel neden öldürür?", "b": "Üç sebep: (1) **yavaş gelişirler**, müdahale gecikir; (2) **çok geniş alanları** etkilerler; (3) ölüm **dolaylıdır** — kıtlık, açlık ve bulaşıcı hastalık üzerinden gerçekleşir. 💡 Bu yüzden müdahaleleri arama-kurtarma değil, **halk sağlığı** işidir."}, {"t": "Dünya bilançosu 1900–2016", "b": "EM-DAT: **14.145 doğa kaynaklı** ve **8.361 teknolojik** afet; yaklaşık **33 milyon can kaybı**, **174 milyon evsiz**, **≈3 trilyon dolar** maddi kayıp. 💡 33 milyon, bugünkü Türkiye nüfusunun yaklaşık üçte biridir."}, {"t": "Afetler gerçekten artıyor mu?", "b": "Artışın dört sebebi var: **gerçek artış** (iklim değişikliği), **maruziyet artışı** (nüfus, çarpık kentleşme), **zarar görebilirlik artışı** (yanlış arazi kullanımı) ve **kayıt kapasitesi artışı**. 💡 Grafikteki artışın bir kısmı olayın değil, **ölçümün** iyileşmesindendir."}, {"t": "En maliyetli ≠ en ölümcül", "b": "**En maliyetli** afetler gelişmiş ülkelerde olur (1. sıra: Japonya 2011 deprem-tsunami, **210 milyar $**; 2. Katrina 125; 3. Kobe 100), **en ölümcül** afetler yoksul ülkelerde. Gelişmiş ülkede kaybedilecek değer çok, can kaybı az; yoksul ülkede tam tersi."}, {"t": "%9 olay, %48 can kaybı", "b": "Doğa kaynaklı afetlerin yalnızca **%9'u** az gelişmiş ülkelerde olur; ama toplam can kaybının **%48'i** oradadır. Dünya Bankası'nın mesajı: **önleme, müdahaleden ucuzdur** — önleme bütçeleri en az yardım bütçeleri kadar büyümelidir."}, {"t": "Türkiye'nin deprem profili", "b": "Barış (2012): Nüfusun **%70'i** deprem tehlikesi çok yüksek bölgelerde yaşar; ülkenin **%66'sı aktif fay** bölgesindedir (aktif fay: son 10.000 yılda hareket etmiş). Hasar gören binaların **%75'i**, toplam afet kayıplarının **%64'ü** depremlerden. 💡 Deprem bölge sorunu değil, **ülke** sorunudur."}, {"t": "Heyelan ve sel (Türkiye)", "b": "Toprakların **%25'i** heyelana maruz, nüfusun **%11'i** heyelanlı bölgelerde; zararların **%16'sı** heyelandan. Sel zararların **%15'ini** üretir (yıllık ≈100 milyon $); sebepleri — orman kaybı, erozyon, bilgisiz gelişme — üçü de **insan kaynaklıdır**."}, {"t": "Afetzede kimdir?", "b": "**7269 sayılı kanuna** (1959, Türkiye'nin temel afet kanunu) göre afetzede: afetten **fiziksel, sosyal veya ekonomik** yönden zarara uğrayan **veya uğraması muhtemel** kişi — yalnızca yaralananları değil, risk altındakileri (ör. tahliye edilen aile) de kapsar. 💡 Sağlık planlaması yaralı sayısına değil **etkilenen sayısına** göre yapılır: evsiz kalan kişi de barınma, beslenme, kronik ilaç ve psikososyal destek ihtiyacı doğurur."}, {"t": "Sıklık ≠ etki", "b": "Gökçe vd. (2008), 1950–2008: en sık afet **heyelan** (13.494 olay, 59.345 afetzede — olay başına 4-5 kişi); en çok insanı etkileyen **dep
