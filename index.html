(çekme)** bölgelerde oluşur; tavan bloğu taban bloğuna göre **AŞAĞI** kayar. Yerkabuğu çekilip incelirken gelişir; **Ege Çöküntü Fay Sistemi** bu türdendir."}, {"t": "Ters fay ve bindirme", "b": "Ters fay **sıkışmalı** bölgelerde oluşur; tavan bloğu **YUKARI** çıkar. **Bindirme**, fay düzlemi **yataya yakın** olan özel ters faydır: tavan blok uzun mesafe ilerler, dağ kuşakları böyle oluşur. Örnek: **Bitlis Bindirmesi**."}, {"t": "Doğrultu atımlı fay", "b": "Bloklar fay düzlemi boyunca birbirine göre **YATAY (yanal)** kayar; fayı kesen yol ötelenir. Türkiye'nin **en yıkıcı depremlerini** üreten KAF ve DAF bu türdendir. 💡 Normal = iner, ters = çıkar, doğrultu atımlı = yana kayar."}, {"t": "Fay türü deprem karakterini belirler", "b": "**Doğrultu atımlı** faylar yüzlerce km kesintisiz kırılabildiği için **seyrek ama çok büyük** deprem üretir; Ege'nin **kısa normal fayları** ise **sık ama orta büyüklükte** deprem üretir. İki bölgenin hazırlık stratejisi bu yüzden farklıdır."}, {"t": "Sağ yönlü / sol yönlü", "b": "Fayın bir yanında durup karşıya bakıldığında karşı bloktaki nesne (yol, dere, duvar) **sağa** kaymışsa fay **sağ yönlü**, **sola** kaymışsa **sol yönlüdür**. **KAF ve San Andreas sağ yönlü, DAF sol yönlüdür.** 💡 Hangi taraftan bakarsan bak cevap aynı çıkar."}, {"t": "Horst ve graben", "b": "**Graben**: iki yanı normal faylarla sınırlı, **aşağı düşmüş çöküntü** alanı (Büyük ve Küçük Menderes ovaları). **Horst**: iki yanı normal faylarla sınırlı, **yükselmiş** alan — graben ovalarını ayıran dağ sıraları. Ege'nin doğu–batı uzanan ova-dağ dizilimi bu mekanizmanın ürünüdür."}, {"t": "Aktif (diri) fay", "b": "**Son 11.000 yıl (Holosen)** içinde deprem üretmiş ve/veya yüzey faylanmasına neden olmuş, **gelecekte de deprem üretme potansiyeli** taşıyan faydır. Nükleer santral gibi kritik yapılar için bu süre **500.000 yıla** kadar uzatılabilir."}, {"t": "Yüzey kırığı eşiği", "b": "Türkiye'de diri faylar üzerinde **yüzey faylanması** oluşturan depremler genellikle **M 6,0'ın üzerinde** ve **20 km'den sığdır**. 💡 Sınav eşiği: M > 6,0 ve derinlik < 20 km."}, {"t": "Aktif fayın arazideki izleri", "b": "Aktif fay dört veri grubuyla tanınır: **morfolojik izler** (çizgisel vadiler, ani diklikler), **ötelenmiş genç çökeller** (kaymış dere yatakları), **sismolojik** ve **jeodezik-arkeolojik** veriler. MTA diri fay haritası bu belirteçlere göre hazırlanmıştır."}, {"t": "Paleosismoloji", "b": "Fay üzerinde **hendek açıp** kesilmiş toprak katmanlarını tarihlendirerek fayın **yaklaşık 40.000 yıllık** deprem geçmişini okur. **En büyük deprem büyüklüğü, tekrarlanma periyodu ve kırılma uzunluğu** gibi tehlike hesabının temel girdilerini verir; diri fay araştırmalarında **zorunludur**."}, {"t": "Tekrarlanma periyodu", "b": "Bir fayın belirli büyüklükte depremi **ortalama kaç yılda bir** ürettiğidir. **Kesin bir takvim değil, istatistiksel ortalamadır** — depremler düzenli aralıklarla gelmez."}, {"t": "Fay geçmiyorsa güvende miyim?", "b": "**Hayır.** Sarsıntı yüzlerce km yayılır, **gömülü faylar** haritada görünmez, **kötü zemin** sarsıntıyı büyütür ve asıl belirleyici **bina kalitesidir**. 💡 Doğru soru: 'Altımdan fay geçiyor mu?' değil, 'Binam hangi yönetmeliğe göre, hangi zeminde yapıldı?'"}, {"t": "Türkiye neden deprem ülkesi?", "b": "Türkiye **Alp-Himalaya kuşağı** üzerindedir; topraklarının yaklaşık **%96'sı** deprem kuşağındadır. **Arap levhası** kuzeye ilerleyip **Avrasya levhasına** çarpar; arada sıkışan **Anadolu bloğu kiraz çekirdeği gibi batıya kaçar** (yılda ~2 cm)."}, {"t": "Kuzey Anadolu Fay Zonu", "b": "**Sağ yönlü doğrultu atımlı, ~1200 km.** Doğuda **Karlıova'dan** başlar, Karadeniz'e paralel ilerleyip Marmara ve Ege'ye ulaşır. Dünyanın en önemli iki fay zonundan biridir; diğeri (San Andreas) de sağ yönlüdür."}, {"t": "Doğu Anadolu Fay Zonu", "b": "**Sol yönlü doğrultu atımlı, ~700 km.** Karlıova'dan başlar; Elazığ, Adıyaman, Kahramanmaraş ve Hatay'dan geçer. **6 Şubat 2023 Pazarcık depremi bu zon üzerinde** oldu. 💡 KAF sağ-1200, DAF sol-700; ikisi **Karlıova'da (Bingöl)** birleşir."}, {"t": "KAF'ın domino dizisi", "b": "**1939 Erzincan'dan** sonra KAF **batıya doğru adım adım** kırıldı: 1942 Niksar-Erbaa, 1943 Tosya-Ladik, 1944 Gerede... 1999 Gölcük ve Düzce. Kırılmamış bölüm **Marmara Denizi içindedir** — İstanbul deprem beklentisinin kaynağı budur."}, {"t": "Dünyanın en büyük depremleri", "b": "İlk beş: **1960 Şili M 9,5** (kaydedilmiş en büyük), 1964 Alaska 9,2, 2004 Sumatra 9,1, 2011 Sendai 9,1, 1952 Kamçatka 9,0. **Tamamı okyanus altı yitim zonlarındadır.** Türkiye'de yitim zonu olmadığından M 9 beklenmez; üst sınır ~M 7,5–8'dir."}, {"t": "Türkiye'nin deprem tarihi", "b": "Aletsel dönemin **en büyük depremi 1939 Erzincan (M 7,9, ~33.000 can kaybı)**; **en ağır can kaybı 6 Şubat 2023'tedir**. **1999** İzmit (M 7,4) ve Düzce (M 7,2) depremlerinde toplam **18.373** can kaybı — bu deprem **DASK, yapı denetimi ve UMKE'yi** doğuran dönüm noktasıdır. 1900'den bu yana toplam kayıp **150.000'i** aşar."}, {"t": "6 Şubat 2023: iki ana şok", "b": "**04.17 Pazarcık Mw 7,7** (DAFZ Narlı segmenti) ve aynı gün **13.24 Elbistan Mw 7,6** (**Çardak fayı**). **11 il** etkilendi; **53.537 can kaybı, 107.213 yaralı** — aletsel dönemin en ağır afeti. 20 Şubat'ta Hatay Yayladağı'nda Mw 6,4 tetiklenmiş deprem izledi."}, {"t": "Elbistan neden artçı değil?", "b": "Artçı, ana şokla **aynı fay sisteminde** ve **belirgin şekilde küçük** (genellikle 1 derece) olur; 7,7'nin artçısı ~6,7 olurdu. Elbistan **farklı fayda** ve **neredeyse eşit büyüklükteydi** — ilk depremin gerilme alanını değiştirmesiyle **tetiklenmiş ayrı bir ana şoktur**."}, {"t": "2023 neden bu kadar ağır?", "b": "**Risk = Tehlike × Maruziyet × Kırılganlık.** Dev tehlike (iki Mw 7,6+ deprem, ~300 km yüzey kırığı), gece **04.17** ve kış koşulları, 11 ilde yoğun nüfus (maruziyet) ve eski yönetmelikli yapı stoku (kırılganlık) aynı anda birleşti. 💡 Maruziyet ve kırılganlık insan kararlarının ürünüdür."}, {"t": "Deprem bölgesi haritası tarih oldu", "b": "1996'nın **beş bölgeli haritası** 2018'de kalktı; yerine **Türkiye Deprem Tehlike Haritası** geldi: her adres için **noktasal PGA (en büyük yer ivmesi)** değeri (tdth.afad.gov.tr). **TBDY-2018** yönetmeliği bu haritaya dayanır. 💡 Artık 'kaçıncı derece bölge?' değil, 'adresimin ivme değeri kaç?' diye sorulur."}, {"t": "İkincil afet", "b": "Bir afetin etkisi veya tetiklemesiyle oluşan **yeni afetlerdir**: yangın, heyelan, baraj yıkılması, patlama, **salgın hastalık**, endüstriyel kaza. Sarsıntı **geçicidir** (saniyeler–dakikalar); sıvılaşma ve yamaç kayması gibi zemin deformasyonları **kalıcıdır**. Bazen asıl can kaybı ikincil afetten gelir (2011 Japonya: tsunami)."}, {"t": "Zemin sıvılaşması", "b": "**Sığ, suya doygun kumlu** zeminde sarsıntı taneler arası teması zayıflatır, **boşluk suyu basıncı yükselir**, zemin **taşıma gücünü kaybeder** ve sıvı gibi davranır. Sonuç: **bina yıkılmadan yan yatar veya devrilir** — Adapazarı 1999 en bilinen örnektir. 💡 Islak kumsalda ayağını hızla oynattığında gömülmesi = küçük ölçekli sıvılaşma."}, {"t": "Tsunami: 20 kat ölümcül", "b": "Yer hareketinden etkilenen her 1000 kişiden **4'ü**, tsunamiden etkilenen her 1000 kişiden **79'u** hayatını kaybeder. **1 metre derinlikteki hızlı akan su bir insanı öldürebilir** — dalganın yüksek olması gerekmez. Karadakiler **yükseğe**, teknedekiler **açık denize** gitmelidir. Türkiye'de de risk **vardır**: Marmara'nın yanal atımlı fayı doğrudan tsunami üretmese de tetiklenen **deniz altı heyelanları** kaynak olabilir."}, {"t": "NaTech", "b": "**Doğa olayının tetiklediği teknolojik kaza** (Natural Hazard Triggered Technological Accident). Örnekler: 2011 **Fukushima** nükleer sızıntısı, 1995 Kobe yangınları, Türkiye'de **2023 İskenderun Limanı** konteyner yangını."}, {"t": "Depremin sağlık takvimi", "b": "**İlk 72 saat:** travma ve crush sendromu. **Sonraki haftalar:** kronik tedavi kesintileri (diyaliz, insülin) ve çevre sağlığı. **Aylar:** ruh sağlığı (akut stres, TSSB). 💡 Deprem bir an değil, bir süreçtir; sağlık planlaması tamamına göre yapılır."}, {"t": "Crush (ezilme) sendromu", "b": "Uzun süre baskı altında kalan kasın yıkılması (**rabdomiyoliz**) ile **potasyum, miyoglobin ve fosfat** kana karışır: **hiperkalemi** ölümcül ritim bozukluğu yapar (en acil bileşen), **miyoglobin** böbrek tübüllerini tıkayıp **akut böbrek hasarı** yapar. 💡 Üçlü: rabdomiyoliz + hiperkalemi + akut böbrek hasarı; enkaz süresi uzadıkça risk artar."}, {"t": "Kurtarma ölümü", "b": "Enkaz baskısı, kas yıkım ürünlerinin dolaşıma geçişini de engeller; **baskı kalktığı anda** potasyum ve miyoglobin birden dolaşıma karışır ve **konuşarak çıkan hasta dakikalar içinde kötüleşebilir**. Bu yüzden mümkünse **enkazdan çıkarılmadan ÖNCE damar yolu açılıp sıvı tedavisi** başlanır. 💡 Enkazdan çıkmak, kurtulmak demek değildir."}, {"t": "ÇÖK-KAPAN-TUTUN", "b": "Deprem sırasında içerideysen: bulunduğun zemine **ÇÖK**, kendini koruyacak şekilde **KAPAN**, sağlam bir masaya **TUTUN**. Merdivene/asansöre koşma, sarsıntı sırasında dışarı çıkma — çoğu yaralanma **kaçarken düşen cisimlerden** olur. 'Üçgen alan' önerisi uluslararası kabul görmez."}, {"t": "Deprem çantası: en az 10 gün", "b": "**Su, dayanıklı gıda, el feneri, DÜDÜK**, ilk yardım, **kullanılan ilaçların 10 günlük stoğu + tanı/ilaç/alerji notu**, kimlik fotokopisi ve **nakit para**. 💡 Düdük, bağırmaktan çok daha az enerjiyle çok daha uzağa ulaşır. Aile planı: buluşma noktası + **bölge dışından** irtibat kişisi."}]}, {"title": "Deprem ve Binalar: Yapısal Hasar Nedenleri ve Dirençli Sağlık Tesisi", "desc": "Düşey/yatay yük, temel ve üst yapı elemanları, güçlü kolon–zayıf kiriş, planda ve düşey düzensizlikler, yapısal kusurlar, kullanıcı kaynaklı hasarlar, yapısal olmayan risk, HAP ve TBDY-2018", "short": "Deprem-Bina", "questions": [{"q": "Bir bina düşey yükü mükemmel taşıdığı hâlde depremde neden yıkılabilir?", "opts": [{"t": "Binalar öncelikle yatay yük için tasarlanır; deprem ise düşey kuvvet uygular"}, {"t": "Deprem yalnızca temeli etkiler, üst yapıya kuvvet aktarmaz"}, {"t": "Deprem sırasında binanın kendi ağırlığı birkaç kat artar"}, {"t": "Deprem yalnızca dolgu duvarları zorlar, taşıyıcılar etkilenmez"}, {"t": "Binalar öncelikle düşey yük için tasarlanır; deprem ise yatay kuvvet uygular"}], "a": 4, "exp": "Binalar kendi ağırlığı, insan, eşya ve kar gibi **düşey yükler** için hesaplanır. Deprem (ve rüzgâr) ise binaya **yatay yük** uygular; bu kuvvet kolonları **eğmeye, kesmeye ve burkulmaya** zorlar.\nYatay yüke göre tasarlanmamış bina, düşey yükü kusursuz taşısa bile depremde yıkılabilir. Deprem güvenliği = yatay yüke direnme kapasitesi."}, {"q": "Depreme dayanıklı bir binanın sahip olması gereken üç özellikten \"şekil değiştirmeye direnç\" olarak tanımlanan hangisidir?", "opts": [{"t": "Dayanım"}, {"t": "Süneklik"}, {"t": "Rijitlik"}, {"t": "Aderans"}, {"t": "Eksantrisite"}], "a": 2, "exp": "Kaynaktaki üçlü: **Dayanım** = kuvvete direnç, **rijitlik** = şekil değiştirmeye direnç, **süneklik** = kırılmadan şekil değiştirebilme. Depreme dayanıklı bina üçüne birden sahiptir.\nAderans beton–donatı yapışması, eksantrisite ise kütle ve rijitlik merkezleri arasındaki kaçıklıktır.\n💡 D-R-S: Dayan, Rijit dur, Sünek eğil."}, {"q": "'Pancake' tipi göçme (katların üst üste yığılması) için hangisi doğrudur?", "opts": [{"t": "Sünek davranışın sonucudur; bina çatlayarak yavaşça çöker"}, {"t": "Gevrek davranışın sonucudur ve enkaz altında yaşam boşluğu neredeyse bırakmaz"}, {"t": "Enkaz altında geniş yaşam boşlukları bıraktığı için kurtarma şansı yüksektir"}, {"t": "Yalnızca radye temelli binalarda görülür"}, {"t": "Güçlü kolon – zayıf kiriş ilkesine uyulan binalarda görülür"}], "a": 1, "exp": "Gevrek bina uyarı vermeden bir anda göçer; **pancake** tipi göçmeler bunun sonucudur ve enkaz altında **yaşam boşluğu bırakmaz**, yani arama-kurtarma şansını da düşürür.\nZayıf kolonlu (güçlü kiriş – zayıf kolon) binalar bu göçme biçimini üretir.\n💡 AYAY köprüsü: göçme tipi → yaşam boşluğu → kurtarma olasılığı."}, {"q": "Hangi temel türü, binanın oturduğu alanı boydan boya kaplayan betonarme bir plaktır ve zayıf zeminler için en uygun temel olarak verilir?", "opts": [{"t": "Tekil temel"}, {"t": "Sürekli temel"}, {"t": "Kazıklı temel"}, {"t": "Radye temel"}, {"t": "Bağ kirişli pabuç temel"}], "a": 3, "exp": "**Radye temel**: binanın oturduğu alanı boydan boya kaplayan betonarme plak; kirişli ve kirişsiz olarak ikiye ayrılır, güvenlik açısından **kirişli radye** daha uygundur. Zayıf zeminler için en uygundur.\nTekil temel sağlam zeminli az katlı binada, kazıklı temel ise çok zayıf zeminde (derin temel) kullanılır."}, {"q": "Zemin zayıfladıkça tercih edilen temel türlerinin doğru sıralaması hangisidir?", "opts": [{"t": "Kazıklı → radye → sürekli → tekil"}, {"t": "Tekil → radye → sürekli → kazıklı"}, {"t": "Tekil → sürekli → radye → kazıklı"}, {"t": "Sürekli → tekil → kazıklı → radye"}, {"t": "Radye → tekil → sürekli → kazıklı"}], "a": 2, "exp": "Mantık: zemin ne kadar zayıfsa yükü o kadar geniş bir alana yaymak gerekir. **Tekil** temel yükü noktalara, **sürekli** temel birden fazla taşıyıcıya, **radye** bütün yüzeye yayar; **kazıklı** temel ise sağlam zemine kadar iner.\n💡 \"Zemin zayıfladıkça temel büyür.\""}, {"q": "Sıvılaşma riski olan bir zeminde tekil temelle bina yapılması, kaynakta hangi görüntülerin \"reçetesi\" olarak anılır?", "opts": [{"t": "1999 Adapazarı'nda binaların yan yatması"}, {"t": "2004 Konya'da Zümrüt Apartmanı'nın çökmesi"}, {"t": "2011 Van'da perdeli binaların ayakta kalması"}, {"t": "2003 Bingöl'de kolonlarda X biçimli çatlaklar"}, {"t": "1998 Adana'da düşük kaliteli beton hasarı"}], "a": 0, "exp": "Ders notunda: sıvılaşma riski olan zeminde tekil temel, **Adapazarı 1999**'daki **yan yatma** görüntülerinin reçetesidir. Bu yüzden **zemin etüdü yasal zorunluluktur**.\nZümrüt Apartmanı köşe kolon, Van perde, Bingöl kısa kolon, Adana düşük beton kalitesi örneğidir."}, {"q": "\"Bir kenarı diğerinin en az yedi katı olan, minimum boyutu 25 cm × 175 cm\" olan düşey taşıyıcı hangisidir?", "opts": [{"t": "Perde"}, {"t": "Kolon"}, {"t": "Kiriş"}, {"t": "Döşeme"}, {"t": "Guse"}], "a": 0, "exp": "**Perde** özel bir kolon türüdür: bir kenarı diğerinin en az **7 katı**, minimum **25 × 175 cm**. Rijit olduğu için deprem yükünü üzerine çeker ve kolonları korur.\nKolon düşey taşıyıcıdır ama böyle bir en-boy oranı yoktur; kiriş ve döşeme yatay elemanlardır."}, {"q": "Kitaptaki \"Perde süngerdir\" uyarısı neyi anlatır?", "opts": [{"t": "Esnekliği sayesinde deprem enerjisini emer ve yükü kolonlara iletir"}, {"t": "Rijitliği sayesinde deprem yükünü üzerine çekip kolonları korur"}, {"t": "Perde taşıyıcı olmadığı için depremde kolayca hasar alır"}, {"t": "Perde nemi emerek donatı korozyonunu önler"}, {"t": "Perde, kirişlerden önce hasar alarak yıkımı geciktirir"}], "a": 1, "exp": "Perde çok **rijit** olduğu için bina az ötelenir; öteleme azaldıkça kolon ve kirişler daha az zorlanır. Perde kendi yükünün yanında komşularının yükünün bir kısmını da üstlenir.\n**2011 Van** depreminde perdeleri sayesinde ayakta kalan binalar kitapta fotoğraflanmıştır; perdeli bina perdesize göre belirgin avantajlıdır."}, {"q": "Deprem yükleri nedeniyle en az hasar alan taşıyıcı eleman hangisidir?", "opts": [{"t": "Döşeme"}, {"t": "Kolon"}, {"t": "Perde"}, {"t": "Kiriş"}, {"t": "Köşe kolon"}], "a": 0, "exp": "**Döşeme** üzerindeki yükü kirişlere aktarır ve deprem nedeniyle en az hasar alan taşıyıcı elemandır; ancak **süreksizlikleri** (büyük boşluklar) yük dağılımını bozar (A2 düzensizliği)."}, {"q": "Betonarme karkas sistemde yükün taşınma sırası hangisinde doğru verilmiştir?", "opts": [{"t": "Duvar → kolon → kiriş → döşeme → temel"}, {"t": "Döşeme → duvar → kolon → kiriş → temel"}, {"t": "Kiriş → döşeme → duvar → kolon → temel"}, {"t": "Duvar → döşeme → kiriş → kolon/perde → temel"}, {"t": "Duvar → kiriş → temel → döşeme → kolon"}], "a": 3, "exp": "Kaynak: duvarları kiriş ve döşemeler, **döşemeleri kirişler**, **kirişleri kolon ve perdeler** taşır; kolonlar yükü **temele** aktarır.\n**Betonarme karkas**: taşıyıcılığı kolon-kiriş çerçevesinin üstlendiği, duvarların yük taşımadığı sistem; Türkiye'nin en yaygın bina tipidir. Kirişler kolonları bağlayarak çerçeve oluşturur ve aks boyunca sürekli olmalıdır."}, {"q": "Duvar türleriyle ilgili ifadelerden hangileri doğrudur?\nI. Tuğla veya gazbeton dolgu duvar taşıyıcı değildir.\nII. Perde, betonarme bir taşıyıcı elemandır.\nIII. Betonarme karkas sistemde dolgu duvarlar binanın asıl yük taşıyan elemanlarıdır.", "opts": [{"t": "Yalnız I"}, {"t": "Yalnız III"}, {"t": "I ve II"}, {"t": "II ve III"}, {"t": "I, II ve III"}], "a": 2, "exp": "Halk arasında \"duvar\" ile \"**perde duvar**\" karıştırılır. **Dolgu duvar** (tuğla, gazbeton) taşıyıcı değildir, yalnızca bölme işlevi görür; **perde** ise betonarme bir taşıyıcıdır. III yanlıştır: karkas sistemde duvarlar yük taşımaz.\nBu ayrım kullanıcı kaynaklı hasarlarda kritiktir: perde kaldırılırsa binanın rijitliği yok olur."}, {"q": "Yönetmeliğe göre betonarme bir binada depremde hasarın önce hangi elemanda oluşması istenir?", "opts": [{"t": "Kolonda; kiriş ayakta kalmalıdır"}, {"t": "Kolon ve kirişte eşit oranda"}, {"t": "Temelde; üst yapı korunmalıdır"}, {"t": "Perdede; kolonlar korunmalıdır"}, {"t": "Kirişte; kolon ayakta kalmalıdır"}], "a": 4, "exp": "**Güçlü kolon – zayıf kiriş** ilkesi: kiriş hasar alırsa o kattaki bir açıklık zarar görür, bina ayakta kalır; **kolon** hasar alırsa üzerindeki **bütün katlar çöker**. Kirişteki hasar enerji yutar, yıkımı geciktirir ve bina uyarı verir.\n💡 Masa benzetmesi: tabla çatlarsa masa ayakta kalır, bacak kırılırsa masa çöker."}, {"q": "\"Güçlü kolon – zayıf kiriş\" ilkesindeki \"zayıf kiriş\" ifadesinin doğru yorumu hangisidir?", "opts": [{"t": "Kiriş mümkün olan en düşük kaliteli malzemeyle yapılmalıdır"}, {"t": "Kirişlerde etriye kullanılmasına gerek yoktur"}, {"t": "Kiriş kesiti her zaman kolon kesitinden büyük tutulmalıdır"}, {"t": "Kiriş yeterince güçlü olmalı, ama kolondan güçlü olmamalı"}, {"t": "Kirişler yalnızca düşey yüke göre hesaplanmalıdır"}], "a": 3, "exp": "\"Zayıf kiriş\" \"kötü kiriş\" demek değildir; **göreli** bir ilkedir. Doğrusu: sağlam kirişler ve onlardan **daha sağlam kolonlar**.\nTürkiye'deki eski binalarda tersi vardır: kirişler kolonlardan büyük kesitli ve kuvvetli donatılıdır (**güçlü kiriş – zayıf kolon**); kolonlar büyük kesme kuvvetiyle hasar görür ve bina göçer. Nedeni mimari kaygılar (geniş açıklık, ince kolon, sarkan kiriş istememe) ve maliyettir."}, {"q": "Aşağıdakilerden hangisi bir planda (kuşbakışı görülen) düzensizliktir?", "opts": [{"t": "Yumuşak kat"}, {"t": "Zayıf kat"}, {"t": "Taşıyıcı sistem süreksizliği"}, {"t": "Kısa kolon problemi"}, {"t": "Döşeme süreksizliği"}], "a": 4, "exp": "**Planda düzensizlikler** binaya yukarıdan bakınca görülür: burulma (A1), **döşeme süreksizliği (A2)**, planda çıkıntı (A3).\n**Düşey düzensizlikler** yandan bakınca görülür: zayıf kat (B1), yumuşak kat (B2), taşıyıcı sistem süreksizliği (B3). Kısa kolon yönetmelik düzensizliği değil, uygulamada sık görülen bir yapısal kusurdur.\n💡 A = Aşağı bak (kuşbakışı plan), B = Boy (yükseklik)."}, {"q": "Kaynağa göre deprem açısından en iyi bina hangisidir?", "opts": [{"t": "L, T veya U planlı, girintili-çıkıntılı bina"}, {"t": "Üst katları alt katlardan geniş (çıkmalı) bina"}, {"t": "Planda ve yükseklikte basit ve simetrik olan bina"}, {"t": "Zemin katı diğer katlardan yüksek bina"}, {"t": "Perdeleri yalnızca bir cephede toplanmış bina"}], "a": 2, "exp": "Genel ilke: en iyi bina **planda ve yükseklikte basit ve simetrik** olandır. Karmaşıklık hesabın gerçekçiliğini azaltır ve riski artırır.\nÇeldiricilerin her biri bir düzensizliği/kusuru tarif eder: planda çıkıntı (A3), ağır çıkma, yumuşak kat, burulma."}, {"q": "Binanın kütle merkezi ile rijitlik merkezi arasındaki kaçıklığa ne ad verilir?", "opts": [{"t": "Göreli kat ötelemesi"}, {"t": "Eksantrisite"}, {"t": "Farklı oturma"}, {"t": "Aderans"}, {"t": "Burkulma"}], "a": 1, "exp": "**Burulma (A1)** düzensizliği, kütle merkezi ile rijitlik merkezinin çakışmaması sonucu binanın deprem sırasında dönmeye zorlanmasıdır; iki merkez arasındaki kaçıklık **eksantrisite**dir.\n**Göreli kat ötelemesi** bir katın hemen altındaki kata göre yatay kaymasıdır."}, {"q": "Yönetmeliğe göre burulma (A1) düzensizliğinin ölçütü hangisidir?", "opts": [{"t": "Bir kattaki en büyük göreli kat ötelemesinin ortalama ötelemeye oranının 1,2'yi aşması"}, {"t": "Bir kattaki en büyük göreli kat ötelemesinin ortalama ötelemeye oranının 2'yi aşması"}, {"t": "Bir katın ortalama göreli ötelenmesinin üst kattakine oranının 1,2'yi aşması"}, {"t": "Boşluk alanları toplamının kat brüt alanının 1/3'ünü aşması"}, {"t": "Çıkıntıların iki doğrultuda da plan boyutunun %20'sini aşması"}], "a": 0, "exp": "**A1 burulma**: en büyük / ortalama göreli kat ötelemesi > **1,2**.\nKarıştırılanlar: **B2 yumuşak kat** = bir katın ortalama göreli ötelenmesinin üst/alt kata oranı > **2**; **A2** = boşluk > **1/3**; **A3** = çıkıntı iki doğrultuda > **%20**.\n💡 Sayı kodu: burulma **1,2** — yumuşak kat **2** — döşeme **1/3** — çıkıntı **%20**."}, {"q": "Köşe parseldeki bir binanın iki cephesi boydan boya camekân, diğer iki cephesi perde duvarlıdır. Bu binada öncelikle hangi düzensizlik beklenir?", "opts": [{"t": "Döşeme süreksizliği"}, {"t": "Burulma düzensizliği"}, {"t": "Planda çıkıntı"}, {"t": "Taşıyıcı sistem süreksizliği"}, {"t": "Yetersiz deprem derzi"}], "a": 1, "exp": "Rijit (perdeli) taraf az, esnek (camekânlı, ince kolonlu) taraf çok hareket eder; bina bir **kapı gibi** rijit tarafın etrafında döner ve esnek taraftaki kolonlar aşırı zorlanır. Köşe parsellerdeki binalar bu yüzden sık sık **burulma** düzensizliği taşır.\nÇözüm: kolon ve perdeler rijitliği dengeleyecek şekilde dağıtılmalı, perdeler bir tarafa yığılmamalıdır."}, {"q": "Merdiven ve asansör boşlukları dâhil, bir kattaki boşluk alanları toplamı kat brüt alanının ne kadarını aşarsa döşeme süreksizliği (A2) vardır?", "opts": [{"t": "1/3"}, {"t": "1/4"}, {"t": "1/2"}, {"t": "%20"}, {"t": "2/3"}], "a": 0, "exp": "**A2 döşeme süreksizliği**: boşluklar toplamı **kat brüt alanının 1/3'ünü** aşarsa. Ayrıca yerel döşeme boşlukları ve döşemenin rijitlik/dayanımında ani azalmalar da bu düzensizliği oluşturur. **Brüt kat alanı**: duvar ve boşluklar dâhil toplam alan.\n%20 ölçütü planda çıkıntıya (A3) aittir.\n💡 Döşeme 1/3, çıkıntı %20."}, {"q": "Döşemenin deprem sırasında \"diyafram\" olarak çalışması ne anlama gelir?", "opts": [{"t": "Bina yükünü geniş bir alana yayarak zemine aktarır"}, {"t": "Düzlemi içinde rijit çalışıp deprem kuvvetini kolon-perdelere dağıtması"}, {"t": "Boyuna donatıları sararak burkulmayı engeller"}, {"t": "İki bina arasında çarpışmayı önleyen boşluğu oluşturur"}, {"t": "Kolondan önce hasar alarak deprem enerjisinin büyük kısmını yutar"}], "a": 1, "exp": "Döşeme kendi düzlemi içinde **rijit bir diyafram** gibi çalışır: deprem kuvvetini toplar ve kolon-perdelere dağıtır. Büyük boşluk varsa bu işlev bozulur — delik deşik bir tepsinin yükü düzgün taşıyamaması gibi. Bu yüzden A2'nin sakıncası, yüklerin taşıyıcılar arasında düzenli dağılamamasıdır."}, {"q": "Planda çıkıntı (A3) düzensizliği için hangisi doğrudur?", "opts": [{"t": "Çıkıntının yalnızca bir doğrultuda plan boyutunun %20'sini aşması yeterlidir"}, {"t": "Çıkıntıların iki doğrultuda da plan boyutunun 1/3'ünü aşması gerekir"}, {"t": "Çıkıntı alanının kat brüt alanının %20'sini aşması yeterlidir"}, {"t": "Yalnızca dairesel planlı binalarda tanımlanır"}, {"t": "Çıkıntılar iki dik doğrultuda da plan boyutunun %20'sini aşmalıdır"}], "a": 4, "exp": "**A3**: L, T, U, H biçimli planlarda çıkıntıların **İKİ doğrultudaki** boyutlarının **her ikisinin de** toplam plan boyutunun **%20**'sini aşması. Yalnızca bir yönde uzun çıkıntı tek başına bu düzensizliği oluşturmaz.\nSakıncası: yatay kuvvetler düşey taşıyıcılara güvenle aktarılamaz, düzensiz yük dağılımı **burulma** hasarına yol açar."}, {"q": "Zayıf kat (B1) ile yumuşak kat (B2) arasındaki fark hangisinde doğru verilmiştir?", "opts": [{"t": "Zayıf kat rijitlik eksikliğini, yumuşak kat dayanım eksikliğini anlatır"}, {"t": "Zayıf kat dayanım eksikliğini, yumuşak kat rijitlik eksikliğini anlatır"}, {"t": "Zayıf kat süneklik eksikliğini, yumuşak kat aderans eksikliğini anlatır"}, {"t": "Zayıf kat planda, yumuşak kat ise düşey bir düzensizliktir"}, {"t": "İkisi uygulamada hiçbir zaman aynı binada birlikte bulunmaz"}], "a": 1, "exp": "**B1 zayıf kat** = **dayanım** eksikliği; **B2 yumuşak kat** = **rijitlik** eksikliği. İkisi de düşey düzensizliktir, aynı görüntüye yol açar ve uygulamada çoğunlukla aynı binada birlikte bulunur.\nTürkiye'de bu kat neredeyse her zaman **zemin kat**tır.\n💡 Yumuşak = esnek (rijitlik), zayıf = güçsüz (dayanım)."}, {"q": "Bir katın ortalama göreli ötelenmesinin üst veya alt katınkine oranı kaçtan büyükse o kat yumuşak kat (B2) sayılır?", "opts": [{"t": "1,2"}, {"t": "2"}, {"t": "1/3"}, {"t": "%20"}, {"t": "3"}], "a": 1, "exp": "**Yumuşak kat (B2)** ölçütü: oran **> 2**. Yanal yüklerin etkisiyle aşırı ötelenerek hasar görür.\n**1,2** burulma (A1), **1/3** döşeme süreksizliği (A2), **%20** planda çıkıntı (A3) ölçütüdür."}, {"q": "Zemin katı boydan boya camekânlı dükkân olan, giriş katı diğer katlardan yüksek ve üst katları tuğla duvarlı bir apartman için en doğru değerlendirme hangisidir?", "opts": [{"t": "Yumuşak kat riski vardır; deprem enerjisi zemin kata boşalır ve o kat ezilebilir"}, {"t": "Burulma riski vardır; bina rijit cephe etrafında döner"}, {"t": "Döşeme süreksizliği vardır; yük döşemede dağılamaz"}, {"t": "Kısa kolon riski vardır; X biçimli çatlaklar üst katlarda oluşur"}, {"t": "Risk yoktur; dolgu duvarlar taşıyıcı olmadığından katlar arası fark önemsizdir"}], "a": 0, "exp": "**Pratik refleks**: zemin katı camekân + üst katlar tuğla duvarlı = **yumuşak kat** riski. Üst katlar duvarları sayesinde rijit blok gibi hareket eder, tüm göreli öteleme esnek zemin katta toplanır; üst katlar neredeyse hasarsız kalırken zemin kat tamamen ezilir (\"üstü sağlam, altı yok olmuş\" görüntüsü).\n2023 depremlerinde bu tipoloji yaygın gözlenmiştir. Yumuşak kat bir inşaat hatası kadar **kentsel kullanım** (dükkân talebi) sorunudur; çözüm imar politikasındadır."}, {"q": "Türkiye'de yumuşak katın neredeyse hep zemin katta görülmesinin nedenleri arasında aşağıdakilerden hangisi yer almaz?", "opts": [{"t": "Zemin kat cephelerinde dolgu duvar yerine camekân yapılması"}, {"t": "Zemin katın işyeri olarak kullanılması"}, {"t": "Üst katların duvarları sayesinde rijit bir blok gibi hareket etmesi"}, {"t": "Göreli ötelemenin zemin katta toplanması"}, {"t": "Zemin katın diğer katlardan daha alçak yapılması"}], "a": 4, "exp": "Zemin kat **daha alçak değil, daha yüksek** yapılır: kolon uzadıkça daha esnek davranır ve daha çok ötelenir.\nÜç neden: (1) **camekân etkisi** (işyeri kullanımı, duvarın rijitlik katkısı yok), (2) **yüksek giriş katı**, (3) **rijitlik farkı** (üst katlar rijit blok, öteleme zeminde toplanır). Sınavda üçü de aranır; yalnızca \"camekân\" demek yarım cevaptır.\n💡 \"Bodrum değil, dükkân çöker\": Camekân – Yükseklik – Rijitlik farkı."}, {"q": "Kısa kolon neden tehlikelidir?", "opts": [{"t": "Kısaldıkça esnekleşir, bu nedenle depremde aşırı ötelenerek hasar alır"}, {"t": "Kısa kolon düşey yükü taşıyamayacak kadar incelir"}, {"t": "Kısa kolonda boyuna donatı hızla korozyona uğrar"}, {"t": "Kısa kolon binanın kütle merkezini yukarı kaydırır"}, {"t": "Kısaldıkça rijitleşip kesme kuvvetinin büyük kısmını üzerine çeker"}], "a": 4, "exp": "**Kısa kolon**: kolonun serbest boyunun dolgu duvar veya yapı elemanları nedeniyle kısalması. Kısalan kolon komşularından **daha rijit** olur, **kesme kuvvetinin** büyük kısmını çeker ve ağır hasar alır.\n💡 İki cetvel: uzun olan kolayca bükülür, kısa olan direnir — ve direndiği için kuvveti üzerine alıp kırılır."}, {"q": "Hasar tespiti yapılan bir okulun bodrum katında, dolgu duvarın üst kısmında uzun yatay havalandırma penceresi bulunan bir kolonda X biçimli çatlaklar görülüyor. En olası kusur hangisidir?", "opts": [{"t": "Kısa kolon problemi"}, {"t": "Köşe kolon problemi"}, {"t": "Saplama kiriş problemi"}, {"t": "Yetersiz deprem derzi"}, {"t": "Farklı oturma"}], "a": 0, "exp": "Duvarın üstünde bırakılan **bant pencere**, kolonun yalnızca üst kısmını serbest bırakır → **kısa kolon**. **X biçimli kesme çatlakları** sahada kısa kolonun imzasıdır. En yaygın örnekleri okullar ve bodrum katlarıdır.\n1 Mayıs **2003 Bingöl** ve **2011 Van** depremlerinde bu problemle hasar gören çok sayıda bina saptanmıştır. Çözüm: kısa kolonlar kat yüksekliğince **sık etriye** ile sarılmalıdır. Kısa kolon çoğunlukla projede yoktur; uygulama ve denetim eksikliğidir."}, {"q": "2004'te Konya'da hiçbir deprem olmadan kendi ağırlığı altında çöken Zümrüt Apartmanı'nda hangi problemin bulunduğu bilinmektedir?", "opts": [{"t": "Kısa kolon problemi"}, {"t": "Yetersiz deprem derzi"}, {"t": "Köşe kolon problemi"}, {"t": "Yıkanmamış deniz kumu kullanımı"}, {"t": "Burulma düzensizliği"}], "a": 2, "exp": "**Köşe kolon problemi**, salonun köşede olduğu binalarda tavanda sarkan kiriş istenmemesinden doğar; deprem yüklerinin diğer kolonlara aktarımı zorlaşır, o bölge esnek davranır ve köşe kolon uçları zarar görür. **Yalnızca düşey yükler altında bile** yıkıma neden olabilir — Zümrüt Apartmanı (Konya, 2004) bunun örneğidir."}, {"q": "Kirişin kolona değil başka bir kirişe oturtulmasıyla ortaya çıkan kusura ne ad verilir?", "opts": [{"t": "Yapışık kiriş problemi"}, {"t": "Güçlü kiriş – zayıf kolon problemi"}, {"t": "Kısa kolon problemi"}, {"t": "Saplama kiriş problemi"}, {"t": "Konsol kiriş problemi"}], "a": 3, "exp": "**Saplama kiriş**: kirişin kolona değil başka bir kirişe oturması. **Yapışık kiriş**: cephe duvarını kolonların dışına çizme alışkanlığından doğar. İkisi de **çerçeve süreksizliğidir**: yükler kolonlara gitmek yerine bina içinde dolanır, saplandığı kirişte hesaba katılmamış **burulma momenti ve kesme kuvveti** oluşur.\nÇözüm: tüm kirişler kolonlara oturtulmalı; kaçınılmazsa saplama bölgesi sık etriyeyle sarılmalı. Kitapta 1999 Kocaeli'de yıkılan, neredeyse tümüyle saplama kirişli bir binanın kalıp planı gösterilir."}, {"q": "Etriye uçlarının kaç derecelik açıyla içe bükülmesi gerekir?", "opts": [{"t": "90 derece"}, {"t": "45 derece"}, {"t": "135 derece"}, {"t": "120 derece"}, {"t": "180 derece"}], "a": 2, "exp": "Etriye uçları **135°** içe bükülür, böylece betonu içeriden kavrar. **90°** bükülen etriyenin ucu betonun dış yüzeyine yakın kalır; depremde pas payı dökülünce açılır ve kolonu sarma işlevini kaybeder.\n💡 \"Etriye hayat kurtarır\" — 135 derece bükülmeyen etriye hiçbir işe yaramaz."}, {"q": "Etriyenin işlevleriyle ilgili ifadelerden hangileri doğrudur?\nI. Kesme çatlaklarını önler.\nII. Boyuna donatıların burkulmasını engeller.\nIII. Betonu sararak bir arada tutar ve sünek davranışı sağlar.", "opts": [{"t": "Yalnız I"}, {"t": "I, II ve III"}, {"t": "I ve II"}, {"t": "II ve III"}, {"t": "Yalnız III"}], "a": 1, "exp": "**Etriye** (deprem etriyesi), kolon ve kirişlerde **boyuna donatıyı** saran **enine donatıdır**: kesme çatlaklarını önler, boyuna donatının burkulmasını engeller, betonu sarar ve **sünek davranışı sağlayan asıl elemandır**.\nYapılmazsa kolon hasar alır, donatılar burkulur, beton dağılır; etriye yetersizliği Türkiye'deki deprem hasarlarının en yaygın nedenlerindendir."}, {"q": "Yönetmelik ölçütüne göre 15 m yüksekliğindeki bir bina için bırakılması gereken en az deprem derzi kaç mm'dir?", "opts": [{"t": "60 mm"}, {"t": "30 mm"}, {"t": "45 mm"}, {"t": "75 mm"}, {"t": "150 mm"}], "a": 0, "exp": "Ölçüt: **6 m'ye kadar en az 30 mm**, 6 m'den sonraki **her 3 m için +10 mm**.\n15 m: 30 mm + (9 m ÷ 3 = 3 dilim × 10 mm = 30 mm) = **60 mm**.\n**Deprem derzi**: bitişik binaların depremde farklı salınıp çarpışmasını önlemek için aralarında bırakılan boşluk."}, {"q": "Beton bileşiminde yıkanmamış deniz kumu kullanılmasının temel sakıncası nedir?", "opts": [{"t": "Betonu aşırı rijit yaparak kolonlarda kısa kolon etkisi oluşturması"}, {"t": "Binanın kütle merkezini yukarı kaydırması"}, {"t": "İçindeki tuz nedeniyle donatının paslanmasını hızlandırması"}, {"t": "Döşemede süreksizlik oluşturması"}, {"t": "Etriye uçlarının 90 derece bükülmesine yol açması"}], "a": 2, "exp": "**Yıkanmamış deniz kumu**, içindeki **tuz** nedeniyle donatı **korozyonunun** başlıca nedenlerindendir; Türkiye'deki eski yapı stokunun yaygın sorunudur ve 1999 sonrası tartışmalarının merkezinde yer almıştır."}, {"q": "Donatıyı koruyan beton örtüsünün (pas payı) kalınlığı kaynağa göre ne kadar olmalıdır?", "opts": [{"t": "0,5–1 cm"}, {"t": "3–5 cm"}, {"t": "1–2 cm"}, {"t": "6–8 cm"}, {"t": "10–15 cm"}], "a": 1, "exp": "**Pas payı** **3–5 cm** olmalı ve bina kullanım süresince aynı kalınlıkta korunmalıdır. Yetersizse demirler su, hava ve kimyasallarla paslanır; donatı çapı azalır ve **aderans** kaybolur."}, {"q": "Betonarmenin çalışma ilkesi ve korozyonun etkisiyle ilgili hangisi doğrudur?", "opts": [{"t": "Beton çekmeye, çelik basınca dayanıklıdır; korozyon betonun basınç dayanımını artırır"}, {"t": "Beton ve çelik birbirinden bağımsız çalışır, bu nedenle aderansın taşıyıcılıkta önemi yoktur"}, {"t": "Korozyon yalnızca donatının rengini değiştirir; taşıma gücünü ve yapışmayı etkilemez"}, {"t": "Aderans, kütle merkezi ile rijitlik merkezi arasındaki kaçıklıktır"}, {"t": "Beton basınca, çelik çekmeye dayanır; aderansla birlikte çalışırlar, korozyon bunu bozar"}], "a": 4, "exp": "Beton **basınca** dayanıklı, **çekmede** zayıftır; çelik çekmede çok güçlüdür. Birleşince her iki yüke dayanır — ama ancak **aderansla** (beton–donatı yapışması) tek malzeme gibi davranırsa. Korozyon yapışmayı bozar, sistem çözülür.\nKaçıklık = eksantrisite.\n💡 Beton basınca, çelik çekmeye dayanır; aderans ikisini tek malzeme gibi evlendirir."}, {"q": "Kaynağa göre en yaygın kullanıcı müdahalesi hangisidir?", "opts": [{"t": "Zemin katın dükkâna çevrilmesi için kolon kesilmesi"}, {"t": "Statik inceleme yapılmadan kat eklenmesi"}, {"t": "Perde duvarın kaldırılması"}, {"t": "Tesisat borularının kiriş donatıları arasından geçirilmesi"}, {"t": "Balkonun odaya katılması"}], "a": 3, "exp": "En yaygın (ve en sinsi) müdahale **tesisat borularının kiriş donatıları arasından geçirilmesidir**: kimse \"kiriş kestim\" demez, \"kombi borusu geçirdim\" der. Hiç deprem olmadan hasar almış kiriş deprem yükünü karşılayamaz.\nBu bilgiler kitapta **Anadolu Üniversitesi**'nin bina envanter (saha) çalışmasına dayanır."}, {"q": "\"Salonu büyütmek için ortadaki kolonu kestirdim\" diyen bir komşuya verilecek en doğru açıklama hangisidir?", "opts": [{"t": "Yük ortadan kalkmaz, bu yük için hesaplanmamış komşu elemanlara biner"}, {"t": "Kolon kaldırılınca bina hafifler, bu nedenle deprem güvenliği artar"}, {"t": "Kolonun yükü doğrudan dolgu duvarlara geçer, bunun bir sakıncası yoktur"}, {"t": "Tek bir kolonun kaldırılması yalnızca o dairenin döşemesini etkiler"}, {"t": "Kesilen kolonun yerine tuğla duvar örmek taşıyıcılığı tamamen geri kazandırır"}], "a": 0, "exp": "Bina **o kolon varmış gibi** hesaplanmıştır. Taşıyıcı kaldırılınca yük **komşu elemanlara** biner; onlar bu yük için tasarlanmamıştır. Mağaza, galeri ve garaja çevrilen katlarda kolon yıkılması, kiriş kesilmesi deprem güvenliğini doğrudan yok eder.\nDoğru yaklaşım: taşıyıcıyı ilgilendiren her değişiklik için **proje müellifi veya inşaat mühendisi** görüşü.\n💡 \"Taşıyıcıya dokunan her iş, mühendis onayı ister.\""}, {"q": "Bir hastanede yeni bir cihaz odası açmak için bir duvarın kaldırılması planlanıyor. Kaynağa göre doğru yaklaşım hangisidir?", "opts": [{"t": "Duvarlar karkas sistemde taşıyıcı olmadığından doğrudan kaldırılabilir"}, {"t": "Kaldırılan duvarın yerine tesisat boruları kirişlerden geçirilerek alan genişletilebilir"}, {"t": "Proje müellifi veya bir inşaat mühendisinin görüşü alınmalıdır"}, {"t": "Yalnızca hastane yönetiminin onayı yeterlidir"}, {"t": "Duvar kaldırma işlemi deprem sonrasına ertelenmelidir"}], "a": 2, "exp": "\"Duvar\" bir **perde** olabilir; taşıyıcıyı ilgilendiren her değişiklikte **proje müellifi veya inşaat mühendisi** görüşü alınmalı, tesisat ağı önceden planlanmalı ve taşıyıcılara zarar verilmemelidir.\nHastane, okul ve kamu binalarında tadilat sırasında bu hatalar sık yapılır; bir cihaz odası için duvar kaldırmak hastanenin **afet performansını düşürebilir**."}, {"q": "Aşağıdakilerden hangisi yapısal olmayan öge DEĞİLDİR?", "opts": [{"t": "Asma tavan paneli"}, {"t": "Aydınlatma armatürü"}, {"t": "Sabitlenmemiş ilaç rafı"}, {"t": "Tıbbi gaz tesisatı"}, {"t": "Perde duvar"}], "a": 4, "exp": "**Yapısal olmayan risk**: taşıyıcı sisteme ait olmayan ögelerin — mobilya, cihaz, tesisat, asma tavan, aydınlatma — depremde devrilerek, düşerek veya kopararak yarattığı risk (kaynak: AFAD).\n**Perde** betonarme bir **taşıyıcı** elemandır, yani yapısal sistemin parçasıdır."}, {"q": "\"Bir hastane yıkılmadan da işlevini kaybedebilir.\" Kaynağa göre bunun en yaygın nedeni nedir?", "opts": [{"t": "Güçlü kolon – zayıf kiriş kusuru"}, {"t": "Yapısal olmayan riskler"}, {"t": "Yetersiz deprem derzi"}, {"t": "Yumuşak kat düzensizliği"}, {"t": "Farklı oturma"}], "a": 1, "exp": "Sınavda hatırla: hastane yıkılmadan işlevini kaybedebilir; bunun **en yaygın nedeni yapısal olmayan risklerdir**. Hastanenin afetteki performansını çoğu zaman taşıyıcı sistem değil, **sabitlenmemiş ayrıntılar** belirler.\nDiğer şıklar taşıyıcı sistemi doğrudan etkileyen yapısal kusurlardır."}, {"q": "Depremde bina hasarsız, elektrik var ve personel görevde; ancak yoğun bakımdaki duvar oksijen çıkışlarına gelen hat kopmuştur. Bu durum en iyi hangi ifadeyle açıklanır?", "opts": [{"t": "Bina ayakta olsa da hizmet veremez; oksijen hattı kopan yoğun bakım hasta tutamaz"}, {"t": "Taşıyıcı sistem sağlam olduğu için yoğun bakımdaki hizmet kesintisiz sürdürülebilir"}, {"t": "Bu bir yapısal hasardır ve güçlü kolon – zayıf kiriş ilkesiyle önlenebilirdi"}, {"t": "Oksijen hattının kopması yalnızca yangın riski yaratır, hasta bakımını etkilemez"}, {"t": "Bu durum yalnızca jeneratör çalışmadığında sorun olur"}], "a": 0, "exp": "**Kopan tesisat** \"hizmetin kalbi\"dir: tıbbi gaz, su-kanalizasyon, elektrik. Oksijen hattı kopan yoğun bakım, binası sapasağlam olsa bile hasta tutamaz.\n**Tıbbi gaz hattı**: oksijen ve solunum gazlarının merkezî dağıtım boru sistemi; **esnek bağlantı** ve **otomatik kesme vanası** yoksa kopma/sızıntı riski yüksektir. 2023 depremlerinde bazı hastaneler taşıyıcı sistemi sağlam olduğu hâlde altyapı hasarı nedeniyle tahliye edilmiştir."}, {"q": "HAP'ın uygulanmasıyla ilgili kaynakta vurgulanan ilke hangisidir?", "opts": [{"t": "Plan, kriz anında koşullara göre yeniden yazılmalıdır"}, {"t": "Yazılı plan tek başına yetmez; tatbikatla denenmemiş plan, plan sayılmaz"}, {"t": "Planı yalnızca hastane yöneticilerinin bilmesi yeterlidir"}, {"t": "Plan bir kez hazırlandıktan sonra güncellenmesine gerek yoktur"}, {"t": "Tatbikat yalnızca yapısal güçlendirme yapılmış hastanelerde zorunludur"}], "a": 1, "exp": "\"**Kriz anında plan yazılmaz, plan uygulanır.**\" Personelin planı bilmesi ve düzenli **tatbikatla** denenmiş olması gerekir; hemşire, güvenlik ve temizlik personeli görevini bilmiyorsa plan yoktur — afet anında insanlar okumaya değil **alışkanlığa** göre davranır.\nHAP güncel tutulmak zorundadır."}, {"q": "TBDY-2018'in performans hedefi yaklaşımına göre sıradan bir konut ile hastane için hedefler hangisinde doğru eşleştirilmiştir?", "opts": [{"t": "Konut: kesintisiz kullanım — Hastane: can güvenliği"}, {"t": "Konut: can güvenliği — Hastane: can güvenliği"}, {"t": "Konut: göçmenin önlenmesi — Hastane: hızlı tahliye"}, {"t": "Konut: can güvenliği — Hastane: kesintisiz kullanım"}, {"t": "Konut: kesintisiz kullanım — Hastane: kesintisiz kullanım"}], "a": 3, "exp": "Haftanın ana fikri: **ayakta kalmak ile çalışmaya devam etmek aynı şey değildir**. Sıradan binada hedef insanların güvenle tahliyesidir (**can güvenliği**); hastane, itfaiye, afet yönetim merkezi için hedef **kesintisiz kullanım**dır — afetin hemen ertesinde hasta kabul edebilmek.\nBu hedef daha pahalı tasarım demektir; toplum bu maliyeti, afet anında o binaya herkesin ihtiyaç duyması nedeniyle kabul eder.\n💡 Konut: içindekiler sağ çıksın, yeter. Hastane: deprem biter bitmez hasta kabul etsin."}, {"q": "Mevcut riskli yapı stokunun yenilenmesinin (kentsel dönüşüm) yasal çerçevesi olan kanun hangisidir?", "opts": [{"t": "Hastane Afet ve Acil Durum Planları Uygulama Yönetmeliği (2015)"}, {"t": "Türkiye Bina Deprem Yönetmeliği (2018)"}, {"t": "6306 sayılı Afet Riski Altındaki Alanların Dönüştürülmesi Kanunu"}, {"t": "Deprem Bölgelerinde Yapılacak Binalar Hakkında Yönetmelik (2007)"}, {"t": "TS-500 Betonarme Yapıların Tasarım ve Yapım Kuralları (2000)"}], "a": 2, "exp": "Mevcut riskli yapı stokunun yenilenmesinin (kentsel dönüşüm) yasal çerçevesi, **6306 sayılı Afet Riski Altındaki Alanların Dönüştürülmesi Kanunu**dur (2012). Kanun kitapta işlenmez; ayrıntısı Hafta 12'dedir."}], "cards": [{"t": "Deprem neden yıkar?", "b": "Binalar öncelikle kendi ağırlığını, yani **düşey yükleri** taşımak için tasarlanır. Deprem ise binaya **yatay kuvvet** uygular; kolonları eğmeye, kesmeye ve burkulmaya zorlar. Yatay yüke göre tasarlanmamış bina, düşey yükü mükemmel taşısa bile yıkılır.\n💡 Deprem güvenliği = yatay yüke direnme kapasitesi."}, {"t": "Üçlü çözüm: dayanım, rijitlik, süneklik", "b": "Depreme dayanıklı bina üç özelliğe birden sahiptir: **dayanım** (kuvvete direnç), **rijitlik** (şekil değiştirmeye direnç) ve **süneklik** (kırılmadan şekil değiştirebilme)."}, {"t": "Süneklik zaman kazandırır", "b": "**Sünek** eleman kırılmadan önce eğilir, çatlar — binadan çıkmak için **zaman kazandırır**. **Gevrek** bina uyarısız, bir anda göçer; 'pancake' tipi göçme yaşam boşluğu bırakmaz ve kurtarma şansını düşürür.\n💡 Bisküvi gevrektir, kırılır; tel süneklik gösterir, eğilir ama kopmaz."}, {"t": "Temel seçimini zemin belirler", "b": "Zemin zayıfladıkça yük daha geniş alana yayılır: **tekil → sürekli → radye → kazıklı**. Üst yapı ne olursa olsun tüm temeller **betonarme** yapılır. Sürekli temelde **farklı oturma** (binanın bir bölümünün daha çok gömülmesi — Pisa Kulesi) riski tekil temele göre çok daha düşüktür."}, {"t": "Tekil temel ve bağ kirişi", "b": "Sağlam zeminde her düşey taşıyıcının altına kesitinden büyük bir betonarme **pabuç** yapılır. Pabuçlar deprem kuvvetini aktarmak için **bağ kirişleriyle** bağlanır; bağlanmazsa depremde her pabuç **ayrı hareket eder**."}, {"t": "Radye ve kazıklı temel", "b": "**Radye**, bina alanını boydan boya kaplayan betonarme plaktır; **zayıf zeminin** en uygun temelidir ve güvenlik açısından **kirişli radye** tercih edilir. **Kazıklı temel** sağlam zemine dek kazık çakılan derin temeldir; maliyeti çok yüksektir, daha çok **köprü ve limanda** kullanılır."}, {"t": "Betonarme karkas sistem", "b": "Türkiye'nin en yaygın bina tipi. Taşıyıcılığı **kolon-kiriş çerçevesi** üstlenir; duvarlar yük taşımaz, yalnızca bölme işlevi görür. **Döşeme** rijit bir diyafram gibi deprem kuvvetini toplar ve taşıyıcılara dağıtır; depremde **en az hasar alan** elemandır."}, {"t": "Kolonda cömert davran", "b": "Kolon, düşey yükleri temele aktarır ve kirişlerle çerçeve kurup yatay kuvvete direnir. Kitap, yönetmelikteki 25/30 cm yerine **30/50 cm** minimum kesit önerir: 'kolon boyutlarında **elden geldiğince cömert** davranılmalı.'"}, {"t": "Perde süngerdir", "b": "Perde, bir kenarı diğerinin **en az 7 katı** olan özel kolondur (min. **25×175 cm**). Çok **rijit** olduğu için deprem yükünü sünger gibi üzerine çeker, ötelemeyi azaltır ve **kolonları korur**.\n💡 2011 Van'da perdeli binalar belirgin biçimde ayakta kaldı. Perde ≠ dolgu duvar: perde betonarme taşıyıcıdır."}, {"t": "Güçlü kolon – zayıf kiriş", "b": "Yönetmeliğe göre **kolon kirişten güçlü** olmalı; hasar önce **kirişte** oluşmalıdır. Kiriş hasarı bir açıklığı etkiler ve enerji yutarak yıkımı geciktirir; **kolon hasarı üstteki tüm katları çökertir**.\n💡 Masa benzetmesi: tabla çatlarsa masa durur, bacak kırılırsa çöker."}, {"t": "Türkiye'nin kronik kusuru", "b": "Eski binaların çoğunda tersi vardır: **güçlü kiriş – zayıf kolon**. Kolonlar büyük kesme kuvvetiyle hasar alıp bina göçer; **1992 Erzincan, 1995 Dinar, 1999 Gölcük, 2003 Bingöl, 2011 Van** depremlerinde yaygın gözlendi."}, {"t": "Burulma (A1) düzensizliği", "b": "**Kütle merkezi** ile **rijitlik merkezi** çakışmazsa (kaçıklık = **eksantrisite**) bina depremde yalnızca ötelenmez, kendi ekseni etrafında **döner**. Ölçüt: en büyük göreli kat ötelemesinin ortalamaya oranı **1,2'yi** aşarsa burulma vardır.\n💡 Kitabı köşesinden itersen döner, ortasından itersen düz gider."}, {"t": "Döşeme süreksizliği (A2)", "b": "Merdiven ve asansör dâhil **boşluk alanları toplamı kat brüt alanının 1/3'ünü** aşarsa döşeme süreksizliği vardır. Asma kat, geniş aydınlık ve kalınlıktaki ani değişimler de bu düzensizliği üretir; döşemenin **yük dağıtma** işlevi bozulur."}, {"t": "Planda çıkıntı (A3)", "b": "**L, T, U, H** biçimli planlarda, çıkıntının birbirine dik **iki doğrultudaki boyutunun HER İKİSİ** de toplam plan boyutunun **%20'sini** aşarsa düzensizlik vardır. Çözüm: bölümleri **deprem derziyle** ayırmak. En güvenli plan **basit ve simetrik** olandır.\n💡 Tek yönde uzun çıkıntı tek başına A3 oluşturmaz — iki yön şartı var."}, {"t": "Zayıf kat ve yumuşak kat farkı", "b": "**Zayıf kat (B1) dayanım** eksikliği, **yumuşak kat (B2) rijitlik** eksikliğidir; uygulamada çoğu kez aynı binada birlikte bulunur. B2 ölçütü: bir katın ortalama göreli ötelenmesinin üst veya alt katınkine oranı **2'den büyükse** o kat yumuşaktır."}, {"t": "Neden hep zemin kat çöker?", "b": "Üç neden: (1) işyeri kullanımı yüzünden **camekân** — dolgu duvarın rijitlik katkısı (1998 yönetmeliğinden beri kabul edilir) kaybolur; (2) **yüksek giriş katı** — uzayan kolon daha esnek davranır; (3) üst katlar duvarlarıyla **rijit blok** gibi hareket eder, tüm göreli öteleme zemin katta toplanır.\n💡 Deprem enerjisi en esnek kata boşalır: üstü sağlam, altı ezilmiş bina."}, {"t": "Göçme tipi kurtarmayı belirler", "b": "Yumuşak kat göçmesinde **zemin katta yaşam boşluğu çok azdır**; üst katlar görece bütün indiği için sağ kalan olasılığı orada yüksektir. Enkaz değerlendirmesinde bu bilgi **önceliklendirmeyi** etkiler.\n💡 Yapı bilgisi ile arama-kurtarma arasındaki köprü."}, {"t": "Taşıyıcı sistem süreksizliği (B3)", "b": "Kolon ve perdeler **temelden çatıya kesintisiz** olmalıdır; yük aşağıya **düz bir yol** bulmalıdır. **Kesin yasak**: perdenin kolona veya kiriş açıklığına, kolonun konsol ya da guseye oturtulması. Kolon kirişe oturuyorsa birleşimdeki iç kuvvetler **%50 artırılarak** hesaplanır."}, {"t": "Kısa kolon problemi", "b": "Bant pencere, asma kat, merdiven sahanlığı gibi nedenlerle kolonun **serbest boyu kısalır**; kısalan kolon **rijitleşir** ve kesme kuvvetinin büyük kısmını üzerine çeker. Sonuç: **X biçimli** çapraz kesme çatlakları (2003 Bingöl, 2011 Van). Çözüm: kat yüksekliğince **sık etriye**.\n💡 Kısa cetvel bükülmez, direnir — ve kuvvetin tamamını alıp kırılır."}, {"t": "Köşe kolon problemi", "b": "Salonun köşede olduğu binalarda **sarkan kiriş istenmemesi** yüzünden doğar; yük aktarımı zorlaşır, köşe kolon uçları zarar görür. **Yalnızca düşey yük altında bile** binayı yıkabilir: 2004'te Konya'da **Zümrüt Apartmanı** hiç deprem olmadan çöktü. Çözüm: kolon yerine **perde** ve sık etriye."}, {"t": "Saplama ve yapışık kiriş", "b": "Kirişin kolona değil **başka kirişe oturması** saplama kiriş, cephe duvarını kolonların dışına çizme alışkanlığı **yapışık kiriş** problemidir. Yük bina içinde dolanır; saplanılan kirişte hesapta olmayan **burulma momenti ve kesme kuvveti** doğar.\n💡 Köşe kolonla ortak kök: mimari isteğin taşıyıcı sistemin önüne geçmesi."}, {"t": "Etriye hayat kurtarır", "b": "Etriye, boyuna donatıları saran **enine donatıdır**: kesme çatlağını önler, donatının burkulmasını engeller, betonu sararak **sünekliği sağlar**. Eleman uçlarında ve **kolon-kiriş birleşimlerinde** sıklaştırılır. Etriye yetersizliği Türkiye'deki deprem hasarlarının en yaygın nedenlerindendir."}, {"t": "135 derece kuralı", "b": "Etriye uçları **135 derece** içe bükülmelidir — uçlar betonu içeriden kavrar. **90 derece** bükülen etriye depremde pas payı dökülünce **açılır** ve işlevini kaybeder.\n💡 Beton döküldükten sonra görülemez; yapı denetimi bu yüzden inşaat sırasında şarttır."}, {"t": "Ağır çıkma", "b": "Üst katların alt katlardan geniş olması **kütle merkezini yukarı** kaydırır; alt katlar **yumuşak kat gibi** davranır ve düşey yük altında bile zorlanır. Çıkmalı binalarda kısa kolon, köşe kolon ve çerçeve süreksizliği de birlikte görülür. Öneri: kirişli ya da **gömme balkon**, büyük kesitli ve aks boyunca **sürekli** konsol kirişler."}, {"t": "Deprem derzi ölçüsü", "b": "Bitişik binalar depremde farklı salınıp çarpışır. Yönetmelik: **6 m yüksekliğe kadar en az 30 mm**, sonraki **her 3 m için +10 mm**. En tehlikeli durum: döşeme hizaları farklı iki komşu bina — birinin döşemesi diğerinin **kolonunun ortasına** balyoz gibi vurur.\n💡 Örnek hesap: 15 m bina → 30 + 3×10 = en az 60 mm."}, {"t": "Malzeme, işçilik, korozyon", "b": "Yıkılan binaların ortak özelliği **düşük kaliteli beton** ve özensiz işçiliktir (1998 Adana, 1999 Kocaeli). **Yıkanmamış deniz kumu** içindeki tuzla korozyonu hızlandırır; paslanan donatının çapı azalır ve **aderans** (beton-donatı yapışması) kaybolur. **Pas payı 3–5 cm** olmalı ve bina ömrünce korunmalıdır.\n💡 Bu kusurlar zamanla kötüleşir: bina yaşı, riskin bağımsız bileşenidir."}, {"t": "Kolon kesmek yük silmez", "b": "Taşıyıcı eleman kaldırıldığında yük **ortadan kalkmaz, komşu elemanlara biner** — onlar bu yük için hesaplanmamıştır. Kolon kesme, taşıyıcı (perde) duvar kaldırma ve statik inceleme olmadan **kat ekleme** deprem güvenliğini doğrudan yok eder. En sinsisi: **tesisat borusunu kiriş donatıları arasından** geçirmek — bina hiç deprem görmeden zayıflar.\n💡 Kural: taşıyıcıya dokunan her iş mühendis onayı ister."}, {"t": "Yapısal olmayan risk", "b": "Taşıyıcı sisteme ait olmayan ögelerin — **mobilya, cihaz, tesisat, asma tavan, aydınlatma** — devrilerek veya düşerek yarattığı risktir. Taşıyıcı sistem sağlam kalsa bile yaralanma, ölüm ve **hizmet kesintisi** doğurur. Azaltılması (sabitleme, askılama, esnek bağlantı) yapısal güçlendirmeden **çok daha ucuzdur**."}, {"t": "Hastane yıkılmadan işlev kaybeder", "b": "**Oksijen hattı kopan** yoğun bakım, binası sapasağlam olsa bile hasta tutamaz. Düşen asma tavan ameliyathaneyi kapatır; sabitlenmemiş, yakıtsız ya da test edilmemiş **jeneratör** devreye girmez. 2023'te bazı hastaneler taşıyıcı sistemi sağlamken altyapı hasarı yüzünden tahliye edildi.\n💡 Hastanenin performansını çoğu zaman sabitlenmemiş ayrıntılar belirler."}, {"t": "HAP ve kesintisiz kullanım", "b": "Her sağlık tesisi **Hastane Afet ve Acil Durum Planı** hazırlamakla yükümlüdür (**RG 20.03.2015, S. 29301**); kapasite artırımı, hasta akışı, tahliye ve stok yönetimini kapsar ve **tatbikatla denenmemiş plan, plan sayılmaz**. **TBDY-2018** (yürürlük 1.1.2019) hastane gibi yapılara **'kesintisiz kullanım'** hedefi getirir: **ayakta kalmak ile çalışmaya devam etmek aynı şey değildir**.\n💡 Kriz anında plan yazılmaz, plan uygulanır."}]}];

`<h3>1. Giriş: Neden bu ders?</h3>
<p>Ana fikir: bu ders "hangi afet nasıl olur" değil, <b>"afet neden afete dönüşür"</b> dersidir.</p>

<h3>2. Haiti – Şili (2010): Aynı yıl, iki deprem</h3>
<div class="tbl"><table><tr><th></th><th>Haiti</th><th>Şili</th></tr>
<tr><td>Tarih / büyüklük</td><td>12 Ocak 2010, <b>Mw 7.0</b></td><td>27 Şubat 2010, <b>Mw 8.8</b></td></tr>
<tr><td>Merkez üssü</td><td>Port-au-Prince'in ~25 km batısı; en yoğun nüfuslu bölge</td><td>Maule açıkları (deniz)</td></tr>
<tr><td>Derinlik</td><td>~13 km (sığ)</td><td>~35 km; <b>tsunami</b> oluştu</td></tr>
<tr><td>Can kaybı</td><td><b>100.000–316.000</b> (hükûmet ~316 bin; bağımsız 100–160 bin)</td><td><b>~525</b> (önemli kısmı tsunamiden)</td></tr>
<tr><td>Sağlık</td><td>Ekim 2010'da başlayan <b>kolera</b> salgını (dolaylı sağlık sonucu)</td><td>Salgın yok; altyapı ve sağlık sistemi ayakta</td></tr>
</table></div>
<ul><li>Ölçek <b>logaritmik</b>: 1,8 birim fark ≈ 10^(1,5×1,8) ≈ <b>500 kat enerji</b>. → "500 kat güçlü deprem, yüzlerce kat az ölüm."</li>
<li>Haiti'de sayının belirsizliği de bulgudur: kurumsal kapasitesi çökmüş ülke kaybını sayamaz.</li>
<li><b>Farkı yaratan dört şey (hiçbiri depremle ilgili değil):</b> <span class="k">yapı stoku</span> (Şili'de <b>1960 Valdivia, Mw 9.5</b> — aletsel dönemin en büyüğü — sonrası katı yönetmelik ve denetim), <span class="k">kurumsal kapasite</span> (afet kurumları, erken uyarı, tatbikat), <span class="k">toplumsal hazırlık</span> (ilk saatleri toplum yönetir), <span class="k">ekonomik durum</span> (yoksulluk → dayanıksız konut, sigortasızlık, yavaş iyileşme).</li>
<li>Sonuç: belirleyen <b>tehlike değil</b>, toplumun <b>kırılganlığı ve kapasitesi</b>. "Deprem öldürmez, bina öldürür" — binayı yapan, denetlemeyen, hazırlanmayan da insandır.</li></ul>

<h3>3. Kelimenin kökeni</h3>
<ul><li><b>Afet</b>: Arapçadan geçmiştir; TDK: "çeşitli doğa olaylarının sebep olduğu yıkım", "<b>kıran</b>".</li>
<li><b>Disaster</b>: <b>dis</b> (istenmeyen, kötü) + <b>astro</b> (yıldızlar) = "yıldızların ters dizilişi" → felaketi kadere bağlayan görüş.</li>
<li>İki kelime de afeti kaçınılmaz dış güç gibi resmeder; <b>modern afet bilimi tersini</b> söyler: belirleyici, toplumun hazırlığıdır.</li></ul>

<h3>4. Afetin tanımı ve üç koşul</h3>
<p><b>AFAD (Açıklamalı Afet Yönetimi Terimleri Sözlüğü):</b> Toplumun tamamı veya belli kesimleri için fiziksel, ekonomik ve sosyal kayıplar doğuran, normal hayatı ve insan faaliyetlerini durduran/kesintiye uğratan, <span class="k">etkilenen toplumun baş etme kapasitesinin yeterli olmadığı</span> <b>doğa, teknoloji veya insan kaynaklı</b> olay.</p>
<ol><li><b>Kayıp doğurmalı</b> – can, mal veya çevre kaybı</li>
<li><b>Kapasiteyi aşmalı</b> – yerel imkân ve kaynaklarla üstesinden gelinememeli</li>
<li><b>Hayatı kesintiye uğratmalı</b> – yerleşmedeki insan faaliyetlerini bozmalı/durdurmalı</li></ol>
<p><span class="warn">Kapasite yeterliyse → ACİL DURUM; kayıp yoksa → yalnızca DOĞA OLAYI.</span> Sınır <b>kaynak sınırıdır</b>: tek araçlı trafik kazası acil durumdur (112 baş eder); kaynak yetmeyen çok yaralılı olay afete dönüşür ve bakım mantığı değişir (triyaj). Issız bir yerde (ör. okyanus ortası) olan deprem, heyelan, sel, volkanik patlama <b>asla afet sayılmaz</b>; afeti üreten orada bir toplumun bulunmasıdır.</p>

<h3>5. Afet zinciri: olay değil, sonuç</h3>
<p><b>Doğa olayı</b> (enerji boşalır) → <b>Maruziyet</b> (insan/yapı orada) → <b>Kırılganlık</b> (dayanıksız yapı, hazırlıksız toplum) → <b>AFET</b> (kayıp, kesinti, baş edememe).</p>
<ul><li>1. halka değiştirilemez; <b>2. ve 3. halka bizim elimizde</b> — afet yönetimi burada çalışır.</li>
<li><span class="warn">Yer seçimi ve imar kararları → 2. halka (maruziyet); zarar azaltma (mitigasyon) → 3. halka (kırılganlık).</span></li></ul>

<h3>6. "Doğal afet" var mı?</h3>
<ul><li>Kitap (s. 4): "<b>Doğal afet yoktur.</b> Doğa veya çevre kaynaklı tehlike veya tehditler vardır."</li>
<li>Deprem doğaldır, afet değildir. "Doğal afet" demek <b>sorumluluğu doğaya devretmek</b>tir.</li>
<li>UNDRR <b>"natural hazard"</b> der, "natural disaster" demez.</li>
<li>Örnek: aşırı yağış engellenemez; dere yatağını yapılaşmaya açmak bir karardır → "<b>Afeti üreten yağmur değil, imar kararıdır.</b>"</li></ul>

<h3>7. Dört temel kavram</h3>
<div class="tbl"><table><tr><th>Kavram</th><th>Tanım</th><th>Soru</th></tr>
<tr><td>Tehlike (hazard)</td><td>Zarar verme potansiyeli olan olay/olgu</td><td>Ne olabilir?</td></tr>
<tr><td>Maruziyet (exposure)</td><td>Tehlikenin etki alanındaki insan, yapı, değerler</td><td>Kim ve ne orada?</td></tr>
<tr><td>Zarar görebilirlik (vulnerability)</td><td>Maruz kalanların zarar görmeye açıklık derecesi</td><td>Ne kadar kırılgan?</td></tr>
<tr><td>Kapasite (capacity)</td><td>Baş etme, direnme, toparlanma gücü</td><td>Ne kadar dayanıklıyız?</td></tr>
</table></div>
<p>Dört cevabın bileşimi = <b>RİSK</b>. Sağlıkta zarar görebilirlik somuttur: yaşlı, kronik hasta, engelli, diyaliz hastası daha kırılgandır. Örnek (sınıf binası): beklenen deprem = tehlike; binadaki 40 kişi = maruziyet; yönetmelik/güçlendirme = zarar görebilirlik; tahliye planı = kapasite.</p>

<h3>8. Risk formülü</h3>
<p><span class="k">RİSK = Tehlike × Zarar Görebilirlik ÷ Kapasite</span></p>
<ul><li>Tehlikeyi <b>azaltamayız</b> (fayı durduramayız).</li>
<li>Zarar görebilirliği <b>azaltabiliriz</b>: sağlam yapı, doğru yer seçimi, güçlendirme.</li>
<li>Kapasiteyi <b>artırabiliriz</b>: eğitim, plan, tatbikat, kaynak, kurumsal yapı.</li>
<li>Kapasite paydada → arttıkça risk düşer. Riski düşürmenin iki yolu var, ikisi de insan elinde.</li>
<li><span class="warn">Formül nicel değil kavramsaldır; ders kitabında bu netlikte yoktur — Kadıoğlu'nun "Afet Yönetimi" kitabından alınmıştır.</span></li></ul>

<h3>9. Afetin büyüklüğünü belirleyen faktörler (Ergünay 2002; kitap Şekil 1.1)</h3>
<ol><li><b>Olayın fiziksel büyüklüğü</b> (magnitüd, yağış miktarı, rüzgâr hızı) — <span class="warn">TEK doğa kaynaklı faktör</span></li>
<li>Yerleşme alanlarına uzaklık ve nüfus yoğunluğu (aynı deprem kırsalda küçük, metropolde yıkıcı)</li>
<li>Fakirlik ve az gelişmişlik (dayanıksız konut, sigortasızlık, sınırlı kaynak; ahlaki değil teknik değişken — sigortasızlık iyileşmeyi uzatır)</li>
<li>Hızlı nüfus artışı ve çarpık kentleşme (denetimsiz kent kendi riskini üretir)</li>
<li>Tehlikeli bölgelerde denetimsiz şehirleşme ve sanayileşme (fay üzerindeki sanayi → ikincil afet / NaTech; 1999 TÜPRAŞ)</li>
<li>Alan kullanımı ve yapılaşma kültürü eksikliği (tehlike haritası varken ona göre imar yapmamak; tdth.afad.gov.tr)</li>
<li>Çevrenin tahribi ve yanlış kullanımı (orman, sulak alan, tarım arazisi, kıyı bozulması → sel ve heyelan büyür)</li>
<li>Bilgisizlik, eğitimsizlik, güvenlik kültürü eksikliği (en iyi plan bile uygulanamaz)</li></ol>
<p>Kitap ayrıca <b>toplumun önceden alabildiği koruyucu ve önleyici önlemlerin düzeyini</b> sayar.</p>
<p><span class="k">Kritik çıkarım: sekiz faktörden YEDİSİ insan faaliyeti kökenlidir.</span> Kitap (s. 6): afetlerin büyüklüğü insan faaliyetlerinin doğru ve yanlış yönde uygulanmasına paralel olarak artar veya azalır. Afetin ölçeği büyük ölçüde bizim ürettiğimiz sonuçtur → azaltılabilir. "Afetlerden korkmayın, ama afetlere de hazırlıksız yakalanmayın."</p>

<h3>10. Afetleri karşılaştırma ölçütleri (7)</h3>
<div class="tbl"><table><tr><th>Ölçüt</th><th>Açıklama / örnek</th></tr>
<tr><td>Sıklık ve tehdit</td><td>Düzenli mi, seyrek mi? Sık olan gündemden düşmez</td></tr>
<tr><td>Etki süresi</td><td>Hortum dakikalar; kuraklık yıllarca</td></tr>
<tr><td>Başlangıç hızı</td><td>Ani mi, önceden uyaran mı?</td></tr>
<tr><td>Etki alanı</td><td>Tek mahalle mi, tüm ülke mi? Zincirleme yayılıyor mu?</td></tr>
<tr><td>Tahrip gücü</td><td>Tehlikenin tipine ve yerleşimin durumuna göre değişir</td></tr>
<tr><td>Önceden tahmin edilebilirlik</td><td>Nehir taşkını taşkın ovasıyla sınırlı; gaz sızıntısı sınır tanımaz</td></tr>
<tr><td>Kontrol edilebilirlik</td><td>Bazılarında çaresiziz; bazılarında etki azaltılabilir</td></tr>
</table></div>
<p>Karşılaştırmalı puanlama → yerin <b>afetselliği</b> hakkında fikir (çok kriterli karar verme: AHP, TOPSIS — ileride).</p>

<h3>11. Afetlerin ortak özellikleri (6)</h3>
<ol><li>İlk anlarda şok etkisi yaratır.</li><li>Yaşamı tehdit eder; ölüm ve yaralanmaya yol açar.</li><li>Yaşam kaynaklarına ve altyapıya zarar verir.</li><li>Bazıları tahmin edilemez, bazıları edilebilir.</li><li>Bazıları ani, bazıları yavaş gelişir.</li><li><b>İlk anlarda organize müdahale olmayabilir.</b></li></ol>
<ul><li>Ani: deprem, hortum, patlama → hazırlık önceden. Yavaş: kuraklık, kıtlık, salgın → erken uyarı ve izleme.</li>
<li>İlk saatlerde toplum kendi kendine kalır; enkazdan kurtarılanların çoğunu <b>komşular ve yoldan geçenler</b> çıkarır → halk eğitimi mesleki görevdir; profesyonel ekip kendiliğinden başlamış bir kurtarma ortamı bulur.</li></ul>

<h3>12. Afetlerin etkileri</h3>
<div class="tbl"><table><tr><th>Doğrudan</th><th>Dolaylı</th><th>İkincil</th></tr>
<tr><td>Can kaybı, yaralanma</td><td>Gelir ve üretim kaybı</td><td>Pazar ve bütçe kayıpları</td></tr>
<tr><td>Yapı ve altyapı hasarı</td><td>Hizmetlerde aksamalar</td><td>Güvenlik ve asayiş sorunları</td></tr>
<tr><td>Geçici barınma, acil yardım ihtiyacı</td><td>Enflasyon ve işsizlik artışı</td><td>Ekonomik dengesizlikler</td></tr>
</table></div>
<p>Doğrudan = afetle <b>anında</b> (yıkılan fabrika); dolaylı = onun <b>sonucu, zaman alır</b> (üretim durur, işsizlik, gelir kaybı).</p>
<p><span class="warn">İkincil ETKİ ≠ İkincil AFET.</span> İkincil etki ekonomik-sosyal sonuçtur; <b>ikincil afet</b> (AFAD 2014) bir afetin tetiklediği <b>yeni afettir</b>: yangın, heyelan, baraj yıkılması, patlama, salgın, endüstriyel kaza.</p>
<ul><li>Başlıca ikincil afetler: yangın-patlama; kimyasal-gaz sızıntısı; su baskını-baraj yıkılması; salgın-çevre kirliliği.</li>
<li><b>17 Ağustos 1999 Kocaeli</b>: <b>TÜPRAŞ</b>'ta yangın, <b>AKSA</b>'da <b>akrilonitril</b> sızıntısı (&gt;6 bin ton; yanıcı, patlayıcı, kanserojen; hayvan ölümleri, halk sağlığı sorunları, tahliye). Deprem 45 sn, yangın günlerce (Öncü 2013).</li>
<li>Güncel adı: <b>NaTech</b> (Natural Hazard Triggered Technological Accident) — kitapta yok. 2023 örneği: İskenderun Limanı konteyner yangını.</li></ul>
<p><b>Başlıca sonuçlar (8):</b> can ve mal kaybı (ölüm, sakatlık, yaralanma, yetim kalma); altyapının bozulması; <b>uzun süreli psikolojik travma</b> (yıllarca); güvenlik ve düzenin zayıflaması; <b>bulaşıcı/salgın hastalıklar</b> (barınma-hijyen bozulması); ekonomik yapının bozulması; yaşam kalitesinin düşmesi; yatırımların gecikmesi/iptali (kalkınma planları askıya alınır).</p>

<h3>13. Sağlık boyutu</h3>
<div class="tbl"><table><tr><th>Başlık</th><th>İçerik</th></tr>
<tr><td>Doğrudan sağlık sonuçları</td><td>Travma-kırık, <b>crush sendromu</b>, boğulma, yanık, duman inhalasyonu, zehirlenme, hipotermi</td></tr>
<tr><td>Dolaylı sağlık sonuçları</td><td>Kronik tedavinin kesintisi, <b>diyaliz ve ilaç erişimi</b>, salgın, gebe-bebek sağlığı, beslenme, ruh sağlığı</td></tr>
<tr><td>Kırılgan gruplar</td><td>Yaşlılar, bebek-çocuk, gebeler, engelliler, kronik hastalar, yerinden edilmiş nüfus</td></tr>
<tr><td>Hizmet zinciri</td><td><b>Olay yeri → 112 → UMKE → hastane (HAP)</b></td></tr>
</table></div>
<p><span class="k">Kaynak/ihtiyaç oranı tersine dönünce bakım mantığı değişir: triyaj.</span> Bu ders afet tıbbı dersi değildir; triyaj protokolleri, KBRN ve afet tıbbı üst sınıflarda.</p>

<h3>14. Kitap 2018'de kaldı — güncellemeler</h3>
<ul><li>Nüfus: kitapta "80 milyona dayanan" → <b>TÜİK 2024 ≈ 85,7 milyon</b>.</li>
<li>Ekonomik kayıp: "yılda <b>GSMH'nin %3'ü</b>" tahmini 2023 sonrası geçersiz.</li>
<li>6 Şubat 2023 kitapta yok; risk formülü kitapta açıkça yok (Kadıoğlu); NaTech kitapta yok.</li>
<li><span class="warn">Sınavda kitaptaki bilgiler esastır</span>; güncellemeler derste ayrıca belirtilir.</li></ul>

<h3>15. Etkinlik ve toparlama</h3>
<p>Haiti–Şili'ye sekiz faktörle bakınca: fakirlik, yapılaşma kültürü/alan kullanımı, çarpık kentleşme, önlem düzeyi <b>farklı</b> (Şili lehine); <b>fiziksel büyüklük Şili'de daha büyük</b> — tek doğal faktör Şili aleyhineydi, sonuç yine Şili lehine. "Farkı yaratan, depremin büyüklüğü değil; toplumun zarar görebilirliği ve baş etme kapasitesi oldu."</p>
<ol><li>Afet bir olay değil, sonuçtur.</li><li>Üç koşul birlikte aranır.</li><li>Risk dört bileşenden kurulur (tehlike, maruziyet, zarar görebilirlik, kapasite).</li><li>Sekiz faktörden yedisi insan kaynaklıdır.</li><li>Etkiler üç katmanda okunur (doğrudan, dolaylı, ikincil).</li><li>Afet aynı zamanda bir sağlık olayıdır.</li></ol>
<p>Dönem ödevi: kendi ilinin <b>AFAD İl Afet Risk Azaltma Planı (İRAP)</b>'ndan bir risk seçip analiz etmek. Ana kaynak: Tün (Ed.) 2018, Temel Afet Bilgisi, Bölüm 1 (B. Özmen); ek: Akbulut (Ed.) Doğal Afetler ve Afet Yönetimi; Kadıoğlu, Afet Yönetimi; AFAD Terimler Sözlüğü.</p>

<h3>1. Neden sınıflandırırız?</h3>
<p>Sınıflandırma bir etiketleme işi değil, <span class="k">saymanın ve planlamanın ön koşuludur</span>. Dört işi mümkün kılar:</p>
<ul>
<li><b>Saymak:</b> Kategori yoksa istatistik yoktur (ör. "sel" ile "taşkın" aynı mı sayılacak?).</li>
<li><b>Karşılaştırmak:</b> Ülkeler/yıllar arası karşılaştırma ancak ortak tanımla anlamlıdır.</li>
<li><b>Planlamak:</b> Depreme arama-kurtarma, sele tahliye, salgına izolasyon.</li>
<li><b>Kaynak ayırmak:</b> Hangi afetin ne kadar zarar verdiği bilinmeden bütçe/personel dağıtılamaz (TARAP gibi planlar bu istatistiklere dayanır).</li>
</ul>
<p>Mesleki karşılık: 112 komuta merkezi çağrıyı hangi kategoriye koyarsa ona göre ekip gönderir — <b>kategori, kaynağı belirler</b>.</p>

<h3>2. EM-DAT (Emergency Events Database)</h3>
<ul>
<li>Dünyada en yaygın kullanılan uluslararası afet veri tabanı (Türkçesi "Acil Olaylar / Afet Veri Tabanı").</li>
<li><span class="k">1988</span>'de <span class="k">CRED</span> (Centre for Research on the Epidemiology of Disasters – Afetler Epidemiyolojisi Araştırma Merkezi) tarafından kuruldu.</li>
<li><b>WHO ve Belçika Hükümeti</b> desteğiyle; <b>Brüksel'deki Louvain Katolik Üniversitesi</b> (CRED) tarafından işletilir. <span class="warn">WHO destekçidir, kurucu CRED'dir.</span></li>
<li>1900'den bugüne <b>18.000+</b> afet kaydı. Veri kaynakları: BM kuruluşları, STK'lar, sigorta şirketleri, araştırma enstitüleri, basın ajansları (çoğu ülkede merkezî güvenilir kayıt olmadığı için çeşitlilik zorunlu).</li>
<li>Amaç: insani yardıma hizmet + afete hazırlıkta karar vericilere sağlam veri.</li>
<li>CRED bir <b>epidemiyoloji</b> (halk sağlığı) merkezidir, mühendislik enstitüsü değil: afetin ölçüsü yıkılan bina değil, etkilenen insandır. Erişim: <b>emdat.be</b> (ücretsiz, akademik kullanım için kayıt).</li>
</ul>
<p><b>Kayıt ölçütleri</b> — <span class="warn">dördünden YALNIZCA BİRİ yeterli</span>:</p>
<ol>
<li><b>≥10 ölüm</b></li>
<li><b>≥100 etkilenen</b> (yaralanan, evsiz kalan, acil yardıma muhtaç)</li>
<li><b>Yerel imkânların yetmemesi</b> = merkezî hükümetten yardım istenmesi (afet–acil durum kapasite eşiğinin veri tabanındaki hâli)</li>
<li><b>Uluslararası yardım çağrısı</b></li>
</ol>
<p>Örnek: 9 ölü + 90 etkilenen + yardım istenmemiş → EM-DAT'a <b>girmez</b>; ama orada yaşayanlar için yine afet olabilir. <span class="warn">EM-DAT eşik altını göstermez; tüm rakamlar gerçeğin yalnızca eşiği aşan kısmıdır.</span></p>

<h3>3. EM-DAT sınıflandırması</h3>
<p>Önce ikiye: <b>doğa kaynaklı</b> (5 grup) ve <b>teknolojik</b> (3 grup).</p>
<div class="tbl"><table>
<tr><th>Doğa kaynaklı grup</th><th>Örnekler</th></tr>
<tr><td>Jeolojik (Geophysical)</td><td>Deprem, volkan patlaması, kütle hareketi (heyelan, kaya düşmesi)</td></tr>
<tr><td>Hidrolojik (Hydrological)</td><td>Sel, heyelan (su kaynaklı), dalga hareketi ve etkisi</td></tr>
<tr><td>Meteorolojik (Meteorological)</td><td>Fırtına, sis, aşırı sıcaklık</td></tr>
<tr><td>Klimatolojik (Climatological)</td><td>Kuraklık, buzul gölü patlaması, söndürülemeyen (orman) yangın</td></tr>
<tr><td>Biyolojik (Biological)</td><td>Salgın hastalık, böcek istilası, hayvan salgınları</td></tr>
</table></div>
<ul>
<li>Kodlama — tetikleyici: <b>yer</b> → jeolojik, <b>su</b> → hidrolojik, <b>hava</b> → meteorolojik, <b>iklim</b> → klimatolojik, <b>canlı</b> → biyolojik.</li>
<li><span class="warn">Meteorolojik = gün-hafta ölçeği (fırtına, sıcak hava dalgası); klimatolojik = ay-yıl ölçeği (kuraklık).</span></li>
<li><span class="warn">Heyelan tetikleyicisine göre sınıflanır:</span> depremin tetiklediği → jeolojik; aşırı yağışın tetiklediği → hidrolojik. Sınıflandırmalar kesin sınır değildir.</li>
</ul>
<div class="tbl"><table>
<tr><th>Teknolojik grup</th><th>Örnekler</th></tr>
<tr><td>Endüstriyel kazalar</td><td>Kimyasal dökülme, çökme, patlama, yangın, gaz sızıntısı, zehirlenme, radyasyon</td></tr>
<tr><td>Karışık / çeşitli kazalar</td><td>Sanayi dışı ortamlarda çökme, patlama, yangın, diğer</td></tr>
<tr><td>Ulaşım kazaları</td><td>Hava, kara, demir, deniz yolu</td></tr>
</table></div>
<ul>
<li>1900–2016: <b>8.361</b> teknolojik afet → <b>her üç afetten biri</b> teknolojik.</li>
<li>Tek araçlı kaza = acil durum; çok araçlı, yerel kaynakların yetmediği kaza = ulaşım kazası kategorisinde afet.</li>
<li>Deprem sonrası fabrika yangınının kategorisi tartışmalıdır → <b>NaTech</b> (11. hafta).</li>
</ul>

<h3>4. Türkiye'de kullanılan diğer sınıflandırmalar</h3>
<p><span class="warn">Türkiye'de ortak kabul gören bir afet sınıflandırması YOKTUR.</span> AFAD, Meteoroloji Genel Müdürlüğü, DSİ kendi sorumluluk alanlarına göre farklı sınıflandırma kullanır → aynı olay farklı kategoride kaydedilir, istatistikler karşılaştırılamaz. Sonuçlar: kurumlar arası veri karşılaştırılamaz, aynı olay iki kez/hiç sayılmayabilir, kaynak dağıtımı hatalı olur, uluslararası raporlamada tutarsızlık, akademik çalışmalar birbirini doğrulayamaz. "Yanlış sayılan afet, yanlış ayrılan bütçedir."</p>

<p><b>a) Kalkınma Bakanlığı (2014)</b> — Afet Yönetiminde Etkinlik Özel İhtisas Komisyonu raporu; <span class="k">en yalın</span>: ikiye ayırır.</p>
<div class="tbl"><table>
<tr><th>Doğa kaynaklı</th><th>İnsan kaynaklı</th></tr>
<tr><td>Deprem, volkan, heyelan, kaya düşmesi; sel, taşkın, kuraklık, çığ; fırtına, hortum, dolu, don; orman yangını, erozyon; salgın hastalıklar ve böcek istilası</td><td>Endüstriyel ve maden kazaları; ulaşım kazaları; nükleer, biyolojik, kimyasal olaylar; büyük yangınlar ve çevre kirlenmeleri; savaş, terör, göç ve mülteci krizleri</td></tr>
</table></div>
<ul>
<li>İki sütun <b>tetikleyicinin</b> ayrımıdır, sorumluluğun değil ("doğa kaynaklı" = insan payı yok demek değil).</li>
<li>Göç neden afet? <b>Kapasite eşiği</b>: kısa sürede barınma, sağlık, beslenme ihtiyacı yerel kapasiteyi aşar.</li>
<li>Bakanlık <b>2018</b>'de kapatıldı; görevleri Cumhurbaşkanlığı Strateji ve Bütçe Başkanlığı'na devredildi.</li>
</ul>

<p><b>b) Özey (2006)</b> — kökene göre; doğal afetler <span class="k">dört</span> grup:</p>
<div class="tbl"><table>
<tr><th>Grup</th><th>Kaynağı</th><th>Örnekler</th></tr>
<tr><td>Jeolojik kökenli</td><td>Yer kabuğu</td><td>Deprem, tsunami, yanardağ, heyelan, kaya düşmesi</td></tr>
<tr><td>Klimatik</td><td>Atmosfer</td><td>Aşırı sıcak/soğuk, kuraklık, kasırga, tayfun, tornado, hortum, yıldırım, dolu, aşırı yağış, tipi, çığ, don ve buzlanma, asit yağışı, iklim değişikliği</td></tr>
<tr><td>Hidrografik</td><td>Su kütleleri</td><td>Akarsu taşkınları, baraj taşkınları ve yıkılmaları, göl sularının aşırı kirlenmesi</td></tr>
<tr><td>Biyolojik</td><td>Toprak ve canlılar</td><td>Erozyon, orman yangınları, doğal hayvan neslinin tükenmesi</td></tr>
</table></div>
<p><span class="warn">Orman yangını: EM-DAT → klimatolojik (tetikleyiciye bakar); Özey → biyolojik (kaynağa bakar).</span> Hata değil, farklı bakış açısı. Kitap: doğal afetlerde insan tetik olabilir, ama olayı hazırlayan faktörler doğal özelliklere dayanır.</p>
<p><b>Özey – beşeri afetler</b> (ikiye):</p>
<div class="tbl"><table>
<tr><th>Sosyal afetler (günlük yaşamdan)</th><th>Teknolojik afetler (teknolojinin yanlış uygulanmasından)</th></tr>
<tr><td>Açlık ve kıtlık; savaş ve terör; bulaşıcı hastalıklar; zoraki göç ve mülteci krizleri; bina, işyeri, eğlence merkezi yangınları; büyük ekonomik krizler (enflasyon, borçlanma)</td><td>Maden kazaları; sanayi kazaları; nükleer, biyolojik, kimyasal silah kullanımı; ulaşım sektöründeki kazalar</td></tr>
</table></div>
<ul>
<li><span class="warn">Ekonomik kriz: Özey afet sayar (sosyal); EM-DAT dahil uluslararası sınıflandırmalar saymaz.</span></li>
<li><span class="warn">Bulaşıcı hastalık: Özey'de beşeri-sosyal; EM-DAT'ta doğa kaynaklı-biyolojik.</span></li>
</ul>

<p><b>c) Oluş hızına göre</b> — müdahale planlaması açısından <span class="k">en işlevsel</span> ayrım.</p>
<div class="tbl"><table>
<tr><th></th><th>Hızlı gelişen (ani)</th><th>Yavaş gelişen (süreç içinde)</th></tr>
<tr><td>Örnekler</td><td>Deprem; su baskını, ani sel; çamur akması, çığ, kaya düşmesi; fırtına, tayfun, hortum, yıldırım; patlama, endüstriyel kaza</td><td>Kuraklık; erozyon ve çölleşme; iklim değişikliği; kıtlık ve açlık; salgın hastalıklar</td></tr>
<tr><td>Kapasite</td><td>Olay anında ne ise odur</td><td>Artırılabilir</td></tr>
<tr><td>Anahtar</td><td>Hazırlık (tatbikat, stok, plan) önceden tamamlanmalı</td><td>Erken uyarı ve izleme</td></tr>
</table></div>
<p>Yavaş gelişen afetlerin trajedisi <b>görünmezliktir</b>: en ölümcüldürler ama deprem kadar haber olmazlar.</p>

<p><b>d) Bryant (1993): "Afetler sınıflandırılamaz"</b></p>
<ul>
<li>Gerekçe: afetler iç içe ve sebep-sonuç ilişkili (deprem → heyelan → baraj yıkılması → sel).</li>
<li>Öneri: <b>31 afet türünü</b> tek tek ve önem sırasına göre ele almak.</li>
<li>Ölçütler: şiddet, süre, etkilenen alan, toplam can kaybı, toplam ekonomik kayıp, sosyal etki, etkinin kalıcılığı.</li>
<li>İlk dört: <b>1. Kuraklık · 2. Tropikal siklon · 3. Bölgesel sel ve taşkınlar · 4. Deprem</b> (kuraklık aylarca sürer, kıtaları etkiler; deprem ~45 sn).</li>
<li><span class="warn">Puan ölçeği 1 = en büyük/önemli → 5 = en küçük/önemsiz (ters okuma!).</span></li>
<li>Önem sırası ülkeye göre değişir: Akdeniz'de kuraklık, sel, orman yangını, heyelan; Türkiye'de deprem başı çeker.</li>
</ul>

<h3>5. Dünya afet istatistikleri</h3>
<p><b>En ölümcül on afet (geçen yüzyıl; Özceylan 2011, Tablo 1.3):</b> <span class="warn">hiçbiri deprem değil</span> — <b>6 kuraklık + 4 sel</b>; hepsi Çin, Hindistan, Sovyet Rusya'da.</p>
<div class="tbl"><table>
<tr><th>Ülke · Tür</th><th>Yaklaşık can kaybı</th></tr>
<tr><td>Çin · Sel</td><td>3.700.000 (en ölümcül tek afet)</td></tr>
<tr><td>Çin · Kuraklık</td><td>3.000.000</td></tr>
<tr><td>Çin · Sel</td><td>2.000.000</td></tr>
<tr><td>Hindistan · Kuraklık</td><td>1.500.000 ve 1.250.000 (iki ayrı olay)</td></tr>
<tr><td>Sovyet Rusya · Kuraklık</td><td>1.200.000 — Volga havzası ve Güney Urallar, 1921</td></tr>
</table></div>
<ul>
<li>Neden kuraklık/sel? (1) yavaş gelişir, müdahale gecikir, "acil" sayılmaz; (2) çok geniş alan; (3) ölüm <b>dolaylı</b> (kıtlık → açlık, hastalık). Müdahale arama-kurtarma değil, <b>halk sağlığı</b> işi.</li>
<li>Coğrafya: kalabalık, tarıma bağımlı, kırılgan nüfuslar → "tehlike değil, <b>zarar görebilirlik</b>".</li>
<li>Sovyet Rusya kaydı: kitap/EM-DAT "Sovyetler Birliği" der, ama SSCB Aralık 1922'de kuruldu. 1920–21 kuraklığı + iç savaş + zorla tahıl toplama + çöken ulaşım → kıtlık. 1,2 milyon EM-DAT rakamı; tarihçi tahminleri ~5 milyona kadar.</li>
</ul>
<p><b>EM-DAT bilançosu (1900–2016):</b></p>
<div class="tbl"><table>
<tr><th>Gösterge</th><th>Değer</th></tr>
<tr><td>Doğa kaynaklı afet</td><td>14.145</td></tr>
<tr><td>Teknolojik afet</td><td>8.361 (≈ toplamın üçte biri)</td></tr>
<tr><td>Can kaybı (doğal afetler, 1900'den beri)</td><td>≈ 33 milyon (Türkiye nüfusunun ~1/3'ü)</td></tr>
<tr><td>Evsiz kalan</td><td>174 milyon</td></tr>
<tr><td>Toplam maddi kayıp</td><td>≈ 3 trilyon $ (yalnızca doğrudan kayıp)</td></tr>
</table></div>
<p><b>Afetler artıyor mu?</b> EM-DAT grafikleri 1980'lerden itibaren ciddi artış gösterir. Nedenler:</p>
<ul>
<li><b>Gerçek artış:</b> iklim değişikliğiyle aşırı hava olaylarının sıklık/şiddeti artıyor.</li>
<li><b>Maruziyet artışı:</b> hızlı nüfus artışı, çarpık kentleşme.</li>
<li><b>Zarar görebilirlik artışı:</b> yanlış arazi kullanımı, yer seçimi, çevre kirliliği, doğal dengenin bozulması.</li>
<li><b>Kayıt kapasitesi artışı:</b> haberleşme/kayıt sistemleri geliştikçe daha çok olay kayda geçiyor (1920'de Afrika içindeki sel kaydedilmezdi).</li>
<li>Dünya Bankası: plansız şehirleşme sürerse <b>2050</b>'de deprem, fırtına ve sele maruz kalan insan sayısı <b>iki katına çıkarak 1,5 milyar</b> olacak.</li>
</ul>
<p><b>En maliyetli beş afet (1980–2011)</b> — hepsi gelişmiş ülkelerde:</p>
<div class="tbl"><table>
<tr><th>Sıra · Ülke, yıl</th><th>Olay</th><th>Kayıp</th></tr>
<tr><td>1. Japonya, 2011</td><td>Deprem ve tsunami</td><td>210 milyar $</td></tr>
<tr><td>2. ABD, 2005</td><td>Katrina Kasırgası</td><td>125 milyar $</td></tr>
<tr><td>3. Japonya, 1995</td><td>Kobe depremi</td><td>100 milyar $</td></tr>
<tr><td>4. Çin, 2008</td><td>Wenchuan depremi</td><td>85 milyar $</td></tr>
<tr><td>5. ABD, 1994</td><td>Northridge depremi</td><td>44 milyar $</td></tr>
</table></div>
<ul>
<li><span class="warn">En maliyetli → gelişmiş ülkeler; en ölümcül → yoksul ülkeler.</span> Gelişmişte kaybedilecek değer fazla, can kaybı düşük (sağlam yapı, çalışan sistem).</li>
<li>Mutlak kayıp ≠ göreli etki: yoksul ülkedeki küçük kayıp millî gelire oranla çok daha yıkıcı olabilir.</li>
<li>En maliyetli listede en çok tekrar eden tür: <b>deprem</b>.</li>
</ul>
<p><b>Dünya Bankası:</b> doğa kaynaklı afetlerin <span class="k">%9</span>'u az gelişmiş ülkelerde, ama can kaybının <span class="k">%48</span>'i orada. Mesaj: "<b>direnç kültürü</b>" geliştirilmeli; <b>önleme bütçeleri en az yardım bütçeleri kadar</b> büyütülmeli — önleme, müdahaleden ucuzdur.</p>

<h3>6. Türkiye afet istatistikleri</h3>
<p>Kitabın uyarısı: Türkiye'de afet sayıları hakkında doğru ve güvenilir bilgiye ulaşmak son derece zordur.</p>
<p><b>Türkiye'nin afet profili — Barış (2012):</b> başlıca dört tip: deprem, heyelan, sel, yangınlar.</p>
<div class="tbl"><table>
<tr><th>Afet</th><th>Rakamlar</th></tr>
<tr><td>Deprem</td><td>Nüfusun <b>%70</b>'i çok yüksek tehlikeli bölgede; ülkenin <b>%66</b>'sı aktif fay bölgesinde; geçen yüzyılda hasar gören binaların <b>%75</b>'i ve toplam afet kayıplarının <b>%64</b>'ü depremden</td></tr>
<tr><td>Heyelan</td><td>Toprakların <b>%25</b>'i maruz; nüfusun <b>%11</b>'i heyelanlı bölgede; zararların <b>%16</b>'sı</td></tr>
<tr><td>Sel</td><td>Orman kayıpları, erozyon, bilgisiz gelişme → çok savunmasız; zararların <b>%15</b>'i; yıllık ~<b>100 milyon $</b></td></tr>
<tr><td>Yangınlar</td><td>Her yıl çok sayıda orman, işyeri, konut yangını</td></tr>
</table></div>
<ul>
<li><b>Aktif fay:</b> son <b>10.000 yıl</b> içinde hareket etmiş, yeniden kırılma potansiyeli taşıyan fay.</li>
<li>Kitaptaki "yıllık kayıp GSMH'nin %3'ü" tahmini 2023 depremleri sonrası geçerliliğini yitirdi.</li>
</ul>
<p><b>Afetzede</b> (AFAD 2014; <b>7269 sayılı Umumi Hayata Müessir Afetler Kanunu, 1959</b> — Türkiye'nin temel afet kanunu): olmuş ya da olması muhtemel afet ve acil durumlardan dolayı <b>fiziksel, sosyal ve ekonomik</b> yönden zarara uğrayan <b>veya uğraması muhtemel</b> kişi.</p>
<ul>
<li><span class="warn">Yalnızca yaralanan değil!</span> Risk nedeniyle tahliye edilen, zarar görmemiş aile de afetzededir.</li>
<li>Bu genişlik, "etkilenen sayısı"nın can kaybından çok büyük olmasını açıklar. Sağlık planlaması <b>etkilenen sayısına</b> göre yapılır (barınma, beslenme, kronik ilaç, psikososyal destek).</li>
<li>AFAD: Türkiye'de afet yönetiminden sorumlu merkezî kurum.</li>
</ul>
<p><b>Olay sayısı ≠ afetzede sayısı — Gökçe vd. (2008), 1950–2008:</b> toplam <b>29.807 olay</b>, <b>284.996 afetzede</b> (günde ortalama ~1,5 olay).</p>
<div class="tbl"><table>
<tr><th>Tür</th><th>Olay</th><th>Afetzede</th></tr>
<tr><td>Heyelan</td><td>13.494 (en sık)</td><td>59.345 (olay başına 4-5)</td></tr>
<tr><td>Deprem</td><td>5.318 (heyelanın yarısından az)</td><td>158.241 (toplamın yarısından fazlası; olay başına ~30)</td></tr>

<tr><td>Çığ</td><td>731 (en az)</td><td>4.384 (olay başına etkisi yüksek)</td></tr>
</table></div>
<p><span class="warn">En sık = heyelan; en çok insanı etkileyen = deprem. Sıklık ≠ etki.</span> Heyelan kırsalda birkaç evi, deprem şehri vurur. 112/UMKE planlaması sıklığa değil etkiye göre yapılır. Veriler 2011 Van ve 2023 Kahramanmaraş depremlerini içermez.</p>
