<title>Temel Afet Bilgisi Soru Bankası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: tek sütun çalışma defteri; set menüsünde üç çalışma modu (test / kart / özet) */
:root{
  --bg:#f3f6f6;
  --surface:#ffffff;
  --fg:#17292c;
  --muted:#5a6f72;
  --accent:#0b7285;
  --accent-ink:#ffffff;
  --accent-soft:#e1f0f3;
  --line:#d7e2e3;
  --good:#2b7a3f;
  --good-soft:#e5f3e8;
  --bad:#b3362e;
  --bad-soft:#faeae8;
  --chip:#eef3f3;
  --display:'Lora',Georgia,'Times New Roman',serif;
  --body:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1719; --surface:#172124; --fg:#e6eef0; --muted:#9db0b3;
    --accent:#5cc0d4; --accent-ink:#06282e; --accent-soft:#113640;
    --line:#2a383b; --good:#7ccb8c; --good-soft:#163420; --bad:#e8847c; --bad-soft:#3a1d1a;
    --chip:#1f2b2e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#172124; --fg:#e6eef0; --muted:#9db0b3;
  --accent:#5cc0d4; --accent-ink:#06282e; --accent-soft:#113640;
  --line:#2a383b; --good:#7ccb8c; --good-soft:#163420; --bad:#e8847c; --bad-soft:#3a1d1a;
  --chip:#1f2b2e; color-scheme:dark;
}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--body); font-size:16px; line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 48px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.wrap{max-width:740px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button{font-family:var(--body);cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- ana ekran ---------- */
.masthead{padding:34px 0 10px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.masthead h1{font-size:clamp(28px,6vw,38px);font-weight:700;margin-top:6px}
.masthead p{color:var(--muted);margin:10px 0 0;max-width:58ch}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.stat{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.stat b{color:var(--fg);font-variant-numeric:tabular-nums}
.sets{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.set-card{display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--fg)}
.set-card:hover{border-color:var(--accent)}
.set-num{flex:none;width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;font-weight:700}
.set-card.special .set-num{background:var(--accent);color:var(--accent-ink)}
.set-body{min-width:0;flex:1}
.set-title{font-weight:800;font-size:16px}
.set-desc{color:var(--muted);font-size:13.5px;margin-top:2px}
.set-meta{display:flex;gap:10px;margin-top:7px;font-size:12.5px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.set-meta .best{color:var(--good)}
.go{flex:none;color:var(--accent);font-size:22px;font-weight:800}
.note{color:var(--muted);font-size:13px;margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:18px}
.plan .label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.plan ol{margin:8px 0 0;padding-left:20px;font-size:14px;color:var(--fg)}
.plan li{margin:3px 0}
.plan b{color:var(--accent)}

/* ---------- set menüsü ---------- */
.menu-head{padding:26px 0 4px}
.menu-head h2{font-size:clamp(22px,5vw,28px)}
.menu-head p{color:var(--muted);margin:8px 0 0}
.modes{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--fg)}
.mode:hover{border-color:var(--accent)}
.mode .ic{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--accent-soft)}
.mode .t{font-weight:800;font-size:15.5px}
.mode .d{color:var(--muted);font-size:13px;margin-top:2px}

/* ---------- soru ekranı ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn-ghost{background:none;border:none;color:var(--muted);font-size:14px;font-weight:700;padding:6px 8px;border-radius:8px}
.btn-ghost:hover{color:var(--accent)}
.counts{font-size:13.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.counts .ok{color:var(--good)} .counts .no{color:var(--bad)}
.bar{height:6px;background:var(--chip);border-radius:999px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s}
.quiz-set-name{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:18px 0 6px}
.qtext{font-family:var(--display);font-size:clamp(18px,4.2vw,22px);font-weight:600;line-height:1.45;margin:4px 0 18px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;
  color:var(--fg);font-size:15.5px;line-height:1.45}
.opt:not(:disabled):hover{border-color:var(--accent);background:var(--accent-soft)}
.opt .key{flex:none;width:26px;height:26px;border-radius:8px;background:var(--chip);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--muted)}
.opt span.txt{min-width:0}
.opt:disabled{cursor:default}
.opt.dim{opacity:.55}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .key{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.verdict{margin-top:16px;font-weight:800;font-size:15px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.explain{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:0 12px 12px 0;padding:13px 15px}
.explain .label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.explain p{margin:6px 0 0;font-size:14.5px;color:var(--fg)}
.explain p b,.review-item .re b,.flash-exp b{color:var(--accent)}
.nextrow{display:flex;justify-content:flex-end;margin-top:16px}
.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:11px;
  padding:12px 22px;font-size:15px;font-weight:800}
.btn:hover{filter:brightness(1.06)}
.btn.secondary{background:var(--chip);color:var(--fg);border:1px solid var(--line)}
.btn.badbtn{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.btn.goodbtn{background:var(--good);color:#fff}
.hint-keys{color:var(--muted);font-size:12.5px;margin-top:14px}

/* ---------- bilgi kartları ---------- */
.flash-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin-top:16px;min-height:200px;display:flex;flex-direction:column}
.flash-q{font-family:var(--display);font-size:clamp(17px,4vw,21px);font-weight:600;line-height:1.5}
.flash-back{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.flash-ctx{color:var(--muted);font-size:14px;line-height:1.5}
.flash-ans{font-family:var(--display);font-weight:700;color:var(--accent);font-size:clamp(18px,4.4vw,22px);line-height:1.4;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.flash-card .flash-exp{font-size:15.5px;line-height:1.6;margin-top:0}
.flash-actions .btn:disabled{opacity:.45;cursor:default}
.flash-exp{font-size:14.5px;color:var(--fg);margin-top:8px}
.flash-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.flash-tag{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.flash-tag .again{color:var(--bad)}

/* ---------- özet ---------- */
.sum h3{font-size:17px;margin:24px 0 8px;color:var(--accent)}
.sum p{font-size:14px;margin:6px 0}
.sum ul{margin:6px 0;padding-left:20px;font-size:14px}
.sum li{margin:3px 0}
.sum .tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.sum table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:430px}
.sum th{background:var(--accent-soft);color:var(--accent);text-align:left;padding:8px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.sum td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
.sum td:first-child{font-weight:800;white-space:nowrap}
.sum .k{color:var(--accent);font-weight:800}
.sum .warn{color:var(--bad);font-weight:700}
.sum .okk{color:var(--good);font-weight:700}

/* ---------- sonuç ekranı ---------- */
.result-head{text-align:center;padding:34px 0 8px}
.score-ring{width:128px;height:128px;margin:0 auto;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:
  conic-gradient(var(--good) calc(var(--p)*1%), var(--chip) 0)}
.score-ring > div{width:100px;height:100px;border-radius:50%;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring b{font-size:26px;font-variant-numeric:tabular-nums}
.score-ring small{color:var(--muted);font-weight:700;font-size:12px}
.result-head h2{font-size:24px;margin-top:14px}
.result-head p{color:var(--muted);margin:6px 0 0}
.result-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0 8px}
.review h3{font-size:18px;margin:26px 0 10px}
.review-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:10px}
.review-item .rq{font-weight:700;font-size:14.5px}
.review-item .ra{font-size:13.5px;margin-top:8px}
.review-item .ra .you{color:var(--bad);font-weight:700}
.review-item .ra .cor{color:var(--good);font-weight:700}
.review-item .re{font-size:13.5px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.perfect{color:var(--good);font-weight:800}
</style>

<script>
const SETS = [{"title": "Afet Kavramı: Tehlike, Zarar Görebilirlik, Risk", "desc": "Afetin tanımı ve üç koşulu, afet–acil durum farkı, doğal afet tartışması, tehlike-maruziyet-zarar görebilirlik-kapasite, risk formülü, afetin büyüklüğünü belirleyen sekiz faktör, karşılaştırma ölçütleri, doğrudan-dolaylı-ikincil etkiler, ikincil afet ve sağlık boyutu", "short": "Afet Kavramı", "questions": [{"q": "6 Şubat 2023 Kahramanmaraş depremlerine ait resmî verilere göre can kaybı ve yaralı sayısı aşağıdakilerden hangisinde doğru verilmiştir?", "opts": [{"t": "107.213 can kaybı – 53.537 yaralı"}, {"t": "45.000 can kaybı – 115.000 yaralı"}, {"t": "53.537 can kaybı – 11.000 yaralı"}, {"t": "316.000 can kaybı – 107.213 yaralı"}, {"t": "53.537 can kaybı – 107.213 yaralı"}], "a": 4, "exp": "Resmî verilere göre 6 Şubat 2023 depremlerinde **53.537 can kaybı** ve **107.213 yaralı** vardır; **11 il** etkilenmiştir. Yaralı sayısı can kaybının yaklaşık iki katıdır; ikisini yer değiştiren şık bu yüzden yanlıştır. 316.000, Haiti hükûmetinin 2010 depremi için açıkladığı rakamdır.\n💡 Kabaca: ~53 bin ölü, ~107 bin yaralı → yaralı ≈ 2 × ölü."}, {"q": "6 Şubat 2023 depremlerinden etkilenen bölge için aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "7 il etkilendi; bölgede ülke nüfusunun yaklaşık yarısı yaşıyordu"}, {"t": "11 il etkilendi; bölgede ülke nüfusunun yaklaşık onda biri yaşıyordu"}, {"t": "16 il etkilendi; bölgede ülke nüfusunun yaklaşık üçte biri yaşıyordu"}, {"t": "11 il etkilendi; bölgede ülke nüfusunun yaklaşık altıda biri yaşıyordu"}, {"t": "6 il etkilendi; bölgede ülke nüfusunun yaklaşık altıda biri yaşıyordu"}], "a": 3, "exp": "Tek bir olay **11 ili** birden etkiledi ve bu illerde yaşayan nüfus, **ülke nüfusunun yaklaşık altıda birine** denk geliyordu. Bu iki sayı, olayın ölçeğinin ve maruziyetin ne kadar büyük olduğunu gösterir.\n💡 \"11 il, 1/6 nüfus\": tek olay, ülkenin altıda biri."}, {"q": "6 Şubat 2023'te Kahramanmaraş'ta yaşanan iki büyük depremle ilgili aşağıdaki eşleştirmelerden hangisi doğrudur?", "opts": [{"t": "04:17 Pazarcık merkezli Mw 7.7 – 13:24 Elbistan merkezli Mw 7.6"}, {"t": "04:17 Elbistan merkezli Mw 7.7 – 13:24 Pazarcık merkezli Mw 7.6"}, {"t": "04:17 Pazarcık merkezli Mw 7.6 – 13:24 Elbistan merkezli Mw 7.7"}, {"t": "04:17 Pazarcık merkezli Mw 7.0 – 13:24 Elbistan merkezli Mw 8.8"}, {"t": "13:24 Pazarcık merkezli Mw 7.7 – 04:17 Elbistan merkezli Mw 7.6"}], "a": 0, "exp": "İki deprem aynı gün, yaklaşık **dokuz saat arayla** oldu: saat **04:17'de Pazarcık** merkezli **Mw 7.7** (Doğu Anadolu Fay Zonu, **Narlı segmenti**) ve saat **13:24'te Elbistan** merkezli **Mw 7.6** (**Çardak fayı**). Mw 7.0 ve 8.8, sırasıyla 2010 Haiti ve Şili depremlerinin büyüklükleridir.\n💡 \"Önce Pazarcık, sonra Elbistan; önce büyük (7.7), sonra biraz küçük (7.6).\""}, {"q": "6 Şubat 2023 depremlerinde ilk (Pazarcık merkezli) deprem hangi fay yapısı üzerinde gerçekleşmiştir?", "opts": [{"t": "Kuzey Anadolu Fay Zonu'nun Düzce segmenti"}, {"t": "Doğu Anadolu Fay Zonu'nun Narlı segmenti"}, {"t": "Çardak fayı"}, {"t": "Ölü Deniz Fay Zonu'nun Hatay segmenti"}, {"t": "Batı Anadolu graben sistemi"}], "a": 1, "exp": "Pazarcık merkezli Mw 7.7 deprem **Doğu Anadolu Fay Zonu'nun Narlı segmentinde**, Elbistan merkezli ikinci deprem ise **Çardak fayında** gerçekleşmiştir. Birinci depremin yüzey kırığı yüzlerce kilometre uzunluğundadır; Türkiye'nin aletsel dönemde kaydettiği en büyük depremlerden biridir."}, {"q": "6 Şubat 2023 depremlerinde hem enkaz altındaki sağkalımı hem de müdahale hızını doğrudan etkileyen koşullar arasında hangileri sayılmıştır?\nI. Kış ortasında olması\nII. Gece yarısından sonra olması\nIII. Karlı havada olması\nIV. Tsunami oluşturması", "opts": [{"t": "Yalnız I"}, {"t": "I ve III"}, {"t": "I, II ve III"}, {"t": "II, III ve IV"}, {"t": "I, II, III ve IV"}], "a": 2, "exp": "Depremler **kış ortasında**, **gece yarısından sonra** ve **karlı havada** oldu; bu üç koşul enkaz altındaki sağkalımı ve müdahale hızını doğrudan etkiledi. **Tsunami** ise 2010 **Şili** depreminin özelliğidir (Şili'deki can kaybının önemli kısmı tsunamiden kaynaklanmıştır)."}, {"q": "Ders materyaline göre Türkiye'nin sık karşılaştığı olaylarla ilgili aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Coğrafi konumu nedeniyle yalnızca deprem ve sel gibi doğa kaynaklı olaylarla karşılaşır, teknolojik afet yaşamaz"}, {"t": "Jeolojik yapısı nedeniyle en sık karşılaştığı olay, deprem değil volkanik patlamalardır"}, {"t": "Endüstriyel ve ulaşım kazaları Türkiye'de görülse de bunlar afet kapsamında değerlendirilmez"}, {"t": "Çığ ve hortum, Türkiye'nin coğrafi konumu nedeniyle görülmeyen olaylardır"}, {"t": "Doğa kaynaklı olayların yanında endüstriyel ve ulaşım kazaları gibi teknolojik afetlerle de sık karşılaşır"}], "a": 4, "exp": "Türkiye, **coğrafi konumu ve jeolojik yapısı** nedeniyle başta **deprem** olmak üzere sel, heyelan, kaya düşmesi, çığ, orman yangını ve hortum gibi doğa kaynaklı olaylarla; ayrıca **endüstriyel ve ulaşım kazaları** gibi **teknolojik afetlerle** sık karşılaşır. Çığ ve hortum listede açıkça sayılmıştır."}, {"q": "2010 Haiti (Mw 7.0) ve Şili (Mw 8.8) depremleri arasındaki 1,8 birimlik büyüklük farkı, açığa çıkan enerji açısından yaklaşık ne anlama gelir?", "opts": [{"t": "Şili depremi yaklaşık 1,8 kat daha fazla enerji açığa çıkardı"}, {"t": "Şili depremi yaklaşık 18 kat daha fazla enerji açığa çıkardı"}, {"t": "Haiti depremi sığ olduğu için daha fazla enerji açığa çıkardı"}, {"t": "Şili depremi yaklaşık 500 kat daha fazla enerji açığa çıkardı"}, {"t": "Şili depremi yaklaşık 50.000 kat daha fazla enerji açığa çıkardı"}], "a": 3, "exp": "Büyüklük ölçeği **logaritmiktir**: 1,8 birimlik fark 10^(1,5 × 1,8) ≈ **500 kat** enerji demektir. Yani Şili depremi tehlike olarak çok daha büyüktü; buna rağmen can kaybı yüzlerce kat azdı.\n💡 Her 1 birim büyüklük ≈ 32 kat enerji; 2 birim ≈ 1000 kat."}, {"q": "12 Ocak 2010 Haiti depremi için aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Merkez üssü başkentin ~25 km batısında, ~13 km derinlikte sığ bir depremdi"}, {"t": "Merkez üssü Maule açıklarında, denizdeydi ve kıyıları vuran bir tsunami oluşturdu"}, {"t": "Odak derinliği ~35 km olan, kırsal bir bölgede gerçekleşen bir depremdi"}, {"t": "Mw 8.8 büyüklüğündeydi ve ülkenin en seyrek nüfuslu bölgesini etkiledi"}, {"t": "Merkez üssü başkentin ~250 km uzağında olduğu için başkent neredeyse hiç etkilenmedi"}], "a": 0, "exp": "**Haiti (Mw 7.0, 12 Ocak 2010)**: merkez üssü başkent **Port-au-Prince'in ~25 km batısı**, odak derinliği **~13 km** (sığ), ülkenin **en yoğun nüfuslu** bölgesi. **Maule açıkları, ~35 km derinlik ve tsunami** ise **Şili (Mw 8.8, 27 Şubat 2010)** depremine aittir."}, {"q": "27 Şubat 2010 Şili depremine ait özellikler aşağıdakilerin hangisinde birlikte verilmiştir?", "opts": [{"t": "Mw 7.0 – Maule açıkları (deniz) – ~13 km derinlik – tsunami"}, {"t": "Mw 8.8 – Maule açıkları (deniz) – ~35 km derinlik – tsunami"}, {"t": "Mw 8.8 – başkentin 25 km batısı – ~13 km derinlik – heyelan"}, {"t": "Mw 9.5 – Valdivia – ~35 km derinlik – tsunami yok"}, {"t": "Mw 7.6 – Santiago merkez – ~25 km derinlik – kolera salgını"}], "a": 1, "exp": "Şili depremi **27 Şubat 2010**, **Mw 8.8**; merkez üssü **Maule bölgesi açıklarında, denizde**, odak derinliği **~35 km**; ayrıca **tsunami** oluşturdu. Mw 9.5 Valdivia, Şili'nin **1960** depremidir; Mw 7.0 ve 13 km Haiti'ye aittir."}, {"q": "Haiti 2010 depremindeki can kaybı için ders materyalinde hangi bilgi verilmiştir?", "opts": [{"t": "Tahminler 100.000–316.000 arasındadır; bu belirsizlik de kurumsal çöküşün bir bulgusudur"}, {"t": "Resmî can kaybı kesin olarak 525'tir ve bağımsız çalışmalarla da doğrulanmıştır"}, {"t": "Can kaybı yaklaşık 53.537'dir; resmî veri ile bağımsız tahminler örtüşür"}, {"t": "Can kaybının büyük kısmı depremin ardından gelen tsunamiden kaynaklanmıştır"}, {"t": "Can kaybı, daha güçlü olan Şili depremindeki kayıpla yaklaşık aynıdır"}], "a": 0, "exp": "Haiti için tek sayı verilmez: hükûmetin açıkladığı rakam **~316.000**, bağımsız çalışmalarda **100.000–160.000**. Bu belirsizliğin kendisi bir bulgudur: **kurumsal kapasitesi çökmüş bir ülke kaybını sayamaz bile**. ~525 Şili'nin can kaybıdır ve önemli kısmı **tsunamiden** kaynaklanır."}, {"q": "2010 Şili depreminde resmî can kaybı ve bunun önemli bir kısmının nedeni için aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Yaklaşık 5.250; önemli kısmı bina çökmeleri nedeniyle"}, {"t": "Yaklaşık 525; önemli kısmı deprem sonrası kolera salgını nedeniyle"}, {"t": "Yaklaşık 525; önemli kısmı depremin ardından gelen tsunami nedeniyle"}, {"t": "Yaklaşık 52.500; önemli kısmı tsunami nedeniyle"}, {"t": "Yaklaşık 316.000; önemli kısmı yangınlar nedeniyle"}], "a": 2, "exp": "Şili'de resmî can kaybı **yaklaşık 525**'tir ve bunun önemli bir kısmı depremin değil, ardından gelen **tsunaminin** sonucudur. **Kolera salgını** Şili'de değil, **Haiti'de** (Ekim 2010'dan itibaren) yaşanmıştır; Şili'de altyapı ve sağlık sistemi ayakta kaldığı için salgın olmadı.\n💡 \"500 kat güçlü deprem, yüzlerce kat az ölüm.\""}, {"q": "Haiti ve Şili 2010 depremlerinin sonuçları arasındaki farkı yaratan dört başlık arasında aşağıdakilerden hangisi YOKTUR?", "opts": [{"t": "Yapı stoku"}, {"t": "Kurumsal kapasite"}, {"t": "Toplumsal hazırlık"}, {"t": "Depremin odak derinliği"}, {"t": "Ekonomik durum"}], "a": 3, "exp": "Farkı yaratan dört şey: **yapı stoku**, **kurumsal kapasite**, **toplumsal hazırlık** ve **ekonomik durum** — \"**hiçbiri depremle ilgili değil**\". Odak derinliği depremin (tehlikenin) fiziksel bir özelliğidir; sonucu belirleyen tehlike değil, toplumun **kırılganlığı ve kapasitesi** olmuştur."}, {"q": "Şili'nin 2010'daki büyük depremi görece az kayıpla atlatmasının arka planında, ülkenin katı deprem yönetmeliğini ve güçlü yapı denetimi geleneğini kurmasına yol açan olay hangisidir?", "opts": [{"t": "2010 Maule depremi (Mw 8.8)"}, {"t": "1999 Kocaeli depremi (Mw 7.6)"}, {"t": "1960 Valdivia depremi (Mw 7.0)"}, {"t": "2010 Port-au-Prince depremi (Mw 7.0)"}, {"t": "1960 Valdivia depremi (Mw 9.5)"}], "a": 4, "exp": "Şili, **1960'ta** dünyada aletsel dönemde kaydedilmiş **en büyük depremi** (**Valdivia, Mw 9.5**) yaşamış ve yönetmeliğini o acıdan sonra kurmuştur. Maule 2010 depreminin kendisidir; Port-au-Prince Haiti'nin başkentidir.\n💡 Valdivia 9.5 = aletsel dönemin rekoru."}, {"q": "Haiti'de 2010 depreminden sonra aynı yılın ekim ayında başlayıp çökmüş su ve sanitasyon altyapısı üzerinde yıllarca süren kolera salgını, hangi kavramın en net örneği olarak verilmiştir?", "opts": [{"t": "Dolaylı sağlık sonucu"}, {"t": "Doğrudan sağlık sonucu"}, {"t": "İkincil etki olarak bütçe kaybı"}, {"t": "Maruziyet"}, {"t": "Olayın fiziksel büyüklüğü"}], "a": 0, "exp": "Kolera salgını depremin anında yol açtığı bir yaralanma değil, çöken su-sanitasyon altyapısı üzerinden zamanla ortaya çıkan bir sonuçtur: **dolaylı sağlık sonucu**. Travma, crush sendromu gibi sonuçlar ise **doğrudan** sağlık sonuçlarıdır. Şili'de altyapı ve sağlık sistemi ayakta kaldığı için salgın yaşanmadı."}, {"q": "Haiti–Şili karşılaştırmasından çıkan ana ders aşağıdakilerden hangisidir?", "opts": [{"t": "Daha büyük deprem her zaman daha çok can kaybına yol açar"}, {"t": "Sığ depremler derin depremlerden daha az zarar verir"}, {"t": "Sonucu tehlike değil, toplumun kırılganlığı ve kapasitesi belirledi"}, {"t": "Tsunami oluşturan depremler en yıkıcı depremlerdir"}, {"t": "Can kaybını belirleyen tek etken nüfus yoğunluğudur"}], "a": 2, "exp": "Tehlike Şili'de kat kat büyüktü (≈500 kat enerji), yine de sonuç Şili'nin lehine çıktı. **Sonucu belirleyen tehlike değil, toplumun kırılganlığı (zarar görebilirliği) ve kapasitesi** oldu. Bu örnek, risk formülünün (R = T × ZG ÷ K) somut hâlidir: Şili'de zarar görebilirlik düşük, kapasite yüksekti.\n💡 \"Deprem öldürmez, bina öldürür\" — ama binayı yapan, denetlemeyen ve hazırlanmayan da insandır."}, {"q": "\"Afet\" kelimesiyle ilgili aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Türkçeye Farsçadan geçmiştir; \"yıldızların ters dizilişi\" anlamına gelir"}, {"t": "Türkçeye Arapçadan geçmiştir; TDK sözlüğünde \"kıran\" karşılığıyla da verilir"}, {"t": "Öz Türkçe bir kelimedir; \"toplumun baş edememesi\" anlamına gelir"}, {"t": "Türkçeye Latinceden geçmiştir; dis + astro köklerinden oluşur"}, {"t": "Türkçeye Arapçadan geçmiştir; TDK'da \"acil durum\" karşılığıyla verilir"}], "a": 1, "exp": "**Afet** Türkçeye **Arapçadan** geçmiştir; TDK sözlüğünde \"**çeşitli doğa olaylarının sebep olduğu yıkım**\" ve \"**kıran**\" karşılıklarıyla verilir. \"Dis + astro / yıldızların ters dizilişi\" İngilizce **disaster** kelimesinin kökenidir."}, {"q": "İngilizce \"disaster\" kelimesinin kökeni ve bu kökenin yansıttığı dünya görüşü hangisidir?", "opts": [{"t": "dis (ayrı) + aster (çiçek): doğanın düzeninin bozulması"}, {"t": "disa (yıkım) + ster (toplum): toplumsal çöküş"}, {"t": "dis (kötü) + astro (yıldızlar): afetin insan kararlarıyla oluştuğunu vurgulayan bir görüş"}, {"t": "dis (kötü) + astro (yıldızlar): felaketi göklere, kadere bağlayan bir görüş"}, {"t": "Arapça kökenli: çeşitli doğa olaylarının sebep olduğu yıkım"}], "a": 3, "exp": "**Disaster = dis (istenmeyen, kötü) + astro (yıldızlar)**: kökeninde \"**yıldızların ters dizilişi**\" yatar; felaketi **göklere, kadere** bağlar. Hem \"afet\" hem \"disaster\" afeti dışarıdan gelen, kaçınılmaz bir güç olarak resmeder; **modern afet bilimi ise tersini** söyler: afetin büyüklüğünü belirleyen, olayın kendisi kadar toplumun hazırlığıdır.\n💡 \"Astro\" → astronomi: yıldızlar. Dis-aster = kötü yıldız."}, {"q": "AFAD'ın Açıklamalı Afet Yönetimi Terimleri Sözlüğü'ndeki afet tanımında, afeti acil durumdan ayıran en kritik ifade hangisidir?", "opts": [{"t": "Doğa, teknoloji veya insan kaynaklı olması"}, {"t": "Fiziksel, ekonomik ve sosyal kayıplar doğurması"}, {"t": "Etkilenen toplumun baş etme kapasitesinin yeterli olmadığı"}, {"t": "Toplumun tamamını etkilemesi"}, {"t": "Belirli bir büyüklüğün üzerinde can kaybına yol açması"}], "a": 2, "exp": "AFAD tanımında en kritik ifade \"**etkilenen toplumun baş etme kapasitesinin yeterli olmadığı**\" kısmıdır. **Baş etme kapasitesi yeterliyse o olay afet değil, acil durumdur.** Tanım \"toplumun tamamı **veya belli kesimleri**\" der; yani tamamını etkilemesi gerekmez. Tanımda belirli bir ölü sayısı eşiği yoktur."}, {"q": "AFAD'ın afet tanımına göre afete neden olan olayın kaynağı için aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Yalnızca doğa kaynaklı olabilir"}, {"t": "Yalnızca doğa ve teknoloji kaynaklı olabilir"}, {"t": "Yalnızca insan kaynaklı olabilir"}, {"t": "Kaynağı tanımda belirtilmez; yalnızca can kaybına bakılır"}, {"t": "Doğa, teknoloji veya insan kaynaklı olabilir"}], "a": 4, "exp": "AFAD tanımı: \"…etkilenen toplumun baş etme kapasitesinin yeterli olmadığı **doğa, teknoloji veya insan kaynaklı** olaydır.\" Tanım ayrıca **fiziksel, ekonomik ve sosyal kayıplar** doğurmayı ve **normal hayatı ve insan faaliyetlerini durdurmayı/kesintiye uğratmayı** içerir."}, {"q": "Bir olayın afet sayılabilmesi için birlikte aranan koşullarla ilgili aşağıdakilerden hangileri doğrudur?\nI. Can, mal veya çevre kaybı doğurmalıdır.\nII. Yerel imkân ve kaynaklarla üstesinden gelinememelidir.\nIII. Bir yerleşme birimindeki insan faaliyetlerini bozmalı veya durdurmalıdır.\nIV. Doğa kaynaklı bir olay tarafından tetiklenmelidir.", "opts": [{"t": "I ve II"}, {"t": "I, II ve III"}, {"t": "II ve III"}, {"t": "I, III ve IV"}, {"t": "I, II, III ve IV"}], "a": 1, "exp": "Üç koşul **birlikte** aranır: **kayıp doğurmalı**, **kapasiteyi aşmalı** (yerel imkânlarla baş edilememeli) ve **hayatı kesintiye uğratmalı**. IV yanlıştır: AFAD tanımına göre afet **doğa, teknoloji veya insan kaynaklı** olabilir.\n💡 \"Kayıp – Kapasite – Kesinti\": üç K."}, {"q": "Tek araçlı bir trafik kazasına 112 ekibi gönderiliyor ve ekip olayla kendi imkânlarıyla baş ediyor. Bu olay afet tanımı açısından nasıl sınıflandırılır?", "opts": [{"t": "Afet; çünkü can kaybı riski vardır"}, {"t": "İkincil afet; çünkü ulaşım kazasıdır"}, {"t": "Teknolojik afet; çünkü araç kazası insan kaynaklıdır"}, {"t": "Acil durum; çünkü baş etme kapasitesi yeterlidir"}, {"t": "Afet; çünkü normal hayatı kesintiye uğratır"}], "a": 3, "exp": "Olay yerel kaynaklarla yönetilebiliyorsa **acil durumdur**. Afet ile acil durumu ayıran çizgi **kaynak sınırıdır**. Çok sayıda yaralılı bir olayda kaynak yetmediğinde aynı tür olay **afete dönüşür** ve bakım mantığı da değişir (triyaj)."}, {"q": "\"Etkilenen toplumun baş etme kapasitesi yeterliyse\" o olaya ne ad verilir?", "opts": [{"t": "İkincil afet"}, {"t": "Acil durum"}, {"t": "Doğal afet"}, {"t": "Tehlike"}, {"t": "Maruziyet"}], "a": 1, "exp": "Baş etme kapasitesi yeterliyse olay **afet değil, acil durumdur**. Fark kaynak sınırındadır: acil durumda toplum kendi imkânlarıyla baş edebilir, **afette baş edemez ve dışarıdan destek gerekir**. Bu, ders kitabının \"Araştır\" sorusunun da cevabıdır."}, {"q": "Okyanusun ortasında, hiçbir yerleşim ve yapının bulunmadığı bir bölgede büyük bir deprem oluyor; sismograflar kaydediyor ancak kimse etkilenmiyor. Bu olay için aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Bir doğa olayıdır, afet değildir"}, {"t": "Büyüklüğü yüksekse afet sayılır"}, {"t": "Sismograflarca kaydedildiği için afettir"}, {"t": "Acil durumdur"}, {"t": "Potansiyel afet olduğu için ikincil afettir"}], "a": 0, "exp": "İnsanların yaşamadığı, hiçbir varlık ve yapının bulunmadığı bir yerde meydana gelen deprem, heyelan, sel veya volkanik patlama **hiçbir zaman afet sayılmaz**: kayıp koşulu sağlanmaz. Olay aynı olaydır; **afeti üreten, orada bir toplumun bulunmasıdır**. Kayıp yoksa yalnızca bir **doğa olayıdır**; kapasite yetiyorsa **acil durumdur**."}, {"q": "Bir olayın afet sayılması için gereken koşullardan biri sağlanmadığında hangi sonuç doğru eşleştirilmiştir?", "opts": [{"t": "Kayıp yoksa acil durumdur; kapasite yetiyorsa doğa olayıdır"}, {"t": "Kayıp yoksa ikincil afettir; kapasite yetiyorsa yine afettir"}, {"t": "Kayıp yoksa yalnızca doğa olayıdır; kapasite yetiyorsa acil durumdur"}, {"t": "Kayıp yoksa tehlikedir; kapasite yetiyorsa maruziyettir"}, {"t": "Koşullardan biri sağlanmasa da olay afet sayılır"}], "a": 2, "exp": "Üç koşul birlikte aranır; biri eksikse olay afet olmaktan çıkar. **Kayıp yoksa** ortada yalnızca bir **doğa olayı** vardır; **kapasite yetiyorsa** olay **acil durumdur**. Diğer şıklar bu iki sonucu ya birbiriyle ya da yanlış kavramlarla (ikincil afet, tehlike, maruziyet) eşleştirir."}, {"q": "\"Afet, bir olayın kendisi değil, doğurduğu sonuçtur\" fikrini anlatan zincirde halkaların doğru sırası hangisidir?", "opts": [{"t": "Maruziyet → Doğa olayı → Kırılganlık → Afet"}, {"t": "Doğa olayı → Kırılganlık → Afet → Maruziyet"}, {"t": "Kırılganlık → Maruziyet → Doğa olayı → Afet"}, {"t": "Doğa olayı → Afet → Maruziyet → Kırılganlık"}, {"t": "Doğa olayı → Maruziyet → Kırılganlık → Afet"}], "a": 4, "exp": "Zincir: **Doğa olayı** (yer kabuğunda enerji boşalır) → **Maruziyet** (orada insanlar ve yapılar vardır) → **Kırılganlık** (yapılar dayanıksız, toplum hazırlıksız) → **AFET** (kayıp, kesinti, baş edememe). Afet zincirin başında değil, **sonundadır**."}, {"q": "Afet zincirinde (doğa olayı → maruziyet → kırılganlık → afet) müdahale edilebilecek halkalar ve afet yönetimindeki karşılıkları için hangisi doğrudur?", "opts": [{"t": "Yalnızca birinci halka; fay hattındaki enerji birikimi önlenebilir"}, {"t": "Birinci ve ikinci halka; mitigasyon birinci halkaya müdahaledir"}, {"t": "Yalnızca dördüncü halka; afet yönetimi sadece müdahale aşamasında çalışır"}, {"t": "İkinci ve üçüncü halka; yer seçimi-imar ikinci halkaya, zarar azaltma (mitigasyon) üçüncü halkaya müdahaledir"}, {"t": "İkinci ve üçüncü halka; yer seçimi-imar üçüncü halkaya, mitigasyon ikinci halkaya müdahaledir"}], "a": 3, "exp": "Zincirin **ilk halkasını değiştiremeyiz** (deprem olacaktır). **İkinci (maruziyet) ve üçüncü (kırılganlık) halkalar tamamen bizim elimizdedir**; afet yönetimi de burada çalışır. **Yer seçimi ve imar kararları ikinci halkaya**, **zarar azaltma (mitigasyon)** — yönetmelik, denetim, güçlendirme, halk eğitimi — **üçüncü halkaya** müdahaledir. Son şık bu ikisini ters eşleştirmiştir."}, {"q": "Ders kitabının \"Doğal afet sözcüğü doğru değildir\" ifadesinin gerekçesi aşağıdakilerden hangisidir?", "opts": [{"t": "Doğa kaynaklı tehlike vardır; afet ise bu tehlikenin toplumdaki sonucudur"}, {"t": "Depremler aslında doğa olayı değil, insan kaynaklı olaylardır"}, {"t": "Doğa olaylarının hiçbiri tek başına insanlara zarar vermez"}, {"t": "Afet terimi uluslararası literatürde yalnızca teknolojik olaylar için kullanılır"}, {"t": "Doğa olayları önceden tam tahmin edilebildiği için afet sayılmaz"}], "a": 0, "exp": "Kitap: \"**Doğal afet yoktur. Doğa veya çevre kaynaklı tehlike veya tehditler vardır.**\" Deprem doğaldır, **afet değildir**; afet o olayın toplumdaki sonucudur. \"Doğal afet\" demek **sorumluluğu doğaya devretmek**tir; oysa zararın büyük kısmı insan kararlarından doğar. Deprem elbette bir doğa olayıdır; birinci çeldirici bu yüzden yanlıştır."}, {"q": "Uluslararası literatürde (UNDRR) \"doğal afet\" tartışmasıyla uyumlu olarak hangi terim tercih edilir?", "opts": [{"t": "Natural disaster"}, {"t": "Act of God"}, {"t": "Natural emergency"}, {"t": "Technological disaster"}, {"t": "Natural hazard"}], "a": 4, "exp": "UNDRR **\"natural hazard\"** (doğa kaynaklı tehlike) der, **\"natural disaster\" demez**. Doğa kaynaklı olan tehlikedir; afet toplumsal bir sonuçtur."}, {"q": "Aşırı yağış sonrası, yapılaşmaya açılmış bir dere yatağında sel felaketi yaşanıyor. Ders materyaline göre bu afeti asıl \"üreten\" nedir?", "opts": [{"t": "Aşırı yağışın kendisi"}, {"t": "Yağışın önceden tahmin edilememesi"}, {"t": "Dere yatağını yapılaşmaya açan imar kararı"}, {"t": "İklimin doğal döngüsü"}, {"t": "Derenin taşkın kapasitesi"}], "a": 2, "exp": "Aşırı yağış bir **doğa olayıdır ve engellenemez**; ama **dere yatağının yapılaşmaya açılması bir karardır**. O karar verildiğinde aşırı yağış sel felaketine dönüşür. \"**Afeti üreten yağmur değil, imar kararıdır.**\""}, {"q": "Aşağıdaki kavram–tanım eşleştirmelerinden hangisi YANLIŞTIR?", "opts": [{"t": "Tehlike (hazard) – Zarar verme potansiyeli olan olay veya olgu"}, {"t": "Maruziyet (exposure) – Toplumun baş etme, direnme ve toparlanma gücü"}, {"t": "Zarar görebilirlik (vulnerability) – Maruz kalanların zarar görmeye açıklık derecesi"}, {"t": "Kapasite (capacity) – Toplumun baş etme, direnme ve toparlanma gücü"}, {"t": "Maruziyet (exposure) – Tehlikenin etki alanında bulunan insan, yapı ve değerler"}], "a": 1, "exp": "**Maruziyet**, tehlikenin etki alanında bulunan **insan, yapı ve değerlerdir**. \"Baş etme, direnme ve toparlanma gücü\" **kapasitenin** tanımıdır. Diğer eşleştirmeler doğrudur."}, {"q": "Afet yönetimindeki dört temel kavram ile sordukları sorular eşleştirildiğinde \"Ne kadar kırılgan?\" sorusu hangi kavrama aittir?", "opts": [{"t": "Tehlike"}, {"t": "Maruziyet"}, {"t": "Zarar görebilirlik"}, {"t": "Kapasite"}, {"t": "Risk"}], "a": 2, "exp": "Tehlike → \"**Ne olabilir?**\"; Maruziyet → \"**Kim ve ne orada?**\"; Zarar görebilirlik → \"**Ne kadar kırılgan?**\"; Kapasite → \"**Ne kadar dayanıklıyız?**\" Bu dört sorunun cevaplarının bileşimi **riski** verir.\n💡 Sırayla: Ne olabilir? Kim orada? Ne kadar kırılgan? Ne kadar dayanıklı?"}, {"q": "Bir eğitim binası için risk değerlendirmesi yapılıyor: \"Bu bölgede deprem bekleniyor\", \"Binada şu an 40 kişi var\", \"Bina hangi yönetmeliğe göre yapıldı, güçlendirildi mi?\", \"Tahliye planı var mı?\" İfadeler sırasıyla hangi kavramlara karşılık gelir?", "opts": [{"t": "Tehlike – Maruziyet – Zarar görebilirlik – Kapasite"}, {"t": "Tehlike – Zarar görebilirlik – Maruziyet – Kapasite"}, {"t": "Risk – Maruziyet – Kapasite – Zarar görebilirlik"}, {"t": "Maruziyet – Tehlike – Zarar görebilirlik – Kapasite"}, {"t": "Tehlike – Maruziyet – Kapasite – Zarar görebilirlik"}], "a": 0, "exp": "Beklenen deprem **tehlike**; binadaki 40 kişi **maruziyet**; binanın yönetmeliği/güçlendirilmesi **zarar görebilirlik**; tahliye planı ve kimin ne yapacağını bilmesi **kapasite**dir. Dördü ayrı ayrı sorulduğunda risk somutlaşır."}, {"q": "Aynı deprem bölgesinde yaşayan diyaliz hastası, yaşlı veya engelli bir bireyin aynı olayda çok daha fazla etkilenmesi en iyi hangi kavramla açıklanır?", "opts": [{"t": "Tehlike"}, {"t": "Maruziyet"}, {"t": "Kapasite fazlası"}, {"t": "İkincil afet"}, {"t": "Zarar görebilirlik"}], "a": 4, "exp": "Sağlıkta **zarar görebilirlik somuttur**: **yaşlı, kronik hastalığı olan, engelli veya diyaliz hastası** birey aynı olayda çok daha kırılgandır. Maruziyet herkes için aynı olabilir (aynı bölgedeler); farkı yaratan maruz kalanların zarar görmeye açıklık derecesidir."}, {"q": "Ders materyalinde kavramsal çerçeve olarak verilen risk formülü hangisidir?", "opts": [{"t": "Risk = Tehlike + Zarar görebilirlik + Kapasite"}, {"t": "Risk = Tehlike × Zarar görebilirlik ÷ Kapasite"}, {"t": "Risk = Tehlike × Kapasite ÷ Zarar görebilirlik"}, {"t": "Risk = Kapasite × Zarar görebilirlik ÷ Tehlike"}, {"t": "Risk = Tehlike ÷ (Zarar görebilirlik × Kapasite)"}], "a": 1, "exp": "**RİSK = Tehlike × Zarar Görebilirlik ÷ Kapasite.** Kapasite **paydadadır**: kapasite arttıkça risk düşer. Formül nicel bir hesap değil, **kavramsal** bir çerçevedir.\n💡 Payda = kapasite: \"Kapasite büyüdükçe risk küçülür.\""}, {"q": "Risk formülüne göre aşağıdaki eşleştirmelerden hangisi doğrudur?", "opts": [{"t": "Bina güçlendirme → tehlikeyi azaltır; tatbikat → zarar görebilirliği artırır"}, {"t": "Doğru yer seçimi → kapasiteyi artırır; eğitim → tehlikeyi azaltır"}, {"t": "Tatbikat → tehlikeyi azaltır; kurumsal yapı → maruziyeti artırır"}, {"t": "Bina güçlendirme → zarar görebilirliği azaltır; tatbikat → kapasiteyi artırır"}, {"t": "Sağlam yapı → kapasiteyi azaltır; plan → zarar görebilirliği artırır"}], "a": 3, "exp": "**Tehlikeyi azaltamayız** (fayı durduramayız). **Zarar görebilirliği azaltabiliriz**: sağlam yapı, doğru yer seçimi, güçlendirme. **Kapasiteyi artırabiliriz**: eğitim, plan, tatbikat, kaynak, kurumsal yapı. Riski düşürmenin iki yolu vardır ve **ikisi de insan elindedir**."}, {"q": "Risk formülüyle ilgili aşağıdakilerden hangisi YANLIŞTIR?", "opts": [{"t": "Nicel değil, kavramsal bir çerçevedir"}, {"t": "Kapasite arttıkça risk düşer"}, {"t": "Kadıoğlu'nun Afet Yönetimi kitabından tamamlanmıştır"}, {"t": "Ders kitabında (Tün, 2018) açıkça ve bu netlikte verilmiştir"}, {"t": "Haiti–Şili örneği formülün somut hâlidir"}], "a": 3, "exp": "Risk formülü **ders kitabında bu netlikte verilmez**; **Kadıoğlu'nun \"Afet Yönetimi\"** kitabından (MBB Kültür Yayınları, ücretsiz PDF) tamamlanmıştır. Formül matematiksel değil **kavramsal** bir çerçevedir; kapasite paydada olduğundan arttıkça risk düşer."}, {"q": "Ders özetine göre risk hangi dört bileşenden kurulur?", "opts": [{"t": "Tehlike, afet, acil durum ve kapasite"}, {"t": "Tehlike, maruziyet, zarar görebilirlik ve kapasite"}, {"t": "Sıklık, süre, etki alanı ve tahrip gücü"}, {"t": "Doğrudan, dolaylı, ikincil etki ve ikincil afet"}, {"t": "Kayıp, kesinti, kapasite ve kırılganlık"}], "a": 1, "exp": "\"Risk dört bileşenden kurulur: **tehlike, maruziyet, zarar görebilirlik ve kapasite**.\" Sıklık, süre, etki alanı, tahrip gücü afetleri **karşılaştırma ölçütleridir**; doğrudan/dolaylı/ikincil ise **etki** katmanlarıdır."}, {"q": "Afetin büyüklüğüne etki eden sekiz faktörden kaç tanesi insan faaliyeti kökenlidir?", "opts": [{"t": "Yedi"}, {"t": "Bir"}, {"t": "Dört"}, {"t": "Beş"}, {"t": "Sekiz"}], "a": 0, "exp": "Sekiz faktörden **yedisi insan faaliyeti kökenlidir**; yalnızca **olayın fiziksel büyüklüğü** doğa kaynaklıdır. Bu, afetin ölçeğinin büyük ölçüde insan kararlarıyla belirlendiği, **dolayısıyla azaltılabileceği** anlamına gelir. Faktörlerin kaynağı **Ergünay (2002)**, ders kitabı **Şekil 1.1**.\n💡 \"8'de 7 insan\" — klasik sınav sorusu."}, {"q": "Afetin büyüklüğüne etki eden faktörlerden hangisi doğrudan doğa kaynaklı olan TEK faktördür?", "opts": [{"t": "Yerleşme alanlarına uzaklık ve nüfus yoğunluğu"}, {"t": "Çevrenin tahribi ve yanlış kullanımı"}, {"t": "Hızlı nüfus artışı ve çarpık kentleşme"}, {"t": "Tehlikeli bölgelerde denetimsiz şehirleşme ve sanayileşme"}, {"t": "Olayın fiziksel büyüklüğü (magnitüd, yağış miktarı, rüzgâr hızı)"}], "a": 4, "exp": "**Olayın fiziksel büyüklüğü** (depremin magnitüdü, yağışın miktarı, rüzgârın hızı) listedeki **tek doğal kalemdir**. Nüfus yoğunluğu, çevre tahribi, çarpık kentleşme ve denetimsiz sanayileşme insan kararlarının ürünüdür."}, {"q": "Afetin büyüklüğüne etki eden faktörlerin ortak özelliği ile ilgili ders kitabının ifadesi hangisidir?", "opts": [{"t": "Büyüklük, insan faaliyetlerinden bağımsız olarak yalnızca tehlikenin fiziksel şiddetine bağlıdır"}, {"t": "Büyüklük, bölgenin coğrafi konumu ve jeolojik yapısına göre önceden belirlenmiştir"}, {"t": "Büyüklük, insan faaliyetlerinin doğru ya da yanlış yönde uygulanmasına paralel artar veya azalır"}, {"t": "Büyüklük, sadece etkilenen ülkenin ekonomik gelişmişlik düzeyine bağlıdır"}, {"t": "Büyüklük rastlantısaldır; bu nedenle önceden öngörülemez ve azaltılamaz"}], "a": 2, "exp": "Kitap (Bölüm 1, s. 6): \"**afetlerin büyüklüğü çok önemli ölçüde insan faaliyetlerinin doğru ve yanlış yönde uygulanmasına paralel olarak artmakta veya azalmaktadır.**\" Afetin ölçeği bize verilmiş değil, büyük ölçüde **bizim ürettiğimiz bir sonuçtur**. \"Faktörlerin ortak özelliği nedir?\" klasik bir sınav sorusudur."}, {"q": "Aşağıdakilerden hangisi ders materyalinde afetin büyüklüğüne etki eden ana faktörler arasında SAYILMAMIŞTIR?", "opts": [{"t": "Fakirlik ve az gelişmişlik"}, {"t": "Alan kullanımı ve yapılaşma kültürü eksikliği"}, {"t": "Olayın gerçekleştiği mevsim"}, {"t": "Bilgisizlik, eğitimsizlik, güvenlik kültürü eksikliği"}, {"t": "Toplumun önceden alabildiği koruyucu ve önleyici önlemlerin düzeyi"}], "a": 2, "exp": "Faktörler: fiziksel büyüklük; yerleşmeye uzaklık ve nüfus yoğunluğu; **fakirlik ve az gelişmişlik**; hızlı nüfus artışı ve çarpık kentleşme; tehlikeli bölgelerde denetimsiz şehirleşme-sanayileşme; **alan kullanımı ve yapılaşma kültürü eksikliği**; çevre tahribi; **bilgisizlik, eğitimsizlik, güvenlik kültürü eksikliği**; ayrıca kitap **koruyucu-önleyici önlem düzeyini** de sayar. Mevsim listede yoktur (6 Şubat'ta kış koşulları etkili olsa da bu bir faktör olarak sayılmamıştır)."}, {"q": "\"Aynı deprem kırsalda küçük, metropolde yıkıcı sonuç verir\" ifadesi afetin büyüklüğüne etki eden hangi faktörü açıklar?", "opts": [{"t": "Olayın fiziksel büyüklüğü"}, {"t": "Yerleşme alanlarına uzaklık ve nüfus yoğunluğu"}, {"t": "Çevrenin tahribi ve yanlış kullanımı"}, {"t": "Bilgisizlik ve güvenlik kültürü eksikliği"}, {"t": "Fakirlik ve az gelişmişlik"}], "a": 1, "exp": "Bu ifade **yerleşme alanlarına uzaklık ve nüfus yoğunluğu** faktörünü açıklar. 6 Şubat 2023'te de aynı fay farklı ilçelerde **nüfus yoğunluğu ve yapı stoku** farkı yüzünden çok farklı sonuçlar verdi."}, {"q": "Afetin büyüklüğüne etki eden faktörlerden \"fakirlik ve az gelişmişlik\" için ders materyalinde hangi vurgu yapılmıştır?", "opts": [{"t": "Afetin büyüklüğüne etki eden faktörler arasında tek doğa kaynaklı olanıdır"}, {"t": "Yalnızca az gelişmiş ülkelerde afet yaşanabileceğini gösterir"}, {"t": "Sadece müdahale aşamasını etkiler, iyileşme sürecini etkilemez"}, {"t": "Afetin büyüklüğünü değil, yalnızca görülme sıklığını belirler"}, {"t": "Ahlaki yargı değil teknik bir değişkendir; sigortasızlık iyileşmeyi uzatır"}], "a": 4, "exp": "Fakirlik; **dayanıksız konut, sigortasızlık, sınırlı kurtarma ve iyileştirme kaynağı** demektir. Burada **ahlaki bir yargı değil, teknik bir değişkendir**: **sigortasızlık iyileşme süresini doğrudan uzatır** (Haiti'de iyileşme yıllar sürdü)."}, {"q": "Fay zonu üzerine kurulan bir sanayi tesisinin depremle birlikte ikincil afete yol açması, afetin büyüklüğüne etki eden hangi faktörle ilişkilendirilmiştir?", "opts": [{"t": "Hızlı nüfus artışı ve çarpık kentleşme"}, {"t": "Olayın fiziksel büyüklüğü"}, {"t": "Yerleşme alanlarına uzaklık ve nüfus yoğunluğu"}, {"t": "Tehlikeli bölgelerde denetimsiz şehirleşme ve sanayileşme"}, {"t": "Çevrenin tahribi ve yanlış kullanımı"}], "a": 3, "exp": "Beşinci faktör **tehlikeli bölgelerde denetimsiz şehirleşme ve sanayileşme**dir: fay zonu üzerine kurulan sanayi tesisi **ikincil afeti** de beraberinde getirir. Bu, **NaTech** riskidir; 1999'da **TÜPRAŞ**'ta tam olarak bu oldu."}, {"q": "Türkiye Deprem Tehlike Haritası herkese açık olduğu hâlde imarın ona göre yapılmaması, afetin büyüklüğüne etki eden hangi faktöre örnektir?", "opts": [{"t": "Alan kullanımı ve yapılaşma kültürü eksikliği"}, {"t": "Olayın fiziksel büyüklüğü"}, {"t": "Fakirlik ve az gelişmişlik"}, {"t": "Çevrenin tahribi ve yanlış kullanımı"}, {"t": "Hızlı nüfus artışı"}], "a": 0, "exp": "Altıncı faktör: **alan kullanımı ve yapılaşma kültürü eksikliği** — \"Tehlike haritası varken ona göre imar yapmamak, **bilgiyi karara çevirememektir**.\" Türkiye Deprem Tehlike Haritası **tdth.afad.gov.tr** adresinde herkese açıktır; sorun bilginin karara dönüşmemesidir."}, {"q": "Orman, sulak alan, tarım arazisi ve kıyıların bozulmasının özellikle hangi olayları doğrudan büyüttüğü belirtilmiştir?", "opts": [{"t": "Deprem ve tsunami"}, {"t": "Hortum ve fırtına"}, {"t": "Sel ve heyelan"}, {"t": "Volkanik patlama ve deprem"}, {"t": "Kuraklık ve kıtlık"}], "a": 2, "exp": "Yedinci faktör **çevrenin tahribi ve yanlış kullanımı**dır: orman, sulak alan, tarım arazisi ve kıyıların bozulması **sel ve heyelanı doğrudan büyütür**.\n💡 Doğal örtü bir sünger gibidir: orman ve sulak alan bozulunca su tutulamaz — sel ve heyelan büyür."}, {"q": "\"Ne yapacağını bilmeyen toplum, en iyi planın bile uygulanamaz kalmasına yol açar\" ifadesi hangi faktörü açıklar?", "opts": [{"t": "Alan kullanımı ve yapılaşma kültürü eksikliği"}, {"t": "Fakirlik ve az gelişmişlik"}, {"t": "Hızlı nüfus artışı ve çarpık kentleşme"}, {"t": "Olayın fiziksel büyüklüğü"}, {"t": "Bilgisizlik, eğitimsizlik, güvenlik kültürü eksikliği"}], "a": 4, "exp": "Bu ifade **bilgisizlik, eğitimsizlik, güvenlik kültürü eksikliği** faktörünü açıklar. \"Denetimsiz büyüyen kent, kendi riskini de üretir\" ise **hızlı nüfus artışı ve çarpık kentleşme** içindir."}, {"q": "Haiti–Şili sınıf etkinliğinde sekiz faktör tek tek uygulandığında, aşağıdaki faktörlerden hangisi Şili'nin ALEYHİNE olmuştur?", "opts": [{"t": "Olayın fiziksel büyüklüğü"}, {"t": "Fakirlik ve az gelişmişlik"}, {"t": "Yapılaşma kültürü ve alan kullanımı"}, {"t": "Çarpık kentleşme"}, {"t": "Koruyucu-önleyici önlem düzeyi"}], "a": 0, "exp": "Etkinliğin beklenen bulgusu: fakirlik (Haiti en yoksul ülkelerden; Şili yüksek gelirli), yapılaşma kültürü (Şili'de katı yönetmelik), çarpık kentleşme (Port-au-Prince'te denetimsiz yapılaşma) ve önlem düzeyi (Şili'de tatbikat, erken uyarı) **Şili lehine** farklıydı. **Tek doğal faktör olan fiziksel büyüklük Şili'nin aleyhineydi** (Mw 8.8, ≈500 kat enerji); buna rağmen sonuç Şili'nin lehine çıktı — **farkı yaratan insan kararlarıydı**."}, {"q": "\"Hortum dakikalar sürer; kuraklık yıllarca\" ifadesi afetleri karşılaştırma ölçütlerinden hangisine örnektir?", "opts": [{"t": "Başlangıç hızı"}, {"t": "Etki süresi"}, {"t": "Sıklık ve tehdit"}, {"t": "Etki alanı"}, {"t": "Kontrol edilebilirlik"}], "a": 1, "exp": "Bu ifade **etki süresi** ölçütünü örnekler. **Başlangıç hızı** \"ani gelişen mi, önceden uyaran mı?\"; **etki alanı** \"tek mahalle mi, tüm ülke mi, zincirleme yayılıyor mu?\" sorusudur."}, {"q": "Aşağıdakilerden hangisi ders materyalinde afetleri karşılaştırmada kullanılan yedi ölçütten biri DEĞİLDİR?", "opts": [{"t": "Önceden tahmin edilebilirliği"}, {"t": "Kontrol edilebilirliği"}, {"t": "Tahrip gücü"}, {"t": "Uluslararası yardım miktarı"}, {"t": "Başlangıç hızı"}], "a": 3, "exp": "Yedi ölçüt: **sıklık ve tehdit, etki süresi, başlangıç hızı, etki alanı, tahrip gücü, önceden tahmin edilebilirliği, kontrol edilebilirliği**. Uluslararası yardım miktarı bir ölçüt değildir.\n💡 \"Sık-Süre-Hız-Alan-Güç-Tahmin-Kontrol\" — 7 ölçüt."}, {"q": "Afetleri karşılaştırma ölçütleri karşılaştırmalı bir puanlama sistemiyle değerlendirildiğinde ne elde edilir?", "opts": [{"t": "Afetin kesin olarak ne zaman olacağı"}, {"t": "Can kaybının tam sayısı"}, {"t": "İncelenen yerin afetselliği hakkında fikir"}, {"t": "Afetin doğal mı insan kaynaklı mı olduğu"}, {"t": "Bölgenin sigorta primi"}], "a": 2, "exp": "Bu ölçütler **karşılaştırmalı bir puanlama sistemiyle** değerlendirildiğinde **incelenen yerin afetselliği hakkında fikir sahibi olunur**. Bu yaklaşım aslında **çok kriterli karar verme**dir (AHP, TOPSIS gibi yöntemler ileride işlenecek)."}, {"q": "\"Nehir taşkını taşkın ovasıyla sınırlıdır; gaz sızıntısı sınır tanımaz\" ifadesi ders materyalinde hangi karşılaştırma ölçütü altında verilmiştir?", "opts": [{"t": "Etki süresi"}, {"t": "Önceden tahmin edilebilirliği"}, {"t": "Tahrip gücü"}, {"t": "Sıklık ve tehdit"}, {"t": "Başlangıç hızı"}], "a": 1, "exp": "Slaytta bu örnek **önceden tahmin edilebilirliği** ölçütü altında verilmiştir: taşkın ovasıyla sınırlı nehir taşkınının nereyi etkileyeceği öngörülebilirken gaz sızıntısı sınır tanımaz. **Tahrip gücü** \"tehlikenin tipine ve yerleşimin durumuna göre değişir\"; **sıklık** \"sık olan, gündemden hiç düşmeyen tehdittir\"."}, {"q": "Aşağıdakilerden hangisi ders materyalinde sayılan afetlerin ortak özelliklerinden biri DEĞİLDİR?", "opts": [{"t": "İlk oluştuğu anlarda insanlarda şok etkisi yaratır"}, {"t": "Yaşam kaynaklarına ve altyapıya zarar verir"}, {"t": "Bazıları aniden, bazıları yavaş gelişir"}, {"t": "Oluştuğu ilk anlarda her zaman organize bir müdahale gerçekleşir"}, {"t": "Bazılarının ne zaman olacağı tahmin edilemezken bazıları tahmin edilebilir"}], "a": 3, "exp": "Ortak özelliklerden biri tam tersidir: \"**Oluştuğu ilk anlarda organize bir müdahale gerçekleşmeyebilir.**\" İlk saatlerde yollar kapalı, haberleşme kesik, ekipler de afetzededir; **toplum kendi kendine kalır** — afet eğitiminin gerekçesi budur. Diğer şıklar altı ortak özellik arasındadır (kaynak: Ergünay 2002)."}, {"q": "Aşağıdakilerden hangisi ders materyalinde YAVAŞ gelişen afetlere örnek olarak verilmiştir?", "opts": [{"t": "Deprem"}, {"t": "Hortum"}, {"t": "Patlama"}, {"t": "Tsunami"}, {"t": "Kuraklık"}], "a": 4, "exp": "**Ani gelişen**: deprem, hortum, patlama. **Yavaş gelişen**: **kuraklık, kıtlık, salgın**. Ani gelişen afette hazırlık önceden yapılmış olmalıdır; yavaş gelişende **erken uyarı ve izleme** devreye girer. Bu ayrım müdahale planlamasının temelidir."}, {"q": "Bir depremin ilk saatlerinde enkazdan kurtarılan insanların büyük çoğunluğunu kimlerin çıkardığı belirtilmiştir ve bunun AYAY açısından anlamı nedir?", "opts": [{"t": "Olay yerindeki komşular ve yoldan geçenler; bu nedenle halk eğitimi mesleki bir görevdir"}, {"t": "Profesyonel arama-kurtarma ekipleri; bu nedenle halk eğitimine gerek yoktur"}, {"t": "Uluslararası ekipler; bu nedenle ilk saatlerde dış yardım beklenmelidir"}, {"t": "Askerî birlikler; bu nedenle müdahale yalnızca devletin işidir"}, {"t": "112 ekipleri; bu nedenle olay yeri her zaman düzenlidir"}], "a": 0, "exp": "Enkazdan kurtarılanların büyük çoğunluğunu profesyonel ekipler değil, **olay yerindeki komşular ve yoldan geçenler** çıkarır. AYAY için iki anlamı vardır: (1) **toplumun kendisi ilk müdahale ekibidir**, dolayısıyla **halk eğitimi mesleki bir görevdir**; (2) profesyonel ekip geldiğinde düzenli bir olay yeri değil, **kendiliğinden başlamış bir kurtarma faaliyeti** bulur."}, {"q": "Ders materyalindeki \"Afetlerin yol açtığı olumsuz etkiler\" sınıflamasına göre aşağıdakilerden hangisi DOĞRUDAN etkidir?", "opts": [{"t": "Gelir ve üretim kaybı"}, {"t": "Hizmetlerde aksamalar"}, {"t": "Pazar ve bütçe kayıpları"}, {"t": "Geçici barınma ve acil yardım ihtiyacı"}, {"t": "Güvenlik ve asayiş sorunları"}], "a": 3, "exp": "**Doğrudan etkiler**: can kaybı ve yaralanmalar, yapı ve altyapı hasarı, **geçici barınma ve acil yardım ihtiyacı**. **Dolaylı**: gelir ve üretim kaybı, hizmetlerde aksamalar, enflasyon ve işsizlik artışı. **İkincil**: pazar ve bütçe kayıpları, güvenlik ve asayiş sorunları, ekonomik dengesizlikler."}, {"q": "Afetlerin olumsuz etkileri sınıflamasında \"güvenlik ve asayiş sorunları\" hangi grupta yer alır?", "opts": [{"t": "Doğrudan etkiler"}, {"t": "Dolaylı etkiler"}, {"t": "İkincil etkiler"}, {"t": "İkincil afetler"}, {"t": "Doğrudan sağlık sonuçları"}], "a": 2, "exp": "Slayttaki sınıflamaya göre **güvenlik ve asayiş sorunları**, pazar ve bütçe kayıpları ve ekonomik dengesizliklerle birlikte **ikincil etkiler** arasındadır. İkincil **etki** ekonomik-sosyal bir sonuçtur; ikincil **afet** ise yeni bir afet olayıdır (yangın, sızıntı vb.)."}, {"q": "Bir depremde fabrika binası yıkılıyor; sonraki aylarda fabrika üretim yapamıyor ve çalışanlar işsiz kalıyor. Bu durum için aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Fabrikanın yıkılması doğrudan, üretim ve gelir kaybı dolaylı etkidir"}, {"t": "Fabrikanın yıkılması dolaylı, işsizlik doğrudan etkidir"}, {"t": "Her ikisi de doğrudan etkidir"}, {"t": "Fabrikanın yıkılması ikincil afet, işsizlik doğrudan etkidir"}, {"t": "Her ikisi de ikincil afettir"}], "a": 0, "exp": "**Doğrudan etki** afetle birlikte **anında** ortaya çıkar (yıkılan fabrika, can kaybı). **Dolaylı etki** bunun sonucudur ve **zaman alır** (fabrika üretemez, çalışan işsiz kalır, gelir kaybı doğar). İkincil afet ise yangın, sızıntı gibi yeni bir afet olayıdır.\n💡 Doğrudan = anında; dolaylı = zamanla, sonuç olarak."}, {"q": "İkincil etki ile ikincil afet arasındaki ilişki için aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Aynı şeydir; ikisi de afetin ekonomik sonuçlarını anlatır"}, {"t": "Aynı şeydir; ikisi de yangın ve patlama gibi olayları anlatır"}, {"t": "Aynı şey değildir; ikincil etki yeni bir afet olayı, ikincil afet ise ekonomik bir sonuçtur"}, {"t": "İkincil afet yalnızca teknolojik afetlerden, ikincil etki yalnızca doğa kaynaklı afetlerden doğar"}, {"t": "Aynı şey değildir; ikincil etki ekonomik-sosyal bir sonuç, ikincil afet ise yeni bir afet olayıdır"}], "a": 4, "exp": "**İkincil etki** ekonomik-sosyal bir sonuçtur (bütçe açığı, asayiş sorunları gibi). **İkincil afet** ise bir afetin tetiklediği **yeni bir afet olayıdır** (yangın, sızıntı, baraj yıkılması…). Örnek: 1999 Kocaeli depreminin tetiklediği **TÜPRAŞ yangını** ve **AKSA akrilonitril sızıntısı**. Bu, bölümün en ayırt edici sorusudur."}, {"q": "AFAD (2014) tanımına göre ikincil afet nedir?", "opts": [{"t": "Bir afetin ardından görülen enflasyon, işsizlik artışı ve bütçe kayıpları"}, {"t": "Bir afetin tetiklemesiyle oluşan yangın, baraj yıkılması, salgın gibi yeni afetler"}, {"t": "Aynı bölgede kısa süre içinde ikinci kez meydana gelen aynı tür afet"}, {"t": "Baş etme kapasitesinin yeterli olduğu, yerel olarak yönetilen küçük olaylar"}, {"t": "Ana şoktan sonra gelen ve hasarı artıran artçı sarsıntılar"}], "a": 1, "exp": "AFAD (2014): \"Bir afetin etkisi veya tetiklemesiyle meydana gelen **yangın, heyelan, baraj yıkılması, patlama, salgın hastalık ve endüstriyel kaza** gibi yeni afetlere **ikincil afet** denir.\" Enflasyon/işsizlik ekonomik etkilerdir; kapasitenin yettiği olaylar acil durumdur."}, {"q": "17 Ağustos 1999 Kocaeli depreminde AKSA tesislerinde hasar gören tanklardan çevreye karışan ve yanıcı, patlayıcı, kanserojen özellikte olan madde hangisidir?", "opts": [{"t": "Klor gazı (600 tondan fazla)"}, {"t": "Ham petrol (6 bin tondan fazla)"}, {"t": "Amonyak (60 tondan fazla)"}, {"t": "Akrilonitril (600 kg kadar)"}, {"t": "Akrilonitril (6 bin tondan fazla)"}], "a": 4, "exp": "Deprem **TÜPRAŞ**'ta **yangına**, **AKSA**'da **akrilonitril sızıntısına** yol açtı. Tanklardan çevreye **6 bin tondan fazla akrilonitril** karıştı; **hayvan ölümleri** ve **halk sağlığı sorunları** oldu, çevredeki yerleşimler boşaltıldı. Deprem **45 saniye** sürdü; yangın **günlerce** yandı (kaynak: Öncü, 2013).\n💡 TÜPRAŞ = yangın, AKSA = akrilonitril."}, {"q": "Doğa olayının tetiklediği teknolojik kazaları ifade eden ve ikincil afetin güncel literatürdeki adı olan kavram hangisidir?", "opts": [{"t": "KBRN (Kimyasal, Biyolojik, Radyolojik, Nükleer)"}, {"t": "HAP (Hastane Afet Planı)"}, {"t": "NaTech (Natural Hazard Triggered Technological Accident)"}, {"t": "İRAP (İl Afet Risk Azaltma Planı)"}, {"t": "UMKE (Ulusal Medikal Kurtarma Ekibi)"}], "a": 2, "exp": "**NaTech = Natural Hazard Triggered Technological Accident**: doğa olayının tetiklediği teknolojik kaza. Ders kitabında geçmez ama literatürde standarttır. Örnekler: 1999 **TÜPRAŞ** yangını; 6 Şubat 2023'te **İskenderun Limanı**'nda devrilen konteynerlerde çıkan, günlerce süren yangın."}, {"q": "Aşağıdakilerden hangisi ders materyalinde başlıca ikincil afetler arasında SAYILMAMIŞTIR?", "opts": [{"t": "Yangın ve patlama"}, {"t": "Kimyasal ve gaz sızıntıları"}, {"t": "Su baskınları ve baraj yıkılması"}, {"t": "Ekonomik dengesizlikler"}, {"t": "Salgın hastalıklar ve çevre kirliliği"}], "a": 3, "exp": "Başlıca ikincil afetler: **yangın ve patlama**, **kimyasal ve gaz sızıntıları**, **su baskınları ve baraj yıkılması**, **salgın hastalıklar ve çevre kirliliği**. **Ekonomik dengesizlikler** bir afet olayı değil, **ikincil etki**dir."}, {"q": "Afetlerin başlıca sonuçlarıyla ilgili aşağıdakilerden hangisi YANLIŞTIR?", "opts": [{"t": "Uzun süreli psikolojik travma yıllarca devam edebilir"}, {"t": "Fiziksel hasar onarıldığında psikolojik etkiler de kısa sürede sona erer"}, {"t": "Barınma ve hijyen koşullarının bozulması bulaşıcı hastalık riskini artırır"}, {"t": "Kalkınma planları askıya alınabilir, yatırımlar gecikebilir veya iptal olabilir"}, {"t": "Rutin hizmet veren altyapı sistemleri devre dışı kalabilir"}], "a": 1, "exp": "Fiziksel hasar onarılınca afetin bittiği sanılır; oysa **ruhsal etkiler yıllarca sürer**. Afetlerin başlıca sonuçları: can ve mal kaybı (ölüm, sakatlık, yaralanma, **yetim kalma**), altyapının bozulması, **uzun süreli psikolojik travma**, güvenlik ve düzenin zayıflaması, **bulaşıcı ve salgın hastalıklar**, ekonomik yapının bozulması, yaşam kalitesinin düşmesi, **yatırımların gecikmesi veya iptali**."}, {"q": "Ders materyalinde \"afetlerin başlıca sonuçları\" arasında \"can ve mal kaybı\" başlığı altında hangisi sayılmamıştır?", "opts": [{"t": "Enflasyon"}, {"t": "Ölüm"}, {"t": "Sakatlık"}, {"t": "Yaralanma"}, {"t": "Yetim kalma"}], "a": 0, "exp": "Can ve mal kaybı başlığı: **ölüm, sakatlık, yaralanma, yetim kalma**. Enflasyon bu başlıkta değil; ekonomik bir etki olarak etki sınıflamasında yer alır."}, {"q": "Aşağıdakilerden hangisi afetin DOLAYLI sağlık sonuçlarına örnektir?", "opts": [{"t": "Diyaliz ve ilaç erişiminin kesintiye uğraması"}, {"t": "Enkaz altında gelişen crush (ezilme) sendromu"}, {"t": "Yangında duman inhalasyonu"}, {"t": "Soğuk ortamda kalmaya bağlı hipotermi"}, {"t": "Bina çökmesine bağlı travma ve kırıklar"}], "a": 0, "exp": "**Doğrudan sağlık sonuçları**: travma ve kırıklar, **crush sendromu**, boğulma, yanık, **duman inhalasyonu**, zehirlenme, **hipotermi**. **Dolaylı sağlık sonuçları**: **kronik hastalık tedavisinin kesintisi, diyaliz ve ilaç erişimi**, salgın riski, gebe ve bebek sağlığı, beslenme, ruh sağlığı."}, {"q": "Afetin sağlık boyutunda \"kırılgan gruplar\" arasında aşağıdakilerden hangisi sayılmamıştır?", "opts": [{"t": "Yerinden edilmiş nüfus"}, {"t": "Gebeler"}, {"t": "Engelli bireyler"}, {"t": "Kronik hastalar"}, {"t": "Sağlıklı genç erişkinler"}], "a": 4, "exp": "Kırılgan gruplar: **yaşlılar, bebek ve çocuklar, gebeler, engelli bireyler, kronik hastalar, yerinden edilmiş nüfus**. \"Aynı olay, herkesi aynı ölçüde etkilemez.\""}, {"q": "Ders materyalinde verilen afet sağlık hizmeti zincirinin doğru sırası hangisidir?", "opts": [{"t": "112 → Olay yeri → Hastane (HAP) → UMKE"}, {"t": "Olay yeri → UMKE → Hastane (HAP) → 112"}, {"t": "Hastane (HAP) → 112 → UMKE → Olay yeri"}, {"t": "Olay yeri → 112 → UMKE → Hastane (HAP)"}, {"t": "Olay yeri → Hastane (HAP) → 112 → UMKE"}], "a": 3, "exp": "Sağlık hizmeti zinciri: **Olay yeri → 112 → UMKE → hastane (HAP)**. **Kaynak ile ihtiyaç oranı tersine döndüğünde bakım mantığı da değişir: triyaj.** (UMKE: Ulusal Medikal Kurtarma Ekibi; HAP: Hastane Afet Planı.)"}, {"q": "Afet sağlık hizmetlerinde \"bakım mantığının değişmesi\" (triyaj) hangi durumda ortaya çıkar?", "opts": [{"t": "Olay yerine ilk 112 ekibi ulaştığında"}, {"t": "Hasta sayısı 10'u geçtiğinde"}, {"t": "Kaynak ile ihtiyaç oranı tersine döndüğünde"}, {"t": "Hastane afet planı yürürlükte olmadığında"}, {"t": "Olay doğa kaynaklı olduğunda"}], "a": 2, "exp": "\"**Kaynak ile ihtiyaç oranı tersine döndüğünde bakım mantığı da değişir: triyaj.**\" **Kaynak kıtlığı bakım mantığını değiştirir.** Belirli bir hasta sayısı eşiği verilmemiştir; belirleyici olan kaynak-ihtiyaç dengesidir — tıpkı acil durum ile afeti ayıran kapasite çizgisi gibi."}, {"q": "Ders materyaline göre ders kitabının (2018) güncelliğini yitirdiği noktalarla ilgili aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Kitap 6 Şubat 2023 depremlerini güncel referans olarak ayrıntılı işler"}, {"t": "Kitaptaki nüfus \"80 milyona dayanan\"dır; TÜİK 2024: ~85,7 milyon"}, {"t": "Kitap NaTech kavramını ikincil afet teriminin yerine kullanır"}, {"t": "Kitap risk formülünü açıkça ve sayısal bir hesap olarak verir"}, {"t": "Kitap Türkiye nüfusunu TÜİK verisiyle 85,7 milyon olarak verir"}], "a": 1, "exp": "Kitap **2018**'de kaldı: \"**nüfusu 80 milyona dayanan Türkiye**\" der, **TÜİK 2024** verisi **~85,7 milyon**dur. Kitap **6 Şubat 2023** depremlerini içermez; **risk formülünü** açıkça vermez; **NaTech** terimi kitapta geçmez. Ayrıca kitaptaki \"**yılda GSMH'nin %3'ü**\" ekonomik kayıp tahmini 2023 depremleri sonrası geçerliliğini yitirmiştir."}, {"q": "Ders kitabında yer alan ve 2023 depremleri sonrası geçerliliğini yitirdiği belirtilen yıllık ekonomik kayıp tahmini hangisidir?", "opts": [{"t": "Yılda GSMH'nin %0,3'ü"}, {"t": "Yılda GSMH'nin %30'u"}, {"t": "Yılda GSMH'nin %13'ü"}, {"t": "Yılda GSMH'nin %3'ü"}, {"t": "Yılda GSMH'nin %8'i"}], "a": 3, "exp": "Kitaptaki \"**yılda GSMH'nin %3'ü**\" tahmini 2023 depremleri sonrası geçerliliğini yitirmiştir. Sınavda **kitaptaki bilgiler esastır**; güncellemeler derste ayrıca belirtilir."}, {"q": "Dönem ödevi kapsamında öğrencilerden incelemeleri istenen, AFAD tarafından il düzeyinde hazırlanan plan hangisidir?", "opts": [{"t": "Hastane Afet Planı (HAP)"}, {"t": "Türkiye Afet Müdahale Planı (TAMP)"}, {"t": "İl Afet Risk Azaltma Planı (İRAP)"}, {"t": "Ulusal Medikal Kurtarma Planı (UMKE)"}, {"t": "Türkiye Deprem Tehlike Haritası (TDTH)"}], "a": 2, "exp": "Öğrenciler kendi illerinin **AFAD İl Afet Risk Azaltma Planı'ndan (İRAP)** bir risk seçip dönem boyunca öğrendikleri çerçeveyle analiz eder. **HAP** hastane afet planı, **TAMP** Türkiye Afet Müdahale Planı'dır; UMKE bir plan değil, Ulusal Medikal Kurtarma Ekibi'dir."}]}, {"title": "Afet Türleri, Sınıflandırmalar ve Afet İstatistikleri", "desc": "Sınıflandırmanın amacı, EM-DAT ve kayıt ölçütleri, doğa kaynaklı/teknolojik alt gruplar, Kalkınma Bakanlığı, Özey, oluş hızı ve Bryant sınıflandırmaları, dünya ve Türkiye afet istatistikleri, afetzede kavramı, sağlık göstergeleri", "short": "Afet Türleri", "questions": [{"q": "Derste afetleri sınıflandırmanın afet yönetiminde mümkün kıldığı dört temel iş sayılmıştır. Aşağıdakilerden hangisi bunlardan biri **değildir**?", "opts": [{"t": "Olayları saymak (istatistik üretmek)"}, {"t": "Ülkeler ve yıllar arasında karşılaştırma yapmak"}, {"t": "Afet türüne özgü hazırlık planlamak"}, {"t": "Afetin hukuki sorumlusunu belirlemek"}, {"t": "Bütçe ve personel gibi kaynakları ayırmak"}], "a": 3, "exp": "Sınıflandırma akademik bir düzen merakı değil; **saymak, karşılaştırmak, planlamak ve kaynak ayırmak** için gereken araçtır. Kategori yoksa istatistik de yoktur. Sorumluluk tespiti bu dört iş arasında yer almaz.\n💡 Dört işi \"**S-K-P-K**\" (Say, Karşılaştır, Planla, Kaynak ayır) diye kodlayabilirsin."}, {"q": "Derste \"her afet türü farklı bir hazırlık gerektirir\" ilkesi örneklerle açıklanmıştır. Bu örneklere göre **salgın** için öne çıkan hazırlık hangisidir?", "opts": [{"t": "Tahliye"}, {"t": "Arama-kurtarma"}, {"t": "İzolasyon"}, {"t": "Enkaz kaldırma"}, {"t": "Barınma çadırı kurma"}], "a": 2, "exp": "Slayttaki eşleştirme: **depreme arama-kurtarma, sele tahliye, salgına izolasyon**. Bu örnekler, planlama yapabilmek için önce olayın hangi kategoriye girdiğini bilmek gerektiğini gösterir. Konuşmacı notundaki mesleki karşılık: 112 komuta merkezi bir çağrıyı hangi kategoriye koyduğuna göre farklı ekip gönderir — **kategori, kaynağı belirler**."}, {"q": "EM-DAT (Emergency Events Database) ile ilgili olarak kuruluş yılı ve kurucu kurum eşleştirmesi hangisinde doğru verilmiştir?", "opts": [{"t": "1988 – CRED"}, {"t": "1988 – WHO"}, {"t": "1900 – CRED"}, {"t": "1999 – AFAD"}, {"t": "2005 – Birleşmiş Milletler"}], "a": 0, "exp": "EM-DAT **1988**'de **CRED** (Centre for Research on the Epidemiology of Disasters – Afetler Epidemiyolojisi Araştırma Merkezi) tarafından kurulmuştur. **WHO** ve **Belçika Hükümeti** kuruluşu *desteklemiştir*, kurucu değildir. 1900 ise veri tabanındaki kayıtların başladığı yıldır."}, {"q": "EM-DAT'ı işleten CRED'in bağlı olduğu kurum ve bulunduğu şehir hangisidir?", "opts": [{"t": "Dünya Sağlık Örgütü – Cenevre"}, {"t": "Birleşmiş Milletler – New York"}, {"t": "Louvain Katolik Üniversitesi – Brüksel"}, {"t": "Louvain Katolik Üniversitesi – Cenevre"}, {"t": "Belçika Sağlık Bakanlığı – Brüksel"}], "a": 2, "exp": "EM-DAT, **Brüksel'deki Louvain Katolik Üniversitesi** bünyesindeki **CRED** tarafından işletilir. WHO ve Belçika Hükümeti destekçi kurumlardır. CRED'in adındaki \"**epidemiyoloji**\" önemlidir: afet verisini toplayan kurum bir halk sağlığı araştırma merkezidir, bir mühendislik enstitüsü değil — çünkü afetin ölçüsü yıkılan bina değil, **etkilenen insandır**."}, {"q": "EM-DAT ile ilgili aşağıdaki ifadelerden hangileri doğrudur?\nI. 1900'den bugüne 18.000'in üzerinde afet kaydı içerir.\nII. Verileri yalnızca ulusal hükümetlerin resmî bildirimlerinden derlenir.\nIII. Amacı insani yardım faaliyetlerine hizmet etmek ve afete hazırlıkta karar vericilere sağlam veri sunmaktır.", "opts": [{"t": "I ve III"}, {"t": "Yalnız I"}, {"t": "Yalnız III"}, {"t": "I ve II"}, {"t": "I, II ve III"}], "a": 0, "exp": "EM-DAT **1900'den bu yana 18.000'in üzerinde** afet kaydı içerir (I doğru) ve amacı **insani yardıma hizmet ile karar vericilere sağlam veri sunmaktır** (III doğru). Veriler tek kaynaktan değil; **BM kuruluşları, STK'lar, sigorta şirketleri, araştırma enstitüleri ve basın ajanslarından** derlenir (II yanlış). Kaynak çeşitliliği bir zorunluluktur, çünkü çoğu ülkede merkezî ve güvenilir bir afet kaydı yoktur.\n💡 EM-DAT verisine **emdat.be** adresinden ücretsiz erişilir; akademik kullanım için kayıt gerekir."}, {"q": "Aşağıdakilerden hangisi bir olayın EM-DAT'a kaydedilmesi için aranan ölçütlerden biri **değildir**?", "opts": [{"t": "10 veya daha fazla kişinin ölmesi"}, {"t": "100 veya daha fazla kişinin etkilenmesi"}, {"t": "İlgili devletin uluslararası yardım çağrısında bulunması"}, {"t": "Yerel imkânlar yetmediği için merkezî hükümetten yardım istenmesi"}, {"t": "Ekonomik kaybın belirli bir dolar eşiğini aşması"}], "a": 4, "exp": "EM-DAT'ın dört ölçütü: **≥10 ölüm**, **≥100 etkilenen** (yaralanan, evsiz kalan, acil yardıma muhtaç), **yerel imkânların yetmemesi** (merkezî hükümetten yardım istenmesi) ve **uluslararası yardım çağrısı**. Ekonomik kayıp eşiği bu ölçütler arasında yoktur.\n💡 \"**10 – 100 – iki yardım**\": 10 ölüm, 100 etkilenen, merkezî veya uluslararası yardım çağrısı."}, {"q": "Bir ilçede meydana gelen olayda 9 kişi ölmüş, 90 kişi etkilenmiştir; ne merkezî hükümetten ne de uluslararası alandan yardım istenmiştir. Bu olayın EM-DAT'a kaydı için hangisi doğrudur?", "opts": [{"t": "EM-DAT'a girmez; ama bu, orada yaşayanlar için afet olmadığı anlamına gelmez"}, {"t": "EM-DAT'a girer; çünkü ölü ve etkilenen sayıları toplamı 99'u bulmuştur"}, {"t": "EM-DAT'a girer; çünkü 9 ölüm on kişilik eşiğe yuvarlanır"}, {"t": "EM-DAT'a girmez; dolayısıyla bilimsel olarak afet sayılamaz"}, {"t": "EM-DAT'a ancak dört ölçütün tamamı sağlanırsa girebilir"}], "a": 0, "exp": "Dört ölçütten **hiçbiri sağlanmadığı** için olay EM-DAT'a girmez (10 ölüm ve 100 etkilenen eşikleri aşılmamış, yardım istenmemiş). Ancak slaytın uyarısı: bu eşikler bir **veri tabanı kuralıdır**; eşiğin altındaki olay orada yaşayanlar için yine afet olabilir. Ayrıca girmek için dört ölçütün hepsi değil, **yalnızca biri** yeterlidir."}, {"q": "Bir olayda 3 kişi ölmüş ve 40 kişi etkilenmiştir; ancak ilgili ülke hükümeti uluslararası yardım çağrısında bulunmuştur. EM-DAT açısından doğru değerlendirme hangisidir?", "opts": [{"t": "Kaydedilmez; ölü sayısı 10'un altındadır"}, {"t": "Kaydedilmez; etkilenen sayısı 100'ün altındadır"}, {"t": "Kaydedilir; ölçütlerden biri yeterlidir"}, {"t": "Kaydedilmez; ölçütlerin en az ikisi sağlanmalıdır"}, {"t": "Ancak merkezî hükümet de yardım isterse kaydedilir"}], "a": 2, "exp": "EM-DAT'a girmek için dört ölçütten **yalnızca biri** yeterlidir; hepsi birden aranmaz. Burada **uluslararası yardım çağrısı** ölçütü sağlandığından olay kaydedilir; düşük ölü/etkilenen sayıları bunu engellemez."}, {"q": "EM-DAT ölçütleriyle ilgili aşağıdaki ifadelerden hangisi **yanlıştır**?", "opts": [{"t": "\"Yerel imkânların yetmemesi\" ölçütü, afet–acil durum ayrımındaki kapasite eşiğinin veri tabanına yazılmış hâlidir"}, {"t": "\"Etkilenen\" kavramına yaralananlar, evsiz kalanlar ve acil yardıma muhtaç hâle gelenler girer"}, {"t": "Bir olayın kaydedilmesi için ölçütlerden biri yeterlidir"}, {"t": "EM-DAT rakamları, eşiğin altındakiler dâhil gerçekleşen tüm olayları yansıtır"}, {"t": "Eşiğin altında kalan bir olay, orada yaşayanlar için yine afet olabilir"}], "a": 3, "exp": "EM-DAT **eşiğin altında kalan olayları göstermez**; gördüğümüz rakamlar gerçeğin tamamı değil, **eşiği aşan kısmıdır**. Bu uyarı dersin istatistik bölümündeki tüm sayılar için geçerlidir. Diğer ifadeler doğrudur: üçüncü ölçüt (yerel imkânların yetmemesi), geçen haftaki **kapasite eşiğinin** işleyen bir ölçüte dönüşmüş hâlidir."}, {"q": "EM-DAT'ın doğa kaynaklı afetler için kullandığı beş alt gruptan biri **değildir**?", "opts": [{"t": "Jeolojik"}, {"t": "Hidrolojik"}, {"t": "Hidrografik"}, {"t": "Klimatolojik"}, {"t": "Biyolojik"}], "a": 2, "exp": "EM-DAT doğa kaynaklı afetleri **jeolojik, hidrolojik, meteorolojik, klimatolojik ve biyolojik** olarak beşe ayırır. **Hidrografik** grup Özey (2006) sınıflandırmasına aittir.\n💡 Tetikleyiciye bak: **yer** (jeolojik), **su** (hidrolojik), **hava** (meteorolojik), **iklim** (klimatolojik), **canlı** (biyolojik)."}, {"q": "EM-DAT sınıflandırmasına göre aşağıdaki eşleştirmelerden hangisi **yanlıştır**?", "opts": [{"t": "Sis – Klimatolojik"}, {"t": "Volkan patlaması – Jeolojik"}, {"t": "Dalga hareketi – Hidrolojik"}, {"t": "Böcek istilası – Biyolojik"}, {"t": "Kuraklık – Klimatolojik"}], "a": 0, "exp": "**Sis**, fırtına ve aşırı sıcaklıkla birlikte **meteorolojik** gruptadır. Jeolojik: deprem, volkan, kütle hareketi; hidrolojik: sel, su kaynaklı heyelan, dalga hareketi; klimatolojik: kuraklık, buzul gölü patlaması, söndürülemeyen yangın; biyolojik: salgın hastalık, böcek istilası, hayvan salgınları."}, {"q": "EM-DAT sınıflandırmasında **buzul gölü patlaması** ve **söndürülemeyen (orman) yangın** hangi alt grupta yer alır?", "opts": [{"t": "Hidrolojik"}, {"t": "Meteorolojik"}, {"t": "Jeolojik"}, {"t": "Klimatolojik"}, {"t": "Biyolojik"}], "a": 3, "exp": "EM-DAT'ta **klimatolojik** grup: **kuraklık, buzul gölü patlaması ve söndürülemeyen yangın**. Buzul gölü patlaması su içerdiği için hidrolojik sanılabilir; orman yangını ise Özey'de biyolojik gruptadır — **EM-DAT'ta klimatolojiktir** çünkü EM-DAT tetikleyiciye (kuraklık ve sıcaklık) bakar."}, {"q": "EM-DAT'ta **meteorolojik** ve **klimatolojik** afetleri birbirinden ayıran temel ölçüt hangisidir?", "opts": [{"t": "Olayın gelişme zaman ölçeği (gün-hafta / ay-yıl)"}, {"t": "Olayın can kaybı sayısı"}, {"t": "Olayın etkilediği coğrafi alanın genişliği"}, {"t": "Olayın insan kaynaklı olup olmaması"}, {"t": "Olayın uluslararası yardım gerektirip gerektirmemesi"}], "a": 0, "exp": "**Meteorolojik** olaylar **gün-hafta** ölçeğinde (fırtına, sıcak hava dalgası), **klimatolojik** olaylar **ay-yıl** ölçeğinde (kuraklık) gelişir. Bu, \"ani gelişen / yavaş gelişen\" ayrımının aynısıdır."}, {"q": "Bir AYAY ekibi aynı ay içinde iki heyelana müdahale ediyor: birincisi şiddetli bir depremin, ikincisi günlerce süren aşırı yağışın tetiklediği heyelan. EM-DAT mantığına göre bu iki heyelan sırasıyla hangi gruplarda sınıflanır?", "opts": [{"t": "Hidrolojik – Jeolojik"}, {"t": "Jeolojik – Hidrolojik"}, {"t": "Jeolojik – Meteorolojik"}, {"t": "Her ikisi de jeolojik"}, {"t": "Her ikisi de hidrolojik"}], "a": 1, "exp": "Heyelan **hem jeolojik hem hidrolojik** grupta geçebilir; **tetikleyicisine göre** sınıflanır. Depremin tetiklediği heyelan **jeolojik**, aşırı yağışın tetiklediği heyelan **hidrolojik** sayılır. Bu, sınıflandırmaların kesin sınırlar olmadığını gösterir."}, {"q": "EM-DAT'a göre teknolojik afetlerin üç alt grubu hangi seçenekte doğru verilmiştir?", "opts": [{"t": "Endüstriyel kazalar, nükleer ve radyolojik kazalar, ulaşım kazaları"}, {"t": "Sosyal afetler, teknolojik afetler, ulaşım kazaları"}, {"t": "Maden kazaları, sanayi kazaları, savaşlar"}, {"t": "Endüstriyel kazalar, karışık/çeşitli kazalar, ulaşım kazaları"}, {"t": "Endüstriyel kazalar, biyolojik kazalar, karışık kazalar"}], "a": 3, "exp": "EM-DAT teknolojik afetleri üçe ayırır: **endüstriyel kazalar** (kimyasal dökülme, çökme, patlama, yangın, gaz sızıntısı, zehirlenme, radyasyon), **karışık/çeşitli kazalar** (sanayi dışı ortamlarda çökme, patlama, yangın, diğer) ve **ulaşım kazaları** (hava, kara, demir, deniz yolu). \"Sosyal–teknolojik\" ayrımı Özey'in beşeri afet sınıflandırmasıdır."}, {"q": "Sanayi tesisi olmayan bir alışveriş merkezinde meydana gelen çökme ve ardından çıkan yangın, EM-DAT teknolojik afet sınıflandırmasında hangi gruba girer?", "opts": [{"t": "Endüstriyel kazalar"}, {"t": "Ulaşım kazaları"}, {"t": "Klimatolojik afetler"}, {"t": "Karışık / çeşitli kazalar"}, {"t": "Sosyal afetler"}], "a": 3, "exp": "**Karışık/çeşitli kazalar** (miscellaneous accidents), **sanayi dışı ortamlarda** meydana gelen çökme, patlama, yangın ve diğer olaylardır. Aynı olay bir fabrikada olsaydı **endüstriyel kaza** sayılırdı. \"Sosyal afetler\" EM-DAT'ın değil Özey'in kategorisidir."}, {"q": "Trafik kazaları ve teknolojik afetlerle ilgili derste yapılan değerlendirmelere göre hangisi doğrudur?", "opts": [{"t": "Trafik kazaları hiçbir koşulda afet sayılmaz; ölü ve yaralı sayısı ne olursa olsun acil durumdur"}, {"t": "Çok araçlı ve yerel kaynakların yetmediği bir kaza ulaşım kazası olarak afet kaydedilebilir"}, {"t": "Tek araçlı her trafik kazası EM-DAT'ta ulaşım afeti olarak kaydedilir"}, {"t": "Ulaşım kazaları EM-DAT'ta endüstriyel kazalar grubunda yer alır"}, {"t": "Deprem sonrası çıkan fabrika yangınının kategorisi kesin olarak jeolojiktir"}], "a": 1, "exp": "Tek araçlı kaza **acil durumdur**; ancak çok sayıda araç ve yaralının olduğu, **yerel kaynakların yetmediği** bir olay **ulaşım kazası** kategorisinde afet olarak kaydedilir. Ulaşım kazaları ayrı bir alt gruptur. Deprem sonrası fabrika yangınının kategorisi **tartışmalıdır** — bu, 11. haftada işlenecek **NaTech** kavramının sınıflandırmadaki karşılığıdır."}, {"q": "EM-DAT verilerine göre 1900–2016 arasında kaydedilen **teknolojik** afet sayısı ve bunun toplam içindeki yaklaşık payı hangisidir?", "opts": [{"t": "14.145 – yaklaşık üçte iki"}, {"t": "8.361 – yaklaşık onda bir"}, {"t": "18.000 – yaklaşık yarısı"}, {"t": "14.145 – yaklaşık üçte bir"}, {"t": "8.361 – yaklaşık üçte bir"}], "a": 4, "exp": "1900–2016 arasında **14.145 doğa kaynaklı** ve **8.361 teknolojik** afet kaydedilmiştir; yani **her üç afetten biri teknolojiktir**. Öğrenciler afeti doğa olayıyla eşitlediği için bu oran şaşırtıcı gelir — teknolojik afetler istisna değil, afet tablosunun büyük bir parçasıdır."}, {"q": "Türkiye'de afet sınıflandırmasıyla ilgili derste vurgulanan \"kritik nokta\" hangisidir?", "opts": [{"t": "Tüm kurumlar EM-DAT sınıflandırmasını zorunlu olarak kullanır"}, {"t": "AFAD'ın sınıflandırması tek resmî sınıflandırmadır"}, {"t": "Kalkınma Bakanlığı sınıflandırması yasal olarak bağlayıcıdır"}, {"t": "Ortak kabul gören bir afet sınıflandırması yoktur"}, {"t": "Özey (2006) sınıflandırması kanunla kabul edilmiştir"}], "a": 3, "exp": "Türkiye'de **ortak kabul gören bir afet sınıflandırması yoktur**. **AFAD, Meteoroloji Genel Müdürlüğü ve Devlet Su İşleri** gibi kurumlar kendi sorumluluk alanlarına göre farklı sınıflandırmalar kullanır. Bu yüzden aynı olay farklı kurumlarda farklı kategoride kaydedilebilir ve istatistikler tam karşılaştırılamaz."}, {"q": "Türkiye'de ortak bir afet sınıflandırması olmamasının olası olumsuz sonuçlarıyla ilgili aşağıdakilerden hangileri doğrudur?\nI. Kurumlar arası veriler karşılaştırılamaz.\nII. Aynı olay iki kez sayılabilir ya da hiç sayılmayabilir.\nIII. Kaynak dağıtımı hatalı yapılabilir ve uluslararası raporlamada tutarsızlık doğabilir.", "opts": [{"t": "I, II ve III"}, {"t": "Yalnız I"}, {"t": "I ve II"}, {"t": "II ve III"}, {"t": "Yalnız III"}], "a": 0, "exp": "Derste beklenen cevapların hepsi: **kurumlar arası veri karşılaştırılamaz**, **aynı olay iki kez sayılabilir veya hiç sayılmayabilir**, **kaynak dağıtımı hatalı yapılır**, **uluslararası raporlamada tutarsızlık** doğar, akademik çalışmalar birbirini doğrulayamaz. Bu yalnızca bir düzen meselesi değildir.\n💡 Akılda kalıcı cümle: \"**Yanlış sayılan bir afet, yanlış ayrılan bir bütçedir.**\""}, {"q": "Afetleri kaynağına göre en yalın biçimde **doğa kaynaklı** ve **insan kaynaklı** olarak ikiye ayıran sınıflandırma hangisidir?", "opts": [{"t": "Özey (2006) sınıflandırması"}, {"t": "Bryant (1993) sınıflandırması"}, {"t": "Kalkınma Bakanlığı (2014)"}, {"t": "EM-DAT (CRED) sınıflandırması"}, {"t": "Barış (2012) çalışması"}], "a": 2, "exp": "**Kalkınma Bakanlığı (2014)** — *Afet Yönetiminde Etkinlik Özel İhtisas Komisyonu raporu* — afetleri en yalın biçimde **doğa kaynaklı** ve **insan kaynaklı** olarak ikiye ayırır. Özey doğal afetleri dörde ayırır, Bryant sınıflandırmaya karşı çıkar, Barış (2012) ise Türkiye'nin afet profilini veren çalışmadır."}, {"q": "Kalkınma Bakanlığı (2014) sınıflandırmasına göre aşağıdakilerden hangisi **insan kaynaklı** afetler arasında yer alır?", "opts": [{"t": "Orman yangını ve erozyon"}, {"t": "Göç ve mülteci krizleri"}, {"t": "Fırtına, hortum, dolu ve don"}, {"t": "Salgın hastalıklar ve böcek istilası"}, {"t": "Çığ"}], "a": 1, "exp": "Kalkınma Bakanlığı listesinde **insan kaynaklı** afetler: endüstriyel ve maden kazaları, ulaşım kazaları, nükleer/biyolojik/kimyasal olaylar, büyük yangınlar ve çevre kirlenmeleri, **savaş, terör, göç ve mülteci krizleri**. **Orman yangını, erozyon, böcek istilası ve çığ** ise doğa kaynaklı sütundadır. Göçün afet sayılmasının nedeni **kapasite eşiğidir**: kısa sürede çok sayıda insanın barınma, sağlık ve beslenme ihtiyacı yerel kapasiteyi aşar."}, {"q": "Kalkınma Bakanlığı sınıflandırmasıyla ilgili hangisi doğrudur?", "opts": [{"t": "İki sütun sorumluluğun değil, tetikleyicinin ayrımıdır"}, {"t": "Doğa kaynaklı afetlerde insan payı bulunmadığını kabul eder"}, {"t": "Bakanlık hâlen afet istatistiklerini tutan kurumdur"}, {"t": "Raporu 2018 tarihli olup EM-DAT'ın beş grubunu kullanır"}, {"t": "Salgın hastalıkları insan kaynaklı afetler arasında sayar"}], "a": 0, "exp": "\"Doğa kaynaklı\" demek o afette **insan payı olmadığı anlamına gelmez**: kaynağı doğadır, büyüklüğünü belirleyen insandır — iki sütun **tetikleyicinin** ayrımıdır. Rapor **2014** tarihlidir; Kalkınma Bakanlığı **2018'de kapatılmış**, görevleri **Cumhurbaşkanlığı Strateji ve Bütçe Başkanlığı**'na devredilmiştir. Salgın hastalıklar ve böcek istilası bu sınıflandırmada **doğa kaynaklı** sütundadır."}, {"q": "Özey (2006)'nın doğal afetler için kullandığı dört grup aşağıda
