rem** (5.318 olay, 158.241 afetzede — olay başına ≈30 kişi). Toplam: **29.807 olay, 284.996 afetzede**. 💡 Heyelan kırsalda birkaç evi, deprem şehri aynı anda vurur."}, {"t": "İller: Erzurum ve Kocaeli", "b": "Olay sayısında **Erzurum** (1.517) ilk sırada — dağlık, yağışlı Doğu illeri sürekli ama küçük afetler yaşar. Afetzede sayısında **Kocaeli** (39.524) zirvede — Sakarya ve Düzce ile birlikte tek bir olayın, **17 Ağustos 1999 Marmara depreminin** sonucu. 💡 Sık afet ile büyük afet farklı hazırlık gerektirir."}, {"t": "Ölü/yaralı oranı", "b": "AYAY için en önemli sağlık göstergesidir: **depremde yaralı > ölü** (1 ölüme 2-3 yaralı — kurtarılabilir hasta çok); **selde ve tsunamide oran tersine döner** — boğulma hâkimdir, yaralı azdır. Bu oran kaç ambulans ve kaç yatak gerektiğini belirler. 💡 Hasta profili de afet türüne bağlıdır: deprem → ezilme/travma; sel → boğulma, sonrasında salgın; sıcak dalga → dolaşım/solunum; yangın → inhalasyon/yanık."}, {"t": "Kitabın eskiyen verileri", "b": "Kitap 2018 baskısıdır: **COVID-19** ve **6 Şubat 2023** depremleri yoktur; 'yıllık kayıp GSMH'nin %3'ü' tahmini geçerliliğini yitirmiştir. Güncel veri: **emdat.be** (dünya) ve **tabb.afad.gov.tr** (Türkiye). 💡 İstatistik okurken ilk soru: 'Bu veri hangi döneme ait?'"}]}, {"title": "Deprem I: Oluşum ve Ölçütler", "desc": "Deprem tanımı, yerin iç yapısı, levha sınırları, elastik geri sekme, öncü-ana şok-artçı, deprem dalgaları ve gölge bölgesi, odak-dış merkez-derinlik, büyüklük ve şiddet (MSK), kökene göre türler, deprem tahmini, L'Aquila ve erken uyarı", "short": "Deprem I", "questions": [{"q": "Ders notlarına göre Türkiye'de son 70 yılda afet kaynaklı can ve mal kaybının yüzde kaçı depremden kaynaklanmıştır?", "opts": [{"t": "%80"}, {"t": "%45"}, {"t": "%62"}, {"t": "%15"}, {"t": "%96"}], "a": 2, "exp": "Son 70 yılda afet kaynaklı can ve mal kaybının **%62**'si depremden gelmiştir. **%96** ise Türkiye topraklarının deprem kuşağı içindeki oranıdır; ikisi sık karıştırılır. %15 heyelanın payıdır.\n💡 \"96 toprak, 62 kayıp\": iki sayıyı birlikte ezberleyin, dönem boyunca tekrar gelecek."}, {"q": "Ders kitabındaki tanıma göre deprem nedir?", "opts": [{"t": "Yerkabuğundaki kırılmalarla ani oluşan titreşimlerin dalgalar hâlinde yayılıp yeryüzünü sarsması"}, {"t": "Levhaların birbirinden uzaklaşarak okyanus ortası sırtları oluşturması"}, {"t": "Yer altı sularının çekilmesiyle zeminin yavaş yavaş oturması ve çatlaması"}, {"t": "Astenosferdeki konveksiyon akımlarının yeryüzünü yıllar içinde yavaşça yükseltmesi"}, {"t": "Magmanın yeryüzüne çıkarken çevredeki kayaçları ısıtıp genleştirmesi olayı"}], "a": 0, "exp": "Kitap tanımı: Deprem, **yerkabuğu içindeki kırılmalar** nedeniyle ani olarak ortaya çıkan **titreşimlerin dalgalar hâlinde yayılarak** geçtikleri ortamları ve yeryüzeyini sarsma olayıdır. Tanımın merkezinde **kırılma** vardır; sarsıntı kırılmanın sonucudur. Konveksiyon akımları levhaları hareket ettiren kuvvettir, depremin kendisi değildir."}, {"q": "Depremlerin oluş nedenlerini, dalgaların yayılımını, ölçülmesini ve deprem tehlikesinin belirlenmesini inceleyen uzmanlık alanı hangisidir?", "opts": [{"t": "Volkanoloji"}, {"t": "Jeomorfoloji"}, {"t": "Sismoloji"}, {"t": "Hidroloji"}, {"t": "Meteoroloji"}], "a": 2, "exp": "**Sismoloji (deprem bilimi)**, depremlerin oluş nedenlerini, dalgaların yayılımını, ölçülmesini ve deprem tehlikesinin belirlenmesini inceleyen **jeofizik mühendisliği** uzmanlık alanıdır. Diğerleri: volkanoloji volkanları, jeomorfoloji yer şekillerini, hidroloji suları, meteoroloji atmosferi inceler."}, {"q": "Depremler yerkürenin hangi katmanında oluşur?", "opts": [{"t": "Manto"}, {"t": "Astenosfer"}, {"t": "Litosfer"}, {"t": "Dış çekirdek"}, {"t": "İç çekirdek"}], "a": 2, "exp": "Depremler yalnızca en dıştaki **katı ve kırılgan** katman olan **litosferde (taşküre)** oluşur; kırılabilmesi için kayacın katı ve gevrek olması gerekir. **Astenosfer** yumuşaktır ve yavaş akar; levhaları hareket ettiren konveksiyon akımları burada oluşur ama deprem burada doğmaz."}, {"q": "Yerkürenin katmanlarının dıştan içe doğru sıralaması hangisidir?", "opts": [{"t": "Litosfer – astenosfer – dış çekirdek – manto – iç çekirdek"}, {"t": "Litosfer – manto – astenosfer – dış çekirdek – iç çekirdek"}, {"t": "Astenosfer – litosfer – manto – iç çekirdek – dış çekirdek"}, {"t": "Manto – litosfer – astenosfer – dış çekirdek – iç çekirdek"}, {"t": "Litosfer – astenosfer – manto – dış çekirdek – iç çekirdek"}], "a": 4, "exp": "Dıştan içe beş katman: **Litosfer → Astenosfer → Manto → Dış çekirdek (sıvı) → İç çekirdek (katı)**. Merkeze uzaklık yaklaşık **6371 km**'dir.\n💡 Baş harfler: **L-A-M-D-İ** (Litosfer, Astenosfer, Manto, Dış, İç)."}, {"q": "Ders notlarına göre dünyada yaklaşık kaç büyük levha vardır ve depremler genel olarak nerede toplanır?", "opts": [{"t": "10 kadar büyük levha; depremler levha sınırlarında toplanır"}, {"t": "5 büyük levha; depremler yalnızca kıtaların iç kısımlarında görülür"}, {"t": "3 büyük levha; depremler levhaların ortasında toplanır"}, {"t": "10 kadar büyük levha; depremler rastgele dağılır"}, {"t": "25 kadar büyük levha; depremler okyanusların ortasında toplanır"}], "a": 0, "exp": "Dünyada **10 kadar büyük** ve çok sayıda küçük levha vardır. Depremler rastgele dağılmaz; büyük ölçüde **levha sınırlarında** toplanır. Levha sınırları dört türe ayrılır."}, {"q": "Isı akımlarının yükseldiği yerlerde levhaların birbirinden ayrılması ve çıkan sıcak magmanın yeni yapı oluşturmasıyla karakterize levha sınırı hangisidir?", "opts": [{"t": "Yanal yer değiştirme zonu"}, {"t": "Okyanus ortası sırtlar"}, {"t": "Sıradağ kuşağı"}, {"t": "Çarpışma zonu"}, {"t": "Yitim zonu"}], "a": 1, "exp": "**Okyanus ortası sırtlar**da levhalar **birbirinden uzaklaşır**; ısı akımlarının yükseldiği yerlerde çıkan sıcak magma sırtları oluşturur. Yitimde bir levha diğerinin altına dalar, çarpışmada sıradağlar oluşur, yanal yer değiştirmede bloklar yatay kayar."}, {"q": "Sürtünen levhalardan birinin mantoya batıp eridiği ve derin depremlerin çoğunlukla görüldüğü levha sınırı türü hangisidir?", "opts": [{"t": "Yitim zonu"}, {"t": "Doğrultu atımlı fay zonu"}, {"t": "Çarpışma zonu"}, {"t": "Yanal yer değiştirme zonu"}, {"t": "Okyanus ortası sırt"}], "a": 0, "exp": "**Yitim zonunda** bir levha diğerinin altına dalar, mantoya batar ve erir. **Derin (ve orta derinlikte) depremler** çoğunlukla buralarda olur. Japonya bir yitim zonu üzerindedir; bu yüzden hem daha sık hem daha büyük deprem üretir ve derin odaklı depremler görülür. Türkiye'de bu tip bir zon yoktur."}, {"q": "Himalayalar hangi levha sınırı mekanizmasının ürünüdür?", "opts": [{"t": "Çöküntü havzası"}, {"t": "Okyanus ortası sırt"}, {"t": "Çarpışma zonu"}, {"t": "Yitim zonu"}, {"t": "Yanal yer değiştirme zonu"}], "a": 2, "exp": "**Çarpışma zonunda** levhalar yan yana gelip çarpışır; sıkışma sonucu çok yüksek **sıradağlar** oluşur. **Himalayalar** bu mekanizmanın ürünüdür."}, {"q": "Kuzey Anadolu Fayı ve Doğu Anadolu Fayı, levha sınırı türlerinden hangisine girer?", "opts": [{"t": "Yanal yer değiştirme zonu"}, {"t": "Yitim zonu"}, {"t": "Çarpışma zonu"}, {"t": "Okyanus ortası sırt"}, {"t": "Volkanik kuşak"}], "a": 0, "exp": "Türkiye'nin en bilinen fayları (**KAF ve DAF**) **yanal atımlı** faylardır: iki blok birbirine göre **yatay** yönde yer değiştirir. Bu nedenle Türkiye depremleri **sığdır (5–10 km)** ve dar bir alanda çok ağır hasar yapar."}, {"q": "Depremin oluşumunu açıklayan elastik geri sekme kuramını 1906 San Francisco depreminden sonra ortaya koyan bilim insanı kimdir?", "opts": [{"t": "Beno Gutenberg"}, {"t": "H. F. Reid"}, {"t": "Richard Oldham"}, {"t": "C. F. Richter"}, {"t": "Inge Lehmann"}], "a": 1, "exp": "**Elastik geri sekme kuramı**, **1906 San Francisco** depreminden sonra **H. F. Reid** tarafından ortaya konmuştur. Richter magnitüd tanımıyla (1935), Gutenberg çekirdek sınırıyla, Lehmann iç çekirdekle, Oldham çekirdeğin varlığıyla bilinir."}, {"q": "Elastik geri sekme kuramına göre deprem oluşum aşamalarının doğru sıralaması hangisidir?", "opts": [{"t": "Kırılma → sıkışma → yayılma → geri sekme"}, {"t": "Sıkışma → geri sekme → yayılma → kırılma"}, {"t": "Geri sekme → sıkışma → kırılma → yayılma"}, {"t": "Sıkışma → kırılma → geri sekme → yayılma"}, {"t": "Yayılma → sıkışma → kırılma → geri sekme"}], "a": 3, "exp": "Sıra: **1. Sıkışma** (levhalar iter, kayaç bükülür ve elastik enerji biriktirir) → **2. Eşik aşılır** (kuvvet sürtünme direncini aşar, kayaç kırılır) → **3. Geri sekme** (kayaç yay gibi eski şekline döner; potansiyel enerji kinetik enerjiye dönüşür) → **4. Yayılma** (enerji sismik dalgalar hâlinde yayılır, uzaklaştıkça azalır).\n💡 Cetvel benzetmesi: plastik cetveli bük (enerji birikir), kırıldığı anda parçalar yerine döner ve titreşim duyulur."}, {"q": "\"Bölgemizde sık sık küçük depremler oluyor, böylece enerji boşalıyor ve büyük deprem olmaz.\" görüşü için ders notlarına göre hangisi doğrudur?", "opts": [{"t": "Doğrudur; ancak yalnızca yitim zonlarında geçerlidir"}, {"t": "Doğrudur; yaklaşık 10 tane Mw 4,0 deprem bir Mw 7,0 depremin enerjisini boşaltır"}, {"t": "Doğrudur; küçük depremler fayı tamamen kilitler"}, {"t": "Yanlıştır; bir Mw 7,0 için yaklaşık 32.000 Mw 4,0 deprem gerekir"}, {"t": "Yanlıştır; çünkü küçük depremler enerjiyi artırır"}], "a": 3, "exp": "Magnitüd **logaritmiktir**: 1 birim artışta enerji yaklaşık **31,6 (≈32) kat** artar. 3 birim fark → 32×32×32 ≈ **32.000**. Bu yüzden büyük bir depremin enerjisini küçük depremlerle boşaltmak pratikte imkânsızdır. L'Aquila'daki \"enerji boşaldı, tehlike yok\" mesajı da bu yanılgıya dayanır."}, {"q": "Uzun süredir deprem üretmemiş fay segmentlerinin daha tehlikeli kabul edilmesinin mantığını açıklayan kavram hangisidir?", "opts": [{"t": "Doyuma ulaşma"}, {"t": "Sismik boşluk"}, {"t": "Deprem fırtınası"}, {"t": "Zemin büyütmesi"}, {"t": "Gölge bölgesi"}], "a": 1, "exp": "Elastik geri sekmeye göre enerji yıllar içinde birikir ve deprem anında salınır. Uzun süredir kırılmamış segmentlerde enerji birikmeye devam ettiği için bu bölgeler daha tehlikelidir — **sismik boşluk** kavramının mantığı budur. Gölge bölgesi dalgaların ulaşmadığı alan, zemin büyütmesi yumuşak zeminin genliği artırması, doyuma ulaşma ise Ml'nin büyük depremleri ayırt edememesidir."}, {"q": "Öncü depremlerle ilgili aşağıdaki ifadelerden hangisi doğrudur?", "opts": [{"t": "Büyüklükleri ana şoktan genellikle 1 derece büyüktür"}, {"t": "Her büyük depremden önce mutlaka görülürler"}, {"t": "Serideki en büyük sarsıntıdır"}, {"t": "Ana şoktan sonra yıllarca sürebilirler"}, {"t": "Her zaman olmadıkları için tahmin aracı değildirler"}], "a": 4, "exp": "**Öncü deprem**, büyük depremden önce meydana gelen küçük sarsıntılardır; **her zaman olmayabilir**, bu yüzden bir uyarı sistemi/tahmin aracı olarak kullanılamaz (kitapta \"dikkat\" kutusu). Serinin en büyüğü **ana şok**, yıllarca sürebilen ve ana depremden ~1 derece küçük olanlar **artçı**lardır."}, {"q": "Ders notlarına göre en büyük artçı deprem genellikle ana depremden ne kadar küçüktür?", "opts": [{"t": "Yaklaşık 3 derece"}, {"t": "Yaklaşık 5 derece"}, {"t": "Yaklaşık 1 derece"}, {"t": "Artçı her zaman ana şoktan büyüktür"}, {"t": "Yaklaşık 0,1 derece"}], "a": 2, "exp": "Artçılar ana sarsıntıdan sonra bir süre devam eden küçük depremlerdir; **en büyük artçı genellikle ana depremden yaklaşık 1 derece küçüktür**. Ana şoktan büyük bir deprem gelirse, ilk deprem geriye dönük olarak öncü sayılır."}, {"q": "AFAD (2014) bilgisine göre artçı depremlerle ilgili hangisi doğrudur?", "opts": [{"t": "M ≥ 7,0 depremlerin artçıları senelerce sürebilir, giderek azalır"}, {"t": "Artçıların sıklığı zamanla artar"}, {"t": "Artçıların büyüklüğü zamanla artarak ana şoku geçer"}, {"t": "Artçılar en fazla 72 saat sürer, sonra tamamen biter"}, {"t": "Yalnızca magnitüdü 5,0'ın altındaki depremlerin artçısı olur"}], "a": 0, "exp": "AFAD'a (2014) göre **magnitüdü 7,0 ve üzerindeki** depremlerin artçıları **senelerce** sürebilir; ancak enerjileri sönümlendiği için hem **sıklıkları hem büyüklükleri zamanla azalır**."}, {"q": "Dünyada ve Türkiye'de yılda saptanan irili ufaklı deprem sayısı yaklaşık olarak hangisidir?", "opts": [{"t": "Dünya ~23.000; Türkiye ~500"}, {"t": "Dünya ~500.000; Türkiye ~23.000"}, {"t": "Dünya ~50.000; Türkiye ~2.300"}, {"t": "Dünya ~500.000; Türkiye ~62.000"}, {"t": "Dünya ~5.000; Türkiye ~230"}], "a": 1, "exp": "Dünyada yılda yaklaşık **500.000**, Türkiye'de yaklaşık **23.000** deprem saptanır. Yani dünyadaki depremlerin yaklaşık **yirmide biri** Türkiye'dedir ve bu günde ortalama **60'tan fazla** deprem demektir — oysa Türkiye dünya kara yüzeyinin yalnızca **binde ikisi** kadardır."}, {"q": "Türkiye'deki başlıca tektonik kuşaklar olarak ders notlarında sayılanlar hangi seçenekte doğru verilmiştir?", "opts": [{"t": "Kuzey Anadolu Fayı, San Andreas Fayı, Ege Çöküntü Fay Sistemi"}, {"t": "Doğu Anadolu Fayı, Himalaya Çarpışma Zonu, Ege Yitim Zonu"}, {"t": "Ege Çöküntü Fay Sistemi, Japon Yitim Zonu, Doğu Anadolu Fayı"}, {"t": "Kuzey Anadolu Fayı, Doğu Anadolu Fayı, Karadeniz Yitim Zonu"}, {"t": "Kuzey Anadolu Fayı, Doğu Anadolu Fayı, Ege Çöküntü Fay Sistemi"}], "a": 4, "exp": "Türkiye'nin başlıca tektonik kuşakları **Kuzey Anadolu Fayı**, **Doğu Anadolu Fayı** ve **Ege Çöküntü Fay Sistemi**dir; topraklarımızın yaklaşık **%96**'sı deprem kuşağı içindedir. Çeldiricilerdeki San Andreas Fayı, Himalaya Çarpışma Zonu ve yitim zonları Türkiye'de yer almaz."}, {"q": "P dalgası ile ilgili aşağıdaki ifadelerden hangisi YANLIŞTIR?", "opts": [{"t": "Boyuna dalgadır; titreşim yayılma doğrultusuyla aynı yöndedir"}, {"t": "Hasar verme etkisi düşüktür"}, {"t": "Kayıt aletlerine ilk ulaşan dalgadır"}, {"t": "Sıvı ve gaz ortamlardan geçemez"}, {"t": "Hızı yaklaşık 5–7 km/sn'dir ve en hızlı dalgadır"}], "a": 3, "exp": "**P dalgası** katı, sıvı ve gazın **hepsinde** yayılabilir. Sıvı ve gazdan geçemeyen **S dalgası**dır. P dalgası boyuna, 5–7 km/sn, ilk ulaşan ve hasar etkisi düşük dalgadır; depremin yer ve büyüklüğünü belirlemede kullanılır."}, {"q": "S dalgası ile ilgili aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Katı, sıvı ve gazların hepsinde yayılabilir"}, {"t": "Boyuna dalgadır ve hızı 5–7 km/sn'dir"}, {"t": "Kayıt aletlerine ilk ulaşan dalgadır"}, {"t": "Enine dalgadır ve yapılardaki yıkımı üretir"}, {"t": "Hasar verme etkisi en düşük olan dalgadır"}], "a": 3, "exp": "**S (Secondary) dalgası** **enine**dir, titreşimi yayılma doğrultusuna **dik**tir, hızı **3–4 km/sn**'dir ve kayıt aletlerinde **ikinci** görülür. Yalnızca şekil değişimine dirençli ortamlarda (katılarda) ilerler; **yapılardaki yıkımı üreten** dalgadır. Erken uyarı sistemi bu dalganın varış süresine göre tasarlanır."}, {"q": "P ve S dalgalarının yaklaşık yayılma hızları hangi seçenekte doğru verilmiştir?", "opts": [{"t": "P: 5–7 km/sn; S: 3–4 km/sn"}, {"t": "P ve S: aynı hızda, 3–4 km/sn"}, {"t": "P: 5–7 km/sn; S: 8–10 km/sn"}, {"t": "P: 3–4 km/sn; S: 5–7 km/sn"}, {"t": "P: 1–2 km/sn; S: 5–7 km/sn"}], "a": 0, "exp": "**P dalgası 5–7 km/sn** (en hızlı), **S dalgası 3–4 km/sn**. Yüzey dalgaları ise en yavaştır.\n💡 \"Hızlı olan zararsız, yavaş olan yıkıcıdır\" — aradaki zaman farkı erken uyarının tüm mantığıdır."}, {"q": "S dalgasının sıvılardan geçememesinin nedeni nedir?", "opts": [{"t": "Sıvıların katılardan daha yoğun olması"}, {"t": "Sıvıların sıkıştırmaya direnç göstermemesi"}, {"t": "Sıvıların kesme (makaslama) kuvvetine direnç göstermemesi"}, {"t": "S dalgasının hızının sıvıda ışık hızına ulaşması"}, {"t": "Sıvıların S dalgasını yüzey dalgasına dönüştürmesi"}], "a": 2, "exp": "Yana sallanan (enine) bir dalganın ilerlemesi için ortamın şeklini koruması, yani **kesme (makaslama) kuvvetine direnç** göstermesi gerekir. Katılar bu direnci gösterir; sıvılar ve gazlar göstermez. **Sıkıştırmaya** ise sıvılar da direnç gösterir — bu yüzden **P dalgası** sıvıdan geçebilir."}, {"q": "P dalgası ile S dalgası arasındaki varış farkıyla ilgili aşağıdaki ifadelerden hangisi doğrudur?", "opts": [{"t": "Uzaklık arttıkça fark büyür; dış merkeze çok yakında sıfıra yaklaşır"}, {"t": "Dış merkezde fark en büyüktür"}, {"t": "Fark yalnızca odak derinliğine bağlıdır, uzaklıkla hiçbir ilişkisi yoktur"}, {"t": "Uzaklık arttıkça fark küçülür"}, {"t": "Fark uzaklıktan bağımsızdır; her yerleşimde yaklaşık 15 saniyedir"}], "a": 0, "exp": "İki dalga farklı hızlarla gittiği için **uzaklık arttıkça aradaki süre büyür**. **Dış merkeze çok yakın** yerleşimlerde bu süre **sıfıra yaklaşır** — erken uyarı onlara hiçbir şey kazandırmaz. Uyarı süresi birkaç saniye ile bir dakikaya kadar değişir."}, {"q": "Türkiye'de deprem erken uyarı sisteminin etkinliğini sınırlayan en önemli dezavantaj nedir?", "opts": [{"t": "Türkiye'deki depremlerin volkanik kökenli olması"}, {"t": "Türkiye'de P dalgası oluşmaması"}, {"t": "Türkiye'nin yitim zonu üzerinde bulunması"}, {"t": "Depremlerin sığ olması ve şehirlerin fay üzerinde olması"}, {"t": "Depremlerin derin odaklı (300–700 km) olması"}], "a": 3, "exp": "Türkiye'de depremler **sığdır (5–10 km)** ve **şehirler fayların üzerinde** kuruludur; sığ ve yakın deprem **P–S arasındaki süreyi kısaltır**. Bu nedenle kitap, Türkiye'de erken uyarı sisteminin bir şehre yönelik değil **bölgeye göre** düşünülerek kurulmasında fayda olduğunu söyler (s. 39)."}, {"q": "Odak (hiposantr) ve dış merkez (episantr) ile ilgili aşağıdaki ifadelerden hangisi doğrudur?", "opts": [{"t": "Odak enerjinin yer içinde açığa çıktığı nokta, dış merkez onun iz düşümüdür"}, {"t": "Odak, depremin en kuvvetli hissedildiği yeryüzü noktasıdır"}, {"t": "Hiposantr dış merkezi, episantr odağı ifade eder"}, {"t": "Odak ile dış merkez arasındaki yatay mesafeye odak derinliği denir"}, {"t": "Dış merkez, yerin içinde enerjinin açığa çıktığı noktadır"}], "a": 0, "exp": "**Odak (hiposantr)**: yerin içinde enerjinin açığa çıktığı nokta. **Dış merkez (episantr)**: odağa en yakın yeryüzü noktası, yani odağın **iz düşümü**. İkisi arasındaki **dik** mesafe **odak derinliği**dir.\n💡 Yunanca 'hypo' = alt (hiposantr, aşağıda); 'epi' = üst (episantr, yüzeyde)."}, {"q": "Yumuşak zeminin, içinden geçen deprem dalgalarının genliğini artırması ve sarsıntıyı uzatmasına ne ad verilir?", "opts": [{"t": "Elastik geri sekme"}, {"t": "Doyuma ulaşma"}, {"t": "Zemin büyütmesi"}, {"t": "Sönümlenme"}, {"t": "Gölge bölgesi"}], "a": 2, "exp": "**Zemin büyütmesi**: yumuşak zeminin dalga **genliğini artırması** ve sarsıntıyı **uzatması**. 1985 Meksika'da Texcoco Gölü kili; 1999'da Gölcük dış merkezli depremde ~100 km uzaktaki **İstanbul Avcılar**'da gevşek zemindeki ağır hasar bunun örnekleridir. **Sönümlenme** ise enerjinin mesafeyle azalmasıdır (tersi)."}, {"q": "Odak derinliğine göre deprem sınıflaması hangi seçenekte doğru verilmiştir?", "opts": [{"t": "Sığ: 0–30 km; orta: 30–300 km; derin: 300–700 km"}, {"t": "Sığ: 0–10 km; orta: 10–70 km; derin: 70–300 km"}, {"t": "Sığ: 0–100 km; orta: 100–350 km; derin: 350–2900 km"}, {"t": "Sığ: 0–70 km; orta: 70–500 km; derin: 500–1000 km"}, {"t": "Sığ: 0–70 km; orta: 70–300 km; derin: 300–700 km"}], "a": 4, "exp": "Derinliğe göre: **sığ 0–70 km**, **orta 70–300 km**, **derin odaklı 300–700 km**. Sınıflama sınavda doğrudan sorulabilir.\n💡 \"70 – 300 – 700\": üç sayı, üç sınıf."}, {"q": "Aynı büyüklükte iki depremden biri 10 km, diğeri 400 km derinlikte olmuştur. Hangisi doğrudur?", "opts": [{"t": "400 km derinlikteki deprem dar alanda ağır hasar yapar"}, {"t": "10 km derinlikteki deprem dar alanda hissedilir ama daha çok hasar yapar"}, {"t": "10 km derinlikteki deprem daha geniş alanda hissedilir"}, {"t": "400 km derinlikteki deprem daha çok hasar yapar, çünkü daha fazla enerji açığa çıkarır"}, {"t": "İkisi de aynı magnitüdde olduğu için aynı hasarı yapar"}], "a": 1, "exp": "Aynı magnitüd = **aynı enerji**; tek fark derinlik. Enerji odaktan yeryüzüne ulaşana kadar mesafeyle **sönümlenir**. **Sığ deprem**: dar alan, ağır hasar. **Derin deprem**: geniş alan, az hasar. Sezgiye ters olduğu için sınavda ayırt edici sorudur: \"Derin depremler daha az hasar yapar\" ifadesi **doğrudur**."}, {"q": "Ders notlarına göre Türkiye'deki depremlerin odak derinliği için hangisi doğrudur?", "opts": [{"t": "Genellikle derin odaklıdır (300–700 km)"}, {"t": "Genellikle orta derinliktedir (70–300 km)"}, {"t": "Türkiye'de sığ deprem görülmez"}, {"t": "Genellikle sığdır; şehirlerin altında çoğunlukla 5–10 km"}, {"t": "Şehirlerin altında çoğunlukla 100–350 km'dir"}], "a": 3, "exp": "Türkiye depremleri **genellikle sığdır (0–60 km)**; şehirlerimizin altında odak derinliği çoğunlukla **5–10 km**'dir. Bu nedenle aynı magnitüddeki bir deprem Türkiye'de başka ülkelerden **daha ağır hasar** yapar ve erken uyarı için kalan süre kısalır."}, {"q": "Magnitüd 1 birim arttığında zemin hareketinin genliği ve açığa çıkan enerji yaklaşık kaç kat artar?", "opts": [{"t": "Genlik ve enerji 10'ar kat"}, {"t": "Genlik 10, enerji ~31,6 kat"}, {"t": "Genlik 2 kat, enerji 10 kat"}, {"t": "Genlik 10 kat, enerji 1000 kat"}, {"t": "Genlik 31,6 kat, enerji 10 kat"}], "a": 1, "exp": "Magnitüd **logaritmik**tir: 1 birim artışta **genlik 10 kat**, **enerji ~31,6 kat** artar. Yani 7,7'lik bir deprem 6,7'nin ~**32 katı**, 5,7'nin ~**1000 katı** enerji açığa çıkarır."}, {"q": "Mw 7,7 büyüklüğündeki bir deprem, Mw 5,7 büyüklüğündeki bir depremin yaklaşık kaç katı enerji açığa çıkarır?", "opts": [{"t": "Yaklaşık 20 katı"}, {"t": "Yaklaşık 100 katı"}, {"t": "Yaklaşık 2 katı"}, {"t": "Yaklaşık 32 katı"}, {"t": "Yaklaşık 1000 katı"}], "a": 4, "exp": "Her birimde enerji ~32 kat artar; 2 birim fark → 32 × 32 ≈ **1000 kat**. 1 birim fark (7,7 ile 6,7) ~32 kat olurdu; genlik farkı ise 2 birimde 100 kattır — çeldiriciler bu karışıklığa dayanır."}, {"q": "Magnitüd (büyüklük) ile ilgili aşağıdakilerden hangisi YANLIŞTIR?", "opts": [{"t": "Bir depremin yere göre değişen birden çok magnitüdü vardır"}, {"t": "Kaydedilen zemin hareketinden hesaplanan aletsel bir değerdir"}, {"t": "Ondalıklı sayı olarak verilir (örneğin 7,7)"}, {"t": "Açığa çıkan enerjinin bir ölçüsüdür"}, {"t": "Deprem kayıt istasyonlarınca ölçülür"}], "a": 0, "exp": "Bir depremin **tek bir magnitüd** değeri vardır — nerede olursanız olun bu sayı **değişmez**. Yere göre değişen **şiddet**tir. Magnitüd enerjinin aletsel ölçüsüdür, ondalıklı verilir ve istasyonlarca ölçülür."}, {"q": "Kitapta sayılan magnitüd türlerinden hangisi kırılan fay alanı, kayma miktarı ve kayacın direncinden hesaplanır ve büyük depremlerde doyuma ulaşmaz?", "opts": [{"t": "Md (süreye dayalı magnitüd)"}, {"t": "Ml (yerel magnitüd)"}, {"t": "Mw (moment magnitüdü)"}, {"t": "Ms (yüzey dalgası magnitüdü)"}, {"t": "Mb (cisim dalgası magnitüdü)"}], "a": 2, "exp": "**Mw – Moment magnitüdü** kırılan **fay alanı**, **kayma miktarı** ve **kayacın direncinden** hesaplanır; büyük depremlerde doyuma ulaşmaz ve bugün büyük depremler için **uluslararası standart** ölçektir. AFAD ve Kandilli büyük depremleri bu ölçekle duyurur (ör. 6 Şubat 2023 Pazarcık **Mw 7,7**)."}, {"q": "Halk arasında \"Richter ölçeği\" olarak bilinen yerel magnitüd (Ml) ile ilgili hangisi doğrudur?", "opts": [{"t": "Kırılan fay alanı ve kayma miktarından hesaplanır"}, {"t": "Romen rakamıyla ifade edilir"}, {"t": "Küçük-yakın depremlere uygundur; büyüklerde doyuma ulaşır"}, {"t": "Büyük depremlerde büyüklüğü olduğundan yüksek gösterir"}, {"t": "Bugün büyük depremler için uluslararası standart ölçektir"}], "a": 2, "exp": "**Ml** Richter'in özgün ölçeğidir; **küçük ve yakın** depremler için uygundur. Tek bir dalga genliğine baktığı için yaklaşık **6,5–7** üzerinde **doyuma ulaşır** (gerçek büyüklüğü **düşük** gösterir). 1960 Şili (**Mw 9,5**) gibi devasa depremler ancak Mw ile doğru ifade edilir.\n💡 Haberlerde \"Richter ölçeğine göre\" ifadesi çoğunlukla alışkanlıktan kaynaklanan yanlış bir kullanımdır."}, {"q": "Şiddet kavramıyla ilgili aşağıdaki ifadelerden hangisi doğrudur?", "opts": [{"t": "Deprem istasyonlarınca kaydedilir"}, {"t": "Ondalıklı Arap rakamıyla ifade edilir (örneğin 7,7)"}, {"t": "Depremin yarattığı etkiyle ölçülen, gözlemle belirlenen göreceli kavramdır"}, {"t": "Bir depremin tek bir şiddet değeri vardır"}, {"t": "Açığa çıkan enerjinin aletsel ölçüsüdür"}], "a": 2, "exp": "**Şiddet**, depremin yapılar, canlılar ve yeryüzünde yarattığı **etkiyle** ölçülen **göreceli** bir kavramdır; **aletle kaydedilmez, gözlemle belirlenir**. Her yerleşim için **ayrı** bir değeri vardır ve **I–XII** arasında **Romen rakamıyla** yazılır."}, {"q": "Türkiye'de kullanılan şiddet cetveli hangisidir?", "opts": [{"t": "Moment magnitüd (Mw) ölçeği"}, {"t": "EMS (Avrupa Makro Sismik Cetveli)"}, {"t": "JMA (Japon Meteoroloji Ajansı) cetveli"}, {"t": "MSK (Medvedev–Sponheuer–Karnik) cetveli"}, {"t": "Richter (Ml) ölçeği"}], "a": 3, "exp": "Türkiye **MSK (Medvedev–Sponheuer–Karnik; UNESCO, 1965)** cetvelini kullanır. **Avrupa Birliği EMS**, **Japonya JMA** cetvelini kullanır. Mw ve Ml şiddet değil **büyüklük** ölçekleridir."}, {"q": "Büyüklük ve şiddet karşılaştırmasıyla ilgili aşağıdakilerden hangisi YANLIŞTIR?", "opts": [{"t": "Bir depremin tek bir büyüklüğü, her yerleşim için ayrı bir şiddeti vardır"}, {"t": "Şiddet uzaklık, derinlik, zemin ve yapı kalitesine göre değişir"}, {"t": "Büyüklük ondalıklı Arap rakamıyla, şiddet tam sayılı Romen rakamıyla yazılır"}, {"t": "Şiddet depremin kendi özelliğidir; büyüklük ise yerin maruz kaldığı etkinin özelliğidir"}, {"t": "Büyüklük aletle (sismometre) ölçülür; şiddet gözlemle belirlenir"}], "a": 3, "exp": "Tersi doğrudur: **magnitüd depremin özelliğidir; şiddet yerin özelliğidir.** Diğer ifadeler doğrudur.\n💡 Hoparlör benzetmesi: hoparlörün gücü (watt) magnitüddür — tektir; kulağınıza gelen ses yüksekliği şiddettir — yakınlığa ve aradaki duvara göre değişir."}, {"q": "\"Bugün Elazığ'da şiddeti 5,8 olan bir deprem meydana geldi.\" cümlesindeki hatalarla ilgili aşağıdakilerden hangileri doğrudur?\nI. 5,8 bir şiddet değil, büyüklük (magnitüd) değeridir.\nII. Şiddet ondalıklı yazılmaz; I–XII arası tam sayılı Romen rakamıdır.\nIII. Cümle, depremin tek bir şiddeti varmış gibi kurulmuştur; oysa şiddet her yerleşim için ayrıdır.", "opts": [{"t": "Yalnız I"}, {"t": "I ve III"}, {"t": "I ve II"}, {"t": "I, II ve III"}, {"t": "II ve III"}], "a": 3, "exp": "Üç hata vardır: **1) Kavram** (5,8 magnitüddür), **2) Yazım** (şiddet ondalıklı olamaz, Romen rakamıdır), **3) Tek değer varsayımı** (şiddet yerleşime göre değişir). Öğrenciler genellikle yalnızca birincisini fark eder; yalnızca kavram hatasını bulan cevap eksiktir. Doğrusu: \"**Büyüklüğü 5,8** olan bir deprem…\""}, {"q": "Nükleer patlatmalar, madencilik ve büyük baraj göllerinin doldurulması sonucu oluşan depremler kökenlerine göre hangi gruptadır?", "opts": [{"t": "Çöküntü depremleri"}, {"t": "Tektonik depremler"}, {"t": "İnsan kaynaklı depremler"}, {"t": "Volkanik depremler"}, {"t": "Derin odaklı depremler"}], "a": 2, "exp": "Kökene göre dört tür: **tektonik** (levha hareketleri; en yaygın ve en yıkıcı), **volkanik** (magma hareketi; etki alanı dar), **çöküntü** (mağara, karst boşluğu, terk edilmiş maden galerisi çökmesi), **insan kaynaklı** (nükleer patlatma, madencilik, baraj gölü doldurma — \"rezervuar kaynaklı sismisite\", yeraltına sıvı enjeksiyonu)."}, {"q": "Deterministik deprem kestirimi ile olasılığa dayalı deprem tahmini karşılaştırıldığında hangisi doğrudur?", "opts": [{"t": "Olasılığa dayalı tahminde belirsizlikler kamuoyundan bilinçli olarak gizlenir"}, {"t": "Deterministik kestirim bugün mümkün değildir; yönetmelikler olasılığa dayalı tahmine dayanır"}, {"t": "Deterministik kestirim bugün güvenilir şekilde yapılabilmektedir"}, {"t": "Ay, yıldız ve bulutlarla ilişki kurmak olasılığa dayalı tahminin temelidir"}, {"t": "Olasılığa dayalı tahmin, depremin tarihini ve saatini kesin olarak verir"}], "a": 1, "exp": "**Deterministik kestirim** (\"şu tarihte, şurada, şu büyüklükte\") yer, zaman ve büyüklüğü kesin belirtir — **bugün bilimsel olarak mümkün değildir**; Ay, yıldız, bulut ve fırtınalarla ilişki kurma girişimlerinin bilimsel temeli yoktur. **Olasılığa dayalı tahmin** (\"şu bölgede, şu süre içinde, şu olasılıkla\") güvenilir veriyle yapılır, belirsizlikleri açıkça tanımlar; **deprem tehlike haritaları ve yapı yönetmelikleri** buna dayanır."}, {"q": "Türkiye Deprem Tehlike Haritası (2018) hangi yaklaşıma dayanır ve neyi verir?", "opts": [{"t": "Erken uyarı; S dalgasının varış süresini"}, {"t": "Deterministik kestirim; her ilin MSK şiddetini kesin olarak"}, {"t": "Olasılığa dayalı tahmin; depremin kesin büyüklüğünü ve saatini"}, {"t": "Deterministik kestirim; bir sonraki büyük depremin tarihini"}, {"t": "Olasılığa dayalı; 50 yılda %10 aşılma olasılıklı yer ivmesini"}], "a": 4, "exp": "Türkiye Deprem Tehlike Haritası (2018) **olasılığa dayalı** tahmindir: belirli bir bölgede **50 yıl içinde %10 aşılma olasılığıyla** beklenen **yer ivmesini** verir. Bütün yapı yönetmeliği bu hesabın üzerine kuruludur.\n💡 Tahmin, tarih vermek için değil, **bina yapmak** için kullanılır."}, {"q": "Deprem erken uyarı sistemi ile ilgili aşağıdaki ifadelerden hangisi doğrudur?", "opts": [{"t": "Depremi gerçekleşmeden önce haber veren bir tahmin sistemidir"}, {"t": "Dış merkeze en yakın yerleşimlere en uzun uyarı süresini sağlar"}, {"t": "S dalgasını saptayarak P dalgası gelmeden uyarı verir"}, {"t": "Binaları sağlamlaştırarak hasarı önler"}, {"t": "Deprem olduktan sonra, S dalgası gelmeden önceki saniyeleri kullanır"}], "a": 4, "exp": "Erken uyarı **depremin önceden bilinmesi değildir**; deprem **OLDUKTAN sonra** devreye girer. Hızlı ama zararsız **P dalgasını** saptar, sinyali S dalgasından çok daha hızlı iletir. Binayı sağlamlaştırmaz — zarar azaltmanın **yerine geçmez, yanına eklenir**. Dış merkeze en yakın yerleşimlere hiçbir şey kazandırmaz.\n💡 Sınav ipucu: \"Erken uyarı sistemi depremi önceden haber verir\" ifadesi YANLIŞTIR."}, {"q": "Deprem erken uyarı sisteminin çalışma aşamalarının doğru sırası hangisidir?", "opts": [{"t": "Deprem olur → S dalgası saptanır → sinyal iletilir → P dalgası gelmeden önlem alınır"}, {"t": "Deprem olur → sinyal iletilir → S dalgası saptanır → önlem alınır"}, {"t": "Deprem olur → P dalgası saptanır → sinyal iletilir → S dalgası gelmeden önlem alınır"}, {"t": "Sinyal iletilir → deprem olur → P dalgası saptanır → önlem alınır"}, {"t": "P dalgası saptanır → deprem olur → önlem alınır → sinyal iletilir"}], "a": 2, "exp": "**1. Deprem olur** (kaynağa en yakın istasyonlar algılar) → **2. P dalgası saptanır** (yer ve büyüklük bu dalgadan hesaplanır) → **3. Sinyal iletilir** (kurum ve tesislere otomatik; elektrik sinyali S dalgasından çok daha hızlı) → **4. Önlem alınır** (S dalgası gelmeden kritik sistemler devre dışı bırakılır).\n💡 Haber, yıkımı geçebilir: elektrik sinyali ışık hızına yakın, S dalgası 3–4 km/sn."}], "cards": [{"t": "Depremin tanımı", "b": "Deprem, yerkabuğu içindeki **kırılmalar** nedeniyle ani olarak ortaya çıkan titreşimlerin **dalgalar hâlinde** yayılarak geçtikleri ortamları ve yeryüzeyini sarsması olayıdır. Sarsıntı, kırılmanın **sonucudur**. 💡 Önce kırılma, sonra sarsıntı."}, {"t": "Deprem bir süreçtir", "b": "Deprem teknik olarak **saniyeler** sürer; ama sosyal olarak öncüleri, artçıları ve toplumsal iyileşmesiyle **bir süreçtir**. Sağlık hizmeti planlaması sarsıntının süresine göre değil, **sürecin süresine** göre yapılır."}, {"t": "Deprem litosferde doğar", "b": "Depremler yalnızca en dıştaki **katı ve kırılgan** katman olan **litosferde (taşküre, ~70–100 km)** oluşur. Levhaları hareket ettiren kuvvet ise hemen altındaki **astenosferdeki konveksiyon akımlarıdır**. 💡 Kaynayan tencere: köpükler levha, alttaki dolaşım motor."}, {"t": "Yerkürenin beş katmanı", "b": "Dıştan içe: **litosfer, astenosfer, manto, dış çekirdek (sıvı), iç çekirdek (katı)**. İç çekirdek daha sıcak olmasına rağmen **muazzam basınç** nedeniyle katıdır. 💡 Yerküre bir elma olsaydı litosfer kabuğu kadar ince kalırdı."}, {"t": "Dört levha sınırı türü", "b": "Levha sınırları, levhaların birbirine ne yaptığına göre dörde ayrılır: **okyanus ortası sırt** (ayrılma), **yitim zonu** (altına dalma), **çarpışma zonu** (Himalayalar) ve **yanal yer değiştirme zonu** (yatay kayma)."}, {"t": "Türkiye'nin fayları yanal atımlı", "b": "**Kuzey Anadolu Fayı** ve **Doğu Anadolu Fayı** yanal atımlı faylardır. Bu yüzden Türkiye depremleri **sığdır (5–10 km)** ve dar bir alanda çok ağır hasar yapar. Derin depremler ise çoğunlukla **yitim zonlarında** (örn. Japonya) görülür."}, {"t": "Elastik geri sekme kuramı", "b": "Levhalar birbirini iter ama **sürtünme** hareketi engeller; kayaç bükülerek **elastik enerji** biriktirir. Sürtünme direnci aşıldığı anda kayaç kırılır ve **yay gibi eski şekline döner**. 1906 San Francisco depreminden sonra **H. F. Reid** ortaya koymuştur. 💡 Bükülen cetvel: kırılınca titreşir."}, {"t": "Enerji üretilmez, salınır", "b": "Deprem enerjisi deprem anında **üretilmez**; yıllarca **birikmiş** enerji o anda **salınır**. Bu yüzden uzun süredir deprem üretmemiş fay segmentleri (**sismik boşluk**) daha tehlikeli kabul edilir."}, {"t": "Öncü deprem uyarı değildir", "b": "Öncü depremler büyük depremden önce gelen küçük sarsıntılardır ama **her zaman olmayabilir** — bu yüzden bir **tahmin/uyarı aracı olarak kullanılamaz**. Serinin en büyüğü **ana şoktur**; asıl hasarı o üretir."}, {"t": "Artçılar yıllarca sürebilir", "b": "Magnitüdü **7,0 ve üzeri** depremlerin artçıları **senelerce** sürebilir; enerji sönümlendiği için sıklıkları ve büyüklükleri zamanla azalır. En büyük artçı genellikle ana depremden yaklaşık **1 derece küçüktür**. Zayıflamış binalar artçıda yıkılabilir; kurtarma ekibi için asıl tehlike budur."}, {"t": "Deprem fırtınası", "b": "Sınırlı bir alanda, belli bir sürede, büyüklükleri **birbirine çok yakın** çok sayıda depremin meydana gelmesidir; **ana şok belirlenemez**."}, {"t": "Yılda 500.000 / 23.000 deprem", "b": "Dünyada yılda yaklaşık **500.000**, Türkiye'de yaklaşık **23.000** deprem saptanır — dünyadakilerin yaklaşık **yirmide biri**. Çoğu **mikro ve ultra mikro** (magnitüd 3'ün altı) olduğu için hissedilmez."}, {"t": "%96 ve %62", "b": "Türkiye topraklarının yaklaşık **%96'sı deprem kuşağı** içindedir. Son 70 yılda afet kaynaklı can ve mal kaybının **%62'si depremden** gelmiştir (heyelan %15, su baskını %14). 💡 En sık görülen afet heyelan, en çok can alan depremdir: sıklık ≠ etki."}, {"t": "Üç tür sismik dalga", "b": "**P dalgası** (boyuna, en hızlı), **S dalgası** (enine, daha yavaş) ve **yüzey dalgaları** (Love ve Rayleigh — en yavaş ama **genliği en büyük**). Yapılardaki yıkımı **S ve yüzey dalgaları** üretir; P yalnızca haber verir."}, {"t": "P dalgası: 5–7 km/sn", "b": "P (Premier) dalgası **5–7 km/sn** ile en hızlı dalgadır ve kayıt aletine **ilk** ulaşır. Titreşim yayılma doğrultusuyla **aynı yönde**dir; **katı, sıvı ve gazın hepsinde** yayılır. Hasar etkisi **düşüktür**; depremin yeri ve büyüklüğü bu dalgadan hesaplanır. 💡 İtilip çekilen yay."}, {"t": "S dalgası: 3–4 km/sn", "b": "S (Secondary) dalgası **3–4 km/sn** hızındadır ve ikinci ulaşır. Titreşim yayılma doğrultusuna **diktir**; **sıvı ve gazdan geçemez**. Yapılardaki **yıkımı üreten** dalgadır. 💡 Yukarı-aşağı sallanan ip."}, {"t": "Hızlı zararsız, yavaş yıkıcı", "b": "Dış merkeze 100 km uzaklıkta P dalgası ~**15 saniyede**, S dalgası ~**30 saniyede** varır. Bu iki varış arasındaki **zaman farkı**, erken uyarı için kullanılabilecek sürenin ta kendisidir. Uzaklık arttıkça fark büyür; dış merkeze çok yakınsa **sıfıra yaklaşır**."}, {"t": "S dalgası gölge bölgesi", "b": "S dalgası **sıvıdan geçemediği** için ~2900 km derinlikteki **dış çekirdekte durur**; merkez üssünden **104°'den** uzaktaki istasyonlara doğrudan ulaşmaz. Bu gölge bölgesi, dış çekirdeğin **sıvı** olduğunun kanıtıdır. 💡 Yerin içini kimse görmedi; dalgaların nereye ulaşmadığından biliyoruz."}, {"t": "Odak ve dış merkez", "b": "**Odak (hiposantr)**, yerin içinde enerjinin açığa çıktığı noktadır; **dış merkez (episantr)** ise odağa en yakın yeryüzü noktası, yani haritadaki iz düşümüdür. Deprem genellikle dış merkezde en kuvvetli hissedilir. 💡 Yunanca hypo = alt, epi = üst."}, {"t": "Hasarı uzaklık tek belirlemez", "b": "1985 Meksika depreminde (Mw 8,0) en ağır yıkım dış merkezde değil, **350 km uzaktaki Mexico City'de** yaşandı: eski göl yatağındaki yumuşak zemin dalgaları büyüttü (**zemin büyütmesi**) ve 6–15 katlı binalar **rezonansa** girdi. Hasarı uzaklık kadar **zemin ve yapı** belirler."}, {"t": "Odak derinliği sınıfları", "b": "Derinliğe göre depremler: **sığ 0–70 km**, **orta 70–300 km**, **derin 300–700 km**. Orta ve derin depremler çoğunlukla **yitim zonlarında** görülür; Türkiye'de bu tip bir zon yoktur."}, {"t": "Sığ deprem ağır hasar yapar", "b": "Enerji yüzeye ulaşana kadar **mesafeyle sönümlenir**. Sığ depremde enerji **küçük bir alana neredeyse kayıpsız** boşalır: dar alanda yoğun yıkım. Derin deprem **geniş alanda hissedilir ama hasarı azdır**. 💡 Sezgiye ters: derin olan değil, sığ olan tehlikelidir."}, {"t": "Türkiye depremleri sığdır", "b": "Türkiye'de odak derinliği şehirlerin altında çoğunlukla **5–10 km**'dir. Bu yüzden aynı magnitüd bizde **daha ağır hasar** yapar, yaralılar dar bir coğrafyada toplanıp yerel sağlık kapasitesini hızla doyurur ve erken uyarı için kalan süre **kısalır**."}, {"t": "Magnitüd (büyüklük) nedir?", "b": "Deprem sırasında açığa çıkan **enerjinin aletsel ölçüsüdür**; sismometre kaydından hesaplanır ve **ondalıklı** sayı ile verilir (örn. 7,7). Bir depremin **tek bir** magnitüd değeri vardır; nerede olursanız olun değişmez."}, {"t": "Logaritmik ölçek", "b": "Magnitüd **1 birim** artınca zemin hareketinin **genliği 10 kat**, açığa çıkan **enerji ~31,6 kat** artar. Yani Mw 7,7 bir deprem, 6,7'nin ~32 katı, 5,7'nin ~1000 katı enerji açığa çıkarır. 💡 Küçük depremler büyük depremi önleyemez: bir Mw 7,0 için ~32.000 adet Mw 4,0 gerekir."}, {"t": "Mw ve Ml farkı", "b": "**Ml (yerel magnitüd)** Richter'in özgün ölçeğidir; küçük/yakın depremler içindir ve büyük depremlerde **doyuma ulaşır** (düşük gösterir). **Mw (moment magnitüdü)** kırılan fay alanı ve kayma miktarından hesaplanır, doyuma ulaşmaz; bugün büyük depremler için **uluslararası standart** Mw'dir (AFAD ve Kandilli bunu kullanır)."}, {"t": "Şiddet nedir?", "b": "Depremin yapılar, canlılar ve arazide yarattığı **etkinin gözlemle belirlenen** ölçüsüdür; **aletle kaydedilmez**. Türkiye'de **MSK** cetveli kullanılır; **I–XII arası Romen rakamıyla** yazılır. Bir depremin tek bir şiddeti yoktur: **her yerleşim için ayrı** değer vardır."}, {"t": "Büyüklük ≠ şiddet", "b": "**Magnitüd depremin özelliğidir**: aletle ölçülür, tektir, ondalıklı yazılır (7,7). **Şiddet yerin özelliğidir**: gözlemle belirlenir, yere göre değişir, Romen rakamıyla yazılır (IX). \"Şiddeti 7,7 deprem\" ifadesi **yanlıştır**. 💡 Hoparlör benzetmesi: watt gücü magnitüd, kulağınıza gelen ses şiddettir."}, {"t": "Şiddeti ne belirler?", "b": "Şiddeti, depremin **büyüklüğü**, dış merkeze **uzaklık**, odak **derinliği**, **zemin** özellikleri ve **yapı kalitesi** birlikte belirler. MSK cetveli bile hasarı yapı tipine (A: kerpiç, B: tuğla, C: betonarme) göre tarif eder: aynı sarsıntı A tipini yıkarken C tipinde orta hasar bırakabilir."}, {"t": "Magnitüd alarm, şiddet plan", "b": "Afetin ilk dakikalarında gelen tek veri **magnitüddür**; ama hasta sayısını ve kaynak ihtiyacını **o yerleşimde hissedilen şiddet** belirler. Sevk ve sağlık kaynak planlaması **şiddet dağılımına** göre yapılır, manşetteki büyüklük sayısına göre değil. 💡 Magnitüd alarmı başlatır, şiddet planı yazar."}, {"t": "Deprem tahmini mümkün değil", "b": "Depremin **yerini, zamanını ve büyüklüğünü kesin olarak** önceden bilmek (deterministik kestirim) bugün **mümkün değildir**. Geçerli yaklaşım **olasılığa dayalı tahmindir**: deprem tehlike haritaları ve yapı yönetmelikleri buna dayanır. 💡 Tahmin tarih vermek için değil, bina yapmak için kullanılır."}, {"t": "Erken uyarı ≠ tahmin", "b": "Erken uyarı sistemi **deprem OLDUKTAN sonra** devreye girer: hızlı ama zararsız **P dalgasından** depremin yeri/büyüklüğü hesaplanır, elektrik sinyali **S dalgasını geçerek** saniyeler kazandırır. \"Depremi önceden haber verir\" ifadesi **yanlıştır**; dış merkeze çok yakın yerlere kazandırdığı süre **sıfıra yaklaşır** — sığ depremli Türkiye için en büyük kısıt budur."}]}, {"title": "Deprem II: Faylar, Türkiye'nin Depremselliği, İkincil Afetler ve Sağlık Sonuçları", "desc": "Fay türleri ve şekilleri, aktif fay ve paleosismoloji, Türkiye'nin fay kuşakları, büyük depremler ve 6 Şubat 2023, tehlike haritası, ikincil afetler, crush sendromu ve korunma", "short": "Faylar & Türkiye", "questions": [{"q": "Aşağıdakilerden hangisi fay kavramını en doğru tanımlar?", "opts": [{"t": "Sarsıntı sırasında suya doygun kumlu zeminin taşıma gücünü kaybettiği alan"}, {"t": "İki levhanın birbirinin altına daldığı ve magmanın yükseldiği okyanus altı hendek"}, {"t": "Kayaçların yatay sıkışma ile kıvrılarak oluşturduğu kemer biçimli yapı"}, {"t": "Yerkabuğundaki bir kırılma düzlemi boyunca iki bloğun birbirine göre yer değiştirdiği yapı"}, {"t": "Deprem dalgalarının yeryüzüne ilk ulaştığı noktanın haritadaki izdüşümü"}], "a": 3, "exp": "**Fay**, yerkabuğundaki bir kırılma düzlemi boyunca iki bloğun birbirine göre yer değiştirdiği yapıdır; **deprem**, bu düzlem üzerindeki ani hareketle oluşur. Diğer seçenekler başka kavramların tanımıdır: suya doygun zeminin taşıma gücünü kaybetmesi **sıvılaşma**, levhanın dalması **yitim zonu**, kemer biçimli yapı **kıvrım**, haritadaki izdüşüm ise **dış merkez**dir."}, {"q": "Eğimli bir fay düzleminde blokların adlandırılmasıyla ilgili hangisi doğrudur?", "opts": [{"t": "Yukarı hareket eden blok her zaman tavan blok olarak adlandırılır"}, {"t": "Düzlemin üstünde kalan blok tavan, altında kalan blok taban bloktur"}, {"t": "Denize yakın olan blok tavan, karaya yakın olan blok taban bloktur"}, {"t": "Düzlemin altında kalan blok tavan, üstünde kalan blok taban bloktur"}, {"t": "Aşağı kayan blok, fay türünden bağımsız olarak taban blok adını alır"}], "a": 1, "exp": "Fay düzleminin **üstünde** kalan blok **tavan bloğu** (hanging wall), **altında** kalan blok **taban bloğu**dur (footwall). Adlandırma hareket yönüne göre değil, bloğun fay düzlemine göre konumuna göre yapılır: normal fayda tavan blok iner, ters fayda yukarı çıkar.\n💡 Madencilik kökenli: eğimli galeride madencinin başının üstündeki blok tavan, ayağını bastığı blok tabandır."}, {"q": "Gerilmeli (çekme) bölgelerde oluşan, tavan bloğun taban bloğa göre aşağı kaydığı ve yerkabuğunun incelmesiyle gelişen fay türü hangisidir?", "opts": [{"t": "Ters fay"}, {"t": "Bindirme"}, {"t": "Sağ yönlü doğrultu atımlı fay"}, {"t": "Sol yönlü doğrultu atımlı fay"}, {"t": "Normal fay"}], "a": 4, "exp": "**Normal fay** çekme rejiminde oluşur; **tavan blok aşağı kayar**, yerkabuğu çekilip incelir. Ege Çöküntü Fay Sistemi bu türdendir. Ters fay ve bindirmede tavan blok yukarı çıkar (sıkışma); doğrultu atımlı faylarda hareket yataydır."}, {"q": "Ters fayla ilgili aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Ege'deki graben ovalarını sınırlayan fay türüdür"}, {"t": "Bloklar fay düzlemi boyunca yalnızca yatay kayar"}, {"t": "Sıkışmalı bölgelerde oluşur ve yerkabuğu kalınlaşır"}, {"t": "Çekme rejiminde oluşur ve yerkabuğu incelir"}, {"t": "Tavan blok, taban bloğa göre aşağı iner"}], "a": 2, "exp": "**Ters fayda** tavan blok taban bloğa göre **yukarı çıkar**; sıkışmalı bölgelerde, yerkabuğu **sıkışıp kalınlaşırken** oluşur. Çekme, incelme, tavan bloğun inmesi ve graben sınırlaması **normal faya** aittir; yalnızca yatay kayma ise doğrultu atımlı fayın özelliğidir."}, {"q": "Hem düşey (eğim) hem de yanal (doğrultu) atım bileşenine birlikte sahip olan faylara ne ad verilir?", "opts": [{"t": "Yanal atımlı oblik fay"}, {"t": "Kuvaterner fayı"}, {"t": "Bindirme fayı"}, {"t": "Gömülü fay"}, {"t": "Horst fayı"}], "a": 0, "exp": "Her iki atım türüne birden sahip faylara **yanal atımlı oblik fay** denir. Kaynağa göre doğal koşullarda **saf hareket nadirdir**; çoğu fay bir miktar karma hareket gösterir. Gömülü fay yüzeye çıkmayan fay, Kuvaterner fayı ise MTA'nın yaş sınıfıdır."}, {"q": "Ege'deki normal faylarda depremlerin daha sık ve daha küçük, Kuzey ve Doğu Anadolu'daki doğrultu atımlı faylarda daha seyrek ve daha büyük olmasının temel nedeni nedir?", "opts": [{"t": "Ege'deki faylar Holosen öncesine ait olduğu için aktif değildir"}, {"t": "Doğrultu atımlı faylar okyanus altı yitim zonu üzerinde yer alır"}, {"t": "Ege'de yerkabuğu sıkıştığı için enerji küçük parçalar hâlinde boşalır"}, {"t": "Normal faylar yalnızca gömülü fay olarak bulunduğu için küçük deprem üretir"}, {"t": "Doğrultu atımlı faylar yüzlerce km kesintisiz kırılabilir; Ege fayları kısa parçalıdır"}], "a": 4, "exp": "Fark **fay geometrisinden** kaynaklanır: doğrultu atımlı faylar **çok uzun (yüzlerce km) kesintisiz** kırılabilir ve büyük magnitüd üretir; Ege'deki normal faylar **kısa parçalar** hâlindedir. Bu yüzden Ege'de sık ama orta büyüklükte, KAF ve DAF'ta seyrek ama çok büyük deprem beklenir ve iki bölgenin hazırlık stratejisi farklıdır. Ege'de sıkışma değil çekme vardır."}, {"q": "Doğrultu atımlı bir fayın bir tarafında duran gözlemci karşı bloğa baktığında, fayın kestiği yolun devamını SAĞ tarafa kaymış olarak görmektedir. Bu fay ile aynı yönlü hareket eden faylar hangi seçenekte birlikte verilmiştir?", "opts": [{"t": "Kuzey Anadolu Fayı ve San Andreas Fayı"}, {"t": "Doğu Anadolu Fayı ve San Andreas Fayı"}, {"t": "Ege Çöküntü Fay Sistemi ve Bitlis Bindirmesi"}, {"t": "Doğu Anadolu Fayı ve Bitlis Bindirmesi"}, {"t": "Kuzey Anadolu Fayı ve Doğu Anadolu Fayı"}], "a": 0, "exp": "Karşı bloktaki nesne **sağa** kaymışsa fay **sağ yönlü** doğrultu atımlıdır. **KAF ve San Andreas** sağ yönlüdür. **DAF sol yönlüdür**; Bitlis bindirme, Ege sistemi normal faylıdır.\n💡 Hangi taraftan bakarsanız bakın cevap aynı çıkar — yöntemin işe yaradığının kontrolü budur."}, {"q": "6 Şubat 2023 Pazarcık depreminin üzerinde gerçekleştiği fay ve bu fayın hareket yönü hangisidir?", "opts": [{"t": "Doğu Anadolu Fayı – sağ yönlü doğrultu atımlı"}, {"t": "Kuzey Anadolu Fayı – sağ yönlü doğrultu atımlı"}, {"t": "Bitlis Bindirmesi – düşük açılı ters fay"}, {"t": "Ege Çöküntü Sistemi – normal fay"}, {"t": "Doğu Anadolu Fayı – sol yönlü doğrultu atımlı"}], "a": 4, "exp": "Pazarcık depremi **Doğu Anadolu Fay Zonu** üzerinde oldu; DAF **sol yönlü doğrultu atımlı**dır. KAF ise sağ yönlüdür.\n💡 Batıya kaçan Anadolu'yu düşün: kuzey sınırı (KAF) sağ yönlü, doğu sınırı (DAF) sol yönlü kayar."}, {"q": "Aktif (diri) fay için çoğu ülkede kullanılan zaman ölçütü ve bu dönemin adı hangisidir?", "opts": [{"t": "1900'den bugüne – Aletsel dönem"}, {"t": "Son 11.000 yıl – Holosen"}, {"t": "Son 40.000 yıl – Paleosismolojik dönem"}, {"t": "Son 500.000 yıl – Holosen"}, {"t": "Son 1.600.000 yıl – Kuvaterner"}], "a": 1, "exp": "**Aktif (diri) fay**, son on bin yıl içinde deprem üretmiş ve/veya yüzey faylanmasına neden olmuş, gelecekte de deprem üretme potansiyeli olan faydır; çoğu ülkede ölçüt **son 11.000 yıl (Holosen)**dur. Holosen, son buzul çağının bitişinden (yaklaşık **11.700 yıl** önce) bugüne süren dönemdir. 1.600.000 yıl Kuvaterner, 40.000 yıl paleosismolojinin incelediği dönem, 500.000 yıl kritik yapılar için uzatılmış süredir.\n💡 Ölçüt insan hafızasına değil jeolojik kayda dayanır: tekrarlanma aralığı yüzlerce–binlerce yıl olabilir; 500 yıldır sessiz bir fay \"ölü\" değildir."}, {"q": "Türkiye'de diri faylar üzerinde yüzey faylanması oluşturan depremler için kaynakta verilen genel özellik hangisidir?", "opts": [{"t": "Büyüklük genellikle 6,0'ın üzerinde, derinlik genellikle 100 km'den fazla"}, {"t": "Büyüklük genellikle 4,0–5,0 arası, derinlik genellikle 20–40 km"}, {"t": "Büyüklük genellikle 6,0'ın üzerinde, derinlik genellikle 20 km'den az"}, {"t": "Büyüklük genellikle 5,0'ın altında, derinlik 70 km'den fazla"}, {"t": "Büyüklük genellikle 8,0'ın üzerinde, derinlik genellikle 5 km'den az"}], "a": 2, "exp": "Türkiye'de yüzey kırığı (yüzey faylanması) oluşturan depremler genellikle **M 6,0'ın üzerinde** ve **20 km'den sığ**dır.\n💡 Pratik eşik: büyüklük 6'dan büyük, derinlik 20 km'den küçük."}, {"q": "Aşağıdakilerden hangisi bir fayın aktif olduğunu gösteren morfolojik izler arasında yer almaz?", "opts": [{"t": "İç merkezlerin bir hat boyunca dizilimi"}, {"t": "Basınç sırtları ve uzamış sırtlar"}, {"t": "Ani diklikler"}, {"t": "Çizgisel ve asılı vadiler"}, {"t": "Çöküntü gölcükleri"}], "a": 0, "exp": "**Morfolojik izler**: çizgisel vadiler, asılı vadiler, ani diklikler, basınç sırtları, uzamış sırtlar, çöküntü gölcükleri. **İç merkezlerin dizilimi** ise odak parametreleri ve yüzey yırtılmalarıyla birlikte **sismolojik veriler** grubundadır."}, {"q": "Paleosismoloji ile ilgili aşağıdakilerden hangisi yanlıştır?", "opts": [{"t": "Bir fayda bir sonraki depremin tarihini kesin olarak belirler"}, {"t": "Jeoloji mühendislerince yürütülür"}, {"t": "Yaklaşık son 40.000 yıldaki aktif fayların deprem geçmişini ortaya çıkarır"}, {"t": "Fay üzerinde hendek açılarak kesilmiş toprak katmanları tarihlendirilir"}, {"t": "Diri fay araştırmalarında yapılması zorunlu çalışmalardandır"}], "a": 0, "exp": "**Paleosismoloji** fay üzerinde **hendek** açıp kesilmiş katmanları tarihlendirerek (ör. Karbon-14) yaklaşık **40.000 yıllık** deprem geçmişini okur; **jeoloji mühendislerince** yapılır ve tehlike hesabı için **zorunludur**. Ancak **takvim vermez**: depremin tarihini söyleyemez, fayın karakterini verir.\n💡 \"Bu bilgi bir takvim vermez; bir yönetmelik verir.\""}, {"q": "Bir öğrenci 'Fayın tekrarlanma periyodu 250 yıl, son deprem 240 yıl önce oldu; demek ki 10 yılımız var' demektedir. Bu yorumdaki hata nedir?", "opts": [{"t": "Hesap doğrudur; yalnızca birim olarak yıl yerine on yıl kullanılmalıdır"}, {"t": "Tekrarlanma periyodu en kısa aralığı gösterir; deprem 250 yıldan önce olamaz"}, {"t": "Tekrarlanma periyodu aletsel kayıtlardan hesaplandığı için 100 yılı geçemez"}, {"t": "Tekrarlanma periyodu yalnızca normal faylar için hesaplanabilir"}, {"t": "Tekrarlanma periyodu istatistiksel bir ortalamadır; depremler düzenli aralıklarla gelmez"}], "a": 4, "exp": "**Deprem tekrarlanma periyodu**, bir fayın belirli büyüklükte bir depremi **ortalama** kaç yılda bir ürettiğidir; **kesin bir takvim değil, istatistiksel bir ortalamadır**. Depremler düzenli aralıklarla gelmez; bu yüzden geri sayım yapılamaz.\n💡 Ortalama, randevu değildir — fay için geri sayım yapılmaz."}, {"q": "'Evimin altından fay geçmiyor, güvendeyim' düşüncesine kaynakta verilen cevapla ilgili hangisi doğrudur?", "opts": [{"t": "Fay hattından uzakta sarsıntı hissedilmediği için düşünce doğrudur"}, {"t": "Şiddeti belirleyen dört etkenin tamamı doğa kaynaklıdır ve değiştirilemez"}, {"t": "Yalnızca gömülü fayların bulunduğu illerde düşünce yanlıştır"}, {"t": "Sarsıntı yayılır; şiddeti belirleyen etkenlerden zemin ve bina insan elindedir"}, {"t": "Asıl belirleyici fayın konumudur; bina kalitesi ikincil önemdedir"}], "a": 3, "exp": "Cevap **hayır**dır: (1) **sarsıntı yayılır** (1999 Marmara depremi İstanbul, Bolu ve Ankara'da hissedildi), (2) **gömülü faylar** vardır, (3) **zemin** sarsıntıyı büyütür, (4) **asıl belirleyici binadır**. Şiddeti belirleyen dört etkenden ikisi (**zemin ve bina**) insan elindedir. Doğru soru: \"Binam hangi yönetmeliğe göre, hangi zemin üzerine yapıldı?\"\n💡 Hafta 1'in cümlesi: afeti doğa olayı değil, hazırlıksızlık üretir."}, {"q": "Türkiye'nin tektonik konumu ve deprem kuşağıyla ilişkisi hakkında hangisi doğrudur?", "opts": [{"t": "Levha içinde yer alır; topraklarının yaklaşık yarısı deprem kuşağındadır"}, {"t": "Okyanus altı yitim zonu üzerindedir; topraklarının tamamı deprem kuşağındadır"}, {"t": "Alp-Himalaya kuşağındadır; topraklarının yaklaşık %96'sı deprem kuşağı içindedir"}, {"t": "Pasifik Ateş Çemberi üzerindedir; topraklarının yaklaşık %69'u deprem kuşağındadır"}, {"t": "Alp-Himalaya kuşağındadır; topraklarının yaklaşık %72'si deprem kuşağındadır"}], "a": 2, "exp": "Türkiye, batı Akdeniz'den Himalayalara uzanan **Alp-Himalaya kıvrım ve fay kuşağı** üzerindedir; topraklarının yaklaşık **%96'sı** deprem kuşağındadır. %69 (konutların 1.–2. derece bölgedeki oranı) ve %72 (bu bölgelerde yaşayan nüfus oranı) başka verilerdir."}, {"q": "Anadolu bloğunun hareketini açıklayan 'kiraz çekirdeği' benzetmesine göre hangisi doğrudur?", "opts": [{"t": "Arap ve Avrasya levhaları arasında sıkışan Anadolu batıya kaçar; sınırları KAF ve DAF'tır"}, {"t": "Afrika levhası Anadolu'yu kuzeye iter; sınırları Ege grabenleridir"}, {"t": "Avrasya levhası güneye ilerleyerek Anadolu'yu Arap levhasının altına iter"}, {"t": "Anadolu doğuya kaçar; sınırları Bitlis Bindirmesi ve KAF'tır"}, {"t": "Anadolu yılda yaklaşık 2 metre hızla kuzeye kaçar; sınırı Karadeniz'dir"}], "a": 0, "exp": "**Arap levhası kuzeye** ilerleyerek **Avrasya**'ya çarpar (Kafkasya'da bindirme kuşağı üretir). Arada sıkışan **Anadolu bloğu**, iki parmak arasındaki ıslak kiraz çekirdeği gibi **batıya kaçar** (yılda yaklaşık **2 cm**). Bu kaçışın kuzey ve doğu sınırları **KAF ve DAF**'tır. Batıya kaçış Ege'yi çekip incelterek normal faylar ve horst–graben sistemini de açıklar."}, {"q": "Türkiye'nin ana doğrultu atımlı faylarındaki hareketle ilgili aşağıdakilerden hangileri doğrudur?\nI. KAF boyunca batı–kuzeybatı doğrultusunda sağ yönlü hareket gerçekleşir.\nII. DAF boyunca kuzeydoğu doğrultusunda sol yönlü hareket gerçekleşir.\nIII. KAFZ ve DAFZ, tek bir çizgi değil geniş deformasyon kuşaklarıdır.", "opts": [{"t": "Yalnız I"}, {"t": "Yalnız II"}, {"t": "I ve II"}, {"t": "II ve III"}, {"t": "I, II ve III"}], "a": 4, "exp": "Üç ifade de doğrudur. **KAF**: batı–kuzeybatı doğrultusunda **sağ yönlü**; **DAF**: kuzeydoğu doğrultusunda **sol yönlü** doğrultu atımlı hareket. Zon olarak anıldığında **KAFZ** ve **DAFZ** kısaltmaları kullanılır; ikisi de geniş birer **deformasyon kuşağı**dır."}, {"q": "Kuzey Anadolu ve Doğu Anadolu fay zonlarının yaklaşık uzunlukları ve birleştikleri yer hangi seçenekte doğru verilmiştir?", "opts": [{"t": "KAF ~1200 km, DAF ~700 km; Pazarcık (Kahramanmaraş)"}, {"t": "KAF ~1200 km, DAF ~700 km; Karlıova (Bingöl)"}, {"t": "KAF ~1200 km, DAF ~700 km; Çaldıran (Van)"}, {"t": "KAF ~700 km, DAF ~1200 km; Karlıova (Bingöl)"}, {"t": "KAF ~1500 km, DAF ~300 km; Erzincan"}], "a": 1, "exp": "**KAF ~1200 km** sağ yönlü, **DAF ~700 km** sol yönlü doğrultu atımlıdır; ikisi **Karlıova'da (Bingöl)** birleşir. Bu noktaya **Karlıova Üçlü Eklemi** denir ve Türkiye'nin tektonik olarak en hareketli noktalarından biridir. ~300 km, 2023 Pazarcık depreminin kırılma uzunluğudur.\n💡 KAF uzun (1200), DAF kısa (700): \"Kuzey uzun yol, Doğu kısa yol\"."}, {"q": "Aşağıdaki illerden hangisi kaynakta Doğu Anadolu Fay Zonu'nun geçtiği yerler arasında sayılmaz?", "opts": [{"t": "Elazığ"}, {"t": "Kahramanmaraş"}, {"t": "Erzincan"}, {"t": "Hatay"}, {"t": "Adıyaman"}], "a": 2, "exp": "DAF, Karlıova'dan başlayarak **Elazığ, Adıyaman, Kahramanmaraş ve Hatay** üzerinden geçer. **Erzincan** ise **KAF** üzerindedir (1939 Erzincan depremi KAF üzerinde oldu)."}, {"q": "Kuzey Anadolu Fayı'nın 1939'dan itibaren batıya doğru 'domino' gibi kırılmasında depremlerin doğru kronolojik sırası hangisidir?", "opts": [{"t": "Erzincan → Gerede → Niksar-Erbaa → Abant → Tosya-Ladik → Mudurnu → Gölcük"}, {"t": "Gölcük → Mudurnu → Abant → Gerede → Tosya-Ladik → Niksar-Erbaa → Erzincan"}, {"t": "Erzincan → Niksar-Erbaa → Tosya-Ladik → Gerede → Abant → Mudurnu → Gölcük"}, {"t": "Niksar-Erbaa → Erzincan → Tosya-Ladik → Abant → Gerede → Gölcük → Mudurnu"}, {"t": "Erzincan → Tosya-Ladik → Niksar-Erbaa → Gerede → Mudurnu → Abant → Gölcük"}], "a": 2, "exp": "KAF dizisi: **1939 Erzincan → 1942 Niksar-Erbaa → 1943 Tosya-Ladik → 1944 Gerede → 1957 Abant → 1967 Mudurnu → 1999 Gölcük → 1999 Düzce**. Yaklaşık 60 yılda doğudan batıya ilerleyen bir domino dizisi. Bugün **kırılmamış bölüm Marmara Denizi** içindedir — İstanbul beklentisinin kaynağı budur."}, {"q": "USGS kayıtlarına göre aletsel dönemde kaydedilmiş en büyük deprem hangisidir?", "opts": [{"t": "1964 Güneydoğu Alaska, M 9,2"}, {"t": "2004 Kuzey Sumatra, M 9,1"}, {"t": "2011 Sendai (Japonya), M 9,1"}, {"t": "1952 Kamçatka, M 9,0"}, {"t": "1960 Şili, M 9,5"}], "a": 4, "exp": "Kaydedilmiş en büyük deprem **22.05.1960 Şili (M 9,5)**'dir; yitim zonu kaynaklıdır ve Pasifik boyunca tsunami üretmiştir. Sıra: Şili 9,5 → Alaska 1964 9,2 → Sumatra 2004 9,1 → Sendai 2011 9,1 → Kamçatka 1952 9,0. **USGS**: ABD Jeoloji Araştırmaları Kurumu.\n💡 Bu ölçekteki depremler ancak **Moment Magnitüdü** ile doğru ifade edilebilir."}, {"q": "Dünyanın en büyük depremlerinin ortak özelliği ve bunun Türkiye için çıkarımı hangisidir?", "opts": [{"t": "Hepsi yitim zonundadır; yitim zonu olmayan Türkiye'de üst sınır ~M 7,5–8"}, {"t": "Hepsi normal faylardadır; Ege'de M 9 ölçeğinde deprem beklenir"}, {"t": "Hepsi doğrultu atımlı faylardadır; Türkiye'de M 9 üzeri deprem beklenir"}, {"t": "Hepsi levha içi gömülü faylardadır; Türkiye'de üst sınır ~M 6'dır"}, {"t": "Hepsi bindirme kuşağındadır; Bitlis Bindirmesi M 9 üretebilir"}], "a": 0, "exp": "En büyük depremlerin tamamı **levha sınırlarında**, özellikle **okyanus altı yitim zonlarında**dır; çünkü yitim zonlarında yüzlerce km uzunluğunda ve yüz km'den derin bir düzlem birden kırılabilir. Türkiye'de yitim zonu olmadığı için **M 9 beklenmez**; üst sınır yaklaşık **M 7,5–8**'dir. Ama yıkımı magnitüd değil, **yapı stoku ve nüfus yoğunluğu** belirler (1999 M 7,4; 2023 Mw 7,7)."}, {"q": "Türkiye'nin aletsel dönemdeki en büyük depremi hangisidir?", "opts": [{"t": "6 Şubat 2023 Pazarcık, Mw 7,7"}, {"t": "1976 Çaldıran, M 7,2"}, {"t": "1943 Tosya-Ladik, M 7,2"}, {"t": "17 Ağustos 1999 İzmit Körfezi, M 7,4"}, {"t": "26 Aralık 1939 Erzincan, M 7,9"}], "a": 4, "exp": "**26 Aralık 1939 Erzincan (M 7,9)** Türkiye'nin aletsel dönemdeki **en büyük** depremidir; yaklaşık **33.000** can kaybı, KAF üzerinde. **En çok can kaybı** ise **6 Şubat 2023** depremlerindedir.\n💡 Üç tarih: **1939 en büyük, 1999 en çok şey değiştiren, 2023 en ağır can kaybı**."}, {"q": "1999 Marmara ve Düzce depremleriyle ilgili hangisi doğrudur?", "opts": [{"t": "12 Kasım İzmit Körfezi M 7,2 ve 17 Ağustos Düzce M 7,4; toplam 53.537 can kaybı"}, {"t": "17 Ağustos İzmit Körfezi M 7,4 ve 12 Kasım Düzce M 7,2; toplam 18.373 can kaybı"}, {"t": "17 Ağustos İzmit Körfezi M 7,9 ve 12 Kasım Düzce M 7,4; toplam 33.000 can kaybı"}, {"t": "17 Ağustos İzmit Körfezi M 7,4 ve 9 Kasım Düzce M 6,8; toplam 644 can kaybı"}, {"t": "17 Ağustos İzmit Körfezi M 7,7 ve 12 Kasım Düzce M 7,6; toplam 107.213 can kaybı"}], "a": 1, "exp": "**17 Ağustos 1999 İzmit Körfezi (M 7,4)** ve **12 Kasım 1999 Düzce (M 7,2)** depremlerinde toplam **18.373** can kaybı. 33.000 Erzincan 1939'a, 53.537 ve 107.213 (yaralı) 2023'e, 644 Van 2011'e aittir."}, {"q": "6 Şubat 2023 depremleriyle ilgili saat–merkez–büyüklük–fay eşleştirmesi hangi seçenekte doğru verilmiştir?", "opts": [{"t": "04.17 Pazarcık Mw 7,7 (DAFZ Narlı segmenti); 13.24 Elbistan Mw 7,6 (Çardak fayı)"}, {"t": "04.17 Pazarcık Mw 7,6 (Çardak fayı); 13.24 Yayladağı Mw 7,7 (DAFZ)"}, {"t": "13.24 Pazarcık Mw 7,7 (DAFZ Narlı segmenti); 04.17 Elbistan Mw 7,6 (Çardak fayı)"}, {"t": "04.17 Elbistan Mw 7,7 (Çardak fayı); 13.24 Pazarcık Mw 7,6 (DAFZ Narlı segmenti)"}, {"t": "04.17 Pazarcık Mw 7,7 (KAF); 13.24 Elbistan Mw 7,6 (Bitlis Bindirmesi)"}], "a": 0, "exp": "**04.17 Pazarcık (Mw 7,7)**: DAFZ'ın **Narlı segmentinde** başladı; sol yanal doğrultu atımlı kırılma zincirleme yayıldı (yaklaşık **300 km**). **13.24 Elbistan (Mw 7,6)**: **Çardak fayı** üzerinde, ilkinden farklı bir fayda. İkisi arasında yaklaşık **dokuz saat** vardır."}, {"q": "6 Şubat 2023'teki Elbistan depreminin teknik olarak 'artçı' sayılmamasının gerekçeleri hangi seçenekte doğru verilmiştir?", "opts": [{"t": "İlkinden daha büyüktü ve tsunami üretti"}, {"t": "Aynı fay üzerinde oldu ancak dokuz saat sonra gerçekleşti"}, {"t": "Farklı ilde oldu ve gece değil gündüz gerçekleşti"}, {"t": "İlkinden yaklaşık bir derece küçüktü ve aynı segmentte oldu"}, {"t": "Farklı fay üzerinde oldu ve büyüklüğü ilkine neredeyse eşitti"}], "a": 4, "exp": "**Artçı**, ana şokla **aynı fay sisteminde** ve ondan **belirgin şekilde küçük** (genellikle ~1 derece; 7,7'nin artçısı ~6,7) olur. Elbistan depremi **farklı fay** (Çardak) üzerinde ve **neredeyse eşit büyüklükte** (7,6) olduğu için, ilkinin gerilme alanını değiştirmesiyle **tetiklenmiş ayrı bir ana şok**tur. Yalnızca \"büyüklüğü aynıydı\" demek yarım cevaptır.\n💡 Pratik önem: ikinci deprem \"artçı\" sanılınca ekipler hazırlıksız yakalandı; kurtarma sürerken yeni yıkım geldi."}, {"q": "AFAD raporuna göre 6 Şubat 2023 depremlerinin bilançosu hangisidir?", "opts": [{"t": "11 il etkilendi; 150.000 can kaybı, 300.000 yaralı"}, {"t": "11 il etkilendi; 107.213 can kaybı, 53.537 yaralı"}, {"t": "10 il etkilendi; 18.373 can kaybı, 53.537 yaralı"}, {"t": "7 il etkilendi; 33.000 can kaybı, 150.000 yaralı"}, {"t": "11 il etkilendi; 53.537 can kaybı, 107.213 yaralı"}], "a": 4, "exp": "Resmî verilere göre **11 il** etkilendi; **53.537 can kaybı, 107.213 yaralı**. Türkiye'nin aletsel dönemdeki **en ağır afeti**dir. Kaynak: AFAD'ın 140 sayfalık 06 Şubat 2023 Pazarcık-Elbistan Depremleri Raporu (birincil kaynak). Ayrıca iki hafta sonra **20 Şubat**'ta **Hatay Yayladağı Mw 6,4** tetiklenmiş deprem oldu."}, {"q": "6 Şubat 2023 depremlerinin ağır sonuçları Risk = Tehlike × Maruziyet × Kırılganlık çerçevesinde değerlendirildiğinde, aşağıdakilerden hangisi 'kırılganlık' başlığına girer?", "opts": [{"t": "Yapı stokunun önemli bölümünün eski yönetmeliklere göre yapılmış olması"}, {"t": "Dokuz saat arayla iki adet Mw 7,6+ deprem olması"}, {"t": "Çok sayıda ilin aynı anda aynı desteğe ihtiyaç duyması"}, {"t": "Yaklaşık 300 km'lik yüzey kırığı ve çok sayıda büyük artçı"}, {"t": "11 ili ve yoğun nüfuslu şehir merkezlerini kapsayan geniş etki alanı"}], "a": 0, "exp": "**Kırılganlık**: insan, yapı ve altyapının zarar görmeye ne kadar açık olduğu — eski yönetmelikle yapılmış yapı stoku, zemin sorunları, denetim eksikleri ve yapısal olmayan riskler. İki büyük deprem ve 300 km kırılma **tehlike**; 11 il ve yoğun nüfus **maruziyet**tir. Tehlikeyi değiştiremeyiz; maruziyeti (nereye yerleşiyoruz) ve kırılganlığı (nasıl inşa ediyoruz) değiştirebiliriz."}, {"q": "2018 Türkiye Deprem Tehlike Haritası ile ilgili aşağıdakilerden hangileri doğrudur?\nI. Bölge kavramını tamamen kaldırmış, her nokta (adres/koordinat) için ayrı değer verir.\nII. En büyük yer ivmesi (PGA) değerleriyle çalışır ve TBDY-2018 bu haritaya dayanır.\nIII. Yalnızca il ve ilçe sınırları için ortalama ivme değeri verir.", "opts": [{"t": "Yalnız I"}, {"t": "Yalnız II"}, {"t": "I ve II"}, {"t": "I ve III"}, {"t": "II ve III"}], "a": 2, "exp": "**Türkiye Deprem Tehlike Haritası (2018, tdth.afad.gov.tr)** bölge kavramını kaldırmış, **noktasal** ivme değeri verir; **PGA** ile çalışır; **TBDY-2018** bu haritaya dayanır; herkes kendi adresini çevrim içi sorgulayabilir. İl/ilçe sınırlarına göre değer vermek **eski** haritanın özelliğidir (III yanlış). Eski harita, bir yolun iki yakasının farklı bölgede kalması gibi yapay keskin sınırlar yaratıyordu.\n💡 Artık \"kaçıncı derece bölgedeyim?\" değil, \"adresimin ivme değeri kaç?\" diye sorulur."}, {"q": "Tehlike haritasında bir adres için PGA değeri 0,40 g olarak verilmiştir. Bu değer neyi ifade eder?", "opts": [{"t": "Binanın depremde %40 olasılıkla yıkılacağını"}, {"t": "Bölgede önümüzdeki 40 yıl içinde deprem beklendiğini"}, {"t": "Bina altındaki zeminin %40'ının sıvılaşabileceğini"}, {"t": "Binaya ağırlığının ~%40'ı kadar yatay kuvvet etkiyebileceğini"}, {"t": "Beklenen depremin büyüklüğünün 4,0 olacağını"}], "a": 3, "exp": "**PGA (Peak Ground Acceleration, En Büyük Yer İvmesi)**, bir yerde depremde beklenen en yüksek zemin ivmesidir ve **yerçekimi ivmesinin katı (g)** olarak verilir. **0,40 g**, binaya ağırlığının yaklaşık **%40'ı kadar yatay kuvvet** demektir. Binalar dikey yük için tasarlanır; yatay kuvvet onlara yabancıdır."}, {"q": "İkincil afet ve depremin geçici–kalıcı etkileri ile ilgili hangisi yanlıştır?", "opts": [{"t": "Sıvılaşma ve yamaç kayması, sarsıntı bitince ortadan kalkan geçici etkilerdir"}, {"t": "İkincil afet, bir afetin etkisi veya tetiklemesiyle meydana gelen yeni afettir"}, {"t": "Yer sarsıntısı onlarca saniyeden birkaç dakikaya süren geçici bir etkidir"}, {"t": "Salgın hastalık ve endüstriyel kaza da ikincil afet sayılır"}, {"t": "Bazı afetlerde asıl can kaybı ikincil afetten gelir"}], "a": 0, "exp": "**Sarsıntı geçicidir** (onlarca saniye–birkaç dakika); **sıvılaşma, yamaç kayması ve kaya düşmesi** ise **kalıcı zemin deformasyonlarıdır** — sarsıntı bittikten sonra da orada durur. Bu, iyileştirme evresinin neden yıllar sürdüğünü açıklar. **İkincil afet**: yangın, heyelan, baraj yıkılması, patlama, salgın hastalık, endüstriyel kaza gibi bir afetin tetiklediği yeni afetler.\n💡 Örnek: 2011 Japonya'da can kaybının ezici çoğunluğu tsunamiden; 1995 Kobe'de önemli kısmı yangınlardan."}, {"q": "Zemin sıvılaşmasının oluşum basamakları doğru sırayla hangisidir?", "opts": [{"t": "Taşıma gücü kaybı → sarsıntı → tanelerin birbirine değmesi → yapının çökmesi"}, {"t": "Taneler yükü taşır → boşluk suyu basıncı artar → taşıma gücü kaybolur → yapı yan yatar"}, {"t": "Sarsıntı → kum tanelerinin erimesi → zeminin buharlaşması → binanın yan yatması"}, {"t": "Boşluk suyu basıncının azalması → tanelerin sıkışması → zeminin sertleşmesi → yapının yıkılması"}, {"t": "Kuru killi zeminin çatlaması → su girişi → yamaç kayması → kaya düşmesi"}], "a": 1, "exp": "Sıvılaşma **sığ ve suya doygun kumlu zeminlerde** olur: (1) kum taneleri birbirine değerek yükü taşır, boşluklar suyla doludur; (2) sarsıntı tane temasını zayıflatır, **boşluk suyu basıncı yükselir**; (3) zemin **taşıma gücünü kaybeder**; (4) yapılar **yıkılmadan yan yatar** veya devrilir (Adapazarı 1999).\n💡 Islak kumsalda ayağınızı hızlıca oynatınca kumun sulanıp ayağın gömülmesi küçük ölçekli sıvılaşmadır."}, {"q": "Yer hareketi ve tsunaminin ölümcüllüğü karşılaştırıldığında kaynakta verilen oran hangisidir?", "opts": [{"t": "Yer hareketinde 1000 kişiden 79'u, tsunamide 1000 kişiden 4'ü ölür (~20 kat)"}, {"t": "Yer hareketinde 1000 kişiden 9'u, tsunamide 1000 kişiden 17'si ölür (~2 kat)"}, {"t": "İkisinde de 1000 kişiden yaklaşık 20'si ölür"}, {"t": "Yer hareketinde 1000 kişiden 4'ü, tsunamide 1000 kişiden 79'u ölür (~20 kat)"}, {"t": "Yer hareketinde 100 kişiden 4'ü, tsunamide 100 kişiden 40'ı ölür (~10 kat)"}], "a": 3, "exp": "Yer hareketinden etkilenen her **1000 kişiden 4'ü**, tsunamiden etkilenen her **1000 kişiden ortalama 79'u** hayatını kaybeder — yaklaşık **20 kat**. Neden: tsunami **boğulma** üreten bir afettir ve kurtarılabilir hasta oranı çok düşüktür. Depremde yaralı sayısı ölüden fazladır; **tsunamide oran tersine döner**.\n💡 4'e karşı 79: tsunami yaklaşık 20 kat daha öldürücüdür."}, {"q": "Marmara Denizi'ndeki tsunami riskiyle ilgili kaynaktaki değerlendirme hangisidir?", "opts": [{"t": "Marmara'daki fay bir yitim zonu olduğundan M 9 depremle büyük tsunami beklenir"}, {"t": "Marmara'da yalnızca volkanik kaynaklı tsunami oluşabilir"}, {"t": "Marmara kapalı bir deniz olduğu için tsunami riski yoktur"}, {"t": "Yanal atımlı fay doğrudan tsunami üretmeyebilir; deniz altı heyelanları önemli kaynaktır"}, {"t": "Fay normal fay olduğundan her depremde mutlaka tsunami oluşur"}], "a": 3, "exp": "Akdeniz, Karadeniz ve Marmara'da çok sayıda tsunami kaydedilmiştir. Marmara'da fay **yanal (doğrultu) atımlı** olduğu için **doğrudan tsunami üretmeyebilir**; ancak tetiklenen **deniz altı heyelanları** önemli bir tsunami kaynağıdır. Tarihte 1509 İstanbul (\"Küçük Kıyamet\") ve 1999'da İzmit Körfezi'nde küçük tsunami dalgaları gözlenmiştir; Türkiye'de tsunami erken uyarı sistemi **Kandilli Rasathanesi** bünyesindedir."}, {"q": "Kıyıda deprem hissedilmiş ve tsunami uyarısı yapılmıştır. Kaynağa göre doğru davranış hangisidir?", "opts": [{"t": "Karadakiler binaların bodrum katlarına sığınmalıdır"}, {"t": "Herkes kıyıya inerek denizin çekilip çekilmediğini gözlemelidir"}, {"t": "Karadakiler yükseğe çıkmalı, teknedekiler açık denize gitmelidir"}, {"t": "Dalga 1 metreden alçaksa kıyıda beklemekte sakınca yoktur"}, {"t": "Teknedekiler hızla limana dönüp karaya çıkmalıdır"}], "a": 2, "exp": "Karadakiler **denizden hızla uzaklaşıp yüksek yerlere** çıkmalı; denizde teknede olanlar **kıyıdan uzaklaşıp açık denize** gitmelidir. **1 metre** derinlikteki su bir insanı öldürebilir: tsunami dalgası arkasında kilometrelerce su kütlesi taşır ve sürekli iter; dalganın yüksek olması gerekmez.\n💡 Tsunami **uzun dönemli, uzun dalga boylu** okyanus dalgasıdır; çoğunlukla deniz altı depremleri, ayrıca deniz altı heyelanları, volkanlar ve uzay cisimlerinin çarpmasıyla oluşur."}, {"q": "6 Şubat 2023 depremlerinde İskenderun Limanı'nda devrilen konteynerlerde çıkan ve günlerce süren yangın hangi kavramın Türkiye'deki en güncel örneğidir?", "opts": [{"t": "Yanal yayılma"}, {"t": "NaTech"}, {"t": "Zemin büyütmesi"}, {"t": "Sıvılaşma"}, {"t": "Tetiklenmiş deprem"}], "a": 1, "exp": "**NaTech (Natural Hazard Triggered Technological Accident)**: doğa olayının tetiklediği teknolojik kaza. Deprem kritik tesisleri vurduğunda doğa kaynaklı olay **teknolojik afete** dönüşür. İskenderun'da kimyasal içerik belirsizliği ve genel yıkım söndürmeyi güçleştirdi; aynı anda arama-kurtarma ve kimyasal yangın yönetimi gerekti. Kavram ders kitabında geçmez; Hafta 11'de (teknolojik afetler ve KBRN) işlenecektir."}, {"q": "Depremin sağlık sonuçlarının sınıflandırılmasında, kronik hastalık tedavisinin (diyaliz, insülin, tansiyon, onkoloji) kesintiye uğraması hangi başlıkta yer alır?", "opts": [{"t": "İkincil afet – NaTech"}, {"t": "Dolaylı – süreklilik kaybı"}, {"t": "Doğrudan – travma"}, {"t": "Dolaylı – çevre ve ruh sağlığı"}, {"t": "Doğrudan – crush sendromu"}], "a": 1, "exp": "Dört başlık: **Doğrudan–travma** (ilk saatler/günler; künt travma, kırıklar, kafa-omurga-göğüs travması, ezilme, yanık, kanama, enkazda hipotermi ve susuzluk), **Doğrudan–crush sendromu** (depremin imza tablosu), **Dolaylı–süreklilik kaybı** (haftalardan aylara; kronik tedavi kesintisi, gebe-bebek hizmetlerinin durması, aşılama zincirinin kopması), **Dolaylı–çevre ve ruh sağlığı** (su-sanitasyona bağlı bulaşıcı hastalık, beslenme sorunları, akut stres, TSSB)."}, {"q": "Depremin sağlık yükünün zaman içindeki seyri kaynakta nasıl özetlenmiştir?", "opts": [{"t": "Sağlık yükü yalnızca ilk 72 saattir; sonrasında afet sağlık hizmeti gerekmez"}, {"t": "İlk haftalarda crush; ilk 72 saatte kronik tedavi kesintisi; aylarda travma"}, {"t": "İlk 72 saatte bulaşıcı hastalık; sonraki haftalarda crush; aylarda diyaliz ihtiyacı"}, {"t": "İlk 72 saat travma; sonraki haftalar süreklilik kaybı ve çevre sağlığı; aylar ruh sağlığı"}, {"t": "İlk 72 saatte ruh sağlığı; sonraki haftalarda travma; aylarda bulaşıcı hastalık"}], "a": 3, "exp": "Seyir: **ilk 72 saat travma (ve crush)** → **sonraki haftalar süreklilik kaybı ve çevre sağlığı** → **aylar ruh sağlığı**. Bu sıra afet sağlık hizmetlerinin **planlama takvimidir**. Haftanın ana fikri: **\"Enkazdan çıkma, kurtulmak demek değildir\"**; sağlık planlaması sürecin tamamına göre yapılır.\n💡 'Afet = ilk 72 saat' yanılgısına düşmeyin."}, {"q": "Kaynakta afetin en kritik dar boğazlarından biri olarak gösterilen ve hem kronik böbrek hastalarının hem de crush nedeniyle akut böbrek hasarı gelişen yeni hastaların aynı anda talep ettiği kapasite hangisidir?", "opts": [{"t": "Yoğun bakım ventilatör kapasitesi"}, {"t": "Kan bankası stokları"}, {"t": "Diyaliz kapasitesi"}, {"t": "Aşı soğuk zinciri"}, {"t": "Ruh sağlığı danışmanlığı"}], "a": 2, "exp": "Bir diyaliz hastası haftada üç kez tedavi almak zorundadır; afette merkez yıkılır, su ve elektrik kesilir, ulaşım imkânsızlaşır. Aynı anda **crush** nedeniyle akut böbrek hasarı gelişen yeni hastalar da diyaliz ister: **diyaliz kapasitesi** afetin en kritik dar boğazlarından biridir. 2023'te bölgedeki diyaliz hastalarının başka illere nakli büyük bir lojistik operasyon oldu."}, {"q": "Crush (ezilme) sendromunun bileşenleri hangi seçenekte doğru verilmiştir?", "opts": [{"t": "Hemoliz + hiperkalsemi + akut böbrek hasarı"}, {"t": "Hipotermi + hipokalemi + karaciğer yetmezliği"}, {"t": "Rabdomiyoliz + hipokalemi + solunum yetmezliği"}, {"t": "Hiperglisemi + hiponatremi + kalp yetmezliği"}, {"t": "Rabdomiyoliz + hiperkalemi + akut böbrek hasarı"}], "a": 4, "exp": "**Crush sendromu**: uzun süre ağır yük altında kalan kasın bozulması (**rabdomiyoliz**) ve hücre içeriğinin kana karışmasıyla gelişen, **akut böbrek hasarı** ve **ölümcül ritim bozukluğuna (hiperkalemi)** ilerleyebilen tablo. Depremin **imza tablosu**dur; enkaz altında kalma süresi uzadıkça risk artar.\n💡 Kodlama: **R-H-A** = Rabdomiyoliz, Hiperkalemi, Akut böbrek hasarı."}, {"q": "Crush sendromunun hangi bileşeni kaynakta 'tablonun en acil bileşeni' olarak nitelendirilmiştir?", "opts": [{"t": "Hiperkaleminin yol açtığı kalp ritim bozukluğu"}, {"t": "Fosfat yüksekliği"}, {"t": "Enkaz altındaki susuzluk"}, {"t": "Miyoglobinin yol açtığı akut böbrek hasarı"}, {"t": "Ekstremite kırıkları"}], "a": 0, "exp": "Yüksek potasyum (**hiperkalemi**) kalp ritmini bozar ve **hızla ölümcül** olabilir; bu yüzden tablonun **en acil** bileşenidir. Akut böbrek hasarı da ciddidir ama saatler–günler içinde gelişir ve diyalizle yönetilebilir."}, {"q": "30 saat sonra enkazdan bilinci açık ve konuşarak çıkarılan bir depremzede birkaç dakika içinde ani kardiyak arrest geçiriyor. Bu tablonun adı ve mekanizması hangisidir?", "opts": [{"t": "Tetiklenmiş ölüm; artçı depremin yarattığı panik"}, {"t": "Kurtarma ölümü; enkazdan çıkarken soğuğa maruz kalınca gelişen ani hipotermi"}, {"t": "Kurtarma ölümü; baskı kalkınca potasyum ve miyoglobinin aniden dolaşıma geçmesi"}, {"t": "Sıvılaşma; enkaz altında biriken zemin suyunun akciğerlere dolması"}, {"t": "Kompartman sendromu; baskı devam ettiği için kasın kanlanmaması"}], "a": 2, "exp": "Enkaz altındayken baskı kas içeriğinin dolaşıma geçişini **büyük ölçüde engeller**. **Baskı kalktığı anda** bölge yeniden kanlanır ve biriken **potasyum ve miyoglobin aniden dolaşıma** karışır → hiperkalemiye bağlı ritim bozukluğu ve dolaşım çöküşü: **kurtarma ölümü**. Enkazdan konuşarak çıkan hasta \"iyi\" demek değildir; asıl risk baskı kalktıktan sonra başlar.\n💡 Konuşarak çıkmak, kurtulmuş olmak demek değildir."}, {"q": "Uzun süredir enkaz altında olduğu belirlenen bir yaralı için arama-kurtarma ekibiyle birlikte çalışan bir AYAY ekibinin kaynağa göre doğru yaklaşımı hangisidir?", "opts": [{"t": "Hasta konuşuyor ve iyi görünüyorsa izlemeden aileye teslim etmek"}, {"t": "Önce baskıyı hızla kaldırıp, sıvı tedavisini hastaneye ulaşınca başlatmak"}, {"t": "Hasta çıkarılana kadar enkazın dışında bekleyip ardından teslim almak"}, {"t": "Mümkünse çıkarmadan önce damar yolu açıp sıvı başlamak, sonra yakından izlemek"}, {"t": "Hiperkalemi riskini azaltmak için hastaya potasyumlu sıvı başlamak"}], "a": 3, "exp": "Kaynağa göre **mümkünse hasta enkazdan çıkarılmadan ÖNCE damar yolu açılıp sıvı tedavisine** başlanır; çıkarma ve sonrası **yakın izlem** gerektirir; hasta \"iyi görünüyor\" diye bırakılmaz. Sağlık ekibi enkaz dışında bekleyip hastayı teslim almaz; hasta hâlâ enkazdayken tedaviye başlar — arama-kurtarma ile sağlık ekibinin koordinasyonu bu yüzden hayatidir. Protokol ayrıntıları üst sınıf derslerindedir."}, {"q": "Crush sendromu ve kurtarma ölümü mekanizmasının doğru sıralaması hangisidir?", "opts": [{"t": "Baskı → böbrek hasarı → kas ölümü → baskı kalkar → potasyum düşer"}, {"t": "Baskı → kas ölümü → baskı kalkar → potasyum ve miyoglobin dolaşıma karışır → ritim bozukluğu ve böbrek hasarı"}, {"t": "Baskı kalkar → baskı → kas ölümü → böbrek hasarı → miyoglobin dolaşıma karışır"}, {"t": "Baskı → potasyum ve miyoglobin dolaşıma karışır → kas ölümü → baskı kalkar → böbrek hasarı"}, {"t": "Kas ölümü → baskı → ritim bozukluğu → baskı kalkar → potasyum dolaşıma karışır"}], "a": 1, "exp": "Sıra: **baskı → kasın kanlanamaması ve ölümü (rabdomiyoliz) → baskı kalkar → potasyum ve miyoglobin dolaşıma karışır → hiperkalemiye bağlı ritim bozukluğu ve miyoglobine bağlı akut böbrek hasarı**. Sınavda \"baskı kalktığı anda\" ifadesi aranır; yalnızca \"kas ezilmesi\" demek yeterli değildir."}, {"q": "ÇÖK-KAPAN-TUTUN ve deprem sırasındaki davranışlarla ilgili hangisi yanlıştır?", "opts": [{"t": "Sarsıntı sırasında zemin açılabileceği için hemen dışarı koşulmalıdır"}, {"t": "Pencere, avize ve mutfak dolabından uzak durulur"}, {"t": "Bulunulan zemine çökülür, kendini koruyacak şekilde kapanılır, sağlam bir masaya tutunulur"}, {"t": "Sarsıntı birkaç saniyeden birkaç dakikaya sürer; panik yapılmaz"}, {"t": "Sarsıntı süresince duruma göre yer değiştirilebilir"}], "a": 0, "exp": "Kaynağa göre **zemin açılmaz**; sarsıntı birkaç saniye–birkaç dakika sürer, **panik olunmaz**. İçerideysen **ÇÖK–KAPAN–TUTUN**, pencere/avize/mutfak dolabından uzak dur, güvenli olmadıkça dışarı çıkma. Deprem sırasında yaralanmalara en çok **düşen parçalar ve döküntüler** yol açar."}, {"q": "Deprem sırasında araç kullanmakta olan bir kişi için kaynağa göre doğru davranış hangisidir?", "opts": [{"t": "Sarsıntı bitene kadar yoluna devam edip hastaneye gitmek"}, {"t": "Hızlanarak en yakın köprünün altına sığınmak"}, {"t": "Aracı durdurup hemen dışarı çıkarak elektrik direğinin yanında beklemek"}, {"t": "Aracı yolun ortasında bırakıp en yakın binaya koşmak"}, {"t": "Güvenle durup köprü ve üst geçitten uzaklaşmak, sarsıntı bitene dek araçta kalmak"}], "a": 4, "exp": "Araçtaysan: **en kısa sürede güvenli şekilde dur, köprü ve üst geçitten uzaklaş, sarsıntı geçene kadar araçta kal**. Dışarıdaysan: elektrik direği, bina ve duvar kenarlarından uzaklaş, açık alana git. Ayrıca yollarda hasta ve yaralı nakli yapılacağı için **trafiği engellememek** gerekir — afetin ilk saatlerinde yol açıklığı, ambulans için yakıt kadar kritiktir."}, {"q": "Deprem çantasında düdük bulundurulmasının kaynakta vurgulanan gerekçesi hangisidir?", "opts": [{"t": "Yalnızca çocukların deprem sonrası paniğini azaltmak için önerilir"}, {"t": "Tsunami uyarısını komşulara iletmenin resmî yoludur"}, {"t": "Arama köpeklerini uzaklaştırarak enkaz altındaki kazazedeyi korur"}, {"t": "Artçı depremleri önceden çevredekilere haber vermek için kullanılır"}, {"t": "Bağırmaktan daha az enerjiyle daha uzağa ses ulaştırır ve uzun süre dayanır"}], "a": 4, "exp": "Düdük en hafife alınan ama **enkaz altında sesten çok daha uzun süre dayanan** araçtır: bağırmak birkaç saatte sesi tüketir ve enerji harcar; düdük **çok az enerjiyle çok daha uzağa** ulaşır. Arama ekipleri **sessizlik anlarında** tam olarak bu sesi dinler."}, {"q": "Kaynakta deprem çantasının neden 3 değil en az 10 gün yetecek şekilde hazırlanması gerektiği nasıl açıklanır?", "opts": [{"t": "Tehlike haritası sorgusu 10 gün sonra açılır"}, {"t": "Büyük afette dış yardımın bölgeye tam kapasiteyle ulaşması günler alabilir"}, {"t": "Crush sendromu belirtileri ancak 10. günde ortaya çıkar"}, {"t": "Artçı depremler kesin olarak 10 gün sürer"}, {"t": "Deprem bölgesinde marketler yasal olarak 10 gün kapalı kalır"}], "a": 1, "exp": "Büyük bir afette **dış yardımın bölgeye tam kapasiteyle ulaşması günler alabilir**; 2023 depremlerinde bazı ilçelerde bu süre uzamıştır.\n💡 Kronik hastalar için **ilaç listesi ve tanı notu** hayati önemdedir: afette hasta kendi tıbbi geçmişini anlatamayabilir, kayıtlara ulaşılamayabilir."}], "cards": [{"t": "Fay nedir?", "b": "Fay, yerkabuğundaki bir **kırılma düzlemi** boyunca **iki bloğun birbirine göre yer değiştirdiği** yapıdır. Deprem, bu düzlem üzerindeki **ani hareketle** oluşur."}, {"t": "Tavan ve taban blok", "b": "Fay düzleminin **üstünde** kalan blok **tavan bloğu** (hanging wall), **altında** kalan blok **taban bloğudur** (footwall). Adlandırma madencilikten gelir: galeride başın üstündeki blok tavan, ayağın bastığı blok tabandır. 💡 Tavan üstte, taban altta — galerideki madenci gibi düşün."}, {"t": "Gömülü faylar", "b": "Bütün faylar arazide gözle görülmez: **yüzeye çıkmayan gömülü faylar** da vardır ve bunlar da **deprem üretir**. Haritada fay çizgisi görünmemesi, orada fay olmadığı anlamına gelmez."}, {"t": "Normal fay", "b": "**Gerilmeli
