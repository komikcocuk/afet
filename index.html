*. 1985 Meksika'da Texcoco Gölü kili; 1999'da Gölcük dış merkezli depremde ~100 km uzaktaki **İstanbul Avcılar**'da gevşek zemindeki ağır hasar bunun örnekleridir. **Sönümlenme** ise enerjinin mesafeyle azalmasıdır (tersi)."}, {"q": "Bir AYAY yöneticisi büyük bir depremden sonra ilk sevk planını dış merkeze göre kurmuştur. Ders notlarına göre bu planla ilgili doğru yaklaşım hangisidir?", "opts": [{"t": "Plan yalnızca magnitüd değerine göre güncellenmelidir"}, {"t": "Plan öncü deprem sayısına göre güncellenmelidir"}, {"t": "Hasar başka yerde yoğunlaşabilir; plan sahadan gelen şiddet/hasar bilgisiyle güncellenmelidir"}, {"t": "Dış merkez her zaman en ağır hasarın olduğu yer olduğundan plan değiştirilmemelidir"}, {"t": "Dış merkezden 100 km'den uzak yerleşimler planlamadan çıkarılmalıdır"}], "a": 2, "exp": "Afetin ilk saatlerinde dış merkez bilgisi hızla gelir ve ilk sevk planı ona göre yapılır; ancak hasar ve yaralı yoğunluğu **zemine ve yapı stokuna** göre başka yerde toplanabilir (Meksika 1985: 350 km uzakta; 1999: Avcılar). Sevk planı **sahadan gelen hasar ve şiddet bilgisine** göre güncellenmelidir. Uzaklık tek başına güvence değildir."}, {"q": "Odak derinliğine göre deprem sınıflaması hangi seçenekte doğru verilmiştir?", "opts": [{"t": "Sığ: 0–30 km; orta: 30–300 km; derin: 300–700 km"}, {"t": "Sığ: 0–10 km; orta: 10–70 km; derin: 70–300 km"}, {"t": "Sığ: 0–100 km; orta: 100–350 km; derin: 350–2900 km"}, {"t": "Sığ: 0–70 km; orta: 70–500 km; derin: 500–1000 km"}, {"t": "Sığ: 0–70 km; orta: 70–300 km; derin: 300–700 km"}], "a": 4, "exp": "Derinliğe göre: **sığ 0–70 km**, **orta 70–300 km**, **derin odaklı 300–700 km**. Sınıflama sınavda doğrudan sorulabilir.\n💡 \"70 – 300 – 700\": üç sayı, üç sınıf."}, {"q": "Aynı büyüklükte iki depremden biri 10 km, diğeri 400 km derinlikte olmuştur. Hangisi doğrudur?", "opts": [{"t": "400 km derinlikteki deprem dar alanda ağır hasar yapar"}, {"t": "10 km derinlikteki deprem dar alanda hissedilir ama daha çok hasar yapar"}, {"t": "10 km derinlikteki deprem daha geniş alanda hissedilir"}, {"t": "400 km derinlikteki deprem daha çok hasar yapar, çünkü daha fazla enerji açığa çıkarır"}, {"t": "İkisi de aynı magnitüdde olduğu için aynı hasarı yapar"}], "a": 1, "exp": "Aynı magnitüd = **aynı enerji**; tek fark derinlik. Enerji odaktan yeryüzüne ulaşana kadar mesafeyle **sönümlenir**. **Sığ deprem**: dar alan, ağır hasar. **Derin deprem**: geniş alan, az hasar. Sezgiye ters olduğu için sınavda ayırt edici sorudur: \"Derin depremler daha az hasar yapar\" ifadesi **doğrudur**."}, {"q": "Orta derinlikte (70–300 km) ve derin odaklı depremler daha çok nerede görülür?", "opts": [{"t": "Volkanik olmayan kıta içlerinde"}, {"t": "Yanal atımlı fayların bulunduğu bölgelerde"}, {"t": "Yitim zonlarında"}, {"t": "Okyanus ortası sırtlarda"}, {"t": "Türkiye'deki Kuzey Anadolu Fayı boyunca"}], "a": 2, "exp": "Orta derinlikteki depremler daha çok **yitim zonlarında** görülür; derin odaklı depremler **neredeyse yalnızca** buralarda olur. **Türkiye'de bu tip bir zon bulunmaz**; Türkiye depremleri sığdır (0–60 km; şehirlerin altında çoğunlukla 5–10 km)."}, {"q": "Ders notlarına göre Türkiye'deki depremlerin odak derinliği için hangisi doğrudur?", "opts": [{"t": "Genellikle derin odaklıdır (300–700 km)"}, {"t": "Genellikle orta derinliktedir (70–300 km)"}, {"t": "Türkiye'de sığ deprem görülmez"}, {"t": "Genellikle sığdır; şehirlerin altında çoğunlukla 5–10 km"}, {"t": "Şehirlerin altında çoğunlukla 100–350 km'dir"}], "a": 3, "exp": "Türkiye depremleri **genellikle sığdır (0–60 km)**; şehirlerimizin altında odak derinliği çoğunlukla **5–10 km**'dir. Bu nedenle aynı magnitüddeki bir deprem Türkiye'de başka ülkelerden **daha ağır hasar** yapar ve erken uyarı için kalan süre kısalır."}, {"q": "Bir AYAY ekibi sığ bir depremin olduğu bölgede çalışmaktadır. Ders notlarına göre sığ depremin sağlık planlaması açısından anlamı hangisidir?", "opts": [{"t": "Erken uyarı sistemi uzun süre kazandıracağı için hastaneler önceden boşaltılabilir"}, {"t": "Yaralılar çok geniş bir alana dağılır; bu nedenle bölge dışı desteğe gerek yoktur"}, {"t": "Sağlık talebi ilk hafta sonra başlar"}, {"t": "Hasar az olacağından yerel kapasite yeterlidir"}, {"t": "Yaralılar dar alanda yoğunlaşır; bölge dışı destek ilk saatlerde başlatılmalıdır"}], "a": 4, "exp": "Sığ deprem sağlık sistemi açısından \"**yoğunlaşmış talep**\" demektir: yaralılar birkaç ilçede toplanır, yerel hastane, 112 ve ambulans kapasitesi **ilk saatte doyar**. Bölge dışından kaynak aktarımı (**UMKE**, çevre illerden ambulans, sahra hastanesi) ilk saatlerde başlatılmalıdır."}, {"q": "Richter'in (1935) magnitüd tanımında yer alan standart koşullar hangi seçenekte doğru verilmiştir?", "opts": [{"t": "100 km uzaklık, sert zemin, maksimum genliğin 10 tabanlı logaritması"}, {"t": "Dış merkezin tam üzeri, herhangi bir zemin, sarsıntı süresi"}, {"t": "Odaktan 1000 km uzaklık, sert zemin, genliğin doğal logaritması"}, {"t": "Dış merkezden 100 km uzaklık, yumuşak zemin, hasar gören bina sayısı"}, {"t": "Dış merkezden 10 km uzaklık, yumuşak zemin, ortalama genlik"}], "a": 0, "exp": "Richter (1935): **dış merkezden 100 km** uzaklıkta, **sert zemine** yerleştirilmiş özel bir sismografla kaydedilen zemin hareketinin **mikron** cinsinden **maksimum genliğinin 10 tabanına göre logaritması**. Bu üç öğe (100 km, sert zemin, logaritma) ölçüyü standartlaştırır; herkes aynı koşulda ölçtüğü için sayılar karşılaştırılabilir."}, {"q": "Magnitüd 1 birim arttığında zemin hareketinin genliği ve açığa çıkan enerji yaklaşık kaç kat artar?", "opts": [{"t": "Genlik ve enerji 10'ar kat"}, {"t": "Genlik 10, enerji ~31,6 kat"}, {"t": "Genlik 2 kat, enerji 10 kat"}, {"t": "Genlik 10 kat, enerji 1000 kat"}, {"t": "Genlik 31,6 kat, enerji 10 kat"}], "a": 1, "exp": "Magnitüd **logaritmik**tir: 1 birim artışta **genlik 10 kat**, **enerji ~31,6 kat** artar. Yani 7,7'lik bir deprem 6,7'nin ~**32 katı**, 5,7'nin ~**1000 katı** enerji açığa çıkarır."}, {"q": "Mw 7,7 büyüklüğündeki bir deprem, Mw 5,7 büyüklüğündeki bir depremin yaklaşık kaç katı enerji açığa çıkarır?", "opts": [{"t": "Yaklaşık 20 katı"}, {"t": "Yaklaşık 100 katı"}, {"t": "Yaklaşık 2 katı"}, {"t": "Yaklaşık 32 katı"}, {"t": "Yaklaşık 1000 katı"}], "a": 4, "exp": "Her birimde enerji ~32 kat artar; 2 birim fark → 32 × 32 ≈ **1000 kat**. 1 birim fark (7,7 ile 6,7) ~32 kat olurdu; genlik farkı ise 2 birimde 100 kattır — çeldiriciler bu karışıklığa dayanır."}, {"q": "Magnitüd (büyüklük) ile ilgili aşağıdakilerden hangisi YANLIŞTIR?", "opts": [{"t": "Bir depremin yere göre değişen birden çok magnitüdü vardır"}, {"t": "Kaydedilen zemin hareketinden hesaplanan aletsel bir değerdir"}, {"t": "Ondalıklı sayı olarak verilir (örneğin 7,7)"}, {"t": "Açığa çıkan enerjinin bir ölçüsüdür"}, {"t": "Deprem kayıt istasyonlarınca ölçülür"}], "a": 0, "exp": "Bir depremin **tek bir magnitüd** değeri vardır — nerede olursanız olun bu sayı **değişmez**. Yere göre değişen **şiddet**tir. Magnitüd enerjinin aletsel ölçüsüdür, ondalıklı verilir ve istasyonlarca ölçülür."}, {"q": "Kitapta sayılan magnitüd türlerinden hangisi kırılan fay alanı, kayma miktarı ve kayacın direncinden hesaplanır ve büyük depremlerde doyuma ulaşmaz?", "opts": [{"t": "Md (süreye dayalı magnitüd)"}, {"t": "Ml (yerel magnitüd)"}, {"t": "Mw (moment magnitüdü)"}, {"t": "Ms (yüzey dalgası magnitüdü)"}, {"t": "Mb (cisim dalgası magnitüdü)"}], "a": 2, "exp": "**Mw – Moment magnitüdü** kırılan **fay alanı**, **kayma miktarı** ve **kayacın direncinden** hesaplanır; büyük depremlerde doyuma ulaşmaz ve bugün büyük depremler için **uluslararası standart** ölçektir. AFAD ve Kandilli büyük depremleri bu ölçekle duyurur (ör. 6 Şubat 2023 Pazarcık **Mw 7,7**)."}, {"q": "Halk arasında \"Richter ölçeği\" olarak bilinen yerel magnitüd (Ml) ile ilgili hangisi doğrudur?", "opts": [{"t": "Kırılan fay alanı ve kayma miktarından hesaplanır"}, {"t": "Romen rakamıyla ifade edilir"}, {"t": "Küçük-yakın depremlere uygundur; büyüklerde doyuma ulaşır"}, {"t": "Büyük depremlerde büyüklüğü olduğundan yüksek gösterir"}, {"t": "Bugün büyük depremler için uluslararası standart ölçektir"}], "a": 2, "exp": "**Ml** Richter'in özgün ölçeğidir; **küçük ve yakın** depremler için uygundur. Tek bir dalga genliğine baktığı için yaklaşık **6,5–7** üzerinde **doyuma ulaşır** (gerçek büyüklüğü **düşük** gösterir). 1960 Şili (**Mw 9,5**) gibi devasa depremler ancak Mw ile doğru ifade edilir.\n💡 Haberlerde \"Richter ölçeğine göre\" ifadesi çoğunlukla alışkanlıktan kaynaklanan yanlış bir kullanımdır."}, {"q": "Kitapta sayılan magnitüd türlerinden Ms, Mb ve Md sırasıyla neye dayanır?", "opts": [{"t": "Süre, yüzey dalgası, cisim dalgası"}, {"t": "Fay alanı, kayma miktarı, süre"}, {"t": "Yüzey dalgası, moment, derinlik"}, {"t": "Cisim dalgası, yüzey dalgası, derinlik"}, {"t": "Yüzey dalgası, cisim dalgası, süre"}], "a": 4, "exp": "Kitapta beş magnitüd sayılır: **Ml, Ms, Mb, Md, Mw**. **Ms** yüzey dalgası, **Mb** cisim dalgası (body), **Md** süreye (duration) dayalıdır; belirli deprem ve mesafe aralıkları için kullanılır. En çok kullanılanlar Mw ve Ml'dir."}, {"q": "Yer hareketini kaydeden cihazla ilgili ders notlarındaki bilgi hangisidir?", "opts": [{"t": "İvmeölçerdir; yalnızca kâğıt üzerine kayıt alır"}, {"t": "Barometredir; hava basıncındaki değişimi ölçer"}, {"t": "Şiddet ölçeridir; şiddeti doğrudan Romen rakamıyla kaydeder"}, {"t": "Sismometredir; bugün sayısal ve eş zamanlı çalışanları kullanılır"}, {"t": "Radon ölçerdir; depremi önceden tahmin eder"}], "a": 3, "exp": "**Sismograf/sismometre** yer hareketini kaydeden cihazdır. Bugün kâğıt yerine **sayısal (dijital)** sismometreler kullanılır; veriyi **eş zamanlı** alır, değerlendirir ve paylaşır. Şiddet ise **hiçbir zaman** cihazla kaydedilmez."}, {"q": "Şiddet kavramıyla ilgili aşağıdaki ifadelerden hangisi doğrudur?", "opts": [{"t": "Deprem istasyonlarınca kaydedilir"}, {"t": "Ondalıklı Arap rakamıyla ifade edilir (örneğin 7,7)"}, {"t": "Depremin yarattığı etkiyle ölçülen, gözlemle belirlenen göreceli kavramdır"}, {"t": "Bir depremin tek bir şiddet değeri vardır"}, {"t": "Açığa çıkan enerjinin aletsel ölçüsüdür"}], "a": 2, "exp": "**Şiddet**, depremin yapılar, canlılar ve yeryüzünde yarattığı **etkiyle** ölçülen **göreceli** bir kavramdır; **aletle kaydedilmez, gözlemle belirlenir**. Her yerleşim için **ayrı** bir değeri vardır ve **I–XII** arasında **Romen rakamıyla** yazılır."}, {"q": "Türkiye'de kullanılan şiddet cetveli hangisidir?", "opts": [{"t": "Moment magnitüd (Mw) ölçeği"}, {"t": "EMS (Avrupa Makro Sismik Cetveli)"}, {"t": "JMA (Japon Meteoroloji Ajansı) cetveli"}, {"t": "MSK (Medvedev–Sponheuer–Karnik) cetveli"}, {"t": "Richter (Ml) ölçeği"}], "a": 3, "exp": "Türkiye **MSK (Medvedev–Sponheuer–Karnik; UNESCO, 1965)** cetvelini kullanır. **Avrupa Birliği EMS**, **Japonya JMA** cetvelini kullanır. Mw ve Ml şiddet değil **büyüklük** ölçekleridir."}, {"q": "Şiddet cetvelleri ve kullanan ülke/bölge eşleştirmelerinden hangisi doğrudur?", "opts": [{"t": "EMS – Türkiye"}, {"t": "JMA – Japonya"}, {"t": "EMS – Japonya"}, {"t": "JMA – Avrupa Birliği"}, {"t": "MSK – Japonya"}], "a": 1, "exp": "Doğru eşleştirme **JMA – Japonya**'dır: Japonya kendi geliştirdiği Japon Meteoroloji Ajansı cetvelini kullanır. Diğer doğru eşleşmeler: **MSK – Türkiye**, **EMS – Avrupa Birliği**.\n💡 J ile J: **J**MA – **J**aponya; geriye MSK–Türkiye, EMS–Avrupa kalır."}, {"q": "Ders notlarına göre bir yerdeki deprem şiddetini belirleyen etkenler arasında olup insan eliyle değiştirilebilen iki etken hangileridir?", "opts": [{"t": "Odak derinliği ve dış merkeze uzaklık"}, {"t": "Dış merkeze uzaklık ve depremin büyüklüğü"}, {"t": "Depremin büyüklüğü ve yapı stokunun niteliği"}, {"t": "Depremin büyüklüğü ve odak derinliği"}, {"t": "Zemin özellikleri ve yapı stokunun niteliği"}], "a": 4, "exp": "Şiddeti belirleyenler: **büyüklük**, **dış merkeze uzaklık**, **odak derinliği**, **zemin özellikleri** ve **yapı stokunun niteliği**. Son ikisi **insan eliyle değiştirilebilir** — Hafta 1'deki \"afet sonuçtur\" cümlesinin fiziksel karşılığı budur."}, {"q": "Büyüklük ve şiddet karşılaştırmasıyla ilgili aşağıdakilerden hangisi YANLIŞTIR?", "opts": [{"t": "Bir depremin tek bir büyüklüğü, her yerleşim için ayrı bir şiddeti vardır"}, {"t": "Şiddet uzaklık, derinlik, zemin ve yapı kalitesine göre değişir"}, {"t": "Büyüklük ondalıklı Arap rakamıyla, şiddet tam sayılı Romen rakamıyla yazılır"}, {"t": "Şiddet depremin kendi özelliğidir; büyüklük ise yerin maruz kaldığı etkinin özelliğidir"}, {"t": "Büyüklük aletle (sismometre) ölçülür; şiddet gözlemle belirlenir"}], "a": 3, "exp": "Tersi doğrudur: **magnitüd depremin özelliğidir; şiddet yerin özelliğidir.** Diğer ifadeler doğrudur.\n💡 Hoparlör benzetmesi: hoparlörün gücü (watt) magnitüddür — tektir; kulağınıza gelen ses yüksekliği şiddettir — yakınlığa ve aradaki duvara göre değişir."}, {"q": "AFAD'ın yaklaşık karşılıklarına göre MSK şiddeti IX hangi magnitüd değerine karşılık gelir?", "opts": [{"t": "≈ 6,2"}, {"t": "≈ 5,8"}, {"t": "≈ 7,8"}, {"t": "≈ 7,3"}, {"t": "≈ 6,6"}], "a": 4, "exp": "AFAD yaklaşık karşılıkları: **VIII ≈ 6,2**; **IX ≈ 6,6**; **X ≈ 7,3**; **XI ≈ 7,8**. Bu bağıntılar **deneyseldir** ve birebir değildir; zemin ve yapı kalitesi işin içine girdiği için şiddet her zaman aynı magnitüde karşılık gelmez."}, {"q": "Ders notlarına göre büyüklük–şiddet ayrımının afet sağlık hizmetleri açısından önemi hangi ifadede doğru özetlenmiştir?", "opts": [{"t": "Magnitüd dakikalar içinde alarmı başlatır; ihtiyacı belirleyen şiddet sonra netleşir"}, {"t": "Şiddet haritaları yalnızca bilimsel amaçla hazırlanır, sağlık planlamasında kullanılmaz"}, {"t": "Kaynaklar magnitüd değerine göre dağıtılır, şiddet bilgisi gereksizdir"}, {"t": "Şiddet dakikalar içinde gelir; magnitüd ise günler içinde netleşir"}, {"t": "Magnitüd hangi ilçeye kaç ambulans gideceğini doğrudan gösterir"}], "a": 0, "exp": "Afetin ilk saatinde eldeki ilk veri **magnitüddür (dakikalar içinde)**; kaynak ihtiyacını belirleyen **şiddet** ise **saatler–günler** içinde netleşir. AFAD'ın deprem sonrası **şiddet/hasar tahmin haritalarının** işlevi budur. \"Mw 7,7, Pazarcık\" bilgisi 11 ilde 53.537 can kaybı olacağını söylemez.\n💡 \"Magnitüd alarmı başlatır, şiddet planı yazar.\""}, {"q": "\"Bugün Elazığ'da şiddeti 5,8 olan bir deprem meydana geldi.\" cümlesindeki hatalarla ilgili aşağıdakilerden hangileri doğrudur?\nI. 5,8 bir şiddet değil, büyüklük (magnitüd) değeridir.\nII. Şiddet ondalıklı yazılmaz; I–XII arası tam sayılı Romen rakamıdır.\nIII. Cümle, depremin tek bir şiddeti varmış gibi kurulmuştur; oysa şiddet her yerleşim için ayrıdır.", "opts": [{"t": "Yalnız I"}, {"t": "I ve III"}, {"t": "I ve II"}, {"t": "I, II ve III"}, {"t": "II ve III"}], "a": 3, "exp": "Üç hata vardır: **1) Kavram** (5,8 magnitüddür), **2) Yazım** (şiddet ondalıklı olamaz, Romen rakamıdır), **3) Tek değer varsayımı** (şiddet yerleşime göre değişir). Öğrenciler genellikle yalnızca birincisini fark eder; yalnızca kavram hatasını bulan cevap eksiktir. Doğrusu: \"**Büyüklüğü 5,8** olan bir deprem…\""}, {"q": "Ders notlarında verilen doğru kullanım örneği hangisidir?", "opts": [{"t": "\"Elazığ'da Richter ölçeğine göre şiddeti VII olan bir deprem meydana geldi.\""}, {"t": "\"Elazığ'da şiddeti 5,8 olan bir deprem meydana geldi; Sivrice'de büyüklük VII olarak belirlendi.\""}, {"t": "\"Elazığ'da büyüklüğü VII olan bir deprem meydana geldi; şiddeti her yerde 5,8 idi.\""}, {"t": "\"Elazığ'da şiddeti 5,8, büyüklüğü 5,8 olan bir deprem meydana geldi.\""}, {"t": "\"Elazığ'da büyüklüğü 5,8 olan deprem oldu; Sivrice'de şiddet VII olarak belirlendi.\""}], "a": 4, "exp": "Doğru kalıp: **büyüklük** ondalıklı Arap rakamıyla ve depreme ait (5,8); **şiddet** Romen rakamıyla ve belirli bir **yerleşime** ait (Sivrice'de **VII – Hasar Yapıcı**). Bu kalıbı kurabilen öğrenci konuyu kavramış demektir."}, {"q": "MSK cetvelinde her derece hangi üç başlıkta tarif edilir?", "opts": [{"t": "Enerji, genlik ve süre"}, {"t": "P dalgası, S dalgası ve yüzey dalgası"}, {"t": "Kişi ve çevre, yapı ve arazi üzerindeki etki"}, {"t": "Derinlik, uzaklık ve büyüklük"}, {"t": "Can kaybı, yaralı sayısı ve maddi hasar"}], "a": 2, "exp": "MSK cetveli her dereceyi üç başlıkta tarif eder: **kişi ve çevre üzerindeki etki**, **yapı üzerindeki etki** ve **arazi üzerindeki etki**. Yani şiddet **sonuçlara** bakılarak belirlenir."}, {"q": "MSK cetvelinde \"Titreşimler insanlar tarafından hissedilmez, yalnızca sismograflarca kaydedilir.\" şeklinde tarif edilen derece hangisidir?", "opts": [{"t": "III – Hafif"}, {"t": "I – Duyulmayan"}, {"t": "VIII – Yıkıcı"}, {"t": "IX – Çok Yıkıcı"}, {"t": "XII – Yok Edici"}], "a": 1, "exp": "**I – Duyulmayan**: yalnızca sismograflarca kaydedilir. **III – Hafif**: ev içinde az kişi hisseder, hafif bir kamyonetin geçişi gibi. **VIII – Yıkıcı**, **IX – Çok Yıkıcı**, **XII – Yok Edici** (tüm yapılar yıkılır, yer yüzeyi büsbütün değişir)."}, {"q": "MSK cetveline göre \"Genel panik; C tipi yapılarda ağır hasar, B ve A tipi yapılarda yıkıntı; yeraltındaki borular kırılır, demiryolu rayları eğrilir; zeminde çatlaklar, kaya düşmeleri ve heyelanlar\" tarifi hangi dereceye aittir?", "opts": [{"t": "VII – Hasar Yapıcı"}, {"t": "IX – Çok Yıkıcı"}, {"t": "XII – Yok Edici"}, {"t": "VIII – Yıkıcı"}, {"t": "III – Hafif"}], "a": 1, "exp": "**IX – Çok Yıkıcı**: genel panik; C tipinde **ağır hasar**, A ve B tipinde **yıkıntı**; yeraltı boruları kırılır, raylar eğrilir. **VIII – Yıkıcı**'da ise korku ve panik, en ağır mobilyaların yer değiştirmesi, C tipinde **orta**, A ve B tipinde ağır hasar ve yıkıntı, boruların **ek yerlerinin** kırılması vardır."}, {"q": "MSK cetvelindeki yapı tipleri ile örnekleri eşleştirildiğinde hangisi doğrudur?", "opts": [{"t": "C tipi – tuğla ve beton briket yapılar"}, {"t": "A tipi – betonarme yapılar"}, {"t": "A tipi – iyi yapılmış ahşap yapılar"}, {"t": "B tipi – kerpiç ve moloz taş yapılar"}, {"t": "C tipi – betonarme yapılar"}], "a": 4, "exp": "**A tipi**: kerpiç, moloz taş, kırsal konut. **B tipi**: tuğla, yarım kâgir, beton briket. **C tipi**: betonarme ve iyi yapılmış ahşap.\n💡 A → C dayanıklılık artar: aynı sarsıntı A tipini yıkarken C tipinde orta hasar bırakabilir."}, {"q": "MSK cetvelinde kullanılan \"az\", \"çok\" ve \"pek çok\" deyimleri sırasıyla yaklaşık hangi oranları belirtir?", "opts": [{"t": "%5, %50, %75"}, {"t": "%10, %25, %50"}, {"t": "%25, %50, %100"}, {"t": "%5, %25, %75"}, {"t": "%1, %10, %100"}], "a": 0, "exp": "Cetveldeki oran tanımları: **az ≈ %5**, **çok ≈ %50**, **pek çok ≈ %75**. Bu, cetvelin göründüğünden daha **nicel** olduğunu gösterir.\n💡 \"**5 – 50 – 75**\": az, çok, pek çok."}, {"q": "MSK cetvelinin yapı tipine göre tarif yapmasının ders notlarındaki yorumu hangisidir?", "opts": [{"t": "Cetvel bile hasarın yapı kalitesine bağlı olduğunu kabul eder"}, {"t": "Yapı tipi yalnızca magnitüd hesabında kullanılır"}, {"t": "Yapı tipleri yalnızca Japonya'daki JMA cetvelinde kullanılır"}, {"t": "Yapı tipi farkı şiddet değerini etkilemez"}, {"t": "C tipi yapılar her şiddette yıkılır"}], "a": 0, "exp": "Aynı sarsıntı kerpiç bir köy evinde **yıkıntı**, betonarme bir yapıda **orta hasar** üretebilir. Yani şiddet cetveli bile hasarın **yapı kalitesinden** kaynaklandığını kabul eder — \"afet sonuçtur\". Sağlık boyutu: **VIII ve üzeri** şiddette yeraltı borularının kırılması **su ve sanitasyon** sorununa yol açar; bu, ilk günlerde travmadan sonraki ikinci sağlık sorunudur."}, {"q": "Nükleer patlatmalar, madencilik ve büyük baraj göllerinin doldurulması sonucu oluşan depremler kökenlerine göre hangi gruptadır?", "opts": [{"t": "Çöküntü depremleri"}, {"t": "Tektonik depremler"}, {"t": "İnsan kaynaklı depremler"}, {"t": "Volkanik depremler"}, {"t": "Derin odaklı depremler"}], "a": 2, "exp": "Kökene göre dört tür: **tektonik** (levha hareketleri; en yaygın ve en yıkıcı), **volkanik** (magma hareketi; etki alanı dar), **çöküntü** (mağara, karst boşluğu, terk edilmiş maden galerisi çökmesi), **insan kaynaklı** (nükleer patlatma, madencilik, baraj gölü doldurma — \"rezervuar kaynaklı sismisite\", yeraltına sıvı enjeksiyonu)."}, {"q": "Yeraltındaki mağara, eriyik karst boşlukları veya terk edilmiş maden galerilerinin çökmesiyle oluşan depremler hangisidir?", "opts": [{"t": "Volkanik depremler"}, {"t": "Çöküntü depremleri"}, {"t": "İnsan kaynaklı depremler"}, {"t": "Deprem fırtınası"}, {"t": "Tektonik depremler"}], "a": 1, "exp": "**Çöküntü depremleri** yeraltı boşluklarının (mağara, eriyik karst boşlukları, terk edilmiş maden galerileri) **çökmesi** sonucu oluşur. Maden galerisinin *kazılması/işletilmesi* insan kaynaklı sayılırken, terk edilmiş galerinin *çökmesi* çöküntü depremidir."}, {"q": "Türkiye'deki yıkıcı depremlerin kökeni ile ilgili hangisi doğrudur?", "opts": [{"t": "Çoğunluğu volkanik kökenlidir"}, {"t": "Çoğunluğu çöküntü depremidir"}, {"t": "Çoğunluğu derin odaklı yitim depremleridir"}, {"t": "Çoğunluğu insan kaynaklıdır"}, {"t": "Tamamına yakını tektonik kökenlidir"}], "a": 4, "exp": "**Tektonik** depremler en yaygın ve en yıkıcı türdür; dünyadaki yıkıcı depremlerin büyük çoğunluğu bu türdendir. **Türkiye'deki yıkıcı depremlerin tamamına yakını tektonik kökenlidir.**"}, {"q": "Kitaptaki büyüklüğe göre sınıflamaya göre Mw 7,7 olan 6 Şubat 2023 Pazarcık depremi hangi sınıftadır?", "opts": [{"t": "Mikro (1,0–3,0)"}, {"t": "Büyük (7,0–8,0)"}, {"t": "Küçük (3,0–5,0)"}, {"t": "Çok büyük (≥8,0)"}, {"t": "Orta (5,0–7,0)"}], "a": 1, "exp": "Büyüklüğe göre: **çok büyük ≥8,0**; **büyük 7,0–8,0**; **orta 5,0–7,0**; **küçük 3,0–5,0**; **mikro 1,0–3,0**; **ultra mikro <1,0**. Pazarcık (Mw 7,7) ve 1999 Gölcük (Mw 7,4) **büyük** deprem sınıfındadır; 8,0'ı aşsaydı \"çok büyük\" olacaktı."}, {"q": "Kitaptaki uzaklığa göre deprem sınıflamasında 100–1000 km uzaklıktaki depremler hangi gruba girer?", "opts": [{"t": "Yakın"}, {"t": "Orta"}, {"t": "Uzak"}, {"t": "Yerel"}, {"t": "Bölgesel"}], "a": 0, "exp": "Uzaklığa göre: **yerel <100 km**, **yakın 100–1000 km**, **bölgesel 1000–5000 km**, **uzak >5000 km**. Kitap depremleri ayrıca büyüklüğe ve derinliğe göre de sınıflar."}, {"q": "Deterministik deprem kestirimi ile olasılığa dayalı deprem tahmini karşılaştırıldığında hangisi doğrudur?", "opts": [{"t": "Olasılığa dayalı tahminde belirsizlikler kamuoyundan bilinçli olarak gizlenir"}, {"t": "Deterministik kestirim bugün mümkün değildir; yönetmelikler olasılığa dayalı tahmine dayanır"}, {"t": "Deterministik kestirim bugün güvenilir şekilde yapılabilmektedir"}, {"t": "Ay, yıldız ve bulutlarla ilişki kurmak olasılığa dayalı tahminin temelidir"}, {"t": "Olasılığa dayalı tahmin, depremin tarihini ve saatini kesin olarak verir"}], "a": 1, "exp": "**Deterministik kestirim** (\"şu tarihte, şurada, şu büyüklükte\") yer, zaman ve büyüklüğü kesin belirtir — **bugün bilimsel olarak mümkün değildir**; Ay, yıldız, bulut ve fırtınalarla ilişki kurma girişimlerinin bilimsel temeli yoktur. **Olasılığa dayalı tahmin** (\"şu bölgede, şu süre içinde, şu olasılıkla\") güvenilir veriyle yapılır, belirsizlikleri açıkça tanımlar; **deprem tehlike haritaları ve yapı yönetmelikleri** buna dayanır."}, {"q": "Türkiye Deprem Tehlike Haritası (2018) hangi yaklaşıma dayanır ve neyi verir?", "opts": [{"t": "Erken uyarı; S dalgasının varış süresini"}, {"t": "Deterministik kestirim; her ilin MSK şiddetini kesin olarak"}, {"t": "Olasılığa dayalı tahmin; depremin kesin büyüklüğünü ve saatini"}, {"t": "Deterministik kestirim; bir sonraki büyük depremin tarihini"}, {"t": "Olasılığa dayalı; 50 yılda %10 aşılma olasılıklı yer ivmesini"}], "a": 4, "exp": "Türkiye Deprem Tehlike Haritası (2018) **olasılığa dayalı** tahmindir: belirli bir bölgede **50 yıl içinde %10 aşılma olasılığıyla** beklenen **yer ivmesini** verir. Bütün yapı yönetmeliği bu hesabın üzerine kuruludur.\n💡 Tahmin, tarih vermek için değil, **bina yapmak** için kullanılır."}, {"q": "Ergünay ve Özmen'in (2013) bilim insanlarının kamuoyuyla iletişimi için tanımladığı ilkelerle ilgili aşağıdakilerden hangisi YANLIŞTIR?", "opts": [{"t": "Bilimsel bulgular önce doğrudan halka, sonra kurumlara iletilmelidir"}, {"t": "Bilim insanları medyaya ve halka yaptıkları konuşmalardan kişisel olarak sorumludur"}, {"t": "Açıklamalar ün yapmak veya mesleki kazanç sağlamak amacıyla yapılmamalıdır"}, {"t": "Afet dönemlerinde ayaküstü ve muğlak açıklamalardan kaçınılmalıdır"}, {"t": "Bilim insanlarının bulgularını paylaşmak gibi vicdani bir görevi vardır"}], "a": 0, "exp": "Dört ilke: **1) Vicdani görev ve etik açıklama** (basit, doğru, açık; ün, dalkavukluk, kazanç amacı yok), **2) Kişisel sorumluluk**, **3) Ayaküstü ve muğlak açıklamalardan kaçınma** (uygulanamaz önerilerden de), **4) Önce kurumlara, sonra halka** — bulgular doğrudan halka değil, ilgili **kurum, kuruluş ve karar vericilere** iletilmelidir."}, {"q": "Ergünay ve Özmen'in ilkelerine göre bir bilim insanının deprem riskine ilişkin açıklamaları nasıl olmalıdır?", "opts": [{"t": "Yalnızca kesin tarih ve büyüklük bilgisi verilebiliyorsa yapılmalıdır"}, {"t": "Belirsizlikler gözetilerek basit, doğru ve açık ifadelerle"}, {"t": "Halkı rahatlatmak için kesin ve iyimser ifadelerle yapılmalıdır"}, {"t": "Belirsizlik içeriyorsa hiç yapılmamalıdır"}, {"t": "Kamuoyunun dikkatini çekmek için sosyal medyada hızla paylaşılmalıdır"}], "a": 1, "exp": "Bilim insanının vicdani görevi bulguları paylaşmaktır; ancak bu bilgiler **bilimin güvenilirliği ve belirsizlikleri** gözetilerek **basit, doğru ve açık** ifadelerle verilmelidir. Hoş görünmek, halka dalkavukluk etmek, ün yapmak veya mesleki kazanç amacı taşımamalıdır."}, {"q": "6 Nisan 2009 L'Aquila (İtalya) depremiyle ilgili verilen bilgilerden hangisi doğrudur?", "opts": [{"t": "Bilim heyeti depremin tarihini doğru tahmin etmişti"}, {"t": "6,3 büyüklüğündeydi ve 309 kişi hayatını kaybetti"}, {"t": "Deprem yitim zonundaki derin odaklı bir depremdi"}, {"t": "7,7 büyüklüğündeydi ve 10.000 kişi öldü"}, {"t": "Depremden önce bölgede hiç sarsıntı kaydedilmemişti"}], "a": 1, "exp": "L'Aquila: **6 Nisan 2009**, **6,3** büyüklük, **309 ölü**, **1.500 yaralı**, **~20.000** kullanılamaz yapı. Aralık 2008'den itibaren büyüklükleri **2–4** arasında **300'ün üzerinde** deprem kaydedilmişti. Olay, sismoloji tarihine depremin kendisiyle değil, **sonrasındaki davayla** geçti."}, {"q": "L'Aquila olayında 31 Mart'ta bölgeye giden yedi kişilik uzman heyetten basına yansıyan sorunlu mesaj hangisidir?", "opts": [{"t": "Radon ölçümlerinin depremi kesin olarak gösterdiği"}, {"t": "Depremin 6 Nisan'da olacağı"}, {"t": "29 Mart'ta büyük bir deprem olacağı"}, {"t": "Bölgenin derhal boşaltılması gerektiği"}, {"t": "Enerjinin boşaldığı ve tehlike bulunmadığı"}], "a": 4, "exp": "Heyetten basına \"**enerjinin boşalmış olduğu ve tehlike bulunmadığı**\" yönünde bir mesaj yansıdı. \"29 Mart'ta büyük deprem olacak\" duyurusunu ise **radon** ölçümlerine dayanarak yerel bir laboratuvardaki **teknisyen** yapmış ve panik yaratmıştı. Küçük depremlerin büyük depremin enerjisini boşaltmadığını (logaritmik ölçek) hatırlayın."}, {"q": "L'Aquila davasıyla ilgili aşağıdakilerden hangisi YANLIŞTIR?", "opts": [{"t": "Savcı, heyeti depremi önceden kestirememekle suçlamıştır"}, {"t": "Bilim çevreleri davanın kamuoyuna bilgi verecek bilim insanı bulmayı zorlaştıracağını savunmuştur"}, {"t": "Bir görüş asıl sorumluluğun yıkılan yapıları yapanlarda ve izin verenlerde olduğunu ileri sürmüştür"}, {"t": "Heyet \"eksik, çelişkili ve muğlak ifadelerle halkı yanlış bilgilendirmekle\" suçlanmıştır"}, {"t": "Savcı depremin önceden kestirilemeyeceğini kabul etmiştir"}], "a": 0, "exp": "Savcı **depremin önceden kestirilemeyeceğini kabul etmiş**, heyeti tahmin yapamamakla değil, **eksik, çelişkili ve muğlak ifadelerle halkı yanlış bilgilendirmekle** suçlamıştır. Yerel mahkeme 2012 sonunda savcının talep ettiği 4 yılı **6 yıla** çıkarmış; sonraki yıllarda üst mahkeme bilim insanlarının çoğunu **beraat** ettirmiştir (kitap 2018 baskısı olduğu için bu aşamayı içermez)."}, {"q": "Ders notlarına göre L'Aquila'daki uzman heyetin yapması gereken doğru davranış hangisidir?", "opts": [{"t": "Büyük deprem olacağını kesin bir dille duyurmak"}, {"t": "Halkı rahatlatmak için tehlike olmadığını söylemek"}, {"t": "Belirsizliği belirsizlik olarak iletmek"}, {"t": "Hiçbir açıklama yapmayıp sessiz kalmak"}, {"t": "Radon ölçümlerine dayanarak bir tarih vermek"}], "a": 2, "exp": "Cevap \"deprem olacağını söylemeliydi\" değildir; çünkü bilmiyorlardı. Doğru olan **belirsizliği belirsizlik olarak iletmek**ti. Kesinlik vaat etmek kısa vadede güven verir ama uzun vadede **güveni yok eder**.\n💡 Sınavda hatırla: Belirsizliği doğru anlatmak, kesin konuşmaktan daha zor ve daha sorumlu bir iştir."}, {"q": "Radon gazıyla ilgili ders notlarındaki bilgi hangisidir?", "opts": [{"t": "Depremi kesin olarak önceden bildiren, kabul görmüş bir öncü işarettir"}, {"t": "Erken uyarı sistemlerinin temel ölçüm parametresidir"}, {"t": "Magnitüd hesabında kullanılan bir gazdır"}, {"t": "Yalnızca volkanik depremlerde açığa çıkan zararsız bir gazdır"}, {"t": "Kayaçlardaki doğal radyoaktif gazdır; güvenilir öncü işaret sayılmaz"}], "a": 4, "exp": "**Radon**, kayaçlarda doğal olarak bulunan **radyoaktif** bir gazdır. Deprem öncesi radon salınımındaki değişim uzun süredir araştırılmıştır; ancak **güvenilir bir öncü işaret olarak kabul edilmemektedir**. L'Aquila'daki panik bir teknisyenin radon ölçümlerine dayalı duyurusundan kaynaklanmıştı."}, {"q": "Deprem erken uyarı sistemi ile ilgili aşağıdaki ifadelerden hangisi doğrudur?", "opts": [{"t": "Depremi gerçekleşmeden önce haber veren bir tahmin sistemidir"}, {"t": "Dış merkeze en yakın yerleşimlere en uzun uyarı süresini sağlar"}, {"t": "S dalgasını saptayarak P dalgası gelmeden uyarı verir"}, {"t": "Binaları sağlamlaştırarak hasarı önler"}, {"t": "Deprem olduktan sonra, S dalgası gelmeden önceki saniyeleri kullanır"}], "a": 4, "exp": "Erken uyarı **depremin önceden bilinmesi değildir**; deprem **OLDUKTAN sonra** devreye girer. Hızlı ama zararsız **P dalgasını** saptar, sinyali S dalgasından çok daha hızlı iletir. Binayı sağlamlaştırmaz — zarar azaltmanın **yerine geçmez, yanına eklenir**. Dış merkeze en yakın yerleşimlere hiçbir şey kazandırmaz.\n💡 Sınav ipucu: \"Erken uyarı sistemi depremi önceden haber verir\" ifadesi YANLIŞTIR."}, {"q": "Deprem erken uyarı sisteminin çalışma aşamalarının doğru sırası hangisidir?", "opts": [{"t": "Deprem olur → S dalgası saptanır → sinyal iletilir → P dalgası gelmeden önlem alınır"}, {"t": "Deprem olur → sinyal iletilir → S dalgası saptanır → önlem alınır"}, {"t": "Deprem olur → P dalgası saptanır → sinyal iletilir → S dalgası gelmeden önlem alınır"}, {"t": "Sinyal iletilir → deprem olur → P dalgası saptanır → önlem alınır"}, {"t": "P dalgası saptanır → deprem olur → önlem alınır → sinyal iletilir"}], "a": 2, "exp": "**1. Deprem olur** (kaynağa en yakın istasyonlar algılar) → **2. P dalgası saptanır** (yer ve büyüklük bu dalgadan hesaplanır) → **3. Sinyal iletilir** (kurum ve tesislere otomatik; elektrik sinyali S dalgasından çok daha hızlı) → **4. Önlem alınır** (S dalgası gelmeden kritik sistemler devre dışı bırakılır).\n💡 Haber, yıkımı geçebilir: elektrik sinyali ışık hızına yakın, S dalgası 3–4 km/sn."}, {"q": "Deprem erken uyarı sisteminin ilk örneği ve bilimsel olarak en bilinen örneği hangi seçenekte doğru verilmiştir?", "opts": [{"t": "İlk: 1906 San Francisco alarm sistemi; en bilinen: UrEDAS"}, {"t": "İlk: Japon Demiryolları (1960'lar); en bilinen: UrEDAS"}, {"t": "İlk: Meksika'nın 1985 sistemi; en bilinen: Japon Demiryolları"}, {"t": "İlk: UrEDAS; en bilinen: İstanbul Deprem Erken Uyarı Sistemi"}, {"t": "İlk: AFAD'ın 2017 ağı; en bilinen: JMA"}], "a": 1, "exp": "İlk örnek: **Japon Demiryolları**'nın (Japan Railway) **1960'lı yıllarda** hızlı trenleri yavaşlatmak için işletime aldığı **mekanik alarmlı sismograf** sistemi. Bilimsel olarak en bilinen örnek yine Japonya'daki **UrEDAS** (Urgent Earthquake Detection and Alarm System)."}, {"q": "Ders notlarına göre deprem erken uyarı sistemi kurmuş ülkelerde kazanılan saniyeyi belirleyen temel coğrafi etken nedir? (Örn. Mexico City fayın ~300 km, Bükreş ~150 km, Taipei ~120 km uzağındadır.)", "opts": [{"t": "Şehirdeki bina sayısı"}, {"t": "Şehrin denizden yüksekliği"}, {"t": "Şehrin faya olan uzaklığı"}, {"t": "Şehrin kullandığı şiddet cetveli"}, {"t": "Şehrin nüfusu"}], "a": 2, "exp": "**Uzaklık, kazanılan saniyeyi belirler.** Mexico City ~300 km, Bükreş ~150 km, Taipei ~120 km uzaktadır. Sistem kurmuş ülkeler: Japonya, Meksika, Romanya, Tayvan, İsviçre, İtalya, Türkiye ve ABD. Türkiye'de ise şehirler fayların üzerindedir — dezavantaj."}, {"q": "Kandilli Rasathanesi ve Deprem Araştırma Enstitüsü'nün İstanbul için geliştirdiği proje ve kitabın Türkiye için önceliği ile ilgili hangisi doğrudur?", "opts": [{"t": "JMA; öncelik radon ölçümüdür"}, {"t": "UrEDAS; öncelik depremin tarihini ve saatini önceden belirlemektir"}, {"t": "Türkiye Deprem Tehlike Haritası; öncelik şiddeti aletle ölçmektir"}, {"t": "İstanbul Deprem Tahmin Sistemi; öncelik depremin büyüklüğünü ve yerini saptamaktır"}, {"t": "İstanbul Deprem Erken Uyarı ve Acil Müdahale Sistemi; öncelik test edilmiş hızlı uyarı"}], "a": 4, "exp": "KRDAE'nin projesi **İstanbul Deprem Erken Uyarı ve Acil Müdahale Sistemi**dir. Kitaba göre Türkiye için öncelik, depremin büyüklüğünü ve yerini saptamak değil; **zararı azaltmaya fayda sağlayacak, algoritması denenmiş ve test edilmiş hızlı bir uyarı sistemi** kurmaktır. Sistem bir şehre değil **bölgeye** göre düşünülmelidir."}, {"q": "Kitaba göre Türkiye'de bazı araştırmacıların bile \"deprem tahmini\" yerine \"deprem erken uyarısı\" terimini kullanması neden eleştirilir?", "opts": [{"t": "Erken uyarı sistemlerinin hiç işe yaramadığı kanıtlandığı için"}, {"t": "Erken uyarı terimi yalnızca Japonya'da kullanıldığı için"}, {"t": "Tahmin teriminin yasal olarak yasaklanmış olması nedeniyle"}, {"t": "Karar vericilerde ve halkta yanlış algı yaratır"}, {"t": "İki terim eş anlamlı olduğu için gereksiz tekrar yaratır"}], "a": 3, "exp": "Kitap (s. 38), bu terim karışıklığının deprem biliminde **önemli bir yanlış** olduğunu ve **karar vericilerde ve halkta yanlış algı** yarattığını açıkça yazar. Erken uyarı **olmuş** bir depremi ölçer ve haber verir; tahmin **henüz olmamış** depremi öngörmeye çalışır."}, {"q": "Deprem erken uyarı sisteminin sağlanan uyarı süresi ile ilgili hangisi doğrudur?", "opts": [{"t": "Dış merkezde en uzundur"}, {"t": "Uzaklıktan bağımsız olarak sabit 30 saniyedir"}, {"t": "Her zaman en az 10 dakikadır"}, {"t": "Uzaklığa göre birkaç saniye ile 1 dakika arası"}, {"t": "Birkaç saat ile bir gün arasında değişir"}], "a": 3, "exp": "Uyarı süresi **uzaklığa bağlıdır**: **birkaç saniye ile bir dakikaya kadar** değişir; dış merkeze çok yakın yerleşimlerde **sıfıra yaklaşır**. 10 saniye insan refleksi için kısa, otomatik sistemler için uzundur."}, {"q": "Bir hastanede deprem erken uyarı sinyali alındığında ders notlarında sayılan sağlık karşılıkları arasında aşağıdakilerden hangisi YOKTUR?", "opts": [{"t": "Hastane asansörlerinin boşaltılması (kat hizasında durup kapıların açılması)"}, {"t": "Tıbbi gaz hatlarının kapatılması"}, {"t": "Ameliyatın durdurulması"}, {"t": "Yoğun bakım jeneratörünün devreye hazırlanması"}, {"t": "Hastanenin tüm hastalarla birlikte tahliyesinin tamamlanması"}], "a": 4, "exp": "Erken uyarı yalnızca **saniyeler** kazandırır; bu sürede tam tahliye mümkün değildir. Sağlık karşılıkları: **ameliyatın durdurulması**, **tıbbi gaz hatlarının kapatılması**, **asansörlerin boşaltılması**, **yoğun bakım jeneratörünün hazırlanması**. Genel kullanımlar: yüksek gerilim hatlarının kesilmesi, kimyasal tesis/rafinerilerin durdurulması, metro ve hızlı trenlerin yavaşlatılması."}, {"q": "\"Kitap 2018'de kaldı\" slaytında belirtilen güncellemelerle ilgili hangisi doğrudur?", "opts": [{"t": "AFAD'ın gözlem ağı 2017'de yaklaşık 100 istasyondu"}, {"t": "Kitap 6 Şubat 2023 Pazarcık (Mw 7,7) ve Elbistan (Mw 7,6) depremlerini içermez"}, {"t": "Kitap telefon işletim sistemleri üzerinden doğrudan erken uyarı bildirimlerini ayrıntılı anlatır"}, {"t": "Kitap L'Aquila davasında üst mahkemenin beraat kararını içerir"}, {"t": "Kitap büyük depremler için Mw'yi öne çıkarır, Richter'i hiç anmaz"}], "a": 1, "exp": "Güncellemeler: kitap **Richter**'i öne çıkarır (bugün standart **Mw**); AFAD ağı **2017'de ~1.000 istasyon**du ve genişledi; kitap **6 Şubat 2023** depremlerini (**Pazarcık Mw 7,7**, **Elbistan Mw 7,6**) içermez; L'Aquila'da kitap **2012 mahkûmiyetiyle** biter; kitapta yalnızca bilgilendirme uygulamaları vardır, bugün telefonlardan doğrudan uyarı gönderilir. Sınavda kitaptaki bilgiler esastır."}, {"q": "Canlı deprem listesi okuma etkinliğinde listedeki en büyük deprem 4,1 büyüklüğünde olmasına rağmen kimsenin duymamış olmasının ders notlarında beklenen açıklaması hangisidir?", "opts": [{"t": "AFAD'ın listeyi hatalı yayımlaması"}, {"t": "Depremin erken uyarı sistemi sayesinde önlenmiş olması"}, {"t": "4,1 değerinin büyüklük değil şiddet değeri olması"}, {"t": "Seyrek nüfuslu, yerleşimden uzak ya da derin olması"}, {"t": "4,1 büyüklüğündeki depremlerin hiçbir zaman hissedilmemesi"}], "a": 3, "exp": "Beklenen cevap zinciri: deprem 4,1 büyüklüğündeydi ama (a) **seyrek nüfuslu** bölgedeydi, (b) **yerleşimden uzaktaydı**, ya da (c) **derindi** — yani afet olmadı. **Doğa olayı afet değildir; afet, o olayın toplumla karşılaşmasının sonucudur.** Listede her satırda **büyüklük, derinlik ve yer** bilgisi vardır (deprem.afad.gov.tr)."}, {"q": "Haftanın toparlama slaytındaki ana fikirlerle ilgili aşağıdakilerden hangisi YANLIŞTIR?", "opts": [{"t": "Magnitüd tektir, şiddet yere göre değişir"}, {"t": "P haber verir, S yıkar"}, {"t": "Olasılığa dayalı deprem tahmininin yapı yönetmelikleriyle bir ilgisi yoktur"}, {"t": "Sığ deprem dar alanda daha çok hasar yapar"}, {"t": "Erken uyarı deprem olduktan sonra devreye girer ve saniyeler kazandırır"}], "a": 2, "exp": "Toparlama: 1) Deprem kırılmanın sonucudur; 2) **P haber verir, S yıkar**; 3) **Sığ deprem daha çok hasar yapar**; 4) **Magnitüd tektir, şiddet yere göre değişir**; 5) Deprem tahmini (kesin) mümkün değil; **olasılığa dayalı tahmin ise yapı yönetmeliklerinin temelidir**; 6) **Erken uyarı ≠ tahmin**."}]}, {"title": "Deprem II: Faylar, Türkiye'nin Depremselliği, İkincil Afetler ve Sağlık Sonuçları", "desc": "Fay türleri ve şekilleri, aktif fay ve paleosismoloji, Türkiye'nin fay kuşakları, büyük depremler ve 6 Şubat 2023, tehlike haritası, ikincil afetler, crush sendromu ve korunma", "short": "Faylar & Türkiye", "questions": [{"q": "Aşağıdakilerden hangisi fay kavramını en doğru tanımlar?", "opts": [{"t": "Sarsıntı sırasında suya doygun kumlu zeminin taşıma gücünü kaybettiği alan"}, {"t": "İki levhanın birbirinin altına daldığı ve magmanın yükseldiği okyanus altı hendek"}, {"t": "Kayaçların yatay sıkışma ile kıvrılarak oluşturduğu kemer biçimli yapı"}, {"t": "Yerkabuğundaki bir kırılma düzlemi boyunca iki bloğun birbirine göre yer değiştirdiği yapı"}, {"t": "Deprem dalgalarının yeryüzüne ilk ulaştığı noktanın haritadaki izdüşümü"}], "a": 3, "exp": "**Fay**, yerkabuğundaki bir kırılma düzlemi boyunca iki bloğun birbirine göre yer değiştirdiği yapıdır; **deprem**, bu düzlem üzerindeki ani hareketle oluşur. Diğer seçenekler başka kavramların tanımıdır: suya doygun zeminin taşıma gücünü kaybetmesi **sıvılaşma**, levhanın dalması **yitim zonu**, kemer biçimli yapı **kıvrım**, haritadaki izdüşüm ise **dış merkez**dir."}, {"q": "Eğimli bir fay düzleminde blokların adlandırılmasıyla ilgili hangisi doğrudur?", "opts": [{"t": "Yukarı hareket eden blok her zaman tavan blok olarak adlandırılır"}, {"t": "Düzlemin üstünde kalan blok tavan, altında kalan blok taban bloktur"}, {"t": "Denize yakın olan blok tavan, karaya yakın olan blok taban bloktur"}, {"t": "Düzlemin altında kalan blok tavan, üstünde kalan blok taban bloktur"}, {"t": "Aşağı kayan blok, fay türünden bağımsız olarak taban blok adını alır"}], "a": 1, "exp": "Fay düzleminin **üstünde** kalan blok **tavan bloğu** (hanging wall), **altında** kalan blok **taban bloğu**dur (footwall). Adlandırma hareket yönüne göre değil, bloğun fay düzlemine göre konumuna göre yapılır: normal fayda tavan blok iner, ters fayda yukarı çıkar.\n💡 Madencilik kökenli: eğimli galeride madencinin başının üstündeki blok tavan, ayağını bastığı blok tabandır."}, {"q": "Bir ilçenin diri fay haritasında hiçbir fay çizgisi görünmemektedir. Bu durumla ilgili en doğru yorum hangisidir?", "opts": [{"t": "Yüzeyde iz bırakmayan gömülü faylar olabileceğinden fay yokluğu kesinleşmez"}, {"t": "Bölgede yalnızca normal faylar bulunabileceği anlaşılır"}, {"t": "Faylar yalnızca levha sınırlarında bulunduğundan ilçe güvendedir"}, {"t": "Bu durum ilçenin aktif değil, ölü bir fay üzerinde olduğunu gösterir"}, {"t": "Haritada fay yoksa bölgede deprem tehlikesi de yok demektir"}], "a": 0, "exp": "Haritada fay çizgisinin görünmemesi, orada fay olmadığını kanıtlamaz: yüzeye ulaşmayan **gömülü faylar** yüzeyde iz bırakmaz ama derinde deprem üretebilir. Ayrıca fayın tam üzerinde olmasanız da sarsıntı size ulaşır.\n💡 Haritada çizgi yok ≠ fay yok."}, {"q": "Gerilmeli (çekme) bölgelerde oluşan, tavan bloğun taban bloğa göre aşağı kaydığı ve yerkabuğunun incelmesiyle gelişen fay türü hangisidir?", "opts": [{"t": "Ters fay"}, {"t": "Bindirme"}, {"t": "Sağ yönlü doğrultu atımlı fay"}, {"t": "Sol yönlü doğrultu atımlı fay"}, {"t": "Normal fay"}], "a": 4, "exp": "**Normal fay** çekme rejiminde oluşur; **tavan blok aşağı kayar**, yerkabuğu çekilip incelir. Ege Çöküntü Fay Sistemi bu türdendir. Ters fay ve bindirmede tavan blok yukarı çıkar (sıkışma); doğrultu atımlı faylarda hareket yataydır."}, {"q": "Ters fayla ilgili aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Ege'deki graben ovalarını sınırlayan fay türüdür"}, {"t": "Bloklar fay düzlemi boyunca yalnızca yatay kayar"}, {"t": "Sıkışmalı bölgelerde oluşur ve yerkabuğu kalınlaşır"}, {"t": "Çekme rejiminde oluşur ve yerkabuğu incelir"}, {"t": "Tavan blok, taban bloğa göre aşağı iner"}], "a": 2, "exp": "**Ters fayda** tavan blok taban bloğa göre **yukarı çıkar**; sıkışmalı bölgelerde, yerkabuğu **sıkışıp kalınlaşırken** oluşur. Çekme, incelme, tavan bloğun inmesi ve graben sınırlaması **normal faya** aittir; yalnızca yatay kayma ise doğrultu atımlı fayın özelliğidir."}, {"q": "Fay düzleminin yataya yakın olduğu, yükselen tavan bloğun taban blok üzerinde uzun mesafe ilerlediği, tabakaların kıvrıldığı ve dağ kuşaklarını oluşturan fay türü ve Türkiye'deki örneği hangisidir?", "opts": [{"t": "Oblik fay – Karlıova Üçlü Eklemi"}, {"t": "Ters fay – Doğu Anadolu Fayı"}, {"t": "Bindirme – Bitlis Bindirmesi"}, {"t": "Normal fay – Ege Çöküntü Fay Sistemi"}, {"t": "Doğrultu atımlı fay – Kuzey Anadolu Fayı"}], "a": 2, "exp": "**Bindirme**, ters fayın **düşük açılı** özel hâlidir: fay düzlemi yataya yakın olduğu için tavan blok taban bloğun üzerinde uzun mesafe yol alır; tabakalar kıvrılır, **dağ kuşakları** böyle oluşur. Türkiye örneği **Bitlis Bindirmesi**dir. KAF ve DAF doğrultu atımlı, Ege sistemi normal faylıdır."}, {"q": "Hem düşey (eğim) hem de yanal (doğrultu) atım bileşenine birlikte sahip olan faylara ne ad verilir?", "opts": [{"t": "Yanal atımlı oblik fay"}, {"t": "Kuvaterner fayı"}, {"t": "Bindirme fayı"}, {"t": "Gömülü fay"}, {"t": "Horst fayı"}], "a": 0, "exp": "Her iki atım türüne birden sahip faylara **yanal atımlı oblik fay** denir. Kaynağa göre doğal koşullarda **saf hareket nadirdir**; çoğu fay bir miktar karma hareket gösterir. Gömülü fay yüzeye çıkmayan fay, Kuvaterner fayı ise MTA'nın yaş sınıfıdır."}, {"q": "Ege'deki normal faylarda depremlerin daha sık ve daha küçük, Kuzey ve Doğu Anadolu'daki doğrultu atımlı faylarda daha seyrek ve daha büyük olmasının temel nedeni nedir?", "opts": [{"t": "Ege'deki faylar Holosen öncesine ait olduğu için aktif değildir"}, {"t": "Doğrultu atımlı faylar okyanus altı yitim zonu üzerinde yer alır"}, {"t": "Ege'de yerkabuğu sıkıştığı için enerji küçük parçalar hâlinde boşalır"}, {"t": "Normal faylar yalnızca gömülü fay olarak bulunduğu için küçük deprem üretir"}, {"t": "Doğrultu atımlı faylar yüzlerce km kesintisiz kırılabilir; Ege fayları kısa parçalıdır"}], "a": 4, "exp": "Fark **fay geometrisinden** kaynaklanır: doğrultu atımlı faylar **çok uzun (yüzlerce km) kesintisiz** kırılabilir ve büyük magnitüd üretir; Ege'deki normal faylar **kısa parçalar** hâlindedir. Bu yüzden Ege'de sık ama orta büyüklükte, KAF ve DAF'ta seyrek ama çok büyük deprem beklenir ve iki bölgenin hazırlık stratejisi farklıdır. Ege'de sıkışma değil çekme vardır."}, {"q": "Fay şekillerinde kesikli kırmızı çizgi fay düzlemini göstermektedir. Şekilde sağdaki (tavan) blok aşağı kaymış, yüzeyde bir basamak (fay dikliği) oluşmuş ve tabakalar iki blokta aynı hizada değildir. Bu şekil hangi fay türünü gösterir?", "opts": [{"t": "Yanal atımlı oblik fay"}, {"t": "Doğrultu atımlı fay"}, {"t": "Bindirme"}, {"t": "Normal fay"}, {"t": "Ters fay"}], "a": 3, "exp": "Şekilde **tavan blok aşağı inmiş** ve yüzeyde **fay dikliği** oluşmuştur: bu **normal fay**dır (çekme). Tabakalardaki kayma miktarı **atım**dır. Ters fay ve bindirmede tavan blok yukarı çıkar; doğrultu atımlı fay ise üstten bakışla, ötelenmiş yol üzerinden okunur.\n💡 Ege'deki çöküntü ovaları bu hareketin ürünüdür."}, {"q": "Bir fayda tavan bloğun taban bloğa göre yukarı çıktığı gözlenmiştir. Bölgedeki gerilme rejimi hakkında hangisi söylenebilir?", "opts": [{"t": "Bölge horst–graben sistemiyle açılmaktadır"}, {"t": "Bölgede sıkışma vardır"}, {"t": "Bölgede gerilme yoktur, hareket yerçekimi kaynaklıdır"}, {"t": "Bölgede çekme vardır"}, {"t": "Bölgede yalnızca yanal kayma vardır"}], "a": 1, "exp": "Tavan bloğun yukarı çıkması **ters fay** (veya bindirme) demektir ve bu, **sıkışma** rejiminin ürünüdür. Çekme rejiminde tavan blok aşağı kayar (normal fay); horst–graben sistemi de çekmeyle gelişir.\n💡 Kodlama: **Normal = Nefes alır (açılır, iner)**, **Ters = Tıkışır (sıkışır, çıkar)**."}, {"q": "Fay şekillerinden biri üstten bakışla okunmaktadır: fayı dik kesen bir yol, fay hattında ötelenmiştir ve bloklar yatay olarak birbirine göre kaymıştır. Bu şekil hangi fay türünü gösterir?", "opts": [{"t": "Bindirme"}, {"t": "Doğrultu atımlı fay"}, {"t": "Ters fay"}, {"t": "Gömülü fay"}, {"t": "Normal fay"}], "a": 1, "exp": "Bloklar **yatay kayıyor** ve fayı kesen **yol ötelenmişse** fay **doğrultu atımlı**dır (yanal kayma). Kuzey Anadolu Fayı bu türdendir. Diğer üç şekilde (normal, ters, bindirme) hareket düşey düzlemdedir ve kesit görünümünde tavan–taban blok üzerinden okunur."}, {"q": "Doğrultu atımlı bir fayın bir tarafında duran gözlemci karşı bloğa baktığında, fayın kestiği yolun devamını SAĞ tarafa kaymış olarak görmektedir. Bu fay ile aynı yönlü hareket eden faylar hangi seçenekte birlikte verilmiştir?", "opts": [{"t": "Kuzey Anadolu Fayı ve San Andreas Fayı"}, {"t": "Doğu Anadolu Fayı ve San Andreas Fayı"}, {"t": "Ege Çöküntü Fay Sistemi ve Bitlis Bindirmesi"}, {"t": "Doğu Anadolu Fayı ve Bitlis Bindirmesi"}, {"t": "Kuzey Anadolu Fayı ve Doğu Anadolu Fayı"}], "a": 0, "exp": "Karşı bloktaki nesne **sağa** kaymışsa fay **sağ yönlü** doğrultu atımlıdır. **KAF ve San Andreas** sağ yönlüdür. **DAF sol yönlüdür**; Bitlis bindirme, Ege sistemi normal faylıdır.\n💡 Hangi taraftan bakarsanız bakın cevap aynı çıkar — yöntemin işe yaradığının kontrolü budur."}, {"q": "6 Şubat 2023 Pazarcık depreminin üzerinde gerçekleştiği fay ve bu fayın hareket yönü hangisidir?", "opts": [{"t": "Doğu Anadolu Fayı – sağ yönlü doğrultu atımlı"}, {"t": "Kuzey Anadolu Fayı – sağ yönlü doğrultu atımlı"}, {"t": "Bitlis Bindirmesi – düşük açılı ters fay"}, {"t": "Ege Çöküntü Sistemi – normal fay"}, {"t": "Doğu Anadolu Fayı – sol yönlü doğrultu atımlı"}], "a": 4, "exp": "Pazarcık depremi **Doğu Anadolu Fay Zonu** üzerinde oldu; DAF **sol yönlü doğrultu atımlı**dır. KAF ise sağ yönlüdür.\n💡 Batıya kaçan Anadolu'yu düşün: kuzey sınırı (KAF) sağ yönlü, doğu sınırı (DAF) sol yönlü kayar."}, {"q": "Ege bölgesindeki yapılarla ilgili eşleştirmelerden hangisi doğrudur?", "opts": [{"t": "Büyük ve Küçük Menderes ovaları – horst"}, {"t": "Graben – iki yanı ters faylarla sınırlanmış yükselmiş alan"}, {"t": "Büyük ve Küçük Menderes ovaları – graben tabanı"}, {"t": "Ovaları ayıran dağ sıraları – graben"}, {"t": "Horst – iki yanı normal faylarla sınırlanmış çöküntü alanı"}], "a": 2, "exp": "**Graben**: her iki yanı **normal faylarla** sınırlanmış, **aşağı düşmüş** çöküntü alanı (Büyük ve Küçük Menderes ovaları). **Horst**: her iki yanı normal faylarla sınırlanmış **yükselmiş** alan (graben ovalarını ayıran dağ sıraları). Ege'nin doğu–batı uzanan ovaları (İzmir, Manisa, Aydın, Denizli), aralarındaki horst dağları ve koy–körfez–yarımada dizilimi bu mekanizmanın ürünüdür.\n💡 **G**raben = **G**ömük; **H**orst = **H**avada."}, {"q": "Kaynakta Türkiye için vurgulanan 'nüfus–zemin paradoksu' graben ovaları üzerinden nasıl açıklanır?", "opts": [{"t": "Horst dağları yoğun nüfusludur ve bindirme fayları nedeniyle en riskli yerlerdir"}, {"t": "Ovalarda nüfus azdır ancak sanayi tesisleri NaTech riskini büyütür"}, {"t": "Graben ovaları sert kaya üzerinde olduğu için nüfus buralardan kaçmaktadır"}, {"t": "Verimli ve düz graben ovaları yoğun nüfusludur, alüvyal zeminleri ise sarsıntıyı büyütür"}, {"t": "Graben ovalarında fay bulunmadığı için deprem riski taşımazlar"}], "a": 3, "exp": "Graben ovaları **verimli topraklar ve düz zemin** nedeniyle yoğun nüfusludur; aynı zamanda **alüvyal zemin** sarsıntıyı büyütür. Yani Türkiye'de nüfusun toplandığı yerler çoğu zaman zeminin en kötü olduğu yerlerdir.\n💡 Paradoks tek cümlede: en verimli ova = en kötü zemin."}, {"q": "Aktif (diri) fay için çoğu ülkede kullanılan zaman ölçütü ve bu dönemin adı hangisidir?", "opts": [{"t": "1900'den bugüne – Aletsel dönem"}, {"t": "Son 11.000 yıl – Holosen"}, {"t": "Son 40.000 yıl – Paleosismolojik dönem"}, {"t": "Son 500.000 yıl – Holosen"}, {"t": "Son 1.600.000 yıl – Kuvaterner"}], "a": 1, "exp": "**Aktif (diri) fay**, son on bin yıl içinde deprem üretmiş ve/veya yüzey faylanmasına neden olmuş, gelecekte de deprem üretme potansiyeli olan faydır; çoğu ülkede ölçüt **son 11.000 yıl (Holosen)**dur. Holosen, son buzul çağının bitişinden (yaklaşık **11.700 yıl** önce) bugüne süren dönemdir. 1.600.000 yıl Kuvaterner, 40.000 yıl paleosismolojinin incelediği dönem, 500.000 yıl kritik yapılar için uzatılmış süredir.\n💡 Ölçüt insan hafızasına değil jeolojik kayda dayanır: tekrarlanma aralığı yüzlerce–binlerce yıl olabilir; 500 yıldır sessiz bir fay \"ölü\" değildir."}, {"q": "Nükleer santral gibi kritik yapıların sismik tehlikesi araştırılırken aktif fay için zaman ölçütü kaç yıla kadar uzatılabilir ve bunun gerekçesi nedir?", "opts": [{"t": "1.600.000 yıl; Kuvaterner dönemi tüm fayları kapsar"}, {"t": "11.000 yıl; kritik yapılar için ölçüt değişmez"}, {"t": "500.000 yıl; nükleer santraller yalnızca bindirme faylarına yakın kurulur"}, {"t": "500.000 yıl; sonucun ağırlığı arttıkça kabul edilebilir belirsizlik azalır"}, {"t": "40.000 yıl; paleosismoloji ancak bu kadar geriye gidebilir"}], "a": 3, "exp": "Kritik yapılar için süre **500.000 yıla** kadar uzatılabilir. Gerekçe **risk = tehlike × sonucun ağırlığı** ilişkisidir: aynı fay bir konut için \"aktif değil\", bir nükleer santral için \"aktif\" sayılabilir, çünkü sonucun ağırlığı arttıkça kabul edilebilir belirsizlik azalır."}, {"q": "Türkiye'de diri faylar üzerinde yüzey faylanması oluşturan depremler için kaynakta verilen genel özellik hangisidir?", "opts": [{"t": "Büyüklük genellikle 6,0'ın üzerinde, derinlik genellikle 100 km'den fazla"}, {"t": "Büyüklük genellikle 4,0–5,0 arası, derinlik genellikle 20–40 km"}, {"t": "Büyüklük genellikle 6,0'ın üzerinde, derinlik genellikle 20 km'den az"}, {"t": "Büyüklük genellikle 5,0'ın altında, derinlik 70 km'den fazla"}, {"t": "Büyüklük genellikle 8,0'ın üzerinde, derinlik genellikle 5 km'den az"}], "a": 2, "exp": "Türkiye'de yüzey kırığı (yüzey faylanması) oluşturan depremler genellikle **M 6,0'ın üzerinde** ve **20 km'den sığ**dır.\n💡 Pratik eşik: büyüklük 6'dan büyük, derinlik 20 km'den küçük."}, {"q": "Aşağıdakilerden hangisi bir fayın aktif olduğunu gösteren morfolojik izler arasında yer almaz?", "opts": [{"t": "İç merkezlerin bir hat boyunca dizilimi"}, {"t": "Basınç sırtları ve uzamış sırtlar"}, {"t": "Ani diklikler"}, {"t": "Çizgisel ve asılı vadiler"}, {"t": "Çöküntü gölcükleri"}], "a": 0, "exp": "**Morfolojik izler**: çizgisel vadiler, asılı vadiler, ani diklikler, basınç sırtları, uzamış sırtlar, çöküntü gölcükleri. **İç merkezlerin dizilimi** ise odak parametreleri ve yüzey yırtılmalarıyla birlikte **sismolojik veriler** grubundadır."}, {"q": "Uydu ve yer ölçümleriyle saptanan güncel hareket ile tarihsel yapılardaki faylanma izleri ve ötelenmiş yapay nesneler, aktif fay belirteçlerinden hangi gruba girer?", "opts": [{"t": "Paleosismolojik hendek verileri"}, {"t": "Sismolojik veriler"}, {"t": "Morfolojik izler"}, {"t": "Ötelenmiş genç çökeller"}, {"t": "Jeodezik ve arkeolojik veriler"}], "a": 4, "exp": "Aktif fayın dört belirteç grubu: (1) **morfolojik izler**, (2) **ötelenmiş genç çökeller** (akarsu yatakları, taraçalar, alüvyal yelpazelerin kayması, çökel kalınlığında ani fark), (3) **sismolojik veriler** (iç merkez dizilimi, odak parametreleri, yüzey yırtılmaları), (4) **jeodezik ve arkeolojik veriler** (uydu/yer ölçümleri, tarihsel yapılardaki faylanma izleri, ötelenmiş yapay nesneler)."}, {"q": "MTA'nın diri fay sınıflamasıyla ilgili aşağıdaki eşleştirmelerden hangileri doğrudur?\nI. Deprem yüzey kırığı – 1900'den bugüne yüzey kırılması üretmiş fay\nII. Holosen fayı – son 11.000 yıl\nIII. Kuvaterner fayı – son 40.000 yıl", "opts": [{"t": "Yalnız I"}, {"t": "Yalnız III"}, {"t": "I ve II"}, {"t": "II ve III"}, {"t": "I, II ve III"}], "a": 2, "exp": "MTA sınıflaması dört alt gruptur: (1) **deprem yüzey kırığı** – 1900'den bugüne yüzey kırılması üretmiş fay, (2) **Holosen fayı** – son 11.000 yıl, (3) **Kuvaterner fayı** – son **1.600.000** yıl, (4) Kuvaterner öncesi fay veya çizgisellik. III yanlıştır; 40.000 yıl paleosismolojinin incelediği yakın jeolojik dönemdir. Türkiye'nin diri fay haritasını **MTA (Maden Tetkik ve Arama Genel Müdürlüğü)** hazırlamıştır."}, {"q": "1999 Marmara depreminde Gölcük ve Sapanca çevresinde gözlenen ötelenmiş yollar, duvarlar ve çitler için hangisi doğrudur?", "opts": [{"t": "Tsunami dalgalarının kıyıda bıraktığı izlerdir"}, {"t": "Faylanmanın dolaylı kanıtıdır; atım 40–50 cm ile sınırlı kalmıştır"}, {"t": "Gömülü fay hareketinin yüzeyde iz bırakmadığını gösterir"}, {"t": "Faylanmanın doğrudan kanıtıdır; bazı yerlerde atım 4–5 metreyi bulmuştur"}, {"t": "Sıvılaşmanın kanıtıdır; zemin 4–5 metre çökmüştür"}], "a": 3, "exp": "Fay geçmişini araziye yazar: dereyi kaydırmışsa, yolu ötelemişse orada hareket vardır. 1999'da Gölcük ve Sapanca çevresinde yollar, duvarlar ve çitler net biçimde ötelendi; bazı yerlerde **atım 4–5 metreyi** buldu. Bu izler **faylanmanın doğrudan kanıtıdır**."}, {"q": "Paleosismoloji ile ilgili aşağıdakilerden hangisi yanlıştır?", "opts": [{"t": "Bir fayda bir sonraki depremin tarihini kesin olarak belirler"}, {"t": "Jeoloji mühendislerince yürütülür"}, {"t": "Yaklaşık son 40.000 yıldaki aktif fayların deprem geçmişini ortaya çıkarır"}, {"t": "Fay üzerinde hendek açılarak kesilmiş toprak katmanları tarihlendirilir"}, {"t": "Diri fay araştırmalarında yapılması zorunlu çalışmalardandır"}], "a": 0, "exp": "**Paleosismoloji** fay üzerinde **hendek** açıp kesilmiş katmanları tarihlendirerek (ör. Karbon-14) yaklaşık **40.000 yıllık** deprem geçmişini okur; **jeoloji mühendislerince** yapılır ve tehlike hesabı için **zorunludur**. Ancak **takvim vermez**: depremin tarihini söyleyemez, fayın karakterini verir.\n💡 \"Bu bilgi bir takvim vermez; bir yönetmelik verir.\""}, {"q": "Paleosismolojik çalışmalardan elde edilen parametreler arasında aşağıdakilerden hangisi yer almaz?", "opts": [{"t": "Yer değiştirme miktarı"}, {"t": "Depremde enkaz altında kalacak kişi sayısı"}, {"t": "Maksimum kırılma uzunluğu"}, {"t": "Deprem tekrarlanma periyodu"}, {"t": "Fayın üretebileceği en büyük deprem büyüklüğü"}], "a": 1, "exp": "Paleosismoloji **en büyük deprem büyüklüğü, tekrarlanma periyodu, maksimum kırılma uzunluğu ve yer değiştirme miktarı** gibi parametreleri verir. Bu parametreler olmadan deprem tehlike değerlendirmesinde olasılık hesabı yapılamaz. Kayıp tahmini jeolojik değil, maruziyet ve kırılganlığa bağlı bir hesaptır."}, {"q": "Bir öğrenci 'Fayın tekrarlanma periyodu 250 yıl, son deprem 240 yıl önce oldu; demek ki 10 yılımız var' demektedir. Bu yorumdaki hata nedir?", "opts": [{"t": "Hesap doğrudur; yalnızca birim olarak yıl yerine on yıl kullanılmalıdır"}, {"t": "Tekrarlanma periyodu en kısa aralığı gösterir; deprem 250 yıldan önce olamaz"}, {"t": "Tekrarlanma periyodu aletsel kayıtlardan hesaplandığı için 100 yılı geçemez"}, {"t": "Tekrarlanma periyodu yalnızca normal faylar için hesaplanabilir"}, {"t": "Tekrarlanma periyodu istatistiksel bir ortalamadır; depremler düzenli aralıklarla gelmez"}], "a": 4, "exp": "**Deprem tekrarlanma periyodu**, bir fayın belirli büyüklükte bir depremi **ortalama** kaç yılda bir ürettiğidir; **kesin bir takvim değil, istatistiksel bir ortalamadır**. Depremler düzenli aralıklarla gelmez; bu yüzden geri sayım yapılamaz.\n💡 Ortalama, randevu değildir — fay için geri sayım yapılmaz."}, {"q": "Kaynakta paleosismolojik hendek çalışmasına örnek olarak verilen hendek hangi depremin yüzey kırığı üzerinde açılmıştır?", "opts": [{"t": "2011 Van depremi"}, {"t": "1976 Çaldıran depremi"}, {"t": "1999 Gölcük depremi"}, {"t": "1970 Gediz depremi"}, {"t": "1939 Erzincan depremi"}], "a": 4, "exp": "Kitaptaki örnek, **1939 Erzincan** depreminin yüzey kırığı üzerinde açılmış bir hendektir (Emre vd., 2012). Aletsel kayıt yalnızca 1900'lerden beri olduğu için daha eski depremler bu yolla, toprak katmanlarından okunur."}, {"q": "'Evimin altından fay geçmiyor, güvendeyim' düşüncesine kaynakta verilen cevapla ilgili hangisi doğrudur?", "opts": [{"t": "Fay hattından uzakta sarsıntı hissedilmediği için düşünce doğrudur"}, {"t": "Şiddeti belirleyen dört etkenin tamamı doğa kaynaklıdır ve değiştirilemez"}, {"t": "Yalnızca gömülü fayların bulunduğu illerde düşünce yanlıştır"}, {"t": "Sarsıntı yayılır; şiddeti belirleyen etkenlerden zemin ve bina insan elindedir"}, {"t": "Asıl belirleyici fayın konumudur; bina kalitesi ikincil önemdedir"}], "a": 3, "exp": "Cevap **hayır**dır: (1) **sarsıntı yayılır** (1999 Marmara depremi İstanbul, Bolu ve Ankara'da hissedildi), (2) **gömülü faylar** vardır, (3) **zemin** sarsıntıyı büyütür, (4) **asıl belirleyici binadır**. Şiddeti belirleyen dört etkenden ikisi (**zemin ve bina**) insan elindedir. Doğru soru: \"Binam hangi yönetmeliğe göre, hangi zemin üzerine yapıldı?\"\n💡 Hafta 1'in cümlesi: afeti doğa olayı değil, hazırlıksızlık üretir."}, {"q": "1985 Meksika depremi, kaynakta hangi kavramın en çarpıcı örneği olarak verilmiştir?", "opts": [{"t": "NaTech"}, {"t": "Zemin büyütmesi"}, {"t": "Tetiklenmiş deprem"}, {"t": "Gömülü fay"}, {"t": "Kurtarma ölümü"}], "a": 1, "exp": "1985 Meksika depreminde dış merkez **350 km** uzaktaydı; ancak Mexico City'nin **eski göl yatağı** üzerindeki bölgelerinde sarsıntı **beş katına kadar büyüdü** ve binlerce kişi öldü. Sert kaya üzerindeki mahalleler neredeyse hasarsız kaldı: **zemin büyütmesi**. Türkiye örneği: 1999'da Adapazarı'nın alüvyal zemini sarsıntıyı büyüttü ve sıvılaşmaya yol açtı.\n💡 Uzak deprem + yumuşak zemin = yakın felaket."}, {"q": "Türkiye'nin tektonik konumu ve deprem kuşağıyla ilişkisi hakkında hangisi doğrudur?", "opts": [{"t": "Levha içinde yer alır; topraklarının yaklaşık yarısı deprem kuşağındadır"}, {"t": "Okyanus altı yitim zonu üzerindedir; topraklarının tamamı deprem kuşağındadır"}, {"t": "Alp-Himalaya kuşağındadır; topraklarının yaklaşık %96'sı deprem kuşağı içindedir"}, {"t": "Pasifik Ateş Çemberi üzerindedir; topraklarının yaklaşık %69'u deprem kuşağındadır"}, {"t": "Alp-Himalaya kuşağındadır; topraklarının yaklaşık %72'si deprem kuşağındadır"}], "a": 2, "exp": "Türkiye, batı Akdeniz'den Himalayalara uzanan **Alp-Himalaya kıvrım ve fay kuşağı** üzerindedir; topraklarının yaklaşık **%96'sı** deprem kuşağındadır. %69 (konutların 1.–2. derece bölgedeki oranı) ve %72 (bu bölgelerde yaşayan nüfus oranı) başka verilerdir."}, {"q": "Anadolu bloğunun hareketini açıklayan 'kiraz çekirdeği' benzetmesine göre hangisi doğrudur?", "opts": [{"t": "Arap ve Avrasya levhaları arasında sıkışan Anadolu batıya kaçar; sınırları KAF ve DAF'tır"}, {"t": "Afrika levhası Anadolu'yu kuzeye iter; sınırları Ege grabenleridir"}, {"t": "Avrasya levhası güneye ilerleyerek Anadolu'yu Arap levhasının altına iter"}, {"t": "Anadolu doğuya kaçar; sınırları Bitlis Bindirmesi ve KAF'tır"}, {"t": "Anadolu yılda yaklaşık 2 metre hızla kuzeye kaçar; sınırı Karadeniz'dir"}], "a": 0, "exp": "**Arap levhası kuzeye** ilerleyerek **Avrasya**'ya çarpar (Kafkasya'da bindirme kuşağı üretir). Arada sıkışan **Anadolu bloğu**, iki parmak arasındaki ıslak kiraz çekirdeği gibi **batıya kaçar** (yılda yaklaşık **2 cm**). Bu kaçışın kuzey ve doğu sınırları **KAF ve DAF**'tır. Batıya kaçış Ege'yi çekip incelterek normal faylar ve horst–graben sistemini de açıklar."}, {"q": "Türkiye'nin ana doğrultu atımlı faylarındaki hareketle ilgili aşağıdakilerden hangileri doğrudur?\nI. KAF boyunca batı–kuzeybatı doğrultusunda sağ yönlü hareket gerçekleşir.\nII. DAF boyunca kuzeydoğu doğrultusunda sol yönlü hareket gerçekleşir.\nIII. KAFZ ve DAFZ, tek bir çizgi değil geniş deformasyon kuşaklarıdır.", "opts": [{"t": "Yalnız I"}, {"t": "Yalnız II"}, {"t": "I ve II"}, {"t": "II ve III"}, {"t": "I, II ve III"}], "a": 4, "exp": "Üç ifade de doğrudur. **KAF**: batı–kuzeybatı doğrultusunda **sağ yönlü**; **DAF**: kuzeydoğu doğrultusunda **sol yönlü** doğrultu atımlı hareket. Zon olarak anıldığında **KAFZ** ve **DAFZ** kısaltmaları kullanılır; ikisi de geniş birer **deformasyon kuşağı**dır."}, {"q": "Ders notlarında Türkiye'deki riskin ölçeğini göstermek için verilen konut ve nüfus verisi hangisidir?", "opts": [{"t": "55 milyon konutun %69'u 1. derece bölgede; nüfusun %96'sı bu bölgede yaşar"}, {"t": "21 milyon konutun %17'si 1.–2. derece bölgede; nüfusun %9'u bu bölgede yaşar"}, {"t": "16 milyon konutun %72'si 1.–2. derece bölgede; nüfusun %69'u bu bölgede yaşar"}, {"t": "21 milyon konutun %69'u 1.–2. derece bölgede; bu bölgelerde nüfusun %72'si yaşar"}, {"t": "21 milyon konutun %96'sı 1. derece bölgede; nüfusun %55'i bu bölgede yaşar"}], "a": 3, "exp": "Yaklaşık **21 milyon** konutun **%69'u (16 milyon konut)** 1. ve 2. derece deprem bölgesindedir; bu bölgelerde **55,5 milyon** insan (**nüfusun %72'si**) yaşar. %96 ise topraklarımızın deprem kuşağındaki oranıdır.\n💡 Üçlü kod: **%96 toprak** (kuşakta), **%69 konut**, **%72 nüfus** (1.–2. derecede)."}, {"q": "Kuzey Anadolu ve Doğu Anadolu fay zonlarının yaklaşık uzunlukları ve birleştikleri yer hangi seçenekte doğru verilmiştir?", "opts": [{"t": "KAF ~1200 km, DAF ~700 km; Pazarcık (Kahramanmaraş)"}, {"t": "KAF ~1200 km, DAF ~700 km; Karlıova (Bingöl)"}, {"t": "KAF ~1200 km, DAF ~700 km; Çaldıran (Van)"}, {"t": "KAF ~700 km, DAF ~1200 km; Karlıova (Bingöl)"}, {"t": "KAF ~1500 km, DAF ~300 km; Erzincan"}], "a": 1, "exp": "**KAF ~1200 km** sağ yönlü, **DAF ~700 km** sol yönlü doğrultu atımlıdır; ikisi **Karlıova'da (Bingöl)** birleşir. Bu noktaya **Karlıova Üçlü Eklemi** denir ve Türkiye'nin tektonik olarak en hareketli noktalarından biridir. ~300 km, 2023 Pazarcık depreminin kırılma uzunluğudur.\n💡 KAF uzun (1200), DAF kısa (700): \"Kuzey uzun yol, Doğu kısa yol\"."}, {"q": "Kuzey Anadolu Fay Zonu ile ilgili hangisi yanlıştır?", "opts": [{"t": "Karlıova'dan başlayıp Elazığ, Adıyaman ve Hatay üzerinden geçer"}, {"t": "San Andreas Fayı ile birlikte dünyanın en önemli iki fay zonundan biridir"}, {"t": "Marmara Denizi'ne ve oradan Ege'ye ulaşır"}, {"t": "Anadolu'yu Karadeniz kıyısına paralel kat eder"}, {"t": "Sağ yönlü doğrultu atımlı bir fay zonudur"}], "a": 0, "exp": "Elazığ, Adıyaman, Kahramanmaraş ve Hatay üzerinden geçen zon **DAF**'tır. **KAF** doğuda Karlıova'dan başlar, Karadeniz kıyısına paralel uzanır, Marmara'ya ve Ege'ye ulaşır; San Andreas ile birlikte dünyanın en önemli iki fay zonundan biridir ve ikisi de **sağ yönlüdür**."}, {"q": "Aşağıdaki illerden hangisi kaynakta Doğu Anadolu Fay Zonu'nun geçtiği yerler arasında sayılmaz?", "opts": [{"t": "Elazığ"}, {"t": "Kahramanmaraş"}, {"t": "Erzincan"}, {"t": "Hatay"}, {"t": "Adıyaman"}], "a": 2, "exp": "DAF, Karlıova'dan başlayarak **Elazığ, Adıyaman, Kahramanmaraş ve Hatay** üzerinden geçer. **Erzincan** ise **KAF** üzerindedir (1939 Erzincan depremi KAF üzerinde oldu)."}, {"q": "Türkiye'nin ana fay kuşaklarıyla özellikleri eşleştirildiğinde hangisi yanlış olur?", "opts": [{"t": "Ege Çöküntü Fay Sistemi – doğu–batı uzanımlı normal faylar, horst–graben"}, {"t": "Bitlis Bindirmesi – açılma (gerilme) tektoniğinin ürünü"}, {"t": "Doğu Anadolu Fay Zonu – tarihsel dönemde büyük yıkıcı depremler üretmiş"}, {"t": "Bitlis Bindirmesi – Anadolu ve Arap levhalarının sıkışması sonucu oluşmuş"}, {"t": "Ege Çöküntü Fay Sistemi – depremler daha sık ama genellikle daha küçük"}], "a": 1, "exp": "**Açılma (gerilme) tektoniğinin ürünü** olan sistem **Ege Çöküntü Fay Sistemi**dir. **Bitlis Bindirmesi** Doğu Anadolu'da, Anadolu ve Arap levhalarının **sıkışması** sonucu oluşmuştur ve üzerinde önemli hasar yapıcı depremler meydana gelmiştir. Türkiye'de **üç ana aktif fay sistemi** (KAF, DAF, Ege) ve **bir önemli bindirme zonu** (Bitlis) vardır."}, {"q": "Türkiye'nin ana fay kuşaklarının yapısıyla ilgili hangisi doğrudur?", "opts": [{"t": "1 m ile yüzlerce m genişlikte, atlamalı segmentlerden oluşan zonlardır"}, {"t": "Her biri tek, kesintisiz ve dar bir fay çizgisinden oluşan yapılardır"}, {"t": "Her depremde zonun tamamı uçtan uca aynı anda kırılan yapılardır"}, {"t": "Genişlikleri her yerde sabit olup yaklaşık 1 km olan düzgün kuşaklardır"}, {"t": "Yalnızca yüzeyde görülebilen fay parçalarından oluşur"}], "a": 0, "exp": "Bu kuşakların hiçbiri tek bir fay çizgisi değildir: genişlikleri **1 metreden yüzlerce metreye** değişen **deformasyon zonları**dır ve **birden fazla atlama (sıçrama) yapan fay parçalarından (segment)** oluşurlar. Her deprem segmentlerin bir kısmını kırar; 6 Şubat'ta Narlı segmentindeki kırılma zincirleme olarak diğer segmentlere yayıldı."}, {"q": "Kuzey Anadolu Fayı'nın 1939'dan itibaren batıya doğru 'domino' gibi kırılmasında depremlerin doğru kronolojik sırası hangisidir?", "opts": [{"t": "Erzincan → Gerede → Niksar-Erbaa → Abant → Tosya-Ladik → Mudurnu → Gölcük"}, {"t": "Gölcük → Mudurnu → Abant → Gerede → Tosya-Ladik → Niksar-Erbaa → Erzincan"}, {"t": "Erzincan → Niksar-Erbaa → Tosya-Ladik → Gerede → Abant → Mudurnu → Gölcük"}, {"t": "Niksar-Erbaa → Erzincan → Tosya-Ladik → Abant → Gerede → Gölcük → Mudurnu"}, {"t": "Erzincan → Tosya-Ladik → Niksar-Erbaa → Gerede → Mudurnu → Abant → Gölcük"}], "a": 2, "exp": "KAF dizisi: **1939 Erzincan → 1942 Niksar-Erbaa → 1943 Tosya-Ladik → 1944 Gerede → 1957 Abant → 1967 Mudurnu → 1999 Gölcük → 1999 Düzce**. Yaklaşık 60 yılda doğudan batıya ilerleyen bir domino dizisi. Bugün **kırılmamış bölüm Marmara Denizi** içindedir — İstanbul beklentisinin kaynağı budur."}, {"q": "USGS kayıtlarına göre aletsel dönemde kaydedilmiş en büyük deprem hangisidir?", "opts": [{"t": "1964 Güneydoğu Alaska, M 9,2"}, {"t": "2004 Kuzey Sumatra, M 9,1"}, {"t": "2011 Sendai (Japonya), M 9,1"}, {"t": "1952 Kamçatka, M 9,0"}, {"t": "1960 Şili, M 9,5"}], "a": 4, "exp": "Kaydedilmiş en büyük deprem **22.05.1960 Şili (M 9,5)**'dir; yitim zonu kaynaklıdır ve Pasifik boyunca tsunami üretmiştir. Sıra: Şili 9,5 → Alaska 1964 9,2 → Sumatra 2004 9,1 → Sendai 2011 9,1 → Kamçatka 1952 9,0. **USGS**: ABD Jeoloji Araştırmaları Kurumu.\n💡 Bu ölçekteki depremler ancak **Moment Magnitüdü** ile doğru ifade edilebilir."}, {"q": "Yerkürede kaydedilmiş en büyük beş depremle ilgili eşleştirmelerden hangisi yanlıştır?", "opts": [{"t": "1952 Kamçatka – listenin ilk beşini tamamlayan M 9,0 deprem"}, {"t": "1960 Şili – Pasifik boyunca tsunami üreten yitim zonu depremi"}, {"t": "2011 Sendai – tsunami ve ardından Fukushima nükleer santral kazası"}, {"t": "1964 Güneydoğu Alaska – Hint Okyanusu tsunamisi, on bir ülkede can kaybı"}, {"t": "1964 Güneydoğu Alaska – Kuzey Amerika'nın kaydedilmiş en büyük depremi"}], "a": 3, "exp": "Hint Okyanusu tsunamisine yol açıp **on bir ülkede** çok sayıda can kaybına neden olan deprem **26.12.2004 Kuzey Sumatra (M 9,1)**'dır. **1964 Alaska (M 9,2)** Kuzey Amerika'nın kaydedilmiş en büyük depremidir. Sendai 2011 ikincil afetin en bilinen güncel örneğidir."}, {"q": "Dünyanın en büyük depremlerinin ortak özelliği ve bunun Türkiye için çıkarımı hangisidir?", "opts": [{"t": "Hepsi yitim zonundadır; yitim zonu olmayan Türkiye'de üst sınır ~M 7,5–8"}, {"t": "Hepsi normal faylardadır; Ege'de M 9 ölçeğinde deprem beklenir"}, {"t": "Hepsi doğrultu atımlı faylardadır; Türkiye'de M 9 üzeri deprem beklenir"}, {"t": "Hepsi levha içi gömülü faylardadır; Türkiye'de üst sınır ~M 6'dır"}, {"t": "Hepsi bindirme kuşağındadır; Bitlis Bindirmesi M 9 üretebilir"}], "a": 0, "exp": "En büyük depremlerin tamamı **levha sınırlarında**, özellikle **okyanus altı yitim zonlarında**dır; çünkü yitim zonlarında yüzlerce km uzunluğunda ve yüz km'den derin bir düzlem birden kırılabilir. Türkiye'de yitim zonu olmadığı için **M 9 beklenmez**; üst sınır yaklaşık **M 7,5–8**'dir. Ama yıkımı magnitüd değil, **yapı stoku ve nüfus yoğunluğu** belirler (1999 M 7,4; 2023 Mw 7,7)."}, {"q": "Ders notlarındaki 2016 verilerine göre (102 ülkede 301 doğa kaynaklı afet) depremlerle ilgili hangisi doğrudur?", "opts": [{"t": "Olayların %9'u deprem kaynaklıdır ve can kayıplarının da %9'u depremdendir"}, {"t": "Olayların %69'u deprem kaynaklıyken can kayıplarının %72'si depremdendir"}, {"t": "Olayların %9'u deprem kaynaklıyken can kayıplarının %17'si depremdendir"}, {"t": "Olayların %17'si deprem kaynaklıyken can kayıplarının %9'u depremdendir"}, {"t": "Olayların %96'sı deprem kaynaklıdır ve can kayıplarının tamamı depremdendir"}], "a": 2, "exp": "2016'da 102 ülkede 301 doğa kaynaklı afette olayların yalnızca **%9'u deprem** kaynaklıyken **can kayıplarının %17'si** depremdendir. **Sıklık ile ölümcüllük ayrışır.**\n💡 Küçük sayı olay, büyük sayı ölüm: \"9 olur, 17 öldürür\"."}, {"q": "Türkiye'nin aletsel dönemdeki en büyük depremi hangisidir?", "opts": [{"t": "6 Şubat 2023 Pazarcık, Mw 7,7"}, {"t": "1976 Çaldıran, M 7,2"}, {"t": "1943 Tosya-Ladik, M 7,2"}, {"t": "17 Ağustos 1999 İzmit Körfezi, M 7,4"}, {"t": "26 Aralık 1939 Erzincan, M 7,9"}], "a": 4, "exp": "**26 Aralık 1939 Erzincan (M 7,9)** Türkiye'nin aletsel dönemdeki **en büyük** depremidir; yaklaşık **33.000** can kaybı, KAF üzerinde. **En çok can kaybı** ise **6 Şubat 2023** depremlerindedir.\n💡 Üç tarih: **1939 en büyük, 1999 en çok şey değiştiren, 2023 en ağır can kaybı**."}, {"q": "1999 Marmara ve Düzce depremleriyle ilgili hangisi doğrudur?", "opts": [{"t": "12 Kasım İzmit Körfezi M 7,2 ve 17 Ağustos Düzce M 7,4; toplam 53.537 can kaybı"}, {"t": "17 Ağustos İzmit Körfezi M 7,4 ve 12 Kasım Düzce M 7,2; toplam 18.373 can kaybı"}, {"t": "17 Ağustos İzmit Körfezi M 7,9 ve 12 Kasım Düzce M 7,4; toplam 33.000 can kaybı"}, {"t": "17 Ağustos İzmit Körfezi M 7,4 ve 9 Kasım Düzce M 6,8; toplam 644 can kaybı"}, {"t": "17 Ağustos İzmit Körfezi M 7,7 ve 12 Kasım Düzce M 7,6; toplam 107.213 can kaybı"}], "a": 1, "exp": "**17 Ağustos 1999 İzmit Körfezi (M 7,4)** ve **12 Kasım 1999 Düzce (M 7,2)** depremlerinde toplam **18.373** can kaybı. 33.000 Erzincan 1939'a, 53.537 ve 107.213 (yaralı) 2023'e, 644 Van 2011'e aittir."}, {"q": "2011 Van depremiyle ilgili hangisi doğrudur?", "opts": [{"t": "23 Ekim'de M 6,8; 12 Kasım Düzce depremiyle birlikte 644 can kaybı"}, {"t": "9 Kasım'da M 7,2; 23 Ekim Çaldıran depremiyle birlikte 18.373 can kaybı"}, {"t": "23 Ekim'de M 7,9; tek başına yaklaşık 33.000 can kaybı"}, {"t": "23 Ekim'de M 7,2; 9 Kasım Edremit depremiyle birlikte toplam 644 can kaybı"}, {"t": "6 Şubat'ta Mw 7,6; Elbistan depremiyle birlikte 11 ilde kayıp"}], "a": 3, "exp": "**23 Ekim 2011**'de Van merkezli **M 7,2** büyüklüğünde deprem oldu; **9 Kasım**'daki **Edremit** depremiyle birlikte toplam **644** can kaybına yol açtı. Çeldiricilerdeki sayılar başka depremlere aittir: 18.373 (1999 Marmara-Düzce), 33.000 (1939 Erzincan); Çaldıran ise 1976 depremidir."}, {"q": "Türkiye'de 1970–1992 arasında yaşanan büyük depremlerle büyüklükleri eşleştirildiğinde hangisi yanlıştır?", "opts": [{"t": "Erzincan (1992) – M 6,8"}, {"t": "Lice (1975) – M 7,9"}, {"t": "Erzurum (1983) – M 6,8"}, {"t": "Çaldıran (1976) – M 7,2"}, {"t": "Gediz (1970) – M 7,2"}], "a": 1, "exp": "Kaynaktaki liste: **Gediz 1970 M 7,2; Lice 1975 M 6,9; Çaldıran 1976 M 7,2; Erzurum 1983 M 6,8; Erzincan 1992 M 6,8**. M 7,9, 1939 Erzincan depremidir."}, {"q": "Aletsel dönem kavramı ve Türkiye'deki can kaybıyla ilgili hangisi doğrudur?", "opts": [{"t": "1939 Erzincan depreminden sonra başlayan dönemdir; bu dönemde 53.537 can kaybı vardır"}, {"t": "Paleosismolojik hendeklerin açıldığı son 40.000 yıldır; bu dönemde 500.000 can kaybı vardır"}, {"t": "1999'dan sonra başlayan dönemdir; öncesine tarihsel dönem denir ve kayıt yoktur"}, {"t": "Sismograflarla ölçümün başladığı ~1900'den bugüne olan dönemdir; bu dönemde 150.000'i aşkın can kaybı vardır"}, {"t": "Holosen'in başlangıcından bugüne olan dönemdir; bu dönemde 18.373 can kaybı vardır"}], "a": 3, "exp": "**Aletsel dönem**, depremlerin **sismograflarla** ölçülmeye başlandığı **yaklaşık 1900'den** bugüne uzanan dönemdir; öncesine **tarihsel dönem** denir (bilgiler yazılı kayıtlar, yapı hasarları ve paleosismolojiye dayanır). 1900'lerden bu yana yıkıcı depremlerde **150.000'i aşkın** vatandaş hayatını kaybetmiştir (kitaptaki ~100.000'e 2023'ün 53.537 kaybı eklenerek)."}, {"q": "1999 depremlerinin Türkiye'de afet yönetimi için bir dönüm noktası olmasıyla ilgili aşağıdakilerden hangileri doğrudur?\nI. Zorunlu deprem sigortası (DASK) getirildi ve yapı denetim sistemi kuruldu.\nII. Sağlık Bakanlığı 2004'te UMKE'yi (Ulusal Medikal Kurtarma Ekipleri) kurdu.\nIII. Türkiye Bina Deprem Yönetmeliği (TBDY-2018) bu depremin hemen ardından yürürlüğe girdi.", "opts": [{"t": "Yalnız I"}, {"t": "Yalnız III"}, {"t": "I ve II"}, {"t": "II ve III"}, {"t": "I, II ve III"}], "a": 2, "exp": "1999 sonrası afet yönetimi kurumsal olarak yeniden kuruldu: **DASK**, **yapı denetim sistemi**, arama kurtarma kapasitesi (AKUT, AFAD'ın öncülleri) ve **2004'te UMKE**. **TBDY-2018** ise 2018'de, 2007 yönetmeliğinin yerine gelmiştir; III yanlıştır.\n💡 Ek veri: doğa kaynaklı afetlerin Türkiye'ye maliyeti GSMH'nin yaklaşık **%4'ü** olarak tahmin edilmektedir."}, {"q": "6 Şubat 2023 depremleriyle ilgili saat–merkez–büyüklük–fay eşleştirmesi hangi seçenekte doğru verilmiştir?", "opts": [{"t": "04.17 Pazarcık Mw 7,7 (DAFZ Narlı segmenti); 13.24 Elbistan Mw 7,6 (Çardak fayı)"}, {"t": "04.17 Pazarcık Mw 7,6 (Çardak fayı); 13.24 Yayladağı Mw 7,7 (DAFZ)"}, {"t": "13.24 Pazarcık Mw 7,7 (DAFZ Narlı segmenti); 04.17 Elbistan Mw 7,6 (Çardak fayı)"}, {"t": "04.17 Elbistan Mw 7,7 (Çardak fayı); 13.24 Pazarcık Mw 7,6 (DAFZ Narlı segmenti)"}, {"t": "04.17 Pazarcık Mw 7,7 (KAF); 13.24 Elbistan Mw 7,6 (Bitlis Bindirmesi)"}], "a": 0, "exp": "**04.17 Pazarcık (Mw 7,7)**: DAFZ'ın **Narlı segmentinde** başladı; sol yanal doğrultu atımlı kırılma zincirleme yayıldı (yaklaşık **300 km**). **13.24 Elbistan (Mw 7,6)**: **Çardak fayı** üzerinde, ilkinden farklı bir fayda. İkisi arasında yaklaşık **dokuz saat** vardır."}, {"q": "6 Şubat 2023'teki Elbistan depreminin teknik olarak 'artçı' sayılmamasının gerekçeleri hangi seçenekte doğru verilmiştir?", "opts": [{"t": "İlkinden daha büyüktü ve tsunami üretti"}, {"t": "Aynı fay üzerinde oldu ancak dokuz saat sonra gerçekleşti"}, {"t": "Farklı ilde oldu ve gece değil gündüz gerçekleşti"}, {"t": "İlkinden yaklaşık bir derece küçüktü ve aynı segmentte oldu"}, {"t": "Farklı fay üzerinde oldu ve büyüklüğü ilkine neredeyse eşitti"}], "a": 4, "exp": "**Artçı**, ana şokla **aynı fay sisteminde** ve ondan **belirgin şekilde küçük** (genellikle ~1 derece; 7,7'nin artçısı ~6,7) olur. Elbistan depremi **farklı fay** (Çardak) üzerinde ve **neredeyse eşit büyüklükte** (7,6) olduğu için, ilkinin gerilme alanını değiştirmesiyle **tetiklenmiş ayrı bir ana şok**tur. Yalnızca \"büyüklüğü aynıydı\" demek yarım cevaptır.\n💡 Pratik önem: ikinci deprem \"artçı\" sanılınca ekipler hazırlıksız yakalandı; kurtarma sürerken yeni yıkım geldi."}, {"q": "Kaynakta 'tetiklenmiş deprem' kavramı nasıl açıklanmaktadır?", "opts": [{"t": "Ana şokla aynı segmentte, ondan bir derece küçük olarak gelen depremdir"}, {"t": "Bir deprem, yakındaki fayların gerilmesini değiştirip kırılmaya yakın birini kırabilir"}, {"t": "Ana şoktan önce gelen ve büyük depremi haber veren küçük depremdir"}, {"t": "Deniz altı heyelanının deniz suyunu yer değiştirmesiyle oluşan depremdir"}, {"t": "İnsan faaliyetleri (maden, baraj) sonucu oluşan yapay depremdir"}], "a": 1, "exp": "Bir deprem çevresindeki fayların **gerilme dağılımını** değiştirir; bazılarının yükünü artırır, bazılarınınkini azaltır. Yükü artan fay zaten kırılmaya yakınsa **tetiklenebilir**. Elbistan (13.24) ve **20 Şubat Hatay Yayladağı (Mw 6,4)** depremleri bu mekanizmayla açıklanır. Seçeneklerde artçı ve öncü tanımları çeldiricidir."}, {"q": "AFAD raporuna göre 6 Şubat 2023 depremlerinin bilançosu hangisidir?", "opts": [{"t": "11 il etkilendi; 150.000 can kaybı, 300.000 yaralı"}, {"t": "11 il etkilendi; 107.213 can kaybı, 53.537 yaralı"}, {"t": "10 il etkilendi; 18.373 can kaybı, 53.537 yaralı"}, {"t": "7 il etkilendi; 33.000 can kaybı, 150.000 yaralı"}, {"t": "11 il etkilendi; 53.537 can kaybı, 107.213 yaralı"}], "a": 4, "exp": "Resmî verilere göre **11 il** etkilendi; **53.537 can kaybı, 107.213 yaralı**. Türkiye'nin aletsel dönemdeki **en ağır afeti**dir. Kaynak: AFAD'ın 140 sayfalık 06 Şubat 2023 Pazarcık-Elbistan Depremleri Raporu (birincil kaynak). Ayrıca iki hafta sonra **20 Şubat**'ta **Hatay Yayladağı Mw 6,4** tetiklenmiş deprem oldu."}, {"q": "6 Şubat 2023 depremlerinin ağır sonuçları Risk = Tehlike × Maruziyet × Kırılganlık çerçevesinde değerlendirildiğinde, aşağıdakilerden hangisi 'kırılganlık' başlığına girer?", "opts": [{"t": "Yapı stokunun önemli bölümünün eski yönetmeliklere göre yapılmış olması"}, {"t": "Dokuz saat arayla iki adet Mw 7,6+ deprem olması"}, {"t": "Çok sayıda ilin aynı anda aynı desteğe ihtiyaç duyması"}, {"t": "Yaklaşık 300 km'lik yüzey kırığı ve çok sayıda büyük artçı"}, {"t": "11 ili ve yoğun nüfuslu şehir merkezlerini kapsayan geniş etki alanı"}], "a": 0, "exp": "**Kırılganlık**: insan, yapı ve altyapının zarar görmeye ne kadar açık olduğu — eski yönetmelikle yapılmış yapı stoku, zemin sorunları, denetim eksikleri ve yapısal olmayan riskler. İki büyük deprem ve 300 km kırılma **tehlike**; 11 il ve yoğun nüfus **maruziyet**tir. Tehlikeyi değiştiremeyiz; maruziyeti (nereye yerleşiyoruz) ve kırılganlığı (nasıl inşa ediyoruz) değiştirebiliriz."}, {"q": "6 Şubat 2023'te 'zaman ve mevsim' etkeni sağlık sonuçlarını nasıl ağırlaştırmıştır?", "opts": [{"t": "Kış mevsimi sıvılaşmayı önlediği için kayıplar azaldı"}, {"t": "Deprem öğle saatinde olduğu için iş yerlerinde kalabalık vardı; yaz sıcağı dehidratasyona yol açtı"}, {"t": "Gece 04.17'de insanlar uykudaydı; kış koşulları enkaz altında hipotermiyi ve barınma ihtiyacını ağırlaştırdı"}, {"t": "Deprem bayram tatiline denk geldiği için ekipler bölgede değildi"}, {"t": "Gece deprem olduğu için insanlar dışarıdaydı ve kütle hareketlerinden etkilendi"}], "a": 2, "exp": "İlk deprem **04.17**'de, insanlar **uykudayken** oldu: tepki süresi uzar, enkaz altında kalma oranı artar, ekipler karanlıkta ve soğukta çalışır. **Kış** koşulları **hipotermiyi** ve **barınma** ihtiyacını ağırlaştırdı; hipotermi crush sendromuyla birlikte seyrettiğinde tablo çok ağırlaşır."}, {"q": "1996 tarihli eski Deprem Bölgeleri Haritası ile ilgili hangisi doğrudur?", "opts": [{"t": "Türkiye'yi üç bölgeye ayırır; 1. derece b
